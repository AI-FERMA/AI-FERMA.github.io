name: Deploy questionnaire to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'questionnaire/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload questionnaire artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'questionnaire'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
