<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — опросник боли</title>
<meta name="description" content="Эта страница не существует. Вернитесь к опроснику боли или посмотрите, что обычно автоматизируют.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0a0c14">
<link rel="icon" type="image/svg+xml" href="/Ferma/favicon.svg">
<link rel="icon" type="image/x-icon" href="/Ferma/favicon.ico">
<link rel="apple-touch-icon" href="/Ferma/apple-touch-icon.png">
<style>
  :root{
    --bg:#0a0c14; --text:#e8eef7; --muted:#94a3b8;
    --accent:#38bdf8; --border:rgba(30,41,59,0.6); --radius:14px;
    --shadow:0 10px 30px -10px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  .card{
    max-width:520px; width:100%; text-align:center;
    background:rgba(18,25,42,0.75); border:1px solid var(--border);
    border-radius:var(--radius); padding:36px 28px; box-shadow:var(--shadow);
  }
  .code{font-size:3rem; font-weight:900; color:var(--accent); letter-spacing:-0.02em; line-height:1}
  h1{font-size:1.2rem; font-weight:700; margin:12px 0 8px}
  p{color:var(--muted); font-size:0.92rem; margin-bottom:20px}
  .links{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:10px;
    font-size:0.95rem; font-weight:700; background:var(--accent); color:#01151c;
    box-shadow:0 0 16px rgba(56,191,248,0.35); transition:all .2s;
  }
  .btn:hover{background:#7dd3fc; text-decoration:none}
  .btn-ghost{background:transparent; border:1px solid var(--border); color:var(--text); box-shadow:none}
  .btn-ghost:hover{border-color:#334155; background:transparent}
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела. Вернитесь к опроснику или посмотрите, что обычно автоматизируют.</p>
    <div class="links">
      <a class="btn" href="/Ferma/">Пройти опросник боли →</a>
      <a class="btn btn-ghost" href="/Ferma/guide.html">Что обычно автоматизируют</a>
    </div>
  </div>
</body>
</html>
