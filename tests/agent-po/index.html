ge`; `startsRequestSeries` даёт новый `request/header`; неудачный шаг записывает отсутствующие результаты инструментов; `agent.ctx` скоупит регистрации на одного агента."},{"h":"Лог как источник истины","t":"`assistant/message` содержит компактный таймированный стрим; `assistant/attempt` фиксирует неудачные/отменённые попытки без добавления в историю модели. Плагины, меняющие содержимое сообщений, регистрируют чистые проекции (`dsh-session-projection`: `stateOf()`, `snapshot()`). Fork: `ctx.agents.create({ sessionId, seed, meta: { parentSession, seedLength } })`. Хранение: `stat`/`list` сканируют каталог и выбирают высшее поколение; запись публикует новый `session.vN.jsonl` рядом с неизменным исходником; пути поколений не переименовываются и не удаляются. Для TPO: лог = бесплатная трасса, eval-материал и аудит; его же по умолчанию выгружает `session-log-deepseek` в DeepSeek (до 8 MiB на запрос) — в банке выключать."},{"h":"Конвейер инструментов и политика","t":"Порядок: pre-execute (allow/deny/cancel/ask) → monotonic guards (только deny, позже не отменить) → execute (around, может заменить только signal) → projectContent → post-execute (accept | block с корректирующим feedback) → finalizeContent → `tools/result` (observe). Аргументы переписывать нельзя. Ошибки: INVALID_ARGS, INVALID_TOOL_OUTPUT, UNKNOWN_TOOL (в PTC — и прямой вызов нативного), ABORTED(_BEFORE_DISPATCH); бросивший инструмент — структурированная ошибка, turn не завершается. Тайм-аут — плагин `dsh-tool-call-timeout-policy` вокруг execute, модели не виден. Агентный scope видит только свои вызовы. Это и есть место для банковских политик: deny по allow-list, ask на запись, пост-проверка результата на PII."},{"h":"Контекст, навыки, оркестрация","t":"Компакция: `compactIfNeeded(agent, 'pressure' | 'context-overflow')`, ручная `/compact` (`compactNow`), `compactRegion`; пороги — в `dsh-compaction-basic`; каждое замещение предваряет `compaction/prune` (shadow price). Skills — инструкции по требованию, не события; `disable-model-invocation` / `user-invocable` во frontmatter; каталог ≤ 500 символов описания; chokidar следит за каталогами. Workflows — модельный скрипт оркестрации (`dsh-workflow-ptc` в том же PTC-процессе под файловой политикой сессии; `tool-ralph` — экспериментальный цикл). Субагенты — «контекстные брандмауэры»: spawn с собственным `agentPreset`, fork наследует; внешние — одна активация без follow-up; `listChildren` читает каталог без загрузки агентов; события `subagent/start|end`. Plan mode — секция `plan:policy` (order 50) в промпте и `plan/mode` в логе; ограничения — sandbox и approvals, не план."}],"practice":{"mechanic":"ranking","points":3,"stem":"Расставьте события одного шага dsh в порядке исполнения.","options":[{"id":"r0","text":"agent/pre-step — решение reject или enter(messages)","why":"Открывает шаг; pressure-компакция живёт здесь."},{"id":"r1","text":"step/start → agent/request + prepareCall — выбран маршрут","why":"Фиксируются system/user message и request/header."},{"id":"r2","text":"llm/stream → agent/assistant-stream (start · chunks · end)","why":"Стрим от адаптера к UI."},{"id":"r3","text":"assistant/message зафиксирован (или assistant/attempt)","why":"История модели — только из лога."},{"id":"r4","text":"tool/call → tools/pre-execute → guards → tools/execute → tools/post-execute → tool/result","why":"Конвейер инструмента с политикой."},{"id":"r5","text":"step/end → (новый шаг или) agent/turn-stopping → turn/end","why":"Turn закрывается, когда ничего не должно."}],"solution":"Pre-step → request → stream → commit → tools → end; при незакрытых инструментах — ещё шаг.","anchor":{"g":"turnflow","p":{},"cap":"turn = шаги; шаг = запрос + инструменты"},"id":"u7-3-p"},"test":[{"mechanic":"single","points":2,"stem":"Что означает правило «model-visible means logged» в dsh?","options":[{"id":"o0","text":"Каждый запрос к модели восстановим из append-only лога; новый вид входа — новое событие сессии","correct":true,"rationale":"Лог — источник истины для resume, fork, replay, eval."},{"id":"o1","text":"Все ответы модели показываются пользователю в Web UI без фильтрации, чтобы ничего не скрывалось","correct":false,"rationale":"Речь о логе, а не о показе."},{"id":"o2","text":"Модель получает доступ к логу сессии как к инструменту и может читать прошлые события","correct":false,"rationale":"Модель видит историю, выведенную из лога, а не лог как инструмент."},{"id":"o3","text":"Лог хранит только видимые модели сообщения, а служебные события не записываются","correct":false,"rationale":"Служебные события (approval/*, plan/mode) — в логе, но не в транскрипте."}],"anchor":{"g":"pipeline","p":{"steps":["событие в лог","deriveMessages()","запрос к модели","assistant/message в лог"],"hl":[0,1]},"cap":"история модели выводится из лога"},"id":"u7-3-t0"},{"mechanic":"single","points":2,"stem":"Guard (`ctx.tools.guard`) вернул причину отказа. Может ли более поздний слушатель разрешить вызов?","options":[{"id":"o0","text":"Нет: у guards нет результата allow, отказ монотонен и не отменяется","correct":true,"rationale":"Guards — после всех pre-execute, до тела."},{"id":"o1","text":"Да, если слушатель зарегистрирован с prepend: true и возвращает allow","correct":false,"rationale":"prepend действует в waterfall pre-execute, не на guards."},{"id":"o2","text":"Да, если инструмент помечен isConcurrencySafe и вызван в PTC-режиме","correct":false,"rationale":"Параллельность не влияет на политику."},{"id":"o3","text":"Да, по решению пользователя через approval allowed-once после отказа guard","correct":false,"rationale":"Approval — для ask из pre-execute, не для guard-отказа."}],"anchor":{"g":"pipeline","p":{"steps":["pre-execute","guards (deny only)","execute","post-execute","result"],"hl":[1]},"cap":"отказ guard монотонен"},"id":"u7-3-t1"},{"mechanic":"single","points":2,"stem":"Headless-прогон в CI без человека. Какую политику approvals выбрать и почему?","options":[{"id":"o0","text":"never: детерминированный reject до диспетчеризации; ask без ответчика — тоже отказ, но недетерминированно","correct":true,"rationale":"never — строгая позиция для unattended."},{"id":"o1","text":"ask с автоответчиком allowed-once на все запросы, чтобы задачи не падали из-за отсутствия человека в ночных прогонах","correct":false,"rationale":"Это снятие контроля; записи пройдут без проверки."},{"id":"o2","text":"danger-full-access: в CI песочница не нужна, окружение одноразовое, а approvals только замедляют конвейер","correct":false,"rationale":"Это пресет песочницы, не политика approvals; и одноразовость не отменяет контроль."},{"id":"o3","text":"ask с таймаутом 5 минут: если никто не ответил — считать одобренным, чтобы не блокировать очередь сборок","correct":false,"rationale":"Молчание ≠ одобрение; dsh fail-closed."}],"anchor":{"g":"tree","p":{"root":"approval policy","kids":["ask → answerer | unavailable","never → rejected до dispatch","исход: allowed-once | rejected | cancelled | unavailable"]},"cap":"fail-closed по умолчанию"},"id":"u7-3-t2"},{"mechanic":"single","points":2,"stem":"Компакция сработала по триггеру pressure. Что гарантируется относительно границ замещаемого диапазона?","options":[{"id":"o0","text":"Сохраняется парность tool-call/result, но не целостность turn: ранние закрытые шаги могут быть сжаты","correct":true,"rationale":"toolPairingBalancedBefore/After на краях."},{"id":"o1","text":"Сжимаются только целые turn целиком, чтобы модель не потеряла контекст текущей задачи и незавершённых инструментов","correct":false,"rationale":"Границы — по парам инструментов, не по turn."},{"id":"o2","text":"Сжимается всё до последнего user/message, включая системный промпт, который затем восстанавливается из конфигурации","correct":false,"rationale":"Системный промпт — отдельные узлы, не часть summary."},{"id":"o3","text":"Ничего не гарантируется: компакция — эвристика без инвариантов","correct":false,"rationale":"Инварианты есть: пары, события start/summary/end, lock."}],"anchor":{"g":"timeline","p":{"items":["compaction/start","prune (shadow price)","summary через llm","user/message replace","compaction/end"],"hl":2},"cap":"pruning → summary → replace"},"id":"u7-3-t3"},{"mechanic":"visual","points":3,"stem":"Четыре конвейера инструмента. Какой соответствует dsh?","vopts":[{"id":"v0","v":{"g":"pipe","p":{"steps":["pre-execute","guards","execute","post-execute","result"],"hl":[0,1,3]}},"lbl":"","correct":true,"rationale":"Политика до, монотонные guards, around-execute, пост-проверка, наблюдение."},{"id":"v1","v":{"g":"pipe","p":{"steps":["execute","result"],"hl":[0]}},"lbl":"","correct":false,"rationale":"Без точек политики — негде поставить deny/ask."},{"id":"v2","v":{"g":"pipe","p":{"steps":["guards","pre-execute","execute","result"],"hl":[0]}},"lbl":"","correct":false,"rationale":"Guards идут после всех pre-execute, не до."},{"id":"v3","v":{"g":"pipe","p":{"steps":["pre-execute","execute","guards","result"],"hl":[2]}},"lbl":"","correct":false,"rationale":"Guard после исполнения бессмыслен — действие уже совершено."}],"id":"u7-3-t4"}],"framework":"Turn = шаги; шаг = pre-step → request → stream → commit → tools → end. Лог append-only — источник истины (resume/fork/replay/eval), по умолчанию выгружается в DeepSeek. Инструменты: pre-execute (allow/deny/cancel/ask) → guards (deny only) → execute → post-execute → result; approvals ask/never, fail-closed. Компакция: pressure/overflow, pruning → summary, пары сохраняются. PTC — программа против SDK. Skills по рангам каталогов. Workflows и субагенты (spawn/fork/внешние). Plan mode — soft guidance.","anchor":{"g":"turnflow","p":{},"cap":"один шаг dsh с точками политики"},"layers":{"simple":"Один ход агента в dsh — как один проход через пропускной пункт. Сначала решают, пускать ли вообще (pre-step). Потом собирают запрос и получают ответ модели — потоком, чтобы было видно сразу. Если модель попросила инструмент, вызов идёт через турникеты: «можно?» (pre-execute: да/нет/отмена/спросить человека), охранники, которые умеют только запрещать (guards), исполнение, проверка результата (post-execute) — и запись в журнал.\nЖурнал — главное: в нём всё, что модель когда-либо видела, поэтому сессию можно продолжить, раздвоить, переиграть и выучить на ней. Он же по умолчанию уезжает в DeepSeek — в банке это выключают.\nКогда журнал распухает, его ужимают: сначала обрезают длинные распечатки, потом пишут краткое содержание, не разрывая пары «вызов — результат». Навыки подгружаются по имени, субагенты — как отдельные сотрудники с собственным столом, а план — лишь мягкая подсказка, запреты делают песочница и подтверждения.\nПроверь себя: может ли поздний слушатель отменить отказ guard?","how":"1. Шаг: `turn/start` → claim → сборка промпта/схем → `agent/pre-step` (reject | enter) → `step/start` → `agent/request` + prepareCall → `system/user message`, `request/header` → `deriveMessages()` → `llm/stream` → `agent/assistant-stream` → `assistant/message` | `assistant/attempt` → инструменты → `step/end` → … → `agent/turn-stopping` → `turn/end`.\n2. Лог: append-only, `session.vN.jsonl[.zstd]`, миграции vN→vN+1, проекции `stateOf()/snapshot()`, fork через `ctx.agents.create({ sessionId, seed })`. `session-log-deepseek.enabled: false` — выключить выгрузку.\n3. Инструменты: `defineTool({ name, description, parameters, output, execute, timeoutMs, isConcurrencySafe })`; `ctx.tools.restrict({ allow, deny })`; pre-execute → guards → execute → post-execute → result; `ask` → `allowed-once`; ошибки INVALID_ARGS / UNKNOWN_TOOL / ABORTED.\n4. Approvals: `ask` | `never`; `approval/asked`, `approval/decided` только в лог; `permission/preset`: workspace-write / danger-full-access связывает sandbox-mode и approval-policy.\n5. Контекст: компакция pressure/overflow, pruning head/middle/tail, summary как `user/message` с `surfaceOp: replace`, `compaction/start|summary|end`, пары сохраняются. PTC: `run_code`, биндинг `tools`, враждебные пиры, `stateOwner` не долговечен.\n6. Skills (ранги 100–600, `<available_skills>`, `skill({name})`), workflows (`agent()`, `parallel()`, `pipeline()`, `dispose()` обязателен), субагенты (spawn/fork/внешние, `send_message`, `interrupt`, `maxDepth`, stopReason), plan mode (`/plan`, `exit_plan_mode`, `plan/mode`).\n7. Пример банковской политики: pre-execute слушатель на `ctx.tools` возвращает `ask` для любых инструментов с `writes`, guard запрещает `bash` с `curl` на внешние хосты, post-execute блокирует результат с номером карты и возвращает корректирующий feedback.","formula":{"f":"step = pre-step → request → stream → commit → Σ tools → end ; turn = step*\ntool = pre-execute{allow|deny|cancel|ask} → guards{deny} → execute → post-execute{accept|block} → result","legend":[["pre-step","waterfall: reject | enter; здесь pressure-компакция","agent/pre-step"],["ask","исполняется только при allowed-once","ApprovalOutcome"],["guard","монотонный отказ без allow","ctx.tools.guard(fn)"],["post-execute","accept content/value или block с feedback","PII-проверка результата"],["never","политика для CI: reject до dispatch","headless"]],"note":"Лог — источник истины: что не записано, того модель не видела; что записано — можно переиграть и выучить."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Шаг = pre-step → request → stream → commit → tools → end; turn = шаги.\n— Лог append-only — источник истины; выгрузка в DeepSeek по умолчанию включена — выключать.\n— Инструменты: pre-execute (allow/deny/cancel/ask) → guards (deny only) → execute → post-execute → result.\n— Approvals fail-closed: ask | never; исход allowed-once единственное разрешение.\n— Компакция, skills, workflows, субагенты, plan mode — плагины вокруг цикла; ограничения делают sandbox и approvals.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Может ли поздний слушатель отменить отказ guard?","o":["Да, с prepend: true слушатель встанет первым и разрешит","Нет: у guards нет allow, отказ монотонен","Да, через approval allowed-once по решению пользователя"],"a":1,"w":"Guards идут после pre-execute и только запрещают."},{"q":"Какая политика approvals для headless CI?","o":["ask с автоответчиком allowed-once на все запросы","never — детерминированный reject до dispatch","danger-full-access, потому что окружение одноразовое"],"a":1,"w":"Строгая позиция для unattended; ask без ответчика — тоже отказ, но недетерминированно."},{"q":"В формуле шага где живёт pressure-компакция?","o":["После исполнения инструментов, перед step/end","На agent/pre-step, до вывода запроса","Внутри llm/stream по мере роста ответа"],"a":1,"w":"Компакция по давлению — до сборки запроса."},{"q":"Что сохраняет компакция на границах диапазона?","o":["Целые turn","Пары tool-call/result","Системный промпт внутри summary"],"a":1,"w":"Границы балансируют пары инструментов, а не turn."}],"rules":["Шаг = pre-step → request → stream → commit → tools → end; turn = шаги.","Лог append-only — источник истины; выгрузка в DeepSeek по умолчанию включена — выключать.","Инструменты: pre-execute (allow/deny/cancel/ask) → guards (deny only) → execute → post-execute → result.","Approvals fail-closed: ask | never; исход allowed-once единственное разрешение.","Компакция, skills, workflows, субагенты, plan mode — плагины вокруг цикла; ограничения делают sandbox и approvals."]}},{"id":"u7-4","level":"L7","title":"dsh в банке: внедрение, безопасность, развитие","lead":"Контур данных и выгрузка логов, песочница и пресеты прав, модель через шлюз, план пилота, стратегия развития и вклад","concept":"DeepSeek Harness — developer preview: нет аудита безопасности, SAFETY.md прямо говорит «must not be treated as secure or production-ready», ломающие изменения регулярны (v0.2.1 убрала runtime invariant plugins; Code → PTC переименование со сменой session API и удалением SQLite-опции), внешние PR не принимаются. Для банка это означает: dsh — платформа для внутренних агентов разработки и эксплуатации в изолированном контуре, а не клиентский агент; внедрение — через форк/пиннинг версии, собственный бандл политик и плагины. Контур данных: по умолчанию `session-log-deepseek` выгружает события лога в DeepSeek вместе с запросами (до 8 MiB) — выключить `session-log-deepseek.enabled: false`; web search использует DeepSeek API — заменить провайдер `ctx.web` или выключить; телеметрия — feedback-only в web, в Desktop проверить тумблер; MCP-серверы выключены по умолчанию, потому что исполняются вне песочницы агента; модель — через собственный адаптер `ctx.llm` на внутренний OpenAI-совместимый шлюз (on-prem модель), ключ из env через `!!js process.env`, `DEEPSEEK_BASE_URL` для DeepSeek-совместимых. Песочница: режимы read-only / workspace-write / danger-full-access управляют только файловыми эффектами — сеть и видимость процессов не ограничены; backend bwrap (Linux, сильнее) / Landlock (частичный на старых ABI) / Seatbelt (macOS) / Windows ACL (partial: hard-link, unconfined-read); `enforcement: full | partial` — для абсолютной границы partial отвергать; `SANDBOX_UNAVAILABLE` fail-closed. Пресеты прав `workspace-write` и `danger-full-access` связывают sandbox-mode и approval-policy одним событием `permission/preset`. Web-профиль отвергает `--host 0.0.0.0`; публикация — `--public-url` и `--trusted-host` за reverse-proxy с аутентификацией. SDK: Python `deepseek-harness-sdk` поднимает `dsh --profile sdk-minimal` (пинит danger-full-access — запускать в одноразовом контейнере), `session_id` продолжает сессию, патчи per-launch. Headless `dsh --profile headless \"задача\"` с `approval never` — для CI. Развитие: платформа harness для банка = форк + бандл `bank-base` (адаптер шлюза, политики инструментов, PII-пост-проверка, OTel-телеметрия `session-telemetry-otel`, выключенная выгрузка) + пресеты по командам + eval на логах сессий; вклад в экосистему — плагины с топиком `dsh-plugin`; следить за экспериментальными seams (agentTeams, browserUse, computerUse, worktrees, speech).","points":[{"h":"Контур данных: что уходит наружу по умолчанию","t":"Три утечки по умолчанию: (1) лог сессии в DeepSeek при использовании официального API и даже через настроенные шлюзы — `session-log-deepseek.enabled: false`; (2) web search через DeepSeek API — заменить провайдер `ctx.web` (exa/perplexity/own) или выключить `tool-web`; (3) телеметрия — проверить и выключить. Плюс внешние провайдеры моделей, MCP и плагины живут по своим политикам. Для ИБ: модель угроз dsh = модельный код в shell, сторонние плагины, доступ к сети/процессам/учёткам/файлам; рекомендации SAFETY.md — минимальные привилегии, одноразовая VM/контейнер, бэкапы, ревью плагинов и команд."},{"h":"Песочница и права — что реально ограничено","t":"Режимы ограничивают файловые эффекты: read-only (писать нельзя, POSIX даёт /dev/null), workspace-write (запись в корень рабочего пространства и temp), danger-full-access (без confinement, `ctx.sandbox` не вызывается). Сеть и процессы режимами не управляются — для банка нужен внешний периметр (сетевые политики контейнера, egress-прокси). Enforcement partial — честный сигнал, что backend покрывает не всё; отказ runner'а — инфраструктурная ошибка, не задача. Политика на вызов: `mode`, `workspaceRoot` (cwd сессии), `sessionId`; precedence: явно одобренный mode > последнее `sandbox/mode` сессии > deployment default. Approvals: `ask` по умолчанию, `never` для CI; `allowed-once` покрывает только спрошенное действие; аргументы не переписываются."},{"h":"Архитектура внедрения в банке","t":"Контейнер/VM в закрытом сегменте → dsh (форк, пиннутая версия) с бандлом `bank-base` → `ctx.llm` адаптер → внутренний шлюз инференса (on-prem модель; для DeepSeek-совместимых — `DEEPSEEK_BASE_URL`) → `ctx.web` провайдер на внутренний поиск → `ctx.fs/subprocess` локально или `-ssh` в удалённую песочницу → `session-telemetry-otel` в SIEM/наблюдаемость → лог сессий в своём хранилище как eval-материал. Интерфейсы: Web за reverse-proxy с SSO (`--public-url`, `--trusted-host`), headless в CI, SDK для автоматизаций, ACP для IDE. Политики как плагины: pre-execute `ask` на запись, guards на сеть/секреты, post-execute на PII, skills из `.dsh/skills` репозитория, AGENTS.md в каждом репо."},{"h":"План пилота и стратегия развития","t":"Пилот 8–10 недель: неделя 1–2 — форк, пиннинг, `bank-base` (выгрузка off, адаптер шлюза, телеметрия), модель угроз для ИБ; 3–4 — политики инструментов и песочница в контейнере, headless в CI на одном репозитории; 5–6 — Web для 10–20 разработчиков, skills и AGENTS.md, eval на логах (task success задачи, вмешательства, откаты, стоимость); 7–8 — отчёт, решение о расширении. Метрики harness: доля задач, закрытых без вмешательства; время/стоимость задачи; доля откатов; инциденты политики (deny/ask). Развитие: следить за релизами (ломающие), держать патчи минимальными (HN-критика: замена core-плагинов всё равно требует downstream-патчей), публиковать плагины (`dsh-plugin`), оценивать экспериментальное (agentTeams, worktrees, browserUse) через spike, иметь план Б — Codex/OpenCode, если preview не стабилизируется."}],"practice":{"mechanic":"sjt_bw","points":3,"stem":"ИБ спрашивает: «Можно ли запускать dsh на машинах разработчиков с доступом к внутренним репозиториям?» Лучшее и худшее действие TPO?","options":[{"id":"s0","text":"Да, в контейнере с пиннутой версией и bank-base: выгрузка off, модель через шлюз, workspace-write + ask, MCP off","correct":true,"rationale":"Контур закрыт на уровне конфигурации и периметра."},{"id":"s1","text":"Да, как есть: dsh открытый и MIT, значит, прозрачный и безопасный, а песочница ограничивает файлы, сеть и процессы по умолчанию","correct":false,"rationale":"Выгрузка логов и web search включены по умолчанию; песочница не ограничивает сеть."},{"id":"s2","text":"Нет, запретить до выхода стабильной версии с независимым аудитом безопасности и коммерческой поддержкой вендора","correct":false,"rationale":"Пилот в изолированном контуре возможен; полный запрет теряет время."},{"id":"s3","text":"Да, но только в Desktop-приложении: оно подписано, обновляется централизованно и поэтому безопаснее Web и CLI","correct":false,"rationale":"Подпись не меняет контур данных; Desktop даже включает телеметрию по умолчанию."}],"worst":"s1","worstRationale":"Запуск «как есть» — утечка логов сессий с кодом банка в DeepSeek по умолчанию.","anchor":{"g":"guard","p":{"in":true,"out":true,"tools":true,"note":"session-log-deepseek.enabled: false · web off · MCP off"},"cap":"три утечки по умолчанию закрыты конфигурацией"},"id":"u7-4-p"},"test":[{"mechanic":"single","points":2,"stem":"Что уходит из dsh наружу при настройках по умолчанию с официальным DeepSeek API?","options":[{"id":"o0","text":"События лога сессии вместе с запросами к модели (до 8 MiB) и запросы web search","correct":true,"rationale":"Выключается session-log-deepseek.enabled: false и заменой провайдера web."},{"id":"o1","text":"Ничего: dsh работает локально, а наружу идёт только текст запроса к модели","correct":false,"rationale":"Лог сессии уходит по умолчанию — это задокументировано."},{"id":"o2","text":"Только анонимная телеметрия использования без содержимого сессий","correct":false,"rationale":"Телеметрия — отдельно; лог содержит содержимое."},{"id":"o3","text":"Все файлы рабочего пространства индексируются и загружаются для улучшения модели","correct":false,"rationale":"Файлы не загружаются; уходят события лога и web-запросы."}],"anchor":{"g":"cost","p":{"lines":[["session-log-deepseek","по умолчанию ON → off"],["web-search-deepseek","заменить/выключить"],["telemetry","проверить тумблер"]],"total":"контур закрыт"},"cap":"три утечки по умолчанию"},"id":"u7-4-t0"},{"mechanic":"single","points":2,"stem":"Что ограничивает режим workspace-write в dsh?","options":[{"id":"o0","text":"Только файловые эффекты: запись в корень рабочего пространства и temp; сеть и процессы — нет","correct":true,"rationale":"Сетевой периметр — задача контейнера."},{"id":"o1","text":"Файлы, сеть и процессы: агент не может выйти за пределы рабочего пространства ни по одному каналу","correct":false,"rationale":"Режимы не управляют сетью и видимостью процессов."},{"id":"o2","text":"Только чтение: любая запись требует approval allowed-once","correct":false,"rationale":"Это ближе к read-only + ask; workspace-write разрешает запись в корень."},{"id":"o3","text":"Ничего, пока не включён backend bwrap; на macOS и Windows режим декоративный","correct":false,"rationale":"Seatbelt и ACL работают, хотя Windows — partial."}],"anchor":{"g":"stack","p":{"v":[1,1,1,1,1],"max":5},"cap":"режимы — про файлы"},"id":"u7-4-t1"},{"mechanic":"single","points":2,"stem":"Как подключить on-prem модель банка к dsh?","options":[{"id":"o0","text":"Плагин-адаптер на ctx.llm к внутреннему OpenAI-совместимому шлюзу; ключ из env; provider/model в патче профиля","correct":true,"rationale":"Seam ctx.llm — для этого."},{"id":"o1","text":"Через MCP-сервер, который проксирует запросы к модели как инструмент и возвращает ответ модели в виде результата вызова","correct":false,"rationale":"MCP — инструменты, не адаптер модели; и MCP вне песочницы."},{"id":"o2","text":"Через subagent-провайдер dsh-sdk с указанием URL модели в аргументах активации и отдельным профилем для шлюза","correct":false,"rationale":"Субагенты — делегирование, не маршрут модели."},{"id":"o3","text":"Нельзя: dsh поддерживает только DeepSeek, OpenAI и Anthropic, а для других провайдеров требуется форк адаптера","correct":false,"rationale":"Любые OpenAI-совместимые шлюзы и Ollama через адаптеры."}],"anchor":{"g":"pipeline","p":{"steps":["ctx.llm","llm-bankgw (adapter)","внутренний шлюз","on-prem модель"],"hl":[1]},"cap":"адаптер — плагин на seam"},"id":"u7-4-t2"},{"mechanic":"single","points":2,"stem":"Почему для банка dsh — платформа внутренних агентов, а не клиентского ассистента?","options":[{"id":"o0","text":"Developer preview без аудита и с ломающими изменениями не пройдёт допуски клиентского контура","correct":true,"rationale":"Внутренние агенты в изолированном контуре — реалистичный пилот."},{"id":"o1","text":"Потому что dsh умеет только работать с кодом в репозитории и не поддерживает диалог с людьми в каналах банка","correct":false,"rationale":"Умеет диалог; дело в зрелости и допусках."},{"id":"o2","text":"Потому что лицензия MIT запрещает коммерческое использование с клиентами без отдельного договора с DeepSeek","correct":false,"rationale":"MIT разрешает; ограничение — зрелость."},{"id":"o3","text":"Потому что dsh требует GPU на каждой машине разработчика, а клиентские устройства их не имеют","correct":false,"rationale":"Модель — через шлюз; GPU не на клиенте."}],"anchor":{"g":"compare","p":{"a":["внутренние агенты","контур, пилот, форк"],"b":["клиентский агент","допуски ИБ/ПДн, стабильность"],"verdict":"dsh — для первого"},"cap":"зрелость определяет место"},"id":"u7-4-t3"},{"mechanic":"visual","points":3,"stem":"Четыре архитектуры внедрения dsh в банке. Какая закрывает контур?","vopts":[{"id":"v0","v":{"g":"guardv","p":{"gin":true,"gout":true,"auth":true,"hitl":true}},"lbl":"","correct":true,"rationale":"Выгрузка off, шлюз к on-prem модели, политики инструментов, approvals и сеть периметром."},{"id":"v1","v":{"g":"guardv","p":{"gin":false,"gout":false,"auth":false,"hitl":false,"prompt":true}},"lbl":"","correct":false,"rationale":"Настройки по умолчанию: лог и поиск уходят наружу, MCP и сеть не ограничены."},{"id":"v2","v":{"g":"guardv","p":{"gin":true,"gout":false,"auth":true,"hitl":false}},"lbl":"","correct":false,"rationale":"Шлюз есть, но danger-full-access и approval never без контейнера."},{"id":"v3","v":{"g":"guardv","p":{"gin":false,"gout":true,"auth":false,"hitl":true}},"lbl":"","correct":false,"rationale":"Approvals включены, а лог по-прежнему выгружается в DeepSeek."}],"id":"u7-4-t4"}],"framework":"dsh в банке = платформа внутренних агентов в изолированном контуре: форк + пиннинг + бандл bank-base (session-log-deepseek off, web-провайдер свой, телеметрия off, адаптер ctx.llm на внутренний шлюз, OTel). Песочница ограничивает только файлы (bwrap > Landlock/Seatbelt > Windows ACL partial); сеть — периметром; approvals ask/never; MCP off. Пилот 8–10 недель с метриками harness; план Б — Codex/OpenCode.","anchor":{"g":"dsh","p":{"hl":["bank"]},"cap":"dsh за периметром банка"},"layers":{"simple":"DeepSeek Harness — мощный, но сырой инструмент: авторы сами пишут «не считайте безопасным и готовым к продакшену». Поэтому в банке он живёт в закрытой комнате: для внутренних агентов разработки, в контейнере, с зафиксированной версией.\nУ комнаты три двери, которые по умолчанию открыты наружу: журнал сессий уезжает в DeepSeek, веб-поиск идёт через DeepSeek, телеметрия может быть включена. Все три закрываются конфигурацией. Модель подключают через свой шлюз, как любой другой плагин.\nПесочница dsh запирает только файлы — не сеть и не процессы; сеть запирает контейнер. Подтверждения спрашивают человека, а в CI — всегда «нет». Пилот — восемь недель с метриками: сколько задач закрыто без вмешательства, сколько стоит, сколько откатов.\nПроверь себя: что уходит наружу при настройках по умолчанию?","how":"1. Статус: developer preview, без аудита, ломающие изменения (0.2.1 убрала runtime invariant plugins; Code → PTC со сменой session API), PR не принимаются → форк, пиннинг, плагины.\n2. Контур: `session-log-deepseek.enabled: false`; `ctx.web` — свой провайдер или off; телеметрия off; MCP off (вне песочницы); модель — адаптер `ctx.llm` на внутренний шлюз (`DEEPSEEK_BASE_URL` для совместимых; ключи через `!!js process.env`).\n3. Песочница: read-only / workspace-write / danger-full-access — только файлы; backend bwrap > Landlock (partial на старых ABI) > Seatbelt > Windows ACL (partial); `enforcement: partial` → отвергать при абсолютной границе; сеть — периметром контейнера. Пресеты `workspace-write` / `danger-full-access` → `permission/preset`. Approvals `ask` / `never`.\n4. Доступ: Web за reverse-proxy с SSO (`--public-url`, `--trusted-host`; `--host 0.0.0.0` отвергается), headless в CI, Python SDK (`sdk-minimal` пинит danger-full-access → одноразовый контейнер; `session_id`, патчи per-launch), ACP в IDE.\n5. Бандл `bank-base`: адаптер шлюза, политики инструментов (pre-execute ask на запись, guards на сеть/секреты, post-execute PII), skills `.dsh/skills`, AGENTS.md, `session-telemetry-otel`, хранилище логов как eval-материал.\n6. Пилот: 1–2 нед. форк + bank-base + модель угроз; 3–4 политики + CI headless; 5–6 Web для 10–20 разработчиков + eval; 7–8 отчёт. Метрики: доля задач без вмешательства, время/стоимость задачи, откаты, deny/ask-инциденты. План Б — Codex/OpenCode.","formula":{"f":"контур(dsh) = log_upload(off) ∧ web(own|off) ∧ telemetry(off) ∧ llm(adapter→шлюз) ∧ MCP(off) ∧ sandbox(workspace-write) ∧ approvals(ask|never) ∧ network(периметр)","legend":[["log_upload","session-log-deepseek — по умолчанию ON","enabled: false"],["llm(adapter)","плагин на ctx.llm к внутреннему шлюзу","provider bank-gateway"],["sandbox","файловые эффекты; backend и enforcement","bwrap, full"],["approvals","ask для людей, never для CI","allowed-once"],["network","не управляется dsh","сетевые политики контейнера"]],"note":"Любой пропущенный член формулы — открытая дверь; проверяй `--dump-config` и модель угроз перед пилотом."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— dsh — preview без аудита: форк, пиннинг, плагины; место — внутренние агенты в контуре.\n— Три утечки по умолчанию: лог сессий, web search, телеметрия — закрыть конфигом; MCP off.\n— Песочница — только файлы; сеть — периметром; enforcement partial отвергать.\n— Модель — адаптер ctx.llm на внутренний шлюз; Web за proxy с SSO; CI — headless с never.\n— Пилот 8–10 недель с метриками harness; план Б — Codex/OpenCode.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Что уходит наружу при настройках dsh по умолчанию?","o":["Ничего: всё хранится локально на машине разработчика и никуда не передаётся","События лога сессии в DeepSeek и web-search запросы","Все файлы рабочего пространства, которые индексируются для дообучения модели"],"a":1,"w":"Выключается в конфиге профиля; документировано в SDK-гайде."},{"q":"Что ограничивает workspace-write?","o":["Файлы, сеть и процессы агента на уровне ОС","Только файловые эффекты; сеть — периметром","Только чтение: любая запись требует allowed-once"],"a":1,"w":"Режимы песочницы — про файловые эффекты."},{"q":"В формуле контура как подключается on-prem модель?","o":["Через MCP-сервер, проксирующий запросы к модели","Адаптером на ctx.llm к внутреннему шлюзу","Через субагента dsh-sdk с URL модели в аргументах"],"a":1,"w":"ctx.llm — seam для провайдеров моделей."},{"q":"Почему dsh в банке — для внутренних агентов?","o":["Умеет только работать с кодом и не поддерживает диалог с людьми в каналах","Preview без аудита не пройдёт допуски клиентского контура","Лицензия MIT запрещает коммерческое использование с клиентами банка"],"a":1,"w":"Зрелость определяет место; пилот — в изолированном контуре."}],"rules":["dsh — preview без аудита: форк, пиннинг, плагины; место — внутренние агенты в контуре.","Три утечки по умолчанию: лог сессий, web search, телеметрия — закрыть конфигом; MCP off.","Песочница — только файлы; сеть — периметром; enforcement partial отвергать.","Модель — адаптер ctx.llm на внутренний шлюз; Web за proxy с SSO; CI — headless с never.","Пилот 8–10 недель с метриками harness; план Б — Codex/OpenCode."]}}],"TERMS":[{"name":"Токен","level":"L0","def":"Единица текста для модели: часть слова, слово или знак; примерно 3–4 символа русского текста. Контекст, цена и скорость считаются в токенах.","when":"Когда оцениваешь объём контекста, стоимость диалога или скорость генерации.","ex":"Системный промпт 1 500 токенов + 5 фрагментов RAG по 400 = 3 500 входных токенов на ход. Важно: Токены считаются в обе стороны: входные читаются, выходные генерируются, и цены разные.","near":[{"t":"Единица текста для модели: ровно один символ, включая пробелы и знаки; длина контекста, цена и скорость считаются в символах.","why":"Токен — не символ: один токен ≈ 3–4 символа русского текста."},{"t":"Единица текста для модели: целое слово или знак препинания; контекст, цена и скорость считаются в словах.","why":"Длинное русское слово — 2–4 токена; счёт идёт не по словам."}],"nb":[{"t":"Контекстное окно","d":"Максимальный объём токенов, который модель видит за один вызов: промпт, история, фрагменты и ответ.","why":"Окно — ёмкость, токен — единица измерения этой ёмкости."},{"t":"Чанк","d":"Фрагмент документа — единица индексации и поиска; обычно 300–800 токенов, режется по структуре с перекрытием.","why":"Чанк состоит из токенов, но это единица поиска, а не текста для модели."}],"apps":{"ok":"Аналитик считает входные токены на ход: промпт 1 500 + пять фрагментов по 400 + история 800.","okWhy":"Стоимость и контекст считаются в токенах, входные — отдельно от выходных.","bad":[{"t":"Команда оценивает качество ответов по среднему числу токенов","why":"Длина — не качество; судья даже имеет смещение к длинным ответам."},{"t":"Продакт делит длину документа в символах на 10 и называет это числом токенов для расчёта месячного бюджета на модель.","why":"Один токен ≈ 3–4 символа русского текста; ошибка в 2–3 раза в бюджете."},{"t":"Инженер считает токены только по ответам модели, потому что клиент видит именно их","why":"Входных токенов в 5–10 раз больше, и они — главная статья стоимости."}]},"simple":"Токен — это «кусочек текста», которым модель платит за чтение и письмо.","remember":"1 токен ≈ 3–4 символа; входных в 5–10 раз больше выходных.","sym":"tok","legend":[["tok_in","прочитанные моделью"],["tok_out","сгенерированные"]],"rdef":"Единица текста для модели: часть слова, слово или знак; примерно 3–4 символа русского текста."},{"name":"Контекстное окно","level":"L0","def":"Максимальный объём токенов, который модель видит за один вызов: системный промпт, история, фрагменты RAG, описания инструментов, ответ.","when":"При проектировании промпта, выборе top-k, сжатии истории, выборе модели.","ex":"Окно 32k: система 2k + инструменты 2,5k + RAG 2k + история 3k + ответ 0,5k = 10k — запас есть, но история растёт. Важно: Большое окно не значит хорошее внимание: середина длинного контекста читается хуже («lost in the middle»).","near":[{"t":"Максимальный объём токенов, который модель помнит между разговорами: системный промпт, прошлые диалоги, фрагменты RAG и ответы.","why":"Между вызовами модель ничего не помнит: окно — это один вызов, и «память» кладут в него заново."},{"t":"Максимальное число параметров модели, определяющее, сколько инструкций, истории и фрагментов она способна учесть за один вызов.","why":"Параметры и окно — разные характеристики; окно измеряется в токенах входа и выхода."}],"nb":[{"t":"Токен","d":"Единица текста для модели: часть слова, слово или знак; примерно 3–4 символа русского текста.","why":"Токен — единица, окно — ёмкость в токенах."},{"t":"Чанк","d":"Фрагмент документа — единица индексации и поиска; обычно 300–800 токенов с перекрытием и метаданными.","why":"Чанки занимают место в окне, но это элемент RAG, а не свойство модели."}],"apps":{"ok":"Архитектор раскладывает окно 32k по частям: система, инструменты, RAG, история, ответ — и видит запас.","okWhy":"Окно — бюджет, который планируют по частям заранее.","bad":[{"t":"Команда кладёт в контекст всю историю клиента за год, потому что окно 128k «всё равно позволяет»","why":"Переполнение, «потеря в середине» и стоимость; историю сжимают."},{"t":"Инженер объясняет клиенту, что ассистент помнит прошлый разговор, потому что у модели большое контекстное окно и долгая память.","why":"Между вызовами модель не помнит; «память» кладут в окно заново кодом."},{"t":"Продакт выбирает модель по размеру окна, считая, что чем оно больше, тем точнее ответы по документам и меньше галлюцинаций.","why":"Большое окно читается хуже в середине; точность дают поиск и top-k 3–5."}]},"simple":"Это стол, на котором модель раскладывает всё, что читает; стол конечен.","remember":"Окно — бюджет; середина читается хуже; историю сжимать.","sym":"ctx","legend":[["ctx","всё, что модель видит за вызов"]],"rdef":"Максимальный объём токенов, который модель видит за один вызов: промпт, история, фрагменты RAG, ответ."},{"name":"Температура","level":"L0","def":"Параметр случайности выбора следующего токена: 0 — почти детерминированно, 1 — разнообразно. Не влияет на знания и факты.","when":"Настройка сценариев: 0–0,2 для фактов и structured output, выше — для творческих формулировок.","ex":"Для ответов о тарифах — temperature 0, для вариантов формулировки push-уведомления — 0,8. Важно: Даже при 0 ответ может меняться между версиями модели и инфраструктуры.","near":[{"t":"Параметр точности выбора следующего токена: 0 — модель отвечает строго по фактам из обучения, 1 — допускает приблизительные утверждения.","why":"Температура управляет случайностью, а не правдивостью: низкая не делает ответ фактическим."},{"t":"Параметр случайности выбора следующего токена: при 0 одинаковый вход всегда даёт побайтно одинаковый ответ на любом железе и версии.","why":"Даже при 0 детерминизм не гарантирован: батчинг, версии модели и инфраструктуры меняют вывод."}],"nb":[{"t":"Галлюцинация","d":"Уверенное утверждение модели, не подтверждённое источниками или фактами: выдуманный тариф, несуществующая статья договора.","why":"Галлюцинацию лечат источниками и валидаторами, а не температурой."},{"t":"Structured output","d":"Ответ модели в заданной схеме (JSON Schema): поля, типы, перечисления — чтобы код мог надёжно разобрать результат.","why":"Схема задаёт форму ответа, температура — разброс формулировок."}],"apps":{"ok":"Для ответов о тарифах — температура 0,1, для вариантов формулировок push-уведомлений — 0,8.","okWhy":"Низкая — для фактов и структуры, выше — для разнообразия формулировок.","bad":[{"t":"Чтобы убрать выдуманные тарифы, ML-инженер снижает температуру до нуля и закрывает задачу о галлюцинациях как решённую.","why":"Детерминированная выдумка — всё равно выдумка; лечат источники и валидаторы."},{"t":"Тестировщик заводит дефект: при температуре 0 модель дважды ответила по-разному, значит, инфраструктура инференса сломана.","why":"Детерминизм не гарантирован даже при 0; качество меряют на выборке."},{"t":"Продакт поднимает температуру до 1, чтобы модель «вспоминала» больше фактов из обучения, когда поиск ничего не нашёл.","why":"Температура не добавляет знаний; при пустом поиске нужен честный отказ."}]},"simple":"Ручка «насколько смело модель угадывает следующее слово».","remember":"Температура — про стабильность, не про правду.","sym":"T","legend":[["T","0 — стабильно, 1 — разнообразно"]],"rdef":"Параметр случайности выбора следующего токена: 0 — почти детерминированно, 1 — разнообразно."},{"name":"Галлюцинация","level":"L0","def":"Уверенное утверждение модели, не подтверждённое источниками или фактами: выдуманный тариф, несуществующая статья договора, неверная дата.","when":"Всегда: это главный риск доверия в банке; меряется как hallucination rate на выборке.","ex":"«Комиссия 1,5%» при реальных 2% — галлюцинация; клиент принял решение на её основе. Важно: Снижают, а не устраняют: RAG с цитатами, «не знаю», числа из систем, валидаторы, судья faithfulness.","near":[{"t":"Уверенное утверждение модели, которое противоречит системному промпту: нарушенный формат, лишняя тема, неверный тон ответа.","why":"Нарушение инструкций — другой класс дефекта; галлюцинация — выдуманный факт."},{"t":"Неуверенное утверждение модели с оговорками и отказом отвечать, когда источники есть, но модель их не использует.","why":"Излишняя осторожность — противоположный дефект; галлюцинация звучит уверенно."}],"nb":[{"t":"recall@k","d":"Доля вопросов golden set, для которых нужный фрагмент попал в top-k результатов поиска; метрика retrieval.","why":"Промах поиска — причина, галлюцинация — симптом; меряются отдельно."},{"t":"Faithfulness (groundedness)","d":"Доля утверждений ответа, подтверждённых принесёнными фрагментами; метрика генерации в RAG.","why":"Faithfulness — метрика, которой галлюцинации измеряют на выборке."}],"apps":{"ok":"Еженедельно размечают 200 диалогов и считают долю ответов с неподтверждёнными фактами; на суммах — ноль.","okWhy":"Hallucination rate — guardrail-метрика на выборке, с нулём на цифрах из систем.","bad":[{"t":"Заказчику обещают, что после перехода на модель побольше галлюцинаций не будет совсем","why":"Галлюцинации снижают, а не устраняют; обещают измерение и снижение."},{"t":"Ответ агента нарушил формат JSON, и аналитик записывает это как галлюцинацию в еженедельный отчёт по качеству для заказчика.","why":"Нарушение формата — другой класс дефекта, его ловит валидатор схемы."},{"t":"Команда борется с галлюцинациями, добавляя в промпт «отвечай только правду и не выдумывай»","why":"Промпт не даёт модели фактов; нужны RAG с цитатами, «не знаю» и числа из инструментов."}]},"simple":"Модель говорит уверенно то, чего нет в источниках.","remember":"Снижаем источниками и валидаторами; на цифрах — ноль через инструменты.","sym":"HR","legend":[["HR","доля ответов с неподтверждёнными фактами"]],"rdef":"Уверенное утверждение модели, не подтверждённое источниками или фактами: выдуманный тариф или дата."},{"name":"Системный промпт","level":"L0","def":"Инструкция модели, задающая роль, правила, формат, границы и стиль; действует на весь диалог; версионируется и тестируется как код.","when":"Проектирование поведения агента; каждое изменение — релиз через eval gate.","ex":"«Ты ассистент банка. Отвечай только по фрагментам, цитируй id. Если нет источника — скажи и предложи оператора. Не давай инвестиционных советов». Важно: Промпт — не граница безопасности: инъекции его обходят.","near":[{"t":"Инструкция модели, задающая роль, правила, формат и границы; действует на весь диалог и служит основной границей безопасности агента.","why":"Промпт — спецификация поведения, но не граница безопасности: инъекции его обходят."},{"t":"Сообщение клиента в начале диалога, задающее тему, формат и стиль ответа; действует до следующего сообщения и не версионируется.","why":"Это пользовательский промпт — данные, а не инструкция; системный пишет команда и версионирует как код."}],"nb":[{"t":"Guardrails","d":"Защитный контур вокруг модели: входные и выходные фильтры инъекций, PII, тематики; отдельные сервисы с тестами.","why":"Guard — сервис вне модели; промпт — текст внутри вызова."},{"t":"Structured output","d":"Ответ модели в заданной схеме (JSON Schema): поля, типы, перечисления — чтобы код мог надёжно разобрать результат.","why":"Схема описывает форму ответа; промпт — поведение в целом."}],"apps":{"ok":"Изменение промпта проходит ревью, прогон golden set и релиз под флагом — как изменение кода.","okWhy":"Промпт меняет 100% диалогов и версионируется как код.","bad":[{"t":"Правила безопасности агента хранятся только в системном промпте","why":"Промпт — не граница безопасности; защита — технические слои с тестами."},{"t":"После инцидента команда дописывает в промпт очередной абзац правил; промпт вырос до 4 000 токенов, зато покрывает все случаи.","why":"Правила-заплатки дороги, конфликтуют и не защищают; их место — в guard и валидаторах."},{"t":"Продакт правит промпт в проде за минуту без прогона тестов, потому что «это же просто текст», и откатить можно так же быстро.","why":"Текст меняет поведение сильнее кода — нужен eval gate."}]},"simple":"Должностная инструкция агента, написанная один раз для всех разговоров.","remember":"Версионировать, тестировать, не считать защитой.","sym":"sys","legend":[["sys","роль + правила + формат + границы"]],"rdef":"Инструкция модели, задающая роль, правила, формат, границы и стиль; действует на весь диалог."},{"name":"Structured output","level":"L0","def":"Ответ модели в заданной схеме (JSON Schema): поля, типы, перечисления — чтобы код мог надёжно разобрать результат.","when":"Извлечение параметров, классификация, вызов инструментов, числа и даты.","ex":"{\"intent\": \"dispute\", \"amount\": 1200, \"date\": \"2026-03-04\", \"confidence\": 0.82} Важно: Схему валидируют на стороне кода; невалидный ответ — ретрай или fallback.","near":[{"t":"Ответ модели в заданной схеме (JSON Schema), который модель сама валидирует и исправляет, поэтому код может доверять ему без проверки.","why":"Схему валидируют на стороне кода; невалидный ответ — ретрай или fallback."},{"t":"Ответ модели в оформленном виде: заголовки, списки и таблицы Markdown, чтобы человеку было удобно читать результат в чате.","why":"Markdown — для человека; structured output — для кода, который читает поля по схеме."}],"nb":[{"t":"Function calling / tool use","d":"Механизм, при котором модель возвращает структурированный вызов функции (имя + аргументы), а код исполняет его.","why":"Вызов функции — частный случай структурированного ответа, предназначенный для действия."},{"t":"Системный промпт","d":"Инструкция модели, задающая роль, правила, формат, границы и стиль; действует на весь диалог.","why":"Промпт задаёт поведение, схема — форму ответа."}],"apps":{"ok":"Классификатор интента возвращает JSON по схеме {intent, amount, confidence}, который валидирует код.","okWhy":"Всё, что читает код, — через схему с валидацией.","bad":[{"t":"Оркестратор разбирает свободный текст ответа регулярными выражениями","why":"Хрупко; для кода — JSON-схема."},{"t":"Команда просит модель отвечать клиенту строгим JSON, чтобы ответы были «структурированными», точными и одинаково оформленными.","why":"Клиенту нужен текст; схема — для кода, а не для человека."},{"t":"Невалидный JSON от модели отправляется в систему банка как есть","why":"Валидация — на стороне кода; невалидный ответ — ретрай или fallback."}]},"simple":"Модель заполняет анкету с полями, а не пишет сочинение.","remember":"Если результат читает код — только схема.","sym":"JSON","legend":[["schema","поля, типы, обязательность"]],"rdef":"Ответ модели в заданной схеме (JSON Schema): поля, типы, перечисления — чтобы код разобрал результат."},{"name":"Function calling / tool use","level":"L0","def":"Механизм, при котором модель возвращает структурированный вызов функции (имя + аргументы), а код исполняет его и возвращает результат модели.","when":"Любой доступ агента к данным и действиям: баланс, история, поиск, перевод.","ex":"Модель: call get_transactions(days=7) → код → JSON с операциями → модель формулирует ответ. Важно: Модель предлагает вызов, код решает, исполнять ли: права, allow-list, подтверждение.","near":[{"t":"Механизм, при котором модель напрямую обращается к API банка по описанию инструмента, получает ответ и сама решает, исполнять ли действие.","why":"Модель только предлагает вызов; исполняет и проверяет права код оркестратора."},{"t":"Механизм, при котором код заранее вызывает нужные функции и кладёт их результаты в промпт, а модель лишь формулирует ответ по данным.","why":"Это предзагрузка контекста (workflow-узел), а не выбор вызова моделью."}],"nb":[{"t":"Агент","d":"LLM в цикле: получает цель, выбирает инструмент, наблюдает результат, повторяет до достижения цели или лимита.","why":"Агент — цикл из многих вызовов; function calling — один шаг этого цикла."},{"t":"Structured output","d":"Ответ модели в заданной схеме (JSON Schema): поля, типы, перечисления — чтобы код мог надёжно разобрать результат.","why":"Вызов функции — структурированный ответ особого назначения."}],"apps":{"ok":"Модель возвращает call get_transactions(days=7); оркестратор проверяет права и исполняет вызов.","okWhy":"Модель предлагает, код проверяет и исполняет.","bad":[{"t":"Инженер даёт модели прямой доступ к API банка по описанию инструментов без слоя проверки прав","why":"Нет прав, allow-list, идемпотентности и подтверждения — утечка и дубли."},{"t":"Продакт называет function calling «агентом» и обещает заказчику, что ассистент сам доведёт любую задачу клиента до конца.","why":"Вызов инструмента — один шаг; агент — цикл с состоянием и ограничителями."},{"t":"Чтобы модель точнее выбирала инструмент, команда добавляет в описание каждого по две страницы документации API с примерами.","why":"Длинные описания съедают контекст; точность дают короткие и точные описания."}]},"simple":"Модель не нажимает кнопки сама — она говорит коду, какую кнопку нажать.","remember":"Модель предлагает, код исполняет и проверяет.","sym":"fn","legend":[["fn(args)","имя + аргументы по схеме"]],"rdef":"Механизм, при котором модель возвращает структурированный вызов функции, а код исполняет его и возвращает результат."},{"name":"Агент","level":"L1","def":"LLM в цикле: получает цель, выбирает инструмент, наблюдает результат, повторяет до достижения цели или лимита; порядок шагов выбирает модель.","when":"Длинный хвост запросов, где сценариев слишком много для кода; только с ограничителями.","ex":"Оспаривание операции: get_transactions → get_merchant → search_kb → ответ с кнопкой претензии. Важно: Ограничители: max steps, allow-list, детектор зацикливания, подтверждение записи, эскалация.","near":[{"t":"LLM в цикле: получает цель, выполняет заранее заданную кодом последовательность инструментов и останавливается, когда код исчерпал шаги.","why":"Если порядок задан кодом — это workflow; в агенте следующий шаг выбирает модель."},{"t":"LLM в цикле: получает цель, выбирает инструмент, наблюдает результат и повторяет без ограничений, пока сама не решит, что цель достигнута.","why":"Без лимита шагов, allow-list и чекпоинтов агент зацикливается и делает лишние действия."}],"nb":[{"t":"Workflow (оркестрация)","d":"Последовательность шагов, заданная кодом, где LLM выполняет отдельные узлы: классифицировать, извлечь, сформулировать.","why":"В workflow порядок фиксирован кодом, в агенте его выбирает модель."},{"t":"Function calling / tool use","d":"Механизм, при котором модель возвращает структурированный вызов функции (имя + аргументы), а код исполняет его.","why":"Вызов инструмента — один шаг; агент — цикл таких шагов с состоянием."}],"apps":{"ok":"Разбор списания: агент с тремя инструментами чтения и лимитом 6 шагов; претензия — через workflow.","okWhy":"Агентность на чтении с тормозами, необратимое — под контролем.","bad":[{"t":"Команда делает «полноценного агента» на 20 инструментов, включая перевод, без лимита шагов и подтверждения — чтобы довёл любое дело.","why":"Свобода над необратимым и без тормозов — зацикливание и лишние действия."},{"t":"Перевод денег реализован агентом: модель сама решает порядок проверок и вызывает transfer, когда уверена в намерении клиента.","why":"Деньги — через workflow с подтверждением и идемпотентным ключом."},{"t":"Чат, отвечающий по базе знаний без инструментов, в презентации назван агентом","why":"Без инструментов и цикла это чат-бот, а не агент."}]},"simple":"Сотрудник с целью и ящиком инструментов, которому поставили лимиты.","remember":"Агент = LLM + инструменты + цикл + тормоза.","sym":"loop","legend":[["plan→act→observe","шаг цикла"]],"rdef":"LLM в цикле: получает цель, выбирает инструмент, наблюдает результат, повторяет до цели или лимита шагов."},{"name":"Workflow (оркестрация)","level":"L1","def":"Последовательность шагов, заданная кодом, где LLM выполняет отдельные узлы: классифицировать, извлечь, сформулировать.","when":"Мало путей (≤ 10), необратимые действия, требования объяснимости.","ex":"Перевод: извлечь параметры → проверить права → подтверждение → API с идемпотентным ключом. Важно: Объясняется документом, а не трассой — удобно для регулятора.","near":[{"t":"Последовательность шагов, которую модель выбирает сама по описанию инструментов, а код лишь исполняет вызовы и логирует результат.","why":"Если порядок выбирает модель — это агент; workflow задаёт порядок кодом."},{"t":"Последовательность шагов, заданная кодом без участия LLM: жёсткие правила и регулярные выражения вместо понимания языка.","why":"Workflow с LLM-узлами понимает формулировки; скрипт без модели — нет."}],"nb":[{"t":"Агент","d":"LLM в цикле: получает цель, выбирает инструмент, наблюдает результат, повторяет до достижения цели или лимита.","why":"Агент выбирает путь сам; workflow — конвейер с фиксированными станками."},{"t":"HITL (human in the loop)","d":"Человек в контуре: подтверждение клиента перед действием или участие оператора в решении.","why":"HITL — чекпоинт внутри workflow, а не способ оркестрации."}],"apps":{"ok":"Перевод: параметры → права → подтверждение клиента → API с идемпотентным ключом; порядок задан кодом.","okWhy":"Необратимое действие — детерминированный путь.","bad":[{"t":"Команда пытается закрыть длинный хвост формулировок клиентов ветвлениями в коде и регулярными выражениями, добавляя по ветке в неделю.","why":"Длинный хвост — задача агента с инструментами, код его не вместит."},{"t":"Workflow описан так, что порядок шагов на каждом ходе выбирает модель по описанию инструментов","why":"Если порядок выбирает модель — это агент, со всеми его рисками."},{"t":"Продакт отказывается от workflow для FAQ и статусов, потому что «агент универсальнее и моднее»","why":"Для 5–10 путей workflow дешевле, надёжнее и объяснимее."}]},"simple":"Конвейер: станки стоят на местах, модель работает на станке.","remember":"Деньги — через workflow.","rdef":"Последовательность шагов, заданная кодом, где LLM выполняет отдельные узлы: классифицировать, извлечь, сформулировать."},{"name":"HITL (human in the loop)","level":"L1","def":"Человек в контуре: подтверждение клиента перед действием или участие оператора в решении.","when":"Запись, финансовые и регуляторно значимые действия; эскалация при неуверенности.","ex":"Перед переводом — экран «Подтвердить 10 000 ₽ маме?»; спор с юридическими последствиями — оператор. Важно: Подтверждение — на стороне кода и интерфейса, не фраза модели «вы уверены?».","near":[{"t":"Человек в контуре: модель спрашивает клиента «вы уверены?» и выполняет действие после утвердительного ответа в чате.","why":"Подтверждение — кнопка в интерфейсе на стороне кода; текстовый ответ может подделать инъекция."},{"t":"Человек в контуре: оператор просматривает все ответы агента после отправки клиенту и исправляет ошибки постфактум.","why":"Контроль после отправки — аудит выборки, а не HITL; HITL стоит до необратимого действия."}],"nb":[{"t":"Идемпотентность","d":"Свойство операции: повторный вызов с тем же ключом даёт тот же результат, не создавая дубль.","why":"Идемпотентность защищает от повторов, HITL — от действия без согласия."},{"t":"Guardrails","d":"Защитный контур вокруг модели: входные и выходные фильтры инъекций, PII, тематики; отдельные сервисы с тестами.","why":"Guard фильтрует текст; HITL — человек подтверждает действие."}],"apps":{"ok":"Перед переводом клиент видит экран «Подтвердить 10 000 ₽?»; без нажатия вызов transfer не выполняется.","okWhy":"Чекпоинт перед необратимым — кнопка в интерфейсе на стороне кода.","bad":[{"t":"Модель спрашивает в чате «вы уверены?» и выполняет перевод после ответа «да», что команда считает подтверждением клиента.","why":"Текстовый ответ подделывается инъекцией; подтверждение — вне модели."},{"t":"Чтобы поднять containment, продакт убирает подтверждение для переводов до 5 000 ₽: суммы небольшие","why":"Финансовое действие без подтверждения — инцидент, а не метрика."},{"t":"HITL реализован как ежедневная проверка оператором выборки уже отправленных ответов с исправлением ошибок постфактум.","why":"Это аудит постфактум; HITL стоит до действия."}]},"simple":"Перед тем как сделать что-то необратимое, спрашиваем человека — кнопкой.","remember":"Запись → ✋ человек.","sym":"✋","legend":[["✋","чекпоинт подтверждения"]],"rdef":"Человек в контуре: подтверждение клиента перед действием или участие оператора в решении."},{"name":"Идемпотентность","level":"L1","def":"Свойство операции: повторный вызов с тем же ключом даёт тот же результат, не создавая дубль.","when":"Каждый вызов инструмента записи: переводы, заявки, изменения продуктов.","ex":"POST /transfer с Idempotency-Key dlg-42-step-3: таймаут и ретрай не создают второй перевод. Важно: Ключ генерирует оркестратор на шаг диалога, не модель.","near":[{"t":"Свойство операции: повторный вызов с новым ключом гарантированно отменяет предыдущий результат, поэтому дубли можно откатить.","why":"Ключ не отменяет операцию; он делает повтор безопасным — тот же результат, не дубль."},{"t":"Свойство операции: все её шаги выполняются целиком или не выполняются вовсе, поэтому частичный перевод невозможен.","why":"Это атомарность транзакции; идемпотентность — про повторные вызовы."}],"nb":[{"t":"HITL (human in the loop)","d":"Человек в контуре: подтверждение клиента перед действием или участие оператора в решении.","why":"HITL — согласие на действие; идемпотентность — защита от его дублирования."},{"t":"Feature flag и реестр версий","d":"Переключатель поведения без выкладки и реестр согласованных наборов версий для отката за минуту.","why":"Flag откатывает поведение; ключ идемпотентности защищает один вызов."}],"apps":{"ok":"Каждый вызов submit_claim идёт с ключом dlg-42-step-3; повтор после таймаута даёт тот же результат.","okWhy":"Ретрай — норма сети; ключ делает его безопасным.","bad":[{"t":"Оркестратор генерирует новый uuid на каждую попытку вызова, поэтому «каждая попытка уникальна и легко отслеживается в логах».","why":"Новый ключ на ретрай — дубль перевода."},{"t":"Команда полагается на то, что таймаутов между агентом и АБС не бывает, и ключи не вводит","why":"Таймауты будут; без ключа — дубли денег."},{"t":"Идемпотентный ключ формирует модель в аргументах инструмента по своему усмотрению, исходя из контекста диалога.","why":"Ключ генерирует оркестратор на шаг диалога, а не модель."}]},"simple":"Квитанция: повторный запрос с той же квитанцией не делает второй перевод.","remember":"Запись → ключ.","sym":"idem","legend":[["key","уникален на шаг диалога"]],"rdef":"Свойство операции: повторный вызов с тем же ключом даёт тот же результат, не создавая дубль."},{"name":"RAG","level":"L1","def":"Retrieval-augmented generation: поиск релевантных фрагментов знаний и подстановка их в контекст перед генерацией, с цитированием.","when":"Любые ответы по документам банка: тарифы, регламенты, инструкции.","ex":"Запрос → фильтр прав → вектор + BM25 → reranker → 5 фрагментов → ответ с id источников. Важно: Качество RAG = качество поиска: меряй recall@k отдельно от faithfulness.","near":[{"t":"Retrieval-augmented generation: дообучение модели на документах банка, чтобы знания о тарифах и регламентах хранились в её весах.","why":"Это fine-tuning; RAG не меняет веса, а подставляет найденные фрагменты в контекст."},{"t":"Retrieval-augmented generation: поиск релевантных документов по запросу и показ их списка клиенту без генерации ответа моделью.","why":"Без генерации это обычный поиск; RAG добавляет ответ модели по найденному с цитатами."}],"nb":[{"t":"Эмбеддинг","d":"Числовой вектор, кодирующий смысл текста; близкие по смыслу тексты — близкие векторы; основа векторного поиска.","why":"Эмбеддинг — инструмент поиска внутри RAG, а не сам конвейер."},{"t":"Чанк","d":"Фрагмент документа — единица индексации и поиска; обычно 300–800 токенов, режется по структуре с перекрытием.","why":"Чанк — единица, которую RAG ищет и подставляет."}],"apps":{"ok":"Запрос → права → гибридный поиск → reranker → 5 фрагментов → ответ с id источников; recall@5 ≥ 90%.","okWhy":"Факты — через поиск с цитатами и измеренным retrieval.","bad":[{"t":"Чтобы агент знал тарифы, команда дообучает модель на регламентах раз в квартал и не зависит от качества поиска.","why":"Устаревает, не цитируется; факты — через RAG."},{"t":"Инженер кладёт весь документ о тарифах в контекст целиком, чтобы «ничего не потерять», благо окно модели это позволяет.","why":"Шум, стоимость, потеря в середине; нужны чанки и top-k."},{"t":"Качество RAG оценивают одним общим баллом судьи, не разделяя поиск и генерацию","why":"Без recall отдельно от faithfulness непонятно, что чинить."}]},"simple":"Библиотекарь приносит карточки, стажёр отвечает по ним и указывает источник.","remember":"RAG: поиск → фрагменты → ответ с цитатами.","sym":"RAG","legend":[["retrieve","поиск фрагментов"],["generate","ответ по ним"]],"rdef":"Retrieval-augmented generation: поиск релевантных фрагментов знаний и подстановка их в контекст перед генерацией."},{"name":"Чанк","level":"L1","def":"Фрагмент документа — единица индексации и поиска; обычно 300–800 токенов, режется по структуре, с перекрытием и метаданными.","when":"Настройка индексации базы знаний; spike по размеру чанка.","ex":"Раздел тарифа → 3 чанка по 500 токенов с перекрытием 15%, метаданные: продукт, дата, доступ. Важно: Слишком мелко — теряется контекст; слишком крупно — шум.","near":[{"t":"Фрагмент документа — единица индексации и поиска; обычно 2 000–4 000 токенов, чтобы в контекст попадал целый раздел с полным смыслом.","why":"Крупные чанки приносят шум и съедают окно; рабочий диапазон 300–800 токенов."},{"t":"Фрагмент документа — единица индексации и поиска; режется по фиксированному числу символов без учёта заголовков и абзацев.","why":"Резать нужно по структуре: иначе фраза без контекста и таблица пополам."}],"nb":[{"t":"Токен","d":"Единица текста для модели: часть слова, слово или знак; примерно 3–4 символа русского текста.","why":"Чанк измеряется в токенах, но это единица поиска."},{"t":"Эмбеддинг","d":"Числовой вектор, кодирующий смысл текста; близкие по смыслу тексты — близкие векторы.","why":"Эмбеддинг — координаты чанка в векторном пространстве, не сам фрагмент."}],"apps":{"ok":"Регламент режут на чанки по 500 токенов по заголовкам с перекрытием 15% и метаданными.","okWhy":"Единица поиска — по структуре, с метаданными.","bad":[{"t":"Документы режут по 1 000 символов подряд, не глядя на заголовки и таблицы","why":"Фраза без контекста и таблица пополам — recall падает."},{"t":"Чтобы в контекст попадал целый раздел, размер чанка ставят 3 000 токенов и top-k 5","why":"15k токенов шума; рабочий диапазон 300–800."},{"t":"Метаданные у чанков не хранят: «вектор и так найдёт нужное по смыслу», а права проверит выходной фильтр.","why":"Без метаданных нет фильтров по правам и дате и нет цитат."}]},"simple":"Карточка из библиотеки: короткая выписка с указанием, откуда.","remember":"300–800 токенов, по структуре, с метаданными.","rdef":"Фрагмент документа — единица индексации и поиска; обычно 300–800 токенов, режется по структуре с перекрытием."},{"name":"Эмбеддинг","level":"L1","def":"Числовой вектор, кодирующий смысл текста; близкие по смыслу тексты — близкие векторы; основа векторного поиска.","when":"Индексация чанков и запросов; выбор модели эмбеддингов под русский язык.","ex":"«Комиссия за снятие» и «плата за обналичивание» — близкие векторы; «СБП-3» и «СБП-5» — тоже близкие, что мешает точному поиску. Важно: Смена модели эмбеддингов требует переиндексации всего корпуса.","near":[{"t":"Числовой вектор, кодирующий точные слова текста; совпадающие термины и коды дают близкие векторы, синонимы — далёкие.","why":"Вектор ловит смысл, а не точные слова; коды и аббревиатуры — слабое место, их закрывает BM25."},{"t":"Числовой идентификатор документа в индексе, по которому поиск находит фрагмент за константное время независимо от запроса.","why":"Это ключ записи, а не представление смысла; эмбеддинг сравнивают с вектором запроса."}],"nb":[{"t":"Гибридный поиск и reranking","d":"Объединение векторного и ключевого поиска (RRF) с последующей переоценкой кандидатов reranker'ом.","why":"Гибрид — способ поиска, эмбеддинг — его векторная половина."},{"t":"Чанк","d":"Фрагмент документа — единица индексации и поиска; обычно 300–800 токенов с метаданными.","why":"Чанк — что индексируем, эмбеддинг — как представляем его смысл."}],"apps":{"ok":"Запрос «плата за обналичивание» находит фрагмент «комиссия за снятие»: их векторы близки.","okWhy":"Вектор ловит смысл и синонимы.","bad":[{"t":"Поиск тарифа «СБП-3» делают только векторным, потому что эмбеддинги «понимают всё», включая коды и номера тарифов.","why":"Точные коды — слабое место вектора; нужен гибрид с BM25."},{"t":"Команда меняет модель эмбеддингов и оставляет старый индекс","why":"Векторы разных моделей несовместимы — переиндексация обязательна."},{"t":"Продакт объясняет заказчику, что эмбеддинг — это идентификатор документа в базе, по которому его быстро находят.","why":"Эмбеддинг — представление смысла, а не ключ записи."}]},"simple":"Координаты смысла: похожие фразы оказываются рядом.","remember":"Смысл — вектор; точные слова — BM25.","sym":"emb","legend":[["cos(q, d)","близость запроса и чанка"]],"rdef":"Числовой вектор, кодирующий смысл текста; близкие по смыслу тексты — близкие векторы; основа векторного поиска."},{"name":"Гибридный поиск и reranking","level":"L1","def":"Объединение векторного и ключевого поиска (RRF) с последующей переоценкой кандидатов моделью-reranker'ом по релевантности запросу.","when":"Когда запросы содержат и смысл, и точные идентификаторы; почти всегда в банке.","ex":"Вектор top-20 + BM25 top-20 → RRF → reranker → top-5; precision@5 +15 п.п. за 200 мс. Важно: Reranker — компактная модель, дорогая на тысячах кандидатов; поэтому сначала отбор, потом переоценка.","near":[{"t":"Объединение векторного и ключевого поиска путём увеличения top-k до 50, чтобы нужный фрагмент наверняка попал в контекст модели.","why":"Гибрид объединяет кандидатов и переоценивает их; большой top-k даёт шум и «потерю в середине»."},{"t":"Повторный прогон запроса через большую модель, которая читает весь корпус документов и выбирает лучший фрагмент напрямую.","why":"Reranker — компактная модель на десятках кандидатов после отбора, а не чтение корпуса."}],"nb":[{"t":"Эмбеддинг","d":"Числовой вектор, кодирующий смысл текста; близкие по смыслу тексты — близкие векторы.","why":"Вектор — одна из двух половин гибрида."},{"t":"recall@k","d":"Доля вопросов golden set, для которых нужный фрагмент попал в top-k результатов поиска.","why":"Recall — метрика, которой меряют эффект гибрида и reranker'а."}],"apps":{"ok":"Вектор top-20 + BM25 top-20 → RRF → reranker → top-5; precision@5 +15 п.п. за 200 мс.","okWhy":"Отбор широко, переоценка точно, в контекст — мало.","bad":[{"t":"Чтобы нужный фрагмент точно попал в контекст, команда поднимает top-k до 50 без переоценки — модель сама разберётся.","why":"Шум и «потеря в середине»; лучше reranker и top-5."},{"t":"Reranker запускают на всём корпусе из 200 000 чанков на каждый запрос","why":"Reranker дорог на тысячах кандидатов; сначала отбор, потом переоценка."},{"t":"Гибридный поиск отключают ради латентности и оставляют только BM25","why":"Теряются синонимы и перефразировки; гибрид нужен обоим типам запросов."}]},"simple":"Два поисковика приносят кандидатов, эксперт переставляет лучших наверх.","remember":"Гибрид → RRF → reranker → 3–5.","rdef":"Объединение векторного и ключевого поиска (RRF) с переоценкой кандидатов reranker'ом по релевантности."},{"name":"recall@k","level":"L1","def":"Доля вопросов golden set, для которых нужный фрагмент попал в top-k результатов поиска; метрика retrieval.","when":"Диагностика RAG: низкий recall — чинить поиск, не модель.","ex":"348 из 400 → recall@5 = 87%; цель ≥ 90%. Важно: Считается при k, который реально идёт в контекст.","near":[{"t":"Доля релевантных фрагментов среди k принесённых в контекст; показывает, сколько шума получила модель вместе с нужными данными.","why":"Это precision@k; recall — нашёлся ли нужный фрагмент вообще."},{"t":"Доля вопросов golden set, для которых ответ модели опирается на принесённые фрагменты, а не на собственные знания.","why":"Это faithfulness — метрика генерации; recall — метрика поиска."}],"nb":[{"t":"Faithfulness (groundedness)","d":"Доля утверждений ответа, подтверждённых принесёнными фрагментами; метрика генерации в RAG.","why":"Recall — поиск, faithfulness — генерация; диагноз ставят по паре."},{"t":"Golden set","d":"Эталонный набор реальных запросов с рубрикой ожидаемого ответа для офлайн-оценки.","why":"Golden set — на чём считают recall, а не сама метрика."}],"apps":{"ok":"Нужный чанк попал в top-5 у 348 из 400 вопросов — recall@5 = 87%; чинят поиск, а не промпт.","okWhy":"Низкий recall — проблема поиска, до генерации.","bad":[{"t":"При recall@5 = 62% команда добавляет в промпт «отвечай точнее» и ждёт улучшения ответов на следующей неделе.","why":"Промпт не вернёт фрагменты, которых нет в контексте."},{"t":"Recall считают при k = 50, хотя в контекст реально идёт 5 фрагментов","why":"Метрика считается при k, который идёт в контекст."},{"t":"Аналитик называет recall@k долей релевантных среди принесённых фрагментов и отчитывается по ней как по полноте.","why":"Это precision@k; recall — нашёлся ли нужный."}]},"simple":"Из 100 вопросов библиотекарь принёс нужную карточку в 87 — это и есть recall.","remember":"recall низкий → поиск; высокий, а ответы плохие → модель.","sym":"R@k","legend":[["R@k","нужный чанк в top-k"]],"rdef":"Доля вопросов golden set, для которых нужный фрагмент попал в top-k результатов поиска; метрика retrieval."},{"name":"Faithfulness (groundedness)","level":"L1","def":"Доля утверждений ответа, подтверждённых принесёнными фрагментами; метрика генерации в RAG; оценивается судьёй или человеком.","when":"Контроль галлюцинаций при хорошем поиске.","ex":"Из 348 ответов с найденным фрагментом 335 опираются на него → 96%. Важно: Высокая faithfulness при низком recall — модель честно отвечает по неверным фрагментам.","near":[{"t":"Доля утверждений ответа, которые соответствуют действительности по мнению эксперта, независимо от того, были ли они в принесённых фрагментах.","why":"Faithfulness проверяет опору на контекст, а не истинность вообще."},{"t":"Доля ответов, в которых нужный фрагмент был найден поиском и попал в контекст модели; метрика качества retrieval.","why":"Это recall@k; faithfulness — про генерацию поверх найденного."}],"nb":[{"t":"recall@k","d":"Доля вопросов golden set, для которых нужный фрагмент попал в top-k результатов поиска.","why":"Recall — нашёл ли; faithfulness — не выдумал ли сверх найденного."},{"t":"Галлюцинация","d":"Уверенное утверждение модели, не подтверждённое источниками или фактами.","why":"Галлюцинация — дефект; faithfulness — метрика, которая его считает."}],"apps":{"ok":"Судья сверяет утверждения ответа с фрагментами: 335 из 348 опираются на них — 96%.","okWhy":"Метрика генерации, считается отдельно от поиска.","bad":[{"t":"Команда отчитывается о faithfulness 98% при recall 60% как о хорошем качестве ответов: модель ведь ничего не выдумывает.","why":"Модель честно отвечает по неверным фрагментам; нужна пара метрик."},{"t":"Faithfulness меряют как долю ответов, где нужный фрагмент был в контексте","why":"Это recall; faithfulness — про опору ответа на найденное."},{"t":"Чтобы поднять faithfulness, продакт просит модель «быть убедительнее и ссылаться на документы» в каждом ответе.","why":"Уверенность без валидатора цитат — путь к ложным ссылкам."}]},"simple":"Стажёр не выдумал сверх карточек.","remember":"faithfulness ≥ 95%.","rdef":"Доля утверждений ответа, подтверждённых принесёнными фрагментами; метрика генерации в RAG."},{"name":"ОПЭ / ПРОМ","level":"L1","def":"Опытно-промышленная эксплуатация — работа на реальных данных для ограниченного круга с усиленным контролем; ПРОМ — промышленная эксплуатация для всех после допусков.","when":"Планирование пути запуска и вех с допусками ИБ, ПДн, нагрузки.","ex":"ОПЭ: сотрудники + 1% клиентов, 4 недели, кнопка отключения; ПРОМ — после заключений. Важно: Переход требует заключений: ИБ, ПДн, нагрузка, откат, поддержка, SLA — недели.","near":[{"t":"Опытно-промышленная эксплуатация — работа на синтетических данных в тестовом контуре без реальных клиентов; ПРОМ — первый запуск на реальных данных.","why":"ОПЭ уже идёт на реальных данных для ограниченного круга; тестовый контур — это test."},{"t":"Опытно-промышленная эксплуатация — выкладка новой версии на 5% трафика внутри промышленной среды с автоматическим откатом по метрикам.","why":"Это канарейка — техника выкладки внутри ПРОМ; ОПЭ — отдельный статус с допусками."}],"nb":[{"t":"Канарейка / shadow","d":"Shadow — новая версия отвечает параллельно без показа; канарейка — показ 1–5% трафика с мониторингом и автооткатом.","why":"Канарейка — приём релиза, ОПЭ — формальная стадия жизненного цикла."},{"t":"Eval gate","d":"Ворота релиза: набор порогов на golden set, без прохождения которых версия не идёт дальше.","why":"Gate — проверка качества; допуск в ПРОМ — заключения ИБ, ПДн, нагрузки."}],"apps":{"ok":"ОПЭ: сотрудники + 1% клиентов, 4 недели, кнопка отключения; ПРОМ — после заключений ИБ и ПДн.","okWhy":"Допуски — вехи плана с длительностью.","bad":[{"t":"Команда называет ОПЭ пилотом и пропускает ИБ-допуск: «это же не ПРОМ»","why":"Реальные данные — реальные требования."},{"t":"ОПЭ запускают сразу на всех клиентах, потому что «иначе статистики не наберём» и заказчик ждёт цифры к концу месяца.","why":"ОПЭ — ограниченный круг с усиленным контролем."},{"t":"Переход в ПРОМ назначают по дате в плане, не дожидаясь заключений: сроки уже обещаны руководству.","why":"Решение о ПРОМ — по допускам и метрикам, не по календарю."}]},"simple":"Сначала ограниченный круг под присмотром, потом все.","remember":"ОПЭ → допуски → ПРОМ.","rdef":"ОПЭ — работа на реальных данных для ограниченного круга с усиленным контролем; ПРОМ — для всех после допусков."},{"name":"C4-схема","level":"L1","def":"Нотация архитектурных схем в четырёх уровнях: контекст, контейнеры, компоненты, код. Для агента на доске — уровень контейнеров.","when":"Объяснение архитектуры на собеседовании и в документе видения.","ex":"Каналы → gateway → guard → оркестратор → LLM + поиск → адаптеры → системы банка → guard → канал; сбоку конфиги, трассы, метрики. Важно: Нарисовал — назови NFR: p95, доступность, ПДн, откат.","near":[{"t":"Нотация архитектурных схем в четырёх уровнях: бизнес-процесс, пользовательский путь, экраны и API; для агента на доске — уровень экранов.","why":"Уровни C4 — контекст, контейнеры, компоненты, код; агента рисуют на уровне контейнеров."},{"t":"Формальная нотация диаграмм классов и последовательностей с строгими правилами, которую проверяет инструмент перед согласованием.","why":"Это UML; C4 — лёгкая нотация для разговора и доски."}],"nb":[{"t":"ADR","d":"Architecture decision record — короткий документ: контекст, варианты, решение, последствия, дата пересмотра.","why":"ADR фиксирует решение, C4 — рисует структуру."},{"t":"Платформа агентов","d":"Общие компоненты для всех сценариев: оркестратор, guard, RAG-конвейер, eval, реестр, адаптеры.","why":"Платформа — что изображено; C4 — как изображать."}],"apps":{"ok":"На доске: каналы → gateway → guard → оркестратор → LLM + поиск → адаптеры → системы; рядом NFR.","okWhy":"Уровень контейнеров плюс нефункциональные требования вслух.","bad":[{"t":"Кандидат рисует один квадрат «LLM» и стрелку к клиенту, называя это архитектурой агента, — остальное детали реализации.","why":"Не видно guard, инструментов, данных и контуров."},{"t":"Архитектор требует для первого обсуждения полные UML-диаграммы классов всех сервисов","why":"Для разговора нужен уровень контейнеров; детали — позже."},{"t":"Схема нарисована без указания, где хранятся ПДн и как откатить релиз","why":"Нарисовал — назови NFR: p95, доступность, ПДн, откат."}]},"simple":"Карта города: районы (контейнеры) и дороги (данные), без планов домов.","remember":"Уровень контейнеров + NFR вслух.","rdef":"Нотация архитектурных схем в четырёх уровнях: контекст, контейнеры, компоненты, код; для агента — контейнеры."},{"name":"Golden set","level":"L2","def":"Эталонный набор реальных запросов с рубрикой ожидаемого ответа для офлайн-оценки; 200–1 000 примеров, стратифицированный, обновляемый.","when":"Сравнение версий промптов и моделей; eval gate.","ex":"500 диалогов из логов по интентам и каналам + 50 критических кейсов; рубрика: факты, запреты, тон. Важно: Стареет: обновлять ежемесячно из свежих логов.","near":[{"t":"Эталонный набор запросов, придуманных командой для демонстрации возможностей агента, с единственно правильной фразой ответа на каждый.","why":"Набор берут из реальных логов и оценивают по рубрике, а не по одной фразе."},{"t":"Эталонный набор реальных запросов, собранный один раз перед запуском и зафиксированный, чтобы метрики версий были сопоставимы годами.","why":"Набор стареет вместе с запросами; его обновляют ежемесячно из свежих логов."}],"nb":[{"t":"LLM-as-judge","d":"Использование модели как оценщика ответов по рубрике; валиден после калибровки на человеческой разметке.","why":"Судья оценивает ответы на наборе; набор — материал, судья — инструмент."},{"t":"Eval gate","d":"Ворота релиза: набор порогов на golden set (балл, критические кейсы, p95, стоимость).","why":"Gate — правило решения по результатам на наборе."}],"apps":{"ok":"500 диалогов из логов по интентам, 50 критических кейсов, рубрика; обновление ежемесячно.","okWhy":"Из логов, с критическими кейсами, живой.","bad":[{"t":"Команда сравнивает модели на 15 вопросах, которые сама придумала для демо заказчику, — они самые показательные.","why":"Черри-пик — не измерение."},{"t":"Набор собран год назад и не менялся, чтобы метрики версий были сопоставимы и график качества выглядел непрерывным.","why":"Набор стареет вместе с запросами — обновлять из свежих логов."},{"t":"Эталон в наборе — единственная правильная фраза, любой другой ответ считается ошибкой","why":"Эталон — рубрика: факты, запреты, тон."}]},"simple":"Экзаменационные билеты из реальных вопросов клиентов.","remember":"Из логов, с критическими кейсами, обновляется.","rdef":"Эталонный набор реальных запросов с рубрикой ожидаемого ответа для офлайн-оценки; 200–1 000 примеров."},{"name":"LLM-as-judge","level":"L2","def":"Использование модели как оценщика ответов по рубрике; валиден после калибровки на человеческой разметке (согласие ≥ 85%).","when":"Масштабирование оценки на сотни примеров и еженедельный мониторинг.","ex":"Судья с рубрикой 1–5 по точности и опоре на источники; согласие с людьми 172/200 = 86%. Важно: Смещения: длина, позиция, свои формулировки — парные сравнения с перестановкой.","near":[{"t":"Использование модели как оценщика ответов по рубрике; валиден сразу, потому что модель объективнее людей и не устаёт на сотнях примеров.","why":"Судья валиден только после калибровки на
