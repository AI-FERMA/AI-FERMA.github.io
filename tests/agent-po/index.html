 простоя: резервные узлы амортизируют цену инцидента"],"a":1,"w":"GPU-ноды поднимаются минутами; без запаса пик уходит в очередь."},{"q":"Главный рычаг, если генерация 240 токенов съедает 6 с?","o":["Увеличить таймаут до 15 с, чтобы ни один длинный ответ не обрывался на середине","Ограничить длину ответа и включить streaming","Увеличить top-k, чтобы модель быстрее находила нужное и меньше рассуждала"],"a":1,"w":"Длина ответа — первый рычаг; streaming режет воспринимаемую латентность."}],"rules":["Бюджет p95 раскладывается по компонентам до разработки и проверяется нагрузкой.","Streaming, короткий ответ, параллельные инструменты, кэш, каскад — рычаги латентности.","SLO через перцентили и окно; error budget — валюта: сгорел — freeze.","Ёмкость GPU считается формулой с запасом 30–50%; деградация проектируется заранее.","Трасса по компонентам показывает, кто съел бюджет."]}},{"id":"u3-2","level":"L3","title":"Экономика: стоимость диалога, каскад моделей, ROI","lead":"Unit-экономика ИИ-агента и выбор модели по критериям, а не по хайпу","concept":"Стоимость диалога = Σ по вызовам (входные токены × цена_in + выходные × цена_out) + поиск + guard + инфраструктура. Входных токенов обычно в 5–10 раз больше выходных (системный промпт, история, фрагменты RAG), поэтому длинный системный промпт и большой top-k — главные статьи расходов. Один ход диалога: 3 000 входных + 200 выходных; диалог из 4 ходов с ростом истории — 15–20 тыс. входных. On-prem считают иначе: стоимость GPU-часа / токены в час при реальной загрузке — и простаивающий кластер делает токен дорогим. Рычаги: кэш промпта (prefix caching) для системной части, семантический кэш ответов, сжатие истории, меньший top-k, каскад — маленькая модель решает 60–80% простых запросов, большая — остальное, экономия 40–60% при контроле качества через eval. Выбор модели — матрица: качество на вашем golden set, латентность, стоимость, размещение (данные), лицензия, поддержка языка, доступность. ROI агента: экономия = разрешённые без оператора диалоги × стоимость обращения оператора; плюс конверсия и retention, если продукт продаёт; минус стоимость токенов, инфраструктуры, команды. Горизонт окупаемости и чувствительность к containment rate — то, что ждёт CFO.","points":[{"h":"Формула стоимости диалога","t":"cost = Σ_calls (tok_in × p_in + tok_out × p_out) + c_search + c_guard + c_infra/диалог. Пример: системный промпт 1 500 + RAG 1 200 + история 800 = 3 500 входных, ответ 200; при 4 ходах входные растут до ~5 000 на ход; итого ~17 000 входных и 800 выходных. При ценах 0,5 ₽ и 1,5 ₽ за 1 000 токенов: 8,5 + 1,2 ≈ 9,7 ₽ плюс поиск и guard ~1 ₽ → ≈ 11 ₽ за диалог. Умножить на 300 000 диалогов в месяц — 3,3 млн ₽. Теперь понятно, зачем резать системный промпт и кэшировать."},{"h":"Каскад и маршрутизация","t":"Маршрутизатор (классификатор или малая модель) оценивает сложность; простые интенты (баланс, статус, FAQ) идут в малую модель, сложные (спор, консультация) — в большую. Условие: качество на golden set по каждой ветке не ниже порога; каскад с fallback — если малая модель не уверена, передаёт большой. Экономия 40–60% токен-расходов при 60–80% трафика на малой. Побочный эффект — латентность ниже на простых. Риск — маршрутизатор ошибается: меряют отдельно."},{"h":"Выбор модели: матрица критериев","t":"Столбцы: качество на вашем golden set (не на публичном бенчмарке), p95 и TTFT, стоимость за диалог, размещение (on-prem возможна? ПДн?), лицензия (коммерческое использование), русский язык, контекстное окно, function calling и structured output, стабильность версий, поддержка вендора. Взвешивание по продукту: для чат-поддержки вес качества и стоимости, для внутреннего ассистента юристов — качество и контекст. Решение фиксируется в ADR с датой пересмотра: рынок меняется каждые полгода."},{"h":"ROI и разговор с финансами","t":"Экономия = диалоги_без_оператора × стоимость_обращения (например, 150 ₽) — это при условии, что качество не хуже (иначе возвраты и жалобы съедят экономию). Доход — если агент продаёт: прирост конверсии × средний чек × маржа. Затраты — токены/GPU, команда (разработка + поддержка модели), лицензии, инфраструктура, допуски. Чувствительность: при containment 40% проект окупается за 9 месяцев, при 25% — за 20; показать это таблицей — и заказчик сам поймёт, почему eval и качество важнее «запустить быстрее»."}],"practice":{"mechanic":"numeric","points":3,"stem":"Диалог: 17 000 входных и 800 выходных токенов. Цена: 0,5 ₽ за 1 000 входных и 1,5 ₽ за 1 000 выходных. Плюс поиск и guard 1 ₽. Стоимость диалога в рублях?","answer":10.7,"tol":0.1,"unit":"₽","solution":"17 × 0,5 = 8,5 ₽; 0,8 × 1,5 = 1,2 ₽; + 1 ₽ = 10,7 ₽. Входные токены — 80% стоимости: рычаги — короче системный промпт, prefix caching, меньше top-k, сжатие истории.","anchor":{"g":"cost","p":{"lines":[["входные 17k","8,5 ₽"],["выходные 0,8k","1,2 ₽"],["поиск + guard","1,0 ₽"]],"total":"10,7 ₽ / диалог"},"cap":"входные токены — главная статья"},"id":"u3-2-p"},"test":[{"mechanic":"single","points":2,"stem":"Входные токены дают 80% стоимости диалога. Какой рычаг первый?","options":[{"id":"o0","text":"Prefix caching системного промпта, сжатие истории, меньший top-k","correct":true,"rationale":"Бьём по самой большой статье."},{"id":"o1","text":"Снизить температуру: при нуле модель генерирует короче и стабильнее","correct":false,"rationale":"Не влияет на число токенов."},{"id":"o2","text":"Сократить ответы до 50 токенов: выходные токены втрое дороже входных","correct":false,"rationale":"Выходные — 11% стоимости, эффект мал."},{"id":"o3","text":"Отключить guard на простых интентах: он удваивает число вызовов","correct":false,"rationale":"Экономия 10% ценой безопасности."}],"anchor":{"g":"cost","p":{"lines":[["system prompt","кэш"],["история","сжать"],["RAG top-k","5 → 3"]],"total":"−35% входных"},"cap":"режь самую большую статью"},"id":"u3-2-t0"},{"mechanic":"single","points":2,"stem":"Что обязательно проверить перед включением каскада «малая модель для простых интентов»?","options":[{"id":"o0","text":"Качество на golden set по каждой ветке и точность маршрутизатора — отдельно","correct":true,"rationale":"Экономия без контроля качества — ловушка."},{"id":"o1","text":"Что малая модель дешевле с учётом инфраструктуры","correct":false,"rationale":"Это и так известно."},{"id":"o2","text":"Что заказчик согласен на любую экономию, если средний балл качества не падает","correct":false,"rationale":"Заказчик не отвечает за качество ветки."},{"id":"o3","text":"Что большая модель больше не нужна и её можно отключить ради упрощения системы","correct":false,"rationale":"Каскад подразумевает обе."}],"anchor":{"g":"cascade","p":{"levels":["маршрутизатор","малая: FAQ, баланс (70%)","большая: споры, консультации (30%)"],"hl":1,"note":"eval по веткам"},"cap":"каскад — с eval по каждой ветке"},"id":"u3-2-t1"},{"mechanic":"single","points":2,"stem":"Почему публичный бенчмарк — не основание выбирать модель для банка?","options":[{"id":"o0","text":"Он не меряет ваши задачи, ваш промпт, русский язык ваших клиентов и ограничения размещения","correct":true,"rationale":"Критерии — в матрице под продукт."},{"id":"o1","text":"Бенчмарки всегда фальсифицированы вендорами, которые обучают модели на тестовых наборах","correct":false,"rationale":"Не всегда; они просто про другое."},{"id":"o2","text":"Банку запрещено опираться на внешние рейтинги при выборе поставщиков программного обеспечения","correct":false,"rationale":"Нет такого запрета."},{"id":"o3","text":"Потому что бенчмарк платный и его результаты нельзя приложить к закупочной документации","correct":false,"rationale":"Дело не в цене."}],"anchor":{"g":"quad","p":{"x":"стоимость","y":"качество на вашем golden set","pts":[["A",0.3,0.8],["B",0.8,0.85],["C",0.2,0.5]],"hl":0},"cap":"качество меряется на вашем наборе"},"id":"u3-2-t2"},{"mechanic":"single","points":2,"stem":"Как объяснить CFO, зачем тратить квартал на eval вместо «запустить быстрее»?","options":[{"id":"o0","text":"Показать чувствительность окупаемости к containment: 40% — 9 месяцев, 25% — 20","correct":true,"rationale":"ROI — язык, который CFO понимает."},{"id":"o1","text":"Сослаться на практику лидеров рынка: без eval-платформы команда не считается зрелой, и аудит это отметит","correct":false,"rationale":"Апелляция к авторитету — не экономика; CFO ждёт цифры."},{"id":"o2","text":"Пообещать, что при правильном eval ошибок у агента не будет","correct":false,"rationale":"Ошибки у вероятностной системы будут; обещают измерение и снижение."},{"id":"o3","text":"Отказаться от eval, чтобы уложиться в срок, и наверстать качество по жалобам после запуска","correct":false,"rationale":"Снижает containment — и ROI."}],"anchor":{"g":"bars","p":{"v":[9,13,20],"lbl":["cont. 40%","32%","25%"],"note":"месяцев до окупаемости"},"cap":"качество двигает срок окупаемости"},"id":"u3-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре структуры стоимости диалога. Какая — после оптимизации, сохраняющей качество?","vopts":[{"id":"v0","v":{"g":"bars","p":{"v":[5.5,1.2,1.0],"lbl":["in","out","infra"],"max":9}},"lbl":"","correct":true,"rationale":"Входные снижены кэшем и top-k, ответ и guard на месте."},{"id":"v1","v":{"g":"bars","p":{"v":[8.5,1.2,1.0],"lbl":["in","out","infra"],"max":9}},"lbl":"","correct":false,"rationale":"Исходная структура: 80% — входные."},{"id":"v2","v":{"g":"bars","p":{"v":[8.5,0.3,1.0],"lbl":["in","out","infra"],"max":9,"warn":true}},"lbl":"","correct":false,"rationale":"Урезали ответы до обрубков: экономия 1 ₽, качество пострадало."},{"id":"v3","v":{"g":"bars","p":{"v":[8.5,1.2,0.0],"lbl":["in","out","infra"],"max":9,"warn":true}},"lbl":"","correct":false,"rationale":"Отключили guard и поиск: дешевле на 1 ₽ и опасно."}],"id":"u3-2-t4"}],"framework":"cost = Σ(tok_in × p_in + tok_out × p_out) + поиск + guard + инфра; входные — 5–10× выходных, главная статья. Рычаги: prefix caching, сжатие истории, top-k, каскад (40–60% экономии при eval по веткам). Выбор модели — матрица под продукт, фиксируется в ADR с датой пересмотра. ROI = диалоги без оператора × стоимость обращения − затраты; показывать чувствительность к containment.","anchor":{"g":"cost","p":{"lines":[["входные","80%"],["выходные","11%"],["поиск + guard","9%"]],"total":"≈ 11 ₽ / диалог"},"cap":"unit-экономика агента на одной карточке"},"layers":{"simple":"Каждый ответ агента — это счёт: за каждое слово, которое модель прочитала, и за каждое, которое написала. Читает она в разы больше, чем пишет: инструкции, историю разговора, принесённые документы. Поэтому дорого не «говорить», а «читать».\nЭкономят так: инструкции кэшируют (читать второй раз бесплатно), длинную историю сжимают, документов приносят не десять, а три. И не ставят самую дорогую модель на вопрос «какой у меня баланс» — для него хватит дешёвой, а дорогую оставляют для сложных.\nДля финансов всё сводится к одной таблице: сколько обращений агент закрыл без оператора, во сколько обошёлся, когда окупится — и как этот срок зависит от качества.\nПроверь себя: входные токены — 80% стоимости; какой рычаг первый?","how":"1. Стоимость хода = tok_in × p_in + tok_out × p_out; диалог — сумма по ходам с растущей историей, плюс поиск, guard, инфраструктура. On-prem: стоимость GPU-часа ÷ токены в час при реальной загрузке.\n2. Пример: 17 000 входных × 0,5 ₽/1k + 800 выходных × 1,5 ₽/1k + 1 ₽ = 10,7 ₽; 300 000 диалогов → 3,2 млн ₽/мес.\n3. Рычаги: prefix caching системного промпта; сжатие истории (резюме после 3 ходов); top-k 5 → 3; ограничение длины ответа; семантический кэш FAQ; каскад: маршрутизатор → малая модель (60–80% трафика) / большая; eval по каждой ветке и точность маршрутизатора.\n4. Выбор модели: матрица — качество на своём golden set, p95/TTFT, стоимость, размещение и ПДн, лицензия, русский язык, контекст, function calling, стабильность версий. Взвешивание под продукт; ADR с датой пересмотра.\n5. ROI: экономия = диалоги без оператора × стоимость обращения (150 ₽); доход = Δконверсия × чек × маржа; затраты = токены/GPU + команда + лицензии + допуски. Чувствительность к containment: 40% → 9 мес, 25% → 20 мес.","formula":{"f":"cost_диалог = Σ_ходов (tok_in × p_in + tok_out × p_out) + c_search + c_guard + c_infra\nROI_мес = N_диалогов × containment × c_оператора − затраты_мес","legend":[["tok_in","системный промпт + история + RAG-фрагменты","3 000–5 000 на ход"],["tok_out","длина ответа","150–300"],["p_in, p_out","цена за 1 000 токенов","0,5 ₽ / 1,5 ₽"],["containment","доля диалогов без оператора","40%"],["c_оператора","стоимость обращения в кол-центр","150 ₽"],["каскад","малая модель на простые интенты","−40–60% токенов"]],"note":"Входные токены — главная статья; срок окупаемости чувствителен к качеству сильнее, чем к цене токена."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Входные токены — 5–10× выходных и главная статья; режь их первыми: кэш, сжатие истории, top-k.\n— Каскад даёт 40–60% экономии только с eval по каждой ветке и измеренным маршрутизатором.\n— Модель выбирается матрицей под продукт на своём golden set; ADR с датой пересмотра.\n— ROI = диалоги без оператора × стоимость обращения − затраты; показывай чувствительность к containment.\n— Считай на 300 000 диалогов в месяц — тогда видно, что оптимизировать.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Входные токены — 80% стоимости. Первый рычаг?","o":["Снизить температуру: при нуле модель пишет короче и стабильнее, что экономит токены","Prefix caching, сжатие истории, меньший top-k","Сократить ответы до 50 токенов"],"a":1,"w":"Бьём по самой большой статье; выходные — лишь 11%."},{"q":"Что проверить перед включением каскада?","o":["Что малая модель дешевле с учётом инфраструктуры","Качество по каждой ветке на golden set и точность маршрутизатора","Что заказчик согласен на экономию при неизменном среднем балле судьи"],"a":1,"w":"Экономия без контроля качества — ловушка; каскад — с eval по веткам."},{"q":"В формуле ROI что такое containment?","o":["Доля диалогов, завершённых без оператора","Доля диалогов с жалобой «неверный ответ» в течение недели после обращения","Доля ответов, отданных из семантического кэша без вызова модели"],"a":0,"w":"Это главный множитель экономии; качество двигает его, а значит и срок окупаемости."},{"q":"Почему публичный бенчмарк не основание выбора модели?","o":["Бенчмарки фальсифицированы вендорами, которые обучают модели на тестовых наборах","Он не меряет ваши задачи, промпт, язык и ограничения размещения","Бенчмарк платный, и его результаты нельзя приложить к закупочной документации"],"a":1,"w":"Качество меряется на своём golden set; остальные критерии — в матрице под продукт."}],"rules":["Входные токены — 5–10× выходных и главная статья; режь их первыми: кэш, сжатие истории, top-k.","Каскад даёт 40–60% экономии только с eval по каждой ветке и измеренным маршрутизатором.","Модель выбирается матрицей под продукт на своём golden set; ADR с датой пересмотра.","ROI = диалоги без оператора × стоимость обращения − затраты; показывай чувствительность к containment.","Считай на 300 000 диалогов в месяц — тогда видно, что оптимизировать."]}},{"id":"u4-1","level":"L4","title":"CJM и исследования для ИИ-агента","lead":"Где в пути клиента агент даёт ценность, и как это проверить до разработки","concept":"CJM (customer journey map) для ИИ-агента строится не вокруг «чата», а вокруг задачи клиента: «разобраться со списанием», «оформить кредитные каникулы», «понять, почему отклонили перевод». По шагам пути отмечают действия, каналы, эмоции, время, точки боли и текущую стоимость для банка (обращения в кол-центр, отток). Агент встраивается там, где боль высокая, задача повторяемая, данные доступны через API, а риск ошибки управляем. Исследования: количественные — логи кол-центра и чатов (топ интентов по объёму и стоимости, доля повторных обращений), воронки в приложении; качественные — интервью с клиентами и операторами (операторы знают, где клиенты застревают), анализ транскриптов. Специфика ИИ: прототип за день — промпт с RAG на реальных документах (Wizard-of-Oz или живая модель) — и тест на 10–20 реальных диалогах до того, как писать код; исследование рынка — что уже делают конкуренты и вендоры, где ожидания клиентов сдвинулись (ответ «сейчас», персонализация). Выход исследования — приоритизированный список сценариев с оценкой объёма, стоимости обращения, достижимого containment и риска.","points":[{"h":"CJM вокруг задачи, а не канала","t":"Строки карты: шаги задачи (осознал → искал → обратился → ждал → получил ответ → проверил → завершил). Столбцы: действия клиента, канал, время, эмоция, точка боли, что происходит в банке (система, сотрудник, стоимость), возможность для агента. Пример «списание за подписку»: клиент видит списание → ищет в приложении → не находит → звонит → ждёт 6 минут → оператор смотрит историю → объясняет → клиент хочет отменить → переводят. Агент снимает поиск, ожидание и объяснение; отмену — оставляет с подтверждением."},{"h":"Данные, которые уже есть","t":"Логи кол-центра и чата: интенты (классификатором по транскриптам), объём, AHT (среднее время обработки), стоимость обращения, повторные обращения в 7 дней (признак нерешённой задачи), CSAT по интентам. Продуктовая аналитика: где в приложении клиент искал перед обращением (поиск, разделы). Из этого — матрица «объём × стоимость × решаемость агентом»: топ-10 интентов обычно дают 50–60% обращений."},{"h":"Качественное исследование и прототип за день","t":"Интервью: 6–8 клиентов на сценарий с заданием «покажите, как вы это делали»; 4–5 операторов — «где клиенты чаще всего не понимают». Транскрипты: читать 50 диалогов подряд — глазами, не только классификатором. Прототип: системный промпт + реальные документы в RAG + реальные (обезличенные) вопросы из логов — смотреть качество, тон, где нужны инструменты. Это исследование и техническая разведка одновременно: через день понятно, достаточно ли документов и каких API не хватает."},{"h":"Рынок и тренды как вход в приоритизацию","t":"Что делают банки-конкуренты и вендоры: где ассистент закрывает действия, а не только FAQ; ожидания клиентов растут («почему он не может просто сделать это?»). Тренды ГенИИ, влияющие на план: агентные сценарии с инструментами, мультимодальность (фото документа, голос), малые модели on-prem, регуляторика ИИ. Вывод для TPO — не «внедрить всё», а обоснованный выбор сценариев и отложенный список с условиями пересмотра."}],"practice":{"mechanic":"matching","points":3,"stem":"Сопоставьте шаг исследования и его результат.","pairs":[{"l":"Классификация транскриптов кол-центра","r":"Топ интентов по объёму, стоимости и повторным обращениям"},{"l":"Интервью с операторами","r":"Точки, где клиенты не понимают ответ или застревают"},{"l":"Прототип промпт + RAG на реальных документах","r":"Достаточность базы знаний и список недостающих API"},{"l":"Анализ конкурентов и вендоров","r":"Сдвиг ожиданий клиентов и отложенные сценарии с условиями пересмотра"},{"l":"CJM вокруг задачи клиента","r":"Шаги с болью, временем и стоимостью, где агент встраивается"}],"solution":"Каждый метод отвечает на свой вопрос: что болит и сколько стоит (логи), почему (операторы, клиенты), сможем ли технически (прототип), куда движется рынок (конкуренты), где именно встроиться (CJM).","anchor":{"g":"cjm","p":{"steps":["осознал","искал","обратился","ждал","получил","завершил"],"pain":[1,2,3],"agent":[1,2,3,4]},"cap":"агент снимает боль на шагах, где она измерена"},"id":"u4-1-p"},"test":[{"mechanic":"single","points":2,"stem":"С чего начать выбор первого сценария для агента в банке?","options":[{"id":"o0","text":"С логов кол-центра: интенты по объёму, стоимости и повторным, затем решаемость через API и риск","correct":true,"rationale":"Данные уже есть; они дают приоритет."},{"id":"o1","text":"С самого технологически интересного сценария: он покажет возможности платформы и вдохновит команду","correct":false,"rationale":"Интерес команды — не ценность клиента."},{"id":"o2","text":"С пожелания заказчика «сделайте как у конкурента», потому что он знает рынок и отвечает за бюджет","correct":false,"rationale":"Пожелание — вход, но не основание."},{"id":"o3","text":"С опроса клиентов «хотите ли вы ИИ-ассистента» и какие задачи они ему доверили бы","correct":false,"rationale":"Клиенты хотят решить задачу, а не ИИ."}],"anchor":{"g":"quad","p":{"x":"решаемость агентом","y":"объём × стоимость","pts":[["подписки",0.8,0.9],["споры",0.4,0.8],["баланс",0.9,0.3]],"hl":0},"cap":"объём × стоимость × решаемость"},"id":"u4-1-t0"},{"mechanic":"single","points":2,"stem":"Зачем читать 50 транскриптов подряд, если есть классификатор интентов?","options":[{"id":"o0","text":"Классификатор даёт объём, глаза дают причину: формулировки, эмоции, где клиент не понял ответ","correct":true,"rationale":"Количество и качество — разные вопросы."},{"id":"o1","text":"Чтобы проверить классификатор и исправить разметку интентов там, где он ошибается чаще всего","correct":false,"rationale":"Побочная польза, не цель."},{"id":"o2","text":"Потому что классификатор запрещён для транскриптов с ПДн, а ручное чтение разрешено регламентом","correct":false,"rationale":"Обезличенные транскрипты можно классифицировать."},{"id":"o3","text":"Не нужно: классификатора достаточно, а чтение транскриптов — задача аналитика кол-центра","correct":false,"rationale":"Тогда не увидите, почему повторные обращения."}],"anchor":{"g":"cjm","p":{"steps":["обратился","получил ответ","не понял","обратился снова"],"pain":[2,3],"agent":[]},"cap":"повторные обращения — признак нерешённой задачи"},"id":"u4-1-t1"},{"mechanic":"single","points":2,"stem":"Что даёт прототип «промпт + RAG на реальных документах» за день до разработки?","options":[{"id":"o0","text":"Достаточность базы знаний, тон, список недостающих API — до кода","correct":true,"rationale":"Дёшево узнать, что не хватает, до кода."},{"id":"o1","text":"Готовый продукт для запуска в ОПЭ, если качество на двадцати реальных вопросах оказалось приемлемым","correct":false,"rationale":"Прототип — не продукт."},{"id":"o2","text":"Точную оценку сроков разработки, потому что после прототипа технических неизвестных уже не остаётся","correct":false,"rationale":"Оценка — после, но прототип её уточняет."},{"id":"o3","text":"Доказательство для заказчика, что агент отвечает лучше оператора на типовые вопросы клиентов","correct":false,"rationale":"Это доказывается eval и онлайн."}],"anchor":{"g":"pipeline","p":{"steps":["промпт","RAG на реальных доках","20 реальных вопросов","выводы: доки, API, тон"],"hl":[3]},"cap":"прототип за день — до кода"},"id":"u4-1-t2"},{"mechanic":"single","points":2,"stem":"Как правильно использовать тренды ГенИИ в продуктовой стратегии агента?","options":[{"id":"o0","text":"Как вход в приоритизацию: выбрать сценарии сейчас, отложить остальное с условиями пересмотра","correct":true,"rationale":"Тренд — не задача, а контекст решения."},{"id":"o1","text":"Внедрить всё, что появилось за год, чтобы не отстать от конкурентов и показать технологическое лидерство","correct":false,"rationale":"Распыление без ценности."},{"id":"o2","text":"Игнорировать: банк консервативен, а клиенты ценят стабильность больше новых возможностей","correct":false,"rationale":"Ожидания клиентов сдвигаются независимо от банка."},{"id":"o3","text":"Копировать решения конкурента один в один: они уже проверили, что работает на этом рынке","correct":false,"rationale":"У конкурента другие данные и клиенты."}],"anchor":{"g":"timeline","p":{"items":["сейчас: подписки + споры","Q+2: голос","Q+3: фото документов","пересмотр: малые модели on-prem"],"hl":0},"cap":"тренд → отложенный список с условиями"},"id":"u4-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре карты пути «разобраться со списанием». Какая правильно показывает, где встраивать агента?","vopts":[{"id":"v0","v":{"g":"cjmv","p":{"n":6,"pain":[1,2,3],"agent":[1,2,3,4],"keep":[5]}},"lbl":"","correct":true,"rationale":"Агент снимает поиск, ожидание и объяснение; отмена — с подтверждением человека/кнопки."},{"id":"v1","v":{"g":"cjmv","p":{"n":6,"pain":[1,2,3],"agent":[0,1,2,3,4,5],"keep":[]}},"lbl":"","correct":false,"rationale":"Агент везде, включая необратимое действие без подтверждения."},{"id":"v2","v":{"g":"cjmv","p":{"n":6,"pain":[1,2,3],"agent":[5],"keep":[]}},"lbl":"","correct":false,"rationale":"Агент только на последнем шаге, боль не снята."},{"id":"v3","v":{"g":"cjmv","p":{"n":6,"pain":[],"agent":[1,2,3,4],"keep":[5]}},"lbl":"","correct":false,"rationale":"Боль не измерена — непонятно, зачем здесь агент."}],"id":"u4-1-t4"}],"framework":"CJM вокруг задачи клиента: шаги, боль, время, стоимость для банка, место агента. Данные есть: логи кол-центра (интенты × объём × стоимость × повторные), аналитика приложения. Качественно: интервью с операторами и клиентами, 50 транскриптов глазами. Прототип промпт + RAG за день — исследование и техразведка. Тренды — вход в приоритизацию, не список задач.","anchor":{"g":"cjm","p":{"steps":["осознал","искал","обратился","ждал","получил","завершил"],"pain":[1,2,3],"agent":[1,2,3,4]},"cap":"агент там, где боль измерена и данные доступны"},"layers":{"simple":"Прежде чем ставить робота-помощника в магазине, смотрят, где покупатели чаще всего теряются и зовут продавца. Карта пути — это маршрут покупателя с отметками: тут искал и не нашёл, тут ждал шесть минут, тут не понял объяснение.\nГде искать такие отметки? В записях кол-центра уже есть всё: что спрашивают, сколько это стоит банку, кто звонит повторно. Операторы расскажут, где клиенты не понимают. Пятьдесят разговоров, прочитанных подряд, дадут то, чего не даст статистика.\nА потом — быстрый макет: инструкции модели плюс реальные документы, и двадцать настоящих вопросов. За день видно, хватает ли документов и каких данных не достать.\nПроверь себя: с чего начать выбор первого сценария?","how":"1. CJM: строки — шаги задачи клиента; столбцы — действия, канал, время, эмоция, боль, что происходит в банке и сколько стоит, возможность для агента. Задача, не канал.\n2. Количественно: классификация транскриптов → интенты × объём × стоимость обращения × повторные в 7 дней × CSAT. Продуктовая аналитика: где искал перед обращением. Матрица объём × стоимость × решаемость через API × риск.\n3. Качественно: 6–8 клиентов на сценарий («покажите, как делали»), 4–5 операторов («где не понимают»), 50 транскриптов подряд.\n4. Прототип за день: системный промпт + реальные документы в RAG + 20 обезличенных реальных вопросов → достаточность базы, тон, недостающие API, где нужны инструменты.\n5. Рынок: конкуренты и вендоры, сдвиг ожиданий, тренды (агентные действия, мультимодальность, малые модели on-prem, регуляторика) → выбранные сценарии и отложенный список с условиями пересмотра.\n6. Выход: приоритизированный список сценариев с объёмом, стоимостью, достижимым containment и риском — вход в roadmap.","formula":{"f":"приоритет сценария ≈ объём × стоимость_обращения × достижимый_containment ÷ (риск × усилие)","legend":[["объём","обращений в месяц по интенту","40 000"],["стоимость_обращения","кол-центр / чат оператора","150 ₽ / 60 ₽"],["достижимый_containment","доля, которую агент закроет без оператора","50% для FAQ, 20% для споров"],["риск","цена ошибки: деньги, регулятор, репутация","низкий для статусов, высокий для переводов"],["усилие","API, документы, допуски","недели"]],"note":"Топ-10 интентов обычно дают 50–60% обращений — первый сценарий почти всегда среди них."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— CJM строится вокруг задачи клиента, с болью, временем и стоимостью для банка.\n— Логи кол-центра — главный источник приоритета: объём × стоимость × повторные.\n— Операторы и 50 транскриптов глазами объясняют «почему».\n— Прототип промпт + RAG за день — до кода; он же техразведка.\n— Тренды → выбранные сценарии + отложенный список с условиями пересмотра.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"С чего начать выбор первого сценария?","o":["С технологически интересного сценария, который покажет возможности платформы команде и руководству","С логов кол-центра: объём × стоимость × повторные, затем решаемость и риск","С опроса клиентов «хотите ли вы ИИ-ассистента» и какие задачи они ему доверили бы"],"a":1,"w":"Данные уже есть и дают приоритет; клиенты хотят решить задачу, а не ИИ."},{"q":"Что даёт прототип промпт + RAG за день?","o":["Готовый продукт для ОПЭ, если качество на двадцати вопросах оказалось приемлемым","Достаточность базы знаний, тон, недостающие API — до кода","Точную оценку сроков разработки: после прототипа неизвестных почти не остаётся"],"a":1,"w":"Исследование и техразведка одновременно, дёшево."},{"q":"В формуле приоритета что такое достижимый containment?","o":["Доля обращений по интенту среди всех обращений в кол-центр за месяц","Доля диалогов, которые агент закроет без оператора","Доля клиентов с установленным приложением, которым доступен канал агента"],"a":1,"w":"Для FAQ — высокий, для споров — низкий; это и отличает сценарии."},{"q":"Как использовать тренды ГенИИ?","o":["Внедрить всё, что появилось за год, чтобы не отстать от конкурентов и показать лидерство","Как вход в приоритизацию с отложенным списком и триггерами пересмотра","Игнорировать: банк консервативен, а клиенты ценят стабильность выше новизны"],"a":1,"w":"Тренд — контекст решения, не задача."}],"rules":["CJM строится вокруг задачи клиента, с болью, временем и стоимостью для банка.","Логи кол-центра — главный источник приоритета: объём × стоимость × повторные.","Операторы и 50 транскриптов глазами объясняют «почему».","Прототип промпт + RAG за день — до кода; он же техразведка.","Тренды → выбранные сценарии + отложенный список с условиями пересмотра."]}},{"id":"u4-2","level":"L4","title":"Метрики ИИ-продукта: от North Star до hallucination rate","lead":"Дерево метрик, которое связывает бизнес, качество и технику","concept":"Метрики ИИ-агента образуют дерево. Вверху — бизнес: экономия на обращениях, конверсия (если агент продаёт или сопровождает), retention/отток клиентов, NPS/CSAT. Ниже — продуктовые: containment rate (доля диалогов, завершённых без оператора), task success rate (задача клиента решена — по разметке или по сигналу, например «не обратился повторно за 7 дней»), доля эскалаций и их причины, повторные обращения, время до решения, доля активных пользователей агента среди обратившихся. Ниже — качество модели: faithfulness/hallucination rate, точность интентов, качество по рубрике судьи, доля «не знаю», доля жалоб «неверный ответ». Внизу — технические: p95, доступность, ошибки инструментов, стоимость диалога. Ключевая связь: containment без task success — ловушка (агент «удержал» клиента, но не решил задачу → повторные обращения, отток). Поэтому North Star — не containment, а «решённые задачи без оператора при CSAT не ниже оператора». Метрики-ограничители (guardrail metrics): жалобы, hallucination rate, эскалации по гневу — не должны ухудшаться при росте главной. Дашборд TPO: 1 North Star, 3–5 драйверов, 3–4 ограничителя, техпанель; еженедельный разбор с разметкой выборки диалогов.","points":[{"h":"Дерево метрик сверху вниз","t":"Бизнес: экономия = решённые без оператора × стоимость обращения; конверсия в продукт после диалога; отток в сегменте, использовавшем агента (с осторожностью — селекция). Продукт: containment, task success, эскалации (по причинам), повторные обращения в 7 дней, время до решения. Качество: faithfulness, hallucination rate, точность интента, балл судьи, «не знаю» rate, жалобы. Техника: p95/TTFT, доступность, ошибки инструментов, стоимость диалога. Каждая метрика ниже объясняет движение метрики выше."},{"h":"Containment против task success","t":"Containment легко накрутить: не давать кнопку «оператор», отвечать уверенно на всё. Task success честнее, но дороже мерить: разметка выборки (человек или калиброванный судья: «задача решена?»), поведенческий прокси (нет повторного обращения по тому же интенту за 7 дней), явный сигнал клиента («помогло?»). Отчёт всегда парный: containment 45% при task success 82% и CSAT 4,3 — хорошо; containment 60% при task success 60% — агент удерживает и не решает."},{"h":"Guardrail-метрики и еженедельный разбор","t":"Ограничители: hallucination rate (выборка 200 диалогов/неделю), жалобы «неверный ответ», эскалации по гневу, доля обрывов диалога, p95, стоимость. Правило: рост North Star не засчитывается, если ограничитель ушёл за порог. Ритуал: еженедельно 30 минут — 20 случайных диалогов глазами всей командой, топ-3 дефекта в бэклог. Это дешевле любого дашборда и быстрее находит новые типы ошибок."},{"h":"Что говорить на собеседовании про метрики","t":"Назвать North Star с условием качества, 3–5 драйверов, ограничители, техпанель — за 60 секунд. Объяснить, как метрики связаны с eval: офлайн-балл судьи предсказывает онлайн task success? Если нет — golden set не репрезентативен. Назвать целевые значения из практики: containment 30–50% на поддержке в первый год, task success > 80%, hallucination < 2%, p95 < 5 с, CSAT не ниже оператора. Сказать, чего не меряем намеренно и почему."}],"practice":{"mechanic":"sjt_bw","points":3,"stem":"Через месяц после запуска containment вырос с 35% до 55%, а повторные обращения в 7 дней по тем же интентам выросли с 12% до 21%. Заказчик доволен ростом containment. Лучшее и худшее действие TPO?","options":[{"id":"s0","text":"Показать пару containment / повторные, разметить 200 диалогов на task success, вернуть эскалацию","correct":true,"rationale":"Containment без task success — ловушка; измерить и починить."},{"id":"s1","text":"Доложить о росте containment как об успехе и запланировать расширение на соседние интенты в следующем квартале","correct":false,"rationale":"Скрывает ухудшение опыта клиента."},{"id":"s2","text":"Откатить агента полностью до разбора и вернуть все обращения операторам, пока причина не найдена","correct":false,"rationale":"Избыточно: проблема локализуется по интентам."},{"id":"s3","text":"Убрать метрику повторных обращений из дашборда как шумную: она зависит от сезона, маркетинговых кампаний и каналов","correct":false,"rationale":"Удаление сигнала вместо реакции."}],"worst":"s3","worstRationale":"Убрать неудобную метрику — худшее: это отказ от честного измерения, и заказчик узнает об оттоке позже и дороже.","anchor":{"g":"tree","p":{"root":"решённые задачи без оператора","kids":["containment 55% ↑","повторные 21% ↑ ⚠","CSAT ?","hallucination ?"]},"cap":"containment растёт — проверь task success"},"id":"u4-2-p"},"test":[{"mechanic":"single","points":2,"stem":"Почему containment rate — плохая North Star сама по себе?","options":[{"id":"o0","text":"Её легко накрутить, удерживая клиента без решения задачи; нужна пара с task success и CSAT","correct":true,"rationale":"Главная метрика — с условием качества."},{"id":"o1","text":"Потому что она не считается автоматически и требует дорогой ручной разметки диалогов","correct":false,"rationale":"Считается легко — в этом и проблема."},{"id":"o2","text":"Потому что регулятор запрещает оценивать качество обслуживания долей автоматических ответов","correct":false,"rationale":"Нет такого запрета."},{"id":"o3","text":"Потому что операторы против метрики, которая измеряет, сколько работы у них забрал агент","correct":false,"rationale":"Позиция операторов не определяет валидность метрики."}],"anchor":{"g":"compare","p":{"a":["containment 60%","task success 60%"],"b":["containment 45%","task success 82%"],"verdict":"второй агент лучше"},"cap":"удержал ≠ решил"},"id":"u4-2-t0"},{"mechanic":"single","points":2,"stem":"Как измерить task success без ручной разметки каждого диалога?","options":[{"id":"o0","text":"Прокси «нет повторного обращения 7 дней» + разметка выборки + сигнал «помогло?»","correct":true,"rationale":"Три источника, сверяемые между собой."},{"id":"o1","text":"Считать успехом каждый диалог, где клиент поблагодарил или не задал уточняющего вопроса после ответа","correct":false,"rationale":"Вежливость — не решение."},{"id":"o2","text":"Принять containment за task success: если клиент не позвал оператора, значит, задача была решена","correct":false,"rationale":"Это и есть ловушка."},{"id":"o3","text":"Спрашивать операторов, насколько хорошо агент решал задачи в диалогах, которые до них дошли","correct":false,"rationale":"Операторы не видят автоматические диалоги."}],"anchor":{"g":"evalPyr","p":{"hl":"online","note":"прокси + выборка + сигнал клиента"},"cap":"task success — из трёх источников"},"id":"u4-2-t1"},{"mechanic":"single","points":2,"stem":"Что такое guardrail-метрика в дашборде агента?","options":[{"id":"o0","text":"Ограничитель, который не должен ухудшаться при росте главной метрики","correct":true,"rationale":"Рост North Star засчитывается только в пределах ограничителей."},{"id":"o1","text":"Метрика работы guard-сервиса: доля заблокированных запросов и ложных срабатываний входного фильтра","correct":false,"rationale":"Созвучно, но другое."},{"id":"o2","text":"Любая техническая метрика на дашборде: латентность, доступность, ошибки инструментов и стоимость","correct":false,"rationale":"Техпанель — отдельный слой."},{"id":"o3","text":"Метрика, которую смотрит только ИБ: число атак и утечек, не влияющая на продуктовые решения","correct":false,"rationale":"Смотрит вся команда еженедельно."}],"anchor":{"g":"tree","p":{"root":"North Star","kids":["драйверы ×4","ограничители ×4 ⚠","техпанель"]},"cap":"1 North Star · 3–5 драйверов · ограничители"},"id":"u4-2-t2"},{"mechanic":"single","points":2,"stem":"Офлайн-балл судьи вырос, онлайн task success не изменился. Что это значит?","options":[{"id":"o0","text":"Golden set нерепрезентативен: офлайн не предсказывает онлайн — пересобрать из логов","correct":true,"rationale":"Связь слоёв пирамиды — обязательная проверка."},{"id":"o1","text":"Онлайн-метрика сломана или считается с запозданием: эффект проявится через несколько недель","correct":false,"rationale":"Возможно, но сначала проверить связь."},{"id":"o2","text":"Судья точнее поведенческих метрик: нужно подождать, пока клиенты заметят улучшение и изменят поведение","correct":false,"rationale":"Ожидание не создаст связи."},{"id":"o3","text":"Клиенты не заметили улучшения — это нормально для небольших правок промпта и не повод для действий","correct":false,"rationale":"Если улучшение незаметно, зачем оно?"}],"anchor":{"g":"compare","p":{"a":["офлайн","судья 4,1 → 4,5"],"b":["онлайн","task success 80% → 80%"],"verdict":"golden set не репрезентативен"},"cap":"офлайн должен предсказывать онлайн"},"id":"u4-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре дашборда TPO агента. Какой устроен правильно?","vopts":[{"id":"v0","v":{"g":"treev","p":{"root":"North Star","kids":["драйверы","ограничители","техника"],"ok":true}},"lbl":"","correct":true,"rationale":"Одна главная с условием качества, драйверы, ограничители, техпанель."},{"id":"v1","v":{"g":"treev","p":{"root":"containment","kids":["","",""],"ok":false}},"lbl":"","correct":false,"rationale":"Одна метрика без условий — накрутится."},{"id":"v2","v":{"g":"treev","p":{"root":"20 метрик","kids":["…","…","…"],"ok":false,"many":true}},"lbl":"","correct":false,"rationale":"Двадцать равноправных метрик — нет приоритета и решения."},{"id":"v3","v":{"g":"treev","p":{"root":"p95","kids":["доступность","стоимость","ошибки"],"ok":false}},"lbl":"","correct":false,"rationale":"Только техника — непонятно, решает ли агент задачи клиента."}],"id":"u4-2-t4"}],"framework":"Дерево: бизнес (экономия, конверсия, retention) → продукт (containment, task success, эскалации, повторные) → качество (hallucination, faithfulness, интенты, жалобы) → техника (p95, доступность, стоимость). North Star — решённые задачи без оператора при CSAT не ниже оператора. Containment без task success — ловушка. Guardrail-метрики ограничивают. Еженедельно 20 диалогов глазами.","anchor":{"g":"tree","p":{"root":"решённые задачи без оператора · CSAT ≥ оператора","kids":["containment","task success","повторные","hallucination","p95 · cost"]},"cap":"дерево метрик — от бизнеса до техники"},"layers":{"simple":"Если судить консультанта только по тому, сколько клиентов он «не отпустил к старшему», он научится никого не отпускать — и не решать. Поэтому главная метрика — «решил задачу сам, и клиент доволен не меньше, чем после оператора».\nПод главной — метрики-причины: какая доля разговоров закрылась без человека, решена ли задача (вернулся ли клиент с тем же вопросом через неделю), почему передавали оператору. Ещё ниже — качество ответов: сколько раз выдумал, сколько раз сказал «не знаю». В самом низу — скорость и цена.\nИ есть «красные линии»: жалобы, выдумки, злые эскалации. Рост главной метрики не считается, если красная линия пересечена. Раз в неделю команда читает двадцать разговоров — это ловит то, чего не видят графики.\nПроверь себя: почему containment — плохая главная метрика сама по себе?","how":"1. Дерево: бизнес (экономия = решённые без оператора × стоимость обращения; конверсия; отток) → продукт (containment, task success, эскалации по причинам, повторные за 7 дней, время до решения) → качество (hallucination rate, faithfulness, точность интента, балл судьи, «не знаю» rate, жалобы) → техника (p95/TTFT, доступность, ошибки инструментов, стоимость).\n2. North Star: решённые задачи без оператора при CSAT ≥ оператора. Отчёт всегда парой: containment + task success.\n3. Task success: прокси (нет повторного обращения за 7 дней) + разметка 200 диалогов/неделю (люди или калиброванный судья) + сигнал «помогло?».\n4. Guardrail: hallucination < 2%, жалобы «неверный ответ», эскалации по гневу, обрывы, p95, стоимость. Рост главной не засчитывается за порогом.\n5. Пример. Месяц после запуска: containment 35 → 55%, повторные 12 → 21%. Разметка 200: task success упал с 84% до 71% на интенте «споры» — агент отвечает уверенно без решения. Возвращена эскалация на спорах → containment 48%, повторные 13%, task success 83%.\n6. Ритуал: еженедельно 20 диалогов глазами, топ-3 дефекта в бэклог; проверка связи офлайн-балла с онлайн task success.","formula":{"f":"экономия = N × containment × task_success × c_оператора\nNorth Star = решённые без оператора | CSAT ≥ CSAT_оператора ∧ ограничители в норме","legend":[["containment","доля диалогов без оператора","30–50% в первый год"],["task_success","доля решённых задач","> 80%"],["повторные","обращения по тому же интенту за 7 дней","< 15%"],["hallucination","ответы с неподтверждёнными фактами","< 2%"],["CSAT","оценка клиента после диалога","не ниже оператора"]],"note":"Экономия считается от решённых задач, а не от удержанных диалогов — поэтому task success стоит в формуле множителем."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Дерево метрик: бизнес → продукт → качество → техника; нижние объясняют верхние.\n— North Star — решённые задачи без оператора при CSAT не ниже оператора; containment только в паре с task success.\n— Guardrail-метрики: рост главной не засчитывается за порогом.\n— Task success — из трёх источников: прокси, разметка выборки, сигнал клиента.\n— Еженедельно 20 диалогов глазами; проверяй, что офлайн предсказывает онлайн.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Почему containment — плохая главная метрика сама по себе?","o":["Не считается автоматически и требует дорогой ручной разметки каждого диалога","Легко накрутить удержанием без решения; нужна пара с task success и CSAT","Операторы против метрики, которая измеряет, сколько работы у них забрал агент"],"a":1,"w":"Удержал ≠ решил; главная метрика — с условием качества."},{"q":"Как измерить task success без разметки каждого диалога?","o":["Считать «спасибо» успехом: благодарность клиента","Прокси по повторным обращениям + разметка выборки + сигнал клиента","Принять containment за task success: если не позвал оператора, значит, задача решена"],"a":1,"w":"Три источника, сверяемые между собой."},{"q":"В формуле экономии почему task_success — множитель?","o":["Для красоты формулы: на практике множитель близок к единице и его опускают","Экономия возникает от решённых задач; нерешённые возвращаются обращениями","Это ошибка: экономия считается от удержанных диалогов"],"a":1,"w":"Удержанный, но нерешённый диалог — не экономия, а отложенная стоимость."},{"q":"Офлайн-балл вырос, онлайн не изменился. Что это значит?","o":["Онлайн-метрика сломана или считается с запозданием","Golden set нерепрезентативен — пересобрать из свежих логов","Подождать: клиенты замечают улучшение качества не сразу, нужен ещё один цикл измерения"],"a":1,"w":"Офлайн должен предсказывать онлайн; иначе eval не о том."}],"rules":["Дерево метрик: бизнес → продукт → качество → техника; нижние объясняют верхние.","North Star — решённые задачи без оператора при CSAT не ниже оператора; containment только в паре с task success.","Guardrail-метрики: рост главной не засчитывается за порогом.","Task success — из трёх источников: прокси, разметка выборки, сигнал клиента.","Еженедельно 20 диалогов глазами; проверяй, что офлайн предсказывает онлайн."]}},{"id":"u5-1","level":"L5","title":"Техническое видение, ADR и план с оценкой ресурсов","lead":"Как превратить «сделайте ИИ-агента» в документ, roadmap и смету, за которые можно отвечать","concept":"Техническое видение ИИ-продукта — это одна-две страницы: проблема и для кого; целевая архитектура (C4 уровня контейнеров) с ключевыми решениями; принципы (данные не покидают контур, агентность только на чтении, eval gate на каждый релиз); нефункциональные требования (p95, доступность, стоимость диалога, hallucination); что не делаем и почему; этапы на 2–4 квартала. Ключевые решения оформляются как ADR (architecture decision record): контекст → варианты → решение → последствия → дата пересмотра; ADR на выбор модели, размещение, векторную БД, схему HITL. План развития: вехи с результатом, который можно проверить (не «разработка RAG», а «recall@5 ≥ 90% на golden set»), оценка в человеко-неделях по ролям, зависимости (API смежных систем, допуски ИБ — обычно критический путь), риски с триггерами и планами Б, буфер 20–30% на неопределённость ИИ-качества. Оценка — трёхточечная (оптимист / реалист / пессимист) для задач с неопределённостью: «качество на golden set достигнет порога» — задача с открытым исходом, её оценивают итерациями с критерием остановки, а не днями.","points":[{"h":"Структура документа видения","t":"1) Проблема и метрика успеха (North Star с условием качества). 2) Пользователь и сценарии (из CJM и логов). 3) Целевая архитектура: схема, где модель, где данные, как действия. 4) Принципы — 5–7 правил, которые не обсуждаются при каждой задаче. 5) NFR: p95, доступность, стоимость диалога, hallucination, безопасность. 6) Не-цели. 7) Этапы: Q1 — ОПЭ на одном сценарии; Q2 — ПРОМ + второй сценарий; Q3 — действия с подтверждением. 8) Риски и открытые вопросы. Документ живёт в Confluence, обновляется ежеквартально."},{"h":"ADR: как фиксировать решения","t":"Заголовок, статус (предложено/принято/заменено), контекст (ограничения, требования), варианты с плюсами и минусами (3 обычно), решение и почему, последствия (что становится проще/сложнее, долг), дата пересмотра. Примеры ADR агента: модель on-prem 8B против внешнего API; pgvector против отдельной векторной БД; агент против workflow для сценария; LLM-судья против ручной разметки. ADR экономят споры: решение не переоткрывается, пока не наступил триггер пересмотра."},{"h":"Roadmap: вехи с проверяемым результатом","t":"Веха = результат + критерий + дата + владелец. Плохо: «Разработка RAG — 6 недель». Хорошо: «База знаний по картам в RAG, recall@5 ≥ 90%, faithfulness ≥ 95% на golden set 300 — 15 марта — команда поиска». Критический путь в банке — не код: API смежных систем (владельцы — другие команды), допуск ИБ (3–6 недель), ПДн, нагрузка. Их ставят в план первыми и с датами запросов. Квартальный план: 3–5 вех, не больше; остальное — бэклог с условиями."},{"h":"Оценка ресурсов и неопределённость","t":"Роли и загрузка: ML/LLM-инженеры (промпты, RAG, eval), backend (оркестратор, адаптеры, интеграции), data/аналитик (логи, метрики, golden set), QA/red-team, DevOps/MLOps (инференс, мониторинг), дизайнер диалогов/контент, аналитик-методолог базы знаний, ИБ-консультант, TPO. Оценка в человеко-неделях по вехам; трёхточечная для неопределённых; задачи с открытым исходом («дотянуть качество») — итерациями по 2 недели с критерием остановки и планом Б (сузить сценарий, добавить эскалацию). Буфер 20–30%, и он объявлен явно, а не спрятан."}],"practice":{"mechanic":"ranking","points":3,"stem":"Расставьте вехи квартального плана запуска агента «подписки и списания» в правильном порядке (критический путь).","options":[{"id":"r0","text":"Запрос API истории операций и мерчантов у команды АБС, запрос модели угроз у ИБ","why":"Внешние зависимости — первыми: они самые долгие."},{"id":"r1","text":"Golden set 300 из логов и baseline eval на прототипе","why":"Без измерения нельзя ставить цели следующим вехам."},{"id":"r2","text":"RAG по базе знаний: recall@5 ≥ 90%, faithfulness ≥ 95%","why":"Качество знаний — до интеграций с действиями."},{"id":"r3","text":"Оркестратор + инструменты чтения + guard, нагрузочный тест p95 ≤ 5 с","why":"Техническая готовность с проверяемым NFR."},{"id":"r4","text":"ОПЭ на сотрудниках и 1% клиентов, eval gate и канарейка","why":"Реальные данные под контролем."},{"id":"r5","text":"Отчёт по метрикам и решение о ПРОМ/расширении","why":"Решение — по цифрам, не по дате."}],"solution":"Зависимости, потом измерение, потом качество знаний, потом интеграция и NFR, потом ОПЭ, потом решение по данным.","anchor":{"g":"timeline","p":{"items":["зависимости: API, ИБ","golden set + baseline","RAG ≥ 90%","оркестратор + p95","ОПЭ 1%","решение"],"hl":0},"cap":"критический путь — не код, а зависимости"},"id":"u5-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Что отличает хорошую веху roadmap ИИ-продукта?","options":[{"id":"o0","text":"Проверяемый результат с критерием, датой и владельцем: «recall@5 ≥ 90% на golden 300 к 15 марта»","correct":true,"rationale":"Веха — результат, не активность."},{"id":"o1","text":"Название технологии и длительность: «RAG — 6 недель», чтобы команда понимала объём работы","correct":false,"rationale":"Активность без критерия готовности."},{"id":"o2","text":"Обещание заказчику «будет работать хорошо к концу квартала» с перечислением задействованных команд","correct":false,"rationale":"Нет критерия — нельзя понять, достигнута ли веха."},{"id":"o3","text":"Список задач из JIRA с оценками в story points, сгруппированный по эпикам и спринтам","correct":false,"rationale":"Задачи — уровень спринта, не roadmap."}],"anchor":{"g":"timeline","p":{"items":["RAG ≥ 90% · 15.03 · поиск","p95 ≤ 5 с · 05.04 · backend","ОПЭ 1% · 20.04 · TPO"],"hl":0},"cap":"результат + критерий + дата + владелец"},"id":"u5-1-t0"},{"mechanic":"single","points":2,"stem":"Как оценивать задачу «довести качество ответов до порога», исход которой неизвестен?","options":[{"id":"o0","text":"Итерациями по 2 недели с критерием остановки и планом Б","correct":true,"rationale":"Открытый исход — управляется итерациями, не днями."},{"id":"o1","text":"Точно: 3 недели, как сказал ML-инженер, с обязательством перед заказчиком и штрафом за срыв срока","correct":false,"rationale":"Качество ИИ так не оценивается."},{"id":"o2","text":"Не оценивать вовсе: «сколько получится»","correct":false,"rationale":"Без критерия остановки — бесконечная задача."},{"id":"o3","text":"Поставить в план после всех остальных задач","correct":false,"rationale":"Это обычно критический путь."}],"anchor":{"g":"tree","p":{"root":"качество ≥ порога?","kids":["итерация 1 → 2 нед","итерация 2 → 2 нед","план Б: сузить сценарий"]},"cap":"критерий остановки + план Б"},"id":"u5-1-t1"},{"mechanic":"single","points":2,"stem":"Зачем ADR, если решение уже принято на встрече?","options":[{"id":"o0","text":"Фиксирует контекст, варианты и триггер пересмотра — решение не переоткрывается и объяснимо аудиту","correct":true,"rationale":"ADR — память организации."},{"id":"o1","text":"Для отчётности перед руководством и архитектурным комитетом, которые требуют документ на каждое решение","correct":false,"rationale":"Отчётность — следствие, а не назначение ADR."},{"id":"o2","text":"Потому что так требует шаблон Confluence и без ADR задача не проходит ревью архитектора","correct":false,"rationale":"Инструмент — не причина."},{"id":"o3","text":"Не нужен: достаточно протокола встречи с решением и списком участников, кто за него голосовал","correct":false,"rationale":"Протокол не содержит вариантов и последствий."}],"anchor":{"g":"pipeline","p":{"steps":["контекст","варианты ×3","решение","последствия","пересмотр: дата"],"hl":[2,4]},"cap":"ADR: контекст → варианты → решение → пересмотр"},"id":"u5-1-t2"},{"mechanic":"single","points":2,"stem":"Что чаще всего оказывается критическим путём запуска агента в банке?","options":[{"id":"o0","text":"Внешние зависимости: API смежных систем, допуск ИБ и ПДн, нагрузка","correct":true,"rationale":"Их запрашивают первыми."},{"id":"o1","text":"Написание системного промпта и подбор примеров","correct":false,"rationale":"Дни, не недели."},{"id":"o2","text":"Выбор интерфейса чата и согласование дизайна с брендом банка через несколько комитетов","correct":false,"rationale":"Не критический путь."},{"id":"o3","text":"Закупка и установка GPU, потому что закупочные процедуры в банке идут месяцами","correct":false,"rationale":"Иногда, но чаще — согласования."}],"anchor":{"g":"timeline","p":{"items":["API АБС: 6 нед","ИБ: 4 нед","код: 5 нед ∥","ОПЭ"],"hl":0},"cap":"зависимости длиннее кода"},"id":"u5-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре квартальных плана. Какой построен правильно?","vopts":[{"id":"v0","v":{"g":"tl","p":{"n":4,"deps":true,"crit":true,"buffer":true}},"lbl":"","correct":true,"rationale":"Зависимости первыми, вехи с критериями, явный буфер."},{"id":"v1","v":{"g":"tl","p":{"n":9,"deps":false,"crit":false,"buffer":false}},"lbl":"","correct":false,"rationale":"Девять вех без критериев и зависимостей — список желаний."},{"id":"v2","v":{"g":"tl","p":{"n":4,"deps":false,"crit":true,"buffer":false}},"lbl":"","correct":false,"rationale":"Критерии есть, но ИБ и API не в плане — сдвинется на квартал."},{"id":"v3","v":{"g":"tl","p":{"n":4,"deps":true,"crit":false,"buffer":true}},"lbl":"","correct":false,"rationale":"Зависимости и буфер есть, вехи — активности без критериев."}],"id":"u5-1-t4"}],"framework":"Видение: проблема, сценарии, архитектура, принципы, NFR, не-цели, этапы, риски — 1–2 страницы. ADR: контекст → варианты → решение → последствия → пересмотр. Roadmap: 3–5 вех в квартал с результатом, критерием, датой, владельцем; зависимости (API, ИБ) первыми. Оценка по ролям в человеко-неделях, трёхточечная; открытые задачи — итерациями с критерием остановки; буфер 20–30% явно.","anchor":{"g":"timeline","p":{"items":["видение + ADR","зависимости","golden set","RAG ≥ 90%","p95 ≤ 5 с","ОПЭ 1%","решение"],"hl":1},"cap":"план, за который можно отвечать"},"layers":{"simple":"Представь, что тебя просят построить дом «как-нибудь побыстрее». Видение — это одна страница: для кого дом, сколько этажей, из чего, чего точно не будет, и правила, которые не обсуждаем (фундамент — до стен).\nКаждое крупное решение — отдельная карточка: почему выбрали этот материал, какие были варианты, когда пересмотрим. Чтобы через месяц не спорить заново.\nПлан — не список работ, а список проверяемых результатов: «крыша не течёт при ливне к 15 марта». И первыми в плане стоят не кирпичи, а разрешения и соседи — они самые долгие. А на то, что в ИИ нельзя предсказать («получится ли нужное качество»), выделяют попытки с правилом «после двух попыток меняем подход».\nПроверь себя: что отличает хорошую веху roadmap?","how":"1. Видение (1–2 стр.): проблема и North Star; сценарии из CJM/логов; целевая архитектура C4; принципы 5–7; NFR (p95, доступность, стоимость, hallucination, безопасность); не-цели; этапы по кварталам; риски. Обновление ежеквартально.\n2. ADR: статус, контекст, 3 варианта с плюсами/минусами, решение, последствия, дата пересмотра. Типовые: размещение модели, векторная БД, агент vs workflow, судья vs разметка.\n3. Roadmap: веха = результат + критерий + дата + владелец; 3–5 на квартал; зависимости (API смежных команд, ИБ 3–6 нед, ПДн, нагрузка) — первыми с датами запросов.\n4. Оценка: роли (LLM-инженер, backend, аналитик данных, QA/red-team, MLOps, дизайнер диалогов, методолог базы знаний, ИБ, TPO) × человеко-недели по вехам; трёхточечная для неопределённых; открытые задачи — итерации по 2 недели с критерием остановки и планом Б; буфер 20–30% явно.\n5. Пример. Q1: зависимости (API АБС 6 нед, ИБ 4 нед) → golden set 300 + baseline → RAG ≥ 90% → оркестратор + p95 ≤ 5 с → ОПЭ 1% → решение. Команда: 2 LLM, 2 backend, 1 аналитик, 1 QA, 0,5 MLOps, 0,5 методолог = 7 FTE × 12 нед = 84 чел-нед + буфер 25% = 105.","formula":{"f":"веха = результат + критерий + дата + владелец\nоценка = Σ_ролей чел-нед × (1 + буфер); неопределённое — итерации × критерий остановки","legend":[["критерий","проверяемая метрика готовности","recall@5 ≥ 90% на golden 300"],["зависимости","API смежных команд, ИБ, ПДн, нагрузка","критический путь, запрашивать первыми"],["трёхточечная","оптимист / реалист / пессимист","4 / 6 / 10 недель"],["итерация","2 недели с измерением и критерием остановки","после 2 итераций — план Б"],["буфер","явный резерв на неопределённость","20–30%"]],"note":"Задача с открытым исходом («дотянуть качество») оценивается не днями, а числом попыток и правилом, когда менять подход."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Видение — 1–2 страницы: проблема, архитектура, принципы, NFR, не-цели, этапы.\n— ADR фиксирует контекст, варианты, решение и дату пересмотра — спор не повторяется.\n— Веха = результат + критерий + дата + владелец; 3–5 на квартал.\n— Зависимости (API, ИБ, ПДн) — критический путь, запрашивать первыми.\n— Открытые задачи — итерациями с критерием остановки; буфер 20–30% явно.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Что отличает хорошую веху roadmap?","o":["Название технологии и длительность: «RAG","Проверяемый результат с критерием, датой и владельцем","Список задач JIRA с оценками в story points, сгруппированный по эпикам и спринтам"],"a":1,"w":"Веха — результат, не активность."},{"q":"Как оценивать «довести качество до порога»?","o":["Точно: 3 недели, как оценил ML-инженер, с обязательством перед заказчиком в плане","Итерациями по 2 недели с критерием остановки и планом Б","Не оценивать: качество ИИ непредсказуемо, поэтому задача идёт без срока до результата"],"a":1,"w":"Открытый исход — управляется попытками, не днями."},{"q":"В формуле оценки зачем буфер явно?","o":["Чтобы оставить себе пространство для манёвра и не объяснять заказчику каждый сдвиг","Чтобы неопределённость качества была видна и обсуждаема, а не спрятана","Для округления оценки до целых недель и удобства планирования спринтов"],"a":1,"w":"Явный буфер — честный разговор о риске; спрятанный — сюрприз."},{"q":"Что обычно критический путь в банке?","o":["Системный промпт и подбор примеров: от него зависит всё качество агента","API смежных систем, допуск ИБ и ПДн","Закупка и установка GPU, потому что закупочные процедуры в банке идут месяцами"],"a":1,"w":"Согласования длиннее кода; их ставят первыми."}],"rules":["Видение — 1–2 страницы: проблема, архитектура, принципы, NFR, не-цели, этапы.","ADR фиксирует контекст, варианты, решение и дату пересмотра — спор не повторяется.","Веха = результат + критерий + дата + владелец; 3–5 на квартал.","Зависимости (API, ИБ, ПДн) — критический путь, запрашивать первыми.","Открытые задачи — итерациями с критерием остановки; буфер 20–30% явно."]}},{"id":"u5-2","level":"L5","title":"Команда и Agile: состав, ритуалы, бэклог, DoD для ИИ","lead":"Как TPO собирает и координирует команду, где ML-работа не укладывается в спринт","concept":"Команда ИИ-агента кросс-функциональна: TPO (цели, приоритет, стейкхолдеры), LLM/ML-инженеры (промпты, RAG, eval, модели), backend-разработчики (оркестратор, адаптеры, интеграции), аналитик данных (логи, метрики, golden set), QA + red-team, MLOps/DevOps (инференс, мониторинг, пайплайны), дизайнер диалогов/UX-писатель, методолог базы знаний (владелец документов), архитектор и ИБ как консультанты, бизнес-владелец сценария со стороны заказчика. Scrum адаптируется: спринт 2 недели для продуктовой и интеграционной работы; исследовательские ML-задачи — как time-boxed spike с измеримым выходом («recall@5 на трёх вариантах чанкинга»), не как «фича». Бэклог делится на потоки: сценарии (ценность), качество (eval-дефекты из еженедельного разбора), платформа (инфраструктура, безопасность), долг. Приоритизация — RICE или WSJF с поправкой на риск и зависимость от допусков; eval-дефекты на безопасности — всегда вверху. DoD для задачи агента включает: eval на golden set не хуже, критические кейсы пройдены, трасса и метрики на дашборде, промпт и конфиг версионированы, документация сценария обновлена, red-team для новых инструментов. Взаимодействие tech ↔ business: единый словарь (containment, task success, eval gate), демо на реальных диалогах каждые две недели, заказчик размечает 20 диалогов вместе с командой.","points":[{"h":"Роли и чего не хватает чаще всего","t":"Типовая ошибка — собрать только разработчиков и ML. Чаще всего не хватает: методолога базы знаний (без него RAG ищет по устаревшим документам), аналитика данных (без него нет golden set и метрик), дизайнера диалогов (тон, краткость, структура ответов), red-team. TPO формирует команду под вехи: на фазе знаний — методолог и LLM-инженер; на фазе действий — backend и ИБ; на фазе масштабирования — MLOps. Матрица RACI на сценарий: кто решает про тон, кто про риск, кто про приоритет."},{"h":"Spike против фичи: ML в спринте","t":"Задача «улучшить качество» не влезает в спринт как фича: исход неизвестен. Формулируют как spike: гипотеза, метрика, набор, time-box 3–5 дней, выход — цифры и решение. Три spike подряд без прогресса — сигнал менять подход, а не продолжать. Остальное (интеграции, UI, guard, пайплайн) — обычные истории с оценкой. Ревью спринта показывает реальные диалоги до/после, а не слайды."},{"h":"Бэклог: потоки и приоритизация","t":"Четыре потока с квотами (например, 50% сценарии, 25% качество, 15% платформа, 10% долг) — иначе качество и безопасность проигрывают фичам. RICE: reach × impact × confidence ÷ effort — с confidence, честно сниженным для ИИ-задач. WSJF: cost of delay ÷ размер — удобен, когда есть дедлайны допусков. Поверх любого метода — правило: дефект безопасности и критические eval-провалы вне очереди; зависимость от внешней команды повышает приоритет запроса, не задачи."},{"h":"DoD и взаимодействие с бизнесом","t":"DoD задачи агента: код + промпт + конфиг версионированы; eval на golden set ≥ базы, критические кейсы 0 провалов; red-team для новых инструментов; трасса и метрика на дашборде; документация сценария; feature flag для отката. Бизнес: единый словарь метрик, демо каждые 2 недели на реальных диалогах, совместная разметка 20 диалогов (заказчик видит, как агент ошибается, и перестаёт ждать чуда), прозрачный бэклог в JIRA с публичным приоритетом и причинами."}],"practice":{"mechanic":"keymoves","points":3,"stem":"Выберите действия, которые правильно организуют работу команды ИИ-агента.","options":[{"id":"k0","text":"Сформулировать «улучшить качество RAG» как spike с метрикой recall@5 и time-box 4 дня","correct":true,"why":"Исследование — с измеримым выходом и лимитом."},{"id":"k1","text":"Ввести квоты бэклога: сценарии / качество / платформа / долг","correct":true,"why":"Иначе качество проигрывает фичам."},{"id":"k2","text":"Включить в DoD eval на golden set, критические кейсы и версионирование промпта","correct":true,"why":"Готово — значит измерено и воспроизводимо."},{"id":"k3","text":"Проводить демо на реальных диалогах и размечать 20 диалогов вместе с заказчиком","correct":true,"why":"Общий словарь и реалистичные ожидания."},{"id":"k4","text":"Нанять методолога базы знаний до масштабирования RAG","correct":true,"why":"Без владельца документов RAG деградирует."},{"id":"f5","text":"Планировать «довести качество» как фичу на 3 недели с фиксированным сроком и обязательством перед заказчиком","correct":false,"why":"Открытый исход не оценивается сроком."},{"id":"f6","text":"Отдать приоритизацию целиком заказчику: он платит и лучше понимает, какие сценарии принесут бизнесу ценность","correct":false,"why":"Заказчик не видит технические риски и долг."},{"id":"f7","text":"Считать задачу готовой, когда ответы выглядят хорошо на демо и заказчик подтвердил это в протоколе","correct":false,"why":"Впечатление — не DoD."},{"id":"f8","text":"Исключить ИБ из планирования до самого релиза, чтобы не тормозили разработку, и подключить на финальной неделе","correct":false,"why":"ИБ в конце — сдвиг релиза на квартал."}],"reference":"Spike с метрикой, квоты бэклога, измеримый DoD, демо на реальных диалогах, ранний методолог и ИБ.","anchor":{"g":"stack2","p":{"rows":[["сценарии",50],["качество",25],["платформа",15],["долг",10]]},"cap":"квоты бэклога защищают качество"},"id":"u5-2-p"},"test":[{"mechanic":"single","points":2,"stem":"Как ставить в спринт задачу «улучшить качество ответов»?","options":[{"id":"o0","text":"Как spike: гипотеза, метрика, набор, time-box 3–5 дней, выход — цифры и решение","correct":true,"rationale":"ML-исследование измеримо, но не предсказуемо."},{"id":"o1","text":"Как фичу с оценкой 8 story points и обязательством достичь целевого качества к концу спринта","correct":false,"rationale":"Исход неизвестен — обязательство ложное."},{"id":"o2","text":"Не ставить в спринт: пусть ML-инженеры работают над качеством вне спринта, без давления сроков","correct":false,"rationale":"Теряется прозрачность и приоритет."},{"id":"o3","text":"Как баг с высоким приоритетом: низкое качество — дефект, который чинят до остальных задач","correct":false,"rationale":"Это не дефект, а исследование."}],"anchor":{"g":"pipeline","p":{"steps":["гипотеза","метрика + набор","time-box 4 дня","цифры → решение"],"hl":[2,3]},"cap":"spike: измеримый выход за time-box"},"id":"u5-2-t0"},{"mechanic":"single","points":2,"stem":"Кого чаще всего забывают включить в команду ИИ-агента?","options":[{"id":"o0","text":"Методолога базы знаний, аналитика данных для golden set, дизайнера диалогов, red-team","correct":true,"rationale":"Без них RAG устаревает, метрик нет, тон случаен."},{"id":"o1","text":"Ещё одного backend-разработчика: интеграций всегда больше, чем кажется в начале проекта","correct":false,"rationale":"Обычно их достаточно."},{"id":"o2","text":"Руководителя кол-центра в ежедневные стендапы, чтобы бизнес видел прогресс каждый день","correct":false,"rationale":"Нужен на демо, не на стендапе."},{"id":"o3","text":"Второго TPO для разделения технической и продуктовой ответственности внутри команды","correct":false,"rationale":"Второй владелец размывает ответственность за приоритет."}],"anchor":{"g":"tree","p":{"root":"команда агента","kids":["LLM/ML ×2","backend ×2","аналитик","QA + red-team","методолог знаний","дизайнер диалогов","MLOps"]},"cap":"команда под вехи, не только разработчики"},"id":"u5-2-t1"},{"mechanic":"single","points":2,"stem":"Что обязательно в DoD задачи, меняющей промпт агента?","options":[{"id":"o0","text":"Eval на golden set не хуже базы, критические кейсы 0 провалов, промпт версионирован, feature flag","correct":true,"rationale":"Готово = измерено и откатываемо."},{"id":"o1","text":"Одобрение заказчика после просмотра трёх примеров до и после изменения в тестовом контуре","correct":false,"rationale":"Три примера — не измерение."},{"id":"o2","text":"Code review без eval: промпт — текст, а не код, и его качество оценивается на глаз опытным инженером","correct":false,"rationale":"Промпт меняет поведение сильнее кода."},{"id":"o3","text":"Обновление презентации для руководства и записи в журнале изменений с описанием новой формулировки","correct":false,"rationale":"Не критерий готовности."}],"anchor":{"g":"release","p":{"hl":[0],"note":"DoD: eval ≥ base · critical 0 · версия · flag"},"cap":"промпт — тоже релиз"},"id":"u5-2-t2"},{"mechanic":"single","points":2,"stem":"Как удержать баланс между фичами и качеством в бэклоге?","options":[{"id":"o0","text":"Квоты по потокам и правило «дефекты безопасности вне очереди»","correct":true,"rationale":"Структура защищает от давления."},{"id":"o1","text":"Делать только фичи, пока заказчик не пожалуется на качество, — он лучше чувствует приоритеты бизнеса","correct":false,"rationale":"Качество деградирует незаметно, потом резко."},{"id":"o2","text":"Делать только качество, пока не достигнем 100% на golden set, и лишь потом расширять сценарии","correct":false,"rationale":"100% недостижимо; ценность не доставляется."},{"id":"o3","text":"Чередовать спринты: фичевый и качественный","correct":false,"rationale":"Грубо; еженедельные дефекты ждут две недели."}],"anchor":{"g":"stack2","p":{"rows":[["сценарии",50],["качество",25],["платформа",15],["долг",10]]},"cap":"квоты — против давления фич"},"id":"u5-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре организации спринта команды агента. Какая правильная?","vopts":[{"id":"v0","v":{"g":"quad","p":{"x":"предсказуемость","y":"измеримость","pts":[["spike",0.4,0.9],["истории",0.9,0.8]],"hl":0,"ok":true}},"lbl":"","correct":true,"rationale":"Spike измерим, но не обещает исход; истории — предсказуемы."},{"id":"v1","v":{"g":"quad","p":{"x":"предсказуемость","y":"измеримость","pts":[["«качество»",0.9,0.2]],"hl":0,"ok":false}},"lbl":"","correct":false,"rationale":"ML-задача как фича с обязательством — ложная предсказуемость без метрики."},{"id":"v2","v":{"g":"quad","p":{"x":"предсказуемость","y":"измеримость","pts":[["ML вне спринта",0.1,0.1]],"hl":0,"ok":false}},"lbl":"","correct":false,"rationale":"Ни прозрачности, ни метрики."},{"id":"v3","v":{"g":"quad","p":{"x":"предсказуемость","y":"измеримость","pts":[["демо «выглядит ок»",0.5,0.1]],"hl":0,"ok":false}},"lbl":"","correct":false,"rationale":"Готовность по впечатлению."}],"id":"u5-2-t4"}],"framework":"Команда: TPO, LLM/ML, backend, аналитик данных, QA + red-team, MLOps, дизайнер диалогов, методолог базы знаний, ИБ/архитектор консультантами, бизнес-владелец. ML-исследование — spike с метрикой и time-box. Бэклог по потокам с квотами; RICE/WSJF с поправкой на риск; безопасность вне очереди. DoD: eval ≥ базы, критические 0, версии, flag, трасса. Бизнес: единый словарь, демо на реальных диалогах, совместная разметка.","anchor":{"g":"tree","p":{"root":"TPO","kids":["LLM/ML","backend","аналитик","QA/red-team","MLOps","диалоги","знания"]},"cap":"кросс-функциональная команда под вехи"},"layers":{"simple":"Команда ИИ-агента — как съёмочная группа: нужны не только операторы (разработчики), но и сценарист (дизайнер диалогов), архивариус (владелец базы знаний), монтажёр со статистикой (аналитик) и каскадёр, проверяющий на прочность (red-team). Без архивариуса агент цитирует прошлогодние тарифы.\nИсследовательские задачи («попробовать улучшить поиск») не обещают результат — их ставят как короткие эксперименты с измерением: четыре дня, три варианта, цифры, решение. Всё остальное — обычные задачи со сроками.\nЧтобы фичи не вытеснили качество, бэклог делят на полки с квотами. А «готово» означает: измерено на наборе, критические случаи прошли, можно откатить одной кнопкой.\nПроверь себя: как ставить в спринт задачу «улучшить качество ответов»?","how":"1. Роли: TPO; LLM/ML-инженеры; backend; аналитик данных (логи, метрики, golden set); QA + red-team; MLOps; дизайнер диалогов; методолог базы знаний; архитектор и ИБ — консультанты; бизнес-владелец сценария. RACI на сценарий.\n2. Ритм: спринт 2 недели; ML-исследование — spike (гипотеза, метрика, набор, time-box 3–5 дней, выход — цифры); 3 spike без прогресса → менять подход. Ревью — реальные диалоги до/после.\n3. Бэклог: потоки с квотами (сценарии 50 / качество 25 / платформа 15 / долг 10); RICE с честным confidence или WSJF; безопасность и критические eval-провалы вне очереди.\n4. DoD: код + промпт + конфиг версионированы; eval ≥ базы; критические кейсы 0; red-team для новых инструментов; трасса и метрики; документация; feature flag.\n5. Бизнес: единый словарь (containment, task success, eval gate); демо каждые 2 недели; совместная разметка 20 диалогов; прозрачный бэклог в JIRA с причинами приоритета; Confluence — видение, ADR, паспорта сценариев.\n6. Пример. Spike «чанкинг»: 3 варианта (300/500/800 токенов) × golden 300 → recall@5 = 84 / 91 / 88% → принят 500; 4 дня; решение в ADR.","formula":{"f":"RICE = reach × impact × confidence ÷ effort\nDoD_агента = версия(код, промпт, конфиг) ∧ eval ≥ base ∧ critical = 0 ∧ red-team ∧ трасса ∧ flag","legend":[["confidence","уверенность в эффекте — для ИИ-задач снижать честно","50% вместо 80%"],["effort","человеко-недели всех ролей","включая методолога и ИБ"],["spike","time-boxed исследование с метрикой","4 дня, 3 варианта, цифры"],["квоты","доли бэклога по потокам","50 / 25 / 15 / 10"],["flag","возможность отката без релиза","обязателен для промптов"]],"note":"Дефект безопасности и критический eval-провал — вне любой формулы приоритизации."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Команда кросс-функциональна и собирается под вехи; не забывать методолога знаний, аналитика, дизайнера диалогов, red-team.\n— ML-исследование — spike с метрикой и time-box; три без прогресса — менять подход.\n— Бэклог по потокам с квотами; безопасность вне очереди.\n— DoD: версии, eval ≥ базы, критические 0, red-team, трасса, flag.\n— Бизнес — через единый словарь, демо на реальных диалогах и совместную разметку.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Как ставить «улучшить качество ответов» в спринт?","o":["Фичей на 8 story points с обязательством достичь целевого качества к концу спринта","Spike с метрикой, набором и time-box; выход — цифры и решение","Вне спринта: ML-инженеры работают над качеством без давления сроков и демо"],"a":1,"w":"Исход неизвестен — измеряем, но не обещаем."},{"q":"Кого чаще всего забывают в команде?","o":["Ещё одного backend-разработчика: интеграций всегда больше, чем кажется в начале проекта","Методолога базы знаний, аналитика данных, дизайнера диалогов, red-team","Второго TPO для разделения технической и продуктовой ответственности внутри команды"],"a":1,"w":"Без них RAG устаревает, метрик нет, тон случаен, атаки не проверены."},{"q":"В формуле RICE почему confidence для ИИ-задач снижают?","o":["Для перестраховки перед руководством","Эффект неизвестен до eval — честная уверенность ниже","Это ошибка: confidence у ИИ-задач должна быть выше, потому что их легко проверить на наборе"],"a":1,"w":"Честный confidence — честный приоритет."},{"q":"Что обязательно в DoD изменения промпта?","o":["Одобрение заказчика по трём примерам до и после изменения в тестовом контуре","Eval ≥ базы, критические 0, версия, flag","Обновление презентации для руководства и запись в журнале изменений с новой формулировкой"],"a":1,"w":"Промпт меняет поведение сильнее кода — релизится как код."}],"rules":["Команда кросс-функциональна и собирается под вехи; не забывать методолога знаний, аналитика, дизайнера диалогов, red-team.","ML-исследование — spike с метрикой и time-box; три без прогресса — менять подход.","Бэклог по потокам с квотами; безопасность вне очереди.","DoD: версии, eval ≥ базы, критические 0, red-team, трасса, flag.","Бизнес — через единый словарь, демо на реальных диалогах и совместную разметку."]}},{"id":"u5-3","level":"L5","title":"Релизы через цифровые каналы: конвейер качества агента","lead":"Eval gate → shadow → канарейка → A/B → rollout, feature flags и откат за минуту","concept":"Релиз ИИ-агента — это релиз поведения, а не только кода: изменение промпта, модели, базы знаний, порога guard меняет ответы для всех клиентов. Конвейер: CI с юнит-проверками → eval gate на golden set (балл, критические кейсы, p95, стоимость) → shadow-режим (новая версия отвечает параллельно, ответы не показываются, сравниваются судьёй на реальном трафике) → канарейка 1–5% с мониторингом guardrail-метрик 3–7 дней → A/B для бизнес-эффекта, если нужна статистическая уверенность → rollout по каналам (сначала веб или сотрудники, потом мобильное приложение) → пост-релизный мониторинг и разбор. Всё за feature flag с откатом за минуту без выкладки; промпты, конфиги и версии модели — в реестре с тегами, чтобы «откатить» означало вернуть конкретный набор версий. Каналы банка имеют свои ограничения: мобильное приложение релизится редко и проходит ревью магазинов — логика агента должна жить на сервере; кол-центр — интеграция с рабочим местом оператора и обучение; веб — быстрее всего. Качество релиза меряется: доля откатов, инциденты на релиз, время обнаружения и восстановления (MTTD/MTTR), доля релизов с пройденным gate без исключений.","points":[{"h":"Что считается релизом агента","t":"Код оркестратора и адаптеров; системный промпт и шаблоны; версия модели (включая обновление у вендора!); база знаний (новые документы меняют ответы); пороги guard и маршрутизатора; конфигурация инструментов. Каждый — через конвейер, пусть и облегчённый: обновление документов → автоматический eval на подмножестве golden set по домену. Обновление модели вендором — отдельный риск: фиксировать версию, перепроверять gate при смене."},{"h":"Конвейер и его ворота","t":"CI: формат, схема, запреты, инструменты — секунды. Eval gate: golden set + судья, критические кейсы, p95, стоимость — минуты-часы; пороги в конфиге, не в голове. Shadow: новая версия на реальном трафике без показа; парное сравнение судьёй; ловит дрейф, которого нет в golden set. Канарейка: 1–5%, guardrail-метрики, автооткат по порогам. A/B: когда нужен бизнес-эффект с уверенностью (containment, конверсия) — здесь работает всё из курса по A/B. Rollout по каналам и сегментам."},{"h":"Feature flags, реестр версий, откат","t":"Flag на сценарий, на модель, на инструмент; откат — переключение, не деплой. Реестр: prompt v23 + model X-2026-03 + kb snapshot 2026-04-01 + guard thresholds v5 = release 1.14; откат возвращает набор целиком. Runbook: кто, по какому сигналу, за сколько минут; учения отката раз в квартал. Мобильный канал: логика на сервере, приложение — тонкий клиент, иначе откат ждёт ревью магазина."},{"h":"Метрики качества релизов","t":"Доля релизов с откатом (< 10%), инциденты на релиз, MTTD (минуты — с автоматическими алертами на guardrail), MTTR (минуты — с flag), доля релизов через полный gate без исключений (цель 100%; исключения — с подписью TPO и постмортемом), lead time от готового промпта до 100% трафика (дни, не недели). Постмортем без поиска виноватых: причина, обнаружение, что изменим в gate."}],"practice":{"mechanic":"ranking","points":3,"stem":"Расставьте этапы релиза новой версии модели в правильном порядке.","options":[{"id":"r0","text":"CI: юнит-проверки формата, схемы, инструментов","why":"Секунды, на каждый коммит."},{"id":"r1","text":"Eval gate: golden set + судья, критические кейсы, p95, стоимость","why":"Ворота по заранее названным порогам."},{"id":"r2","text":"Shadow: параллельные ответы на реальном трафике без показа, сравнение судьёй","why":"Ловит дрейф вне golden set."},{"id":"r3","text":"Канарейка 1–5% с guardrail-метриками и автооткатом","why":"Реальные клиенты под контролем."},{"id":"r4","text":"A/B на бизнес-метрики при необходимости","why":"Статистическая уверенность в эффекте."},{"id":"r5","text":"Rollout по каналам и постмортем-разбор","why":"Сначала веб/сотрудники, потом приложение."}],"solution":"От дешёвого и быстрого к дорогому и медленному; реальные клиенты — только после офлайн- и shadow-проверок.","anchor":{"g":"release","p":{"hl":[0,1,2,3,4,5]},"cap":"конвейер релиза поведения"},"id":"u5-3-p"},"test":[{"mechanic":"single","points":2,"stem":"Вендор обновил модель «автоматически, без изменения API». Что д
