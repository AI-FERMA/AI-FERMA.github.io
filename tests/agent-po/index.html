вных скрывает следующие инциденты; вывод должен быть принципом и DoD."},{"id":"return_tomorrow","why":"Возврат — по критериям: исправление API, red-team 0 успехов, заключение ИБ, канарейка."}],"decoys":[{"id":"block_user","why":"Блокировка атакующего — допустимая мера, но не исправление; сама по себе не дефект."},{"id":"template","why":"Шаблон и таймлайн — правильная форма; дефекты в содержании."},{"id":"shutdown40","why":"40 минут после обнаружения — приемлемо; проблема в 4 часах до обнаружения, а не в скорости отключения."}],"verdict":"invalid","verdictWhy":"Постмортем не выявил корневую причину и не содержит исправлений, устраняющих уязвимость; возвращать сценарий на его основе нельзя — переделать разбор и исправления.","lesson":"Хороший постмортем: корневая причина техническая, исправление — граница в API + тест в red-team, мониторинг и MTTD, сохранённые логи, пострадавшие найдены и уведомлены по регламенту, выводы — принципы и DoD, без поиска виновных."},{"id":"au5","level":"L7","title":"План внедрения DeepSeek Harness","intro":"Платформенная команда прислала план пилота dsh на согласование. Найдите дефекты, не пометьте лишнего и вынесите вердикт.","blocks":[{"h":"Цель","t":"За 4 недели перевести все 12 команд разработки на DeepSeek Harness. Метрика успеха — число команд, использующих dsh ежедневно."},{"h":"Установка","t":"Разработчики ставят `npx @deepseek-ai/dsh web` на рабочие станции и работают с настройками по умолчанию: официальный DeepSeek API (ключ выдаёт платформа), встроенный web search, Desktop-приложение для удобства."},{"h":"Безопасность","t":"Песочница dsh (workspace-write) изолирует агента, включая сеть, поэтому дополнительный периметр не нужен. MCP-серверы для Jira, Confluence и внутренних API включены для всех команд. Approvals — ask; для CI будет автоответчик allowed-once."},{"h":"Модель","t":"Пока используем DeepSeek V4 Flash через официальный API; внутренний шлюз подключим после пилота, когда появится время на адаптер."},{"h":"Обновления","t":"Следим за master и обновляемся при каждом релизе, чтобы получать новые функции; патчи применяем правкой файлов в node_modules."},{"h":"Измерение","t":"Команды оценят удобство опросом; трассы и логи сессий не собираем — это отладочные данные. Отчёт — демо лучших сессий."}],"flags":[{"id":"leak","t":"Настройки по умолчанию: лог сессий, web search и телеметрия уходят в DeepSeek"},{"id":"ext_model","t":"Код банка отправляется во внешний API вместо внутреннего шлюза"},{"id":"sandbox_net","t":"Песочница dsh не изолирует сеть — периметра нет"},{"id":"mcp","t":"MCP включён для всех: исполняется вне песочницы, описания — недоверенный промпт"},{"id":"ci_auto","t":"Автоответчик allowed-once в CI вместо политики never"},{"id":"updates","t":"Обновление с master без пиннинга и правка node_modules"},{"id":"metric","t":"Метрика успеха — число команд, а не эффект; нет трасс и eval"},{"id":"scope","t":"12 команд за 4 недели без пилота"},{"id":"desktop","t":"Использование Desktop-приложения"},{"id":"flash","t":"Выбор модели V4 Flash вместо Pro"}],"defects":[{"id":"leak","why":"Три утечки по умолчанию: session-log-deepseek, web-search-deepseek, телеметрия."},{"id":"ext_model","why":"Код и данные банка покидают контур; адаптер к шлюзу — первый шаг, а не «после пилота»."},{"id":"sandbox_net","why":"Режимы песочницы — только файловые эффекты; сеть — периметром контейнера."},{"id":"mcp","why":"MCP off по умолчанию не случайно: серверы вне песочницы, описания — инъекция."},{"id":"ci_auto","why":"Автоответ снимает контроль; CI — never (fail-closed)."},{"id":"updates","why":"Preview с ломающими изменениями: пиннинг, обновление как релиз, патчи по id, не правка пакетов."},{"id":"metric","why":"Число команд — внедрение, не эффект; нужны task success, стоимость, откаты, deny/ask; логи — eval-материал."},{"id":"scope","why":"Пилот на 1–2 командах с метриками, затем расширение."}],"decoys":[{"id":"desktop","why":"Desktop — допустимый канал при закрытом контуре; дефект — в настройках, не в канале (проверить тумблер телеметрии)."},{"id":"flash","why":"Выбор модели — не дефект плана; при внутреннем шлюзе модель всё равно своя."}],"verdict":"invalid","verdictWhy":"План нарушает контур данных (внешний API, выгрузка логов, MCP), неверно понимает песочницу и не измеряет эффект — вернуть на переработку.","lesson":"Аудит плана внедрения harness: контур (что уходит наружу, где модель) → граница песочницы и периметр → MCP и approvals → управление версиями preview → метрики эффекта и eval на логах → масштаб пилота."}],"PLAN":{"d1":[["0:00","Диагностика на входе (14 вопросов)","diag"],["0:15","L0 · LLM под капотом: 2 юнита + лаборатория «Экономика»","L0"],["1:00","L1 · Архитектура агента: 3 юнита + босс «Проектирование агента»","L1"],["2:20","L7 · Harness и DeepSeek Harness — приоритет вакансии: 4 юнита","L7"],["4:20","Босс «Пилот dsh в банке» + аудит «План внедрения dsh» + этюд «Harness — просто обёртка»","b7"],["5:00","Студия: миссии 1 (сборка), 4 (запись), 8 (dsh в банке) + шпаргалка «dsh на салфетке» вслух","studio"]],"d2":[["0:00","L2 · Evals и безопасность: 2 юнита + босс «Инцидент: инъекция» + аудит «Eval-отчёт»","L2"],["1:00","L3 · Латентность и экономика: 2 юнита + лаборатории + босс «p95 = 10 с» + Студия M2/M3/M5","L3"],["2:15","L4 · CJM и метрики: 2 юнита + босс «Containment против CSAT»","L4"],["3:10","L5 · Видение/ADR/план, команда, релизы: 3 юнита + артефакты «Видение», «ADR dsh», «План»","L5"],["4:30","L6 · Ожидания и стратегия: 2 юнита + боссы «Демо-эффект», «Смена модели»","L6"],["5:20","Этюды + «Цифры на пальцах» + мок-интервью + банки вопросов (включая harness/dsh) вслух","exam"]]},"VACANCY":{"schema":"vacancy-profile/1.0","title":"Technical Product Owner — разработка ИИ-агентов (harness-направление)","domain":"Банк, цифровые каналы и внутренние платформы ИИ-агентов","location":"Москва · гибрид/офис","targetGrade":"S","updated":"23.10.2026","summary":"TPO отвечает за техническое видение и план развития платформы ИИ-агентов (в приоритете — agent harness, DeepSeek Harness), за команду и взаимодействие tech ↔ business, за внедрение доработок через цифровые каналы с контролем качества релизов и технических показателей, за метрики ИИ-продукта, бэклог и стратегию с учётом трендов ГенИИ. Роль на стыке продукта и архитектуры: кандидат должен рисовать C4-схему агента, считать p95 и стоимость диалога, защищать eval gate перед ИБ и переводить ожидания заказчика в контракт качества.","duties":["Управление ожиданиями заказчика и стейкхолдеров; контракт качества ИИ-продукта","Формирование технического видения ИИ-продукта и harness-платформы; ADR по ключевым решениям","План развития с оценкой ресурсов и сроков; критический путь через допуски ИБ/ПДн","Формирование и координация команды; взаимодействие технических и бизнес-подразделений","Внедрение доработок через цифровые каналы; качество релизов (eval gate → shadow → canary → rollout)","Технические показатели: производительность (p95), надёжность (SLO), масштабируемость (ёмкость GPU)","Построение CJM, исследования пользователей и рынка; выбор сценариев по данным","Метрики ИИ-продукта: containment × task success, конверсия, retention, hallucination rate","Бэклог и приоритизация (RICE/WSJF, квоты потоков, безопасность вне очереди)","Продуктовая стратегия с учётом трендов ГенИИ; build/buy/partner; OKR","Внедрение и развитие agent harness (DeepSeek Harness): контур, политики, пилот, обновления"],"requirements":["Опыт PO/PM в технологических продуктах; опыт с LLM/агентами","Понимание архитектуры ПО с LLM: агентный цикл, RAG, инструменты, БД, harness","Agile/Scrum; JIRA/Confluence; постановка ML-задач как spike","Использование LLM для рабочих задач: спецификации, анализ логов, разметка, черновики ADR","Английский для чтения документации (dsh, Cordis, статьи по harness engineering)"],"grades":[{"id":"J","name":"Junior PO (AI)","years":"1–2 года","salary":[150,220],"focus":"Бэклог и метрики одного сценария под руководством; понимает LLM, RAG и eval на уровне терминов; ведёт JIRA/Confluence.","interview":"Термины L0–L1, базовые метрики, один сценарий CJM."},{"id":"M","name":"Middle PO (AI-продукты)","years":"2–4 года","salary":[250,350],"focus":"Владеет сценарием целиком: golden set, eval gate, дашборд containment × task success, релизы через канарейку; участвует в ADR.","interview":"Разбор eval-отчёта, метрики, план релиза, CJM с данными."},{"id":"S","name":"Senior TPO (ИИ-агенты, harness)","years":"4–7 лет","salary":[350,500],"focus":"Техническое видение платформы и harness, C4 на доске, NFR числами, контур данных и ИБ, план с ресурсами, команда 5–10, контракт качества с заказчиком, внедрение dsh.","interview":"System design агента за 45 минут, dsh на салфетке, инцидент с инъекцией, p95 = 10 с, демо-эффект."},{"id":"L","name":"Lead / Head of AI Agents Platform","years":"7+ лет","salary":[500,800],"focus":"Платформа агентов для N команд, стратегия build/buy/partner, OKR, бюджет и ROI, портфель сценариев, отношения с правлением и регулятором, развитие harness как продукта.","interview":"Стратегия на 3 квартала, экономика платформы, план Б по вендорам, управление несколькими TPO."},{"id":"H","name":"Director / CPO AI","years":"10+ лет","salary":[800,1500],"focus":"Портфель ИИ-продуктов банка, инвестиции и партнёрства, регуляторная позиция, организационный дизайн, целевые показатели уровня правления.","interview":"Видение ИИ в банке на 3 года, инвестиционный кейс, риски и этика, оргструктура."}],"salaryNote":"Вилки — оценка для Москвы (банки и финтех, gross, ₽ тыс./мес.) на октябрь 2026 по открытым источникам: getgrade.ru (Junior 110–185, Middle 247–357, Senior 340–500, Lead 900+; обновлено 23.10.2026), productdo.it (Senior 220–450, Lead 400+, Head в крупных корпорациях 800–1 000; финтех в среднем 320–330; Сбер/Т-Банк senior от 300, Head от 500), checkroi.ru (Junior от 100, CPO до 2 000). Надбавка за технический профиль и LLM-компетенции в источниках оценивается в +15–30%; в вилках выше она учтена. Вакансии банков чаще не публикуют зарплату — ори /* ================= ГЛИФЫ: параметрические SVG-якоря памяти =================
   Принципы (Mayer: coherence/signaling/contiguity; Paivio: dual coding; Fernandes: drawing effect):
   — один глиф = одно понятие, минимум чернил, подпись внутри картинки, числа задачи — внутри картинки;
   — палитра строго из токенов темы: A синий, B оранжевый, ok/err/gold, line/muted; никаких лишних цветов;
   — геометрия несёт смысл (ширина = шум, площадь = выборка, наклон = тренд), текст — только ярлыки.
   Каждый глиф: G.name(params) → строка <svg>. */
var G={};
(function(){
var NS='<svg xmlns="http://www.w3.org/2000/svg" class="glyph" viewBox="0 0 320 ';
function svg(h,inner){return NS+h+'" role="img">'+inner+'</svg>';}
function t(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.fs||11)+'" fill="'+(o.c||'var(--muted)')+'"'+(o.a?' text-anchor="'+o.a+'"':'')+(o.b?' font-weight="700"':'')+(o.m?' font-family="var(--mono)"':'')+(o.i?' font-style="italic"':'')+'>'+esc(s)+'</text>';}
function ln(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'var(--line2)')+'" stroke-width="'+(w||1.5)+'"'+(d?' stroke-dasharray="'+d+'"':'')+' stroke-linecap="round"/>';}
function rc(x,y,w,h,c,o){o=o||{};return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'" rx="'+(o.r==null?3:o.r)+'"'+(o.s?' stroke="'+o.s+'" stroke-width="1.5"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';}
function ci(x,y,r,c,o){o=o||{};return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"'+(o.s?' stroke="'+o.s+'" stroke-width="1.5"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';}
function path(d,c,w,fill){return '<path d="'+d+'" stroke="'+(c||'var(--line2)')+'" stroke-width="'+(w||1.5)+'" fill="'+(fill||'none')+'" stroke-linecap="round" stroke-linejoin="round"/>';}
function bell(cx,base,sd,h,c,w){var d='';for(var x=-3;x<=3.001;x+=0.25){var px=cx+x*sd,py=base-h*Math.exp(-x*x/2);d+=(x===-3?'M':'L')+px.toFixed(1)+' '+py.toFixed(1);}return path(d,c,w||2);}
function fmt(n){return fmtNum(n);}
var A='var(--a)',B='var(--b)',OK='var(--ok)',ERR='var(--err)',GOLD='var(--gold)',MU='var(--muted)',FA='var(--faint)',LN='var(--line2)',INK='var(--ink)',ASOFT='var(--a-soft)',BSOFT='var(--b-soft)';

/* Две группы: A и B как две колонки людей; подписи — доли. p={pa,pb,label} */
G.twoGroups=function(p){var h=136;var s='';var ya=92,x0=40,x1=200;function col(x,pct,c,lbl,soft){var hh=Math.max(6,Math.round(pct*64));s+=rc(x,ya-64,80,64,soft,{r:6});s+=rc(x,ya-hh,80,hh,c,{r:6});s+=t(x+40,ya+15,lbl,{a:'middle',b:true,c:c,fs:11});s+=t(x+40,ya-hh-6,fmtPct(pct,1),{a:'middle',m:true,c:INK,fs:12});}
  col(x0,p.pa,A,'A · контроль',ASOFT);col(x1,p.pb,B,'B · вариант',BSOFT);if(p.label){var lf=10;if(p.label.length*5>290)lf=Math.max(8,Math.floor(2900/(p.label.length*5)));s+=t(160,128,p.label,{a:'middle',fs:lf});}return svg(h,s);};

/* Шум: две одинаковые монеты дали разные доли. p={a,b} в долях */
G.noiseCoins=function(p){var s='';var y=60;function coin(x,v,lbl){s+=ci(x,y,26,'var(--card2)',{s:LN});s+=t(x,y+4,fmtPct(v,1),{a:'middle',m:true,b:true,c:INK,fs:13});s+=t(x,y+44,lbl,{a:'middle'});}
  coin(90,p.a,'та же страница');coin(230,p.b,'та же страница');s+=t(160,y+2,'≠',{a:'middle',fs:18,c:FA});s+=t(160,124,'одинаковые группы · разные числа · это шум',{a:'middle',fs:10,c:MU});return svg(132,s);};

/* √n: четыре квадрата выборки → полоса шума вдвое уже. */
G.sqrtN=function(){var s='';s+=rc(30,30,40,40,ASOFT,{s:A});s+=t(50,88,'n',{a:'middle',m:true,c:A});s+=ln(50,100,50,112,MU,3);s+=t(50,118,'шум ±2',{a:'middle',fs:10});
  s+=t(110,56,'→',{a:'middle',fs:18,c:FA});
  for(var i=0;i<2;i++)for(var j=0;j<2;j++)s+=rc(140+i*42,10+j*42,40,40,ASOFT,{s:A});s+=t(181,106,'4n',{a:'middle',m:true,c:A});s+=ln(181,112,181,118,MU,3);s+=t(181,128,'шум ±1',{a:'middle',fs:10});
  s+=t(290,60,'×4 → ÷2',{a:'end',m:true,b:true,c:INK,fs:12});s+=t(290,76,'SE = σ/√n',{a:'end',m:true,fs:10});return svg(134,s);};

/* Пункты против процентов: две шкалы. p={a,b} доли */
G.ppVsPct=function(p){var s='';var y1=36,y2=86;var x0=30,w=260;s+=ln(x0,y1,x0+w,y1,LN,6);s+=rc(x0,y1-3,w*p.a*4,6,A,{r:3});s+=rc(x0+w*p.a*4,y1-3,w*(p.b-p.a)*4,6,B,{r:0});
  s+=t(x0,y1-10,fmtPct(p.a,1),{m:true,c:A});s+=t(x0+w*p.b*4+4,y1-10,fmtPct(p.b,1),{m:true,c:B});s+=t(x0+w,y1+16,'+'+fmtPct(p.b-p.a,1).replace('%','')+' п.п. — разница долей',{a:'end',fs:11,c:INK,b:true});
  s+=ln(x0,y2,x0+w,y2,LN,6);s+=rc(x0,y2-3,w*0.6,6,A,{r:3});s+=rc(x0+w*0.6,y2-3,w*0.6*((p.b-p.a)/p.a),6,B,{r:0});s+=t(x0,y2-10,'база = 100%',{m:true,c:A});s+=t(x0+w,y2+16,'+'+fmtPct((p.b-p.a)/p.a,0)+' отн. — лифт от базы',{a:'end',fs:11,c:INK,b:true});return svg(112,s);};

/* Две колокольни: эффект против шума. p={se, diff} в п.п.; рисуем контроль и вариант, стрелка разницы. */
G.bells=function(p){var s='';var base=92;var sd=Math.max(10,Math.min(40,22));var cx=120,dx=Math.max(8,Math.min(120,p.diff/p.se*sd));
  s+=bell(cx,base,sd,60,A);s+=bell(cx+dx,base,sd,60,B);s+=ln(20,base,300,base,LN,1);
  s+=ln(cx,base+4,cx,base+16,A,1.5);s+=ln(cx+dx,base+4,cx+dx,base+16,B,1.5);s+=ln(cx,base+12,cx+dx,base+12,INK,1.5);
  s+=t(cx+dx/2,base+26,'разница = '+fmt(p.diff/p.se).replace('.',',')+' SE',{a:'middle',m:true,c:INK,fs:11,b:true});
  s+=ln(cx-sd,base-36,cx+sd,base-36,A,1,'3 3');s+=t(cx,base-42,'±1 SE',{a:'middle',fs:9,c:A});
  s+=t(300,20,p.diff/p.se>=1.96?'|z| ≥ 1,96 → p < 0,05':'|z| < 1,96 → внутри шума',{a:'end',m:true,fs:11,c:p.diff/p.se>=1.96?OK:MU});return svg(122,s);};

/* Доверительный интервал на числовой оси против 0 и MDE. p={lo,hi,est,mde,unit} */
G.ci=function(p){var s='';var dot=ci;var lo=Math.min(p.lo,0,p.mde||0),hi=Math.max(p.hi,0,p.mde||0);var pad=(hi-lo)*0.2||1;lo-=pad;hi+=pad;function X(v){return 24+(v-lo)/(hi-lo)*272;}var y=56;
  s+=ln(24,y,296,y,LN,1);s+=ln(X(0),y-26,X(0),y+22,FA,1.2,'3 3');s+=t(X(0),y+36,'0',{a:'middle',m:true});
  if(p.mde!=null){s+=ln(X(p.mde),y-26,X(p.mde),y+22,B,1.2,'3 3');s+=t(X(p.mde),y+36,'MDE',{a:'middle',m:true,c:B});}
  s+=ln(X(p.lo),y,X(p.hi),y,A,5);s+=dot(X(p.est),y,5,A);s+=t(X(p.lo),y-14,fmt(p.lo),{a:'middle',m:true,c:A});s+=t(X(p.hi),y-14,fmt(p.hi),{a:'middle',m:true,c:A});
  var v=p.lo>0&&(p.mde==null||p.lo>=p.mde)?'интервал выше нуля и MDE':(p.lo>0?'выше нуля, но задевает ниже MDE':(p.hi<(p.mde||0)?'целиком ниже MDE: эффекта такого размера нет':'включает и 0, и MDE: тест не ответил'));
  s+=t(160,108,v,{a:'middle',fs:11,c:INK,b:true});if(p.unit)s+=t(296,y+36,p.unit,{a:'end',fs:9});return svg(116,s);};

/* Матрица ошибок 2×2: истина × вывод. p={hl:'a'|'b'|'power'|'tn'} подсветка */
G.errors=function(p){var s='';var x0=90,y0=26,w=100,h=40;var cells=[['tn','Верное «нет»','1 − α',x0,y0],['a','Ложная победа','α',x0+w,y0],['b','Пропуск','β',x0,y0+h],['power','Нашли','мощность 1 − β',x0+w,y0+h]];
  s+=t(x0+w/2,14,'вывод: нет',{a:'middle',fs:9});s+=t(x0+w+w/2,14,'вывод: есть',{a:'middle',fs:9});s+=t(x0-6,y0+h/2+4,'нет',{a:'end',fs:10});s+=t(x0-6,y0+h+h/2+4,'есть',{a:'end',fs:10});s+=t(10,y0+h,'истина',{fs:9});
  cells.forEach(function(c){var hl=p&&p.hl===c[0];var col=c[0]==='a'?ERR:(c[0]==='b'?GOLD:(c[0]==='power'?OK:MU));s+=rc(c[3],c[4],w-2,h-2,hl?col:'var(--card2)',{s:col,op:hl?0.9:1});s+=t(c[3]+w/2-1,c[4]+16,c[1],{a:'middle',fs:10,c:hl?'#fff':INK,b:hl});s+=t(c[3]+w/2-1,c[4]+30,c[2],{a:'middle',m:true,fs:10,c:hl?'#fff':col});});
  return svg(116,s);};

/* Выборка ∝ 1/MDE²: ступеньки площади. p={base, mde1, mde2} */
G.mdeSquare=function(p){var s='';var k=16*p.base*(1-p.base);var n1=k/Math.pow(p.mde1,2),n2=k/Math.pow(p.mde2,2);var r=Math.sqrt(n2/n1);var a=34,b=Math.min(80,a*r);
  s+=rc(40,100-a,a,a,ASOFT,{s:A});s+=t(40+a/2,110,'MDE '+fmtPct(p.mde1,1),{a:'middle',fs:10,m:true,c:A});s+=t(40+a/2,100-a-6,fmt(Math.round(n1)),{a:'middle',m:true,fs:10,c:INK});
  s+=rc(130,100-b,b,b,BSOFT,{s:B});s+=t(130+b/2,110,'MDE '+fmtPct(p.mde2,1),{a:'middle',fs:10,m:true,c:B});s+=t(130+b/2,100-b-6,fmt(Math.round(n2)),{a:'middle',m:true,fs:10,c:INK});
  s+=t(300,52,'n ∝ 1/MDE²',{a:'end',m:true,b:true,c:INK,fs:11});s+=t(300,68,'×'+fmt(Math.round(n2/n1*10)/10),{a:'end',m:true,fs:11,c:B});return svg(118,s);};

/* Паспорт: 9 полей как сетка, закрашены заполненные. p={on:[idx...]} */
G.passport=function(p){var names=['гипотеза','1 метрика','guardrails','база','MDE','α','мощность','единица','стоп'];var s='';var on=(p&&p.on)||null;for(var i=0;i<9;i++){var x=14+(i%3)*100,y=8+Math.floor(i/3)*34;var f=!on||on.indexOf(i)>=0;s+=rc(x,y,94,28,f?ASOFT:'var(--card2)',{s:f?A:LN,r:5});s+=t(x+47,y+18,(i+1)+'. '+names[i],{a:'middle',fs:10,c:f?A:FA,b:f});}
  s+=t(160,120,'девять полей до старта · пустое поле = дыра для подгонки',{a:'middle',fs:10});return svg(126,s);};

/* Иерархия метрик: пирамида первичная / вторичные / guardrails с порогами */
G.metricTree=function(p){var s='';s+=rc(110,10,100,26,A,{r:6});s+=t(160,27,'первичная · одна',{a:'middle',fs:10,c:'#fff',b:true});
  for(var i=0;i<3;i++){s+=rc(40+i*86,54,68,22,ASOFT,{s:A,r:5});s+=t(74+i*86,69,'вторичная',{a:'middle',fs:9,c:A});}
  for(var j=0;j<3;j++){s+=rc(40+j*86,94,68,22,'var(--card2)',{s:ERR,r:5});s+=t(74+j*86,109,'guardrail ≤ порог',{a:'middle',fs:9,c:ERR});}
  s+=ln(160,36,160,54,LN,1);s+=t(160,128,'решает первичная + guardrails; вторичные объясняют',{a:'middle',fs:10});return svg(134,s);};

/* Хеш и соль: id → бакет 0–99 → группа */
G.hashSalt=function(p){var s='';s+=rc(10,40,78,30,'var(--card2)',{s:LN,r:6});s+=t(49,59,'user_id',{a:'middle',m:true,fs:11,c:INK});s+=t(49,30,'+ соль теста',{a:'middle',fs:9,c:B});
  s+=t(100,60,'→ hash →',{fs:11,m:true,c:MU});s+=rc(166,40,60,30,'var(--card2)',{s:LN,r:6});s+=t(196,59,(p&&p.bucket!=null?p.bucket:'37'),{a:'middle',m:true,fs:13,c:INK,b:true});s+=t(196,30,'0…99',{a:'middle',fs:9});
  s+=rc(244,26,66,24,ASOFT,{s:A,r:5});s+=t(277,42,'0–49 → A',{a:'middle',fs:10,m:true,c:A});s+=rc(244,60,66,24,BSOFT,{s:B,r:5});s+=t(277,76,'50–99 → B',{a:'middle',fs:10,m:true,c:B});
  s+=t(160,104,'один id → всегда одна группа',{a:'middle',fs:10});s+=t(160,118,'новая соль → новое перемешивание',{a:'middle',fs:10});return svg(126,s);};

/* Триггер: воронка, где различие начинается глубоко. p={share} доля дошедших */
G.trigger=function(p){var s='';var sh=p&&p.share!=null?p.share:0.1;s+=path('M20 20 L300 20 L300 44 L20 44 Z',LN,1,'var(--card2)');s+=t(160,36,'все, кто запустил приложение — 100%',{a:'middle',fs:10});
  var w=Math.max(40,280*sh);s+=path('M'+(160-w/2)+' 62 L'+(160+w/2)+' 62 L'+(160+w/2)+' 86 L'+(160-w/2)+' 86 Z',B,1.5,BSOFT);s+=t(160,78,'видели различие — '+fmtPct(sh,0),{a:'middle',fs:10,c:B,b:true});
  s+=ln(160,44,160,62,B,1.5);s+=t(160,112,'присваивай здесь ↑  иначе эффект разбавлен в '+fmt(Math.round(1/sh))+' раз',{a:'middle',fs:10,c:INK});return svg(120,s);};

/* SRM: две колонки людей, план против факта. p={na,nb,chi,p} */
G.srm=function(p){var s='';var mx=Math.max(p.na,p.nb);function col(x,n,c,lbl){var h=Math.round(n/mx*70);s+=rc(x,96-h,70,h,c,{r:5});s+=t(x+35,110,lbl,{a:'middle',fs:10,c:c,b:true});s+=t(x+35,96-h-6,fmt(n),{a:'middle',m:true,fs:11,c:INK});}
  col(40,p.na,A,'A');col(130,p.nb,B,'B');s+=ln(40,96-70*Math.min(p.na,p.nb)/mx,200,96-70*Math.min(p.na,p.nb)/mx,ERR,1,'3 3');
  s+=t(225,40,'χ² = '+fmt(p.chi),{m:true,fs:12,c:INK,b:true});s+=t(225,58,'p '+(p.p<0.0001?'< 0,0001':'= '+fmt(p.p)),{m:true,fs:11,c:p.p<0.001?ERR:OK});s+=t(225,76,p.p<0.001?'SRM: не читать':'сплит в норме',{fs:11,c:p.p<0.001?ERR:OK,b:true});s+=t(225,92,'порог p < 0,001',{fs:9});return svg(118,s);};

/* Подглядывание: траектория p по дням, ныряющая под α. p={days:[...p], alpha} */
G.peek=function(p){var s='';var ds=p.days;var n=ds.length;function X(i){return 30+i*(270/(n-1));}function Y(v){return 90-v*76;}var d='';ds.forEach(function(v,i){d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);});
  s+=ln(30,Y(p.alpha),300,Y(p.alpha),ERR,1,'4 3');s+=t(300,Y(p.alpha)-4,'α',{a:'end',m:true,c:ERR,fs:10});s+=path(d,A,2);ds.forEach(function(v,i){if(v<p.alpha)s+=ci(X(i),Y(v),4,ERR);});
  s+=t(30,106,'день 1',{fs:9});s+=t(300,106,'день '+n,{a:'end',fs:9});s+=t(160,120,'стоп на первом красном дне = ловля шума',{a:'middle',fs:10,c:INK});return svg(126,s);};

/* Множественность: m кубиков, часть красных. p={m, alpha} */
G.multi=function(p){var s='';var m=p.m;var prob=1-Math.pow(1-p.alpha,m);var per=Math.min(8,m);var size=Math.min(20,Math.floor(170/per));for(var i=0;i<m&&i<24;i++){var x=20+(i%per)*(size+2),y=16+Math.floor(i/per)*(size+2);var red=(i===Math.floor(m*0.37));s+=rc(x,y,size,size,red?ERR:'var(--card2)',{s:red?ERR:LN,r:4});}
  s+=t(300,40,'m = '+m,{a:'end',m:true,fs:12,c:INK,b:true});s+=t(300,58,'P(≥1 ложная)',{a:'end',fs:10});s+=t(300,76,'= 1 − '+(1-p.alpha).toString().replace('.',',')+'^'+m+' ≈ '+fmtPct(prob,0),{a:'end',m:true,fs:11,c:ERR,b:true});
  s+=t(160,110,'каждая проверка — ещё один бросок',{a:'middle',fs:10});return svg(118,s);};

/* Интервал против интервала: узкий незначимый vs широкий незначимый */
G.twoCI=function(p){var s='';var mx=Math.max.apply(null,[p.lo1,p.hi1,p.lo2,p.hi2].map(Math.abs))||1;var k=120/mx;function X(v){return 160+v*k;}function row(y,lo,hi,lbl,c){s+=ln(30,y,290,y,LN,1);s+=ln(X(0),y-10,X(0),y+10,FA,1,'3 3');s+=ln(X(lo),y,X(hi),y,c,5);s+=ci(X((lo+hi)/2),y,4,c);s+=t(30,y-10,lbl,{fs:10,c:INK});}

/* Дилюция: эффект у затронутых × доля = эффект на всех */

/* Новизна: эффект по неделям тает. p={weeks:[...]} */

G.beforeAfter=function(p){var s='';s+=t(20,22,'до / после',{fs:10,c:ERR,b:true});s+=ln(20,40,300,40,LN,1);s+=rc(20,30,120,10,ASOFT,{r:3});s+=rc(160,26,140,14,BSOFT,{r:3});s+=t(80,56,'неделя 1 · старое',{a:'middle',fs:9,c:A});s+=t(230,56,'неделя 2 · новое + всё остальное',{a:'middle',fs:9,c:B});

/* Слои тестов: взаимоисключающие против независимых */

/* Ratio: заказы одного пользователя зависимы */

/* Воронка метрик к механизму: близко/далеко */

  $app.innerHTML=h;bindTop();bindBack('home');var qi=document.getElementById('lex-q');qi.oninput=function(){LEX_Q=qi.value;var pos=qi.selectionStart;lexiconView();var q2=document.getElementById('lex-q');q2.focus();try{q2.setSelectionRange(pos,pos);}catch(e){}};

function calcEval(expr){var s=String(expr).replace(/[\s ]/g,'').replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/sqrt/gi,'√');if(!/^[0-9.+\-*/^()%√]+$/.test(s))throw new Error('bad');var i=0;

  function pow(){var a=num();while(s[i]==='^'){i++;a=Math.pow(a,num());}return a;}

  var r=sum();if(i<s.length)throw new Error('tail');if(!isFinite(r))throw new Error('inf');return r;}

    keys.forEach(function(k){var b=el('<button class="'+(['÷','×','−','+','^','%','(',')','√'].indexOf(k)>=0?'op':(k==='='?'eq':(k==='⌫'||k==='C'?'fn':'')))+'">'+k+'</button>');b.onclick=function(){if(k==='C'){inp.value='';sh.querySelector('#c-res').style.display='none';return;}if(k==='⌫'){inp.value=inp.value.slice(0,-1);return;}if(k==='='){run();return;}inp.value+=(k==='√'?'√(':k);inp.focus();};kb.appendChild(b);});
    function drawHist(){sh.querySelector('#c-hist').innerHTML=hist.slice().reverse().map(function(h){return '<div class="row small" style="justify-content:space-between;margin:4px 0"><span class="muted">'+esc(h.e)+'</span><button class="btn xs ghost num" data-v="'+esc(calcPlain(h.v))+'">= '+fmtCalc(h.v)+'</button></div>';}).join('');each(sh.querySelectorAll('[data-v]'),function(b){b.onclick=function(){inp.value+=b.getAttribute('data-v');inp.focus();};});}
    function run(){try{var v=calcEval(inp.value);last=v;sh.querySelector('#c-res').style.display='';sh.querySelector('#c-val').textContent=fmtCalc(v);hist.push({e:inp.value,v:v});hist=hist.slice(-10);S.set('calc',hist);drawHist();}catch(e){inp.classList.add('shake');setTimeout(function(){inp.classList.remove('shake');},350);}}
    inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.keyCode===13)run();});drawHist();var to=sh.querySelector('#c-to');if(to)to.onclick=function(){if(last==null)run();if(last!=null&&NUM_TARGET){NUM_TARGET.value=calcPlain(last);kill();}};});}

function gv(id){var e=document.getElementById(id);if(!e)return NaN;return parseFloat(String(e.value).replace(/[\s ]/g,'').replace(',','.'));}
function svgLine(pts,w,h,color,opts){opts=opts||{};if(!pts.length)return '';var xs=pts.map(function(p){return p[0];}),ys=pts.map(function(p){return p[1];});var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=opts.y0!=null?opts.y0:Math.min.apply(null,ys),y1=opts.y1!=null?opts.y1:Math.max.apply(null,ys);if(y1===y0)y1=y0+1;if(x1===x0)x1=x0+1;
  function X(x){return 36+(x-x0)/(x1-x0)*(w-46);}function Y(y){return 8+(1-(y-y0)/(y1-y0))*(h-28);}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);}).join(' ');
  var s='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
  if(opts.hline!=null)s+='<line x1="36" x2="'+(w-10)+'" y1="'+Y(opts.hline)+'" y2="'+Y(opts.hline)+'" stroke="var(--err)" stroke-dasharray="4 3"/>';
  s+='<text x="2" y="'+(Y(y1)+4)+'" font-size="10" fill="var(--faint)">'+esc(opts.fy?opts.fy(y1):fmtNum(y1))+'</text><text x="2" y="'+(Y(y0)+4)+'" font-size="10" fill="var(--faint)">'+esc(opts.fy?opts.fy(y0):fmtNum(y0))+'</text><text x="36" y="'+(h-2)+'" font-size="10" fill="var(--faint)">'+esc(opts.fx?opts.fx(x0):fmtNum(x0))+'</text><text x="'+(w-10)+'" y="'+(h-2)+'" font-size="10" text-anchor="end" fill="var(--faint)">'+esc(opts.fx?opts.fx(x1):fmtNum(x1))+'</text>';
  return s;}

    var pts=[];for(var k=1000;k<=8000;k+=500){pts.push([k,turns*k/1000*pin*(cache?(1-ss*0.9):1)+outCost+infra]);}
    r+='<svg class="chart" viewBox="0 0 320 120">'+svgLine(pts,320,120,'var(--a)',{fx:function(x){return fmtNum(x)+' tok_in';},fy:function(y){return fmtNum(_r1(y))+' ₽';},y0:0})+'</svg><div class="small faint">Стоимость диалога линейно растёт с входными токенами на ход: системный промпт, история, фрагменты RAG. Первые рычаги — кэш промпта, сжатие истории, top-k.</div>';
    var alt=turns*tin/1000*pin*(1-ss*0.9)+outCost+infra;r+='<div class="sol small">Если включить кэш системного промпта: '+fmtNum(_r2(alt))+' ₽ (−'+Math.round((1-alt/(turns*tin/1000*pin+outCost+infra))*100)+'%). Если сократить входные на треть (история + top-k): '+fmtNum(_r2(turns*tin*0.67/1000*pin*(cache?(1-ss*0.9):1)+outCost+infra))+' ₽.\nФормула: cost = Σ ходов (tok_in × p_in + tok_out × p_out) + c_search + c_guard + c_infra.</div>';

function labEvals(box){var st=S.get('labevals',{p:80,mde:5,alpha:5,power:80,agree:172,labeled:200});
  box.innerHTML='<div class="lab"><h3>Eval: размер golden set и доверие судье</h3><div class="small muted">Сколько примеров нужно, чтобы отличить версию с долей «хороших» ответов p от версии на δ п.п. лучше, и насколько судья согласен с людьми.</div><div class="two">'+fld('le-p','Доля хороших ответов у базы, %',st.p)+fld('le-mde','Минимальная разница, п.п.',st.mde)+'</div><div class="two">'+fld('le-alpha','α, %',st.alpha)+fld('le-power','Мощность, %',st.power)+'</div><div class="two">'+fld('le-agree','Судья совпал с людьми, шт.',st.agree)+fld('le-labeled','Размечено людьми, шт.',st.labeled)+'</div><button class="btn wide" id="le-go">Посчитать</button><div id="le-res"></div></div>';
  function run(){var p=gv('le-p')/100,mde=gv('le-mde')/100,alpha=gv('le-alpha')/100,power=gv('le-power')/100,ag=gv('le-agree'),lb=gv('le-labeled');if(!(p>0&&p<1&&mde>0&&alpha>0&&power>0&&lb>0))return;
    S.set('labevals',{p:p*100,mde:mde*100,alpha:alpha*100,power:power*100,agree:ag,labeled:lb});labUsed('evals');
    var p2=Math.min(0.999,p+mde);var n=nProp(p,p2,alpha,power,2);var acc=ag/lb;var se=Math.sqrt(acc*(1-acc)/lb);var lo=acc-1.96*se,hi=acc+1.96*se;
    var r='<div class="res"><div class="k">Примеров в golden set на версию</div><div class="big">'+fmtNum(n)+'</div><div class="small muted">чтобы отличить '+fmtPct(p,0)+' от '+fmtPct(p2,0)+' при α '+Math.round(alpha*100)+'% и мощности '+Math.round(power*100)+'% (парный прогон одного набора двумя версиями требует меньше — считайте это верхней оценкой)</div></div>';
    r+='<div class="ab2"><div class="va"><span class="k">согласие судьи</span><b>'+fmtPct(acc,1)+'</b><span class="small muted">'+ag+' из '+lb+'</span></div><div class="vb"><span class="k">интервал 95%</span><b>'+fmtPct(Math.max(0,lo),0)+'–'+fmtPct(Math.min(1,hi),0)+'</b><span class="small muted">'+(lo>=0.85?'надёжно ≥ 85%':(acc>=0.85?'порог 85% внутри интервала — доразметить':'ниже порога — судья не валиден'))+'</span></div></div>';

    r+='<div class="sol small">n = (z<sub>1−α/2</sub> + z<sub>1−β</sub>)² · [p₁(1−p₁) + p₂(1−p₂)] / (p₂−p₁)². Согласие судьи = совпадения ÷ размеченные; интервал ≈ ±1,96·√(acc(1−acc)/n). Смещения судьи (длина, позиция) интервалом не ловятся — нужны парные сравнения с перестановкой.</div>';

function vacDone(kind,id){
  if(kind==='units'){var p=unitProg(id);return !!(p&&p.acc>=0.6);}

  if(kind==='etudes')return etudeBest(id)>=0.6;

  var certs=S.get('certs',{});D.LEVELS.forEach(function(L){w.w(Math.round(Math.min(1,certs[L.id]||0)*15),4);});

  var nu=r.r(8);var us=xfList(D.UNITS);if(nu!==us.length)throw new Error('units');var un={};us.forEach(function(id){if(r.r(1))un[id]={acc:r.r(4)/15,n:1,last:Date.now()};});

  var cap=qrCapacity(v);var w=new BitW();w.w(4,4);w.w(bytes.length,v<10?8:16);bytes.forEach(function(b){w.w(b,8);});var rem=cap*8-w.bits.length;w.w(0,Math.min(4,rem));while(w.bits.length%8)w.bits.push(0);var data=w.bytes();var pad=[236,17];var pi=0;while(data.length<cap){data.push(pad[pi]);pi^=1;}
  var e=QR_EC[v];var blocks=[],ecs=[];var pos=0;for(var b=0;b<e[1];b++){var d=data.slice(pos,pos+e[2]);pos+=e[2];blocks.push(d);ecs.push(rsEncode(d,e[0]));}for(var b2=0;b2<e[3];b2++){var d2=data.slice(pos,pos+e[4]);pos+=e[4];blocks.push(d2);ecs.push(rsEncode(d2,e[0]));}
  var out=[];var maxD=Math.max(e[2],e[4]);for(var i3=0;i3<maxD;i3++)blocks.forEach(function(bl){if(i3<bl.length)out.push(bl[i3]);});for(var i4=0;i4<e[0];i4++)ecs.forEach(function(ec){out.push(ec[i4]);});
  var size=17+4*v;var m=[],fn=[];for(var r=0;r<size;r++){m.push([]);fn.push([]);for(var c=0;c<size;c++){m[r].push(0);fn[r].push(false);}}
  function set(r,c,val){m[r][c]=val;fn[r][c]=true;}
  function finder(r0,c0){for(var r=-1;r<=7;r++)for(var c=-1;c<=7;c++){var rr=r0+r,cc=c0+c;if(rr<0||cc<0||rr>=size||cc>=size)continue;var on=(r>=0&&r<=6&&c>=0&&c<=6)&&(r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4));set(rr,cc,on?1:0);}}
  finder(0,0);finder(0,size-7);finder(size-7,0);
  var al=QR_ALIGN[v];for(var ai=0;ai<al.length;ai++)for(var aj=0;aj<al.length;aj++){var ar=al[ai],ac=al[aj];if(fn[ar][ac])continue;for(var r=-2;r<=2;r++)for(var c=-2;c<=2;c++)set(ar+r,ac+c,(Math.max(Math.abs(r),Math.abs(c))!==1)?1:0);}
  for(var t=8;t<size-8;t++){if(!fn[6][t])set(6,t,t%2===0?1:0);if(!fn[t][6])set(t,6,t%2===0?1:0);}
  set(size-8,8,1);
  for(var i5=0;i5<=8;i5++){if(!fn[8][i5])set(8,i5,0);if(!fn[i5][8])set(i5,8,0);}for(var i6=0;i6<8;i6++){set(8,size-1-i6,0);set(size-1-i6,8,0);}
  if(v>=7){for(var r2=0;r2<6;r2++)for(var c2=0;c2<3;c2++){set(r2,size-11+c2,0);set(size-11+c2,r2,0);}}
  var dataBits=[];out.forEach(function(b){for(var k=7;k>=0;k--)dataBits.push((b>>k)&1);});var bi=0;var up=true;
  for(var col=size-1;col>0;col-=2){if(col===6)col--;for(var k2=0;k2<size;k2++){var row=up?size-1-k2:k2;for(var dc=0;dc<2;dc++){var cc2=col-dc;if(!fn[row][cc2]){m[row][cc2]=dataBits[bi++]||0;}}}up=!up;}
  var masks=[function(r,c){return (r+c)%2===0;},function(r,c){return r%2===0;},function(r,c){return c%3===0;},function(r,c){return (r+c)%3===0;},function(r,c){return (Math.floor(r/2)+Math.floor(c/3))%2===0;},function(r,c){return (r*c)%2+(r*c)%3===0;},function(r,c){return ((r*c)%2+(r*c)%3)%2===0;},function(r,c){return ((r+c)%2+(r*c)%3)%2===0;}];
  function penalty(mm){var p=0;for(var r=0;r<size;r++){var run=1;for(var c=1;c<size;c++){if(mm[r][c]===mm[r][c-1]){run++;if(run===5)p+=3;else if(run>5)p++;}else run=1;}}for(var c3=0;c3<size;c3++){var run2=1;for(var r3=1;r3<size;r3++){if(mm[r3][c3]===mm[r3-1][c3]){run2++;if(run2===5)p+=3;else if(run2>5)p++;}else run2=1;}}
    for(var r4=0;r4<size-1;r4++)for(var c4=0;c4<size-1;c4++){var s=mm[r4][c4]+mm[r4][c4+1]+mm[r4+1][c4]+mm[r4+1][c4+1];if(s===0||s===4)p+=3;}
    var dark=0;for(var r5=0;r5<size;r5++)for(var c5=0;c5<size;c5++)dark+=mm[r5][c5];var pct=dark*100/(size*size);p+=Math.floor(Math.abs(pct-50)/5)*10;return p;}
  function formatBits(mask){var d=(0<<3)|mask;/* EC M = 00 */var bits=d<<10;var g=0x537;for(var i=14;i>=10;i--)if((bits>>i)&1)bits^=g<<(i-10);return ((d<<10)|bits)^0x5412;}
  function applyAll(mask){var mm=[];for(var r=0;r<size;r++){mm.push([]);for(var c=0;c<size;c++)mm[r].push(fn[r][c]?m[r][c]:(m[r][c]^(masks[mask](r,c)?1:0)));}

    for(var i=0;i<8;i++)mm[size-1-i][8]=fb[i];for(var j=0;j<7;j++)mm[8][size-7+j]=fb[8+j];mm[size-8][8]=1;
    if(v>=7){var vb=v<<12;var gg=0x1f25;for(var i2=17;i2>=12;i2--)if((vb>>i2)&1)vb^=gg<<(i2-12);vb|=v<<12;for(var k=0;k<18;k++){var bit=(vb>>k)&1;mm[Math.floor(k/3)][size-11+(k%3)]=bit;mm[size-11+(k%3)][Math.floor(k/3)]=bit;}}
    return mm;}
  var best=null,bestP=1e9;for(var mk=0;mk<8;mk++){var mm=applyAll(mk);var p=penalty(mm);if(p<bestP){bestP=p;best=mm;}}
  return best;}
function qrSvg(text,px){var m=qrEncode(text);var n=m.length;var q=4;var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(n+2*q)+' '+(n+2*q)+'" width="'+px+'" height="'+px+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path fill="#000" d="';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(m[r][c])s+='M'+(c+q)+' '+(r+q)+'h1v1h-1z';return s+'"/></svg>';}

    h+='<div class="mech" style="margin-top:12px">Дефекты</div>';if(!a.defects.length)h+='<div class="small">Дефектов нет — это чистый отчёт.</div>';a.defects.forEach(function(d){var fl=null;a.flags.forEach(function(f){if(f.id===d.id)fl=f;});h+='<div class="opt '+(AUD.flags[d.id]?'ok':'miss')+'" style="cursor:default"><span><b>'+esc(fl?fl.t:d.id)+'</b><div class="why">'+(AUD.flags[d.id]?'':'<b class="gold-c">Пропущено.</b> ')+esc(d.why)+'</div></span></div>';});
    var fps=a.decoys.filter(function(d){return AUD.flags[d.id];});if(fps.length){h+='<div class="mech" style="margin-top:10px">Ложные пометки</div>';fps.forEach(function(d){var fl=null;a.flags.forEach(function(f){if(f.id===d.id)fl=f;});h+='<div class="opt bad" style="cursor:default"><span><b>'+esc(fl?fl.t:d.id)+'</b><div class="why">'+esc(d.why)+'</div></span></div>';});}
    h+='<div class="mech" style="margin-top:10px">Решение</div><div class="opt '+(r.vOk?'ok':'bad')+'" style="cursor:default"><span><b>'+esc(VERDICT_LABELS[a.verdict])+'</b><div class="why">'+esc(a.verdictWhy)+'</div></span></div>';
    h+='<div class="sol" style="border-color:var(--b)"><b>Урок.</b> '+esc(a.lesson)+'</div><button class="btn wide" id="done" style="margin-top:12px">Готово</button></div>';}
  $app.innerHTML=h;bindTop();document.getElementById('quit').onclick=function(){if(AUD.ph>0&&AUD.ph<3)resumeSave('audit',id,a.title,AUD,'этап '+(AUD.ph+1));AUD=null;go('audit');};
  if(AUD.ph===0){document.getElementById('nx').onclick=function(){AUD.ph=1;auditCaseView(id);window.scrollTo(0,0);};}
  else if(AUD.ph===1){var fl=document.getElementById('fl');a.flags.forEach(function(f,i){var b=el('<button class="opt'+(AUD.flags[f.id]?' sel':'')+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+esc(f.t)+'</span></button>');b.onclick=function(){AUD.flags[f.id]=!AUD.flags[f.id];b.classList.toggle('sel',!!AUD.flags[f.id]);};fl.appendChild(b);});
    document.getElementById('nx').onclick=function(){AUD.ph=2;auditCaseView(id);window.scrollTo(0,0);};}
  else if(AUD.ph===2){var vd=document.getElementById('vd');var ok=document.getElementById('nx');var keys=['invalid','ship','kill','iterate','undecided'];
    keys.forEach(function(k,i){var b=el('<button class="opt'+(AUD.verdict===k?' sel':'')+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+esc(VERDICT_LABELS[k])+'</span></button>');b.onclick=function(){AUD.verdict=k;each(vd.children,function(x){x.classList.remove('sel');});b.classList.add('sel');ok.disabled=false;};vd.appendChild(b);});
    ok.onclick=function(){AUD.ph=3;auditCaseView(id);window.scrollTo(0,0);};}
  else{document.getElementById('done').onclick=function(){AUD=null;go('audit');};if(auditScore(a).score>=1)SFX.fanfare();}}
function auditScore(a){var hit=0,fp=0;a.defects.forEach(function(d){if(AUD.flags[d.id])hit++;});a.decoys.forEach(function(d){if(AUD.flags[d.id])fp++;});var vOk=AUD.verdict===a.verdict;
  var nd=a.defects.length;var fpart=nd?Math.max(0,(hit-fp*0.5)/nd):(fp?0:1);var score=0.7*fpart+0.3*(vOk?1:0);if(hit===nd&&!fp&&vOk)score=1;return {hit:hit,fp:fp,vOk:vOk,score:score};}
