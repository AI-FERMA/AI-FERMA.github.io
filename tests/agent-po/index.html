елает TPO?","options":[{"id":"o0","text":"Фиксирует версии и проводит обновление через eval gate и shadow как обычный релиз","correct":true,"rationale":"Смена модели — релиз поведения."},{"id":"o1","text":"Ничего: API тот же, значит, и ответы те же — вендор гарантирует обратную совместимость","correct":false,"rationale":"Поведение меняется при том же API."},{"id":"o2","text":"Отключает агента до выяснения всех изменений в новой модели и получения отчёта от вендора","correct":false,"rationale":"Избыточно без сигнала."},{"id":"o3","text":"Просит вендора откатить обновление для банка и оставить старую версию по договору","correct":false,"rationale":"Не всегда возможно; нужен свой процесс."}],"anchor":{"g":"release","p":{"hl":[1,2],"note":"model X-2026-03 → X-2026-05 через gate"},"cap":"версия модели — часть релиза"},"id":"u5-3-t0"},{"mechanic":"single","points":2,"stem":"Зачем shadow-режим, если eval gate уже пройден?","options":[{"id":"o0","text":"Golden set не покрывает дрейф живого трафика; shadow сравнивает без риска","correct":true,"rationale":"Второй фильтр до клиентов."},{"id":"o1","text":"Чтобы увеличить нагрузку на GPU и проверить ёмкость инфраструктуры перед выкладкой новой версии","correct":false,"rationale":"Побочный эффект, не цель."},{"id":"o2","text":"Для отчётности перед ИБ, которая требует доказательств работы в проме до допуска к клиентам","correct":false,"rationale":"ИБ нужны заключения и red-team, а не трафик в shadow."},{"id":"o3","text":"Shadow не нужен, если есть канарейка: она тоже работает на живом трафике и покажет дрейф","correct":false,"rationale":"Канарейка уже показывает ответы клиентам."}],"anchor":{"g":"compare","p":{"a":["v1 (прод)","ответ показан"],"b":["v2 (shadow)","ответ скрыт, судья сравнивает"],"verdict":"дрейф пойман до клиентов"},"cap":"shadow — живой трафик без риска"},"id":"u5-3-t1"},{"mechanic":"single","points":2,"stem":"Почему логика агента для мобильного приложения должна жить на сервере?","options":[{"id":"o0","text":"Релиз и откат приложения идут через ревью магазинов днями; сервер — за минуту","correct":true,"rationale":"Канал диктует архитектуру отката."},{"id":"o1","text":"Телефоны слабые и не потянут локальную обработку промптов, истории диалога и структурированных ответов","correct":false,"rationale":"Не причина для логики оркестрации."},{"id":"o2","text":"Чтобы скрыть промпт и логику агента от клиентов и конкурентов, которые декомпилируют приложение","correct":false,"rationale":"Скрытие промпта — следствие серверной логики, а не причина выбора."},{"id":"o3","text":"Так требует регулятор: логика обработки персональных данных должна исполняться в контуре банка","correct":false,"rationale":"Это инженерное решение."}],"anchor":{"g":"pipeline","p":{"steps":["приложение: тонкий клиент","API","сервер: оркестратор + промпт + flag"],"hl":[2]},"cap":"откат за минуту — только на сервере"},"id":"u5-3-t2"},{"mechanic":"single","points":2,"stem":"Какая метрика качества релизов показывает зрелость процесса лучше всего?","options":[{"id":"o0","text":"Доля релизов через полный gate без исключений и MTTR с flag","correct":true,"rationale":"Процесс соблюдается и откат быстрый."},{"id":"o1","text":"Число релизов в месяц: частые выкладки означают зрелый конвейер","correct":false,"rationale":"Скорость без качества."},{"id":"o2","text":"Число строк в промпте и покрытие его правил примерами","correct":false,"rationale":"Длина промпта ничего не говорит о качестве процесса релизов."},{"id":"o3","text":"Доля релизов, одобренных заказчиком на демо без замечаний","correct":false,"rationale":"Одобрение — не качество."}],"anchor":{"g":"bars","p":{"v":[100,8,4],"lbl":["gate без искл., %","откаты, %","MTTR, мин"],"note":"цели: 100 / < 10 / минуты"},"cap":"зрелость = gate + быстрый откат"},"id":"u5-3-t3"},{"mechanic":"visual","points":3,"stem":"Четыре конвейера релиза агента. Какой правильный?","vopts":[{"id":"v0","v":{"g":"pipe","p":{"steps":["CI","eval gate","shadow","канарейка","rollout"],"hl":[1,2,3]}},"lbl":"","correct":true,"rationale":"Офлайн-ворота, живой трафик без показа, затем клиенты под контролем."},{"id":"v1","v":{"g":"pipe","p":{"steps":["CI","rollout 100%"],"hl":[1]}},"lbl":"","correct":false,"rationale":"Без eval и канарейки — релиз поведения вслепую."},{"id":"v2","v":{"g":"pipe","p":{"steps":["демо заказчику","rollout 100%"],"hl":[0]}},"lbl":"","correct":false,"rationale":"Одобрение по демо вместо измерения."},{"id":"v3","v":{"g":"pipe","p":{"steps":["CI","канарейка 50%","rollout"],"hl":[1]}},"lbl":"","correct":false,"rationale":"Канарейка половины трафика без eval gate — не канарейка."}],"id":"u5-3-t4"}],"framework":"Релиз агента = релиз поведения: код, промпт, модель (и обновления вендора), база знаний, пороги. Конвейер: CI → eval gate → shadow → канарейка 1–5% → A/B → rollout по каналам → постмортем. Feature flags и реестр версий: откат за минуту набором целиком. Мобильный канал — логика на сервере. Метрики: откаты < 10%, MTTD/MTTR минуты, 100% через gate.","anchor":{"g":"release","p":{"hl":[0,1,2,3,4,5]},"cap":"от дешёвой проверки к дорогой, клиенты — последними"},"layers":{"simple":"Новая версия агента — как новый сотрудник на горячей линии. Его не сажают сразу на все звонки. Сначала экзамен (eval), потом он слушает реальные звонки и отвечает «в стол», а наставник сравнивает (shadow), потом ему дают 2% звонков под присмотром (канарейка), и только потом — всех.\nИ в любой момент его можно убрать одним переключателем — не ждать, пока магазин приложений одобрит новую сборку. Поэтому мозги агента живут на сервере, а приложение — просто окно.\n«Новый сотрудник» — это и новый промпт, и новая модель (даже если вендор обновил её тихо), и новые документы в базе. Всё это проходит экзамен.\nПроверь себя: вендор обновил модель без смены API — что делать?","how":"1. Релиз = изменение кода, промпта, версии модели (включая обновление вендора), базы знаний, порогов guard/маршрутизатора, конфигурации инструментов.\n2. Конвейер: CI (секунды) → eval gate (golden set + судья, критические 0, p95, стоимость; пороги в конфиге) → shadow (живой трафик, ответы скрыты, парное сравнение судьёй) → канарейка 1–5% (guardrail-метрики, автооткат) → A/B при необходимости бизнес-уверенности → rollout по каналам (веб/сотрудники → приложение) → постмортем.\n3. Откат: feature flag на сценарий/модель/инструмент; реестр версий (prompt v23 + model X + kb snapshot + thresholds v5 = release 1.14); runbook; учения раз в квартал.\n4. Каналы: мобильное приложение — тонкий клиент, логика на сервере; кол-центр — интеграция с рабочим местом и обучение операторов; веб — самый быстрый канал для канарейки.\n5. Метрики: откаты < 10%, инциденты на релиз, MTTD и MTTR в минутах, 100% релизов через gate (исключения — с подписью и постмортемом), lead time от готового промпта до 100% — дни.\n6. Пример. Смена модели: gate пройден (4,4 vs 4,1, критические 0, p95 3,8 с, −30% стоимости) → shadow 3 дня (v2 лучше в 58% пар) → канарейка 5% × 5 дней (hallucination 1,1%, жалобы без роста) → rollout веб → приложение → отчёт.","formula":{"f":"release = CI → eval_gate → shadow → canary(1–5%) → [A/B] → rollout → postmortem\nоткат = flag_off(release 1.14 → 1.13) за ≤ 1 мин","legend":[["eval_gate","пороги: балл ≥ base − δ, critical = 0, p95, cost","в конфиге, не в голове"],["shadow","ответы новой версии скрыты, сравнение судьёй","3 дня, 58% побед"],["canary","1–5% трафика, guardrail, автооткат","5 дней"],["release N","набор версий: промпт + модель + база + пороги","откат набором"],["MTTR","время восстановления","минуты с flag"]],"note":"Канал определяет архитектуру отката: в мобильном приложении логика живёт на сервере."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Релиз агента — релиз поведения: промпт, модель, база знаний, пороги проходят конвейер.\n— CI → eval gate → shadow → канарейка → A/B → rollout → постмортем; клиенты — последними.\n— Flag и реестр версий: откат набором за минуту; учения отката.\n— Мобильный канал — тонкий клиент, логика на сервере.\n— Метрики процесса: откаты < 10%, MTTD/MTTR минуты, 100% через gate.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Вендор обновил модель без смены API. Что делать?","o":["Ничего: API тот же, вендор гарантирует обратную совместимость поведения в договоре","Фиксировать версии и провести через eval gate и shadow как релиз","Отключить агента до получения от вендора полного отчёта об изменениях модели"],"a":1,"w":"Поведение меняется при том же API — это релиз."},{"q":"Зачем shadow после пройденного eval gate?","o":["Для нагрузки на GPU: проверить ёмкость инфраструктуры перед выкладкой новой версии","Golden set не покрывает дрейф живого трафика; shadow сравнивает без риска","Для отчётности перед ИБ, которая требует доказательств работы в проме до допуска"],"a":1,"w":"Второй фильтр до клиентов."},{"q":"В формуле отката почему release — набор версий?","o":["Для удобства нумерации и поиска в реестре релизов по дате и автору","Промпт, модель, база и пороги меняют поведение вместе — откат согласованным набором","Это необязательно: каждый компонент откатывается независимо своей командой через собственный пайплайн"],"a":1,"w":"Откат одного промпта на старую модель — новая, непроверенная комбинация."},{"q":"Почему логика агента в мобильном канале — на сервере?","o":["Телефоны слабые и не потянут обработку промптов и истории диалога локально","Релиз и откат приложения идут через ревью магазинов днями; сервер — за минуту","Так требует регулятор: обработка персональных данных должна исполняться в контуре банка"],"a":1,"w":"Канал диктует архитектуру отката."}],"rules":["Релиз агента — релиз поведения: промпт, модель, база знаний, пороги проходят конвейер.","CI → eval gate → shadow → канарейка → A/B → rollout → постмортем; клиенты — последними.","Flag и реестр версий: откат набором за минуту; учения отката.","Мобильный канал — тонкий клиент, логика на сервере.","Метрики процесса: откаты < 10%, MTTD/MTTR минуты, 100% через gate."]}},{"id":"u6-1","level":"L6","title":"Управление ожиданиями заказчика ИИ-продукта","lead":"Демо-эффект, «почему он ошибается», сроки под нож — форматы и фразы","concept":"Ожидания от ИИ искажены в обе стороны: после впечатляющего демо заказчик верит, что агент «уже всё умеет», после первой ошибки — что «он не работает». Задача TPO — перевести разговор из впечатлений в измерения и из обещаний в договорённости. Инструменты: контракт качества (какие сценарии, какой task success, что делаем при ошибке, что не делаем), прозрачные метрики на общем дашборде, совместная разметка диалогов (заказчик видит реальную выборку, а не черри-пик), регулярные демо на реальных диалогах, заранее объявленные риски с триггерами, и язык вероятностей: «на golden set 87%, в проме ожидаем 80–85%, вот что будет с остальными 15%». При давлении на сроки — торговля объёмом, а не качеством: сузить сценарий, оставить эскалацию, но не отключать eval gate и ИБ. Сложные разговоры структурируются: факт → влияние → варианты с ценой → рекомендация → решение заказчика. Фиксировать договорённости письменно (Confluence, протокол), включая то, что НЕ делаем.","points":[{"h":"Демо-эффект и контракт качества","t":"После демо сразу: «это 5 лучших из 20; на выборке из логов качество сейчас X%; к запуску целимся в Y% на таких-то сценариях; вот что происходит, когда агент не уверен». Контракт качества — одна страница: сценарии в объёме, целевой task success и CSAT, поведение при ошибке (эскалация, «не знаю»), не-цели, как меряем, как часто отчитываемся. Подписывается заказчиком до разработки — это и есть управление ожиданиями."},{"h":"«Почему он ошибается»: объяснять механику без жаргона","t":"Три причины на пальцах: не нашёл нужный документ (поиск), нашёл, но ответил неточно (модель), вопрос за пределами сценария (границы). К каждой — что делаем и какая метрика. Показать трассу конкретного диалога: заказчик видит, что ошибка — не магия, а конкретный шаг. Никогда не обещать «ошибок не будет»; обещать «ошибки будут видны, измерены и будут снижаться — вот график»."},{"h":"Сроки под нож: торговаться объёмом","t":"Запрос «запустить на месяц раньше» → разложить: что можно убрать (второй сценарий, действия с записью, часть каналов), что нельзя (eval gate, ИБ-допуск, подтверждение действий), какой риск у каждого варианта в цифрах (task success ниже на N п.п., эскалаций больше). Предложить 2–3 варианта с ценой и свою рекомендацию. Решение — заказчика, письменно. Фраза: «Мы можем запуститься раньше с меньшим объёмом; качество и безопасность не торгуются, потому что их цена — доверие клиентов и регулятор»."},{"h":"Регулярность и письменная фиксация","t":"Еженедельный короткий статус: метрики, риски с изменением статуса, решения, которые нужны от заказчика. Демо раз в две недели на реальных диалогах, в том числе неудачных. Совместная разметка 20 диалогов раз в месяц. Реестр рисков с триггерами («если API АБС не будет к 1 марта, запуск сдвигается на 3 недели» — сказано в январе, не в марте). Все договорённости — в Confluence; устные обещания не существуют."}],"practice":{"mechanic":"sjt_bw","points":3,"stem":"На демо руководителю блока агент блестяще разобрал 5 диалогов. Руководитель: «Отлично, запускаем на всех клиентов через две недели, расширяем на кредиты и ипотеку». У вас golden set показывает 78% task success на одном сценарии, ИБ-допуск не начат. Лучшее и худшее действие?","options":[{"id":"s0","text":"Назвать цифры: 5 из 20, 78%, цель 85%; предложить ОПЭ на одном сценарии после ИБ; письменно","correct":true,"rationale":"Из впечатлений — в измерения и договорённости."},{"id":"s1","text":"Согласиться, чтобы не портить момент, и разобраться потом: ИБ и качество подтянем за две недели","correct":false,"rationale":"Ожидание зафиксировано; потом будет провал доверия."},{"id":"s2","text":"Сказать, что демо было нерепрезентативно и агент ещё не готов ни к каким решениям о запуске","correct":false,"rationale":"Самоуничижение вместо плана; теряется поддержка."},{"id":"s3","text":"Попросить две недели на ответ и подготовить большую презентацию с рисками, сроками и бюджетом","correct":false,"rationale":"Ожидание живёт две недели без коррекции."}],"worst":"s1","worstRationale":"Молчаливое согласие — худшее: заказчик уходит с нереалистичным обещанием, и каждая следующая новость будет «ухудшением».","anchor":{"g":"compare","p":{"a":["впечатление","5 лучших из 20"],"b":["измерение","78% на golden 300"],"verdict":"контракт качества + ОПЭ через 6 недель"},"cap":"сразу переводить в цифры"},"id":"u6-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Заказчик после первой ошибки агента в ОПЭ: «он не работает, выключайте». Правильный ответ TPO?","options":[{"id":"o0","text":"Показать трассу, причину (поиск/модель/границы), метрики по выборке, что меняем; напомнить контракт","correct":true,"rationale":"Механика вместо магии, выборка вместо случая."},{"id":"o1","text":"Выключить агента на неделю, чтобы сохранить отношения с заказчиком и спокойно разобраться в причинах","correct":false,"rationale":"Одна ошибка — не основание; подрывает процесс."},{"id":"o2","text":"Сказать, что такого больше не повторится, и пообещать лично проверить все ответы перед отправкой","correct":false,"rationale":"У вероятностной системы ошибки будут; обещание сорвётся при первой же."},{"id":"o3","text":"Переложить на ML-команду: «они обещали качество», и предложить заказчику поговорить с ними напрямую","correct":false,"rationale":"TPO отвечает за ожидания."}],"anchor":{"g":"tree","p":{"root":"почему ошибся?","kids":["не нашёл документ","нашёл, ответил неточно","вне сценария"]},"cap":"три причины на пальцах"},"id":"u6-1-t0"},{"mechanic":"single","points":2,"stem":"Что такое контракт качества ИИ-продукта?","options":[{"id":"o0","text":"Страница: сценарии, целевые TS и CSAT, поведение при ошибке, не-цели — до разработки","correct":true,"rationale":"Ожидания фиксируются заранее."},{"id":"o1","text":"SLA с вендором модели: доступность, латентность и штрафы, которые банк перевыставляет заказчику","correct":false,"rationale":"Это другой документ."},{"id":"o2","text":"Обещание, что агент не будет ошибаться в сценариях, которые прошли eval gate и канарейку","correct":false,"rationale":"Такого обещать нельзя."},{"id":"o3","text":"Список функций из JIRA с приоритетами и сроками, подписанный заказчиком на старте квартала","correct":false,"rationale":"Функции — не ожидания качества."}],"anchor":{"g":"pipeline","p":{"steps":["сценарии","task success ≥ 85%","при ошибке: эскалация","не-цели","отчёт: еженедельно"],"hl":[1,2]},"cap":"контракт качества — до разработки"},"id":"u6-1-t1"},{"mechanic":"single","points":2,"stem":"Заказчик требует запуск на месяц раньше. Чем торговаться?","options":[{"id":"o0","text":"Объёмом: сузить сценарии, убрать действия с записью, часть каналов; eval gate и ИБ не торгуются","correct":true,"rationale":"Срок ↔ объём, не ↔ качество."},{"id":"o1","text":"Качеством: временно снизить порог eval gate на 5 пунктов и вернуть его после стабилизации","correct":false,"rationale":"Цена — доверие клиентов и регулятор."},{"id":"o2","text":"Безопасностью: пропустить ИБ-допуск под личную ответственность заказчика и договориться постфактум","correct":false,"rationale":"Инцидент дороже месяца."},{"id":"o3","text":"Ничем: отказать и настаивать на исходном сроке, потому что план уже согласован","correct":false,"rationale":"Торговля объёмом обычно возможна."}],"anchor":{"g":"quad","p":{"x":"срок","y":"объём","pts":[["вариант A",0.3,0.3],["вариант B",0.6,0.6],["план",0.9,0.9]],"hl":0,"note":"качество — константа"},"cap":"торгуйся объёмом, не качеством"},"id":"u6-1-t2"},{"mechanic":"single","points":2,"stem":"Как структурировать сложный разговор о сдвиге срока?","options":[{"id":"o0","text":"Факт → влияние → варианты с ценой → рекомендация → решение заказчика, письменно","correct":true,"rationale":"Структура снижает эмоции и даёт выбор."},{"id":"o1","text":"Начать с извинений и подробных объяснений, почему команда не виновата в сдвиге срока","correct":false,"rationale":"Оправдания вместо решения."},{"id":"o2","text":"Сообщить письмом новый срок без вариантов, чтобы не втягивать заказчика в технические детали","correct":false,"rationale":"Заказчик без выбора — конфликт."},{"id":"o3","text":"Отложить разговор до момента, когда срок уже сорван и причины будут очевидны всем","correct":false,"rationale":"Риск должен быть назван при триггере, не после."}],"anchor":{"g":"pipeline","p":{"steps":["факт","влияние","варианты + цена","рекомендация","решение"],"hl":[2,3]},"cap":"факт → влияние → варианты → решение"},"id":"u6-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре реакции на демо-эффект. Какая правильная?","vopts":[{"id":"v0","v":{"g":"bars","p":{"v":[0.25,0.78,0.85],"lbl":["демо 5/20","golden 78%","цель 85%"],"max":1}},"lbl":"","correct":true,"rationale":"Сразу три числа: что показали, что есть, куда целимся."},{"id":"v1","v":{"g":"bars","p":{"v":[1.0],"lbl":["«всё работает»"],"max":1,"warn":true}},"lbl":"","correct":false,"rationale":"Подтверждение иллюзии."},{"id":"v2","v":{"g":"bars","p":{"v":[0.0],"lbl":["«ничего не готово»"],"max":1,"warn":true}},"lbl":"","correct":false,"rationale":"Самоуничижение без плана."},{"id":"v3","v":{"g":"bars","p":{"v":[0.5,0.5],"lbl":["«подумаем»","2 недели"],"max":1,"warn":true}},"lbl":"","correct":false,"rationale":"Ожидание живёт без коррекции."}],"id":"u6-1-t4"}],"framework":"Из впечатлений — в измерения: после демо сразу цифры и контракт качества. Ошибки объяснять механикой (поиск / модель / границы) и трассой, обещать снижение, не отсутствие. Сроки — торговля объёмом; eval gate, ИБ, подтверждение действий не торгуются. Разговор: факт → влияние → варианты с ценой → рекомендация → решение; письменно. Еженедельный статус, демо на реальных диалогах, реестр рисков с триггерами.","anchor":{"g":"compare","p":{"a":["ожидание","«он уже всё умеет»"],"b":["договорённость","сценарии · task success · при ошибке · не-цели"],"verdict":"контракт качества"},"cap":"ожидания управляются цифрами и документом"},"layers":{"simple":"После эффектного фокуса зрители верят, что фокусник умеет всё. Задача TPO — сразу после аплодисментов сказать: «Это были пять лучших из двадцати; вот насколько он хорош на самом деле; вот куда мы его доведём и к какому сроку».\nКогда агент ошибается, заказчик видит магию, которая сломалась. Покажи механику: не нашёл документ, нашёл, но неточно ответил, или вопрос вне сценария. Покажи трассу. Пообещай не отсутствие ошибок, а их снижение по графику.\nКогда просят быстрее — предлагай меньше, но не хуже. Проверки качества и безопасность не продаются, потому что платить за них придётся доверием клиентов. И всё записывай: устные договорённости не существуют.\nПроверь себя: чем торговаться, когда требуют запуск на месяц раньше?","how":"1. После демо: «5 лучших из 20; golden set 78%; цель 85% на сценариях A и B; при неуверенности — эскалация». Контракт качества (1 стр.): сценарии, целевые task success/CSAT, поведение при ошибке, не-цели, как и когда меряем — подпись до разработки.\n2. Ошибки: причина (поиск / модель / границы) + трасса + метрика по выборке + что меняем. Никогда «ошибок не будет».\n3. Сроки: разложить объём (сценарии, действия с записью, каналы) ↔ срок; eval gate, ИБ-допуск, подтверждение действий — константы. 2–3 варианта с ценой в п.п. task success и эскалациях + рекомендация. Решение — заказчика, письменно.\n4. Структура разговора: факт → влияние → варианты с ценой → рекомендация → решение.\n5. Ритм: еженедельный статус (метрики, риски, нужные решения); демо раз в 2 недели на реальных диалогах, включая неудачные; совместная разметка 20 диалогов ежемесячно; реестр рисков с триггерами, названными заранее.\n6. Пример. «Запускаем через 2 недели на всех и на ипотеку»: факт — 78% на одном сценарии, ИБ не начат; влияние — при запуске сейчас ~20% клиентов получат неверный ответ, ИБ заблокирует ПРОМ; варианты — ОПЭ на сотрудниках через 2 недели / ОПЭ 1% клиентов через 6 недель после ИБ / полный запуск через 10; рекомендация — второй; расширение на ипотеку — после контракта качества и golden set по домену.","formula":{"f":"ожидание → измерение: {показано, есть сейчас, цель, срок, что при ошибке}\nсрок ↔ объём; качество ∧ безопасность = const","legend":[["показано","сколько и как отобрано на демо","5 лучших из 20"],["есть сейчас","метрика на golden set / ОПЭ","78% task success"],["цель","контракт качества","85% на сценариях A, B"],["при ошибке","поведение агента","эскалация, «не знаю»"],["const","что не торгуется","eval gate, ИБ, подтверждение действий"]],"note":"Сложный разговор: факт → влияние → варианты с ценой → рекомендация → решение заказчика, письменно."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— После демо — сразу цифры: показано / есть / цель / срок / при ошибке; контракт качества до разработки.\n— Ошибки объяснять механикой и трассой; обещать снижение, не отсутствие.\n— Срок торгуется объёмом; eval gate, ИБ, подтверждение действий — константы.\n— Факт → влияние → варианты с ценой → рекомендация → решение; письменно.\n— Еженедельный статус, демо на реальных диалогах, реестр рисков с триггерами.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Чем торговаться, когда требуют запуск на месяц раньше?","o":["Порогом eval gate: временно снизить на 5 пунктов и вернуть после стабилизации","Объёмом: сценарии, действия с записью, каналы","ИБ-допуском: запуститься под личную ответственность заказчика и согласовать постфактум"],"a":1,"w":"Срок ↔ объём; качество и безопасность — константы."},{"q":"Заказчик после первой ошибки: «выключайте». Ответ?","o":["Выключить агента на неделю, чтобы сохранить отношения и спокойно разобраться в причинах","Трасса, причина, метрика по выборке, что меняем, напоминание о контракте","Обещать, что такого больше не повторится, и лично проверять ответы до стабилизации"],"a":1,"w":"Механика вместо магии; один случай — не выборка."},{"q":"В формуле ожиданий что такое «показано»?","o":["Целевая метрика качества, которую команда обязуется достичь к запуску","Сколько и как отобраны примеры на демо","Срок запуска, названный заказчику вместе с условиями расширения"],"a":1,"w":"Первое, что говорят после аплодисментов: 5 лучших из 20."},{"q":"Когда называть риск «API АБС может опоздать»?","o":["Когда срок уже сорван: тогда причины очевидны всем и разговор предметный","При постановке плана, с триггером и последствием","Никогда: риски смежных команд обсуждаются только с ними, чтобы не пугать заказчика"],"a":1,"w":"Риск с триггером, названный заранее, — управление; после — оправдание."}],"rules":["После демо — сразу цифры: показано / есть / цель / срок / при ошибке; контракт качества до разработки.","Ошибки объяснять механикой и трассой; обещать снижение, не отсутствие.","Срок торгуется объёмом; eval gate, ИБ, подтверждение действий — константы.","Факт → влияние → варианты с ценой → рекомендация → решение; письменно.","Еженедельный статус, демо на реальных диалогах, реестр рисков с триггерами."]}},{"id":"u6-2","level":"L6","title":"Стратегия ИИ-продукта: OKR, build/buy/partner, тренды ГенИИ","lead":"Как выглядит стратегия агентной платформы банка на 2–3 квартала и как её защищать","concept":"Стратегия ИИ-продукта отвечает на пять вопросов: где создаём ценность (какие задачи клиентов и сотрудников, в каком порядке — из CJM и экономики), на чём строим (платформа агентов: общие оркестратор, guard, RAG, eval, реестр — чтобы второй агент стоил в разы дешевле первого), что делаем сами, что покупаем, с кем партнёримся (модели — чаще внешние/open-weights с дообучением; оркестрация, guard, eval, знания — своё, потому что это дифференциатор и контроль; вендорские платформы — там, где нет компетенций и время дороже), как меряем (OKR: Objective «клиенты решают типовые задачи без ожидания» → KR: containment 40% при task success ≥ 85%, p95 ≤ 4 с, стоимость диалога ≤ 10 ₽, 3 сценария в ПРОМ), и какие принципы держим при смене трендов. Тренды, которые влияют на план в 2026: агентные действия с инструментами как стандарт, малые специализированные модели on-prem, мультимодальность (голос, документы), стандарты интеграции инструментов (протоколы вида MCP), регулирование ИИ и требования объяснимости, рост ожиданий клиентов к «сделай за меня». Стратегия — это выборы и отказы: что НЕ делаем в этом году и при каком триггере пересмотрим.","points":[{"h":"Платформа против отдельных агентов","t":"Первый агент стоит дорого: оркестратор, guard, RAG, eval, реестр, мониторинг, допуски. Если второй агент собирается из тех же блоков — он стоит 20–30% первого и запускается за недели. Стратегический тезис TPO: «строим платформу агентов через первый сценарий», с явной границей, что общее (оркестратор, guard, eval-платформа, реестр промптов и моделей, инструменты интеграции), а что сценарное (промпты, база знаний домена, инструменты). KR платформы: время запуска нового сценария (цель — 6 недель), доля переиспользованных компонентов."},{"h":"Build / buy / partner по слоям","t":"Модель: buy/partner (внешние API для нечувствительного, open-weights on-prem для ПДн; дообучение — только при доказанной на eval необходимости). Инференс-инфраструктура: buy (платформы инференса) или build при объёмах. Оркестрация и инструменты: build — это контроль над действиями и интеграция с системами банка. Guard и eval: build с использованием открытых компонентов — дифференциатор и требование ИБ. База знаний: build процесса (владельцы документов), buy инструментов. Критерии: дифференциатор ли это, есть ли компетенции, цена времени, зависимость от вендора, требования к данным."},{"h":"OKR и защита стратегии","t":"Objective — про клиента и бизнес, не про технологию. KR — 3–5, измеримых, с условиями качества: containment × task success, p95, стоимость диалога, число сценариев в ПРОМ, время запуска нового сценария. Стратегия защищается перед руководством как: проблема и размер → почему сейчас (тренды, конкуренты, экономика) → ставка и этапы → экономика (затраты, окупаемость, чувствительность) → риски и принципы → чего не делаем. На 10 минут, с одной схемой платформы и одной таблицей экономики."},{"h":"Тренды ГенИИ — как встроить в план","t":"Для каждого тренда: влияние на наш продукт (возможность/угроза), что делаем в этом квартале (ничего / разведка / spike / веха), триггер пересмотра. Агентные действия → наш Q3 (действия с подтверждением). Малые модели on-prem → spike в Q2: 8B против внешнего API на golden set. Мультимодальность → отложено, триггер: > 15% обращений с фото документов. Стандарты инструментов → проектировать адаптеры совместимыми. Регулирование → объяснимость через трассу и цитаты уже сейчас. Это показывает, что TPO следит за рынком и не бежит за каждой новостью."}],"practice":{"mechanic":"multi","points":3,"stem":"Выберите тезисы, которые должны войти в стратегию агентной платформы банка на 3 квартала.","options":[{"id":"o0","text":"Строим платформу через первый сценарий: общие оркестратор, guard, RAG, eval, реестр","correct":true,"rationale":"Платформенный тезис — главный."},{"id":"o1","text":"Модели — внешние/open-weights по чувствительности; оркестрация, guard, eval — своё","correct":true,"rationale":"Build/buy по слоям с критерием дифференциатора."},{"id":"o2","text":"OKR: containment 40% при task success ≥ 85%, p95 ≤ 4 с, ≤ 10 ₽/диалог, 3 сценария в ПРОМ","correct":true,"rationale":"KR с условиями качества."},{"id":"o3","text":"Список «не делаем в этом году» с триггерами пересмотра","correct":true,"rationale":"Стратегия — это отказы."},{"id":"o4","text":"Тренды разобраны по влиянию и действию: агентные действия — Q3; малые модели — spike Q2","correct":true,"rationale":"Тренд → конкретное действие или отложено."},{"id":"o5","text":"Обучить собственную фундаментальную модель банка с нуля на внутренних данных, чтобы не зависеть от вендоров","correct":false,"rationale":"Не дифференциатор, огромная цена; дообучение — только по eval."},{"id":"o6","text":"Запустить агентов во всех 12 продуктах одновременно, чтобы опередить конкурентов и занять нишу первыми","correct":false,"rationale":"Распыление без платформы и eval."},{"id":"o7","text":"Измерять успех числом внедрённых ИИ-функций и долей процессов, в которых используется генеративный ИИ","correct":false,"rationale":"Технология вместо клиента и бизнеса."},{"id":"o8","text":"Не фиксировать принципы: рынок меняется каждые полгода, решения будем принимать по ситуации","correct":false,"rationale":"Без принципов каждая новость меняет план."}],"anchor":{"g":"stack2","p":{"rows":[["сценарии: подписки, споры, кредиты",3],["платформа: оркестратор · guard · RAG · eval · реестр",5],["модели: внешние/on-prem по чувствительности",2]]},"cap":"платформа — слой под сценариями"},"id":"u6-2-p"},"test":[{"mechanic":"single","points":2,"stem":"Почему «второй агент должен стоить 20–30% первого» — стратегический тезис, а не инженерный?","options":[{"id":"o0","text":"Он определяет инвестиции в общие компоненты и KR времени запуска — куда вкладывать","correct":true,"rationale":"Платформа — решение о распределении ресурсов."},{"id":"o1","text":"Потому что инженерам так удобнее: единый кодовый базис проще поддерживать, тестировать и развивать","correct":false,"rationale":"Удобство — следствие, не причина."},{"id":"o2","text":"Потому что так дешевле GPU: общая модель обслуживает все сценарии с одного кластера инференса","correct":false,"rationale":"GPU — не главная статья платформы."},{"id":"o3","text":"Это не стратегический тезис, а инженерная оценка, которой место в техническом видении","correct":false,"rationale":"Именно стратегический: он про порядок и экономику."}],"anchor":{"g":"bars","p":{"v":[100,30,25],"lbl":["агент 1","агент 2","агент 3"],"note":"% стоимости первого"},"cap":"платформа окупается на втором сценарии"},"id":"u6-2-t0"},{"mechanic":"single","points":2,"stem":"Что из этого банк обычно строит сам, а не покупает?","options":[{"id":"o0","text":"Оркестрацию и инструменты, guard и eval — контроль над действиями, дифференциатор и требование ИБ","correct":true,"rationale":"Слои контроля — свои."},{"id":"o1","text":"Фундаментальную модель с нуля на данных банка, чтобы не зависеть от вендоров и регуляторных рисков","correct":false,"rationale":"Не дифференциатор, огромная цена."},{"id":"o2","text":"Векторную БД и инференс-движок: готовые решения не учитывают требования банка к данным","correct":false,"rationale":"Это инфраструктурные компоненты, которые разумно покупать или брать открытыми."},{"id":"o3","text":"Всё: банк не доверяет вендорам, и любой внешний компонент — риск для контура данных","correct":false,"rationale":"Крайность; критерий — дифференциатор и компетенции."}],"anchor":{"g":"stack2","p":{"rows":[["модель: buy/partner",2],["инференс: buy",2],["оркестрация, guard, eval: build",5],["знания: build процесса",3]]},"cap":"build там, где контроль и дифференциатор"},"id":"u6-2-t1"},{"mechanic":"single","points":2,"stem":"Какой KR сформулирован правильно?","options":[{"id":"o0","text":"Containment 40% при task success ≥ 85% и p95 ≤ 4 с к концу Q3","correct":true,"rationale":"Измеримо, с условием качества и сроком."},{"id":"o1","text":"Внедрить 10 ИИ-функций в каналах обслуживания к концу года с отчётом по каждой перед правлением","correct":false,"rationale":"Технология вместо результата."},{"id":"o2","text":"Клиенты полюбят агента и будут рекомендовать его знакомым, что покажет рост NPS канала","correct":false,"rationale":"Нет числа и срока — это пожелание, а не ключевой результат."},{"id":"o3","text":"Использовать самую современную модель во всех сценариях и обновлять её по мере выхода новых","correct":false,"rationale":"Средство, не результат."}],"anchor":{"g":"tree","p":{"root":"O: клиенты решают типовые задачи без ожидания","kids":["KR1 containment 40% | TS ≥ 85%","KR2 p95 ≤ 4 с","KR3 ≤ 10 ₽/диалог","KR4 3 сценария в ПРОМ"]},"cap":"KR с условием качества"},"id":"u6-2-t2"},{"mechanic":"single","points":2,"stem":"Как встроить тренд «мультимодальность» в стратегию, если сейчас он не приоритет?","options":[{"id":"o0","text":"Отложить с триггером пересмотра: > 15% обращений с фото документов — и сказать это явно","correct":true,"rationale":"Отказ с условием — тоже стратегия."},{"id":"o1","text":"Запустить spike немедленно: тренд набирает силу, и через квартал конкуренты будут впереди","correct":false,"rationale":"Тренд без влияния на наши задачи — шум."},{"id":"o2","text":"Не упоминать в стратегии, чтобы не отвлекать руководство от приоритетных сценариев","correct":false,"rationale":"Руководство спросит; лучше ответ с триггером."},{"id":"o3","text":"Включить в OKR этого квартала как исследовательскую цель без конкретного KR","correct":false,"rationale":"Цель без KR в текущем квартале отвлекает ресурсы от приоритетных сценариев."}],"anchor":{"g":"timeline","p":{"items":["Q1–Q2: подписки, споры","Q3: действия ✋","spike: 8B on-prem","отложено: фото (триггер 15%)"],"hl":3},"cap":"тренд → действие / отложено с триггером"},"id":"u6-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре структуры стратегии на 3 квартала. Какая правильная?","vopts":[{"id":"v0","v":{"g":"treev","p":{"root":"O: клиент + бизнес","kids":["платформа","сценарии","не делаем"],"ok":true}},"lbl":"","correct":true,"rationale":"Цель про клиента, платформенный слой, порядок сценариев и явные отказы."},{"id":"v1","v":{"g":"treev","p":{"root":"12 агентов сразу","kids":["","",""],"ok":false,"many":true}},"lbl":"","correct":false,"rationale":"Распыление без платформы."},{"id":"v2","v":{"g":"treev","p":{"root":"своя фундаментальная модель","kids":["GPU","данные","команда"],"ok":false}},"lbl":"","correct":false,"rationale":"Не дифференциатор банка; цена несопоставима."},{"id":"v3","v":{"g":"treev","p":{"root":"10 ИИ-функций","kids":["чат","саммари","перевод"],"ok":false}},"lbl":"","correct":false,"rationale":"Технологии вместо результата для клиента."}],"id":"u6-2-t4"}],"framework":"Стратегия: где ценность (из CJM и экономики), платформа через первый сценарий (второй — за 20–30% и 6 недель), build/buy/partner по слоям (модели — buy/partner, оркестрация/guard/eval — build), OKR с условиями качества, тренды → действие или отложено с триггером, явные отказы и принципы. Защита: проблема → почему сейчас → ставка → экономика → риски → чего не делаем, за 10 минут.","anchor":{"g":"stack2","p":{"rows":[["сценарии по приоритету",3],["платформа агентов",5],["модели по чувствительности",2]]},"cap":"стратегия — платформа, порядок, отказы"},"layers":{"simple":"Стратегия — это не список всего, что можно сделать с ИИ, а ответ на вопрос «что и в каком порядке, и чего не делаем». Первый агент — дорогой, потому что вместе с ним строится фундамент: проверки, безопасность, поиск, измерения. Второй на том же фундаменте стоит в разы дешевле — и это главный аргумент за платформу.\nЧто делать самим, а что покупать? Модели — чаще брать готовые. А вот то, что управляет действиями, защищает и измеряет, — своё: это контроль и отличие от конкурентов.\nЦели ставятся про клиента, а не про технологию: «решают задачи без ожидания», с цифрами и условием качества. Каждый модный тренд получает решение: делаем сейчас, пробуем, или откладываем до условия.\nПроверь себя: почему «второй агент за 20–30% первого» — стратегический тезис?","how":"1. Пять вопросов: где ценность (CJM, экономика), на чём строим (платформа), build/buy/partner, как меряем (OKR), какие принципы держим.\n2. Платформа: общее — оркестратор, guard, RAG-конвейер, eval-платформа, реестр промптов/моделей, адаптеры; сценарное — промпты, база домена, инструменты. KR платформы: запуск нового сценария ≤ 6 недель, второй агент — 20–30% стоимости первого.\n3. Build/buy/partner: модель — partner/buy (внешние API без ПДн, open-weights on-prem для ПДн; дообучение по eval-необходимости); инференс — buy; оркестрация, инструменты, guard, eval — build; знания — build процесса, buy инструментов. Критерии: дифференциатор, компетенции, цена времени, зависимость, данные.\n4. OKR: O про клиента/бизнес; 3–5 KR с условиями качества: containment 40% при TS ≥ 85%, p95 ≤ 4 с, ≤ 10 ₽/диалог, 3 сценария в ПРОМ, запуск сценария ≤ 6 нед.\n5. Тренды → влияние → действие (ничего / разведка / spike / веха) → триггер: агентные действия — Q3; малые модели on-prem — spike Q2; мультимодальность — отложено (триггер 15%); стандарты инструментов — совместимые адаптеры; регулирование — объяснимость через трассу и цитаты.\n6. Защита за 10 минут: проблема и размер → почему сейчас → ставка и этапы → экономика с чувствительностью → риски и принципы → чего не делаем. Одна схема платформы, одна таблица экономики.","formula":{"f":"стратегия = {где ценность, платформа, build/buy/partner, OKR, принципы, отказы с триггерами}\nстоимость агента_n ≈ 0,2–0,3 × агент_1 при общей платформе","legend":[["платформа","оркестратор, guard, RAG, eval, реестр, адаптеры","общее для всех сценариев"],["build","слои контроля и дифференциации","оркестрация, guard, eval"],["buy/partner","модели, инференс, инструменты","внешние API / open-weights"],["KR","измеримо, с условием качества и сроком","containment 40% | TS ≥ 85%"],["триггер","условие пересмотра отказа","> 15% обращений с фото"]],"note":"Стратегия — это выборы и отказы; план, в котором есть всё, — не стратегия."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Пять вопросов стратегии: где ценность, платформа, build/buy/partner, OKR, принципы и отказы.\n— Платформа через первый сценарий; второй — 20–30% стоимости и ≤ 6 недель.\n— Модели — buy/partner; оркестрация, guard, eval — build.\n— OKR про клиента с условиями качества; 3–5 KR.\n— Тренд → влияние → действие или отложено с триггером; защита за 10 минут с одной схемой и одной таблицей.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Почему «второй агент за 20–30% первого» — стратегический тезис?","o":["Инженерам удобнее: единый кодовый базис проще поддерживать и тестировать","Он определяет инвестиции в общее и KR времени запуска сценария","Экономия GPU: общая модель обслуживает все сценарии с одного кластера инференса без простоя"],"a":1,"w":"Платформа — решение о распределении ресурсов и порядке сценариев."},{"q":"Что банк обычно строит сам?","o":["Фундаментальную модель на данных банка, чтобы не зависеть от вендоров и санкционных рисков","Оркестрацию, инструменты, guard, eval","Векторную БД и инференс-движок"],"a":1,"w":"Контроль над действиями, дифференциатор, требование ИБ."},{"q":"В формуле стратегии зачем «отказы с триггерами»?","o":["Для объёма документа: руководство ждёт, что стратегия охватывает все направления рынка","Отказ с триггером защищает от бега за трендом и отвечает руководству","Это необязательно: достаточно списка приоритетов, остальное подразумевается отложенным"],"a":1,"w":"Стратегия — это выборы; отказ без триггера — упрямство, с триггером — управление."},{"q":"Какой KR правильный?","o":["Внедрить 10 ИИ-функций в каналах обслуживания к концу года с отчётом по каждой","Containment 40% при task success ≥ 85% и p95 ≤ 4 с к концу Q3","Использовать лучшую модель рынка во всех сценариях и поддерживать её актуальность"],"a":1,"w":"Измеримо, с условием качества и сроком; про клиента, не про технологию."}],"rules":["Пять вопросов стратегии: где ценность, платформа, build/buy/partner, OKR, принципы и отказы.","Платформа через первый сценарий; второй — 20–30% стоимости и ≤ 6 недель.","Модели — buy/partner; оркестрация, guard, eval — build.","OKR про клиента с условиями качества; 3–5 KR.","Тренд → влияние → действие или отложено с триггером; защита за 10 минут с одной схемой и одной таблицей."]}},{"id":"u7-1","level":"L7","title":"Agent = Model + Harness: дисциплина harness engineering и ландшафт","lead":"Что такое harness, из чего он состоит, какие принципы отличают зрелый harness и кто его делает в 2026","concept":"Harness — всё вокруг модели, что не является моделью: промпты и правила (AGENTS.md), инструменты и их политика, управление контекстом (компакция, выгрузка результатов, прогрессивное раскрытие через skills, полные сбросы), хуки проверки, песочница и права, субагенты, циклы длинных задач, трассы и метрики, пути восстановления. Сырая модель становится агентом, когда harness добавляет состояние, исполнение инструментов, обратную связь и ограничения. Harness engineering — проектирование и итерация этой обвязки: каждая правка — ответ на реальный сбой, каждый компонент кодирует предположение «модель не справится сама» и удаляется, когда модель его перерастает. Принципы: достойная модель с сильным harness обыгрывает сильную модель со слабым; правил мало и каждое ведёт к прошлому сбою; инструментов около десяти, а не пятьдесят пересекающихся; «успех молчит, сбои говорят»; агент не оценивает сам себя — генератор и оценщик разделены. Ландшафт 2026: у каждой крупной лаборатории есть агент для кода — Claude Code (закрытый, фиксированный цикл, хуки/MCP/субагенты/SDK), Codex (открытый CLI и App Server с документированными точками расширения), OpenCode (открытый, мультипровайдерный, плагины расширяют фиксированное ядро), Qwen Code, Trae Agent, Kimi CLI, ZCode; DeepSeek Harness выделяется тем, что заменяем сам runtime: «нет привилегированного ядра, которое надо патчить».","points":[{"h":"Анатомия harness: восемь слотов","t":"1) Правила и память: короткий AGENTS.md/CLAUDE.md, переинъецируемый каждую сессию. 2) Инструменты: файловая система, shell, поиск, редактор; «модель сама строит инструменты через bash». 3) Контекст-политика: компакция при давлении, head/tail-обрезка больших выводов с выгрузкой на диск, skills по требованию, сброс с hand-off файлом. 4) Хуки: typecheck/lint/тесты после правок, запрет rm -rf и force-push, approval на push в main. 5) Песочница: allow-list команд, изоляция сети, преднастроенные рантаймы. 6) Субагенты: планировщик/генератор/оценщик, «контекстные брандмауэры». 7) Циклы: Ralph-loop — хук блокирует ранний выход и переинъецирует промпт в свежий контекст, состояние живёт в файлах. 8) Наблюдаемость: лог, трасса, стоимость и латентность."},{"h":"Принципы: сбой → правило, не наоборот","t":"Harness — живая система, выросшая из истории собственных сбоев, а не конфиг, который установили один раз. Правило добавляют после реального сбоя и убирают, когда модель нового поколения делает его лишним. Начинают с v0.1, а не с идеального дизайна. «Done» описывают до начала работы (sprint contract). Большие выводы инструментов не кладут в контекст целиком. Описания MCP-инструментов — тоже промпт, и в них может быть инъекция: доверять нельзя. Антипаттерны: винить модель и ждать следующую версию; раздутые правила; пересекающиеся инструменты; самооценка агента; «контекстная гниль» — работа до деградации качества."},{"h":"Как harness переводится на язык TPO","t":"Harness — это продукт: у него есть пользователи (разработчики, операторы, внутренние агенты), метрики (task success задачи, стоимость и время на задачу, доля вмешательств человека, доля откатов), релизы (правила, хуки, инструменты — через eval gate, как промпт), безопасность (песочница, approvals, что уходит наружу). TPO harness-направления отвечает за выбор платформы (build/buy/fork), границу «общее/командное» (платформа harness → сценарные пресеты), процесс изменений (каждое правило — ADR-строка с причиной) и за измерение: без трасс и eval harness не улучшается, а «настраивается на ощущениях»."},{"h":"Ландшафт и позиционирование dsh","t":"Claude Code — лучший UX и экосистема, но цикл фиксирован и модель одна. Codex — открытый CLI, точки расширения документированы, модель одна. OpenCode — мультипровайдер, но плагины вокруг фиксированного сервера. DeepSeek Harness — «everything is a plugin»: адаптер модели, реестр инструментов, лог сессии и сам цикл агента — заменяемые плагины на Cordis; любые модели через адаптеры (DeepSeek, OpenAI, Anthropic, Bedrock, Azure, Gemini, OpenAI-совместимые шлюзы, Ollama); субагенты-провайдеры для Claude Code и Codex; читает AGENTS.md/CLAUDE.md, запускает чужой hooks.json как путь совместимости; MCP-клиент и ACP для редакторов. Цена: developer preview с ломающими изменениями, нет аудита безопасности, PR не принимаются (только Discussions и плагины), «95% за 10% стоимости» — впечатление комментатора, не бенчмарк."}],"practice":{"mechanic":"keymoves","points":3,"stem":"Команда банка просит «просто поставить Claude Code всем разработчикам». Как TPO harness-направления вы собираете правильные ходы.","options":[{"id":"k0","text":"Сформулировать harness как продукт: пользователи, метрики, релизы правил через gate","correct":true,"why":"Harness управляется как продукт, а не как утилита."},{"id":"k1","text":"Завести короткий AGENTS.md из сбоев и хуки проверки после правок","correct":true,"why":"Правила — из сбоев; проверка — хуками, не уговорами."},{"id":"k2","text":"Сравнить по критериям: заменяемость цикла и модели, контур, зрелость — Claude Code, Codex, OpenCode, dsh","correct":true,"why":"Выбор платформы — матрица, не бренд."},{"id":"k3","text":"Разделить генератора и оценщика: ревью-субагент, агент не оценивает себя","correct":true,"why":"Самооценка скошена в плюс."},{"id":"k4","text":"Начать с v0.1 на одной команде и трассах, итерировать по сбоям","correct":true,"why":"Harness растёт из истории сбоев."},{"id":"f5","text":"Написать 300 строк правил «на все случаи» до первого запуска, чтобы агент сразу вёл себя идеально и не ошибался","correct":false,"why":"Раздутые правила размывают внимание и не ведут к сбоям."},{"id":"f6","text":"Дать агенту 50 инструментов с перекрывающимися функциями, чтобы он точно справился с любой задачей команды","correct":false,"why":"Около десяти сфокусированных инструментов работают лучше."},{"id":"f7","text":"Считать описания MCP-инструментов доверенными: это конфигурация администратора, а не пользовательский ввод","correct":false,"why":"Описания входят в промпт и могут содержать инъекцию."},{"id":"f8","text":"Отложить трассы и метрики: сначала «чтобы работало», наблюдаемость добавим после перехода всех команд","correct":false,"why":"Без трасс harness настраивается на ощущениях."}],"reference":"Harness — продукт с метриками и релизами; правила из сбоев, хуки для проверки, матрица выбора платформы, разделение ролей, итерация с v0.1 по трассам.","anchor":{"g":"harness","p":{"hl":["rules","tools","ctx","hooks","sandbox","sub","loop","obs"]},"cap":"восемь слотов harness вокруг модели"},"id":"u7-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Что такое harness в формуле «Agent = Model + Harness»?","options":[{"id":"o0","text":"Всё вокруг модели: правила, инструменты, контекст-политика, хуки, песочница, субагенты, трассы","correct":true,"rationale":"Harness — обвязка, превращающая модель в агента."},{"id":"o1","text":"Набор промптов и примеров, которыми модель дообучают вести себя как агент перед выкладкой в промышленную среду","correct":false,"rationale":"Это промпт-инжиниринг и дообучение, а не обвязка исполнения."},{"id":"o2","text":"Тестовый стенд для измерения качества модели на бенчмарках вроде SWE-bench и Terminal-Bench перед выбором поставщика","correct":false,"rationale":"Eval-стенд — часть harness, но не весь harness."},{"id":"o3","text":"Пользовательский интерфейс чата и IDE-плагин, через который разработчик общается с моделью и видит её ответы","correct":false,"rationale":"UI — одна из оболочек harness, цикл и инструменты живут глубже."}],"anchor":{"g":"harness","p":{"hl":["rules","tools","ctx","hooks","sandbox","sub","loop","obs"]},"cap":"модель в центре, вокруг — обвязка"},"id":"u7-1-t0"},{"mechanic":"single","points":2,"stem":"Какой принцип harness engineering сформулирован верно?","options":[{"id":"o0","text":"Правило добавляют после реального сбоя и убирают, когда новая модель делает его лишним","correct":true,"rationale":"Harness растёт из истории сбоев."},{"id":"o1","text":"Правила пишут заранее и полно, чтобы покрыть все известные классы ошибок до первого запуска","correct":false,"rationale":"Раздутые правила размывают внимание; без сбоя нет основания."},{"id":"o2","text":"Правила фиксируют навсегда: стабильность важнее, а модель всё равно непредсказуема","correct":false,"rationale":"Компоненты удаляют, когда модель их перерастает."},{"id":"o3","text":"Правила формулирует модель сама по итогам сессии и записывает их в AGENTS.md","correct":false,"rationale":"Самооценка скошена; правила пишет человек по трассам."}],"anchor":{"g":"timeline","p":{"items":["сбой","трасса","правило/хук","модель выросла","правило убрано"],"hl":2},"cap":"сбой → правило → ревизия"},"id":"u7-1-t1"},{"mechanic":"single","points":2,"stem":"Чем DeepSeek Harness отличается от Claude Code и OpenCode по архитектуре?","options":[{"id":"o0","text":"Заменяем сам runtime: цикл, адаптер модели, реестр инструментов и лог — плагины без ядра","correct":true,"rationale":"«Everything is a plugin» на Cordis."},{"id":"o1","text":"У dsh больше встроенных инструментов и готовых интеграций с банковскими и корпоративными системами из коробки","correct":false,"rationale":"Инструментов сопоставимо; дифференциатор — заменяемость."},{"id":"o2","text":"dsh работает только с моделями DeepSeek, поэтому заметно дешевле и стабильнее в промышленной эксплуатации","correct":false,"rationale":"Адаптеры для любых провайдеров; preview, не стабильность."},{"id":"o3","text":"dsh закрытый и платный продукт, зато с независимым аудитом безопасности и коммерческой поддержкой вендора","correct":false,"rationale":"MIT, открытый, без аудита, PR не принимаются."}],"anchor":{"g":"compare","p":{"a":["Claude Code / OpenCode","фиксированный цикл, плагины вокруг ядра"],"b":["dsh","цикл и адаптер — тоже плагины"],"verdict":"нет привилегированного ядра"},"cap":"заменяем runtime, а не только расширения"},"id":"u7-1-t2"},{"mechanic":"single","points":2,"stem":"Почему описания MCP-инструментов нельзя считать доверенными?","options":[{"id":"o0","text":"Они попадают в промпт модели и могут содержать инструкции — косвенная инъекция","correct":true,"rationale":"Любой текст в контексте — потенциальная инструкция."},{"id":"o1","text":"Потому что MCP-серверы часто падают и описания устаревают быстрее, чем обновляется реестр","correct":false,"rationale":"Нестабильность — отдельная проблема, не доверие."},{"id":"o2","text":"Потому что протокол MCP не поддерживает подпись и версионирование описаний","correct":false,"rationale":"Дело в содержимом описаний, а не в подписи."},{"id":"o3","text":"Их можно считать доверенными: это конфигурация администратора, а не пользовательский ввод","correct":false,"rationale":"В dsh MCP выключен по умолчанию именно из-за доверия и песочницы."}],"anchor":{"g":"pipeline","p":{"steps":["MCP-сервер","описание инструмента","промпт модели ⚠","действие"],"hl":[2]},"cap":"описание — тоже промпт"},"id":"u7-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре конфигурации harness для команды разработки. Какая соответствует принципам harness engineering?","vopts":[{"id":"v0","v":{"g":"treev","p":{"root":"AGENTS.md ≈ 40 строк","kids":["10 инструментов","хуки: тесты","трассы"],"ok":true}},"lbl":"","correct":true,"rationale":"Короткие правила, сфокусированные инструменты, проверка хуками, наблюдаемость."},{"id":"v1","v":{"g":"treev","p":{"root":"AGENTS.md 300 строк","kids":["50 инструментов","без хуков","без трасс"],"ok":false}},"lbl":"","correct":false,"rationale":"Раздутые правила, пересекающиеся инструменты, нет проверки и наблюдаемости."},{"id":"v2","v":{"g":"treev","p":{"root":"самооценка агента","kids":["«готово»","без ревью","без тестов"],"ok":false}},"lbl":"","correct":false,"rationale":"Агент оценивает сам себя — скос в плюс."},{"id":"v3","v":{"g":"treev","p":{"root":"ждём новую модель","kids":["правил нет","хуков нет","сбой = модель"],"ok":false}},"lbl":"","correct":false,"rationale":"Вина на модели вместо правки harness."}],"id":"u7-1-t4"}],"framework":"Harness = всё вокруг модели: правила, инструменты, контекст-политика, хуки, песочница, субагенты, циклы, трассы. Правила из сбоев, ~10 инструментов, генератор ≠ оценщик, успех молчит. Harness — продукт с метриками и релизами. Ландшафт: Claude Code/Codex/OpenCode — фиксированное ядро; dsh — заменяемый runtime на Cordis, MIT, developer preview без аудита.","anchor":{"g":"harness","p":{"hl":["rules","tools","ctx","hooks","sandbox","sub","loop","obs"]},"cap":"Agent = Model + Harness"},"layers":{"simple":"Представь гениального стажёра без памяти. Чтобы он стал сотрудником, ему нужна обвязка: короткая памятка на столе, ящик с десятью инструментами, правило «большие распечатки — в папку, не на стол», проверяющий, который прогоняет тесты после каждой правки, запертая дверь в серверную, коллеги-специалисты, к которым можно обратиться, и журнал, куда записывается каждый шаг. Эта обвязка и есть harness.\nПамятку пишут не заранее, а после каждой ошибки — и вычёркивают строки, когда стажёр вырос. Стажёр не проверяет сам себя: проверяет другой.\nНа рынке у каждой лаборатории свой «стол»: у большинства его нельзя разобрать, только дополнить. DeepSeek Harness — стол, у которого заменяется каждая ножка, включая сам цикл работы. За это платят незрелостью: preview, без аудита, правки принимают только как плагины.\nПроверь себя: что в формуле Agent = Model + Harness относится к harness?","how":"1. Слоты harness: правила (AGENTS.md), инструменты, контекст-политика (компакция, выгрузка, skills, сброс), хуки, песочница, субагенты, циклы, наблюдаемость.\n2. Принципы: сбой → правило; удалять лишнее при росте модели; ~10 инструментов; генератор/оценщик; успех молчит; v0.1 и итерации; описания MCP — недоверенный промпт.\n3. Harness как продукт для TPO: пользователи, метрики (task success, стоимость/время задачи, доля вмешательств, откаты), релизы правил через gate, безопасность (что уходит наружу).\n4. Ландшафт: Claude Code (фиксированный цикл, экосистема), Codex (открытый CLI, точки расширения), OpenCode (мультипровайдер, фиксированное ядро), Qwen Code / Trae / Kimi CLI / ZCode; dsh — заменяемый runtime, MIT, 13.08.2026, v0.2.1-alpha (окт. 2026), PR не принимают.\n5. Пример. Команда жалуется: «агент ломает тесты». Harness-ответ: хук после правки запускает тесты и возвращает ошибки в цикл; строка в AGENTS.md «не трогать snapshots/»; трасса показывает, что сбой — в выгрузке длинного вывода. Через месяц правило о snapshots удалено: новая модель не ошибается.","formula":{"f":"Agent = Model + Harness\nHarness = rules + tools + context_policy + hooks + sandbox + subagents + loops + observability","legend":[["rules","AGENTS.md/CLAUDE.md, короткие, из сбоев","< 60 строк"],["context_policy","компакция, head/tail-выгрузка, skills, сброс","hand-off файл"],["hooks","проверки после правок и запреты","тесты, rm -rf, push main"],["sandbox","изоляция файлов/сети, allow-list","bwrap / Seatbelt"],["loops","длинные задачи: Ralph-loop, plan file","состояние в файлах"],["observability","трасса, стоимость, латентность","session log"]],"note":"Каждый компонент — предположение «модель не справится сама»; когда справляется — компонент удаляют."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Harness — всё вокруг модели; Agent = Model + Harness.\n— Правила из сбоев, короткие; ~10 инструментов; генератор ≠ оценщик.\n— Контекст-политика: компакция, выгрузка, skills, сброс.\n— Harness — продукт: метрики, релизы правил через gate, безопасность.\n— dsh — заменяемый runtime на Cordis; MIT, preview, без аудита, PR не принимают.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Что относится к harness в формуле Agent = Model + Harness?","o":["Веса модели, её контекстное окно и параметры генерации вроде температуры","Правила, инструменты, контекст-политика, хуки, песочница, субагенты, трассы","Только пользовательский интерфейс чата и IDE-расширение, через которые работает разработчик"],"a":1,"w":"Harness — всё вокруг модели, что делает её агентом."},{"q":"Как появляется правило в AGENTS.md по принципам harness engineering?","o":["Пишется заранее на все известные случаи и фиксируется до первого запуска","После реального сбоя, с удалением, когда модель его перерастает","Формулируется моделью по итогам сессии и записывается ею же в AGENTS.md"],"a":1,"w":"Каждая строка ведёт к прошлому сбою."},{"q":"В формуле harness что такое context_policy?","o":["Размер контекстного окна модели и лимит выходных токенов","Компакция, выгрузка больших выводов, skills по требованию, сброс","Температура, top-p и другие параметры сэмплирования ответа модели"],"a":1,"w":"Политика управления контекстом — отдельный слот harness."},{"q":"Чем dsh отличается от Claude Code и OpenCode?","o":["Больше встроенных инструментов и интеграций из коробки","Заменяем сам runtime: цикл, адаптер, реестр, лог — плагины","Работает только с DeepSeek и поэтому дешевле в эксплуатации"],"a":1,"w":"«Нет привилегированного ядра» — главный тезис dsh."}],"rules":["Harness — всё вокруг модели; Agent = Model + Harness.","Правила из сбоев, короткие; ~10 инструментов; генератор ≠ оценщик.","Контекст-политика: компакция, выгрузка, skills, сброс.","Harness — продукт: метрики, релизы правил через gate, безопасность.","dsh — заменяемый runtime на Cordis; MIT, preview, без аудита, PR не принимают."]}},{"id":"u7-2","level":"L7","title":"DeepSeek Harness: Cordis и «everything is a plugin»","lead":"Плагины, сервисы ctx.*, типизированные события, слои конфигурации, профили и пресеты, интерфейсы","concept":"dsh — Node.js-runtime (npm `@deepseek-ai/dsh`, `npx @deepseek-ai/dsh web`, Web UI на 127.0.0.1:3080) на фреймворке Cordis (из экосистемы Koishi, автор Shigma; DeepSeek вендорит и расширяет; статья «A Programming Paradigm for Spatiotemporal Composability» — Пекинский университет и DeepSeek). Пять идей Cordis: плагин — функция с `inject` и `apply(ctx)` или подкласс Service; контекст — реестр сервисов по стабильным ключам (`ctx.tools`, `ctx.llm`, `ctx.agents`, `ctx.sessions`); зависимости через `inject` — плагин ждёт, пока сервисы появятся (пространственная композиция); типизированные события с пятью режимами диспетчеризации (emit, waterfall, parallel, serial, bail), где waterfall — around-middleware с `next()`; обратимые регистрации через `ctx.effect()`/`ctx.on()` — при выгрузке плагина его слушатели, секции промпта и схемы инструментов снимаются (временна́я композиция; внешние эффекты вроде shell-команд не откатываются). Запущенный dsh — дерево плагинов, собранное слоями: профиль (`$DSH_HOME/profiles/<name>`, шаблоны web, headless, sdk, sdk-minimal, acp) → бандлы (`dsh-base` общий первый слой; `dsh-web-app`, `dsh-headless`, `dsh-sdk-app`, `dsh-acp-app`; `dsh-sdk-minimal` — исключение без base) → `cordis.patch.yml` профиля → домашний патч → `--patch` оверлеи. Патч заменяет строку по `id` или вставляет новые; `dsh --profile web --dump-config` печатает собранное дерево. Пресеты агента: Standard (файлы, shell, поиск, skills, план, цели, субагенты, workflows), PTC (бывший Code: модель пишет программу против сгенерированного SDK и вызывает инструменты через `run_code` с теми же политиками), Minimal (только shell и str_replace_editor — для бенчмарков), Creator (инспекция runtime и эксперименты с плагинами в памяти). Интерфейсы: Web UI (Trajectory, сессии, рабочие пространства, настройки, плагины), Desktop (Electron, macOS/Windows), headless (`dsh --profile headless \"задача\"` → ответ и код выхода), SDK (JSON-RPC, Python `deepseek-harness-sdk`, TypeScript), ACP для редакторов; MCP-клиент; субагенты-провайдеры Claude Code и Codex (бинарь из PATH, выключены по умолчанию); чтение AGENTS.md/CLAUDE.md; мост для чужого hooks.json.","points":[{"h":"Cordis за пять идей","t":"Плагин: `{ name, inject: ['llm'], apply(ctx, config) }` или класс Service. Сервис: ключ на контексте, другие плагины ищут по ключу, не импортируют реализацию. Inject: порядок загрузки выводится из требований, не из ручной последовательности. События: сервис объявляет имена через declaration merging; режим события проверяется каталогом (`@mode`). Waterfall: слушатель получает `(...args, next)`; `next()` делегирует, его отсутствие — короткое замыкание; `prepend: true` ставит слушателя первым; политика может замкнуть, наблюдатель обязан делегировать. Эффекты: каждая регистрация возвращает disposer; связанные регистрации — в одном эффекте, чтобы откат шёл в нужном порядке."},{"h":"Слои конфигурации и профили","t":"Profile — именованная композиция в Harness home: список бандлов, установленные out-of-tree плагины (pnpm в `node_modules` профиля), свой `cordis.patch.yml`. Bundle — формат распространения строк конфига и кода, строки остаются патчируемыми выше. Порядок: бандлы профиля → патч профиля → домашний патч → `--patch`. Декларации в `package.json` поле `dsh`: `dsh.profile` (бандлы), `dsh.bundle` (патч бандла). HMR в base (config-only), выключен в headless/sdk/acp. Команды: `dsh --profile <name>`, `dsh web`, `dsh plugin --profile <name> add <pkg>`, `--dump-config`. Launcher-флаги первыми; первый неизвестный токен — аргументы приложения (`--port 8080`)."},{"h":"Ключевые пакеты и ключи контекста","t":"`core/session` → `ctx.sessions` (append-only лог SessionEvent); `core/system-prompt` → `ctx.systemPrompt` (сборка секций и схем инструментов); `core/tools` → `ctx.tools` (scoped-реестр и защищённый конвейер); `core/agent` → `ctx.agents` (интерфейс Agent, события agent/*); `core/agent-loop` → `ctx.agentLoop` (драйвер по умолчанию); `llm/llm` → `ctx.llm` (словарь сообщений/стримов, seam адаптеров). Прочие: `ctx.shell`/`ctx.subprocess`, `ctx.terminals`, `ctx.commands`, `ctx.jobs`, `ctx.fs`, `ctx.sandbox`, `ctx.approval`, `ctx.skills`, `ctx.subagents`, `ctx.workflowEngine`, `ctx.ptcRuntime`, `ctx.web`, `ctx.lsp`, `ctx.sessionTelemetry`, экспериментальные `ctx.agentTeams`, `ctx.browserUse`, `ctx.computerUse`, `ctx.worktrees`."},{"h":"Seam: определение → провайдер → потребитель","t":"Capability seam = три роли: Service Definition (интерфейс), Service Provider (реализация), Consumer (обычно инструмент для модели). Одна роль — не seam. Примеры: `ctx.llm` ← `llm-deepseek`, `llm-pi-ai`, `llm-replay`; `ctx.fs` ← `fs-local`/`fs-sandbox`/`fs-ssh`; `ctx.shell` ← `bash-local`/`bash-sandbox`/`pwsh-local`; `ctx.subprocess` ← `subprocess-local`/`subprocess-ssh`; `ctx.sandbox` ← `sandbox-local`/`sandbox-ssh`; `ctx.web` ← `web-search-exa`/`-perplexity`/`-deepseek`, `web-fetch-http`; `ctx.subagents` ← `subagent-spawn-in-process`, `-fork-in-process`, `-acp`, `-codex`, `-claude-code`, `-dsh-sdk`; `ctx.storage` ← `storage-json`/`storage-sqlite`. Файловая система и subprocess делят один «мир исполнения»: перенаправив их на удалённую песочницу (ssh), вы переносите Bash, PTY и LSP вместе."}],"practice":{"mechanic":"matching","points":3,"stem":"Сопоставьте механизм Cordis/dsh и его назначение.","pairs":[{"l":"inject","r":"Плагин ждёт появления сервисов; порядок загрузки — из зависимостей"},{"l":"waterfall + next()","r":"Around-middleware: политика может замкнуть цепочку, наблюдатель делегирует"},{"l":"ctx.effect()","r":"Обратимая регистрация с disposer — выгрузка снимает слушатели и схемы"},{"l":"cordis.patch.yml","r":"Слой конфигурации: заменить строку по id или вставить новую"},{"l":"seam","r":"Определение + провайдер + потребитель: заменяемая способность"},{"l":"--dump-config","r":"Печать собранного дерева плагинов без запуска"}],"solution":"Пространственная композиция — inject и сервисы; временна́я — эффекты; политика — waterfall; конфигурация — слои патчей; заменяемость — seam.","anchor":{"g":"cordis","p":{},"cap":"пять идей Cordis на одной схеме"},"id":"u7-2-p"},"test":[{"mechanic":"single","points":2,"stem":"Что означает «everything is a plugin» в dsh на практике?","options":[{"id":"o0","text":"Адаптер модели, реестр инструментов, лог сессии и цикл агента — плагины; расширение — монтирование рядом","correct":true,"rationale":"Нет привилегированного ядра."},{"id":"o1","text":"Любую функцию можно включить и выключить в настройках Web UI без перезапуска сервера, включая цикл агента и модель","correct":false,"rationale":"Это свойство HMR, а не тезис архитектуры."},{"id":"o2","text":"Пользовательские плагины пишутся на любом языке и подключаются через MCP-серверы","correct":false,"rationale":"Плагины — Cordis/Node; MCP — внешние инструменты."},{"id":"o3","text":"Ядро dsh минимально и неизменно, а вся функциональность вынесена в официальные плагины DeepSeek, которые важнее сообщественных","correct":false,"rationale":"Официальные пакеты не важнее сообщественных; ядра нет."}],"anchor":{"g":"cordis","p":{},"cap":"плагины вокруг контекста, не вокруг ядра"},"id":"u7-2-t0"},{"mechanic":"single","points":2,"stem":"Слушатель waterfall-события должен вызвать next(). Когда это можно не делать?","options":[{"id":"o0","text":"Когда слушатель — политика, владеющая решением, и намеренно замыкает цепочку","correct":true,"rationale":"Короткое замыкание — для владельца решения."},{"id":"o1","text":"Всегда можно не вызывать: следующий слушатель запустится автоматически по порядку регистрации","correct":false,"rationale":"Без next() цепочка обрывается."},{"id":"o2","text":"Когда слушатель только наблюдает и ничего не меняет — тогда next() избыточен","correct":false,"rationale":"Наблюдатель обязан делегировать."},{"id":"o3","text":"Когда событие объявлено в режиме emit: там next() запрещён","correct":false,"rationale":"В emit нет next(), но это другой режим, не waterfall."}],"anchor":{"g":"pipeline","p":{"steps":["policy","next()","observer","next()","default"],"hl":[0]},"cap":"замыкает владелец решения"},"id":"u7-2-t1"},{"mechanic":"single","points":2,"stem":"В каком порядке применяются слои конфигурации dsh?","options":[{"id":"o0","text":"Бандлы профиля → cordis.patch.yml профиля → домашний патч → --patch оверлеи","correct":true,"rationale":"От общего к частному; последний побеждает."},{"id":"o1","text":"--patch оверлеи → домашний патч → патч профиля → бандлы, чтобы базовые значения были последними","correct":false,"rationale":"Наоборот: бандлы — первый слой."},{"id":"o2","text":"Только cordis.patch.yml профиля: бандлы и домашний патч читаются лишь при --dump-config","correct":false,"rationale":"Все четыре слоя участвуют в сборке."},{"id":"o3","text":"Порядок задаётся полем order в package.json каждого плагина","correct":false,"rationale":"Порядок слоёв фиксирован; package.json — декларации dsh.profile/bundle."}],"anchor":{"g":"stack2","p":{"rows":[["--patch оверлеи",1],["домашний патч",1],["cordis.patch.yml профиля",1],["бандлы профиля (dsh-base …)",2]]},"cap":"четыре слоя, верхний побеждает"},"id":"u7-2-t2"},{"mechanic":"single","points":2,"stem":"Чем пресет PTC отличается от Standard?","options":[{"id":"o0","text":"Модель пишет программу против сгенерированного SDK и вызывает инструменты через run_code; политики те же","correct":true,"rationale":"Один вызов вместо ~5 раундов."},{"id":"o1","text":"PTC даёт модели прямой доступ к Node-процессу без песочницы ради скорости выполнения многошаговых сценариев","correct":false,"rationale":"Программы — «враждебные пиры», политика сохраняется."},{"id":"o2","text":"PTC — минимальный набор из персистентного shell и редактора строк, который DeepSeek использует для бенчмарков моделей","correct":false,"rationale":"Это описание пресета Minimal, а не PTC."},{"id":"o3","text":"PTC включает инспекцию runtime, эксперименты с плагинами в памяти и подсказки по авторству пресетов","correct":false,"rationale":"Это описание пресета Creator, а не PTC."}],"anchor":{"g":"compare","p":{"a":["Standard","вызов инструмента на каждый шаг"],"b":["PTC","программа против SDK, run_code"],"verdict":"меньше раундов, те же политики"},"cap":"PTC = programmatic tool calling"},"id":"u7-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре схемы seam для файловой системы. Какая устроена правильно?","vopts":[{"id":"v0","v":{"g":"pipe","p":{"steps":["ctx.fs (definition)","fs-local / fs-sandbox / fs-ssh","tool-fs (consumer)"],"hl":[0,1,2]}},"lbl":"","correct":true,"rationale":"Определение, заменяемые провайдеры, потребитель."},{"id":"v1","v":{"g":"pipe","p":{"steps":["tool-fs","fs.readFileSync","диск"],"hl":[1]}},"lbl":"","correct":false,"rationale":"Инструмент импортирует реализацию напрямую — не seam."},{"id":"v2","v":{"g":"pipe","p":{"steps":["ctx.fs","ничего"],"hl":[0]}},"lbl":"","correct":false,"rationale":"Одно определение без провайдера — не seam."},{"id":"v3","v":{"g":"pipe","p":{"steps":["fs-local","fs-ssh","оба активны"],"hl":[2]}},"lbl":"","correct":false,"rationale":"Провайдеры без определения и потребителя, оба сразу — конфликт."}],"id":"u7-2-t4"}],"framework":"Cordis: плагин (inject, apply), сервисы ctx.*, события пяти режимов (waterfall с next()), обратимые эффекты. Слои: бандлы → патч профиля → домашний патч → --patch; профили web/headless/sdk/sdk-minimal/acp; --dump-config. Пресеты: Standard, PTC (run_code), Minimal, Creator. Seam = definition + provider + consumer. Интерфейсы: Web 3080, Desktop, headless, SDK JSON-RPC (Python/TS), ACP, MCP-клиент.","anchor":{"g":"dsh","p":{"hl":["profile","bundle","patch","core","seams"]},"cap":"dsh: слои конфигурации над плагинным деревом"},"layers":{"simple":"Cordis — это конструктор, где каждая деталь объявляет, какие другие детали ей нужны, и встаёт на место сама, когда они появились. Вынул деталь — всё, что она прикрепила (слушатели, кусочки промпта, схемы инструментов), снимается автоматически. Поэтому у dsh нет «сердцевины», которую нельзя тронуть: даже цикл агента — деталь.\nКонфигурация собирается слоями, как одежда: базовый бандл, поверх — патч профиля, поверх — домашний патч, поверх — временные оверлеи. Верхний слой побеждает, и любую строку можно заменить по её id.\nПресеты — это наборы инструментов и подсказок: полный Standard, программируемый PTC, голый Minimal для бенчмарков, Creator для разработки плагинов. Запускать можно как сайт, как приложение, без интерфейса, из Python или из редактора.\nПроверь себя: когда слушатель waterfall может не вызывать next()?","how":"1. Плагин: `{ name, inject, Config, apply(ctx, config) }` или Service. Сервис — ключ на ctx. Inject — ожидание зависимостей. События: emit / waterfall / parallel / serial / bail; waterfall — `(…args, next)`, `prepend: true`. Эффекты — disposer на каждую регистрацию.\n2. Слои: profile ($DSH_HOME/profiles/<name>: package.json c dsh.profile.bundles, cordis.patch.yml) → бандлы (`@deepseek-ai/dsh-base`, `dsh-web-app`, `dsh-headless`, `dsh-sdk-app`, `dsh-acp-app`; `dsh-sdk-minimal` без base) → домашний `$DSH_HOME/cordis.patch.yml` → `--patch`. Проверка: `dsh --profile web --dump-config`.\n3. Команды: `npx @deepseek-ai/dsh web` (127.0.0.1:3080, `--no-open`), `dsh --profile headless \"задача\"`, `dsh plugin --profile web add @scope/pkg@x.y.z` (pnpm), `dsh --profile web --port 8080`.\n4. Пресеты: Standard; PTC (`run_code` против SDK; прямой вызов нативного инструмента → UNKNOWN_TOOL); Minimal (bash + str_replace_editor); Creator.\n5. Ключи: ctx.sessions, ctx.systemPrompt, ctx.tools, ctx.agents, ctx.agentLoop, ctx.llm; seams: fs, shell, subprocess, sandbox, web, subagents, storage, credentials, approval, skills, ptcRuntime, workflowEngine, jobs, lsp, sessionTelemetry.\n6. Пример. Нужен on-prem шлюз: плагин `llm-bankgw` с `inject: ['llm']`, `ctx.llm.registerAdapter(['bank-gateway'], new Adapter(config))`, ключ через `!!js process.env.BANK_GW_KEY` в cordis.yml; строка в патче профиля выбирает provider `bank-gateway`, model `qwen-72b-int4`. Удалили плагин — адаптер снят.","formula":{"f":"dsh = Σ layers(profile.bundles → profile.patch → home.patch → --patch) → plugin tree\nplugin = { inject[], apply(ctx) } ; seam = definition + provider + consumer","legend":[["inject","сервисы, без которых плагин не стартует","['llm', 'tools']"],["waterfall","around-middleware с next()","agent/pre-step, tools/*"],["effect","обратимая регистрация","disposer при выгрузке"],["patch","замена строки по id или вставка","cordis.patch.yml"],["preset","набор инструментов и секций промпта","Standard / PTC / Minimal / Creator"]],"note":"Проверяй композицию командой --dump-config: любая напечатанная строка заменяема патчем."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Cordis: плагин = inject + apply; сервисы по ключам ctx.*; события пяти режимов; обратимые эффекты.\n— Слои: бандлы → патч профиля → домашний патч → --patch; --dump-config показывает дерево.\n— Пресеты: Standard, PTC (run_code), Minimal, Creator.\n— Seam = definition + provider + consumer; fs и subprocess — один мир исполнения.\n— Интерфейсы: Web 3080, Desktop, headless, SDK JSON-RPC, ACP, MCP-клиент.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Когда слушатель waterfall может не вызывать next()?","o":["Когда он только наблюдает и ничего не меняет в результате","Когда он — политика, владеющая решением, и замыкает намеренно","Всегда: следующий слушатель запустится сам по порядку регистрации"],"a":1,"w":"Наблюдатели делегируют; замыкает владелец решения."},{"q":"Что делает ctx.effect()?","o":["Запускает плагин заново при HMR и пересобирает его конфигурацию","Регистрирует обратимое изменение с disposer на выгрузку плагина","Проверяет зависимости inject и откладывает запуск до их появления"],"a":1,"w":"Временна́я композиция: откат регистраций при выгрузке."},{"q":"В формуле dsh какой слой побеждает при конфликте?","o":["Бандлы профиля — они задают базовые значения для всех","--patch оверлеи — последний слой","Домашний патч в $DSH_HOME, общий для всех профилей"],"a":1,"w":"Последний применённый слой переопределяет строку по id."},{"q":"Какой пресет использовать для бенчмарка модели?","o":["Standard — полный набор с поиском и субагентами","Minimal — bash и str_replace_editor","Creator — инспекция runtime и плагины в памяти"],"a":1,"w":"DeepSeek использует Minimal для бенчмарков моделей."}],"rules":["Cordis: плагин = inject + apply; сервисы по ключам ctx.*; события пяти режимов; обратимые эффекты.","Слои: бандлы → патч профиля → домашний патч → --patch; --dump-config показывает дерево.","Пресеты: Standard, PTC (run_code), Minimal, Creator.","Seam = definition + provider + consumer; fs и subprocess — один мир исполнения.","Интерфейсы: Web 3080, Desktop, headless, SDK JSON-RPC, ACP, MCP-клиент."]}},{"id":"u7-3","level":"L7","title":"Цикл хода, лог сессии и конвейер инструментов dsh","lead":"turn/step, события agent/* и tools/*, append-only лог, approvals, компакция, PTC, skills, workflows, субагенты, plan mode","concept":"В dsh step — один запрос к модели плюс вызванные им инструменты; turn — ноль и более шагов, открывается до первого входа и закрывается, когда ничего не должно. Последовательность: `turn/start` → claim входа → сборка секций промпта и схем → `agent/pre-step` (waterfall: reject | enter) → `step/start` → `agent/request` + prepareCall (маршрут) → фиксация `system/message` и `user/message`, `request/header` → история выводится из лога (`deriveMessages()`) → `llm/stream` → `agent/assistant-stream` (start/chunks/end) → `assistant/message` (или `assistant/attempt` при ошибке/отмене) → на каждый вызов: `tool/call` → `tools/pre-execute` → guards → `tools/execute` → `tools/post-execute` → `tool/result` → `step/end` → если инструменты требуют ещё запрос — новый step → `agent/turn-stopping` (serial) → `turn/end`. Лог сессии append-only: «всё, что видит модель, записано» — resume, fork, replay, транскрипты, телеметрия и Web UI строятся на нём; хранится как `session.vN.jsonl[.zstd]` с миграциями поколений; `agent.inject()` кладёт контекст в следующий запрос. Инструменты: `defineTool({ name, description, parameters, output, execute, timeoutMs, isConcurrencySafe })`, `ctx.tools.restrict({ allow, deny })` на scope; `tools/pre-execute` возвращает allow | deny | cancel | ask; guards (`ctx.tools.guard`) только запрещают и не отменяются позже; `ask` исполняется только при `allowed-once`; параллельно — только `isConcurrencySafe === true`, иначе exclusive. Approvals: исходы allowed-once | rejected | cancelled | unavailable; политики `ask` (по умолчанию) и `never` (headless/CI, детерминированный reject до диспетчеризации); `approval/asked` и `approval/decided` — только в лог, не в транскрипт. Компакция: триггеры pressure (на `agent/pre-step`) и context-overflow; сначала pruning (`ctx.toolResultPruner`, head/middle/tail), затем summary через `ctx.llm.stream()`, записывается как `user/message` с `surfaceOp: replace`; границы сохраняют пары tool-call/result; события `compaction/start|summary|end`. PTC: `ctx.ptcRuntime` исполняет программу против биндингов `tools` в sandboxed Node, программы — «враждебные пиры», ошибки kind: exception/timeout/abort/worker-exit/output-limit/sandbox-unavailable. Skills: `<name>/SKILL.md` или `<name>.md`, kebab-case, роли по рангу (project `.dsh/skills` 100 → `.agents/skills` 200 → custom 300 → user 400/500 → bundled 600), каталог инъецируется как `<available_skills>` в `<system-reminder>`, инструмент `skill({ name })`. Workflows: скрипт модели запускает субагентов (`agent()`, `parallel()`, `pipeline()`), результат completed | cancelled | error. Субагенты: spawn (свой пресет) и fork (наследует композицию), внешние Codex/Claude Code/ACP/dsh-sdk — один прогон без follow-up; `send_message`, `interrupt`, `maxDepth`, результат с stopReason. Plan mode: `/plan`, `exit_plan_mode` требует markdown-план с `#`, approve/keep planning/dismiss через user-questions; soft guidance, не ограничение — ограничивают sandbox и approvals.","points":[{"h":"Turn, step и события","t":"Три домена событий: session (долговечные факты в логе, `session/event`: `turn/*`, `step/*`, `system|user|assistant/message`, `assistant/attempt`, `tool/*`), agent (`agent/created` serial, `agent/pre-step`, `agent/request` waterfall, `agent/assistant-stream` транзиентный, `agent/turn-stopping` serial без next), capability (`fs/*`, `tools/*`, `telemetry/*`). Правила: ретраи не повторяют сборку и pre-step; первый шаг резервирует system head; промпт едет только как `system/messa
