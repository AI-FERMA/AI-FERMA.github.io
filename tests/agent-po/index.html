<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Архитектор агентов · TPO ИИ-агентов в банке за 10 часов (v1.2.0)</title>
<style>
:root{
  --paper:#f3f5f0; --paper2:#eaede6; --card:#ffffff; --card2:#f7f8f4;
  --line:#d8ddd3; --line2:#bfc6ba;
  --ink:#141c26; --muted:#5b6774; --faint:#8a95a1;
  --a:#2a5bd7; --a-soft:rgba(42,91,215,.10); --a-line:rgba(42,91,215,.35);
  --b:#e8782a; --b-hot:#f59a4f; --b-deep:#c45f17; --b-soft:rgba(232,120,42,.12); --b-line:rgba(232,120,42,.4);
  --ok:#1b8f5c; --ok-soft:rgba(27,143,92,.12); --err:#c93b3b; --err-soft:rgba(201,59,59,.10);
  --gold:#b58a10; --gold-soft:rgba(181,138,16,.14);
  --grid:rgba(42,91,215,.07);
  --r:14px; --r-sm:10px; --shadow:0 2px 10px rgba(20,28,38,.06);
  --maxw:680px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --disp:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --paper:#0f1620; --paper2:#141d29; --card:#182230; --card2:#1d2837;
  --line:#2a3647; --line2:#3b495c;
  --ink:#e8edf3; --muted:#9aa7b6; --faint:#6b7786;
  --a:#7ea3ff; --a-soft:rgba(126,163,255,.14); --a-line:rgba(126,163,255,.4);
  --b:#ff9a4d; --b-hot:#ffb36f; --b-deep:#d9701f; --b-soft:rgba(255,154,77,.14); --b-line:rgba(255,154,77,.45);
  --ok:#4fd48f; --ok-soft:rgba(79,212,143,.14); --err:#ff7676; --err-soft:rgba(255,118,118,.12);
  --gold:#f0c24a; --gold-soft:rgba(240,194,74,.14);
  --grid:rgba(126,163,255,.06);
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--font);min-height:100vh;min-height:100dvh;overflow-x:hidden}
html.has-sheet,html.has-sheet body{overflow:hidden}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 60%,transparent);mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 60%,transparent)}
#app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:12px 16px calc(44px + env(safe-area-inset-bottom))}
h1,h2,h3{line-height:1.22;margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.005em}
h2{font-size:23px} h3{font-size:19px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.93em}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}
a{color:var(--a)}
.small{font-size:13.5px} .muted{color:var(--muted)} .faint{color:var(--faint)}
.ok-c{color:var(--ok)} .err-c{color:var(--err)} .gold-c{color:var(--gold)} .a-c{color:var(--a)} .b-c{color:var(--b)}
.top{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.brand{font-family:var(--disp);font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand i{font-style:normal;display:inline-block;padding:0 5px;border-radius:6px;margin-right:3px;font-family:var(--mono);font-size:13px;font-weight:700}
.brand .ia{background:var(--a);color:#fff} .brand .ib{background:var(--b);color:#fff}
.top .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:650;white-space:nowrap}
.chip.hot{color:var(--b-deep)} .chip.xp{color:var(--a)}
.ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);font-size:16px;position:relative}
.ico.fs{font-size:12px;font-weight:800;font-family:var(--mono)}
.ico .bdg{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--b);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.card.tight{padding:12px 14px}
.card.note{background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.pill.a{background:var(--a-soft);color:var(--a);border-color:var(--a-line)}
.pill.b{background:var(--b-soft);color:var(--b-deep);border-color:var(--b-line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--b);color:#fff;font-weight:700;font-size:16px;border-radius:12px;padding:13px 20px;box-shadow:0 3px 0 var(--b-deep);transition:transform .08s,box-shadow .08s;user-select:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--b-deep)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line2);border:1px solid var(--line)}
.btn.blue{background:var(--a);box-shadow:0 3px 0 #1d3f99}
.btn.wide{width:100%} .btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn.xs{padding:5px 10px;font-size:12.5px;border-radius:8px;box-shadow:none}
.ladder{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);border-radius:var(--r);padding:16px 16px 10px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.ladder h2{font-size:21px;margin-bottom:2px}
.ladder .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.rung{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed var(--line);text-align:left;width:100%}
.rung:last-child{border-bottom:1px dashed var(--line)}
.rung .n{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:800;border:2px solid var(--line2);color:var(--muted);background:var(--card)}
.rung.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rung.cur .n{background:var(--b);border-color:var(--b);color:#fff;box-shadow:0 0 0 4px var(--b-soft)}
.rung.lock{opacity:.5}
.rung .t{flex:1;min-width:0}
.rung .t b{display:block;font-size:15px}
.rung .t span{font-size:12.5px;color:var(--muted)}
.rung .pc{font-family:var(--mono);font-size:12.5px;color:var(--faint);min-width:44px;text-align:right}
.bar{height:7px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;margin:8px 0;box-shadow:var(--shadow)}
.rowbtn:active{background:var(--card2)}
.rowbtn .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--card2);border:1px solid var(--line);flex:0 0 auto}
.rowbtn .tt{flex:1;min-width:0}
.rowbtn .tt b{display:block;font-size:15px}
.rowbtn .tt span{font-size:12.5px;color:var(--muted);display:block}
.rowbtn .tt b .sym{display:inline-block;width:auto;font-size:11px;color:var(--a);margin-left:6px}
.rowbtn .st{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:var(--faint);font-family:var(--mono);white-space:nowrap}
.rowbtn.done{border-color:rgba(27,143,92,.35)}
.rowbtn.lock{opacity:.55}
.grp{margin:14px 0 4px;font-family:var(--disp);font-size:17px;display:flex;align-items:baseline;gap:8px}
.grp .cnt{font-family:var(--mono);font-size:12px;color:var(--faint)}
.playtop{display:flex;align-items:center;gap:10px;padding:8px 0 10px;position:sticky;top:0;z-index:20;background:var(--paper);margin:0 -2px;padding-left:2px;padding-right:2px}
.playtop .tools{display:flex;gap:6px;flex:0 0 auto;position:relative}
.playtop .x .bdg{position:absolute;top:-4px;right:-4px;background:var(--b);color:#fff;font-size:10px;line-height:1;padding:2px 5px;border-radius:99px;font-weight:700}
.playtop .x{position:relative;cursor:pointer;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;flex:0 0 auto}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--paper2);border:1px solid var(--line)}
.segs i.on{background:var(--b);border-color:transparent}
.segs i.ok{background:var(--ok);border-color:transparent}
.segs i.bad{background:var(--err);border-color:transparent;opacity:.7}
.combo{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--b-deep);min-width:40px;text-align:right}
.theory h3{margin-bottom:8px}
.theory p{margin:0;white-space:pre-wrap;font-size:16px;line-height:1.6}
.theory .fr{font-size:12.5px;color:var(--a);font-weight:700;margin-bottom:6px}
.stem{font-size:17px;font-weight:600;margin:0 0 8px;white-space:pre-wrap;line-height:1.5}
.mech{font-size:12px;font-weight:700;color:var(--a);margin-bottom:8px}
.hint{font-size:13px;color:var(--faint);margin:-2px 0 8px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 13px;margin:8px 0;font-size:15px;line-height:1.45;transition:border-color .12s,background .12s;flex-wrap:wrap}
.opt:not(:disabled):hover{border-color:var(--line2)}
.opt .key{width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;color:var(--muted);margin-top:1px;font-family:var(--mono)}
.opt>span:not(.key):not(.ord){flex:1;min-width:0}
.opt.sel{border-color:var(--a);background:var(--a-soft)}
.opt.sel .key{border-color:var(--a);color:var(--a)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .key{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--err);background:var(--err-soft)}
.opt.bad .key{border-color:var(--err);color:var(--err)}
.opt.miss{border-color:var(--gold);background:var(--gold-soft)}
.opt.dim{opacity:.6}
.opt .ord{margin-left:auto;font-weight:800;color:var(--b-deep);font-family:var(--mono);min-width:28px;text-align:right}
.why{font-size:14px;line-height:1.5;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:block;width:100%;flex-basis:100%}
.fbk{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.fbk b{display:block;margin-bottom:2px}
.fbk.ok{background:var(--ok-soft);border:1px solid rgba(27,143,92,.35)}
.fbk.mid{background:var(--gold-soft);border:1px solid rgba(181,138,16,.35)}
.fbk.bad{background:var(--err-soft);border:1px solid rgba(201,59,59,.35)}
.sol{margin-top:10px;padding:10px 12px;border-left:3px solid var(--a);background:var(--card2);border-radius:8px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.numin{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:12px;padding:12px 14px;font-size:20px;font-family:var(--mono)}
.pretag{display:inline-block;font-size:12.5px;color:var(--b-deep);background:var(--b-soft);border-radius:8px;padding:4px 10px;margin-bottom:10px;font-weight:650}
.pretag.redo{color:var(--a);background:var(--a-soft)}
.tl{border-bottom:1px dotted var(--a);color:inherit;cursor:pointer}
.tl:hover{color:var(--a)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.reveal{animation:rv .25s ease-out}
@keyframes rv{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.elab{margin-top:12px;padding:12px;border-radius:12px;background:var(--card2);border:1px dashed var(--line2)}
.elab b{display:block;margin-bottom:6px}
.conf{display:flex;gap:6px;align-items:center;margin:0 0 10px;font-size:13px;flex-wrap:wrap}
.meters{display:flex;gap:8px;margin:8px 0 12px}
.meter{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.meter .l{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.meter .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .bar{margin-top:5px}
.meter .bar i{background:var(--a)} .meter.m2 .bar i{background:var(--ok)} .meter.m3 .bar i{background:var(--b)}
.rank{font-family:var(--disp);font-size:56px;line-height:1;color:var(--b);text-align:center;margin:8px 0}
.lab{border:1px solid var(--a-line);background:linear-gradient(180deg,var(--card),var(--card2));border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.lab h3{margin-bottom:4px}
.fld{margin:10px 0}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.res .big{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.2;word-break:break-word}
.res .k{font-size:12.5px;color:var(--muted)}
.ab2{display:flex;gap:10px;margin-top:8px}
.ab2>div{flex:1;border-radius:10px;padding:10px;border:1px solid var(--line);min-width:0}
.ab2 .va{border-color:var(--a-line);background:var(--a-soft)} .ab2 .vb{border-color:var(--b-line);background:var(--b-soft)}
.ab2 b{font-family:var(--mono);font-size:20px;display:block}
.ab2 .k{font-size:12px;color:var(--muted);display:block}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
.kbd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kbd button{height:44px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:18px;font-family:var(--mono)}
.kbd button.op{background:var(--a-soft);color:var(--a)}
.kbd button.eq{background:var(--b);color:#fff;grid-column:span 2;font-weight:700}
.kbd button.fn{background:var(--gold-soft);color:var(--gold)}
.ovl{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(14,22,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fd .18s ease-out;-webkit-tap-highlight-color:transparent}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet{position:relative;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:var(--maxw);max-height:88vh;max-height:88dvh;overflow:hidden;box-shadow:0 -8px 30px rgba(20,28,38,.18);-webkit-transform:translateZ(0);transform:translateZ(0)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:99px;background:var(--line2)}
.sheet-tt{flex:1;min-width:0;padding-top:6px}
.sheet-t{font-family:var(--disp);font-size:19px;font-weight:600;line-height:1.25}
.sheet-x{flex:0 0 auto;width:36px;height:36px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;margin-top:4px}
.sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 16px;background:var(--card);overscroll-behavior:contain}
.sheet-f{flex:0 0 auto;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sheet.confirm{border-radius:20px;border-bottom:1px solid var(--line);margin:0 12px calc(12px + env(safe-area-inset-bottom));max-width:480px}
.sheet.confirm .sheet-b{padding:18px}
@media (min-width:700px){.ovl{align-items:center;padding:24px}.sheet{border-radius:20px;border-bottom:1px solid var(--line);max-height:80vh;max-height:80dvh;box-shadow:var(--shadow)}.sheet-h::before{display:none}.sheet-tt{padding-top:0}.sheet-x{margin-top:0}}
.sheet h3{margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:11px 16px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:92vw}
.xpf{position:fixed;z-index:70;font-family:var(--mono);font-weight:800;color:var(--b-deep);pointer-events:none;animation:xf .9s ease-out forwards}
@keyframes xf{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.nb-in{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:10px;padding:10px 12px;font-size:15px}
.cheat p{margin:4px 0;font-size:14.5px}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs .btn.ghost.on{border-color:var(--a);color:var(--a);background:var(--a-soft)}
.spark{display:flex;gap:3px;align-items:flex-end;height:46px}
.spark i{flex:1;background:var(--a);border-radius:3px 3px 0 0;min-height:2px;opacity:.75}
.spark i.t{background:var(--b);opacity:1}
.ref{margin-top:10px;padding:10px 12px;background:var(--card2);border-radius:10px;font-size:14px;line-height:1.55;white-space:pre-wrap}
details.refbox summary{cursor:pointer;color:var(--a);font-size:14px;margin-top:10px}
.lvtag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.lvtag.L0{color:#5b7a3a}.lvtag.L1{color:#2d8a7a}.lvtag.L2{color:var(--a)}.lvtag.L3{color:#6b4fd8}.lvtag.L4{color:var(--b-deep)}.lvtag.L5{color:#b02e6d}.lvtag.L6{color:var(--gold)}
@media (max-width:400px){.card{padding:14px}.stem{font-size:16px}.two{grid-template-columns:1fr}.chip.xp{display:none}}

/* ---- визуальные якоря и графические задачи ---- */
.anchor{margin:12px 0 2px;padding:10px 10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.anchor svg.glyph{width:100%;height:auto;display:block;font-family:var(--font)}
.anchor-cap{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px;font-family:var(--disp);font-style:italic}
.theory .anchor{margin-top:14px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.vcell{position:relative;display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 8px 6px;transition:border-color .12s,background .12s}

.vcell .vlbl{display:block;font-size:11px;color:var(--muted);text-align:center;margin-top:4px;min-height:14px}

.vcell.bad{border-color:var(--err);background:var(--err-soft)} .vcell.bad .key{border-color:var(--err);color:var(--err)}

.vwhy{margin-top:10px;display:flex;flex-direction:column;gap:6px}

.vwhy-row .key{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:750;font-family:var(--mono)}
.vwhy-row.ok{background:var(--ok-soft);color:var(--ink)} .vwhy-row.ok .key{border-color:var(--ok);color:var(--ok)}
.vwhy-row.bad{background:var(--err-soft)} .vwhy-row.bad .key{border-color:var(--err);color:var(--err)}
@media (max-width:360px){.vgrid{grid-template-columns:1fr}}

.nb-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.nb-row:last-child{border-bottom:0}

.nb-row .nb-acts{display:flex;gap:4px;flex:0 0 auto}
.nb-row.edit{display:block}
.sym{display:inline-block;font-family:var(--mono);font-size:.78em;font-weight:700;color:var(--a);background:var(--a-soft);border:1px solid var(--a-line);border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:middle;line-height:1.5}
.tt .sym,.rowbtn .sym{display:inline-block;width:auto;margin:0 0 0 6px}

/* слои «Сути» */
.ltabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.ltab{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650;padding:6px 10px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.ltab.on{background:var(--a-soft);color:var(--a);border-color:var(--a-line)}
.ltab.done{color:var(--ok)} .ltab.done.on{background:var(--ok-soft);border-color:transparent}
.ltab.lkd{opacity:.55} .ltab.optl span::after{content:" · по желанию";font-weight:500;font-size:11px}
.lbody p{margin:0 0 10px;white-space:normal;font-size:16px;line-height:1.6} .lbody p:last-child{margin-bottom:0}
.lbody p.sub,.theory p.sub{padding-left:14px;color:var(--muted)}
.theory p{white-space:normal;margin:0 0 10px} .theory p:last-of-type{margin-bottom:0}
ol.steps{margin:0 0 10px;padding-left:22px;font-size:16px;line-height:1.6} ol.steps li{margin:4px 0}
.formula{font-family:var(--mono);font-size:15.5px;font-weight:700;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;text-align:left;white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch;line-height:1.7}
.legend{width:100%;border-collapse:collapse;font-size:14px} .legend th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)} .legend td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top} .legend tr:last-child td{border-bottom:0} .legend td:first-child{white-space:nowrap} .legend td:last-child{min-width:90px}
.lcheck{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.lcheck .stem{font-size:15.5px;margin:4px 0 8px}
.rule{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--b);background:var(--b-soft);border-radius:0 10px 10px 0;font-size:15px}
.plain{font-size:15.5px;line-height:1.55;padding:10px 12px;background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:0 10px 10px 0;margin:8px 0}
.remember{font-family:var(--disp);font-style:italic;font-size:15px;color:var(--ink);padding:8px 12px;margin:8px 0 0;border-top:1px dashed var(--line2)}
.remember::before{content:'Запомни: ';font-style:normal;font-weight:700;color:var(--b-deep);font-family:var(--font);font-size:12.5px}
/* дневник по дням */
.todaycard{width:100%;text-align:left;display:block;cursor:pointer}
.todaycard:active{transform:scale(.995)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.tile b{display:block;font-family:var(--mono);font-size:20px;line-height:1.1;color:var(--ink)}
.tile span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.2}
.tile.hot b{color:var(--b-deep)}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
.cal{margin-top:14px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-wd span{font-size:11px;color:var(--faint);text-align:center;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-d.l1{background:var(--a-soft);color:var(--a)} .cal-d.l2{background:rgba(42,91,215,.28);color:var(--ink);border-color:transparent}
.cal-d.l3{background:rgba(42,91,215,.55);color:#fff;border-color:transparent} .cal-d.l4{background:var(--a);color:#fff;border-color:transparent;font-weight:700}
html[data-theme="dark"] .cal-d.l2{background:rgba(126,163,255,.3)} html[data-theme="dark"] .cal-d.l3{background:rgba(126,163,255,.6);color:#0f1620}
.cal-leg{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:11px;color:var(--faint);justify-content:flex-end}
.cal-leg i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line);background:var(--card2)}
.cal-leg i.l1{background:var(--a-soft)} .cal-leg i.l2{background:rgba(42,91,215,.28)} .cal-leg i.l3{background:rgba(42,91,215,.55)} .cal-leg i.l4{background:var(--a)}
.dayhead{display:flex;align-items:center;gap:12px}
.dayhead h3{margin:0;font-size:20px}
.daymood{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--card2);border:1px solid var(--line);flex:0 0 auto}
.daymood.gold{background:var(--gold-soft);border-color:var(--gold)} .daymood.b{background:var(--b-soft);border-color:var(--b-line)} .daymood.a{background:var(--a-soft);border-color:var(--a-line)} .daymood.ok{background:var(--ok-soft);border-color:transparent}
.achs{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.ach{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.ach .ic{font-size:20px;flex:0 0 auto;line-height:1.2}
.ach b{font-size:14.5px}
.mlegend{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2);display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.mlegend i.m1{background:var(--a)} .mlegend i.m2{background:var(--ok)} .mlegend i.m3{background:var(--b)}
.mlegend .faint{margin-top:4px}
.tline{margin-top:8px;font-variant-numeric:tabular-nums}
.tbars{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.tbar{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tbar i{display:block;height:8px;border-radius:4px;background:var(--a);min-width:3px}

.ach > div{flex:1;min-width:0}
.resume{border-color:var(--b-line);background:var(--b-soft)}
.resume .ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* дневник и лестницы */
.journal{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:10px}
.journal textarea{margin-top:8px;resize:vertical;min-height:64px;font-size:15px;line-height:1.45;background:var(--card)}
.stairs{margin:8px 0 12px;padding:12px;border:1px solid var(--b-line);border-radius:12px;background:var(--b-soft)}
.st-steps{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.st-steps .st{height:34px;border-radius:7px;border:1px solid var(--b-line);background:var(--card);font-family:var(--mono);font-size:11px;color:var(--muted);transition:transform .08s}
.st-steps .st.on{background:var(--b);color:#fff;border-color:transparent;font-weight:700}
.st-steps .st:active{transform:scale(.92)}
.tiles .tile.st b{color:var(--b-deep)}
.stchart .stbars{display:flex;gap:4px;align-items:flex-end;height:74px;margin-top:8px}
.stchart .stb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.stchart .stb i{display:block;width:100%;max-width:26px;background:var(--b);border-radius:4px 4px 0 0;opacity:.85}
.stchart .stb i.none{background:var(--line2)} .stchart .stb i.max{background:var(--gold)}
.stchart .stb.t i{opacity:1;box-shadow:0 0 0 2px var(--b-soft)}
.stchart .stb span{font-size:9px;color:var(--faint);margin-top:3px;line-height:1}
@media (min-width:700px){.tiles{grid-template-columns:repeat(5,1fr)}}

/* фото дня */
.photo{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.ph-view{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ph-view img{width:120px;height:120px;border-radius:12px;object-fit:cover;box-shadow:0 2px 8px rgba(20,28,38,.15)}
.ph-acts{display:flex;flex-direction:column;gap:6px}

/* момент дня: фото + голос + слова */
.moment{margin:12px 0 10px;padding:12px;border-radius:16px;background:linear-gradient(135deg,var(--a-soft),var(--b-soft));border:1px solid var(--line)}
.moment-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.moment-h b{font-family:var(--disp);font-size:17px}
.moment-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.moment-g{grid-template-columns:1fr}}
.voice{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.vplayer{display:flex;align-items:center;gap:10px;margin-top:10px}
.vplay,.vstop{width:42px;height:42px;border-radius:50%;border:none;background:var(--a);color:#fff;font-size:15px;flex:0 0 auto;box-shadow:0 2px 8px rgba(42,91,215,.3);transition:transform .1s}
.vplay:active,.vstop:active{transform:scale(.92)}
.vstop{background:var(--err);box-shadow:0 2px 8px rgba(201,59,59,.3)}
.vtrack{position:relative;flex:1;height:32px;display:flex;align-items:center;overflow:hidden;border-radius:8px}
.vbars{display:flex;align-items:center;gap:3px;width:100%;height:100%}
.vbars i{flex:1;background:var(--line2);border-radius:2px;display:block}
.vplayer.on .vbars i{background:var(--a-line)}
.vprog{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--a-soft);border-right:2px solid var(--a);transition:width .2s linear;pointer-events:none}
.vtime{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.vrec{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--err-soft);border:1px solid rgba(201,59,59,.25)}
.vdot{width:10px;height:10px;border-radius:50%;background:var(--err);flex:0 0 auto;animation:vpulse 1s ease-in-out infinite}
@keyframes vpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.vlevel{flex:1;display:flex;align-items:center;gap:3px;height:32px}
.vlevel i{flex:1;height:4px;background:var(--err);border-radius:2px;display:block;opacity:.8;transition:height .08s}
.vhint{margin-top:8px;line-height:1.4}

/* график: лестницы + минуты */
.ch-row{position:relative;margin-top:12px}
.ch-lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.ch-t{font-weight:700;font-size:13px}
.stchart .stbars{height:62px;align-items:flex-end;border-bottom:1px solid var(--line)}
.stchart .stbars.mins i{background:var(--a)} .stchart .stbars.mins i.max{background:var(--gold)} .stchart .stbars.mins i.none{background:var(--line2)}
.stchart .stbars.mins .stb.t i{box-shadow:0 0 0 2px var(--a-soft)}
.stchart .stb .ch-v{font-size:8px;color:var(--muted);margin:0 0 2px;line-height:1;order:-1;font-family:var(--mono)}
.stchart .stbars.lbls{height:auto;border:none;margin-top:4px}
.stchart .stbars.lbls span{font-size:9px;color:var(--faint)}
.stchart .stbars.lbls .stb.t span{color:var(--b-deep);font-weight:700}
.ch-axis{display:flex;justify-content:space-between;font-size:8px;color:var(--faint);font-family:var(--mono);margin-top:2px}
.ch-lab .ch-t{white-space:nowrap;margin-right:8px}.ch-lab .small{text-align:right}

/* календарь: фото + дата, минуты учёбы, лестницы */
.cal-d{position:relative;overflow:hidden;aspect-ratio:1/1.12;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:block;padding:0;font-family:var(--mono);color:var(--muted);transition:transform .12s ease;text-align:left}
.cal-d .n{position:absolute;left:4px;top:3px;font-size:9.5px;font-weight:600;line-height:1;color:var(--faint);z-index:1}

.cal-d .m{font-size:8px;color:var(--faint);font-family:var(--font);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.cal-d .mn{position:absolute;left:4px;bottom:4px;font-size:15px;font-weight:800;color:var(--a);line-height:1;z-index:1;letter-spacing:-.02em}
.cal-d .sd{position:absolute;right:4px;bottom:4px;font-size:15px;font-weight:800;color:var(--b-deep);line-height:1;z-index:1;letter-spacing:-.02em}
.cal-d.jr .tr::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);display:block}
.cal-d.hasvc .tr::before{content:"🎤";font-size:9px;line-height:1;display:block;font-family:var(--font)}
.cal-d.l2 .n,.cal-d.l3 .n,.cal-d.l4 .n{color:rgba(255,255,255,.8)} .cal-d.l3 .mn,.cal-d.l4 .mn{color:#eaf0ff} .cal-d.l3 .sd,.cal-d.l4 .sd{color:#ffe0c2} .cal-d.l3 .m,.cal-d.l4 .m{color:rgba(255,255,255,.75)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--b)}
.cal-d.sel{transform:scale(1.08);box-shadow:0 0 0 2px var(--b),0 4px 12px rgba(20,28,38,.15);z-index:2}
.cal-d.fut{opacity:.35}
.cal-d .ph{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cal-d.hasph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,rgba(10,16,24,.72),rgba(10,16,24,0));pointer-events:none}
.cal-d.hasph .n{background:rgba(20,28,38,.5);color:#fff;border-radius:999px;padding:2px 4px;left:3px;top:3px;backdrop-filter:blur(2px)}
.cal-d.hasph .m{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cal-d.hasph .mn{color:#cfe0ff;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2} .cal-d.hasph .sd{color:#ffd2a8;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2}
.cal-d.hasph.jr .tr::after{box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.cal-d.hasph.l1,.cal-d.hasph.l2,.cal-d.hasph.l3,.cal-d.hasph.l4{border-color:var(--a)}
.cal-leg.cal-lg{margin-top:4px;gap:10px;flex-wrap:wrap} .cal-lg span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap} .cal-lg i.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);border:none}
@media (max-width:420px){.cal-d .n{font-size:8.5px} .cal-d .mn,.cal-d .sd{font-size:11.5px;letter-spacing:-.04em} .cal-d .mn{left:3px} .cal-d .sd{right:3px}}

/* ручная правка минут */
.tile.tap{position:relative;cursor:pointer;border-style:dashed;font:inherit;color:inherit;text-align:center}
.tile.tap .edit{position:absolute;right:6px;top:4px;font-size:11px;font-style:normal;color:var(--faint)}
.tile.tap:active{transform:scale(.97)}
.tf-keys{display:flex;flex-wrap:wrap;gap:6px}
.tf-keys .tfk{padding:8px 12px;font-size:13px}
.tf-keys .tfk.on{background:var(--a);color:#fff;border-color:transparent}

/* импорт из Диктофона */
.steps{padding-left:18px;margin:8px 0;line-height:1.5} .steps li{margin:4px 0}
.vb-rows{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.vb-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.vb-name{flex:1;min-width:0;display:flex;flex-direction:column} .vb-name b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb-date{width:auto;flex:0 0 auto;padding:6px 8px;font-size:13px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

/* нотация */
.nota{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:8px 10px;border:1px dashed var(--line2);border-radius:10px;background:var(--card2)}

.nota-t th{text-align:left;font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line)}
.nota-t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.nota-t tr:nth-child(odd) td{background:var(--card2)}

/* шпаргалка-лист */
.cheat-sheet .card.cheat{margin:8px 0;padding:10px 12px;box-shadow:none}
.cheat-sheet .nota-t{min-width:520px}

/* свёрнутые листы */
.ovl.min{display:none}
#sheetdock{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px;z-index:49;pointer-events:none}
.dock-pill{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;max-width:46vw;padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink);box-shadow:0 6px 18px rgba(20,28,38,.18);font:inherit;font-size:14px;font-weight:600;animation:up .18s ease-out}
.dock-pill .dp-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-pill .dp-a{color:var(--a);font-size:11px}
.dock-pill:active{transform:scale(.97)}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.sheet-f{display:flex;gap:8px} .sheet-f .btn{flex:1}
.sheet-min{margin-right:6px}
html.has-sheet #sheetdock{display:none}

/* как найти величину */
.how{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.how li{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:baseline;font-size:13px;line-height:1.4}
.how .hf{font-family:var(--mono);font-size:12.5px;color:var(--ink);word-break:break-word}

<script>window.__DATA__={"META":{"version":"1.2.0","date":"23.10.2026"},"LEVELS":[{"id":"L0","rank":"База","title":"LLM под капотом — для того, кто ею управляет","sub":"Токены, контекст, недетерминизм, промпт как интерфейс, structured output","intro":"TPO не обучает модели, но обязан говорить с ML-инженерами на их языке и объяснять бизнесу, почему «ChatGPT в чате банка» — это не одна кнопка. Два юнита закрывают все слова, которые прозвучат на техническом собеседовании в первые десять минут: токен, контекст, температура, галлюцинация, function calling, structured output."},{"id":"L1","rank":"Архитектор","title":"Архитектура ИИ-агента в банке","sub":"Агентный цикл, инструменты и память, RAG, интеграция в контур банка","intro":"Здесь собирается «картинка на доске», которую попросят нарисовать на собеседовании: как запрос клиента проходит через guard, оркестратор, поиск по знаниям, инструменты и подтверждение — и почему каждая коробка стоит именно там. Три юнита: цикл агента и когда он не нужен, RAG и данные, интеграция в банковский контур с его ограничениями."},{"id":"L2","rank":"Контролёр качества","title":"Качество ИИ-продукта: evals, галлюцинации, безопасность","sub":"Как доказать, что агент работает, и как не дать ему навредить","intro":"Собеседующий обязательно спросит: «как вы поймёте, что новая версия лучше?» и «что будет, если клиент напишет “забудь инструкции”?». Два юнита дают язык и цифры: пирамида оценки (golden set → LLM-судья → онлайн-метрики) и защитный контур (prompt injection, PII, галлюцинации, эскалация)."},{"id":"L3","rank":"Инженер надёжности","title":"Производительность, надёжность, экономика","sub":"Латентность и p95, масштабирование, SLO, стоимость диалога, выбор модели","intro":"«Технические показатели: производительность, надёжность, масштабируемость» — строка из вакансии. Здесь она превращается в цифры, которые TPO называет сам: бюджет латентности по компонентам, SLO с error budget, GPU-ёмкость под пик, стоимость одного диалога и ROI. Два юнита, обе с калькуляторами в лаборатории."},{"id":"L4","rank":"Продуктолог","title":"Продукт: CJM, исследования, метрики ИИ-продукта","sub":"Где агент встраивается в путь клиента и по каким числам его судят","intro":"TPO отвечает не только за то, что агент работает, но и за то, что он нужен: в какой точке пути клиента он снимает боль, как это проверяется исследованием и какие метрики показывают эффект. Два юнита: CJM и исследования с учётом ИИ-специфики; дерево метрик от North Star до hallucination rate."},{"id":"L5","rank":"Руководитель поставки","title":"План, команда, релизы","sub":"Техническое видение и roadmap с оценками, команда и Agile, качество релизов","intro":"Половина обязанностей TPO — организационная: видение, план с ресурсами и сроками, команда, бэклог, релизы через цифровые каналы. Три юнита дают форматы, которые можно нарисовать на собеседовании за минуту: документ видения и ADR, roadmap с оценкой и рисками, состав команды и ритуалы, конвейер релиза агента."},{"id":"L6","rank":"Technical Product Owner","title":"Стейкхолдеры и стратегия","sub":"Управление ожиданиями заказчика и стратегия ИИ-продукта с трендами ГенИИ","intro":"Финальный уровень — то, что отличает TPO от технического лида: умение удержать ожидания заказчика в рамках возможного и выстроить стратегию продукта на 2–3 квартала с учётом того, как быстро меняется ГенИИ. Два юнита: скрипты и форматы для разговора с заказчиком; стратегия с OKR, build/buy/partner и принципами."},{"id":"L7","rank":"Harness-инженер","title":"Harness: DeepSeek Harness (dsh) — приоритет вакансии","sub":"Agent = Model + Harness · Cordis и «everything is a plugin» · цикл, лог, инструменты · внедрение в банке","intro":"Вакансия в первую очередь про harness — среду исполнения агента, в которой живут цикл, инструменты, лог сессии, песочница и политика. Приоритет — DeepSeek Harness (dsh, developer preview, MIT, август 2026). Четыре юнита: дисциплина harness engineering и ландшафт; архитектура dsh на Cordis; цикл хода, лог сессии и конвейер инструментов; внедрение и развитие dsh в банковском контуре. Задача — на собеседовании говорить о dsh как владелец: что заменяемо, где ворота, что уходит наружу по умолчанию и как это закрыть."}],"UNITS":[{"id":"u0-1","level":"L0","title":"Как LLM считает ответ: токены, контекст, недетерминизм","lead":"Что модель делает за 800 миллисекунд и почему это стоит денег","concept":"LLM — это функция «следующий токен по предыдущим». Токен — кусок текста примерно в 3–4 символа (для русского — чуть меньше, 1 слово ≈ 2–3 токена). Всё, что модель «знает» о вашем диалоге, лежит в контекстном окне: системный промпт, история, документы из поиска, ответ — и у окна есть лимит (8k, 32k, 128k токенов). Каждый входной токен стоит денег и времени на чтение, каждый выходной — ещё дороже и генерируется последовательно, ~20–100 токенов в секунду. Температура и top-p управляют случайностью выбора; при температуре 0 ответы всё равно могут отличаться (батчинг, обновление модели). Модель не ищет факты — она продолжает текст, поэтому уверенно выдумывает (галлюцинирует), если правды нет в контексте. Для TPO это даёт три рычага: что положить в контекст, сколько токенов разрешить, какую модель выбрать.","points":[{"h":"Токены — единица цены и времени","t":"Прайс модели всегда в токенах: отдельно за вход и за выход, выход в 3–5 раз дороже. Диалог в банке: системный промпт 1 500 токенов, история 3 000, найденные документы 4 000, ответ 300 — это 8 500 входных и 300 выходных токенов на один ход. Умножьте на 1 млн ходов в месяц — и вы получите бюджет, за который спросит CFO. Русский текст токенизируется хуже английского: та же фраза занимает на 30–60% больше токенов, поэтому бенчмарки стоимости «в долларах за миллион» надо пересчитывать под язык."},{"h":"Контекстное окно — рабочая память, а не база знаний","t":"Всё, чего нет в контексте, для модели не существует. Обученные веса дают «общие знания» на дату обучения (cutoff), но не ваш тариф, не остаток клиента, не вчерашнее изменение регламента. Отсюда правило: факты банка приходят в контекст через поиск (RAG) или инструменты, а не через «дообучить модель на документах». Окно ограничено: 32k токенов — это ~20 страниц; и чем ближе к лимиту, тем хуже модель удерживает начало («потеря в середине»). Контекст — бюджет, его распределяют: системный промпт, история, документы, резерв на ответ."},{"h":"Температура, top-p и недетерминизм","t":"Температура сглаживает распределение следующего токена: 0 — почти всегда самый вероятный, 1 — «как в обучении», выше — креатив и ошибки. Для банковского ассистента ставят 0–0,3. Но детерминизма нет даже при нуле: провайдер обновляет веса, батчинг меняет порядок вычислений, промпт меняется на один символ. Поэтому качество измеряют на выборке из сотен примеров, а не на «я проверил пять раз». И поэтому версии модели, промпта и температуры фиксируются в конфигурации, как версия библиотеки."},{"h":"Галлюцинация — свойство, а не баг","t":"Модель оптимизирована выдавать правдоподобный текст, а не правдивый. Если в контексте нет ответа, она его сочинит — с тем же уверенным тоном. Лекарства — архитектурные, не «попросить не врать»: давать факты в контекст с источниками, требовать цитировать, разрешать ответ «не знаю», проверять числа инструментами (калькулятор, API), ограничивать темы. В банке галлюцинация про комиссию — это жалоба в ЦБ, поэтому у каждого ответа с фактом должен быть источник, который можно показать."}],"practice":{"mechanic":"keymoves","points":3,"stem":"Заказчик спрашивает, почему нельзя «загрузить все регламенты в модель, чтобы она их знала». Собери ответ TPO.","options":[{"id":"k0","text":"Регламенты меняются еженедельно — дообучение стоит дней, поиск обновляется за минуты","correct":true,"why":"Главный аргумент: скорость обновления знаний."},{"id":"k1","text":"Модель продолжает текст, а не ищет; факт нужен в контексте с источником, чтобы ответ можно было проверить","correct":true,"why":"Механизм галлюцинаций объяснён на уровне заказчика."},{"id":"k2","text":"Контекст ограничен, поэтому в него кладут найденные фрагменты, а не весь корпус","correct":true,"why":"Отсюда RAG и чанкинг."},{"id":"k3","text":"Предложить пилот: 50 реальных вопросов, сравнить ответы с RAG и без","correct":true,"why":"Демонстрация вместо спора."},{"id":"f4","text":"Согласиться и запланировать дообучение модели на 5 000 страницах регламентов в этом квартале с ежемесячным обновлением","correct":false,"why":"Дообучение не даёт актуальности и не защищает от галлюцинаций."},{"id":"f5","text":"Сказать, что модель уже знает банковские продукты из интернета и дополнительные данные ей не нужны","correct":false,"why":"Знания модели кончаются на дате обучения и не включают внутренние документы."},{"id":"f6","text":"Увеличить контекст до максимума и класть туда все регламенты целиком на каждый запрос, чтобы ничего не терялось","correct":false,"why":"Дорого, медленно, и качество падает ближе к лимиту окна."},{"id":"f7","text":"Поднять температуру, чтобы модель «вспоминала» больше фактов из предобучения и отвечала полнее","correct":false,"why":"Температура не добавляет знаний, она добавляет случайность."}],"reference":"Факты — в контекст через поиск с источником; веса — для языка и рассуждения; дообучение — для стиля и формата, не для фактов.","anchor":{"g":"ctx","p":{"total":32000,"parts":[["system",1500],["история",3000],["документы",4000],["ответ",300]]},"cap":"контекст — бюджет, а не база знаний"},"id":"u0-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Ход диалога: 8 500 входных токенов и 300 выходных. Цена: 0,3 ₽ за 1 000 входных и 1,2 ₽ за 1 000 выходных. Сколько стоит один ход?","options":[{"id":"o0","text":"Около 2,9 ₽: 8,5 × 0,3 + 0,3 × 1,2","correct":true,"rationale":"2,55 + 0,36 = 2,91 ₽; вход «весит» больше по объёму, выход — по цене."},{"id":"o1","text":"Около 0,4 ₽: платим только за выходные токены, вход бесплатен","correct":false,"rationale":"Вход оплачивается всегда — его модель читает."},{"id":"o2","text":"Около 10 ₽: 8 800 токенов по 1,2 ₽ за тысячу","correct":false,"rationale":"Разные тарифы на вход и выход; так считать нельзя."},{"id":"o3","text":"Около 1,2 ₽: один ответ — одна тысяча токенов по цене выхода","correct":false,"rationale":"Ответ — 300 токенов, а вход в 28 раз больше."}],"anchor":{"g":"cost","p":{"lines":[["8 500 вх × 0,3 ₽/1k","2,55 ₽"],["300 вых × 1,2 ₽/1k","0,36 ₽"]],"total":"2,91 ₽ за ход"},"cap":"вход — объём, выход — цена"},"id":"u0-1-t0"},{"mechanic":"single","points":2,"stem":"Ассистент при температуре 0 на один и тот же вопрос в двух прогонах дал разные ответы. Инженер говорит: «так не бывает». Что верно?","options":[{"id":"o0","text":"Бывает: батчинг, обновление весов и правки промпта ломают детерминизм — качество меряют на выборке","correct":true,"rationale":"Поэтому eval строится на сотнях примеров, а не на повторах одного."},{"id":"o1","text":"Не бывает: температура 0 гарантирует одинаковый вывод на любом железе и в любой версии модели, это документированное свойство","correct":false,"rationale":"Гарантии нет; это распространённое заблуждение."},{"id":"o2","text":"Бывает только у маленьких моделей из-за округлений; у больших моделей ответы при температуре 0 всегда стабильны","correct":false,"rationale":"Размер модели не связан с детерминизмом вычислений."},{"id":"o3","text":"Это ошибка логирования или сравнения строк: при температуре 0 ответы на самом деле были одинаковыми","correct":false,"rationale":"Расхождение реальное и ожидаемое."}],"anchor":{"g":"wording","p":{"bad":"проверил пять раз — работает","good":"на 300 примерах точность 92% ± 3"},"cap":"недетерминизм лечится выборкой"},"id":"u0-1-t1"},{"mechanic":"single","points":2,"stem":"В контекст 32k токенов команда кладёт 10 найденных документов по 3 000 токенов каждый «для полноты». Главный риск?","options":[{"id":"o0","text":"Окно переполнено, история и ответ вытесняются, качество падает из-за «потери в середине»","correct":true,"rationale":"30k на документы — не остаётся места; и модель хуже читает середину длинного контекста."},{"id":"o1","text":"Модель откажется отвечать из-за слишком большого объёма входа и вернёт ошибку, которую увидит клиент","correct":false,"rationale":"Она не откажется — она тихо обрежет или ошибётся."},{"id":"o2","text":"Повысится эффективная температура, и ответы станут случайнее","correct":false,"rationale":"Температура не зависит от длины контекста."},{"id":"o3","text":"Рисков нет: чем больше документов в контексте, тем точнее и полнее ответ","correct":false,"rationale":"После 3–5 релевантных фрагментов точность не растёт, а шум растёт."}],"anchor":{"g":"ctx","p":{"total":32000,"parts":[["system",1500],["история",500],["документы",30000],["ответ",0]]},"cap":"документы вытеснили всё остальное"},"id":"u0-1-t2"},{"mechanic":"single","points":2,"stem":"Клиент спросил о комиссии за перевод, которой нет ни в одном документе в контексте. Что должен сделать правильно спроектированный ассистент?","options":[{"id":"o0","text":"Сказать, что не нашёл информацию, и предложить проверенный путь: тарифы или оператора","correct":true,"rationale":"Abstain — штатный ответ, а не провал; галлюцинация про комиссию — жалоба в ЦБ."},{"id":"o1","text":"Дать наиболее вероятное значение из общих знаний модели о банках, пометив его как ориентировочное для клиента","correct":false,"rationale":"Это и есть галлюцинация с уверенным тоном."},{"id":"o2","text":"Переформулировать вопрос и ответить на похожий, где данные в базе есть","correct":false,"rationale":"Подмена вопроса — тоже обман клиента."},{"id":"o3","text":"Повторить поиск с температурой 1 и большим top-k, чтобы модель «вспомнила» больше и нашла нужное","correct":false,"rationale":"Температура не добавляет фактов."}],"anchor":{"g":"guard","p":{"in":false,"out":true,"tools":false,"note":"нет источника → «не знаю» + маршрут"},"cap":"галлюцинация лечится архитектурой, не просьбой"},"id":"u0-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре распределения бюджета контекста 32k для банковского ассистента с RAG. Какое — здоровое?","vopts":[{"id":"v0","v":{"g":"ctxv","p":{"parts":[1500,4000,8000,1500],"total":32000}},"lbl":"","correct":true,"rationale":"Системный промпт, история, 3–4 фрагмента, резерв на ответ и запас — есть место для манёвра."},{"id":"v1","v":{"g":"ctxv","p":{"parts":[1500,500,29000,500],"total":32000}},"lbl":"","correct":false,"rationale":"Документы съели всё: истории нет, на ответ 500 токенов."},{"id":"v2","v":{"g":"ctxv","p":{"parts":[12000,10000,500,500],"total":32000}},"lbl":"","correct":false,"rationale":"Системный промпт 12k — это регламент целиком в промпте; история огромная, фактов почти нет."},{"id":"v3","v":{"g":"ctxv","p":{"parts":[200,0,0,300],"total":32000}},"lbl":"","correct":false,"rationale":"Пустой контекст: нет ни инструкций, ни документов — модель будет сочинять."}],"id":"u0-1-t4"}],"framework":"LLM продолжает текст по токенам. Контекст — бюджет (промпт, история, документы, ответ), не база знаний. Детерминизма нет — качество меряют выборкой. Галлюцинация — свойство: факты с источником кладут в контекст, разрешают «не знаю».","anchor":{"g":"ctx","p":{"total":32000,"parts":[["system",1500],["история",3000],["документы",4000],["ответ",300]]},"cap":"токены — цена и время; контекст — бюджет"},"layers":{"simple":"Представь очень начитанного стажёра с амнезией. Он прочитал всё, что было в интернете до прошлого года, но каждый разговор начинает с чистого листа: помнит только то, что лежит перед ним на столе. Стол — это контекстное окно, и он небольшой: примерно двадцать страниц.\nСтажёр не ищет ответ — он продолжает текст так, как «обычно продолжают». Если на столе нет документа с комиссией, он всё равно уверенно назовёт цифру: ему важно, чтобы звучало правдоподобно. Это галлюцинация, и она не лечится просьбой «не выдумывай».\nЗа каждое слово, которое стажёр читает и пишет, банк платит. Читать дешевле, писать дороже и медленнее.\nПроверь себя: почему нельзя «загрузить регламенты в модель», чтобы она их знала?","how":"1. Токен — единица текста в 3–4 символа; русское слово ≈ 2–3 токена. Цена и время считаются в токенах, вход и выход — по разным тарифам.\n2. Контекстное окно: всё, что модель «видит» за один вызов. В него входят системный промпт (роль, правила), история диалога, документы из поиска, вызовы инструментов и резерв на ответ. Лимит 8k–128k.\n3. Генерация: модель выбирает следующий токен из распределения. Температура 0–0,3 — предсказуемо, 0,7+ — разнообразно. Выход идёт последовательно, 20–100 токенов/с, поэтому длинный ответ = долгий ответ.\n4. Знания: в весах — общие, на дату обучения. Факты банка — только через контекст: поиск по документам (RAG) или инструменты (API остатка, тарифов).\n5. Пример. Ход диалога: промпт 1 500 + история 3 000 + 3 документа по 1 300 + ответ 300. Вход 8 400 токенов × 0,3 ₽/1k = 2,5 ₽, выход 300 × 1,2 ₽/1k = 0,36 ₽. Итого ≈ 2,9 ₽ за ход, при 1 млн ходов в месяц — 2,9 млн ₽.","formula":{"f":"₽/ход = T_вх · c_вх + T_вых · c_вых\nT_вх = промпт + история + документы + инструменты","legend":[["T_вх","входные токены за один вызов","8 400"],["c_вх","цена за 1 000 входных","0,3 ₽"],["T_вых","выходные токены (ответ)","300"],["c_вых","цена за 1 000 выходных","1,2 ₽"],["₽/ход","стоимость одного хода диалога","≈ 2,9 ₽"]],"note":"Русский текст на 30–60% «дороже» английского в токенах — бенчмарки в $/M переводятся под язык."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Токен — единица цены и времени; вход и выход — разные тарифы.\n— Контекст — бюджет: промпт + история + документы + резерв на ответ; не база знаний.\n— Детерминизма нет: фиксируй версии модели и промпта, меряй на выборке.\n— Галлюцинация лечится архитектурой: источник в контексте, цитирование, «не знаю», проверка чисел инструментом.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Почему нельзя «загрузить регламенты в модель», чтобы она их знала?","o":["Модель продолжает текст, а не ищет: факт должен быть в контексте с источником","Регламенты слишком объёмны для дообучения, но короткие документы на 20–30 страниц загрузить в веса можно без потери качества","Можно, и крупные банки так делают: дообучение на корпусе регламентов дорого, но при достаточном бюджете окупается точностью"],"a":0,"w":"Знания в весах устаревают и не проверяемы. Факты банка приходят в контекст через поиск или API."},{"q":"Ход диалога: 8 400 входных и 300 выходных токенов, 0,3 и 1,2 ₽ за тысячу. Сколько стоит ход?","o":["≈ 0,36 ₽: платим за ответ","≈ 2,9 ₽: 2,5 за вход + 0,36 за выход","≈ 10 ₽: все токены по дорогому тарифу"],"a":1,"w":"Вход — объём, выход — цена. Оба слагаемых считаются."},{"q":"В формуле ₽/ход что обычно самое большое слагаемое по токенам?","o":["Ответ: он самый дорогой за токен","Вход: промпт, история и документы — тысячи токенов","Инструменты: каждый вызов API стоит токенов больше всего"],"a":1,"w":"Выход дороже за токен, но вход в 10–30 раз больше по объёму — и обычно даёт основную сумму."},{"q":"При температуре 0 модель дала разные ответы на один вопрос. Что это значит?","o":["Инфраструктура инференса сломана","Норма: детерминизма нет, качество меряют на выборке","Промпт слишком длинный, и модель теряет инструкции в середине; после сокращения ответы станут стабильными"],"a":1,"w":"Батчинг, обновления весов, микроизменения промпта — ответы плавают. Отсюда eval на выборке."}],"rules":["Токен — единица цены и времени; вход и выход — разные тарифы.","Контекст — бюджет: промпт + история + документы + резерв на ответ; не база знаний.","Детерминизма нет: фиксируй версии модели и промпта, меряй на выборке.","Галлюцинация лечится архитектурой: источник в контексте, цитирование, «не знаю», проверка чисел инструментом."]}},{"id":"u0-2","level":"L0","title":"Промпт как интерфейс: system prompt, structured output, function calling","lead":"Промпт — это спецификация, а не просьба","concept":"Системный промпт — это требования к продукту, записанные для модели: роль, тон, границы тем, формат ответа, правила эскалации. Его пишут как спецификацию и версионируют как код. Few-shot (2–5 примеров) учит формату лучше, чем абзац описания. Structured output — ответ строго по JSON-схеме: {intent, answer, sources[], confidence, needs_human} — именно он позволяет приложению обрабатывать ответ программно, а не парсить текст. Function calling (tool use) — модель не выполняет действие сама, а возвращает структурированный запрос «вызови get_balance(account_id)», а код вызывает API и возвращает результат в контекст. Это основа агента: модель решает, что сделать; система решает, можно ли и как. Для TPO промпт и схемы — артефакты, которые проходят ревью, тесты (eval) и релиз, а не «текст в настройках».","points":[{"h":"Системный промпт — спецификация поведения","t":"Структура, которая работает: (1) роль и аудитория; (2) что можно и что нельзя — список тем, запрет советов по инвестициям, если нет лицензии; (3) порядок действий — сначала искать в документах, цифры брать из инструментов; (4) формат ответа; (5) правила эскалации — когда предложить оператора; (6) примеры. Каждое правило — проверяемое: под него есть тест-кейс в eval-наборе. Промпт на 2 000 токенов, написанный продуктом и ML-инженером вместе, — нормальный размер; промпт на 15 000 — признак, что в него тащат базу знаний."},{"h":"Structured output: ответ как контракт","t":"Если приложение показывает «источники» и кнопку «позвать оператора», модель должна вернуть их как поля, а не как фразы. JSON-схема: answer (текст), sources (список id документов), confidence (low/medium/high), action (none/escalate/execute_tool), tool_args. Режим JSON-mode или constrained decoding гарантирует валидность синтаксиса; смысл проверяется валидатором: источник существует? action допустим для этого канала? Так галлюцинация ссылки на документ ловится до показа клиенту."},{"h":"Function calling: модель предлагает, система исполняет","t":"Описание инструментов — часть промпта: имя, назначение, параметры с типами, когда НЕ использовать. Модель возвращает вызов; оркестратор проверяет права (клиент авторизован? операция разрешена в этом канале?), выполняет и кладёт результат в контекст; модель формулирует ответ. Чтение (баланс, тарифы, статус заявки) можно автоматизировать полностью; запись (перевод, закрытие вклада) — только с подтверждением человека и идемпотентным ключом. Чем точнее описание инструмента, тем реже модель выбирает не тот — это тоже тестируется."},{"h":"Промпт — артефакт с жизненным циклом","t":"Промпт лежит в репозитории, имеет версию, владельца и changelog. Изменение проходит ревью (продукт + ML + комплаенс для правил эскалации), прогон eval-набора (точность не упала, отказов не прибавилось), а затем релиз через feature flag с откатом. Самая дорогая ошибка — «быстро поправить промпт в проде»: одна фраза меняет поведение на 100% диалогов. TPO отвечает за этот процесс так же, как за процесс релиза кода."}],"practice":{"mechanic":"matching","points":3,"stem":"Соедини элемент промпт-архитектуры с его ролью.","pairs":[{"l":"Системный промпт","r":"Роль, границы тем, порядок действий, правила эскалации"},{"l":"Few-shot примеры","r":"Показать формат и тон на 2–5 образцах вместо абзаца описания"},{"l":"JSON-схема ответа","r":"Поля answer / sources / confidence / action для программной обработки"},{"l":"Описание инструмента","r":"Имя, параметры с типами, когда использовать и когда нет"},{"l":"Валидатор ответа","r":"Проверить, что источник существует и action допустим в канале"}],"solution":"Промпт задаёт поведение, примеры — формат, схема — контракт с приложением, описание инструментов — что модель может попросить, валидатор — последняя проверка перед клиентом.","anchor":{"g":"pipeline","p":{"steps":["System prompt","Few-shot","JSON-схема","Tools","Валидатор"],"hl":[2,4]},"cap":"промпт — спецификация, схема — контракт"},"id":"u0-2-p"},"test":[{"mechanic":"single","points":2,"stem":"Приложение показывает клиенту кнопку «Источник» под ответом. Как ассистент должен передавать источник?","options":[{"id":"o0","text":"Полем sources[] в JSON-ответе с id документов, сверяемых с индексом","correct":true,"rationale":"Структура вместо текста: источник проверяем до показа."},{"id":"o1","text":"Фразой «по данным документа…» внутри текста ответа","correct":false,"rationale":"Парсинг текста ненадёжен, а выдуманная ссылка не ловится."},{"id":"o2","text":"Ссылкой на общий раздел сайта с тарифами, чтобы кнопка всегда вела на актуальную страницу и не ломалась","correct":false,"rationale":"Ссылка «куда-то» не подтверждает факт."},{"id":"o3","text":"Никак: источник показывать не нужно, уверенный ответ без ссылок клиенты оценивают выше","correct":false,"rationale":"В банке факт без источника — риск жалобы."}],"anchor":{"g":"formula","p":{"f":"{answer, sources[], confidence, action}","sub":"валидатор: источник существует? action допустим?","fs":13},"cap":"структурированный ответ — контракт с приложением"},"id":"u0-2-t0"},{"mechanic":"single","points":2,"stem":"Что происходит, когда модель «вызывает» инструмент transfer_money?","options":[{"id":"o0","text":"Модель возвращает структурированный вызов; оркестратор проверяет права и подтверждение, потом вызывает API","correct":true,"rationale":"Модель предлагает, система решает и исполняет."},{"id":"o1","text":"Модель напрямую обращается к API банка по описанию инструмента и сама обрабатывает ответ, оркестратор только логирует","correct":false,"rationale":"У модели нет сетевого доступа; исполняет код."},{"id":"o2","text":"Перевод выполняется сразу после распознавания намерения, а клиент получает уведомление и может отменить его постфактум","correct":false,"rationale":"Запись денег без подтверждения — недопустимо."},{"id":"o3","text":"Модель генерирует SQL-запрос по схеме базы, который исполняет СУБД банка под служебной учётной записью агента","correct":false,"rationale":"Прямой SQL от модели — дыра в безопасности."}],"anchor":{"g":"loop","p":{"tools":["get_balance","transfer_money ✋"],"hitl":true},"cap":"чтение — автоматом, запись — с подтверждением"},"id":"u0-2-t1"},{"mechanic":"single","points":2,"stem":"Продакт просит «быстро поправить одну фразу в промпте прямо в проде, это же не код». Ответ TPO?","options":[{"id":"o0","text":"Промпт меняет 100% диалогов: ревью, прогон eval-набора и релиз под флагом с откатом — за час, по процессу","correct":true,"rationale":"Скорость сохраняется, риск регресса снимается."},{"id":"o1","text":"Согласиться и выкатить сразу: текстовая правка в одном предложении безопасна","correct":false,"rationale":"Откат после того, как 10 000 клиентов получили неверный ответ, не отменяет ущерб."},{"id":"o2","text":"Отказать: системный промпт меняется только раз в квартал по утверждённому плану, срочные правки — через заказчика","correct":false,"rationale":"Жёсткость без причины; процесс должен быть быстрым."},{"id":"o3","text":"Поменять фразу только в тестовом контуре и оставить так на месяц, чтобы накопить статистику перед решением","correct":false,"rationale":"Нужна проверка, а не бесконечная отсрочка."}],"anchor":{"g":"release","p":{"hl":0},"cap":"промпт — релиз, а не настройка"},"id":"u0-2-t2"},{"mechanic":"single","points":2,"stem":"Для чего в промпте нужны few-shot примеры?","options":[{"id":"o0","text":"Показать формат и тон на образцах — они задают структуру ответа точнее описания","correct":true,"rationale":"Пример учит формату лучше, чем абзац правил."},{"id":"o1","text":"Добавить модели знаний о тарифах и продуктах банка через примеры ответов вместо поиска по документам","correct":false,"rationale":"Факты через примеры — тот же путь к галлюцинациям."},{"id":"o2","text":"Уменьшить число входных токенов и ускорить ответ, потому что примеры короче текстовых правил","correct":false,"rationale":"Примеры удлиняют промпт, а не сокращают."},{"id":"o3","text":"Заменить eval-набор: если примеры уже есть в промпте, отдельно тестировать поведение не нужно","correct":false,"rationale":"Примеры — часть промпта, который сам требует eval."}],"anchor":{"g":"pipeline","p":{"steps":["Роль","Правила","Порядок","Формат","Примеры"],"hl":[3,4]},"cap":"примеры — формат; правила — границы"},"id":"u0-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре схемы обработки запроса «переведи 10 000 ₽ маме». Какая спроектирована правильно?","vopts":[{"id":"v0","v":{"g":"pipe","p":{"steps":["LLM","права","✋ клиент","API"],"hl":[1,2]}},"lbl":"","correct":true,"rationale":"Модель предлагает вызов, система проверяет права и берёт подтверждение, потом API."},{"id":"v1","v":{"g":"pipe","p":{"steps":["LLM","API","уведомление"],"hl":[1]}},"lbl":"","correct":false,"rationale":"Запись денег сразу после модели, без проверки и подтверждения."},{"id":"v2","v":{"g":"pipe","p":{"steps":["LLM","SQL","база"],"hl":[1]}},"lbl":"","correct":false,"rationale":"Модель пишет SQL в базу — дыра безопасности."},{"id":"v3","v":{"g":"pipe","p":{"steps":["LLM","ответ клиенту"],"hl":[]}},"lbl":"","correct":false,"rationale":"Модель «описала» перевод текстом — ни действия, ни отказа: обман."}],"id":"u0-2-t4"}],"framework":"Системный промпт — спецификация с проверяемыми правилами. Structured output — контракт с приложением, валидатор ловит выдуманные источники. Function calling: модель предлагает, система проверяет и исполняет; запись — с подтверждением. Промпт — артефакт с версией, ревью, eval и релизом.","anchor":{"g":"pipeline","p":{"steps":["System prompt","Few-shot","JSON-схема","Tools","Валидатор"],"hl":[0,2,3]},"cap":"промпт — спецификация, схема — контракт, инструмент — предложение"},"layers":{"simple":"Промпт — это должностная инструкция для стажёра: кто он, с кем говорит, что можно, что нельзя, когда звать старшего. Хорошая инструкция — короткая и проверяемая: под каждое правило можно придумать ситуацию и посмотреть, выполнил ли он.\nСтажёр отвечает не свободным текстом, а заполняет бланк: ответ, откуда взял, насколько уверен, нужен ли оператор. Бланк проверяет контролёр до того, как лист уходит клиенту.\nЕсли нужно что-то сделать — узнать остаток, перевести деньги — стажёр не идёт в кассу сам. Он пишет служебную записку «вызови функцию перевода с такими параметрами», а система решает, можно ли, и просит у клиента подтверждение.\nПроверь себя: почему правку промпта «в проде за минуту» нельзя делать без прогона тестов?","how":"1. Системный промпт: роль → границы тем → порядок действий (сначала документы, цифры из инструментов) → формат → правила эскалации → примеры. Под каждое правило — тест-кейс.\n2. Few-shot: 2–5 примеров «вопрос → идеальный ответ» задают формат и тон; факты через примеры не передают.\n3. Structured output: модель возвращает JSON по схеме — answer, sources[], confidence, action, tool_args. JSON-mode гарантирует синтаксис, валидатор — смысл (источник существует, action допустим в канале).\n4. Function calling: в промпте описаны инструменты (имя, параметры, когда не применять). Модель возвращает вызов → оркестратор проверяет права → вызывает API → результат в контекст → модель формулирует ответ. Чтение автоматом, запись — с подтверждением и идемпотентным ключом.\n5. Жизненный цикл: промпт в репозитории с версией и владельцем; изменение = ревью + eval + релиз под флагом + откат. Пример: правка правила эскалации прошла eval (отказов +0,2 п.п., точность без изменений) и выкатилась на 10% за час, на 100% — на следующий день.","formula":{"f":"ответ = LLM(system + few-shot + история + документы + tools)\n→ JSON{answer, sources[], confidence, action} → валидатор → клиент","legend":[["system","роль, границы, порядок, формат, эскалация","≈ 1 500–2 500 токенов"],["few-shot","2–5 примеров формата","≈ 600 токенов"],["tools","описания инструментов: имя, параметры, когда не использовать","get_balance, get_tariff, transfer ✋"],["JSON","схема ответа — контракт с приложением","sources проверяются по индексу"],["валидатор","последняя проверка перед клиентом","источник есть? action допустим?"]],"note":"Промпт — код: версия, ревью, eval, релиз под флагом. «Поправить в проде» = изменить поведение на 100% диалогов без проверки."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Системный промпт — спецификация: под каждое правило есть тест-кейс.\n— Few-shot задаёт формат, не факты.\n— Structured output + валидатор: источник проверяем до показа клиенту.\n— Function calling: модель предлагает, оркестратор проверяет права и исполняет; запись — с подтверждением.\n— Промпт — артефакт: версия, ревью, eval, флаг, откат.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается.","checks":[{"q":"Почему правку промпта «в проде за минуту» нельзя делать без прогона тестов?","o":["Промпт меняет 100% диалогов, регресс виден только на eval-выборке","Регламент изменений разрешает править системный промпт не чаще раза в неделю и только через заявку в JIRA","Можно: текстовая правка безопасна, если её сделал продакт, проверил на пяти диалогах и записал в журнал изменений"],"a":0,"w":"Одна фраза — другое поведение везде. Eval за 10 минут снимает риск; флаг даёт откат."},{"q":"Приложение показывает кнопку «Источник». Как ассистент передаёт источник?","o":["Полем sources[] в JSON с id документов, которые проверяет валидатор","Фразой внутри текста вида «по данным документа …», которую приложение распознаёт по шаблону и превращает в кнопку","Ссылкой на раздел сайта банка с тарифами: источник всегда есть"],"a":0,"w":"Структура вместо парсинга текста; выдуманный id не пройдёт валидатор."},{"q":"В формуле ответа что делает валидатор?","o":["Переписывает ответ модели в фирменном тоне и исправляет стилистику перед показом клиенту","Проверяет смысл: источник существует, action допустим в канале","Считает токены входа и выхода, стоимость хода и записывает их в дашборд экономики"],"a":1,"w":"JSON-mode даёт синтаксис, валидатор — смысл. Это последняя линия перед клиентом."},{"q":"Что делает модель при function calling?","o":["Сама вызывает API банка по описанию инструмента и обрабатывает ответ, оркестратор только пишет лог","Возвращает структурированный запрос; исполняет оркестратор после проверки прав","Генерирует SQL-запрос по схеме базы, который исполняется в СУБД под служебной учётной записью"],"a":1,"w":"Модель предлагает, система решает и исполняет. Запись — только с подтверждением."}],"rules":["Системный промпт — спецификация: под каждое правило есть тест-кейс.","Few-shot задаёт формат, не факты.","Structured output + валидатор: источник проверяем до показа клиенту.","Function calling: модель предлагает, оркестратор проверяет права и исполняет; запись — с подтверждением.","Промпт — артефакт: версия, ревью, eval, флаг, откат."]}},{"id":"u1-1","level":"L1","title":"Агентный цикл: план → действие → наблюдение, и когда агент не нужен","lead":"Workflow, агент, мультиагент — три уровня свободы и три уровня риска","concept":"Агент — это LLM в цикле: получает цель, планирует шаг, вызывает инструмент, смотрит на результат, решает следующий шаг — пока цель не достигнута или не исчерпан лимит шагов. Отличие от workflow: в workflow порядок шагов задан кодом, модель лишь заполняет узлы (классифицировать, извлечь, сформулировать); в агенте порядок выбирает модель. Свобода даёт гибкость на длинном хвосте запросов и отнимает предсказуемость: агент может зациклиться, выбрать не тот инструмент, выполнить лишнее действие. Правило зрелых команд: начинать с workflow, давать агентность там, где сценариев слишком много для кода, и всегда ограничивать: максимум шагов, allow-list инструментов, бюджет токенов, чекпоинты с подтверждением. Мультиагент (оркестратор + специалисты) оправдан, когда задачи разнородны и один промпт перестаёт помещать все правила, — цена: латентность и отладка взаимодействий.","points":[{"h":"Анатомия цикла","t":"Состояние агента: цель, история шагов, результаты инструментов, оставшийся бюджет. Шаг: модель получает состояние и описания инструментов → возвращает либо вызов инструмента, либо финальный ответ. Оркестратор: исполняет вызов, обновляет состояние, проверяет стоп-условия (цель достигнута, шагов ≥ N, ошибка инструмента ≥ k раз, нужен человек). Память: краткосрочная — контекст текущего диалога; долгосрочная — профиль клиента и прошлые обращения, подтягиваются по запросу, а не целиком. Логируется каждый шаг: без трассы агент не отлаживается."},{"h":"Workflow или агент: критерий выбора","t":"Задайте три вопроса. Сколько различных путей решения? Если 5–10 — workflow с ветвлениями дешевле и надёжнее. Насколько дорога ошибка действия? Если действие необратимо (деньги, закрытие продукта) — агентность только до точки подтверждения. Нужно ли объяснять регулятору, почему система сделала так? Детерминированный workflow объясняется документом, агент — трассой. Типовой банк: FAQ и статусы — workflow с RAG; разбор спора по операции — агент с инструментами чтения и эскалацией; перевод — workflow с жёсткими проверками."},{"h":"Ограничители свободы","t":"Max steps (обычно 5–10) и max tokens на задачу; allow-list инструментов для конкретного сценария и канала; тайм-ауты на инструмент; детектор зацикливания (повтор одного вызова с теми же аргументами); чекпоинты «подтверди» перед записью; fallback на оператора при неуверенности или исчерпании бюджета. Каждый ограничитель — это тест-кейс в eval: «агент не должен вызвать transfer без подтверждения ни в одном из 200 сценариев»."},{"h":"Мультиагентность: когда и как","t":"Оркестратор-маршрутизатор определяет намерение и передаёт специализированному агенту (карты, кредиты, инвестиции) со своим промптом, инструментами и базой знаний. Плюсы: промпты короче и точнее, команды владеют своими агентами независимо, eval по доменам. Минусы: латентность (два-три вызова вместо одного), передача контекста между агентами, сложность отладки. Правило: не больше агентов, чем доменов с собственным владельцем; «агент для каждого шага» — антипаттерн."}],"practice":{"mechanic":"sjt_bw","points":3,"stem":"Команда предлагает сделать «полноценного агента», который сам решает, какие из 20 инструментов вызывать, включая перевод и закрытие вклада. Пилот — на реальных клиентах. Лучшее и худшее действие TPO?","options":[{"id":"s0","text":"Разделить: чтение — агенту с лимитом шагов и allow-list, запись — workflow с подтверждением; пилот на сотрудниках","correct":true,"rationale":"Агентность там, где она нужна; необратимое — под жёсткий контроль."},{"id":"s1","text":"Запретить агентов вообще: в банке допустимы только детерминированные сценарии, а длинный хвост закрывает оператор","correct":false,"rationale":"Крайность: длинный хвост вопросов агент закрывает лучше кода."},{"id":"s2","text":"Согласиться на пилот на клиентах: лимит в 50 шагов, подробное логирование и ежедневный разбор инцидентов достаточны","correct":false,"rationale":"50 шагов и логи не защищают от лишнего перевода."},{"id":"s3","text":"Добавить ещё 10 инструментов, чтобы агент справился с любым запросом, и усилить системный промпт правилами","correct":false,"rationale":"Больше инструментов — больше ошибок выбора и шире поверхность атаки."}],"worst":"s2","worstRationale":"Пилот на реальных клиентах с правом записи и без подтверждения — ошибка с реальными деньгами.","anchor":{"g":"loop","p":{"tools":["get_balance","get_history","transfer ✋"],"hitl":true,"max":6},"cap":"свобода читать, контроль над записью"},"id":"u1-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Чем агент отличается от workflow с LLM-узлами?","options":[{"id":"o0","text":"В агенте порядок шагов выбирает модель; в workflow — код, модель заполняет узлы","correct":true,"rationale":"Свобода выбора шага — суть агентности и источник риска."},{"id":"o1","text":"Агент использует большую модель и длинный контекст, workflow — маленькую и короткие промпты на узлах","correct":false,"rationale":"Размер модели не определяет архитектуру."},{"id":"o2","text":"Агент не нуждается в инструментах, потому что всё знает из обучения","correct":false,"rationale":"Наоборот: агент — это LLM плюс инструменты."},{"id":"o3","text":"Workflow нельзя использовать в банке из-за требований регулятора, а агент — можно при наличии логов","correct":false,"rationale":"В банке чаще наоборот: workflow для необратимого."}],"anchor":{"g":"compare","p":{"a":["Workflow","порядок задан кодом"],"b":["Агент","порядок выбирает модель"],"verdict":"начинай с workflow, давай свободу точечно"},"cap":"свобода — на длинном хвосте, контроль — на деньгах"},"id":"u1-1-t0"},{"mechanic":"single","points":2,"stem":"Агент четыре раза подряд вызвал get_history с одинаковыми параметрами и не отвечает. Какой ограничитель должен был сработать?","options":[{"id":"o0","text":"Детектор зацикливания: повтор вызова с теми же аргументами → стоп и эскалация","correct":true,"rationale":"Классический сбой цикла; ловится по трассе."},{"id":"o1","text":"Увеличение температуры на следующем шаге, чтобы модель выбрала другой инструмент или аргументы","correct":false,"rationale":"Случайность — не механизм контроля."},{"id":"o2","text":"Добавление ещё одного инструмента get_history_v2 с другим описанием","correct":false,"rationale":"Дублирование инструмента усугубляет выбор."},{"id":"o3","text":"Ничего: агент имеет право повторять вызовы, пока не найдёт ответ, — так устроен агентный цикл","correct":false,"rationale":"Без лимита это бесконечные токены и время."}],"anchor":{"g":"loop","p":{"tools":["get_history ×4"],"hitl":false,"max":6,"loopWarn":true},"cap":"повтор с теми же аргументами — стоп"},"id":"u1-1-t1"},{"mechanic":"single","points":2,"stem":"Когда мультиагентная схема оправдана?","options":[{"id":"o0","text":"Домены разнородны, один промпт не вмещает правила, у каждого домена есть владелец","correct":true,"rationale":"Специализация окупает латентность и сложность."},{"id":"o1","text":"Всегда: чем больше специализированных агентов в системе, тем умнее и надёжнее итоговый ответ","correct":false,"rationale":"Каждый агент — вызов, латентность и точка отказа."},{"id":"o2","text":"Когда нужно ускорить ответ: параллельные агенты обрабатывают части запроса быстрее одного большого","correct":false,"rationale
