т спины"},"id":"u1-1-t1"},{"mechanic":"single","points":2,"stem":"Проект: переговорная с панорамным остеклением на главный проход — «чтобы было видно, что у нас идут переговоры». Риск?","options":[{"id":"o0","text":"Внутрь заглядывают, а изнутри отвлекаются на проход: стекло — к внутренней зоне стенда, не к павильону","correct":true,"rationale":"Переговорная должна быть видна как факт, но не как содержание."},{"id":"o1","text":"Стекло дорогое и тяжёлое: закалённое 10 мм весит 25 кг/м² и потребует усиления каркаса и доплаты за монтаж","correct":false,"rationale":"Это решаемо и не главная проблема."},{"id":"o2","text":"Регламент площадок запрещает стеклянные перегородки выше 2 м на стендах из-за пожарных норм","correct":false,"rationale":"Закалённое стекло допустимо."},{"id":"o3","text":"Никакого риска: прозрачная переговорная — тренд, она показывает открытость компании","correct":false,"rationale":"Тренд не отменяет психологии: люди не любят, когда на них смотрят с прохода."}],"anchor":{"g":"compare","p":{"a":["стекло на проход","заглядывают, отвлекаются"],"b":["стекло внутрь","видно, что занято, не видно, что обсуждают"],"verdict":"переговорная — в глубине, стекло внутрь"},"cap":"видимость факта, а не содержания"},"id":"u1-1-t2"},{"mechanic":"single","points":2,"stem":"Стенд 36 м² (9×4), угловой. Клиент: ресепшн, демо с экспонатом 2×1 м, две закрытые переговорные по 9 м², подсобка. Что вы скажете?","options":[{"id":"o0","text":"Две закрытые по 9 м² съедят полстенда: одна закрытая и одна открытая, иначе демо не обойти","correct":true,"rationale":"18 м² из 36 на закрытые комнаты — нет места для потока."},{"id":"o1","text":"Всё помещается при высоте 4 м: обе переговорные уводим на второй уровень над подсобкой, демо остаётся внизу","correct":false,"rationale":"Второй этаж на 36 м² невозможен по регламенту и бюджету."},{"id":"o2","text":"Убрать демо: экспонат можно показать на экране, а переговорные важнее для продаж","correct":false,"rationale":"Экспонат — магнит, без него на стенд не зайдут."},{"id":"o3","text":"Сделать обе закрытые по 6 м² — для четырёх человек за столом хватает, и норма такой размер допускает","correct":false,"rationale":"Норма закрытой — от 9 м²; 6 м² — шкаф."}],"anchor":{"g":"plan","p":{"w":9,"d":4,"open":["f","r"],"zones":[["rec",0.05,0.6,0.22,0.35],["demo",0.32,0.2,0.3,0.6],["meet",0.66,0.05,0.3,0.6],["store",0.05,0.05,0.2,0.35]],"dom":[0.9,0.5],"flow":true},"cap":"36 м²: одна закрытая комната — максимум"},"id":"u1-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре плана углового стенда 9×6 м (открыты фасад и правая сторона). Где траектория посетителя построена правильно?","vopts":[{"id":"v0","v":{"g":"planv","p":{"open":["f","r"],"zones":[["rec",0.05,0.62,0.22,0.3],["demo",0.3,0.25,0.35,0.5],["meet",0.05,0.05,0.35,0.4],["store",0.45,0.02,0.2,0.2]],"dom":[0.9,0.85]}},"lbl":"","correct":true,"rationale":"Доминанта на открытом углу, ресепшн сбоку, демо на проходе, переговорная и подсобка у глухих стен."},{"id":"v1","v":{"g":"planv","p":{"open":["f","r"],"zones":[["rec",0.35,0.7,0.3,0.28],["demo",0.05,0.05,0.3,0.4],["meet",0.6,0.5,0.35,0.45],["store",0.75,0.05,0.2,0.3]],"dom":null}},"lbl":"","correct":false,"rationale":"Стойка поперёк входа, переговорная на открытом углу, демо спрятано у глухой стены."},{"id":"v2","v":{"g":"planv","p":{"open":["f","r"],"zones":[["store",0.6,0.7,0.35,0.28],["demo",0.3,0.25,0.35,0.5],["rec",0.05,0.62,0.22,0.3]],"dom":[0.5,0.1]}},"lbl":"","correct":false,"rationale":"Подсобка дверью на открытый угол — самый видимый элемент стенда."},{"id":"v3","v":{"g":"planv","p":{"open":["f","r"],"zones":[["meet",0.05,0.05,0.42,0.9],["meet",0.5,0.05,0.45,0.9]],"dom":null}},"lbl":"","correct":false,"rationale":"Две закрытые комнаты на всей площади — глухой куб без витрины."}],"id":"u1-1-t4"}],"framework":"Зоны по месту: ресепшн сбоку от входа у открытой стороны, демо на виду и обходимое, переговорные в глубине (стекло внутрь), подсобка в невидном углу или ядре. Нормы: менеджер 8–12 м², открытая переговорная 6–8, закрытая от 9, подсобка 4–8%, проходы от 1,2 м. Открытые стороны — витрина, не стена. Сначала траектория, потом фасад.","anchor":{"g":"plan","p":{"w":12,"d":8,"open":["f","l"],"zones":[["rec",0.05,0.62,0.22,0.3],["demo",0.32,0.3,0.36,0.6],["meet",0.72,0.05,0.24,0.5],["store",0.72,0.6,0.24,0.35]],"dom":[0.5,0.15],"flow":true},"cap":"план — сценарий для посетителя"},"layers":{"simple":"Представь, что стенд — это квартира, в которую за день зайдут триста незнакомцев. Прихожая (ресепшн) — у двери, но не поперёк; гостиная с главным предметом (демо) — на виду; кабинеты (переговорные) — в глубине, чтобы не мешали и не заглядывали; кладовка (подсобка) — там, где её не видно.\nЕсть простые нормы: одному менеджеру нужно 8–12 метров, чтобы работать, переговорной на четверых — 6–8, закрытой комнате — от 9, а кладовке — 5% площади. Проходы — не уже 1,2 метра, иначе люди упираются друг в друга.\nИ главное: стороны, выходящие в проход павильона, — это витрины. Заставить их глухой стеной — всё равно что закрыть магазин ставнями.\nПроверь себя: где на островном стенде спрятать подсобку, если спины нет?","how":"1. Зоны: ресепшн (открытая сторона, сбоку от входа) → демо/экспонаты (первая треть, обходимые) → открытые переговорные (середина) → закрытые переговорные, VIP, бар (глубина, глухая стена или ядро) → подсобка (невидный угол, дверь не на фасад) → сцена (длинная сторона).\n2. Нормы: менеджер 8–12 м²; открытая переговорная на 4 — 6–8 м²; закрытая — от 9 м²; подсобка 4–8% (минимум 2×1,5); стойка 1 м на 30–40 контактов/день; проходы ≥ 1,2 м; обход экспоната 0,8–1 м.\n3. Траектория: вход в центре открытой стороны → ресепшн сбоку → экспонат-магнит → переговорные дальше. Проверка: пройти план пальцем от прохода до переговорной, не упираясь.\n4. Открытые стороны: не застраивать глухими стенами (регламент площадки + психология); допустимо до трети фасада под графику/лайтбокс.\n5. Пример. 120 м², полуостров: ресепшн 8, демо 30, 2 закрытые по 10, открытая 8, подсобка 7,2, воздух 46,8 (39%). Запас < 30% — план тесный, зоны режут.","formula":{"f":"воздух = S − (ресепшн + демо + переговорные + подсобка)   ·   цель ≥ 30–40% S\nменеджеров ≤ открытая зона / (8…12 м²)","legend":[["S","площадь стенда","120 м²"],["ресепшн","1 м стойки на 30–40 контактов в день","8 м²"],["демо","экспонат + обход 0,8–1 м","30 м²"],["переговорные","открытая 6–8, закрытая ≥ 9","8 + 2×10"],["подсобка","4–8% S, минимум 2×1,5 м","7,2 м²"],["воздух","проходы ≥ 1,2 м и свободная зона","46,8 м² (39%)"]],"note":"Если воздуха меньше 30% — стенд тесный: уберите зону, а не сузьте проходы."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Зоны по месту: ресепшн сбоку от входа, демо на виду, переговорные в глубине (стекло внутрь), подсобка невидима.\n— Нормы: менеджер 8–12 м², открытая переговорная 6–8, закрытая от 9, подсобка 4–8%, проходы ≥ 1,2 м.\n— Воздуха ≥ 30–40% площади; тесно — убирай зону, не сужай проходы.\n— Открытые стороны — витрины: глухая стена не более трети фасада и по согласованию.\n— Сначала траектория посетителя пальцем по плану, потом фасад.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Где на островном стенде спрятать подсобку, если спины нет?","o":["В ядре доминанты по центру, дверью к переговорным","В ближайшем к проходу углу: там её проще пополнять водой и раздаткой во время работы","Подсобка на островном не нужна: всё хранится в автомобиле за павильоном"],"a":0,"w":"Углы островного стенда просматриваются отовсюду; невидим только центр."},{"q":"Стойка ресепшн — где?","o":["Поперёк входа, чтобы никто не прошёл мимо менеджера","Сбоку от входа, лицом к потоку","В глубине стенда, рядом с переговорными, чтобы не занимать витрину"],"a":1,"w":"Барьер у входа отпугивает; стойка в глубине не встречает."},{"q":"В формуле «воздуха» зачем целевой порог 30–40%?","o":["Для красоты рендера: пустое пространство на картинке читается как дорогой минимализм","Проходы ≥ 1,2 м и толпа у демо требуют запаса, иначе план тесный","Это требование регламента площадок: не менее 30% площади под эвакуацию при пожаре"],"a":1,"w":"Нормативная ширина проходов — часть, но порог шире: свободная зона — это место, где люди останавливаются."},{"q":"Открытая сторона стенда застроена глухой стеной под графику. Что не так?","o":["Ничего: если графика яркая и на лайтбоксе, глухая стена работает как витрина и собирает поток лучше открытой","Витрина закрыта: психологически «вход воспрещён», и регламент требует согласования","Так нельзя только на островных стендах: на линейных и угловых глухой фасад под графику — стандартная практика"],"a":1,"w":"Открытые стороны — витрины; глухая стена допустима до трети фасада."}],"rules":["Зоны по месту: ресепшн сбоку от входа, демо на виду, переговорные в глубине (стекло внутрь), подсобка невидима.","Нормы: менеджер 8–12 м², открытая переговорная 6–8, закрытая от 9, подсобка 4–8%, проходы ≥ 1,2 м.","Воздуха ≥ 30–40% площади; тесно — убирай зону, не сужай проходы.","Открытые стороны — витрины: глухая стена не более трети фасада и по согласованию.","Сначала траектория посетителя пальцем по плану, потом фасад."]}},{"id":"u1-2","level":"L1","title":"Объём, высота, доминанта: силуэт, который читается с 30 метров","lead":"Одна доминанта, ключевой ракурс, пропорции и свет как форма","concept":"Стенд замечают не по деталям, а по силуэту: с 20–50 метров через толпу видны только высота, большие плоскости и свет. Доминанта — один элемент, который держит композицию и несёт логотип: башня, портал, подвесной короб, консоль, световой объём. Её высота — верхняя треть стенда (при 5 м лимита — зона 3,5–5 м), потому что ниже 2,5 м всё закрыто людьми и соседями. Правило «одна доминанта»: две равные башни спорят, три — превращаются в забор. Ключевой ракурс — точка на плане павильона, с которой посетитель увидит стенд впервые; на него работают доминанта и главная графика, на остальные стороны — вторичные элементы. Пропорции: высота к длинной стороне 1:2–1:3 для полуострова; перепады высот (2,5 → 3,5 → 5 м) дают ритм и глубину; сплошной куб одной высоты читается как контейнер. Свет как форма: подсвеченный объём виден дальше крашеного; лайтбокс 3×2 м с яркостью 300–500 кд/м² заметен с 40 м; контровой свет отделяет доминанту от соседей. Второй этаж: оправдан от 120–150 м², когда нужны переговорные без потери площади, удваивает стоимость м², требует расчёта, инженера, допуска площадки и лестницы с нормами; в большинстве проектов та же задача решается подиумом 0,3–0,6 м и перепадом высот.","points":[{"h":"Одна доминанта и верхняя треть","t":"Доминанта несёт логотип и задаёт силуэт. Высота — верхняя треть допустимого объёма: при лимите 5 м логотип на 3,8–4,5 м. Ниже 2,5 м — зона людей и соседей, там читаемость нулевая. Две равные доминанты спорят; если нужен второй акцент — делайте его вдвое ниже и другой формы."},{"h":"Ключевой ракурс и вторичные стороны","t":"Ракурс определяют по плану павильона: откуда идёт основной поток. На ключевой ракурс — доминанта, логотип, главное сообщение, лайтбокс. На вторичные стороны — продукт, графика второго уровня, входы. Рендер делают с ключевого ракурса с высоты глаз 1,6 м и с дистанции 15–25 м — именно так увидит посетитель, а не с «вертолёта»."},{"h":"Пропорции, ритм, перепады","t":"Куб одной высоты — контейнер. Три уровня высот (2,5 / 3,5 / 5 м) — ритм и глубина. Консоли и навесы дают тень и границу «внутри/снаружи». Радиусы и наклоны — заметность ценой стоимости (гнутая фанера, фрезеровка). Пустота тоже форма: портал с проёмом читается лучше заполненной стены."},{"h":"Второй этаж: когда да, когда нет","t":"Да: площадь от 120–150 м², нужны закрытые переговорные без потери открытой зоны, бюджет позволяет ×1,5–2 к м², есть 8–10 недель на расчёт и согласование. Нет: малые площади, лимиты высоты, бюджет, сжатые сроки. Альтернативы: подиум 0,3–0,6 м, антресоль-балкон без функции (чисто силуэт), перепад высот."}],"practice":{"mechanic":"ranking","points":3,"stem":"Расставьте шаги проектирования объёма стенда в правильном порядке.","options":[{"id":"r0","text":"Определить ключевой ракурс по плану павильона и потоку","why":"Без него доминанту ставить некуда."},{"id":"r1","text":"Выбрать одну доминанту и её высоту в верхней трети лимита","why":"Силуэт решается до деталей."},{"id":"r2","text":"Задать ритм перепадами высот и расставить вторичные элементы","why":"Глубина и порядок после главного."},{"id":"r3","text":"Проверить свет как форму: что будет видно с 30 м в выключенном павильоне","why":"Свет — часть объёма, не декор."},{"id":"r4","text":"Сделать рендер с высоты глаз с ключевого ракурса на дистанции 15–25 м","why":"Проверка глазами посетителя, а не вертолёта."},{"id":"r5","text":"Проверить регламент: высота, выступы за границу, подвес","why":"Последняя проверка перед детализацией."}],"solution":"Ракурс → доминанта → ритм → свет → рендер с высоты глаз → регламент.","anchor":{"g":"elev","p":{"h":5,"maxH":5,"items":[["лого",4.3],["лайтбокс",3.5],["уровень глаз",1.6]],"dist":25,"letter":12},"cap":"доминанта в верхней трети, рендер с высоты глаз"},"id":"u1-2-p"},"test":[{"mechanic":"single","points":2,"stem":"Дизайнер принёс стенд с тремя одинаковыми башнями по 5 м с логотипом на каждой: «чтобы видно было отовсюду». Ваш вердикт?","options":[{"id":"o0","text":"Одна доминанта: три равные башни спорят и превращаются в забор; второй акцент — ниже и другой формы","correct":true,"rationale":"Правило одной доминанты."},{"id":"o1","text":"Хорошо для островного стенда: четыре стороны требуют минимум трёх точек с логотипом для равной читаемости","correct":false,"rationale":"Логотип можно повторить на одной доминанте с четырёх граней."},{"id":"o2","text":"Сократить до двух башен одинаковой высоты, расставив их по диагонали для баланса композиции","correct":false,"rationale":"Две равные — тоже спор."},{"id":"o3","text":"Оставить три башни, но сделать логотип только на той, что обращена к входу в павильон","correct":false,"rationale":"Форма всё равно избыточна; проблема в силуэте, а не в логотипе."}],"anchor":{"g":"elev","p":{"h":5,"maxH":5,"items":[["доминанта",5],["акцент",3],["стены",2.5]],"dist":30},"cap":"одна доминанта, остальное ниже"},"id":"u1-2-t0"},{"mechanic":"single","points":2,"stem":"Рендер концепции сделан с высоты 6 м под углом 45°, стенд выглядит эффектно. Что проверить до презентации?","options":[{"id":"o0","text":"Пересобрать ракурс: высота глаз 1,6 м, дистанция 15–25 м по плану павильона — так увидит посетитель","correct":true,"rationale":"«Вертолёт» скрывает, что доминанта не видна за людьми."},{"id":"o1","text":"Добавить людей и соседние стенды в рендер для масштаба, но ракурс оставить: клиенту важно увидеть стенд целиком","correct":false,"rationale":"Целиком стенд никто не увидит."},{"id":"o2","text":"Проверить, что рендер отдан в 4K, а свет и материалы выставлены по чек-листу визуализатора","correct":false,"rationale":"Качество картинки не отвечает на вопрос о заметности."},{"id":"o3","text":"Убрать соседние стенды с рендера, чтобы клиент не отвлекался на чужие конструкции","correct":false,"rationale":"Соседи — часть реальности; их нужно показать."}],"anchor":{"g":"wording","p":{"bad":"ракурс с вертолёта: весь стенд в кадре","good":"ракурс с высоты глаз 1,6 м с 20 м от входа"},"cap":"рендер — глазами посетителя"},"id":"u1-2-t1"},{"mechanic":"single","points":2,"stem":"Клиент на 80 м² хочет второй этаж «для солидности». Что ответить?","options":[{"id":"o0","text":"На 80 м² лестница съест площадь, а цена м² удвоится; солидность дадут подиум и перепад высот","correct":true,"rationale":"Второй этаж оправдан от 120–150 м² и с функцией."},{"id":"o1","text":"Согласиться: двухэтажный стенд на любой площади — самый сильный сигнал статуса, а лестницу уводим в угол","correct":false,"rationale":"Лестница и опоры съедят треть малого стенда."},{"id":"o2","text":"Отказать: регламенты российских площадок запрещают второй этаж на стендах меньше 200 м² без исключений","correct":false,"rationale":"Регламент требует расчёта и согласования, но не запрещает."},{"id":"o3","text":"Сделать декоративный второй этаж без лестницы — визуально двухэтажный, но без нагрузки","correct":false,"rationale":"Декорация в 5 м без функции — деньги на ветер; антресоль-балкон возможен, но это и есть перепад высот."}],"anchor":{"g":"compare","p":{"a":["второй этаж 80 м²","×2 к м², лестница, инженер"],"b":["подиум + перепад","силуэт и статус за 10%"],"verdict":"второй этаж — от 120–150 м² и с функцией"},"cap":"солидность — это силуэт, а не этаж"},"id":"u1-2-t2"},{"mechanic":"single","points":2,"stem":"Что из этого делает стенд заметным с 40 м сильнее всего при равном бюджете?","options":[{"id":"o0","text":"Подсвеченный объём: лайтбокс или световой короб с логотипом в верхней трети","correct":true,"rationale":"Свет виден дальше крашеной поверхности."},{"id":"o1","text":"Крупная фотография продукта на всей задней стене, напечатанная в высоком разрешении","correct":false,"rationale":"Фото читается с 10 м, с 40 — пятно."},{"id":"o2","text":"Яркий цвет ковролина и подиума по всей площади стенда","correct":false,"rationale":"Пол не виден через толпу."},{"id":"o3","text":"Детализированная фрезерованная графика на фасаде высотой 2,5 м","correct":false,"rationale":"Деталь — для вблизи, и высота 2,5 закрыта людьми."}],"anchor":{"g":"funnel3","p":{"steps":[["заметил: свет, силуэт",true],["прочитал: лого ≥ 12 см",true],["понял: продукт",true],["зашёл",false]],"note":"свет и силуэт работают с 40 м; детали — с 5 м"},"cap":"заметность = свет + высота"},"id":"u1-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре разреза стенда (лимит 5 м). Какой силуэт прочитается с 30 метров и пройдёт регламент?","vopts":[{"id":"v0","v":{"g":"elevv","p":{"h":5,"maxH":5,"logo":4.3,"note":"5 м, лого 4,3 м, перепады"}},"lbl":"","correct":true,"rationale":"Доминанта в лимите, логотип в верхней трети, силуэт с перепадом."},{"id":"v1","v":{"g":"elevv","p":{"h":2.5,"maxH":5,"logo":2.2,"note":"2,5 м, лого 2,2 м"}},"lbl":"","correct":false,"rationale":"Всё ниже 2,5 м — закрыто толпой и соседями."},{"id":"v2","v":{"g":"elevv","p":{"h":6.2,"maxH":5,"logo":5.8,"note":"6,2 м — сверх лимита"}},"lbl":"","correct":false,"rationale":"Хорошо читается, но выше регламента — нужны согласование и деньги."},{"id":"v3","v":{"g":"elevv","p":{"h":5,"maxH":5,"logo":1.5,"note":"5 м, лого 1,5 м"}},"lbl":"","correct":false,"rationale":"Высота есть, а логотип внизу — доминанта несёт пустоту."}],"id":"u1-2-t4"}],"framework":"Силуэт читается с 30 м: одна доминанта с логотипом в верхней трети (3,8–4,5 м при лимите 5), ключевой ракурс по плану павильона, рендер с высоты глаз. Ритм перепадами высот, пустота тоже форма. Свет — часть объёма: лайтбокс виден с 40 м. Второй этаж — от 120–150 м² и с функцией; иначе подиум и перепад.","anchor":{"g":"elev","p":{"h":5,"maxH":5,"items":[["доминанта + лого",4.3],["лайтбокс",3.2],["уровень глаз",1.6]],"dist":30,"letter":15},"cap":"одна доминанта, верхняя треть, высота глаз"},"layers":{"simple":"Через толпу в павильоне видно только то, что выше голов: высоту, большие плоскости и свет. Всё, что ниже 2,5 метров, для дальнего посетителя не существует. Поэтому у стенда должна быть одна «башня» с логотипом в верхней трети — и только одна: две спорят, три превращаются в забор.\nПрежде чем ставить башню, найди на плане павильона место, откуда посетитель увидит стенд впервые, — это ключевой ракурс. На него работает всё главное; остальные стороны — второстепенные.\nСвет — это тоже форма: подсвеченный короб заметен с сорока метров, крашеный — с пятнадцати. А второй этаж — не признак солидности, а инженерная задача, оправданная от 120–150 квадратов.\nПроверь себя: почему рендер «с вертолёта» опасен на презентации?","how":"1. Доминанта: один элемент с логотипом, высота в верхней трети лимита (при 5 м — 3,8–4,5 м). Второй акцент — вдвое ниже и другой формы.\n2. Ключевой ракурс: по плану павильона (вход, главный проход). Рендер — с высоты глаз 1,6 м, дистанция 15–25 м, с соседями.\n3. Ритм: три уровня высот (2,5 / 3,5 / 5), консоли и порталы, пустота как форма. Куб одной высоты — контейнер.\n4. Свет как форма: лайтбокс 300–500 кд/м² виден с 40 м; контровой свет отделяет от соседей; свет планируется вместе с объёмом, а не после.\n5. Второй этаж: от 120–150 м², с функцией (переговорные), ×1,5–2 к м², инженер, расчёт, допуск площадки, лестница по нормам; иначе — подиум 0,3–0,6 м и перепад высот.\n6. Пример. Полуостров 96 м², лимит 5 м, поток от входа слева. Доминанта — портал 5 м с логотипом на 4,3 м у левого угла; стены 3,5 м с лайтбоксом 3×2; открытая зона под навесом 2,8 м. Рендер с 20 м от входа слева, высота 1,6 м.","formula":{"f":"зона читаемости = [2,5 м; лимит] · логотип в верхней трети · одна доминанта\nрендер: высота глаз 1,6 м · дистанция 15–25 м · с ключевого ракурса","legend":[["лимит","регламент площадки по высоте","5 м (Экспоцентр), сверх — согласование"],["верхняя треть","где живёт логотип","3,8–4,5 м"],["ключевой ракурс","точка первого взгляда по плану павильона","вход, главный проход"],["ритм","уровни высот","2,5 / 3,5 / 5"],["второй этаж","площадь, функция, бюджет","≥ 120–150 м², ×1,5–2"]],"note":"Проверка силуэта: сощурьтесь на рендер — если осталась одна форма и свет, доминанта есть; если каша — нет."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Одна доминанта с логотипом в верхней трети лимита; второй акцент — ниже и другой формы.\n— Ключевой ракурс — по плану павильона; рендер с высоты глаз 1,6 м с 15–25 м, с соседями.\n— Ритм из трёх уровней высот; пустота — тоже форма; куб одной высоты — контейнер.\n— Свет — часть объёма: лайтбокс виден с 40 м, контровой свет отделяет от соседей.\n— Второй этаж — от 120–150 м² и с функцией; иначе подиум и перепад.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Почему рендер «с вертолёта» опасен на презентации?","o":["Клиент видит весь стенд, а посетитель — только силуэт за людьми; несоответствие вскроется на выставке","Потому что визуализаторы тратят на такой ракурс вдвое больше времени: 2–3 дня вместо одного, и презентация сдвигается","Регламент площадки требует прикладывать к проекту вид сверху в масштабе 1:50, а не перспективу с высоты"],"a":0,"w":"Рендер — глазами посетителя: 1,6 м, 15–25 м, с соседями."},{"q":"Логотип стоит на высоте 2 м на стене 5 м. Что не так?","o":["Ничего: главное, чтобы шрифт соответствовал бренд-гайду","Ниже 2,5 м закрыто людьми и соседями; логотип — в верхней трети","Логотип должен быть выше 5 м, чтобы его видели с другого конца павильона"],"a":1,"w":"Зона читаемости начинается над головами."},{"q":"В формуле читаемости что такое «одна доминанта»?","o":["Самый дорогой элемент стенда, на который уходит половина бюджета","Единственный элемент, держащий силуэт и несущий логотип","Элемент, который обязательно должен быть выше лимита площадки"],"a":1,"w":"Две равные спорят, три — забор."},{"q":"Когда второй этаж оправдан?","o":["Всегда, когда клиент готов платить ×1,5–2: это главный сигнал статуса на выставке","От 120–150 м², с функцией, бюджетом ×1,5–2 и временем на расчёт","Никогда на российских площадках: регламент не пропускает второй уровень"],"a":1,"w":"Иначе — подиум и перепад высот."}],"rules":["Одна доминанта с логотипом в верхней трети лимита; второй акцент — ниже и другой формы.","Ключевой ракурс — по плану павильона; рендер с высоты глаз 1,6 м с 15–25 м, с соседями.","Ритм из трёх уровней высот; пустота — тоже форма; куб одной высоты — контейнер.","Свет — часть объёма: лайтбокс виден с 40 м, контровой свет отделяет от соседей.","Второй этаж — от 120–150 м² и с функцией; иначе подиум и перепад."]}},{"id":"u1-3","level":"L1","title":"Конструктив и регламент площадки: из чего стенд стоит","lead":"Каркас, профильные системы, подвес, пол, электрика, пожарные нормы — что скажет площадка","concept":"Стенд стоит на трёх вещах: каркасе, поле и согласовании. Каркас эксклюзива — столярный (ЛДСП/фанера на брусе и металлических стойках) до 4–5 м или сварной металлический (труба 40×40, 60×40) для высоты, консолей и подвесных элементов; профильные системы (Octanorm, Maxima, ферма) — для стандарта, каркасов под ткань и световых конструкций. Подвес к перекрытию павильона (баннер, световой короб, ферма с прожекторами) — только по заявке площадке за 2–3 недели, с расчётом нагрузки, монтаж — силами площадки или аккредитованных риггеров; не на всех залах и не везде. Пол: ковролин (дешёво, быстро), ламинат/плитка (дороже, статуснее), подиум 50–150 мм (скрывает кабели, даёт границу и статус, требует пандуса для доступности и ограждения при высоте от 0,2 м). Нагрузка на пол павильона — обычно 1–5 т/м² по залам: тяжёлые экспонаты и бассейны согласуются. Электрика: подключение заказывается у площадки (кВт, фазы, точки), внутри стенда — свой щит и сертифицированный электрик; свет считают в кВт заранее. Пожарные нормы: ткани и ковролин с сертификатом горючести (Г1/В1 или негорючие по классификации площадки), пути эвакуации, доступ к гидрантам, двухэтажные стенды — отдельные требования и расчёт. Регламент площадки: высота (Экспоцентр — до 5 м без ограничений зала, выше — согласование), стены к соседям высотой от 2,5 м с чистовой отделкой с обратной стороны, ничего не выступает за границу стенда, открытые стороны не застраиваются глухими стенами без согласования, проект (план, разрез, электрика) сдаётся заранее. Арт-директору не нужно считать сварные швы — нужно знать, какая идея потребует инженера, заявки и трёх недель.","points":[{"h":"Каркас: столярный, металл, профиль","t":"Столярный (бруc + ЛДСП/фанера): стены до 3,5–4 м, быстро, дёшево, хорошо под окраску и печать. Металл (сварной каркас с обшивкой): высота 4–6 м, консоли, башни, подвесные конструкции, второй этаж — дороже, дольше, нужен конструктор. Профильные системы (Octanorm, Maxima, алюминиевая ферма): стандарт, световые порталы, каркас под натяжную ткань; быстрый монтаж, модульность, повторное использование."},{"h":"Подвес, пол, нагрузки","t":"Подвес: заявка площадке за 2–3 недели, расчёт нагрузки, точки подвеса по сетке зала, монтаж риггерами площадки; высота подвесных элементов ограничена залом. Пол: ковролин → ламинат → подиум (50–150 мм): подиум прячет кабели и даёт границу, но нужен пандус и, от 0,2 м, ограждение. Нагрузка на пол зала 1–5 т/м²: станок 3 т на 2 м² — согласование и распределяющая плита."},{"h":"Электрика и свет в киловаттах","t":"Подключение заказывают у площадки: мощность (кВт), фазность, точка выхода на плане. Внутри — щит, сертифицированный электрик, кабели под подиумом или в кабель-каналах. Считают заранее: 1 прожектор 30–50 Вт LED, лайтбокс 60–120 Вт/м², LED-экран 300–600 Вт/м², кофемашина 2–3 кВт. Стенд 100 м² с экраном 6 м² и баром — порядка 8–12 кВт."},{"h":"Пожарные нормы и регламент площадки","t":"Сертификаты горючести на ткани, ковролин, декоративные панели; доступ к гидрантам и путям эвакуации; проходы внутри от 1,2 м; двухэтажные — отдельные правила. Регламент: высота (обычно до 5 м), стены к соседям от 2,5 м с чистовой обратной стороной, ничего за границу, открытые стороны без глухих стен без согласования, проект сдаётся в срок (план, разрез с высотами, схема электрики). Нарушение — остановка монтажа."}],"practice":{"mechanic":"sjt_bw","points":3,"stem":"Клиент утвердил концепцию: подвесной световой короб 8×2 м над островным стендом и консоль 4 м без опор. До выставки 5 недель, заявки на подвес нет. Лучшее и худшее действие арт-директора?","options":[{"id":"s0","text":"Сегодня: заявка на подвес с расчётом; консоль — к конструктору; план Б без подвеса, если площадка откажет","correct":true,"rationale":"Срок заявки — 2–3 недели, сейчас последний момент."},{"id":"s1","text":"Оставить подвес проектному менеджеру: согласование с площадкой и расчёт нагрузок — его зона, арт-директор отвечает за идею","correct":false,"rationale":"PM согласует, но идея и план Б — ответственность арт-директора."},{"id":"s2","text":"Заменить подвес на башню 5 м сразу, не спрашивая площадку: башня в пределах регламента, надёжнее и дешевле","correct":false,"rationale":"Отказ от идеи до проверки — потеря ценности без причины."},{"id":"s3","text":"Сдать проект в цех как есть и решать подвес на монтаже по ситуации","correct":false,"rationale":"На монтаже площадка остановит работы."}],"worst":"s3","worstRationale":"Подвес без заявки монтировать не дадут; решать «на монтаже» — сорвать стенд целиком.","anchor":{"g":"pipeline","p":{"steps":["концепт","заявка на подвес","расчёт нагрузок","план Б","цех","монтаж риггерами"],"hl":[1,2,3]},"cap":"подвес — заявка за 2–3 недели"},"id":"u1-3-p"},"test":[{"mechanic":"single","points":2,"stem":"Стена стенда 5,5 м с консолью 3 м и экраном на ней. Какой каркас?","options":[{"id":"o0","text":"Сварной металлокаркас по расчёту конструктора: столярка такую высоту и консоль не держит","correct":true,"rationale":"Высота и консоль — зона металла."},{"id":"o1","text":"Усиленный столярный каркас из бруса 100×100 с фанерой 18 мм и раскосами — дешевле и быстрее металла","correct":false,"rationale":"Брус на 5,5 м с консолью — риск обрушения."},{"id":"o2","text":"Профильная система Octanorm с удвоенными стойками: модульность, быстрый монтаж и повторное использование","correct":false,"rationale":"Профиль не держит консоль с экраном."},{"id":"o3","text":"Любой: при высоте до 6 м каркас выбирает цех по своим возможностям","correct":false,"rationale":"Высота и консоль — решение конструктора, не цеха."}],"anchor":{"g":"elev","p":{"h":5.5,"maxH":5,"items":[["консоль + экран",4.5],["металлокаркас",0.5]],"dist":20},"cap":"высота и консоль — металл и расчёт"},"id":"u1-3-t0"},{"mechanic":"single","points":2,"stem":"Экспонат — станок 2,8 т на площади 1,5 м². Что делать арт-директору?","options":[{"id":"o0","text":"Проверить нагрузку зала по регламенту и заложить распределяющую плиту; согласовать с площадкой","correct":true,"rationale":"Около 1,9 т/м² может превышать норму зала."},{"id":"o1","text":"Ничего: полы павильонов рассчитаны на заезд грузовиков с монтажным грузом, станок в 2,8 т пройдёт без вопросов","correct":false,"rationale":"Нормы залов 1–5 т/м², бывает и меньше."},{"id":"o2","text":"Поставить станок на подиум 150 мм из ЛДСП: он сам распределит вес по всей площади подиума без расчёта","correct":false,"rationale":"Подиум не распределяет нагрузку без плиты и расчёта."},{"id":"o3","text":"Показать станок только на экране — живой экспонат такого веса на стенде недопустим","correct":false,"rationale":"Допустим — с согласованием."}],"anchor":{"g":"formula","p":{"f":"нагрузка = масса / площадь опоры = 2,8 т / 1,5 м² ≈ 1,9 т/м²","sub":"сравнить с нормой зала; плита распределяет","fs":12},"cap":"тяжёлое — считать и согласовывать"},"id":"u1-3-t1"},{"mechanic":"single","points":2,"stem":"Сколько примерно киловатт заказать у площадки для стенда 100 м²: 30 LED-прожекторов, лайтбокс 6 м², LED-экран 4 м², кофемашина, два ноутбука?","options":[{"id":"o0","text":"Около 5–6 кВт с запасом 30%: прожекторы 1,5, лайтбокс 0,6, экран 2, кофемашина 2,5, мелочь","correct":true,"rationale":"Сумма ≈ 6,7 кВт пиковая; с учётом неодновременности и запаса заказывают 6–8."},{"id":"o1","text":"Около 1 кВт: LED-свет берёт десятки ватт, экран — как телевизор, а кофемашина включается редко","correct":false,"rationale":"Кофемашина 2–3 кВт одна."},{"id":"o2","text":"Около 25 кВт: выставочные стенды всегда берут трёхфазное подключение максимальной мощности, иначе выбьет автомат","correct":false,"rationale":"Переплата за мощность и щит."},{"id":"o3","text":"Электрику считает площадка по площади стенда: 1 кВт на 10 м² по умолчанию","correct":false,"rationale":"Площадка выдаёт то, что заказано."}],"anchor":{"g":"cost","p":{"lines":[["30 прожекторов × 40 Вт","1,2 кВт"],["лайтбокс 6 м² × 100 Вт","0,6 кВт"],["LED-экран 4 м² × 500 Вт","2,0 кВт"],["кофемашина","2,5 кВт"],["ноутбуки, мелочь","0,4 кВт"]],"total":"≈ 6,7 кВт → заказ 8 кВт"},"cap":"электрику считают до заявки"},"id":"u1-3-t2"},{"mechanic":"single","points":2,"stem":"Ткань для натяжного лайтбокса куплена у поставщика без сертификата горючести. Монтаж через неделю.","options":[{"id":"o0","text":"Заменить на ткань с сертификатом нужного класса или получить сертификат на эту: иначе остановят монтаж","correct":true,"rationale":"Пожарный инспектор проверяет документы, а не вид ткани."},{"id":"o1","text":"Обработать ткань огнезащитным составом в цеху за два дня до монтажа и приложить чек и паспорт состава","correct":false,"rationale":"Нужен сертификат на материал или протокол испытаний."},{"id":"o2","text":"Показать инспектору, что ткань натянута в 80 мм от LED-ленты и не контактирует с источником, — LED не греется","correct":false,"rationale":"Класс горючести не зависит от нагрева ламп."},{"id":"o3","text":"Ничего не делать: на практике сертификаты на выставках не проверяют","correct":false,"rationale":"Проверяют; остановка монтажа — обычное последствие."}],"anchor":{"g":"guard","p":{"in":true,"out":true,"tools":false,"note":"сертификаты: ткань, ковролин, панели — до монтажа"},"cap":"пожарные нормы проверяются по бумагам"},"id":"u1-3-t3"},{"mechanic":"visual","points":3,"stem":"Четыре разреза стенда у границы с соседом (лимит 5 м). Какой соответствует регламенту площадки?","vopts":[{"id":"v0","v":{"g":"elevv","p":{"h":4.5,"maxH":5,"logo":4,"note":"4,5 м, в границе, обратная сторона чистовая"}},"lbl":"","correct":true,"rationale":"В лимите, ничего не выступает, стена к соседу отделана."},{"id":"v1","v":{"g":"elevv","p":{"h":5.8,"maxH":5,"logo":5.2,"note":"5,8 м без согласования"}},"lbl":"","correct":false,"rationale":"Сверх лимита без согласования — остановка."},{"id":"v2","v":{"g":"elevv","p":{"h":4.5,"maxH":5,"logo":4,"solid":true,"note":"консоль 1 м за границу стенда"}},"lbl":"","correct":false,"rationale":"Ничего не может выступать за границу площади, даже в воздухе."},{"id":"v3","v":{"g":"elevv","p":{"h":2,"maxH":5,"logo":1.5,"note":"стена к соседу 2 м"}},"lbl":"","correct":false,"rationale":"Стена к соседу ниже 2,5 м — нарушение регламента и видна чужая подсобка."}],"id":"u1-3-t4"}],"framework":"Каркас: столярка до 3,5–4 м, металл для высоты, консолей, подвеса, второго этажа; профиль — стандарт и ткань. Подвес — заявка площадке за 2–3 недели с расчётом, монтаж риггерами. Пол: ковролин → ламинат → подиум с пандусом; нагрузка зала 1–5 т/м². Электрика в кВт заранее. Сертификаты горючести, эвакуация, регламент: высота 5 м, стены к соседям 2,5 м чистовые, ничего за границу, проект в срок.","anchor":{"g":"arch","p":{"hl":["guard","orch","tools"]},"cap":"стенд стоит на каркасе, поле и согласовании"},"layers":{"simple":"Стенд — это дом на три дня, и у него тот же набор вопросов: на чём стоит, что держит крышу, откуда электричество и не сгорит ли. Стены до 3,5–4 метров делают из дерева и ЛДСП; всё, что выше, свисает или нависает, — из металла по расчёту инженера.\nКрыша павильона чужая: повесить на неё баннер или короб можно только по заявке за две-три недели, и вешают его люди площадки. Пол тоже чужой: тяжёлый станок нужно согласовать, подиум — снабдить пандусом.\nИ у площадки есть инспектор с линейкой и папкой: выше 5 метров — согласование, ткань без сертификата — стоп, стена к соседу ниже 2,5 метров или выступ за границу — стоп. Арт-директор не считает балки, но знает, какая идея потребует инженера и трёх недель.\nПроверь себя: что надо сделать сегодня, если в концепции есть подвес, а до выставки пять недель?","how":"1. Каркас: столярный (брус + ЛДСП/фанера) до 3,5–4 м; сварной металл для 4–6 м, консолей, башен, подвесных элементов, второго этажа — с расчётом конструктора; профильные системы (Octanorm, Maxima, ферма) — стандарт, порталы, ткань.\n2. Подвес: заявка площадке за 2–3 недели, расчёт нагрузок, точки по сетке зала, монтаж риггерами; план Б на случай отказа.\n3. Пол: ковролин / ламинат / подиум 50–150 мм (кабели, граница, статус; пандус; ограждение от 0,2 м). Нагрузка зала 1–5 т/м² — тяжёлое согласовать, плита.\n4. Электрика: заказ у площадки в кВт и фазах, точка на плане; свой щит, электрик; расчёт: прожектор 30–50 Вт, лайтбокс 60–120 Вт/м², LED-экран 300–600 Вт/м², кофемашина 2–3 кВт; запас 30%.\n5. Пожарные нормы и регламент: сертификаты горючести на ткани, ковролин, панели; проходы ≥ 1,2 м; гидранты; высота до 5 м (сверх — согласование); стены к соседям ≥ 2,5 м с чистовой обратной стороной; ничего за границу; открытые стороны без глухих стен без согласования; проект (план, разрез, электрика) сдаётся заранее.\n6. Пример. Островной 150 м²: металлокаркас доминанты 5 м, подвес светового короба 6×2 м (заявка за 3 недели, 120 кг), подиум 100 мм с пандусами на четырёх сторонах, 10 кВт, ткань Г1 с сертификатом, проект сдан за 4 недели.","formula":{"f":"каркас = f(высота, консоли, подвес, этаж): столярка ≤ 4 м · металл > 4 м или консоль · профиль = стандарт/ткань\nкВт = Σ(прожекторы, лайтбоксы, экраны, техника) × 1,3   ·   нагрузка = масса / площадь опоры ≤ норма зала","legend":[["подвес","заявка площадке с расчётом","за 2–3 недели"],["подиум","50–150 мм, пандус, ограждение от 0,2 м","кабели + граница"],["норма зала","допустимая нагрузка на пол","1–5 т/м²"],["сертификат","класс горючести тканей, ковролина, панелей","по требованию площадки"],["регламент","высота, стены к соседям, границы, открытые стороны","5 м · 2,5 м · 0 выступов"]],"note":"Проверка идеи за минуту: выше 4 м? консоль? подвес? тяжёлый экспонат? ткань? — каждое «да» = инженер, заявка или сертификат, и недели в графике."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Каркас: столярка до 4 м, металл для высоты, консолей, подвеса, этажа; профиль — стандарт и ткань.\n— Подвес — заявка площадке за 2–3 недели с расчётом, монтаж риггерами; всегда план Б.\n— Пол: ковролин → ламинат → подиум с пандусом; нагрузка зала 1–5 т/м² — тяжёлое согласовать.\n— Электрика в кВт заранее с запасом 30%; сертификаты горючести до монтажа.\n— Регламент: до 5 м, стены к соседям ≥ 2,5 м чистовые, ничего за границу, открытые стороны без глухих стен, проект в срок.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Что сделать сегодня, если в концепции подвес, а до выставки пять недель?","o":["Подать заявку на подвес с расчётом и подготовить план Б без подвеса","Передать вопрос проектному менеджеру: согласования с площадкой — его работа, не арт-директора","Заменить подвес на башню, чтобы не рисковать сроками и бюджетом"],"a":0,"w":"Срок заявки 2–3 недели — сейчас последний момент; план Б — страховка идеи."},{"q":"Стена 5,5 м с консолью и экраном — какой каркас?","o":["Столярный усиленный: брус 100×100 и фанера 18 мм","Сварной металл по расчёту конструктора","Профильная система с дополнительными стойками"],"a":1,"w":"Высота и консоль — зона металла и инженера."},{"q":"В формуле кВт зачем множитель 1,3?","o":["Для компенсации потерь в кабелях длиной более 50 метров внутри стенда","Запас на одновременное включение и добавленное по ходу оборудование","Это требование площадки для расчёта стоимости подключения"],"a":1,"w":"На монтаже всегда появляется «ещё одна розетка»."},{"q":"Ткань без сертификата горючести за неделю до монтажа. Что делать?","o":["Обработать огнезащитным составом на месте и приложить чек","Заменить на сертифицированную или получить сертификат","Ничего: LED не греется, ткань за лайтбоксом безопасна"],"a":1,"w":"Инспектор проверяет документы, а не нагрев ламп."}],"rules":["Каркас: столярка до 4 м, металл для высоты, консолей, подвеса, этажа; профиль — стандарт и ткань.","Подвес — заявка площадке за 2–3 недели с расчётом, монтаж риггерами; всегда план Б.","Пол: ковролин → ламинат → подиум с пандусом; нагрузка зала 1–5 т/м² — тяжёлое согласовать.","Электрика в кВт заранее с запасом 30%; сертификаты горючести до монтажа.","Регламент: до 5 м, стены к соседям ≥ 2,5 м чистовые, ничего за границу, открытые стороны без глухих стен, проект в срок."]}},{"id":"u2-1","level":"L2","title":"Три секунды: сообщение, иерархия, читаемость","lead":"Посетитель идёт мимо со скоростью 1 м/с и даёт стенду три секунды — что он успеет понять","concept":"Стенд работает как наружная реклама, а не как сайт: человек идёт по проходу, смотрит вперёд и даёт каждому стенду 2–3 секунды бокового зрения с 10–20 метров. За это время он должен ответить на три вопроса: кто это (логотип/бренд), что они делают (одно сообщение или продукт) и зачем мне заходить (демо, акция, кофе, люди). Отсюда иерархия: первый уровень — логотип и доминанта (читается с 30–40 м); второй — одно ключевое сообщение до 5–7 слов (с 10–15 м); третий — продукт и экспонаты (с 5 м); четвёртый — детали, тексты, QR, цены (вблизи, 1–2 м). Читаемость считается: минимальная высота буквы ≈ дистанция в метрах × 0,4–0,5 см для чтения на ходу (10 м → 4–5 см, 20 м → 8–10 см, логотип с 40 м — от 15–20 см, лучше 30+); контраст текста и фона — высокий (тёмное на светлом или наоборот, без «серого на сером»), фото под текстом — только с затемнением. Плотность: стенд, на котором «написано всё», не читается ничего; правило — одна мысль на плоскость. Сообщение должно продавать: не «инновационные решения для бизнеса», а «новая линейка станков 2026 — смотрите в работе». Фотогеничность — шестой критерий вакансии: у стенда должен быть один ракурс, где логотип, доминанта и люди складываются в кадр для соцсетей клиента и портфолио; его проектируют заранее — чистый фон, свет на лицах, без кабелей и подсобки в кадре.","points":[{"h":"Три вопроса за три секунды","t":"Кто (логотип и бренд-цвет), что (одно сообщение или продукт), зачем заходить (демо, люди, кофе, подарок). Если на стенде десять тезисов — посетитель не прочитает ни одного. Тест: закрыть рендер на три секунды, открыть — что запомнилось? Если не три ответа — иерархия не работает."},{"h":"Четыре уровня иерархии и дистанции","t":"Уровень 1: логотип и доминанта — 30–40 м, буквы ≥ 20–30 см, свет. Уровень 2: ключевое сообщение 5–7 слов — 10–15 м, буквы 6–10 см. Уровень 3: продукт, экспонаты, экраны — 5 м. Уровень 4: тексты, характеристики, QR, цены — 1–2 м, высота 0,9–1,7 м от пола. Каждому уровню — своё место на стенде и свой размер."},{"h":"Читаемость в цифрах","t":"Высота буквы ≈ дистанция (м) × 0,4–0,5 см на ходу; для спокойного чтения × 0,3. Контраст: тёмное на светлом/светлое на тёмном; на фото — плашка или затемнение 40–60%. Шрифт без тонких засечек на дистанции, трекинг шире обычного. Фриз 30 см в стандарте — буквы 15–20 см — читается с 30–40 м. Текст ниже 0,9 м и выше 2 м вблизи не читают."},{"h":"Сообщение, которое продаёт, и кадр для фото","t":"Сообщение — выгода или новость, не абстракция: «Запуск серии X», «Срок поставки 7 дней», «Попробуйте на стенде». Фотогеничность проектируют: один ракурс, где доминанта, логотип и люди в кадре; свет на лицах 4000 К, чистый фон без кабелей и подсобки, подиум как сцена. Этот же кадр — в портфолио и в отчёте клиенту, по нему вас будут нанимать в следующий раз."}],"practice":{"mechanic":"numeric","points":3,"stem":"Логотип должен читаться с 40 м от входа в павильон на ходу. Какая минимальная высота букв в сантиметрах по правилу «дистанция × 0,5 см»?","answer":20,"tol":0.5,"unit":"см","solution":"40 м × 0,5 см = 20 см — минимум для чтения на ходу; для уверенного узнавания логотипа на фризе берут 30–40 см, а крупный знак — от 60 см. Сообщение с 15 м: 15 × 0,5 = 7,5 см.","anchor":{"g":"elev","p":{"h":5,"maxH":5,"items":[["лого ≥ 20 см",4.3],["сообщение ≥ 8 см",3.2],["детали 0,9–1,7 м",1.3]],"dist":40,"letter":20},"cap":"высота буквы = дистанция × 0,5 см"},"id":"u2-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Клиент прислал для фасада текст: миссия компании, 12 преимуществ, 6 логотипов партнёров, QR и адрес. Что делает арт-директор?","options":[{"id":"o0","text":"На фасаде — логотип и одно сообщение; преимущества и партнёров — на уровень 4 вблизи, QR — у стойки","correct":true,"rationale":"Одна мысль на плоскость; остальное — вблизи."},{"id":"o1","text":"Размещает всё, уменьшив кегль до 5 см решение?","options":[{"id":"o0","text":"Контраст плавает по пятнам фото: затемнить фото на 40–60% или дать плашку под текст","correct":true,"rationale":"Текст на фото — только с плашкой или затемнением."},{"id":"o1","text":"Риска нет: белый текст на цветном фото — стандартный приём, читаемый при любом освещении","correct":false,"rationale":"Светлые участки фото «съедают» белые буквы."},{"id":"o2","text":"Сделать текст чёрным: чёрный читается на любом фото лучше белого","correct":false,"rationale":"На тёмных участках фото чёрный исчезнет так же."},{"id":"o3","text":"Убрать фото: на выставочных стендах фотографии не используют, только графику и логотип","correct":false,"rationale":"Фото используют; вопрос в контрасте."}],"anchor":{"g":"compare","p":{"a":["текст на фото","контраст плавает"],"b":["текст на плашке","читается с 15 м"],"verdict":"затемнение 40–60% или плашка"},"cap":"контраст важнее красоты"},"id":"u2-1-t2"},{"mechanic":"single","points":2,"stem":"Как спроектировать фотогеничность стенда, а не надеяться на фотографа?","options":[{"id":"o0","text":"Задать один ракурс: доминанта, логотип, люди, чистый фон, свет на лицах, подиум как сцена — и снимать его","correct":true,"rationale":"Кадр проектируется заранее."},{"id":"o1","text":"Поставить вдвое больше прожекторов на максимум — один на 1,5 м² вместо 3 м², — чтобы любой кадр с любой точки был светлым","correct":false,"rationale":"Пересвет и тени на лицах; дело в композиции кадра."},{"id":"o2","text":"Закрыть стенд для посетителей на час до открытия и снимать пустым: чистый кадр без случайных людей и сумок","correct":false,"rationale":"Люди в кадре — признак успеха стенда."},{"id":"o3","text":"Заказать аэросъёмку с дрона: сверху стенд выглядит масштабнее","correct":false,"rationale":"Дрон в павильоне запрещён, и ракурс сверху никто не увидит."}],"anchor":{"g":"plan","p":{"w":10,"d":6,"open":["f","r"],"zones":[["rec",0.05,0.6,0.22,0.35],["demo",0.35,0.25,0.3,0.5]],"dom":[0.88,0.2],"flow":true,"note":"ракурс для фото: с правого прохода на доминанту и ресепшн"},"cap":"кадр проектируют на плане"},"id":"u2-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре варианта читаемости сообщения с 15 м на ходу. Какой работает?","vopts":[{"id":"v0","v":{"g":"readv","p":{"dist":15,"letter":8,"ok":true,"note":"8 см ≥ 15 × 0,5"}},"lbl":"","correct":true,"rationale":"15 м × 0,5 см = 7,5 см — 8 см читается на ходу."},{"id":"v1","v":{"g":"readv","p":{"dist":15,"letter":3,"ok":false,"note":"3 см с 15 м"}},"lbl":"","correct":false,"rationale":"3 см читаются с 6–7 м, не с 15."},{"id":"v2","v":{"g":"readv","p":{"dist":40,"letter":8,"ok":false,"note":"8 см с 40 м"}},"lbl":"","correct":false,"rationale":"С 40 м нужно 20 см — для логотипа; 8 см исчезают."},{"id":"v3","v":{"g":"readv","p":{"dist":15,"letter":60,"ok":false,"note":"60 см: 2 слова на весь фриз"}},"lbl":"","correct":false,"rationale":"Читаемо, но на фриз влезет два слова, а сообщение — 5–7; размер нужно подбирать, а не максимизировать."}],"id":"u2-1-t4"}],"framework":"Три секунды: кто, что, зачем заходить. Четыре уровня иерархии: логотип (30–40 м, ≥ 20–30 см), сообщение 5–7 слов (10–15 м, 6–10 см), продукт (5 м), детали (1–2 м, 0,9–1,7 м от пола). Высота буквы ≈ дистанция × 0,5 см. Контраст: текст на фото — плашка. Одна мысль на плоскость. Сообщение продаёт. Кадр для фото проектируют.","anchor":{"g":"funnel3","p":{"steps":[["заметил",true],["прочитал",true],["понял",true],["зашёл",true]],"note":"кто → что → зачем: три секунды с 15 метров"},"cap":"иерархия — это дистанции и размеры"},"layers":{"simple":"Посетитель не читает стенд — он проходит мимо и краем глаза даёт ему три секунды. За три секунды можно понять три вещи: кто это, что они делают и зачем мне сюда зайти. Всё остальное — для тех, кто уже подошёл.\nПоэтому у стенда четыре «этажа» информации: логотип наверху, большой, виден с 40 метров; одно короткое сообщение — с 15; продукт — с 5; тексты и QR — на уровне глаз, вблизи. Размер буквы считается просто: дистанция в метрах × полсантиметра.\nИ сообщение должно продавать: не «инновационные решения», а «новая серия — попробуйте на стенде». А ещё у стенда должен быть один заранее придуманный кадр для фотографии — по нему клиент будет судить о выставке, а вы — о себе.\nПроверь себя: какой высоты буквы нужны, чтобы прочитать сообщение с 15 метров на ходу?","how":"1. Три вопроса за три секунды: кто (логотип + бренд-цвет), что (одно сообщение/продукт), зачем заходить (демо, люди, кофе).\n2. Четыре уровня: логотип 30–40 м (≥ 20–30 см, свет) → сообщение 5–7 слов 10–15 м (6–10 см) → продукт/экраны 5 м → детали, QR, цены 1–2 м на высоте 0,9–1,7 м.\n3. Читаемость: высота буквы ≈ дистанция × 0,4–0,5 см на ходу (× 0,3 при спокойном чтении); контраст высокий; текст на фото — плашка или затемнение 40–60%; шрифт без тонких элементов, трекинг шире.\n4. Одна мысль на плоскость; сообщение — выгода или новость; тест трёх секунд на рендере.\n5. Фотогеничность: один спроектированный ракурс (доминанта + логотип + люди), чистый фон, свет на лицах 4000 К, подиум как сцена, без кабелей и подсобки в кадре.\n6. Пример. Фриз 4,3 м: логотип 35 см — читается с 60 м. Сообщение «Серия X: смотрите в работе» на 3,2 м, буквы 9 см — с 18 м. Характеристики на стойке у экспоната, 1,2 м от пола, кегль 1,5 см — с 1,5 м. Кадр: с правого прохода, доминанта слева, экспонат и люди в центре.","formula":{"f":"h_буквы (см) ≈ D (м) × 0,5   на ходу   ·   × 0,3 спокойное чтение\nуровни: лого 30–40 м → сообщение 10–15 м → продукт 5 м → детали 1–2 м","legend":[["D","дистанция, с которой должно читаться","15 м"],["h_буквы","минимальная высота буквы","7,5 → 8 см"],["логотип","уровень 1, верхняя треть, свет","≥ 20–30 см"],["сообщение","уровень 2, 5–7 слов, выгода или новость","«Серия X: смотрите в работе»"],["контраст","текст на фото — плашка/затемнение","40–60%"],["кадр","спроектированный ракурс для фото","доминанта + лого + люди"]],"note":"Тест трёх секунд: закрыть рендер, открыть на три секунды, закрыть — что запомнилось? Если не «кто, что, зачем» — переделывать иерархию, не шрифт."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Три секунды: кто, что, зачем заходить — иначе иерархия не работает.\n— Четыре уровня: логотип 30–40 м, сообщение 10–15 м, продукт 5 м, детали 1–2 м — свои места и размеры.\n— Высота буквы ≈ дистанция × 0,5 см на ходу; контраст высокий; текст на фото — плашка.\n— Одна мысль на плоскость; сообщение продаёт выгоду или новость.\n— Кадр для фото проектируют заранее: доминанта, логотип, люди, чистый фон, свет на лицах.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Какой высоты буквы нужны, чтобы прочитать сообщение с 15 метров на ходу?","o":["Около 3 см — стандартный кегль заголовка в полиграфии, увеличенный вдвое","Около 8 см: 15 × 0,5","Около 60 см — чем больше, тем лучше при любой дистанции"],"a":1,"w":"Дистанция × 0,5 см; слишком крупно — не влезет сообщение."},{"q":"Клиент прислал 12 преимуществ для фасада. Что делать?","o":["Разместить все мелким кеглем в колонках, сохранив информацию","Оставить на фасаде одно сообщение; преимущества — вблизи на уровне 4","Вынести все 12 в бегущую строку на экране фасада, чтобы не перегружать графику"],"a":1,"w":"Одна мысль на плоскость; остальное — туда, где читают вблизи."},{"q":"В формуле читаемости зачем множитель 0,3 отдельно от 0,5?","o":["0,3 — для логотипа и знаков, 0,5 — для текстовых сообщений на фризе","0,3 — спокойное чтение стоя, 0,5 — на ходу боковым зрением","0,3 — для светлого текста на тёмном фоне, 0,5 — для тёмного на светлом"],"a":1,"w":"На ходу человек читает хуже; стенд читают на ходу."},{"q":"Как сделать стенд фотогеничным?","o":["Вдвое больше прожекторов на максимум: любой кадр с любой точки будет светлым и чётким","Спроектировать один ракурс: доминанта, логотип, люди, чистый фон, свет на лицах","Снимать до открытия, закрыв вход посетителям: кадр без случайных людей и сумок будет чистым"],"a":1,"w":"Кадр проектируют на плане; люди в кадре — признак успеха."}],"rules":["Три секунды: кто, что, зачем заходить — иначе иерархия не работает.","Четыре уровня: логотип 30–40 м, сообщение 10–15 м, продукт 5 м, детали 1–2 м — свои места и размеры.","Высота буквы ≈ дистанция × 0,5 см на ходу; контраст высокий; текст на фото — плашка.","Одна мысль на плоскость; сообщение продаёт выгоду или новость.","Кадр для фото проектируют заранее: доминанта, логотип, люди, чистый фон, свет на лицах."]}},{"id":"u2-2","level":"L2","title":"Свет, цвет, материал и экраны как язык бренда","lead":"Общий, акцентный и контурный свет; температура; LED-экран и шаг пикселя; материал как тон голоса; тренды","concept":"Свет — половина заметности и вся фотогеничность. Три слоя: общий (заливающий) — 300–500 лк на рабочей зоне, чтобы стенд был светлее прохода павильона (там обычно 100–200 лк); акцентный — прожекторы на экспонаты и ресепшн с контрастом 3:1 к общему, чтобы взгляд знал, куда смотреть; контурный/декоративный — подсветка логотипа, лайтбоксы, линейные LED по кромкам, контровой свет на доминанте, отделяющий её от соседей. Температура: 3000 К — тепло, бар и лаунж; 4000 К — нейтрально, лица и продукт; 5000–6500 К — холодно, техника и медицина; смешивать на одном стенде — только осознанно. Лайтбокс (натяжная ткань на профиле с LED-подсветкой) — самый дешёвый способ большой яркой плоскости: ровная засветка требует глубины 80–120 мм и равномерной сетки LED. LED-экраны: шаг пикселя P (мм) задаёт минимальную дистанцию просмотра ≈ P × 1–1,5 м (P2.5 — от 3 м, P3.9 — от 5 м); яркость 800–1500 нит для павильона; контент — короткие циклы 15–30 с без мелкого текста; стоимость аренды — десятки тысяч рублей за м² на выставку, поэтому экран — осознанное решение, а не «чтобы было». Цвет: бренд-цвет на доминанте и акцентах, нейтральный фон (белый, графит, дерево) на 70% плоскостей, не более трёх цветов. Материал — тон голоса: дерево и ткань — тепло и экология; металл, стекло и бетон — технологичность; глянцевый акрил и неон — молодость и ритейл. Тренды 2024–2026, которые видно на площадках: натяжная ткань и лайтбоксы вместо столярки, прозрачные и гибкие LED, минимум текста, зелень и природные материалы, иммерсивные демо-зоны, повторно используемые конструкции, «инстаграмные» точки.","points":[{"h":"Три слоя света и контраст 3:1","t":"Общий — 300–500 лк, равномерно, светлее прохода. Акцентный — на экспонаты, стойку, лица: 3:1 к общему, прожекторы с углом 24–36° с фермы или козырька, не в глаза посетителю. Контурный — логотип, кромки, лайтбоксы, контровой свет доминанты. Правило: сначала решить, что главное, потом куда светить. Свет считают в прожекторах и кВт на стадии концепции."},{"h":"Температура и цвет","t":"3000 К — бар, лаунж, дерево; 4000 К — продукт, лица, ресепшн; 5000–6500 К — техника, медицина, белые объёмы. Один стенд — одна основная температура; вторая — только как зона. Цвет: бренд на доминанте и акцентах (до 30%), нейтральный фон (70%), не более трёх цветов; фирменный цвет в свете (RGB-подсветка) — осторожно, он искажает цвета продукта и лиц."},{"h":"Лайтбоксы и LED-экраны в цифрах","t":"Лайтбокс: ткань на алюминиевом профиле, LED-сетка, глубина 80–120 мм для ровной засветки, 60–120 Вт/м², сертификат на ткань. LED-экран: шаг пикселя P (мм) → минимальная дистанция ≈ P × 1–1,5 м; P2.5–P3.9 для стендов; яркость 800–1500 нит; 300–600 Вт/м²; контент 15–30 с, крупно, без мелкого текста; аренда дорогая — экран должен быть частью сценария, а не обоями."},{"h":"Материал как тон и тренды","t":"Дерево, ткань, зелень — тепло, экология, уют (пищёвка, HoReCa, косметика). Металл, стекло, бетон, белый — технологичность (промышленность, IT, медицина). Акрил, неон, глянец — молодость, ритейл, развлечения. Тренды на площадках: ткань и лайтбоксы вместо столярки, прозрачные/гибкие LED, минимум текста, природные материалы, иммерсивные демо, re-use конструкций, точки для фото. Тренд — повод для выбора, не замена идеи."}],"practice":{"mechanic":"keymoves","points":3,"stem":"Соберите световой сценарий для стенда 100 м² с экспонатом и ресепшн (бар — отдельная зона).","options":[{"id":"k0","text":"Общий свет 300–500 лк на рабочей зоне, светлее прохода","correct":true,"why":"База: стенд должен быть ярче павильона."},{"id":"k1","text":"Акцент на экспонат и стойку 3:1 к общему, прожекторы 24–36° с козырька","correct":true,"why":"Взгляд должен знать, куда смотреть."},{"id":"k2","text":"Контровой свет доминанты и подсветка логотипа","correct":true,"why":"Отделяет от соседей, виден с 40 м."},{"id":"k3","text":"4000 К на продукт и ресепшн, 3000 К только в баре","correct":true,"why":"Одна основная температура, вторая — зоной."},{"id":"k4","text":"Пересчитать свет в прожекторах и кВт до сдачи концепции","correct":true,"why":"Свет — в смете и заявке на электричество."},{"id":"f5","text":"Заливающий свет 1000 лк по всему стенду, чтобы ни один угол не остался тёмным","correct":false,"why":"Пересвет без акцентов: всё одинаково — ничего главного."},{"id":"f6","text":"RGB-подсветка в фирменный цвет на все поверхности и экспонаты","correct":false,"why":"Цветной свет искажает продукт и лица."},{"id":"f7","text":"Прожекторы направить от фасада внутрь, чтобы свет шёл навстречу посетителю","correct":false,"why":"Слепит входящих."},{"id":"f8","text":"Свет решает электрик на монтаже по наличию прожекторов","correct":false,"why":"На монтаже свет уже не спроектировать."}],"reference":"Три слоя (общий 300–500 лк, акцент 3:1, контур/контровой), одна основная температура, свет посчитан в концепции.","anchor":{"g":"cascade","p":{"levels":["общий 300–500 лк: стенд светлее прохода","акцент 3:1: экспонат, стойка, лица","контур: лого, кромки, лайтбокс, контровой"],"hl":1},"cap":"три слоя света"},"id":"u2-2-p"},"test":[{"mechanic":"single","points":2,"stem":"Экран P2.5 стоит на фасаде, ближайшая точка просмотра — проход в 1,5 м. Что произойдёт?","options":[{"id":"o0","text":"На 1,5 м видна пиксельная сетка: P2.5 смотрят от 3 м; отодвинуть экран вглубь или взять P1.9","correct":true,"rationale":"Дистанция ≈ шаг × 1–1,5 м."},{"id":"o1","text":"Ничего: P2.5 — мелкий шаг, при яркости от 800 нит пиксели сливаются с любой дистанции, хоть с 1 м","correct":false,"rationale":"Яркость не убирает сетку."},{"id":"o2","text":"Экран будет слепить: на 1,5 м яркость снижают до 200 нит и ставят матовый рассеиватель","correct":false,"rationale":"Яркость — отдельная настройка, проблема в шаге."},{"id":"o3","text":"Нужен P4: чем крупнее шаг пикселя, тем мягче картинка вблизи и дешевле аренда","correct":false,"rationale":"Наоборот: крупнее шаг — заметнее сетка."}],"anchor":{"g":"formula","p":{"f":"D_min ≈ P × (1…1,5) м   ·   P2.5 → от 3 м · P3.9 → от 5 м","sub":"шаг пикселя решается по дистанции просмотра","fs":12},"cap":"экран — по дистанции, не по бюджету"},"id":"u2-2-t0"},{"mechanic":"single","points":2,"stem":"Клиент просит «фирменный синий свет на весь стенд, чтобы бренд был везде». Что ответить?","options":[{"id":"o0","text":"Бренд-цвет — на доминанту, лайтбокс и акценты; на продукт и лица — 4000 К, иначе всё посинеет","correct":true,"rationale":"Цветной свет искажает то, ради чего стенд."},{"id":"o1","text":"Согласиться: RGB-лента стоит копейки, а синий стенд виден с другого конца павильона — узнаваемость максимальная","correct":false,"rationale":"Продукт и лица будут синими на всех фото."},{"id":"o2","text":"Предложить синий ковролин и подиум вместо света: цвет на полу читается издалека и не искажает лица","correct":false,"rationale":"Пол не виден через толпу."},{"id":"o3","text":"Отказаться от бренд-цвета вовсе: на выставке работает только белый свет 4000 К, цвет даёт графика","correct":false,"rationale":"Бренд-цвет нужен — в правильных местах."}],"anchor":{"g":"stack2","p":{"rows":[["нейтральный фон",70],["бренд-цвет: доминанта, акценты",25],["второй акцент",5]]},"cap":"70 / 25 / 5 — цвет по долям"},"id":"u2-2-t1"},{"mechanic":"single","points":2,"stem":"На стенде бар с тёплым светом 3000 К и соседняя демо-зона с 6500 К. Как это выглядит?","options":[{"id":"o0","text":"Как два стенда: температуры зонами допустимы, но нужен переход — общий 4000 К, акценты по зонам","correct":true,"rationale":"Одна основная температура, вторая — осознанной зоной."},{"id":"o1","text":"Отлично: контраст 3000 и 6500 К подчёркивает разницу зон — бар тёплый, демо холодное, это и есть зонирование","correct":false,"rationale":"Без общей базы контраст читается как ошибка."},{"id":"o2","text":"Нормально, если прожекторы одной марки и мощности: разница в 3500 К глазом почти незаметна","correct":false,"rationale":"3000 vs 6500 К — заметна любому."},{"id":"o3","text":"Проблема только для фото: вживую глаз адаптируется за секунды, а баланс белого на съёмке поправят","correct":false,"rationale":"Глаз адаптируется к одной температуре, не к двум рядом."}],"anchor":{"g":"compare","p":{"a":["3000 К бар","тепло, дерево"],"b":["6500 К демо","холодно, техника"],"verdict":"общий 4000 К + акценты по зонам"},"cap":"температура — одна основная"},"id":"u2-2-t2"},{"mechanic":"single","points":2,"stem":"Какой тренд стоит применять осторожно, если бюджет ограничен, а идея уже сильная?","options":[{"id":"o0","text":"LED-стена на весь фасад: аренда дорога, контент нужен отдельный, без идеи — просто обои","correct":true,"rationale":"Экран — часть сценария, не замена идее."},{"id":"o1","text":"Натяжная ткань и лайтбоксы вместо столярки: ткань выцветает, швы видны с 3 м — без столярки стенд дешевеет","correct":false,"rationale":"Это экономный тренд, он помогает бюджету."},{"id":"o2","text":"Минимум текста на плоскостях: без перечня преимуществ посетитель не поймёт продукт и уйдёт к соседу","correct":false,"rationale":"Бесплатно и усиливает идею."},{"id":"o3","text":"Повторно используемые конструкции для серии выставок: за два-три монтажа теряют вид, клиент заметит потёртости","correct":false,"rationale":"Экономит на следующих проектах."}],"anchor":{"g":"quad","p":{"x":"стоимость","y":"эффект при сильной идее","pts":[["ткань/лайтбокс",0.2,0.8],["минимум текста",0.05,0.7],["LED-стена",0.9,0.5],["re-use",0.3,0.6]],"hl":2},"cap":"тренд — повод, не замена идеи"},"id":"u2-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре распределения сметы света и экранов на стенде 100 м² (бюджет на свет и AV 15%). Какой разумен?","vopts":[{"id":"v0","v":{"g":"estv","p":{"rows":[["общий свет",35],["акцент",30],["лайтбокс",25],["экран P2.5 2 м²",10]],"note":"три слоя + небольшой экран"}},"lbl":"","correct":true,"rationale":"Общий, акцент, контур — и экран как часть сценария, а не обоев."},{"id":"v1","v":{"g":"estv","p":{"rows":[["общий свет",10],["LED-стена 12 м²",90]],"warn":true,"note":"экран съел свет"}},"lbl":"","correct":false,"rationale":"Без акцентного света экспонат и лица в тени; экран без контента — обои."},{"id":"v2","v":{"g":"estv","p":{"rows":[["общий свет 1000 лк",100]],"warn":true,"note":"только заливка"}},"lbl":"","correct":false,"rationale":"Всё одинаково ярко — ничего главного."},{"id":"v3","v":{"g":"estv","p":{"rows":[["RGB-подсветка",60],["общий свет",40]],"warn":true,"note":"цветной свет везде"}},"lbl":"","correct":false,"rationale":"Цветной свет искажает продукт и лица."}],"id":"u2-2-t4"}],"framework":"Три слоя света: общий 300–500 лк, акцент 3:1 на экспонат и лица, контур/контровой на доминанту. Температура одна основная (4000 К), вторая — зоной. Лайтбокс — дешёвая большая яркая плоскость (глубина 80–120 мм). LED-экран: дистанция ≈ шаг × 1–1,5 м, 800–1500 нит, контент 15–30 с. Цвет 70/25/5. Материал — тон голоса. Тренды — повод, не замена идеи.","anchor":{"g":"cascade","p":{"levels":["общий 300–500 лк","акцент 3:1","контур и контровой","экран: P × 1–1,5 м"],"hl":1},"cap":"свет — половина заметности и вся фотогеничность"},"layers":{"simple":"Свет на стенде — как в театре: общий, чтобы было видно сцену; направленный, чтобы знать, на кого смотреть; и контур, чтобы главный герой отделился от задника. Если всё залито одинаково ярко — главного нет.\nУ света есть «температура»: тёплый — для бара и дерева, нейтральный — для лиц и продукта, холодный — для техники. Смешивать на одном стенде можно только зонами и осознанно. Фирменный синий свет на всё — и продукт синий, и лица синие.\nЭкран — не обои. У него есть шаг пикселя: чем ближе смотрят, тем мельче нужен шаг (P2.5 — не ближе трёх метров). И он дорогой: без сценария и контента — выброшенные деньги. Самая дешёвая большая яркая плоскость — лайтбокс из ткани.\nПроверь себя: экран P2.5 стоит в полутора метрах от прохода — что увидит посетитель?","how":"1. Три слоя: общий 300–500 лк (светлее прохода, где 100–200) → акцент 3:1 (экспонат, стойка, лица; прожекторы 24–36° с козырька/фермы, не в глаза) → контур (логотип, кромки, лайтбокс, контровой свет доминанты).\n2. Температура: 3000 К бар/лаунж, 4000 К продукт/лица, 5000–6500 К техника; одна основная, вторая зоной.\n3. Лайтбокс: ткань на профиле, LED-сетка, глубина 80–120 мм, 60–120 Вт/м², сертификат. LED-экран: D_min ≈ P × 1–1,5 м; P2.5–P3.9; 800–1500 нит; 300–600 Вт/м²; контент 15–30 с крупно; аренда дорогая → экран как часть сценария.\n4. Цвет: 70% нейтральный фон, 25% бренд (доминанта, акценты), 5% второй акцент; цветной свет — осторожно.\n5. Материал как тон: дерево/ткань/зелень — тепло; металл/стекло/бетон — технологии; акрил/неон/глянец — ритейл и молодость.\n6. Тренды на площадках: ткань и лайтбоксы, прозрачные и гибкие LED, минимум текста, природные материалы, иммерсивные демо, re-use, точки для фото. Пример: стенд 100 м² — 30 прожекторов (12 общий, 14 акцент, 4 контровой), лайтбокс 6 м², экран P2.5 2 м² в демо-зоне в 4 м от прохода, 4000 К везде, 3000 К в баре.","formula":{"f":"свет = общий (300–500 лк) + акцент (3:1) + контур/контровой\nD_min экрана ≈ P (мм) × 1…1,5 м   ·   цвет 70 / 25 / 5","legend":[["лк","освещённость рабочей зоны","300–500 (проход 100–200)"],["3:1","контраст акцента к общему","экспонат, стойка, лица"],["К","температура: 3000 тепло · 4000 нейтр. · 6500 холод","одна основная"],["P","шаг пикселя LED-экрана, мм","P2.5 → от 3 м"],["нит","яркость экрана для павильона","800–1500"],["70/25/5","доли фона, бренд-цвета, второго акцента","нейтральный фон"]],"note":"Свет и экраны считаются в концепции (прожекторы, кВт, м² экрана), а не на монтаже: на монтаже их уже не спроектировать."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Три слоя света: общий 300–500 лк, акцент 3:1, контур/контровой; сначала что главное, потом куда светить.\n— Температура: одна основная (4000 К), вторая — зоной; цветной свет — только на поверхности, не на продукт и лица.\n— Лайтбокс — дешёвая большая яркая плоскость; LED-экран — по дистанции (шаг × 1–1,5 м) и со сценарием.\n— Цвет 70/25/5; материал — тон голоса бренда.\n— Тренды — повод для выбора, не замена идеи; свет и экраны считаются в концепции.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Экран P2.5 стоит в полутора метрах от прохода — что увидит посетитель?","o":["Пиксельную сетку: P2.5 смотрят от 3 м","Ничего плохого: при 800 нит пиксели не различимы с любой дистанции","Слишком яркую картинку: нужно снизить яркость до 200 нит"],"a":0,"w":"Дистанция ≈ шаг × 1–1,5 м; шаг выбирают по дистанции."},{"q":"Фирменный синий свет на весь стенд?","o":["Да: RGB-лента стоит копейки, а синий стенд виден с конца павильона — узнаваемость максимальная","Нет: бренд-цвет на доминанту и акценты, свет на продукт и лица — 4000 К","Да, но смешать с тёплым 3000 К, чтобы синий не выглядел холодным и лица не серели"],"a":1,"w":"Цветной свет искажает то, ради чего стенд."},{"q":"В формуле света зачем контраст 3:1?","o":["Чтобы стенд был втрое ярче общего света павильона и выделялся среди соседей","Чтобы взгляд знал, куда смотреть: акцент на главное","Это норма площадки: акцентный свет не ярче трёх общих"],"a":1,"w":"Равномерная заливка — ничего главного."},{"q":"Самая дешёвая большая яркая плоскость?","o":["LED-экран P3.9: аренда на три дня стоит недорого","Лайтбокс из натяжной ткани с LED-подсветкой","Крашеная стена с прожектором"],"a":1,"w":"Ткань на профиле: глубина 80–120 мм, 60–120 Вт/м²."}],"rules":["Три слоя света: общий 300–500 лк, акцент 3:1, контур/контровой; сначала что главное, потом куда светить.","Температура: одна основная (4000 К), вторая — зоной; цветной свет — только на поверхности, не на продукт и лица.","Лайтбокс — дешёвая большая яркая плоскость; LED-экран — по дистанции (шаг × 1–1,5 м) и со сценарием.","Цвет 70/25/5; материал — тон голоса бренда.","Тренды — повод для выбора, не замена идеи; свет и экраны считаются в концепции."]}},{"id":"u3-1","level":"L3","title":"Материалы: из чего это сделают и сколько это стоит","lead":"ЛДСП, МДФ, фанера, металл, акрил, стекло, ткань, печать, плёнка, фрезеровка — свойства, сроки, цена","concept":"Арт-директор выбирает материал как слово: по смыслу, цене и срокам. ЛДСП 16–22 мм — основа столярки: дёшево, лист 2800×2070, кромка ПВХ, не красится, не гнётся, видно стыки — хорош для каркасов, стоек, подсобок, крашеные поверхности на нём не делают. МДФ 16–19 мм — под окраску (грунт + 2 слоя, 7–10 дней сушки) и фрезеровку (объёмные буквы, рельефы, радиусы по фрезерованным пропилам); дороже ЛДСП в 1,5–2 раза, боится воды. Фанера 10–18 мм — прочность, гибкие формы (ламинация полосами), «честная» фактура под лак; берёзовая ФК/ФСФ, лист 1525×1525 или 2440×1220. Металл: сварной каркас из трубы, порошковая окраска (неделя), листовой алюминий, сетка, перфорация — высота, консоли, долговечность, вес. Акрил (оргстекло) 3–10 мм: молочный для лайтбоксов и подсветки букв, прозрачный для витрин, лазерная резка; царапается, дорогой в толщинах. Стекло — только закалённое, витрины и перегородки, тяжёлое, доставка и монтаж специалистами. Пластики и композит (ПВХ 3–10 мм, алюминиевый композит) — лёгкие фасады, печать напрямую, быстрый монтаж. Ткань: натяжные полотна на профиле (лайтбоксы, стены, потолки) — самый быстрый и лёгкий материал, печать сублимацией, нужен сертификат горючести. Печать: интерьерная на самоклейке и панелях (720–1440 dpi, читается с 0,5 м), баннерная/сольвентная (360–720 dpi, с 2–3 м), УФ-печать по жёстким листам; плёнки Oracal и аналогов — цветные поверхности и надписи без печати, матовые/глянцевые, со сроком оклейки. Фрезеровка ЧПУ — объёмные буквы, рельефы, ажурные панели из МДФ/фанеры/акрила/композита: цена зависит от длины реза и смены фрез. Декоративные решения: зелень (стабилизированный мох, искусственные растения), светодиодная лента, зеркала, 3D-панели. Правило: материал выбирают по дистанции восприятия (с 10 м МДФ и ЛДСП с плёнкой неразличимы), по срокам (краска сохнет, металл красится неделю) и по бюджету (цена за м² различается в 3–5 раз).","points":[{"h":"Листовые: ЛДСП, МДФ, фанера","t":"ЛДСП — каркасы, стойки, подсобки, прямые плоскости под плёнку; не красить, не гнуть, кромка ПВХ. МДФ — окраска (7–10 дней с сушкой), фрезеровка, радиусы; дороже, боится воды. Фанера — прочность, гнутые формы ламинацией, честная фактура под лак, тонкие ажурные панели. Размеры листов определяют разузловку: ЛДСП 2800×2070, фанера 2440×1220 / 1525×1525, МДФ 2800×2070."},{"h":"Металл, акрил, стекло, пластики","t":"Металл: сварной каркас (труба 40×40, 60×40), порошковая окраска — неделя; листовой алюминий, перфорация, сетка — для высоты, консолей и «технологичного» тона. Акрил: молочный 3–5 мм для подсветки, прозрачный для витрин; лазерная резка; царапается. Стекло — только закалённое, тяжёлое, со спец-монтажом. ПВХ и композит — лёгкие фасады с прямой печатью, быстро, недорого, с 5 м выглядят как «материал»."},{"h":"Ткань, печать, плёнка, фрезеровка","t":"Натяжная ткань на профиле: лайтбоксы, стены, потолки, сублимация — быстро, легко, многоразово, сертификат. Печать: интерьерная 720–1440 dpi (вблизи), баннер 360–720 (с 2–3 м), УФ по листам. Плёнка: цвет без печати, матовая/глянцевая, оклейка панелей в цеху. Фрезеровка ЧПУ: буквы, рельефы, ажур — цена по длине реза; объёмные буквы с подсветкой — акрил + ПВХ/композит."},{"h":"Выбор по дистанции, срокам, бюджету","t":"С 10 м ЛДСП с плёнкой и крашеный МДФ неразличимы; вблизи — да. Сроки: окраска МДФ 7–10 дней, порошковая окраска металла 5–7, печать 2–3, ткань 3–5, фрезеровка 2–5. Бюджет на м² поверхности: ЛДСП с плёнкой ≈ 1×, крашеный МДФ 1,5–2×, фрезерованный МДФ 3–5×, металл 3–6×, стекло 5–8×, ткань-лайтбокс 2–3× (с подсветкой). Дорогие материалы — туда, где их потрогают: ресепшн, переговорные, экспонат."}],"practice":{"mechanic":"matching","points":3,"stem":"Соедините задачу на стенде с подходящим материалом.","pairs":[{"l":"Каркас подсобки и стоек, прямые плоскости под плёнку","r":"ЛДСП 16 мм с кромкой ПВХ"},{"l":"Фрезерованный логотип и радиусная стойка ресепшн под окраску","r":"МДФ 18 мм, окраска, 7–10 дней"},{"l":"Большая яркая плоскость 6×3 м за три дня монтажа","r":"Натяжная ткань на профиле с LED-подсветкой"},{"l":"Башня 5,5 м с консолью под экран","r":"Сварной металлокаркас, порошковая окраска"},{"l":"Объёмные буквы с внутренней подсветкой","r":"Молочный акрил + ПВХ/композит, лазерная резка"}],"solution":"Материал — по задаче: прямое и скрытое — ЛДСП; крашеное и фрезерованное — МДФ; большое и быстрое — ткань; высокое и несущее — металл; светящееся — акрил.","anchor":{"g":"tree","p":{"root":"материал по задаче","kids":["ЛДСП: каркас","МДФ: окраска, фреза","ткань: большое","металл: высота","акрил: свет"]},"cap":"материал — по задаче, дистанции и сроку"},"id":"u3-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Дизайнер заложил крашеную стену 12×3,5 м из МДФ. До монтажа 12 дней. Что предложить?","options":[{"id":"o0","text":"Ткань-лайтбокс или ЛДСП с плёнкой: окраска МДФ не успеет, а с 10 м разницы не видно","correct":true,"rationale":"Срок окраски 7–10 дней плюс производство — не укладываемся."},{"id":"o1","text":"Красить МДФ на монтаже в павильоне: сэкономим 7–10 дней цеховой сушки, грунт нанесём в цеху заранее","correct":false,"rationale":"Запах и пыль в павильоне, краска не высохнет, регламент запрещает."},{"id":"o2","text":"Оставить МДФ, но покрасить в один слой без грунта: сушка сократится до 2–3 дней, тон тот же","correct":false,"rationale":"Полосы, пятна, видна фактура — брак на фото."},{"id":"o3","text":"Договориться с площадкой о монтаже на день позже: 13 дней на окраску и производство достаточно","correct":false,"rationale":"Площадка графики не двигает."}],"anchor":{"g":"compare","p":{"a":["МДФ окраска","7–10 дней сушки"],"b":["ткань / плёнка","3–5 дней, с 10 м неотличимо"],"verdict":"срок решает материал"},"cap":"с 10 м материал неразличим"},"id":"u3-1-t0"},{"mechanic":"single","points":2,"stem":"Чем ЛДСП принципиально ограничен по сравнению с МДФ?","options":[{"id":"o0","text":"Не красится и не фрезеруется в радиусы: только прямые плоскости с кромкой и плёнкой","correct":true,"rationale":"ЛДСП — каркас и прямые плоскости; МДФ — краска и форма."},{"id":"o1","text":"Слишком тяжёл для стендов: лист 16 мм 2800×2070 весит вдвое больше МДФ той же толщины","correct":false,"rationale":"Плотности близки."},{"id":"o2","text":"Запрещён на выставках по пожарным нормам: формальдегидная смола даёт класс горючести Г4","correct":false,"rationale":"Нет такого запрета."},{"id":"o3","text":"Поставляется только в белом и сером декоре: любой другой цвет — это оклейка плёнкой в цеху","correct":false,"rationale":"Десятки декоров, но дело не в цвете."}],"anchor":{"g":"compare","p":{"a":["ЛДСП","прямо, кромка, плёнка, дёшево"],"b":["МДФ","окраска, фреза, радиусы, 1,5–2×"],"verdict":"по задаче, не по привычке"},"cap":"ЛДСП — каркас, МДФ — форма"},"id":"u3-1-t1"},{"mechanic":"single","points":2,"stem":"Где на стенде разумно применить дорогие материалы (натуральный шпон, металл, стекло)?","options":[{"id":"o0","text":"Там, где их потрогают и увидят вблизи: ресепшн, переговорные, подиум экспоната","correct":true,"rationale":"Дорогое — на дистанции касания."},{"id":"o1","text":"На верхней трети доминанты: её видно с 40 м, значит, материал должен быть лучшим","correct":false,"rationale":"С 40 м шпон и плёнка неразличимы."},{"id":"o2","text":"Равномерно по всему стенду, чтобы не было контраста между зонами","correct":false,"rationale":"Бюджет улетит на невидимое."},{"id":"o3","text":"На обратной стороне к соседям по регламенту чистовой отделки","correct":false,"rationale":"Чистовая отделка — крашеное или плёнка, не шпон."}],"anchor":{"g":"elev","p":{"h":5,"maxH":5,"items":[["доминанта: плёнка/ткань",4.3],["стены: ЛДСП + плёнка",3],["ресепшн: шпон, металл",1.1]],"dist":10},"cap":"дорогое — на дистанции касания"},"id":"u3-1-t2"},{"mechanic":"single","points":2,"stem":"Какая печать нужна для графики на стойке ресепшн, которую читают с 0,5 м, и для баннера на фризе 4 м?","options":[{"id":"o0","text":"Стойка — интерьерная 720–1440 dpi на панель; фриз — баннерная 360–720 dpi или ткань","correct":true,"rationale":"Разрешение по дистанции восприятия."},{"id":"o1","text":"Везде интерьерная 1440 dpi на панелях: качество лишним не бывает, разница в цене 10–15%","correct":false,"rationale":"Для фриза — переплата; и баннерный материал бывает только в сольвенте."},{"id":"o2","text":"Везде баннерная 360–720 dpi на самоклейке: с полуметра растр уже не читается глазом","correct":false,"rationale":"С 0,5 м видно точки."},{"id":"o3","text":"Разрешение задаёт типография по профилю своего плоттера: арт-директор согласует только цвет","correct":false,"rationale":"Арт-директор отвечает за результат вблизи."}],"anchor":{"g":"formula","p":{"f":"dpi по дистанции: 0,5 м → 720–1440 · 2–3 м → 360–720 · 10 м → 150–360","sub":"материал и разрешение — по тому, откуда смотрят","fs":11},"cap":"печать — по дистанции"},"id":"u3-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре бюджета материалов стенда 100 м² (доля от сметы конструктива). Какой распределяет деньги по дистанции восприятия?","vopts":[{"id":"v0","v":{"g":"estv","p":{"rows":[["ЛДСП+плёнка стены",45],["ткань-лайтбокс",20],["МДФ окраска ресепшн",20],["металл доминанта",15]],"note":"дорогое — вблизи и несущее"}},"lbl":"","correct":true,"rationale":"Каркас и фон — дёшево, ресепшн — краска, доминанта — металл, большая плоскость — ткань."},{"id":"v1","v":{"g":"estv","p":{"rows":[["шпон все стены",70],["ткань",10],["металл",20]],"warn":true,"note":"шпон на всё"}},"lbl":"","correct":false,"rationale":"Шпон на стенах, которых не касаются, — деньги в невидимое."},{"id":"v2","v":{"g":"estv","p":{"rows":[["ЛДСП без кромки",90],["печать",10]],"warn":true,"note":"всё ЛДСП"}},"lbl":"","correct":false,"rationale":"Ресепшн и доминанта из ЛДСП без кромки — видно стыки и торцы вблизи."},{"id":"v3","v":{"g":"estv","p":{"rows":[["стекло",50],["металл",50]],"warn":true,"note":"стекло и металл"}},"lbl":"","correct":false,"rationale":"Тяжело, дорого, долго; половина сметы — на перегородки."}],"id":"u3-1-t4"}],"framework":"ЛДСП — каркас и прямые плоскости (плёнка, кромка); МДФ — окраска и фрезеровка (7–10 дней); фанера — прочность и гнутые формы; металл — высота и консоли (порошковая окраска неделя); акрил — подсветка; стекло — закалённое; ткань — большие плоскости быстро (сертификат); печать и плёнка — по дистанции; фрезеровка — по длине реза. Дорогое — туда, где потрогают.","anchor":{"g":"tree","p":{"root":"материалы","kids":["ЛДСП","МДФ","фанера","металл","акрил","ткань","печать"]},"cap":"материал как слово: смысл, цена, срок"},"layers":{"simple":"Материалы на стенде — как ткани в костюме: снаружи видна только фактура, а изнутри важно, держит ли форму и сколько стоит. Скрытый каркас и стены — из самого дешёвого листа (ЛДСП). То, что красят и гнут, — из МДФ, и он сохнет неделю. Всё высокое и нависающее — металл.\nБольшую яркую плоскость быстрее и дешевле всего сделать из натянутой ткани с подсветкой. Светящиеся буквы — акрил. Стекло — только закалённое и только если очень нужно: тяжёлое и дорогое.\nС десяти метров крашеный МДФ и ЛДСП с плёнкой выглядят одинаково. Поэтому дорогие материалы кладут туда, где их потрогают: стойка, переговорная, подиум экспоната. А печать выбирают по дистанции: вблизи — чёткая, на фриз — баннерная.\nПроверь себ
