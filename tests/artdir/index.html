<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Арт-директор выставочных проектов · интенсив 10 часов (v1.0.1)</title>
<style>
:root{
  --paper:#f3f5f0; --paper2:#eaede6; --card:#ffffff; --card2:#f7f8f4;
  --line:#d8ddd3; --line2:#bfc6ba;
  --ink:#141c26; --muted:#5b6774; --faint:#8a95a1;
  --a:#2a5bd7; --a-soft:rgba(42,91,215,.10); --a-line:rgba(42,91,215,.35);
  --b:#e8782a; --b-hot:#f59a4f; --b-deep:#c45f17; --b-soft:rgba(232,120,42,.12); --b-line:rgba(232,120,42,.4);
  --ok:#1b8f5c; --ok-soft:rgba(27,143,92,.12); --err:#c93b3b; --err-soft:rgba(201,59,59,.10);
  --gold:#b58a10; --gold-soft:rgba(181,138,16,.14);
  --grid:rgba(42,91,215,.07);
  --r:14px; --r-sm:10px; --shadow:0 2px 10px rgba(20,28,38,.06);
  --maxw:680px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --disp:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --paper:#0f1620; --paper2:#141d29; --card:#182230; --card2:#1d2837;
  --line:#2a3647; --line2:#3b495c;
  --ink:#e8edf3; --muted:#9aa7b6; --faint:#6b7786;
  --a:#7ea3ff; --a-soft:rgba(126,163,255,.14); --a-line:rgba(126,163,255,.4);
  --b:#ff9a4d; --b-hot:#ffb36f; --b-deep:#d9701f; --b-soft:rgba(255,154,77,.14); --b-line:rgba(255,154,77,.45);
  --ok:#4fd48f; --ok-soft:rgba(79,212,143,.14); --err:#ff7676; --err-soft:rgba(255,118,118,.12);
  --gold:#f0c24a; --gold-soft:rgba(240,194,74,.14);
  --grid:rgba(126,163,255,.06);
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--font);min-height:100vh;min-height:100dvh;overflow-x:hidden}
html.has-sheet,html.has-sheet body{overflow:hidden}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 60%,transparent);mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 60%,transparent)}
#app{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:12px 16px calc(44px + env(safe-area-inset-bottom))}
h1,h2,h3{line-height:1.22;margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.005em}
h2{font-size:23px} h3{font-size:19px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.93em}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}
a{color:var(--a)}
.small{font-size:13.5px} .muted{color:var(--muted)} .faint{color:var(--faint)}
.ok-c{color:var(--ok)} .err-c{color:var(--err)} .gold-c{color:var(--gold)} .a-c{color:var(--a)} .b-c{color:var(--b)}
.top{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.brand{font-family:var(--disp);font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand i{font-style:normal;display:inline-block;padding:0 5px;border-radius:6px;margin-right:3px;font-family:var(--mono);font-size:13px;font-weight:700}
.brand .ia{background:var(--a);color:#fff} .brand .ib{background:var(--b);color:#fff}
.top .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:650;white-space:nowrap}
.chip.hot{color:var(--b-deep)} .chip.xp{color:var(--a)}
.ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);font-size:16px;position:relative}
.ico.fs{font-size:12px;font-weight:800;font-family:var(--mono)}
.ico .bdg{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--b);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.card.tight{padding:12px 14px}
.card.note{background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.pill.a{background:var(--a-soft);color:var(--a);border-color:var(--a-line)}
.pill.b{background:var(--b-soft);color:var(--b-deep);border-color:var(--b-line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--b);color:#fff;font-weight:700;font-size:16px;border-radius:12px;padding:13px 20px;box-shadow:0 3px 0 var(--b-deep);transition:transform .08s,box-shadow .08s;user-select:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--b-deep)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line2);border:1px solid var(--line)}
.btn.blue{background:var(--a);box-shadow:0 3px 0 #1d3f99}
.btn.wide{width:100%} .btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn.xs{padding:5px 10px;font-size:12.5px;border-radius:8px;box-shadow:none}
.ladder{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);border-radius:var(--r);padding:16px 16px 10px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.ladder h2{font-size:21px;margin-bottom:2px}
.ladder .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.rung{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed var(--line);text-align:left;width:100%}
.rung:last-child{border-bottom:1px dashed var(--line)}
.rung .n{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:800;border:2px solid var(--line2);color:var(--muted);background:var(--card)}
.rung.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rung.cur .n{background:var(--b);border-color:var(--b);color:#fff;box-shadow:0 0 0 4px var(--b-soft)}
.rung.lock{opacity:.5}
.rung .t{flex:1;min-width:0}
.rung .t b{display:block;font-size:15px}
.rung .t span{font-size:12.5px;color:var(--muted)}
.rung .pc{font-family:var(--mono);font-size:12.5px;color:var(--faint);min-width:44px;text-align:right}
.bar{height:7px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;margin:8px 0;box-shadow:var(--shadow)}
.rowbtn:active{background:var(--card2)}
.rowbtn .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--card2);border:1px solid var(--line);flex:0 0 auto}
.rowbtn .tt{flex:1;min-width:0}
.rowbtn .tt b{display:block;font-size:15px}
.rowbtn .tt span{font-size:12.5px;color:var(--muted);display:block}
.rowbtn .tt b .sym{display:inline-block;width:auto;font-size:11px;color:var(--a);margin-left:6px}
.rowbtn .st{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:var(--faint);font-family:var(--mono);white-space:nowrap}
.rowbtn.done{border-color:rgba(27,143,92,.35)}
.rowbtn.lock{opacity:.55}
.grp{margin:14px 0 4px;font-family:var(--disp);font-size:17px;display:flex;align-items:baseline;gap:8px}
.grp .cnt{font-family:var(--mono);font-size:12px;color:var(--faint)}
.playtop{display:flex;align-items:center;gap:10px;padding:8px 0 10px;position:sticky;top:0;z-index:20;background:var(--paper);margin:0 -2px;padding-left:2px;padding-right:2px}
.playtop .tools{display:flex;gap:6px;flex:0 0 auto;position:relative}
.playtop .x .bdg{position:absolute;top:-4px;right:-4px;background:var(--b);color:#fff;font-size:10px;line-height:1;padding:2px 5px;border-radius:99px;font-weight:700}
.playtop .x{position:relative;cursor:pointer;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;flex:0 0 auto}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--paper2);border:1px solid var(--line)}
.segs i.on{background:var(--b);border-color:transparent}
.segs i.ok{background:var(--ok);border-color:transparent}
.segs i.bad{background:var(--err);border-color:transparent;opacity:.7}
.combo{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--b-deep);min-width:40px;text-align:right}
.theory h3{margin-bottom:8px}
.theory p{margin:0;white-space:pre-wrap;font-size:16px;line-height:1.6}
.theory .fr{font-size:12.5px;color:var(--a);font-weight:700;margin-bottom:6px}
.stem{font-size:17px;font-weight:600;margin:0 0 8px;white-space:pre-wrap;line-height:1.5}
.mech{font-size:12px;font-weight:700;color:var(--a);margin-bottom:8px}
.hint{font-size:13px;color:var(--faint);margin:-2px 0 8px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 13px;margin:8px 0;font-size:15px;line-height:1.45;transition:border-color .12s,background .12s;flex-wrap:wrap}
.opt:not(:disabled):hover{border-color:var(--line2)}
.opt .key{width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;color:var(--muted);margin-top:1px;font-family:var(--mono)}
.opt>span:not(.key):not(.ord){flex:1;min-width:0}
.opt.sel{border-color:var(--a);background:var(--a-soft)}
.opt.sel .key{border-color:var(--a);color:var(--a)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .key{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--err);background:var(--err-soft)}
.opt.bad .key{border-color:var(--err);color:var(--err)}
.opt.miss{border-color:var(--gold);background:var(--gold-soft)}
.opt.dim{opacity:.6}
.opt .ord{margin-left:auto;font-weight:800;color:var(--b-deep);font-family:var(--mono);min-width:28px;text-align:right}
.why{font-size:14px;line-height:1.5;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:block;width:100%;flex-basis:100%}
.fbk{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.fbk b{display:block;margin-bottom:2px}
.fbk.ok{background:var(--ok-soft);border:1px solid rgba(27,143,92,.35)}
.fbk.mid{background:var(--gold-soft);border:1px solid rgba(181,138,16,.35)}
.fbk.bad{background:var(--err-soft);border:1px solid rgba(201,59,59,.35)}
.sol{margin-top:10px;padding:10px 12px;border-left:3px solid var(--a);background:var(--card2);border-radius:8px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.numin{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:12px;padding:12px 14px;font-size:20px;font-family:var(--mono)}
.pretag{display:inline-block;font-size:12.5px;color:var(--b-deep);background:var(--b-soft);border-radius:8px;padding:4px 10px;margin-bottom:10px;font-weight:650}
.pretag.redo{color:var(--a);background:var(--a-soft)}
.tl{border-bottom:1px dotted var(--a);color:inherit;cursor:pointer}
.tl:hover{color:var(--a)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.reveal{animation:rv .25s ease-out}
@keyframes rv{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.elab{margin-top:12px;padding:12px;border-radius:12px;background:var(--card2);border:1px dashed var(--line2)}
.elab b{display:block;margin-bottom:6px}
.conf{display:flex;gap:6px;align-items:center;margin:0 0 10px;font-size:13px;flex-wrap:wrap}
.meters{display:flex;gap:8px;margin:8px 0 12px}
.meter{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.meter .l{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.meter .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .bar{margin-top:5px}
.meter .bar i{background:var(--a)} .meter.m2 .bar i{background:var(--ok)} .meter.m3 .bar i{background:var(--b)}
.rank{font-family:var(--disp);font-size:56px;line-height:1;color:var(--b);text-align:center;margin:8px 0}
.lab{border:1px solid var(--a-line);background:linear-gradient(180deg,var(--card),var(--card2));border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.lab h3{margin-bottom:4px}
.fld{margin:10px 0}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.res .big{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.2;word-break:break-word}
.res .k{font-size:12.5px;color:var(--muted)}
.ab2{display:flex;gap:10px;margin-top:8px}
.ab2>div{flex:1;border-radius:10px;padding:10px;border:1px solid var(--line);min-width:0}
.ab2 .va{border-color:var(--a-line);background:var(--a-soft)} .ab2 .vb{border-color:var(--b-line);background:var(--b-soft)}
.ab2 b{font-family:var(--mono);font-size:20px;display:block}
.ab2 .k{font-size:12px;color:var(--muted);display:block}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
.kbd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kbd button{height:44px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:18px;font-family:var(--mono)}
.kbd button.op{background:var(--a-soft);color:var(--a)}
.kbd button.eq{background:var(--b);color:#fff;grid-column:span 2;font-weight:700}
.kbd button.fn{background:var(--gold-soft);color:var(--gold)}
.ovl{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(14,22,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fd .18s ease-out;-webkit-tap-highlight-color:transparent}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet{position:relative;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:var(--maxw);max-height:88vh;max-height:88dvh;overflow:hidden;box-shadow:0 -8px 30px rgba(20,28,38,.18);-webkit-transform:translateZ(0);transform:translateZ(0)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:99px;background:var(--line2)}
.sheet-tt{flex:1;min-width:0;padding-top:6px}
.sheet-t{font-family:var(--disp);font-size:19px;font-weight:600;line-height:1.25}
.sheet-x{flex:0 0 auto;width:36px;height:36px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;margin-top:4px}
.sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 16px;background:var(--card);overscroll-behavior:contain}
.sheet-f{flex:0 0 auto;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sheet.confirm{border-radius:20px;border-bottom:1px solid var(--line);margin:0 12px calc(12px + env(safe-area-inset-bottom));max-width:480px}
.sheet.confirm .sheet-b{padding:18px}
@media (min-width:700px){.ovl{align-items:center;padding:24px}.sheet{border-radius:20px;border-bottom:1px solid var(--line);max-height:80vh;max-height:80dvh;box-shadow:var(--shadow)}.sheet-h::before{display:none}.sheet-tt{padding-top:0}.sheet-x{margin-top:0}}
.sheet h3{margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:11px 16px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:92vw}
.xpf{position:fixed;z-index:70;font-family:var(--mono);font-weight:800;color:var(--b-deep);pointer-events:none;animation:xf .9s ease-out forwards}
@keyframes xf{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.nb-in{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:10px;padding:10px 12px;font-size:15px}
.cheat p{margin:4px 0;font-size:14.5px}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs .btn.ghost.on{border-color:var(--a);color:var(--a);background:var(--a-soft)}
.spark{display:flex;gap:3px;align-items:flex-end;height:46px}
.spark i{flex:1;background:var(--a);border-radius:3px 3px 0 0;min-height:2px;opacity:.75}
.spark i.t{background:var(--b);opacity:1}
.ref{margin-top:10px;padding:10px 12px;background:var(--card2);border-radius:10px;font-size:14px;line-height:1.55;white-space:pre-wrap}
details.refbox summary{cursor:pointer;color:var(--a);font-size:14px;margin-top:10px}
.lvtag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.lvtag.L0{color:#5b7a3a}.lvtag.L1{color:#2d8a7a}.lvtag.L2{color:var(--a)}.lvtag.L3{color:#6b4fd8}.lvtag.L4{color:var(--b-deep)}.lvtag.L5{color:#b02e6d}.lvtag.L6{color:var(--gold)}
@media (max-width:400px){.card{padding:14px}.stem{font-size:16px}.two{grid-template-columns:1fr}.chip.xp{display:none}}

/* ---- визуальные якоря и графические задачи ---- */
.anchor{margin:12px 0 2px;padding:10px 10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.anchor svg.glyph{width:100%;height:auto;display:block;font-family:var(--font)}
.anchor-cap{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px;font-family:var(--disp);font-style:italic}
.theory .anchor{margin-top:14px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.vcell{position:relative;display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 8px 6px;transition:border-color .12s,background .12s}

.vcell .vlbl{display:block;font-size:11px;color:var(--muted);text-align:center;margin-top:4px;min-height:14px}

.vcell.bad{border-color:var(--err);background:var(--err-soft)} .vcell.bad .key{border-color:var(--err);color:var(--err)}

.vwhy{margin-top:10px;display:flex;flex-direction:column;gap:6px}

.vwhy-row .key{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:750;font-family:var(--mono)}
.vwhy-row.ok{background:var(--ok-soft);color:var(--ink)} .vwhy-row.ok .key{border-color:var(--ok);color:var(--ok)}
.vwhy-row.bad{background:var(--err-soft)} .vwhy-row.bad .key{border-color:var(--err);color:var(--err)}
@media (max-width:360px){.vgrid{grid-template-columns:1fr}}

.nb-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.nb-row:last-child{border-bottom:0}

.nb-row .nb-acts{display:flex;gap:4px;flex:0 0 auto}
.nb-row.edit{display:block}
.sym{display:inline-block;font-family:var(--mono);font-size:.78em;font-weight:700;color:var(--a);background:var(--a-soft);border:1px solid var(--a-line);border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:middle;line-height:1.5}
.tt .sym,.rowbtn .sym{display:inline-block;width:auto;margin:0 0 0 6px}

/* слои «Сути» */
.ltabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.ltab{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:650;padding:6px 10px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.ltab.on{background:var(--a-soft);color:var(--a);border-color:var(--a-line)}
.ltab.done{color:var(--ok)} .ltab.done.on{background:var(--ok-soft);border-color:transparent}
.ltab.lkd{opacity:.55} .ltab.optl span::after{content:" · по желанию";font-weight:500;font-size:11px}
.lbody p{margin:0 0 10px;white-space:normal;font-size:16px;line-height:1.6} .lbody p:last-child{margin-bottom:0}
.lbody p.sub,.theory p.sub{padding-left:14px;color:var(--muted)}
.theory p{white-space:normal;margin:0 0 10px} .theory p:last-of-type{margin-bottom:0}
ol.steps{margin:0 0 10px;padding-left:22px;font-size:16px;line-height:1.6} ol.steps li{margin:4px 0}
.formula{font-family:var(--mono);font-size:15.5px;font-weight:700;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;text-align:left;white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch;line-height:1.7}
.legend{width:100%;border-collapse:collapse;font-size:14px} .legend th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)} .legend td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top} .legend tr:last-child td{border-bottom:0} .legend td:first-child{white-space:nowrap} .legend td:last-child{min-width:90px}
.lcheck{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.lcheck .stem{font-size:15.5px;margin:4px 0 8px}
.rule{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--b);background:var(--b-soft);border-radius:0 10px 10px 0;font-size:15px}
.plain{font-size:15.5px;line-height:1.55;padding:10px 12px;background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:0 10px 10px 0;margin:8px 0}
.remember{font-family:var(--disp);font-style:italic;font-size:15px;color:var(--ink);padding:8px 12px;margin:8px 0 0;border-top:1px dashed var(--line2)}
.remember::before{content:'Запомни: ';font-style:normal;font-weight:700;color:var(--b-deep);font-family:var(--font);font-size:12.5px}
/* дневник по дням */
.todaycard{width:100%;text-align:left;display:block;cursor:pointer}
.todaycard:active{transform:scale(.995)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.tile b{display:block;font-family:var(--mono);font-size:20px;line-height:1.1;color:var(--ink)}
.tile span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.2}
.tile.hot b{color:var(--b-deep)}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
.cal{margin-top:14px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-wd span{font-size:11px;color:var(--faint);text-align:center;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-d.l1{background:var(--a-soft);color:var(--a)} .cal-d.l2{background:rgba(42,91,215,.28);color:var(--ink);border-color:transparent}
.cal-d.l3{background:rgba(42,91,215,.55);color:#fff;border-color:transparent} .cal-d.l4{background:var(--a);color:#fff;border-color:transparent;font-weight:700}
html[data-theme="dark"] .cal-d.l2{background:rgba(126,163,255,.3)} html[data-theme="dark"] .cal-d.l3{background:rgba(126,163,255,.6);color:#0f1620}
.cal-leg{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:11px;color:var(--faint);justify-content:flex-end}
.cal-leg i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line);background:var(--card2)}
.cal-leg i.l1{background:var(--a-soft)} .cal-leg i.l2{background:rgba(42,91,215,.28)} .cal-leg i.l3{background:rgba(42,91,215,.55)} .cal-leg i.l4{background:var(--a)}
.dayhead{display:flex;align-items:center;gap:12px}
.dayhead h3{margin:0;font-size:20px}
.daymood{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--card2);border:1px solid var(--line);flex:0 0 auto}
.daymood.gold{background:var(--gold-soft);border-color:var(--gold)} .daymood.b{background:var(--b-soft);border-color:var(--b-line)} .daymood.a{background:var(--a-soft);border-color:var(--a-line)} .daymood.ok{background:var(--ok-soft);border-color:transparent}
.achs{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.ach{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.ach .ic{font-size:20px;flex:0 0 auto;line-height:1.2}
.ach b{font-size:14.5px}
.mlegend{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2);display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.mlegend i.m1{background:var(--a)} .mlegend i.m2{background:var(--ok)} .mlegend i.m3{background:var(--b)}
.mlegend .faint{margin-top:4px}
.tline{margin-top:8px;font-variant-numeric:tabular-nums}
.tbars{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.tbar{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tbar i{display:block;height:8px;border-radius:4px;background:var(--a);min-width:3px}

.ach > div{flex:1;min-width:0}
.resume{border-color:var(--b-line);background:var(--b-soft)}
.resume .ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* дневник и лестницы */
.journal{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:10px}
.journal textarea{margin-top:8px;resize:vertical;min-height:64px;font-size:15px;line-height:1.45;background:var(--card)}
.stairs{margin:8px 0 12px;padding:12px;border:1px solid var(--b-line);border-radius:12px;background:var(--b-soft)}
.st-steps{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.st-steps .st{height:34px;border-radius:7px;border:1px solid var(--b-line);background:var(--card);font-family:var(--mono);font-size:11px;color:var(--muted);transition:transform .08s}
.st-steps .st.on{background:var(--b);color:#fff;border-color:transparent;font-weight:700}
.st-steps .st:active{transform:scale(.92)}
.tiles .tile.st b{color:var(--b-deep)}
.stchart .stbars{display:flex;gap:4px;align-items:flex-end;height:74px;margin-top:8px}
.stchart .stb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.stchart .stb i{display:block;width:100%;max-width:26px;background:var(--b);border-radius:4px 4px 0 0;opacity:.85}
.stchart .stb i.none{background:var(--line2)} .stchart .stb i.max{background:var(--gold)}
.stchart .stb.t i{opacity:1;box-shadow:0 0 0 2px var(--b-soft)}
.stchart .stb span{font-size:9px;color:var(--faint);margin-top:3px;line-height:1}
@media (min-width:700px){.tiles{grid-template-columns:repeat(5,1fr)}}

/* фото дня */
.photo{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.ph-view{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ph-view img{width:120px;height:120px;border-radius:12px;object-fit:cover;box-shadow:0 2px 8px rgba(20,28,38,.15)}
.ph-acts{display:flex;flex-direction:column;gap:6px}

/* момент дня: фото + голос + слова */
.moment{margin:12px 0 10px;padding:12px;border-radius:16px;background:linear-gradient(135deg,var(--a-soft),var(--b-soft));border:1px solid var(--line)}
.moment-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.moment-h b{font-family:var(--disp);font-size:17px}
.moment-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.moment-g{grid-template-columns:1fr}}
.voice{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.vplayer{display:flex;align-items:center;gap:10px;margin-top:10px}
.vplay,.vstop{width:42px;height:42px;border-radius:50%;border:none;background:var(--a);color:#fff;font-size:15px;flex:0 0 auto;box-shadow:0 2px 8px rgba(42,91,215,.3);transition:transform .1s}
.vplay:active,.vstop:active{transform:scale(.92)}
.vstop{background:var(--err);box-shadow:0 2px 8px rgba(201,59,59,.3)}
.vtrack{position:relative;flex:1;height:32px;display:flex;align-items:center;overflow:hidden;border-radius:8px}
.vbars{display:flex;align-items:center;gap:3px;width:100%;height:100%}
.vbars i{flex:1;background:var(--line2);border-radius:2px;display:block}
.vplayer.on .vbars i{background:var(--a-line)}
.vprog{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--a-soft);border-right:2px solid var(--a);transition:width .2s linear;pointer-events:none}
.vtime{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.vrec{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--err-soft);border:1px solid rgba(201,59,59,.25)}
.vdot{width:10px;height:10px;border-radius:50%;background:var(--err);flex:0 0 auto;animation:vpulse 1s ease-in-out infinite}
@keyframes vpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.vlevel{flex:1;display:flex;align-items:center;gap:3px;height:32px}
.vlevel i{flex:1;height:4px;background:var(--err);border-radius:2px;display:block;opacity:.8;transition:height .08s}
.vhint{margin-top:8px;line-height:1.4}

/* график: лестницы + минуты */
.ch-row{position:relative;margin-top:12px}
.ch-lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.ch-t{font-weight:700;font-size:13px}
.stchart .stbars{height:62px;align-items:flex-end;border-bottom:1px solid var(--line)}
.stchart .stbars.mins i{background:var(--a)} .stchart .stbars.mins i.max{background:var(--gold)} .stchart .stbars.mins i.none{background:var(--line2)}
.stchart .stbars.mins .stb.t i{box-shadow:0 0 0 2px var(--a-soft)}
.stchart .stb .ch-v{font-size:8px;color:var(--muted);margin:0 0 2px;line-height:1;order:-1;font-family:var(--mono)}
.stchart .stbars.lbls{height:auto;border:none;margin-top:4px}
.stchart .stbars.lbls span{font-size:9px;color:var(--faint)}
.stchart .stbars.lbls .stb.t span{color:var(--b-deep);font-weight:700}
.ch-axis{display:flex;justify-content:space-between;font-size:8px;color:var(--faint);font-family:var(--mono);margin-top:2px}
.ch-lab .ch-t{white-space:nowrap;margin-right:8px}.ch-lab .small{text-align:right}

/* календарь: фото + дата, минуты учёбы, лестницы */
.cal-d{position:relative;overflow:hidden;aspect-ratio:1/1.12;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:block;padding:0;font-family:var(--mono);color:var(--muted);transition:transform .12s ease;text-align:left}
.cal-d .n{position:absolute;left:4px;top:3px;font-size:9.5px;font-weight:600;line-height:1;color:var(--faint);z-index:1}

.cal-d .m{font-size:8px;color:var(--faint);font-family:var(--font);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.cal-d .mn{position:absolute;left:4px;bottom:4px;font-size:15px;font-weight:800;color:var(--a);line-height:1;z-index:1;letter-spacing:-.02em}
.cal-d .sd{position:absolute;right:4px;bottom:4px;font-size:15px;font-weight:800;color:var(--b-deep);line-height:1;z-index:1;letter-spacing:-.02em}
.cal-d.jr .tr::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);display:block}
.cal-d.hasvc .tr::before{content:"🎤";font-size:9px;line-height:1;display:block;font-family:var(--font)}
.cal-d.l2 .n,.cal-d.l3 .n,.cal-d.l4 .n{color:rgba(255,255,255,.8)} .cal-d.l3 .mn,.cal-d.l4 .mn{color:#eaf0ff} .cal-d.l3 .sd,.cal-d.l4 .sd{color:#ffe0c2} .cal-d.l3 .m,.cal-d.l4 .m{color:rgba(255,255,255,.75)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--b)}
.cal-d.sel{transform:scale(1.08);box-shadow:0 0 0 2px var(--b),0 4px 12px rgba(20,28,38,.15);z-index:2}
.cal-d.fut{opacity:.35}
.cal-d .ph{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cal-d.hasph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,rgba(10,16,24,.72),rgba(10,16,24,0));pointer-events:none}
.cal-d.hasph .n{background:rgba(20,28,38,.5);color:#fff;border-radius:999px;padding:2px 4px;left:3px;top:3px;backdrop-filter:blur(2px)}
.cal-d.hasph .m{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cal-d.hasph .mn{color:#cfe0ff;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2} .cal-d.hasph .sd{color:#ffd2a8;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2}
.cal-d.hasph.jr .tr::after{box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.cal-d.hasph.l1,.cal-d.hasph.l2,.cal-d.hasph.l3,.cal-d.hasph.l4{border-color:var(--a)}
.cal-leg.cal-lg{margin-top:4px;gap:10px;flex-wrap:wrap} .cal-lg span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap} .cal-lg i.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);border:none}
@media (max-width:420px){.cal-d .n{font-size:8.5px} .cal-d .mn,.cal-d .sd{font-size:11.5px;letter-spacing:-.04em} .cal-d .mn{left:3px} .cal-d .sd{right:3px}}

/* ручная правка минут */
.tile.tap{position:relative;cursor:pointer;border-style:dashed;font:inherit;color:inherit;text-align:center}
.tile.tap .edit{position:absolute;right:6px;top:4px;font-size:11px;font-style:normal;color:var(--faint)}
.tile.tap:active{transform:scale(.97)}
.tf-keys{display:flex;flex-wrap:wrap;gap:6px}
.tf-keys .tfk{padding:8px 12px;font-size:13px}
.tf-keys .tfk.on{background:var(--a);color:#fff;border-color:transparent}

/* импорт из Диктофона */
.steps{padding-left:18px;margin:8px 0;line-height:1.5} .steps li{margin:4px 0}
.vb-rows{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.vb-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.vb-name{flex:1;min-width:0;display:flex;flex-direction:column} .vb-name b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb-date{width:auto;flex:0 0 auto;padding:6px 8px;font-size:13px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

/* нотация */
.nota{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:8px 10px;border:1px dashed var(--line2);border-radius:10px;background:var(--card2)}

.nota-t th{text-align:left;font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line)}
.nota-t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.nota-t tr:nth-child(odd) td{background:var(--card2)}

/* шпаргалка-лист */
.cheat-sheet .card.cheat{margin:8px 0;padding:10px 12px;box-shadow:none}
.cheat-sheet .nota-t{min-width:520px}

/* свёрнутые листы */
.ovl.min{display:none}
#sheetdock{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px;z-index:49;pointer-events:none}
.dock-pill{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;max-width:46vw;padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink);box-shadow:0 6px 18px rgba(20,28,38,.18);font:inherit;font-size:14px;font-weight:600;animation:up .18s ease-out}
.dock-pill .dp-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-pill .dp-a{color:var(--a);font-size:11px}
.dock-pill:active{transform:scale(.97)}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.sheet-f{display:flex;gap:8px} .sheet-f .btn{flex:1}
.sheet-min{margin-right:6px}
html.has-sheet #sheetdock{display:none}

/* как найти величину */
.how{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.how li{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:baseline;font-size:13px;line-height:1.4}
.how .hf{font-family:var(--mono);font-size:12.5px;color:var(--ink);word-break:break-word}

<script>window.__DATA__={"META":{"version":"1.0.1","date":"27.10.2026"},"LEVELS":[{"id":"L0","rank":"База","title":"Выставочный стенд как продукт","sub":"Типы стендов, участники, цикл проекта, экономика за м², бриф и ТЗ","intro":"Арт-директор отвечает не за картинку, а за продукт: стенд, который должен окупиться для клиента. Два юнита дают язык, на котором говорят застройщик, площадка и экспонент: линейный и островной, стандартная и эксклюзивная застройка, цена за квадратный метр, бриф и техническое задание. Без этого словаря любая концепция — рендер в вакууме."},{"id":"L1","rank":"Проектировщик","title":"Архитектурное мышление: план, объём, конструктив","sub":"Зонирование и траектории, доминанта и высота, каркас, подвес, пол, электрика","intro":"«Сильное архитектурное мышление» из вакансии — это умение сначала решить план и объём, а потом рисовать фасад. Три юнита: как разложить площадь по зонам и провести посетителя; как построить силуэт, который читается с 30 метров; из чего стенд физически стоит и что о нём скажет площадка."},{"id":"L2","rank":"Визуальный дизайнер","title":"Стенд, который продаётся: сообщение, свет, материал","sub":"Три секунды внимания, иерархия и читаемость, свет как форма, экраны и фотогеничность","intro":"Заказчик покупает не красоту, а эффект: стенд заметили, поняли, запомнили, сфотографировали. Два юнита дают правила, по которым это проверяется цифрами: высота букв против дистанции, контраст, одна доминанта, акцентный свет 3:1, шаг пикселя экрана против расстояния просмотра."},{"id":"L3","rank":"Технолог","title":"Материалы и производство","sub":"МДФ, ЛДСП, фанера, металл, акрил, стекло, ткань, печать, фрезеровка; разузловка и монтаж","intro":"«Не обязательно быть инженером-конструктором» — но арт-директор обязан знать, из чего его стенд сделают, сколько это стоит, сколько сохнет краска и пройдёт ли панель в ворота павильона. Два юнита: свойства материалов и технологий; путь от рендера к цеху — разузловка, чертежи, контрольная сборка, монтаж за три дня."},{"id":"L4","rank":"Коммерческий дизайнер","title":"Экономика, смета, тендер","sub":"Структура сметы, цена за м², рычаги экономии, тендер и защита концепции","intro":"«Оценивать дизайн не только с эстетической, но и с коммерческой точки зрения» — это умение прочитать смету, назвать цену за квадратный метр до того, как её посчитает сметчик, и защитить концепцию перед клиентом цифрами, а не прилагательными. Два юнита: экономика стенда и тендерная презентация."},{"id":"L5","rank":"Руководитель направления","title":"Команда и процесс: от концепции до монтажа","sub":"Ревью, стандарты, визуальный стиль компании; проектный менеджер, производство, авторский надзор","intro":"Половина обязанностей арт-директора — организационная: контролировать качество работы дизайнеров, развивать стиль и стандарты компании, вместе с проектным менеджером и цехом довести идею до реального стенда. Два юнита: как руководить дизайнерами и как не потерять идею между рендером и монтажом."},{"id":"L6","rank":"Арт-директор","title":"Тренды, портфолио, собеседование","sub":"Насмотренность и визуальный язык, кейсы и награды, как рассказать о себе на собеседовании","intro":"Финальный уровень — то, по чему вас будут оценивать: понимание современных трендов и умение показать портфолио с реализованными проектами, а не рендерами. Два юнита: как следить за рынком и формировать стиль компании; как собрать портфолио, говорить о наградах и пройти собеседование с тестовым заданием."}],"UNITS":[{"id":"u0-1","level":"L0","title":"Стенд как продукт: типы, участники, цикл, цена за м²","lead":"За что платит экспонент и из чего складывается работа застройщика","concept":"Выставочный стенд — временное сооружение на арендованной площади павильона, которое должно за 3–4 дня окупить участие: принести контакты, продажи, переговоры, имидж. Типы по положению в павильоне: линейный (открыта одна сторона, самый дешёвый по аренде), угловой (две стороны, обычно +10% к аренде), полуостров (три стороны), островной (четыре стороны, виден отовсюду, дороже и в аренде, и в застройке). По способу застройки: стандартная (сборные профильные стены 2,5 м, ковролин, фриз с названием — дёшево и быстро) и эксклюзивная (индивидуальный проект, столярка, металл, свет, экраны). Участники: экспонент (клиент), организатор выставки, площадка (Экспоцентр, Крокус Экспо, ВДНХ, Экспофорум) со своим регламентом, застройщик (агентство: дизайн + производство + монтаж), субподрядчики (печать, свет, AV, аренда мебели, флористика). Цикл: бриф → концепция и рендеры → тендер/согласование → рабочая документация → производство → логистика и монтаж (2–3 дня до открытия) → работа стенда → демонтаж за ночь. Экономика: аренда необорудованной площади в России порядка 10–20 тыс. ₽/м², стандартная застройка 4–6 тыс. ₽/м², эксклюзивная 25–80 тыс. ₽/м² и выше (двухэтажные, LED-стены — ещё дороже); европейские бенчмарки — €300–800/м² за эксклюзив. Арт-директор должен держать эти порядки в голове, чтобы ещё на эскизе понимать, во что обойдётся идея.","points":[{"h":"Типы стендов и что они диктуют дизайну","t":"Линейный: одна открытая сторона, задняя и боковые стены обязательны — работает как витрина, вся коммуникация на фасаде. Угловой: две стороны, диагональный вход — лучший формат для малых площадей. Полуостров: три стороны, задняя стена — опора для доминанты и подсобки. Островной: четыре стороны, нет «спины», доминанта должна читаться с любого ракурса, подсобку прячут в центр. Чем больше открытых сторон, тем выше аренда и тем меньше стен для графики — приходится думать объёмом, а не плоскостью."},{"h":"Стандартная и эксклюзивная застройка","t":"Стандарт: профильные системы (Octanorm, Maxima), стены 2,5 м, ковролин, фриз, прожекторы «один на 3 м²» — включено в пакет организатора, монтируется за часы. Эксклюзив: проект под клиента, столярные и металлические конструкции, высота до регламента (обычно 5 м, выше — согласование), своя графика, свет, мебель, экраны. Эксклюзив начинается там, где клиенту нужно выделиться среди соседей и где площадь от 30–50 м²; ниже стандарт с улучшениями часто выгоднее."},{"h":"Кто вокруг стенда","t":"Экспонент (маркетинг + продажи) принимает концепцию и платит. Организатор продаёт площадь и утверждает проект застройки. Площадка диктует регламент: высота, открытые стороны, подвес, пожарные нормы, электричество, график монтажа. Застройщик — агентство полного цикла: арт-директор и дизайнеры, проектный менеджер, конструктор, цех, монтажники. Субподрядчики: широкоформатная печать, свет и AV, аренда мебели, зелень. Арт-директор — тот, кто держит в голове всех: идея должна пройти через каждого без потерь."},{"h":"Цикл проекта и где в нём арт-директор","t":"Бриф (цели, площадь, бюджет, бренд) → концепция (план, объём, ключевой ракурс, 2–3 варианта) → презентация и тендер → правки → утверждение → рабочая документация (чертежи, спецификации, разузловка) → производство 3–5 недель → контрольная сборка → логистика → монтаж 2–3 дня → приёмка и фотосъёмка → выставка → демонтаж. Арт-директор ведёт концепцию и презентацию, ревьюит РД на соответствие идее, выезжает на контрольную сборку и монтаж, принимает стенд и фотографирует его для портфолио."}],"practice":{"mechanic":"keymoves","points":3,"stem":"Клиент спрашивает: «Почему эксклюзивный стенд на 60 м² стоит 3 млн, если стандартный — 300 тысяч?» Собери ответ арт-директора.","options":[{"id":"k0","text":"Стандарт — аренда готовых панелей, эксклюзив — изготовление конструкций под проект","correct":true,"why":"Разная природа стоимости: аренда против производства."},{"id":"k1","text":"Эксклюзив покупает заметность: высота, объём, свет, экраны — за это и платят","correct":true,"why":"Цена связана с эффектом, а не с «красотой»."},{"id":"k2","text":"Показать структуру сметы: конструктив, графика, свет, монтаж, логистика","correct":true,"why":"Прозрачность снимает подозрение в «накрутке»."},{"id":"k3","text":"Предложить промежуточный вариант: стандарт с эксклюзивными элементами","correct":true,"why":"Торговля объёмом, а не качеством."},{"id":"f4","text":"Объяснить, что эксклюзив всегда окупается и любой клиент обязан в него вкладываться ради имиджа","correct":false,"why":"Обещание без цифр; окупаемость зависит от целей и площади."},{"id":"f5","text":"Сослаться на то, что все конкуренты клиента делают дорогие стенды, и ему придётся соответствовать","correct":false,"why":"Апелляция к конкурентам — не аргумент о его задаче."},{"id":"f6","text":"Снизить цену вдвое, убрав свет и фриз, чтобы не потерять клиента на первом разговоре","correct":false,"why":"Без света и фриза эксклюзив теряет смысл — это не экономия, а порча."},{"id":"f7","text":"Сказать, что цена определяется сложностью рендера и временем визуализатора","correct":false,"why":"Рендер — доли процента сметы; клиент почувствует подмену."}],"reference":"Стандарт — аренда, эксклюзив — производство под задачу; платят за заметность и эффект; показать структуру сметы; предложить промежуточный вариант.","anchor":{"g":"estimate","p":{"rows":[["конструктив",40],["графика и печать",12],["свет и электрика",10],["AV и LED",10],["мебель, декор",8],["логистика и монтаж",15],["проектирование",5]],"total":"эксклюзив 60 м² ≈ 25–50 тыс. ₽/м²"},"cap":"цена — это структура, а не цифра"},"id":"u0-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Стенд 120 м² на пересечении двух проходов, открыты три стороны. Какой это тип и что он диктует дизайну?","options":[{"id":"o0","text":"Полуостров: задняя стена — опора для доминанты и подсобки, три фасада работают на проход","correct":true,"rationale":"Три открытые стороны и одна задняя — классический полуостров."},{"id":"o1","text":"Островной: все стороны открыты, подсобку прячут в центр, доминанта читается с любого ракурса","correct":false,"rationale":"Островной — четыре открытые стороны, здесь их три."},{"id":"o2","text":"Угловой: две открытые стороны, диагональный вход с угла, задняя и боковая стены несут графику","correct":false,"rationale":"Угловой — две стороны."},{"id":"o3","text":"Линейный: одна открытая сторона, вся коммуникация на фасаде, боковые стены обязательны","correct":false,"rationale":"Линейный — одна сторона."}],"anchor":{"g":"plan","p":{"w":12,"d":8,"open":["f","l"],"zones":[["rec",0.05,0.62,0.22,0.3],["demo",0.32,0.3,0.36,0.6],["meet",0.72,0.05,0.24,0.5],["store",0.72,0.6,0.24,0.35],["bar",0.05,0.08,0.22,0.3]],"dom":[0.5,0.15],"flow":true},"cap":"полуостров: три фасада на проход, спина — опора"},"id":"u0-1-t0"},{"mechanic":"single","points":2,"stem":"Клиент с бюджетом 400 тыс. ₽ на 18 м² хочет «эксклюзив, как у лидера рынка». Что предложить?","options":[{"id":"o0","text":"Стандарт с эксклюзивными элементами: фриз-лайтбокс, графика, свет; эксклюзив на 18 м² съест бюджет","correct":true,"rationale":"22 тыс. ₽/м² не хватает на полноценный эксклюзив; усиленный стандарт даст эффект."},{"id":"o1","text":"Полноценный эксклюзив с подвесом и LED-стеной, сократив площадь аренды до 12 м², чтобы уложиться в бюджет","correct":false,"rationale":"Меньше площади — не дешевле конструкции; подвес и LED не влезут."},{"id":"o2","text":"Отказаться от проекта: бюджет ниже минимального порога агентства, а клиент не понимает цен рынка","correct":false,"rationale":"Малый проект с усиленным стандартом — нормальная работа и будущий клиент."},{"id":"o3","text":"Взять эксклюзив, сэкономив на чертежах и контрольной сборке, которые на малых стендах не нужны","correct":false,"rationale":"Экономия на документации возвращается браком на монтаже."}],"anchor":{"g":"compare","p":{"a":["стандарт +","лайтбокс, графика, свет"],"b":["эксклюзив 18 м²","подвес, LED — не влезет"],"verdict":"усиленный стандарт за 400 тыс."},"cap":"бюджет на м² решает тип застройки"},"id":"u0-1-t1"},{"mechanic":"single","points":2,"stem":"Кто утверждает высоту стенда 5,5 м и подвес баннера к ферме павильона?","options":[{"id":"o0","text":"Площадка через организатора: превышение высоты и подвес согласуются заранее, подвес — силами площадки","correct":true,"rationale":"Регламент площадки — первый ограничитель; подвес монтирует площадка."},{"id":"o1","text":"Экспонент: это его стенд и его риск, застройщик лишь исполняет утверждённый клиентом проект","correct":false,"rationale":"Клиент не отменяет регламент площадки."},{"id":"o2","text":"Конструктор застройщика: расчёт нагрузок и подвеса — его ответственность, площадку уведомляют только о превышении 6 м","correct":false,"rationale":"Расчёт нужен, но согласование обязательно."},{"id":"o3","text":"Никто: до 6 м и подвес до 100 кг разрешены по умолчанию на всех российских площадках","correct":false,"rationale":"Обычный лимит 5 м, подвес всегда по заявке."}],"anchor":{"g":"elev","p":{"h":5.5,"maxH":5,"items":[["подвес",6.5],["лого",4.5]],"dist":30},"cap":"сверх регламента — согласование до проекта"},"id":"u0-1-t2"},{"mechanic":"single","points":2,"stem":"На каком этапе цикла арт-директор чаще всего теряет идею, если не вмешивается лично?","options":[{"id":"o0","text":"Рабочая документация и производство: замены материалов и упрощения узлов без ревью","correct":true,"rationale":"Именно здесь «сильная идея» превращается в «стенд как у всех»."},{"id":"o1","text":"Бриф: клиент формулирует цели неточно, и дальнейшие этапы наследуют ошибку","correct":false,"rationale":"Бриф уточняется вопросами; идея там ещё не родилась."},{"id":"o2","text":"Демонтаж: стенд разбирают за ночь, и конструкции не сохраняются для повторного использования","correct":false,"rationale":"Повторное использование — отдельный вопрос, идея уже реализована."},{"id":"o3","text":"Презентация: клиент выбирает не ту из трёх концепций, и агентство делает слабый вариант","correct":false,"rationale":"Выбор клиента — управляемый процесс, не потеря идеи."}],"anchor":{"g":"pipeline","p":{"steps":["бриф","концепт","тендер","РД","цех","монтаж"],"hl":[3,4],"note":"здесь идея теряется чаще всего"},"cap":"точки контроля — РД и цех"},"id":"u0-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре плана стенда 12×8 м для полуострова (открыты фасад и левая сторона). Какой правильно использует тип стенда?","vopts":[{"id":"v0","v":{"g":"planv","p":{"open":["f","l"],"zones":[["rec",0.05,0.62,0.22,0.3],["demo",0.32,0.3,0.36,0.6],["meet",0.72,0.05,0.24,0.5],["store",0.72,0.6,0.24,0.35]],"dom":[0.5,0.15]}},"lbl":"","correct":true,"rationale":"Ресепшн у открытого угла, демо на проходе, переговорная и подсобка у задней стены, доминанта у спины."},{"id":"v1","v":{"g":"planv","p":{"open":["f","l"],"zones":[["store",0.05,0.62,0.3,0.3],["meet",0.35,0.55,0.3,0.4],["demo",0.7,0.05,0.25,0.4]],"dom":null}},"lbl":"","correct":false,"rationale":"Подсобка и переговорная выставлены на открытый фасад, демо спрятано за ними."},{"id":"v2","v":{"g":"planv","p":{"open":["b"],"zones":[["rec",0.05,0.05,0.22,0.3],["demo",0.32,0.3,0.36,0.6]],"dom":[0.5,0.85]}},"lbl":"","correct":false,"rationale":"План сделан для открытой задней стороны — она у полуострова глухая."},{"id":"v3","v":{"g":"planv","p":{"open":["f","l"],"zones":[["meet",0.05,0.05,0.9,0.9]],"dom":null}},"lbl":"","correct":false,"rationale":"Вся площадь — закрытая переговорная: стенд превращён в глухой куб."}],"id":"u0-1-t4"}],"framework":"Тип стенда задаёт, где стены и где витрина. Стандарт — аренда панелей, эксклюзив — производство под задачу. Порядки: аренда 10–20 тыс. ₽/м², стандарт 4–6, эксклюзив 25–80. Регламент площадки — первый ограничитель. Арт-директор держит идею через весь цикл: концепт → РД → цех → монтаж → фото.","anchor":{"g":"plan","p":{"w":12,"d":8,"open":["f","l"],"zones":[["rec",0.05,0.62,0.22,0.3],["demo",0.32,0.3,0.36,0.6],["meet",0.72,0.05,0.24,0.5],["store",0.72,0.6,0.24,0.35],["bar",0.05,0.08,0.22,0.3]],"dom":[0.5,0.15],"flow":true},"cap":"стенд как продукт: тип, зоны, доминанта, поток"},"layers":{"simple":"Стенд — это магазин на три дня, который строят на арендованной земле. Земля (площадь) стоит денег за квадратный метр и бывает разной: с одним входом (линейный), с двумя (угловой), с тремя (полуостров) или без стен вовсе (островной). Чем больше открытых сторон, тем лучше видно — и тем дороже.\nСам магазин можно взять напрокат (стандартные панели — быстро и дёшево) или построить по проекту (эксклюзив — дороже в разы, но его заметят). Вокруг — хозяин земли со своими правилами (площадка), заказчик с бюджетом и строитель (мы).\nАрт-директор — архитектор этого магазина: от первого разговора до фото готового стенда. Если он уйдёт после рендера, строители сделают «как проще».\nПроверь себя: чем полуостров отличается от островного и что это меняет в плане?","how":"1. Типы по открытым сторонам: линейный (1), угловой (2, обычно +10% к аренде), полуостров (3), островной (4). Открытая сторона = витрина, глухая = опора для доминанты, графики, подсобки.\n2. Застройка: стандарт (профильные системы 2,5 м, ковролин, фриз, прожектор на 3 м², пакет организатора) против эксклюзива (индивидуальные конструкции, свет, экраны, высота до регламента).\n3. Участники: экспонент → организатор → площадка (регламент) → застройщик (мы) → субподрядчики. Проект согласуется с площадкой: план, разрез, электрика, подвес.\n4. Цикл: бриф → концепт (план + объём + ключевой ракурс) → презентация/тендер → РД → производство 3–5 недель → контрольная сборка → монтаж 2–3 дня → приёмка и фото → выставка → демонтаж.\n5. Пример. Полуостров 96 м² (12×8), эксклюзив: аренда 96 × 15 000 = 1,44 млн; застройка 96 × 35 000 ≈ 3,4 млн; итого участие ≈ 5 млн без персонала и логистики экспонатов. Стандарт на той же площади — 96 × 5 000 = 0,5 млн застройки.","formula":{"f":"стоимость участия ≈ S × (аренда/м² + застройка/м²) + экспонаты + персонал\nзастройка/м²: стандарт 4–6 тыс. ₽ · эксклюзив 25–80 тыс. ₽ · двухэтажный ×1,5–2","legend":[["S","площадь стенда","96 м²"],["аренда/м²","необорудованная площадь у организатора","10–20 тыс. ₽"],["застройка/м²","стандарт или эксклюзив","5 / 35 тыс. ₽"],["открытые стороны","1 / 2 / 3 / 4 — линейный … островной","надбавка к аренде, больше витрины"],["цикл","бриф → концепт → РД → цех → монтаж → фото","8–12 недель"]],"note":"Порядки цен меняются по площадкам и годам — держите в голове вилку, а не точное число, и проверяйте по последним сметам агентства."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Тип стенда задаёт витрины и опоры: открытые стороны — коммуникация, глухие — доминанта и подсобка.\n— Стандарт — аренда панелей, эксклюзив — производство под задачу; порядок цен держать в голове.\n— Регламент площадки (высота, подвес, открытые стороны, пожарные нормы) — первый ограничитель любой идеи.\n— Цикл: бриф → концепт → тендер → РД → цех → монтаж → фото; арт-директор ведёт идею через каждый этап.\n— Идея теряется на РД и в цеху — там нужен личный контроль.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Чем полуостров отличается от островного и что это меняет в плане?","o":["У полуострова три открытые стороны и глухая спина — опора для доминанты и подсобки","Полуостров всегда больше по площади, поэтому в нём помещаются переговорные, а на островном — нет","Островной стенд обязан быть двухэтажным по регламенту, полуостров — одноэтажным"],"a":0,"w":"Открытые стороны — витрины, глухая стена — опора. У островного спины нет, подсобку прячут в центр."},{"q":"Стандартная застройка — это…","o":["Любой стенд дешевле миллиона рублей по смете застройщика","Сборные профильные панели 2,5 м, ковролин, фриз — пакет организатора","Проект, который агентство делало раньше и повторяет для нового клиента"],"a":1,"w":"Стандарт — аренда готовых систем, эксклюзив — производство под проект."},{"q":"В формуле участия что обычно самое большое слагаемое для эксклюзива на 100 м²?","o":["Аренда площади: организатор берёт больше, чем стоит застройка","Застройка: 25–80 тыс. ₽/м² против 10–20 за аренду","Проектирование и рендеры: труд арт-директора и визуализатора"],"a":1,"w":"Эксклюзивная застройка обычно в 2–4 раза дороже аренды; проектирование — около 5% сметы."},{"q":"Где арт-директор обязан быть лично, чтобы идея дошла до выставки?","o":["На контрольной сборке в цеху и на монтаже","Только на презентации клиенту: дальше работает проектный менеджер","На демонтаже, чтобы проверить сохранность конструкций"],"a":0,"w":"Идея теряется на РД, в цеху и на монтаже — там и нужен авторский надзор."}],"rules":["Тип стенда задаёт витрины и опоры: открытые стороны — коммуникация, глухие — доминанта и подсобка.","Стандарт — аренда панелей, эксклюзив — производство под задачу; порядок цен держать в голове.","Регламент площадки (высота, подвес, открытые стороны, пожарные нормы) — первый ограничитель любой идеи.","Цикл: бриф → концепт → тендер → РД → цех → монтаж → фото; арт-директор ведёт идею через каждый этап.","Идея теряется на РД и в цеху — там нужен личный контроль."]}},{"id":"u0-2","level":"L0","title":"Бриф и ТЗ: что узнать до первого эскиза","lead":"Семь вопросов клиенту, план павильона и бренд-гайд — иначе концепция будет про нас, а не про него","concept":"Бриф — разговор, после которого арт-директор знает, зачем клиент едет на выставку и чем измерит успех. Семь обязательных вопросов: цель участия (лиды, продажи на стенде, переговоры с партнёрами, имидж, запуск продукта); аудитория (кто ходит по этой выставке, кого ждём на стенде); что показываем (экспонаты с габаритами и весом, демо, экраны); сколько людей работает на стенде и какие зоны нужны (ресепшн, переговорные открытые/закрытые, бар, подсобка, сцена); бюджет (вилка «от — до» и что в неё входит); площадка и место (номер стенда, план павильона, соседи, высота зала, колонны, люки, расстояние от входа); ограничения и бренд (бренд-гайд, прошлые стенды, что понравилось и что нет, конкуренты). Из брифа рождается ТЗ на проектирование — документ, который фиксирует площадь и тип стенда, обязательные зоны и их размеры, экспонаты, ключевое сообщение, бюджет, сроки сдачи концепции, РД и монтажа, регламент площадки. ТЗ подписывает клиент: без него каждая правка — «а мы думали иначе». План павильона читают до эскиза: откуда идёт поток посетителей, где вход и главные проходы, кто соседи и какой они высоты, где колонны, вентиляция, люки электрики. Арт-директор, который начинает с рендера без брифа и плана, рисует для себя.","points":[{"h":"Семь вопросов брифа","t":"Цель и KPI (сколько контактов, какие переговоры, что продаём); аудитория выставки и желанные гости; экспонаты и демо (габариты, вес, электричество, вода, интернет); люди и зоны (сколько менеджеров, переговорных, нужен ли бар и сцена); бюджет-вилка и что в неё входит (аренда отдельно?); площадка, номер стенда, план павильона; бренд и история (гайд, прошлые стенды, конкуренты, что нельзя). Ответы записывают при клиенте и отправляют ему на подтверждение в тот же день."},{"h":"Чтение плана павильона","t":"Главные проходы и входы — откуда поток; соседи по стенду и их высота (сосед 6 м закроет ваш лайтбокс); колонны внутри площади; люки электрики и воды; высота зала и зоны ограничений по высоте; близость к сцене и кафе (шум, толпа). На плане рисуют стрелки потока и первый ракурс, с которого посетитель увидит стенд, — это и будет ключевой ракурс концепции."},{"h":"ТЗ как контракт на концепцию","t":"ТЗ фиксирует: площадь и тип, обязательные зоны с ориентировочными площадями, экспонаты, ключевое сообщение и бренд-требования, бюджет застройки, сроки (концепция, правки, РД, производство, монтаж), регламент площадки (высота, открытые стороны, подвес), число вариантов концепции и число итераций правок. Подписанное ТЗ защищает от бесконечных правок и даёт основание для доплаты при изменении объёма."},{"h":"Бренд-гайд и история клиента","t":"Из гайда берут логотип и охранные поля, палитру, шрифты, тон коммуникации, правила фото. Из истории — прошлые стенды (что понравилось руководству, что критиковали), стенды конкурентов на той же выставке (чтобы отстроиться, а не повторить). Если гайда нет — собирают мудборд из сайта, упаковки и соцсетей клиента и согласовывают его до концепции."}],"practice":{"mechanic":"matching","points":3,"stem":"Соедини вопрос брифа с тем, что он определяет в концепции.","pairs":[{"l":"Цель участия и KPI","r":"Какие зоны главные: ресепшн для лидов или переговорные для сделок"},{"l":"Экспонаты с габаритами","r":"Площадь демо-зоны, нагрузка на пол, точки электричества"},{"l":"План павильона и соседи","r":"Ключевой ракурс и сторона, на которую работает доминанта"},{"l":"Бюджет-вилка","r":"Тип застройки, высота, материалы, наличие LED"},{"l":"Бренд-гайд и прошлые стенды","r":"Палитра, шрифты, чего нельзя повторять"}],"solution":"Каждый вопрос брифа закрывает конкретный выбор в концепции; если ответа нет — выбор делается наугад.","anchor":{"g":"tree","p":{"root":"бриф","kids":["цель","экспонаты","план павильона","бюджет","бренд"]},"cap":"бриф определяет концепцию, а не наоборот"},"id":"u0-2-p"},"test":[{"mechanic":"single","points":2,"stem":"Клиент на брифе говорит: «Сделайте красиво, бюджет обсудим после концепции». Что делает арт-директор?","options":[{"id":"o0","text":"Фиксирует вилку бюджета по аналогам и площади до эскиза: иначе концепция выйдет либо дорогой, либо слабой","correct":true,"rationale":"Бюджет определяет тип застройки — его нельзя отложить."},{"id":"o1","text":"Делает три концепции в трёх ценовых категориях — 25, 40 и 55 тыс. ₽/м², — чтобы клиент выбрал бюджет по картинке","correct":false,"rationale":"Тройная работа, и клиент выберет самую дорогую картинку с дешёвым бюджетом."},{"id":"o2","text":"Соглашается: бюджет действительно удобнее обсуждать, когда есть за что платить","correct":false,"rationale":"Так рождаются концепции, которые не продаются."},{"id":"o3","text":"Берёт верх рыночной вилки, 55 тыс. ₽/м², как рабочий бюджет и предупреждает, что уменьшить всегда можно","correct":false,"rationale":"Уменьшение ломает концепцию; лучше вилка сразу."}],"anchor":{"g":"wording","p":{"bad":"бюджет обсудим после концепции","good":"на 60 м² аналоги стоят 1,8–3 млн — в какой вилке работаем?"},"cap":"бюджет — до эскиза"},"id":"u0-2-t0"},{"mechanic":"single","points":2,"stem":"На плане павильона ваш стенд 36 м² стоит у главного входа, слева сосед 6 м высотой, справа — проход. Что это меняет?","options":[{"id":"o0","text":"Доминанту и ключевой ракурс развернуть на вход и правый проход; левая сторона закрыта соседом","correct":true,"rationale":"Поток идёт от входа, высокий сосед глушит левую сторону."},{"id":"o1","text":"Поднять доминанту до 6,5 м, чтобы читаться поверх соседа, и согласовать превышение регламента с площадкой","correct":false,"rationale":"Гонка высот съест бюджет; нужно развернуть композицию."},{"id":"o2","text":"Ничего: план павильона влияет только на логистику монтажа и заезда, композиция стенда от него не зависит","correct":false,"rationale":"План — источник ключевого ракурса."},{"id":"o3","text":"Отказаться от места и просить организатора перенести стенд в центр павильона","correct":false,"rationale":"Место у входа — одно из лучших; просто используйте его."}],"anchor":{"g":"plan","p":{"w":9,"d":4,"open":["f","r"],"zones":[["rec",0.05,0.55,0.3,0.4],["demo",0.4,0.2,0.3,0.6]],"dom":[0.85,0.2],"flow":true,"note":"слева сосед 6 м → доминанта к входу и проходу"},"cap":"план павильона задаёт ключевой ракурс"},"id":"u0-2-t1"},{"mechanic":"single","points":2,"stem":"Зачем в ТЗ фиксировать число вариантов концепции и число итераций правок?","options":[{"id":"o0","text":"Чтобы правки были конечными и изменение объёма имело основание для доплаты","correct":true,"rationale":"ТЗ — контракт на концепцию."},{"id":"o1","text":"Чтобы клиент не выбирал между вариантами слишком долго и не затягивал тендер","correct":false,"rationale":"Скорость выбора — другой вопрос."},{"id":"o2","text":"Это формальность, которую требуют юристы для договора и которая на работу не влияет","correct":false,"rationale":"Влияет напрямую: без лимита правок проект не заканчивается."},{"id":"o3","text":"Чтобы дизайнеры знали, сколько рендеров делать для каждой концепции","correct":false,"rationale":"Рендеры — внутреннее решение, не предмет ТЗ."}],"anchor":{"g":"formula","p":{"f":"ТЗ: площадь · зоны · экспонаты · сообщение · бюджет · сроки · регламент · 3 концепции · 2 итерации","fs":11},"cap":"ТЗ подписывает клиент"},"id":"u0-2-t2"},{"mechanic":"single","points":2,"stem":"Бренд-гайда у клиента нет. Что делать до концепции?","options":[{"id":"o0","text":"Собрать мудборд из сайта, упаковки и соцсетей, согласовать его с клиентом письменно","correct":true,"rationale":"Мудборд — замена гайда и защита от «мы это не так видели»."},{"id":"o1","text":"Придумать фирменный стиль для стенда с нуля — это возможность показать креатив агентства","correct":false,"rationale":"Стенд без связи с брендом не узнают."},{"id":"o2","text":"Взять палитру и шрифты из логотипа и больше не уточнять — на стенде этого достаточно","correct":false,"rationale":"Тон, фото, запреты — тоже бренд."},{"id":"o3","text":"Попросить клиента заказать разработку бренд-гайда и отложить концепцию до его готовности","correct":false,"rationale":"Нереалистично по срокам выставки."}],"anchor":{"g":"pipeline","p":{"steps":["сайт","упаковка","соцсети","мудборд","согласование"],"hl":[3,4]},"cap":"нет гайда — есть мудборд"},"id":"u0-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре разреза стенда у входа в павильон с соседом 6 м слева. Какой вариант правильно реагирует на регламент (лимит 5 м) и соседа?","vopts":[{"id":"v0","v":{"g":"elevv","p":{"h":4.5,"maxH":5,"logo":4,"note":"4,5 м, лого вверху, фасад к входу"}},"lbl":"","correct":true,"rationale":"В пределах регламента, логотип в верхней зоне, работает на входной поток."},{"id":"v1","v":{"g":"elevv","p":{"h":6.5,"maxH":5,"logo":6,"note":"6,5 м — выше соседа"}},"lbl":"","correct":false,"rationale":"Превышение регламента на 1,5 м — потребует согласования и денег, которых нет."},{"id":"v2","v":{"g":"elevv","p":{"h":2.5,"maxH":5,"logo":1.2,"note":"2,5 м, лого на уровне глаз"}},"lbl":"","correct":false,"rationale":"Стандартная высота, логотип внизу — стенд утонет за соседом."},{"id":"v3","v":{"g":"elevv","p":{"h":4.5,"maxH":5,"logo":4,"solid":true,"note":"4,5 м, глухой фасад на проход"}},"lbl":"","correct":false,"rationale":"Высота верная, но глухая стена на открытую сторону — закрытая витрина и нарушение правил площадки."}],"id":"u0-2-t4"}],"framework":"Семь вопросов брифа: цель и KPI, аудитория, экспонаты, люди и зоны, бюджет-вилка, площадка и план, бренд и история. План павильона читают до эскиза: поток, соседи, колонны, высота. ТЗ подписывает клиент: площадь, зоны, сообщение, бюджет, сроки, регламент, число вариантов и правок. Без гайда — мудборд.","anchor":{"g":"tree","p":{"root":"бриф → ТЗ","kids":["цель и KPI","экспонаты","зоны","бюджет","план","бренд"]},"cap":"концепция рождается из брифа"},"layers":{"simple":"Прежде чем рисовать, узнай, зачем клиент едет на выставку: собрать визитки, подписать контракты, показать новый продукт или просто «быть». От этого зависит всё: большая стойка или много переговорных, сцена или демо-зона.\nПотом посмотри на план павильона, как на карту: откуда идут люди, кто соседи и какой они высоты, где колонны. Первое, что увидит посетитель, — и есть главный ракурс стенда.\nЗапиши ответы в ТЗ и дай клиенту подписать. Это не бюрократия: подписанное ТЗ — единственная защита от «а мы думали по-другому» после трёх недель работы.\nПроверь себя: почему бюджет нужно знать до концепции, а не после?","how":"1. Бриф: цель и KPI → аудитория → экспонаты (габариты, вес, электрика) → люди и зоны → бюджет-вилка → площадка и план → бренд и история. Ответы фиксируются и подтверждаются клиентом в тот же день.\n2. План павильона: входы и главные проходы, соседи и их высота, колонны, люки, высота зала, ограничения. На плане — стрелки потока и ключевой ракурс.\n3. ТЗ: площадь и тип, зоны с площадями, экспонаты, ключевое сообщение, бюджет, сроки, регламент площадки, число концепций и итераций. Подпись клиента.\n4. Бренд: гайд (лого, поля, палитра, шрифты, тон) или согласованный мудборд; прошлые стенды и конкуренты — чтобы отстроиться.\n5. Пример. Бриф: производитель оборудования, цель — 150 контактов и 10 переговоров с дилерами, экспонат 2×1,5 м весом 400 кг с электричеством 3 кВт, 6 менеджеров, бюджет 2–2,5 млн на 60 м², полуостров у центрального прохода, гайд есть. ТЗ: ресепшн 8 м², демо 20 м², две переговорные по 6 м², подсобка 4 м², открытая зона 16 м²; сообщение — «новая линейка»; концепция за 10 дней, 2 варианта, 2 итерации.","formula":{"f":"концепция = f(цель, аудитория, экспонаты, зоны, бюджет, план павильона, бренд)\nТЗ = площадь + зоны (м²) + экспонаты + сообщение + бюджет + сроки + регламент + варианты × итерации","legend":[["цель","что клиент считает успехом","150 контактов, 10 переговоров"],["зоны","ресепшн, демо, переговорные, подсобка, бар","8 / 20 / 2×6 / 4 м²"],["бюджет","вилка застройки без аренды","2–2,5 млн ₽"],["план","поток, соседи, колонны, высота","полуостров у центрального прохода"],["варианты × итерации","сколько концепций и правок входит в цену","2 × 2"]],"note":"Любой вопрос брифа без ответа — выбор наугад в концепции. Ответы записывайте при клиенте и отправляйте ему на подтверждение в тот же день."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Семь вопросов брифа: цель и KPI, аудитория, экспонаты, люди и зоны, бюджет-вилка, площадка и план, бренд и история.\n— План павильона читают до эскиза: поток, соседи и их высота, колонны, высота зала — отсюда ключевой ракурс.\n— ТЗ подписывает клиент: площадь, зоны, сообщение, бюджет, сроки, регламент, число вариантов и правок.\n— Бюджет узнаётся до концепции — он определяет тип застройки.\n— Нет бренд-гайда — согласованный мудборд; прошлые стенды и конкуренты — чтобы отстроиться.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Почему бюджет нужно знать до концепции, а не после?","o":["Бюджет определяет тип застройки, высоту, материалы и экраны — без него концепция случайна","Потому что договор с агентством подписывается только после согласования сметы с финансовым отделом клиента","Чтобы визуализатор знал, сколько рендеров делать и в каком разрешении их сдавать"],"a":0,"w":"Концепция на 20 тыс./м² и на 60 тыс./м² — это разные объекты, а не один с правками."},{"q":"Что первым читают на плане павильона?","o":["Номера соседних стендов, чтобы узнать названия компаний и их отрасль","Поток посетителей: входы, главные проходы, ключевой ракурс","Площадь зала целиком, чтобы оценить масштаб выставки и число участников"],"a":1,"w":"Первый взгляд посетителя — и есть главный ракурс концепции."},{"q":"В формуле ТЗ зачем «варианты × итерации»?","o":["Чтобы правки были конечными, а изменение объёма — основанием для доплаты","Чтобы клиент выбрал лучший вариант из большего числа и остался доволен","Чтобы занять дизайнеров на время тендера и показать производительность агентства"],"a":0,"w":"ТЗ — контракт на концепцию: число вариантов и правок — его часть."},{"q":"Гайда нет. Что делать?","o":["Придумать стиль стенда с нуля — свобода для креатива","Мудборд из сайта, упаковки и соцсетей, согласованный письменно","Отложить концепцию, пока клиент не закажет бренд-гайд у брендингового агентства"],"a":1,"w":"Стенд должны узнать; мудборд — замена гайда и защита от «мы это иначе видели»."}],"rules":["Семь вопросов брифа: цель и KPI, аудитория, экспонаты, люди и зоны, бюджет-вилка, площадка и план, бренд и история.","План павильона читают до эскиза: поток, соседи и их высота, колонны, высота зала — отсюда ключевой ракурс.","ТЗ подписывает клиент: площадь, зоны, сообщение, бюджет, сроки, регламент, число вариантов и правок.","Бюджет узнаётся до концепции — он определяет тип застройки.","Нет бренд-гайда — согласованный мудборд; прошлые стенды и конкуренты — чтобы отстроиться."]}},{"id":"u1-1","level":"L1","title":"Планировка и зонирование: как провести посетителя","lead":"Стенд проектируют от траектории человека, а не от фасада","concept":"План стенда — это сценарий для посетителя: заметил с прохода, подошёл к открытой стороне, увидел продукт, встретил менеджера, сел переговорить, ушёл с контактом. Зоны: ресепшн/стойка (встреча, визитки, кофе) — у открытой стороны, но не перегораживая вход; открытая зона и демо (экспонаты, экраны) — на виду с прохода; переговорные открытые (столики) и закрытые (комнаты с дверью) — в глубине, у глухой стены; подсобка/склад (вода, куртки, раздатка, сервер) — в самом невидном углу, 4–8% площади, с дверью наружу для пополнения; бар — там, где хотят задержать людей; сцена — при наличии программы и площади от 100 м². Нормы на пальцах: 1 менеджер на 8–12 м² открытой зоны, переговорная на 4 человек — 6–8 м², закрытая комната — от 9 м², стойка ресепшн — 2–3 м длины на поток 100 контактов в день. Траектория: входы не на углу, где сталкиваются потоки, а по центру открытой стороны; проход внутри стенда — от 1,2 м (эвакуация, коляска); экспонат — так, чтобы его обходили, а не упирались; переговорные — чтобы из них не было видно прохода (не отвлекает) и чтобы в них не заглядывали. Открытые стороны не застраивают глухими стенами: и по регламенту площадок (Экспоцентр требует согласования), и по здравому смыслу — закрытый фасад читается как «вход воспрещён».","points":[{"h":"Зоны и их место на плане","t":"Ресепшн — у открытой стороны, сбоку от входа, лицом к потоку. Демо и экспонаты — в первой трети от прохода, обходимые с трёх сторон. Открытые переговорные — в средней зоне. Закрытые переговорные, VIP, бар — в глубине у глухой стены или в центре островного стенда. Подсобка — в невидном углу, дверь не на фасад. Сцена — у длинной стороны, чтобы зрители не стояли в проходе павильона."},{"h":"Нормы площади на пальцах","t":"Менеджер — 8–12 м² открытой зоны; открытая переговорная на 4 — 6–8 м²; закрытая — от 9 м²; подсобка — 4–8% площади, минимум 2×1,5 м; стойка — 1 м длины на 30–40 контактов в день; проходы внутри — не уже 1,2 м; вокруг экспоната — 0,8–1 м обхода. На 100 м²: ресепшн 8, демо 25, открытые переговорные 16, две закрытые 20, подсобка 6, свободная зона и проходы 25."},{"h":"Траектория и ошибки плана","t":"Правильно: вход в центре открытой стороны → ресепшн сбоку → экспонат как магнит → переговорные дальше. Ошибки: стойка поперёк входа (барьер); подсобка дверью на проход; переговорная с окнами на павильон (в неё заглядывают); экспонат вплотную к стене (не обойти); одна тропинка шириной 0,8 м между всем; бар у самого прохода (толпа выливается в проход, организатор делает замечание)."},{"h":"Открытые стороны — витрина, не стена","t":"Регламенты площадок: стороны, выходящие в проход, не застраивают глухими стенами без согласования; у стандартных стендов — стены 2,5 м по границе, у эксклюзива — рекомендация держать фасад проницаемым. Решение: полупрозрачные экраны, рейки, стекло, ткань, перепад высот; глухая стена допустима на треть фасада под графику или лайтбокс, если остальное открыто."}],"practice":{"mechanic":"numeric","points":3,"stem":"Стенд 120 м². Нормы: ресепшн 8 м², демо 30 м², две закрытые переговорные по 10 м², открытая переговорная 8 м², подсобка 6% площади, остальное — проходы и свободная зона. Сколько м² останется на проходы и свободную зону?","answer":46.8,"tol":0.6,"unit":"м²","solution":"Подсобка: 6% × 120 = 7,2 м². Занято: 8 + 30 + 20 + 8 + 7,2 = 73,2 м². Остаток: 120 − 73,2 = 46,8 м² (39%) — нормальный запас для проходов и толпы у демо; если остаётся меньше 30%, план «тесный».","anchor":{"g":"plan","p":{"w":12,"d":10,"open":["f","l","r"],"zones":[["rec",0.05,0.7,0.2,0.25],["demo",0.3,0.35,0.4,0.55],["meet",0.75,0.05,0.22,0.45],["meet",0.75,0.52,0.22,0.3],["store",0.05,0.05,0.2,0.22]],"dom":[0.5,0.12],"flow":true},"cap":"120 м²: 60% зоны, 40% воздух и проходы"},"id":"u1-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Клиент просит стойку ресепшн «прямо у входа, чтобы никого не пропустить». Ответ арт-директора?","options":[{"id":"o0","text":"Стойка сбоку от входа лицом к потоку: барьер у входа отпугивает, боковая стойка встречает","correct":true,"rationale":"Входной барьер — классическая ошибка плана."},{"id":"o1","text":"Поставить стойку поперёк входа, но сделать её ниже 0,9 м и без фронтальной панели, чтобы она не читалась барьером","correct":false,"rationale":"Низкий барьер — всё равно барьер."},{"id":"o2","text":"Отказаться от стойки вовсе: менеджеры встречают гостей стоя, это современнее","correct":false,"rationale":"Стойка нужна для визиток, кофе, хранения; вопрос в месте."},{"id":"o3","text":"Сделать два входа и две стойки по углам, чтобы перекрыть оба потока с прохода и ни один гость не прошёл мимо","correct":false,"rationale":"Удвоение площади и персонала ради ошибки."}],"anchor":{"g":"plan","p":{"w":9,"d":6,"open":["f"],"zones":[["rec",0.05,0.6,0.25,0.35],["demo",0.35,0.2,0.3,0.6],["meet",0.7,0.05,0.27,0.5]],"dom":[0.5,0.1],"flow":true,"note":"стойка сбоку, вход в центре фасада"},"cap":"стойка встречает, а не перегораживает"},"id":"u1-1-t0"},{"mechanic":"single","points":2,"stem":"Где на островном стенде 150 м² спрятать подсобку 10 м²?","options":[{"id":"o0","text":"В центре, внутри конструкции доминанты, с дверью в сторону переговорных","correct":true,"rationale":"У островного нет спины; центр — единственное невидимое место."},{"id":"o1","text":"В любом углу: углы островного стенда меньше просматриваются с прохода и годятся для склада","correct":false,"rationale":"Углы островного стенда — самые просматриваемые точки."},{"id":"o2","text":"Отказаться от подсобки и хранить всё в арендованных шкафах у площадки за пределами стенда","correct":false,"rationale":"Вода, куртки и раздатка нужны ежеминутно."},{"id":"o3","text":"Под подиумом высотой 0,4 м, чтобы не терять полезную площадь на плане","correct":false,"rationale":"0,4 м — это не подсобка, а ящик; и подиум такой высоты требует пандусов."}],"anchor":{"g":"plan","p":{"w":15,"d":10,"open":["f","b","l","r"],"zones":[["store",0.4,0.4,0.2,0.2],["meet",0.62,0.3,0.3,0.4],["rec",0.08,0.6,0.22,0.3],["demo",0.08,0.1,0.3,0.4]],"dom":[0.5,0.3],"flow":true,"note":"островной: подсобка в ядре доминанты"},"cap":"у островного стенда не
