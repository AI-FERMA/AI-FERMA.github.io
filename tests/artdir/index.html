function labZones(box){var st=S.get('labzones',{area:120,managers:6,closed:2,open:1,demo:30,bar:0,stage:0});
  box.innerHTML='<div class="lab"><h3>Зоны: нормы и воздух</h3><div class="small muted">Менеджер 8–12 м² · открытая переговорная 6–8 · закрытая ≥ 9 · подсобка 4–8% и ≥ 2×1,5 · бар 6–10 · воздух 30–40% · проходы ≥ 1,2 м.</div><div class="two">'+fld('lz-area','Площадь стенда, м²',st.area)+fld('lz-man','Менеджеров на стенде одновременно',st.managers)+'</div><div class="two">'+fld('lz-closed','Закрытых переговорных',st.closed)+fld('lz-open','Открытых переговорных',st.open)+'</div><div class="two">'+fld('lz-demo','Демо-зона и экспонаты, м²',st.demo)+fld('lz-bar','Бар / кофе-пойнт, м² (0 — нет)',st.bar)+'</div>'+fld('lz-stage','Сцена / презентационная зона, м² (0 — нет)',st.stage)+'<button class="btn wide" id="lz-go">Посчитать</button><div id="lz-res"></div></div>';
  function run(){var A_=gv('lz-area'),man=gv('lz-man')||0,cl=gv('lz-closed')||0,op=gv('lz-open')||0,demo=gv('lz-demo')||0,bar=gv('lz-bar')||0,stage=gv('lz-stage')||0;if(!(A_>0))return;
    S.set('labzones',{area:A_,managers:man,closed:cl,open:op,demo:demo,bar:bar,stage:stage});labUsed('zones');
    var rec=Math.max(4,Math.min(12,2+man*1.5));var store=Math.max(3,A_*0.06);var closedA=cl*9,openA=op*7;var used=rec+store+closedA+openA+demo+bar+stage;var air=A_-used;var airPct=air/A_;
    var r='<div class="res"><div class="k">Воздух</div><div class="big" style="color:'+(airPct>=0.3&&airPct<=0.45?'var(--ok)':'var(--err)')+'">'+Math.round(airPct*100)+'%</div><div class="small muted">занято '+fmtNum(Math.round(used))+' м² из '+A_+(airPct<0.3?' · <b>тесно: убрать зону или уменьшить демо</b>':(airPct>0.45?' · <b>пусто: добавить функцию или уменьшить площадь</b>':' · норма 30–40%'))+'</div></div>';
    var rows=[['ресепшн',rec],['демо',demo],['закрытые ×'+cl,closedA],['открытые ×'+op,openA],['подсобка',store]];if(bar)rows.push(['бар',bar]);if(stage)rows.push(['сцена',stage]);rows.push(['воздух',Math.max(0,air)]);
    r+=glyphHtml({g:'stack2',p:{rows:rows.map(function(x){return [x[0],Math.round(x[1])];})}});

function labSched(box){var st=S.get('labsched',{montage:'2026-05-09',shop:4,rd:2,paint:1,hang:0,floor2:0,tender:1});
  function addDays(iso,d){var p=iso.split('-');var dt=new Date(+p[0],+p[1]-1,+p[2]);dt.setDate(dt.getDate()+d);return dt;}
  function fmtD(dt){var m=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];return dt.getDate()+' '+m[dt.getMonth()];}
  function iso(dt){function z(n){return (n<10?'0':'')+n;}return dt.getFullYear()+'-'+z(dt.getMonth()+1)+'-'+z(dt.getDate());}
  box.innerHTML='<div class="lab"><h3>График: от монтажа назад</h3><div class="small muted">Дедлайн концепции = монтаж − цех − РД. Окраска МДФ 7–10 дней — первой в очередь; контрольная сборка за 3–5 дней до отгрузки; подвес — заявка за 2–3 недели; второй этаж — согласование 6–8 недель.</div><div class="two">'+fld('ls-m','Дата начала монтажа',st.montage,'type="date"')+fld('ls-shop','Цех, недель',st.shop)+'</div><div class="two">'+fld('ls-rd','Рабочая документация, недель',st.rd)+fld('ls-tender','Тендер/утверждение после концепции, недель',st.tender)+'</div><div class="two">'+fld('ls-paint','Окраска МДФ (1 — есть)',st.paint)+fld('ls-hang','Подвес (1 — есть)',st.hang)+'</div>'+fld('ls-f2','Второй этаж (1 — есть)',st.floor2)+'<button class="btn wide" id="ls-go">Посчитать</button><div id="ls-res"></div></div>';
  function run(){var mEl=document.getElementById('ls-m');var m=mEl?mEl.value:'';var shop=gv('ls-shop'),rd=gv('ls-rd'),tnd=gv('ls-tender')||0,paint=gv('ls-paint')?1:0,hang=gv('ls-hang')?1:0,f2=gv('ls-f2')?1:0;if(!m||!(shop>0&&rd>0))return;
    S.set('labsched',{montage:m,shop:shop,rd:rd,paint:paint,hang:hang,floor2:f2,tender:tnd});labUsed('sched');
    var shopDays=Math.round(shop*7);if(paint&&shopDays<21)shopDays=21;if(f2)shopDays=Math.max(shopDays,42);
    var ship=addDays(m,-1),assembly=addDays(m,-5),shopStart=addDays(m,-1-shopDays),rdStart=addDays(iso(shopStart),-Math.round(rd*7)),concept=addDays(iso(rdStart),-Math.round(tnd*7)),hangDl=addDays(m,-21),f2Dl=addDays(m,-49),docsDl=addDays(m,-24);
    var today=new Date();today.setHours(0,0,0,0);var left=Math.round((concept-today)/86400000);
    var r='<div class="res"><div class="k">Концепция должна быть готова к</div><div class="big" style="color:'+(left>=0?'var(--ok)':'var(--err)')+'">'+fmtD(concept)+'</div><div class="small muted">'+(left>=0?'осталось '+left+' дн. на бриф и концепцию':'дедлайн прошёл '+(-left)+' дн. назад — срок держится заменой материалов')+' · утверждение клиентом до <b>'+fmtD(rdStart)+'</b></div></div>';
    var items=[['концепция '+fmtD(concept)],['РД '+fmtD(rdStart)],['цех '+fmtD(shopStart)],['сборка '+fmtD(assembly)],['монтаж '+fmtD(addDays(m,0))]];
    r+=glyphHtml({g:'timeline',p:{items:items.map(function(x){return x[0];}),hl:3}});
    var rows=[['Утверждение концепции',fmtD(rdStart)],['Проект площадке (план, разрез, электрика)',fmtD(docsDl)],['Запуск цеха'+(paint?' — окраска МДФ первой':''),fmtD(shopStart)],['Контрольная сборка',fmtD(assembly)],['Отгрузка',fmtD(ship)]];if(hang)rows.splice(2,0,['Заявка на подвес + расчёт',fmtD(hangDl)]);if(f2)rows.splice(1,0,['Согласование второго этажа',fmtD(f2Dl)]);
    r+=glyphHtml({g:'cost',p:{lines:rows}});
    var tips=[];if(paint&&shop<3)tips.push('окраска 7–10 дней не влезает в '+shop+' недели цеха — срок цеха поднят до 3 недель; иначе плёнка/ткань на плоскостях');if(hang&&(hangDl<rdStart))tips.push('заявка на подвес нужна раньше утверждения концепции — подавать по эскизу с планом Б');if(f2&&f2Dl<concept)tips.push('согласование этажа начинать до готовой концепции — по объёмной схеме');if(!tips.length)tips.push('каждая неделя задержки утверждения — неделя из цеха: сначала исчезает окраска, потом фрезеровка, потом сборка');
    r+='<div class="sol small">'+tips.join('. ')+'.\nПять точек надзора в графике: ревью РД, образцы, сборка, монтаж день 1, приёмка с фото в первый день выставки.</div>';
    document.getElementById('ls-res').innerHTML=r;}
  document.getElementById('ls-go').onclick=run;run();}

  var nd=a.defects.length;var fpart=nd?Math.max(0,(hit-fp*0.5)/nd):(fp?0:1);var score=0.7*fpart+0.3*(vOk?1:0);if(hit===nd&&!fp&&vOk)score=1;return {hit:hit,fp:fp,vOk:vOk,score:score};}
