шой","why":"Спросят; остановка монтажа."},{"t":"Ткань обработали составом на месте и считают сертифицированной: чек на огнезащиту прикладывают к проекту","why":"Нужен сертификат или протокол."},{"t":"Сертификат есть на ткань, но не на ковролин: «ковролин же от площадки», хотя взяли свой фирменного цвета","why":"Свой ковролин — свой сертификат."}]},"simple":"Бумага, которая доказывает, что стенд не вспыхнет.","remember":"Документ в папке проекта до монтажа."},{"name":"Разузловка","level":"L3","def":"Деление стенда на модули по габаритам листов (ЛДСП 2800×2070, фанера 2440×1220) и транспорта (фура 13,6×2,45×2,6 м, ворота павильона); стыки в углах, под плёнкой или в теневом зазоре 5–10 мм; модуль ≤ 80–100 кг.","rdef":"Деление стенда на модули по листам и транспорту; стыки в теневой зазор; модуль ≤ 80–100 кг.","when":"РД, проверка технологичности идеи.","ex":"Стена 9×3,5 глянец: четыре модуля 2,25 м с теневым зазором 8 мм, показанным клиенту на рендере; ворота павильона 2,4 м — модули проходят.","near":[{"t":"Деление стенда на модули по габаритам листов, которые на монтаже стыкуют, шпаклюют и красят по месту для бесшовной поверхности.","why":"В павильоне не шпаклюют и не красят; стыки проектируют."},{"t":"Схема расстановки зон стенда по плану с размерами и привязками для презентации клиенту.","why":"Это планировка, не разузловка."}],"nb":[{"t":"Рабочая документация","d":"Чертежи для цеха и монтажа: планы, разрезы, развёртки, узлы, спецификация, электрика, ведомость печати, план монтажа.","why":"Разузловка — часть РД."},{"t":"Контрольная сборка","d":"Сборка ключевых узлов в цеху перед отгрузкой с приёмкой арт-директора по чек-листу.","why":"Сборка проверяет разузловку."}],"apps":{"ok":"Стену 9 м без швов в рендере делят на четыре модуля с теневым зазором и показывают стык клиенту на концепции.","okWhy":"По листам и фуре; стыки спроектированы.","bad":[{"t":"Заказывают лист 9 м у поставщика композита: клиенту обещан бесшовный глянец, а довезём на длинномере","why":"Не влезет в фуру и ворота."},{"t":"Модули по 150 кг: «подъёмник поднимет», зато швов вдвое меньше и собирать быстрее","why":"≤ 80–100 кг на двоих или сборка по месту."},{"t":"Стыки решают на монтаже «по факту»: монтажники опытные, зашпаклюют и закрасят по месту за ночь, а клиент стыков на рендере не видел","why":"Стыки — на концепции и в РД."}]},"simple":"Как распилить шкаф, чтобы он прошёл в дверь и собрался без щелей.","remember":"Лист · фура · теневой зазор."},{"name":"Рабочая документация","level":"L3","def":"Чертежи для цеха и монтажа: планы с размерами, разрезы и фасады с высотами, развёртки стен с графикой, узлы, спецификация материалов (толщины, RAL/декоры, класс горючести), схема электрики и света, ведомость печати, план монтажа; делает конструктор, ревьюит арт-директор.","rdef":"Чертежи для цеха: планы, разрезы, развёртки, узлы, спецификация, электрика, печать, план монтажа.","when":"После утверждения концепции; 1–2 недели; ревью арт-директора.","ex":"РД на 120 м²: 42 листа; в ревью арт-директор нашёл доминанту 4,6 вместо 5 м и ЛДСП вместо МДФ на ресепшн — исправлено до запуска.","near":[{"t":"Чертежи для цеха и монтажа, которые конструктор делает по рендеру без паспорта концепции, уточняя размеры у визуализатора.","why":"Исходник — паспорт концепции с планом и разрезами, не рендер."},{"t":"Презентационный комплект для клиента: рендеры, план зон, смета и сроки, по которому утверждают концепцию.","why":"Это тендерная презентация, не РД."}],"nb":[{"t":"Паспорт концепции","d":"Документ передачи концепции в РД: план, разрезы, ракурс, RAL, свет, список «не менять», приоритеты сокращения.","why":"Паспорт — вход для РД."},{"t":"Разузловка","d":"Деление стенда на модули по листам и транспорту; стыки в теневой зазор.","why":"Разузловка — раздел РД."}],"apps":{"ok":"Арт-директор ревьюит РД на соответствие паспорту: высоты, материалы, цвета, свет — до запуска в цех.","okWhy":"Конструктор делает, арт-директор ревьюит до цеха.","bad":[{"t":"РД делают по рендеру: «там всё видно», конструктор снимет пропорции с картинки и уточнит у визуализатора","why":"Размеры по рендеру — с ошибкой."},{"t":"Арт-директор не смотрит РД: «конструктор знает лучше», а 42 листа чертежей — не его компетенция","why":"Там теряются пропорции и материалы."},{"t":"В спецификации «цвет синий» без RAL: цех видел рендер и подберёт похожий, а образец — лишний день","why":"Цех возьмёт свой синий."}]},"simple":"Инструкция для цеха: что, из чего, какого размера и цвета.","remember":"Планы · разрезы · развёртки · узлы · спецификация."},{"name":"Контрольная сборка","level":"L3","def":"Сборка ключевых узлов стенда (доминанта, ресепшн, стыки графики, свет) в цеху за 3–5 дней до отгрузки с приёмкой арт-директора по чек-листу: RAL по образцу, стыки, читаемость, лицевые поверхности; последняя точка дешёвых исправлений.","rdef":"Сборка ключевых узлов в цеху перед отгрузкой с приёмкой арт-директора по чек-листу.","when":"Обязательная точка в графике каждого эксклюзива.","ex":"Сборка за 4 дня до отгрузки: стык фриза перенесён в теневой зазор, RAL 5002 сверен с образцом, два прожектора перенаправлены — на монтаже это стоило бы ночи.","near":[{"t":"Полная сборка всего стенда в цеху с мебелью и графикой за две недели до отгрузки, чтобы отснять его для портфолио.","why":"Собирают ключевые узлы за 3–5 дней; фото — на выставке."},{"t":"Репетиция монтажной бригады на площадке за день до выставки для ускорения монтажа.","why":"Это день монтажа; сборка — в цеху."}],"nb":[{"t":"Рабочая документация","d":"Чертежи для цеха: планы, разрезы, развёртки, узлы, спецификация, электрика, печать, план монтажа.","why":"РД — что собирать; сборка — проверка."},{"t":"Авторский надзор","d":"Контроль соответствия результата концепции арт-директором на пяти точках: ревью РД, образцы, сборка, монтаж, приёмка.","why":"Сборка — одна из точек надзора."}],"apps":{"ok":"Арт-директор едет на два часа в цех: доминанта, ресепшн, стыки и свет — исправить можно только здесь.","okWhy":"За 3–5 дней до отгрузки; ключевые узлы; чек-лист.","bad":[{"t":"Сборку пропускают: «конструктор проверил, монтажники опытные», а два дня простоя цеха и поездка дороже любых возможных правок","why":"Стыки и цвет вскроются на монтаже."},{"t":"На сборку отправляют визуализатора с рендером: он лучше всех помнит, как должен выглядеть стенд","why":"Решения о заменах — арт-директор."},{"t":"Собирают всё целиком за две недели — цех простаивает, зато можно отснять стенд для портфолио заранее","why":"Ключевые узлы за 3–5 дней."}]},"simple":"Примерка костюма до свадьбы.","remember":"Два часа в цеху против ночи на монтаже."},{"name":"Смета стенда","level":"L4","def":"Структура стоимости эксклюзива: конструктив 35–45%, графика 8–12, свет и электрика 8–12, AV 5–20, мебель и декор 5–10, логистика и монтаж 15–20, проектирование 5–8, площадка и организация 8–12, маржа 20–35; цена за м² по категории.","rdef":"Структура стоимости: конструктив ~40%, графика, свет, AV, мебель, монтаж, проект, площадка, маржа.","when":"Оценка концепции до сметчика; переговоры о цене.","ex":"80 м² × 42 тыс. = 3,36 млн: конструктив 1,35, монтаж и логистика 0,6, графика 0,34, свет 0,34, AV 0,27, мебель 0,24, проект 0,24 — плюс площадка и организация.","near":[{"t":"Структура стоимости эксклюзива: конструктив 80%, остальное — печать и проектирование; монтаж и логистику площадка включает в аренду.","why":"Монтаж и логистика 15–20% — отдельно; аренда их не включает."},{"t":"Прайс площадки на аренду площади, электричество, пропуска и уборку, который клиент оплачивает организатору.","why":"Это счёт организатора, не смета застройки."}],"nb":[{"t":"Цена за м²","d":"Ориентир стоимости застройки по категориям: стандарт+ 6–12 тыс., эксклюзив простой 25–35, средний 35–55, сложный 55–100+.","why":"Цена за м² — итог сметы, делённый на площадь."},{"t":"Скрытые затраты","d":"Подвес, электроподключение, пропуска, уборка, подъёмник, перепечатка, хранение — строка «площадка и организация» 8–12%.","why":"Скрытые — раздел сметы, который забывают."}],"apps":{"ok":"На эскизе арт-директор называет: средний эксклюзив, 42 тыс./м², 3,4 млн на 80 м² — и структура подтверждается сметчиком.","okWhy":"Структура по долям; категория на эскизе.","bad":[{"t":"Смету считают после презентации: «сначала идея», цифры только зажмут дизайнера, а сметчик потом подгонит под бюджет","why":"Концепция вне бюджета будет порезана."},{"t":"В смете нет монтажа и логистики: «посчитаем по факту», ведь число машин и ночных смен известно только после монтажа","why":"Минус 15–20% маржи на старте."},{"t":"Экран закладывают на 60% сметы: он даст главный эффект, а конструктив и свет можно удешевить до плёнки и стандартных прожекторов","why":"Стенд без конструктива и света."}]},"simple":"Чек за стенд по статьям — от каркаса до пропусков.","remember":"Конструктив 40 · монтаж 17 · свет 10 · графика 10 · AV · площадка 8–12."},{"name":"Цена за м²","level":"L4","def":"Ориентир стоимости застройки по категориям (Москва, 2025–2026): стандарт с улучшениями 6–12 тыс. ₽, эксклюзив простой 25–35, средний 35–55, сложный (металл, подвес, экран, этаж) 55–100+; аренда площади отдельно 10–20 тыс.","rdef":"Ориентир стоимости застройки: стандарт+ 6–12 тыс., эксклюзив 25–35 / 35–55 / 55–100+ ₽ за м².","when":"Первая оценка на эскизе; разговор с клиентом категориями.","ex":"Бюджет 2 млн на 100 м² = 20 тыс./м² — простой эксклюзив без подвеса и LED; концепция с металлом и экраном — 60 тыс./м² — не в этом проекте.","near":[{"t":"Ориентир стоимости застройки: стандарт+ 6–12 тыс., эксклюзив 25–35 тыс. за м² независимо от сложности, высоты и экранов.","why":"Сложность, высота, экран и этаж сдвигают категорию до 55–100+."},{"t":"Стоимость аренды площади у организатора: 10–20 тыс. ₽ за м², которую платит клиент напрямую.","why":"Аренда — отдельно от застройки."}],"nb":[{"t":"Смета стенда","d":"Структура стоимости: конструктив ~40%, графика, свет, AV, мебель, монтаж, проект, площадка, маржа.","why":"Цена за м² — результат сметы."},{"t":"Эксклюзивная застройка","d":"Индивидуальный проект стенда под клиента; 25–80 тыс. ₽/м².","why":"Категории эксклюзива — градация цены за м²."}],"apps":{"ok":"Бюджет ÷ площадь = категория: 2 млн ÷ 100 = 20 тыс. — простой эксклюзив, и концепция рисуется в этих рамках.","okWhy":"Бюджет ÷ S = категория; назвать на эскизе.","bad":[{"t":"Называют одну цену за м² для любого стенда агентства — 40 тысяч: клиенту проще, а разницу выровняем между проектами","why":"Категории различаются в 3–4 раза."},{"t":"Цену за м² считают вместе с арендой площади: клиент платит одну сумму и не хочет разбираться, кому сколько","why":"Аренда — организатору, отдельно."},{"t":"Клиенту с 20 тыс./м² рисуют металл и подвес: «потом ужмём», главное — выиграть тендер красивой картинкой","why":"Ужать металл до плёнки — другая концепция."}]},"simple":"Сколько стоит квадратный метр стенда — как цена за метр квартиры.","remember":"6–12 · 25–35 · 35–55 · 55–100+."},{"name":"Скрытые затраты","level":"L4","def":"Статьи, которые забывают в смете и которые съедают маржу: подвес, электроподключение и щит, пропуска и парковка, уборка и вывоз, страховка, демонтаж и утилизация, хранение, ночные работы, подъёмник, перепечатка графики; строка «площадка и организация» 8–12%.","rdef":"Забытые статьи сметы: подвес, электрика, пропуска, уборка, подъёмник, перепечатка — 8–12%.","when":"Ревью сметы перед тендером.","ex":"В смете на 3 млн не было подвеса (80 тыс.), подъёмника (40), пропусков и ночных (60), перепечатки (50) — 230 тыс. из маржи; теперь строка «площадка и организация» 10%.","near":[{"t":"Статьи, которые клиент оплачивает организатору напрямую и которые застройщика не касаются: аренда площади, каталог, бейджи.","why":"Это счёт организатора; скрытые затраты — в смете застройщика."},{"t":"Маржа агентства, спрятанная внутри статей сметы, чтобы клиент не видел наценку.","why":"Маржа — отдельная статья, не скрытые затраты."}],"nb":[{"t":"Смета стенда","d":"Структура стоимости: конструктив ~40%, графика, свет, AV, мебель, монтаж, проект, площадка, маржа.","why":"Скрытые — раздел сметы."},{"t":"Подвес","d":"Крепление элементов к перекрытию по заявке за 2–3 недели с расчётом; монтаж риггерами площадки.","why":"Подвес — типичная забытая статья."}],"apps":{"ok":"Перед тендером арт-директор проверяет строку «площадка и организация»: подвес, электрика, пропуска, подъёмник, перепечатка.","okWhy":"Отдельной строкой 8–12%, иначе из маржи.","bad":[{"t":"Подвес и электричество «включены в аренду площади»: клиент уже заплатил организатору, а мы не будем брать дважды","why":"Не включены; счёт площадки."},{"t":"Перепечатку графики не закладывают: «утвердим с первого раза», ведь макеты клиент подписал ещё на презентации","why":"Правки клиента — 10–15% графики."},{"t":"Подъёмник «возьмём у соседей на монтаже»: на площадке их всегда несколько штук, а своя аренда на день — 40 тысяч, выброшенных впустую","why":"Аренда и доставка — в смете."}]},"simple":"Мелочи, которые всегда появляются и всегда стоят денег.","remember":"Площадка и организация — 8–12%."},{"name":"Тендер","level":"L4","def":"Конкурс 2–3 застройщиков с 1–3 концепциями у каждого; клиент оценивает эффект, цену, реализуемость и соответствие бренду за неделю; побеждает объяснённое решение с цифрами, а не рендер.","rdef":"Конкурс 2–3 застройщиков; критерии: эффект, цена, реализуемость, бренд; побеждает объяснённое решение.","when":"Каждый крупный проект; тестовое задание.","ex":"Тендер на 100 м²: три застройщика; наша презентация — план пальцем, ракурс с 1,6 м, шесть критериев с цифрами, вариант Б на −18%; выбрали нас при не самой низкой цене.","near":[{"t":"Конкурс 2–3 застройщиков, где клиент выбирает по самому эффектному рендеру и самой низкой цене за м²; аргументы не нужны.","why":"Критерии шире: реализуемость и бренд; побеждает объяснение, не рендер."},{"t":"Закупочная процедура организатора выставки на выбор генерального застройщика стандартных стендов для всех экспонентов павильона.","why":"Это закупка организатора; тендер экспонента — на эксклюзив."}],"nb":[{"t":"Презентация концепции","d":"Семь шагов за 15–20 минут: задача → идея → план → ракурс → шесть критериев с цифрами → вариант Б → сроки.","why":"Презентация — способ выиграть тендер."},{"t":"Техническое задание","d":"Подписанный документ: площадь, зоны, экспонаты, сообщение, бюджет, сроки, регламент, варианты × правки.","why":"ТЗ — вход тендера."}],"apps":{"ok":"На тендере агентство показывает одну рекомендованную концепцию с аргументами и вариант Б по цене — а не три равных рендера.","okWhy":"Эффект · цена · реализуемость · бренд; аргументы с цифрами.","bad":[{"t":"Три равные концепции без рекомендации: «пусть выбирают», ведь навязывать клиенту своё мнение на тендере — проигрышная стратегия","why":"Отсутствие позиции."},{"t":"Рендер в пустом белом зале без соседей: так стенд выглядит чище, а соседей на момент тендера ещё не знают","why":"Клиент увидит стенд в толпе."},{"t":"Цену не называют до победы: «потом посчитаем», иначе конкуренты узнают нашу ставку, а клиент выберет самую дешёвую","why":"Цена — критерий тендера."}]},"simple":"Соревнование, где побеждает не красота, а объяснённая и посчитанная идея.","remember":"2–3 застройщика · 4 критерия · цифры."},{"name":"Презентация концепции","level":"L4","def":"Семь шагов за 15–20 минут: задача и цифры брифа → идея фразой и образом → план пальцем (траектория, зоны) → объём и ракурс с высоты глаз → почему сработает по шести критериям с цифрами → варианты Б/В с ценой → сроки и следующий шаг.","rdef":"Семь шагов: задача → идея → план → ракурс → шесть критериев с цифрами → вариант Б → сроки.","when":"Тендер, утверждение, тестовое задание.","ex":"15 минут: бриф (150 контактов, полуостров), идея «портал-витрина», план пальцем, ракурс с 20 м, заметность 45 м / читаемость 9 см / бренд 25% / кадр / столярка 4 недели / 44 тыс. за м², вариант Б −18%, сроки.","near":[{"t":"Семь шагов за 15–20 минут: история агентства, портфолио, команда, рендеры со всех ракурсов, смета, сроки, договор.","why":"Презентация — про задачу клиента и решение, не про агентство."},{"t":"Показ рендеров концепции клиенту с комментариями визуализатора о свете и материалах сцены.","why":"Рендер — один шаг из семи; главное — план и аргументы."}],"nb":[{"t":"Тендер","d":"Конкурс 2–3 застройщиков; критерии: эффект, цена, реализуемость, бренд.","why":"Презентация — инструмент тендера."},{"t":"Аргумент","d":"Критерий + цифра вместо прилагательного: «5 м, лого 40 см — читается с 45 м».","why":"Аргументы — содержание шага «почему сработает»."}],"apps":{"ok":"Арт-директор ведёт презентацию по семи шагам и сам называет цифры: высоту, дистанции, ₽/м².","okWhy":"Задача → идея → план → ракурс → 6 критериев → вариант Б → сроки.","bad":[{"t":"Презентация начинается с истории агентства и портфолио на 10 минут: клиент должен сначала поверить в команду","why":"Клиент ждёт решение своей задачи."},{"t":"Показывают пять рендеров без плана: план — скучный чертёж, а решение принимают по картинке","why":"Рендер без плана — обещание."},{"t":"Цифры называет клиент, а не арт-директор: пусть сам спросит про высоту и цену, если ему это важно","why":"Цифры — наш аргумент."}]},"simple":"Рассказ «вот ваша задача — вот решение — вот почему сработает — вот цена».","remember":"Семь шагов, цифры наши."},{"name":"Аргумент","level":"L4","def":"Критерий плюс цифра вместо прилагательного: не «эффектная доминанта», а «доминанта 5 м с логотипом 40 см — читается от входа с 45 м»; шесть критериев: заметность, понятность, бренд, фото, реализуемость, бюджет.","rdef":"Критерий + цифра вместо прилагательного; шесть критериев: заметность, понятность, бренд, фото, реализуемость, бюджет.","when":"Слайд «почему сработает», защита правок, собеседование.","ex":"«Сообщение 7 слов на 3,2 м буквами 9 см — читается с 18 м» вместо «удобная читаемая графика»; «вариант Б дешевле на 18% за счёт ткани, высота и свет те же».","near":[{"t":"Критерий плюс цифра: «современный дизайн в инновационной стилистике с эффектной подсветкой на 30% ярче соседей и премиальными материалами».","why":"Прилагательные с одной случайной цифрой — не аргумент; нужна дистанция, размер, цена."},{"t":"Ссылка на авторитет: «так делают лидеры рынка и победители конкурсов стендов, а значит, клиенту это тоже подойдёт».","why":"Апелляция к авторитету — не аргумент о задаче клиента."}],"nb":[{"t":"Презентация концепции","d":"Семь шагов: задача → идея → план → ракурс → шесть критериев с цифрами → вариант Б → сроки.","why":"Аргументы — наполнение пятого шага."},{"t":"Читаемость","d":"Высота буквы ≈ дистанция × 0,5 см на ходу; высокий контраст; текст на фото — плашка.","why":"Читаемость даёт цифры для аргументов."}],"apps":{"ok":"На возражение «слишком смело» показывают сравнительный рендер с 20 м без доминанты: стенд исчезает.","okWhy":"Критерий + цифра; шесть критериев.","bad":[{"t":"«Очень эффектно и современно» — на слайде «почему сработает»: клиент сам видит рендер, цифры его только утомят","why":"Прилагательные без цифр."},{"t":"«Мы лидеры рынка» как ответ на «почему это сработает»: двадцать лет опыта — лучшее доказательство","why":"Про нас, а не про задачу."},{"t":"«Рендер в 4K — вы видите стенд в точности» — качество визуализации гарантирует, что и стенд будет таким же","why":"Качество картинки — не аргумент эффекта."}]},"simple":"Факт с числом вместо красивого слова.","remember":"«45 м» вместо «эффектно»."},{"name":"Ревью концепции","level":"L5","def":"Проверка концепции по чек-листу из девяти пунктов (бриф, план, объём, сообщение, свет, материалы и реализуемость, бюджет, кадр, аргументы) на плане и разрезе до рендера; дизайнер проходит чек-лист сам до встречи.","rdef":"Проверка по чек-листу из девяти пунктов на плане и разрезе до рендера.","when":"Каждая концепция агентства; тендеры.","ex":"Ревью на день 2: план и объём двух вариантов → один в работу, второй — вариант цены; рендер — после. Замечание: лого на 2 м → в верхнюю треть.","near":[{"t":"Проверка концепции по чек-листу из девяти пунктов на финальных рендерах, когда стенд виден целиком.","why":"До рендера, на плане и разрезе — иначе переделка дни."},{"t":"Обсуждение концепции с клиентом на презентации: его реакция — лучший критерий качества.","why":"Клиент не должен видеть незрелое; ревью — внутри."}],"nb":[{"t":"Чек-лист","d":"Девять вопросов ревью: бриф, план, объём, сообщение, свет, материалы, бюджет, кадр, аргументы.","why":"Чек-лист — инструмент ревью."},{"t":"Обратная связь","d":"Формула «что не так → почему (критерий) → как исправить (пример)»; хвалить решения, не красоту.","why":"Обратная связь — результат ревью."}],"apps":{"ok":"Дизайнер приносит план и разрез, ответив на девять вопросов сам; арт-директор одобряет объём — и только потом рендер.","okWhy":"На плане, до рендера, по чек-листу.","bad":[{"t":"Ревью «на вкус» без чек-листа: «мне не нравится» — у арт-директора насмотренность, и она важнее формальных пунктов","why":"Вкус не учит."},{"t":"Ревью на готовых рендерах за день до сдачи: только на рендере видно, работает ли концепция целиком, план ничего не скажет","why":"Поздно менять."},{"t":"Ревью только тендерных проектов: остальным доверяем, у опытных дизайнеров и так получается, а время арт-директора дорого","why":"Качество всех — ответственность арт-директора."}]},"simple":"Проверка чертежа до того, как построили.","remember":"9 пунктов · план и разрез · до рендера."},{"name":"Обратная связь","level":"L5","def":"Формула замечания дизайнеру: что не так → почему (критерий чек-листа) → как исправить (с примером); хвалить за решения, не за красоту; повтор ошибки — признак пропущенного «почему».","rdef":"Что не так → почему (критерий) → как исправить (пример); хвалить решения.","when":"Руководство дизайнерами, рост команды.","ex":"«Лого на 2 м закрыт толпой — с 20 м не виден (критерий читаемости); подними в верхнюю треть, как на стенде Y» — вместо «снова не то, переделай».","near":[{"t":"Формула замечания: что не так → кто виноват → срок исправления; фиксируется в протоколе для оценки дизайнера.","why":"Виноватые и протоколы не учат; нужен критерий и пример."},{"t":"Переделка работы дизайнера арт-директором лично с показом результата как образца.","why":"Арт-директор становится узким горлом; дизайнер не учится."}],"nb":[{"t":"Ревью концепции","d":"Проверка по чек-листу из девяти пунктов на плане и разрезе до рендера.","why":"Ревью — где рождается обратная связь."},{"t":"Стиль компании","d":"Дисциплина решений в гайде «так/не так»: одна доминанта, свет как форма, сообщение продаёт, честные материалы, кадр.","why":"Гайд — источник примеров для обратной связи."}],"apps":{"ok":"Второй раз подряд лого на 2 м: арт-директор называет критерий, объясняет «почему» и показывает пример из гайда.","okWhy":"Что → почему → как; с примером.","bad":[{"t":"«Снова не то, переделай» — он же знает чек-лист, а разжёвывать взрослому дизайнеру каждый пункт — неуважение к его опыту","why":"Без «почему» будет третий раз."},{"t":"Переделать самому — быстрее: за час арт-директор поправит, а дизайнер посмотрит на результат и поймёт","why":"Узкое горло."},{"t":"Перевести на графику после двух ошибок: композиция не его сильная сторона, зачем мучить и его, и проект","why":"Два случая — не диагноз."}]},"simple":"Замечание, из которого понятно, что, почему и как.","remember":"Критерий + пример."},{"name":"Стиль компании","level":"L5","def":"Узнаваемая дисциплина решений агентства, зафиксированная в портфолио-гайде с примерами «так/не так»: одна доминанта, свет как форма, сообщение продаёт, честные материалы, спроектированный кадр; не повтор одной формы.","rdef":"Дисциплина решений в гайде «так/не так»: доминанта, свет, сообщение, материалы, кадр; не повтор формы.","when":"Развитие дизайн-направления; обучение новых дизайнеров.","ex":"Гайд: 10 кейсов «так» с объяснением и 5 «не так»; обновление раз в год с трендами через принцип (ткань — для больших плоскостей).","near":[{"t":"Узнаваемая форма доминанты и фирменная палитра агентства, повторяемые на стендах всех клиентов для узнаваемости.","why":"Повтор формы — узнаваемость агентства за счёт брендов клиентов."},{"t":"Единый шаблон презентации, пресеты рендера и нейминг файлов, обязательные для всех проектов.","why":"Это стандарты, не стиль."}],"nb":[{"t":"Ревью концепции","d":"Проверка по чек-листу из девяти пунктов на плане и разрезе до рендера.","why":"Ревью проверяет соответствие стилю."},{"t":"Тренд","d":"Приём, решающий задачу дешевле или сильнее; входит в проект через задачу и бренд, в стиль — через принцип.","why":"Тренды обновляют стиль через принцип."}],"apps":{"ok":"Новому дизайнеру дают гайд: 10 стендов «так» с объяснением принципов и 5 «не так» — вместо «делай как мы».","okWhy":"Принципы в гайде; обновлять раз в год.","bad":[{"t":"На всех стендах агентства одна и та же башня в фирменном цвете агентства: клиенты узнают почерк и приходят именно за ним","why":"Клиентов не узнают, узнают агентство."},{"t":"Стиль — «как получится у ведущего дизайнера»: он на ревью сам поправит, а описывать живой стиль на бумаге — убивать его","why":"Неописанный стиль не воспроизводится."},{"t":"Гайд не обновляют: «стиль вечен», а тренды — для тех, у кого нет своего лица","why":"Тренды входят через принцип раз в год."}]},"simple":"Почерк агентства: не одинаковые буквы, а одинаковые правила.","remember":"Дисциплина, не форма; гайд «так/не так»."},{"name":"Паспорт концепции","level":"L5","def":"Документ передачи утверждённой концепции в рабочую документацию: план, разрезы с высотами, ключевой ракурс, материалы и цвета (RAL, декоры, ткани), свет (слои, К, прожекторы), список «не менять без арт-директора», приоритеты при сокращении.","rdef":"Документ передачи концепции в РД: план, разрезы, ракурс, RAL, свет, «не менять», приоритеты сокращения.","when":"После утверждения концепции клиентом.","ex":"Паспорт на 120 м²: доминанта RAL 5002, высота 5,0 — не менять; при сокращении первым убрать экран, потом мебель, последним — свет на экспонат.","near":[{"t":"Документ передачи концепции в РД: финальные рендеры в высоком разрешении с комментариями, по которым конструктор снимает размеры.","why":"Размеры торый арт-директор осуществляет на монтаже, командуя бригадой и меняя решения по месту.","why":"Через шефа монтажа и по паспорту; не по месту."},{"t":"Присутствие арт-директора на презентации клиенту и на выставке в день открытия для фотосъёмки.","why":"Две из пяти точек пропущены — РД, образцы, сборка."}],"nb":[{"t":"Паспорт концепции","d":"Документ передачи концепции в РД: план, разрезы, ракурс, RAL, свет, «не менять», приоритеты.","why":"Паспорт — критерий надзора."},{"t":"Контрольная сборка","d":"Сборка ключевых узлов в цеху перед отгрузкой с приёмкой арт-директора по чек-листу.","why":"Сборка — третья точка надзора."}],"apps":{"ok":"Арт-директор ставит в график PM пять дат: ревью РД, образцы, сборка, монтаж день 1, приёмка — и приходит на каждую.","okWhy":"Пять точек в графике; замены через арт-директора.","bad":[{"t":"«Не ездить в цех — конструктор проверил», а полдня арт-директора стоят дороже, чем возможные правки на монтаже","why":"Стыки и цвет вскроются на монтаже."},{"t":"Командовать бригадой на монтаже напрямую: так быстрее, чем объяснять шефу монтажа, а монтажники слушают того, кто рядом","why":"Через шефа монтажа; безопасность и субординация."},{"t":"Надзор «по звонку»: приезжать, когда позовут, — проектный менеджер знает, где нужен арт-директор, а где справится сам","why":"Не позовут; точки — в графике заранее."}]},"simple":"Пять свиданий с идеей по дороге от чертежа до фотографии.","remember":"РД · образцы · сборка · монтаж · приёмка."},{"name":"Тренд","level":"L6","def":"Приём, который решает задачу дешевле или сильнее, чем прежде (ткань и лайтбоксы, экраны с контентом, минимум текста, зелень, иммерсивные демо, re-use, точки для фото); входит в проект через задачу и бренд, в стиль компании — через принцип; «модно» — не аргумент.","rdef":"Приём, решающий задачу дешевле или сильнее; входит через задачу и бренд; «модно» — не аргумент.","when":"Выбор решений, ответ на «почему нет экрана», обновление стиля.","ex":"Косметика 60 м²: ткань-лайтбокс, зелень на стойке, фото-точка — да; LED 12 м² и VR — нет: удваивают смету без удвоения эффекта.","near":[{"t":"Приём, который используют лидеры рынка в этом сезоне; применяется на стенде, чтобы не отстать от конкурентов.","why":"«Не отстать» — не задача клиента; тренд — через задачу и цену."},{"t":"Новый материал или технология, которые агентство закупило со скидкой у поставщика и предлагает всем клиентам.","why":"Экономика поставщика — не тренд."}],"nb":[{"t":"Стиль компании","d":"Дисциплина решений в гайде «так/не так»; не повтор формы.","why":"Тренд входит в стиль через принцип."},{"t":"Отстройка","d":"Выделение среди соседей контрастом (свет, тишина, пустота, форма), а не громкостью.","why":"Отстройка — задача, тренд — возможный инструмент."}],"apps":{"ok":"На вопрос «почему нет большого экрана» арт-директор отвечает задачей: тестирование продукта — деньги в зону касания.","okWhy":"Тренд = задача × бренд × (эффект / цена).","bad":[{"t":"Экран, потому что у всех есть: стенд без экрана в 2026 году выглядит отстающим от рынка, что бы ни говорил бриф клиента","why":"«Как у всех» — не аргумент."},{"t":"Неон и глянец промышленному клиенту: «в тренде», а заодно омолодим консервативный бренд, за это нас и наняли","why":"Спорит с тоном бренда."},{"t":"Все тренды сразу на одном стенде: зелень, экран, иммерсив, фото-точка — максимум эффекта за один бюджет","why":"Удвоение сметы без удвоения эффекта."}]},"simple":"Не «что модно», а «что сейчас решает задачу лучше».","remember":"Через задачу и бренд, с ценой."},{"name":"Отстройка","level":"L6","def":"Выделение стенда среди соседей по ряду контрастом — светлое среди тёмного, тихое среди кричащего, пустота среди заполненного, широкое среди высокого — а не громкостью (выше, ярче, больше экранов); анализ соседей по плану павильона до концепции.","rdef":"Выделение среди соседей контрастом (свет, тишина, пустота, форма), а не громкостью.","when":"Анализ площадки, тендерная аргументация.","ex":"Ряд тёмных стендов с LED 5 м: наш — светлый объём с лайтбоксом и воздухом, 4,5 м; контраст бесплатен, гонка высот стоит денег и регламента.","near":[{"t":"Выделение среди соседей громкостью: выше лимита по согласованию, ярче экран, больше звука и света, чем у ряда.","why":"Громкость проигрывает бюджету и регламенту."},{"t":"Повторение удачного решения соседа или конкурента в своём фирменном цвете для цельности ряда.","why":"Повтор сливает с рядом и работает на конкурента."}],"nb":[{"t":"Тренд","d":"Приём, решающий задачу дешевле или сильнее; входит через задачу и бренд.","why":"Тренд может быть инструментом отстройки, но не обязателен."},{"t":"План павильона","d":"Схема зала с проходами, входами, соседями, колоннами; читается до эскиза.","why":"Отстройка начинается с чтения соседей по плану."}],"apps":{"ok":"Узнав по плану, что соседи тёмные с экранами, арт-директор делает светлый тихий стенд с лайтбоксом.","okWhy":"Контраст, не громкость; соседи — по плану до концепции.","bad":[{"t":"Экран больше соседских и 2000 нит: кто ярче, того и видят, а регламент яркости на площадке мягкий","why":"Гонка громкости."},{"t":"«Сделайте как у конкурента, только лучше» — выполняем буквально: клиент сам назвал эталон, спорить незачем","why":"Копия рядом с оригиналом работает на него."},{"t":"Соседей не смотрят: «наш стенд всё равно ярче», а план павильона всё равно меняется до открытия","why":"Контекст решает заметность."}]},"simple":"Быть другим, а не громче.","remember":"Светлое среди тёмного, тихое среди кричащего."},{"name":"Портфолио-кейс","level":"L6","def":"История реализованного проекта по структуре: задача и цифры брифа → идея фразой и план → ключевой ракурс (рендер и фото рядом) → фото с людьми при полном свете → результат (контакты, отзыв, повтор, награда) → что сделал бы иначе; реализованное вперёд, рендеры отдельно.","rdef":"История реализованного проекта: задача → идея и план → ракурс → фото с людьми → результат → иначе.","when":"Портфолио, заявка на конкурс, собеседование.","ex":"Кейс 120 м²: цель 200 контактов, идея «портал-витрина», план, рендер и фото рядом, 240 контактов и повторный заказ, вывод — открытая переговорная шумная.","near":[{"t":"История реализованного проекта в виде набора рендеров с разных ракурсов и описания использованных материалов и технологий.","why":"Без задачи, фото и результата — демонстрация рендера."},{"t":"Карточка проекта с названием клиента, площадью и годом, где по клику открывается галерея из 20 изображений.","why":"Галерея — не кейс; нужна структура и результат."}],"nb":[{"t":"Фотогеничность","d":"Спроектированный ракурс для фото: доминанта, логотип, люди, чистый фон, свет на лицах.","why":"Фото для кейса рождается из спроектированного кадра."},{"t":"Тендер","d":"Конкурс 2–3 застройщиков; критерии: эффект, цена, реализуемость, бренд.","why":"Кейс — аргумент на тендере."}],"apps":{"ok":"В портфолио 8 кейсов с фото реализации вперёд; 20 рендеров нереализованных — отдельным разделом «концепции».","okWhy":"Задача → план → фото с людьми → результат → иначе.","bad":[{"t":"25 рендеров и три фото: «рендеры красивее», а на фото стенд всегда хуже из-за людей и света павильона","why":"Нанимают по реализованному."},{"t":"Фото стенда при демонтаже, без людей и света: зато видна архитектура целиком, никто не загораживает","why":"Не кейс."},{"t":"Результат не указывают: «клиент не делится цифрами», а отзыв и повторный заказ — не метрики, их в кейс не ставят","why":"Отзыв, повтор, награда — тоже результат."}]},"simple":"Доказательство, что идея доехала до стенда и сработала.","remember":"Фото с людьми + результат."}],"BOSSES":[{"id":"b1","level":"L1","icon":"🏝️","title":"Островной стенд 200 м²","sub":"Проектирование: от плана павильона до объёма","meters":{"t":"Доверие клиента","v":"Сила идеи","s":"Реализуемость и бюджет"},"intro":"Производитель промышленного оборудования берёт островной стенд 200 м² в центре павильона. Бюджет 9 млн, цель — 300 контактов и 20 переговоров за три дня, экспонат — станок 2,8 т. Высота зала 5 м, подвес по заявке. У вас неделя на концепцию. Каждый шаг влияет на доверие клиента, силу идеи и реализуемость.","steps":[{"q":"Клиент прислал бриф на абзац и логотип. С чего начать неделю?","opts":[{"text":"Запросить план павильона с соседями и регламент зала; провести бриф по семи вопросам и зафиксировать ТЗ","d":{"t":1,"v":1,"s":1},"fb":"План и регламент — рамки идеи; ТЗ защитит от правок."},{"text":"Начать с трёх эскизов доминанты по логотипу и брифу-абзацу, чтобы на первой встрече клиент выбрал направление, а план и регламент запросить уже под выбранный эскиз","d":{"t":0,"v":-1,"s":-1},"fb":"Доминанта без плана павильона — наугад: неизвестен ракурс и соседи."},{"text":"Собрать 30 референсов станкостроительных стендов с Hannover Messe и показать клиенту, какой уровень возможен за 9 млн, — так он сам сформулирует, чего хочет, без длинного брифа","d":{"t":0,"v":0,"s":0},"fb":"Референсы приятны, но не заменяют план и бриф; неделя короткая."},{"text":"Передать запрос конструктору: пусть сначала посчитает нагрузку от 2,8 т на пол павильона и плиту — без этого любая планировка станка пустая работа; бриф проведём после расчёта","d":{"t":-1,"v":0,"s":1},"fb":"Нагрузка важна, но это один вопрос из семи; клиент ждёт разговор о целях."}]},{"q":"План получен: стенд в центре, главный поток идёт от входа с юго-запада, через проход слева сосед заявил башню 5 м с LED-стеной. Как расположить ядро?","opts":[{"text":"Подсобку и закрытые переговорные — в ядро стенда, ресепшн — к юго-западному потоку, станок — чтобы обходился с трёх сторон","d":{"t":1,"v":1,"s":1},"fb":"У островного нет спины: служебное — в центр, витрины — везде, экспонат — магнит."},{"text":"Подсобку и склад — на сторону, обращённую к соседскому экрану: там всё равно будет шумно и пестро, зато освободим остальные три стороны под витрины и переговорные со стеклом","d":{"t":0,"v":0,"s":0},"fb":"Подсобка на открытой стороне островного — глухая плоскость на проход: согласование и потеря ракурса; у островного служебное — в ядре."},{"text":"Станок — вплотную к ресепшн у юго-западного потока: посетитель увидит экспонат первым и сразу попадёт к менеджеру, а переговорные и подсобку уводим в дальний угол","d":{"t":0,"v":-1,"s":0},"fb":"Стойка и станок у входа создают пробку; магнит должен втягивать вглубь."},{"text":"Стеклянные переговорные — на главный юго-западный поток, чтобы с прохода было видно, что переговоры идут, а станок и подсобку — в тыльную часть, где он никому не мешает","d":{"t":0,"v":-1,"s":0},"fb":"В стеклянные переговорные заглядывают; закрытые — в глубине."}]},{"q":"Доминанта. Дизайнер предлагает три башни по 4,5 м по углам «для баланса». Ваше решение?","opts":[{"text":"Одна доминанта 5 м с логотипом в верхней трети, развёрнутая на юго-западный поток; второй акцент вдвое ниже и другой формы","d":{"t":0,"v":2,"s":0},"fb":"Одна держит силуэт; три равных — забор, ни одна не главная."},{"text":"Оставить три башни, но сделать их разной высоты 4,5 / 4 / 3,5 м и повесить логотип на каждую: с любого из четырёх проходов посетитель увидит хотя бы одну, а лесенка даст динамику","d":{"t":0,"v":-1,"s":-1},"fb":"Три логотипа — три спора; лесенка не создаёт главного."},{"text":"Убрать башни и поднять все стены по периметру до 5 м с крупной графикой: стенд станет самым массивным объёмом в зале, и никакой сосед его не перебьёт","d":{"t":-1,"v":-1,"s":-1},"fb":"Глухие стены по периметру островного — нарушение регламента и потеря открытости."},{"text":"Вместо башен — подвесной световой короб 8×8 м над центром стенда: его видно из любой точки павильона, а площадь внизу остаётся свободной под станок и переговоры","d":{"t":0,"v":1,"s":-1},"fb":"Сильный ход, но подвес 64 м² — заявка, расчёт и план Б; без них рискованно."}]},{"q":"Через проход слева — башня соседа 5 м с LED-стеной: конкурирующая высота и конкурирующий центральный объект в одном поле зрения с нашей доминантой. Как сделать, чтобы его образ не перебивал наш?","opts":[{"text":"Контрастом: светлая спокойная доминанта и лайтбокс против тёмного динамичного экрана, воздух вместо плотности; высота 5 м по регламенту, не выше","d":{"t":1,"v":1,"s":1},"fb":"Рядом с громким объектом выигрывает другой, а не более громкий: контраст бесплатен, гонка — нет."},{"text":"Запросить у организатора согласование на 6 м и поставить LED-стену 20 м² больше соседской: кто выше и ярче, тот и собирает поток, а доплату заложим в смету","d":{"t":0,"v":0,"s":-2},"fb":"Гонка высоты и экранов: +2 млн и риск отказа площадки."},{"text":"Повторить его приём в нашей палитре: такая же башня с экраном, но в фирменном цвете клиента — два похожих объекта через проход читаются как один большой кластер, и половина внимания достанется нам","d":{"t":0,"v":-1,"s":-1},"fb":"Похожий объект рядом с оригиналом работает на оригинал: посетитель запомнит того, кто был первым и ярче; и это второй экран в смете."},{"text":"Соседа не учитывать: наш стенд стоит в центре на пересечении проходов, и 200 м² островного заметят в любом случае; тратить идею на отстройку от одного соседа — переоценка риска","d":{"t":0,"v":-1,"s":0},"fb":"Контекст решает заметность: движущийся экран 5 м в том же поле зрения перетягивает взгляд и глушит нашу сторону."}]},{"q":"Станок 2,8 т. Как решить экспонат в планировке и конструктиве?","opts":[{"text":"Согласовать нагрузку с площадкой, поставить станок на распределяющую плиту без подиума, кабели — в подиуме вокруг него, подсветка 3:1","d":{"t":1,"v":0,"s":1},"fb":"Нагрузка — согласование и плита; подиум не распределяет вес."},{"text":"Поставить станок на общий подиум 150 мм вместе со всем стендом: подиум спрячет кабели и воздуховоды, а каркас из бруса с шагом 300 мм распределит 2,8 т по площади не хуже плиты","d":{"t":0,"v":0,"s":-1},"fb":"Подиум кабели спрячет, нагрузку — нет."},{"text":"Заменить станок масштабным макетом 1:3 и показать работу на экране 4 м²: экономим около 400 тыс. на логистике и такелаже и снимаем вопрос нагрузки на пол павильона","d":{"t":-1,"v":-1,"s":0},"fb":"Клиент везёт станок, чтобы его трогали; макет убивает цель."},{"text":"Поднять станок на второй этаж над переговорными как главный аттракцион: его увидят с любой точки павильона, а конструктор посчитает металлокаркас под нагрузку","d":{"t":-1,"v":0,"s":-2},"fb":"2,8 т на втором этаже — нереализуемо."}]},{"q":"Презентация через два дня. Что показываете клиенту?","opts":[{"text":"План с траекторией пальцем, разрез с высотами, ракурс с 1,6 м от входа с соседями, шесть критериев с цифрами и цену за м²","d":{"t":2,"v":0,"s":1},"fb":"Клиент покупает объяснённое решение, не картинку."},{"text":"Пять рендеров с разных ракурсов в пустом зале и видеооблёт на 40 секунд: эмоция решает, а чертежи и соседей покажем на втором этапе, когда концепция уже понравилась","d":{"t":0,"v":0,"s":0},"fb":"Без плана и соседей клиент не увидит, как стенд будет работать."},{"text":"Только план, разрезы и спецификацию: рендер сделаем после утверждения планировки, чтобы не тратить три дня визуализатора на вариант, который могут изменить","d":{"t":-1,"v":0,"s":0},"fb":"Клиент не читает чертежи без образа; один ракурс обязателен."},{"text":"Три равноценные концепции без рекомендации — консервативную, среднюю и смелую: клиент выберет сам, и это будет его решение, а не навязанное агентством","d":{"t":-1,"v":-1,"s":0},"fb":"Отсутствие позиции — слабость арт-директора."}]}],"debrief":"Островной стенд решается в порядке: план павильона и регламент → ядро и траектория → одна доминанта на поток → отстройка контрастом → экспонат как магнит с решённой нагрузкой → презентация с планом, ракурсом и цифрами. Каждый пропуск стоит либо идеи, либо денег.","anchor":{"g":"plan","p":{"w":16,"d":12.5,"open":["f","l","r","b"],"zones":[["store",0.4,0.38,0.2,0.24],["meet",0.62,0.3,0.2,0.4],["rec",0.06,0.7,0.2,0.16],["demo",0.1,0.15,0.3,0.45]],"dom":[0.12,0.78],"flow":"sw","note":"островной 200 м²: ядро служебное, витрины везде"},"cap":"ядро — в центр, доминанта — на поток"}},{"id":"b2","level":"L4","icon":"🏆","title":"Тендер: 100 м² за 3 млн","sub":"Коммерция: бюджет, аргументы, вариант Б","meters":{"t":"Доверие клиента","v":"Сила идеи","s":"Реализуемость и бюджет"},"intro":"Фармкомпания объявила тендер на полуостров 100 м², бюджет «около 3 млн», три застройщика, неделя. Критерии: эффект, цена, реализуемость, соответствие бренду. Ваша задача — выиграть, не разорив агентство.","steps":[{"q":"3 млн на 100 м² — 30 тыс./м². Какую категорию и идею закладываете?","opts":[{"text":"Простой-средний эксклюзив: столярка до 4 м, лайтбоксы из ткани, один акцент из МДФ, без подвеса и LED-стен","d":{"t":1,"v":0,"s":2},"fb":"30 тыс./м² — простая категория; подвес и металл не влезут."},{"text":"Средний-сложный эксклюзив с металлической доминантой 5 м и LED-стеной 8 м²: выигрываем эффектом, а разницу в цене дотянем на переговорах, когда клиент уже влюбился в концепцию","d":{"t":0,"v":1,"s":-2},"fb":"60 тыс./м² в бюджете 30 — концепцию порежут или агентство уйдёт в минус."},{"text":"Улучшенный стандарт: конструктор, широкоформатная печать и свой свет за 12 тыс./м², итог 1,2 млн — цена станет главным аргументом, а разницу клиент оставит на маркетинг","d":{"t":0,"v":-2,"s":1},"fb":"Фарма на ключевой выставке за стандартом не придёт; низкая цена без эффекта проигрывает."},{"text":"Не привязываться к цифре: придумать самую сильную идею, посчитать её честно и предложить клиенту увеличить бюджет — «около 3 млн» означает, что цифра не финальная","d":{"t":-1,"v":0,"s":-1},"fb":"Концепция вне вилки — потеря тендера."}]},{"q":"Клиент прислал бренд-гайд: белый, бирюза, «забота и чистота». Дизайнер предлагает чёрный глянец и неон «для контраста с соседями».","opts":[{"text":"Отклонить: отстраиваться светом и воздухом в палитре бренда; тон «чистота» — светлый объём и мягкий свет 4000 К","d":{"t":1,"v":1,"s":0},"fb":"Отстройка не должна спорить с брендом — критерий тендера."},{"text":"Принять: чёрный глянец и неон заметнее в ряду светлых фармстендов, а бирюзу дадим в акцентах и на логотипе — бренд узнают по знаку, а не по цвету фона","d":{"t":-1,"v":0,"s":0},"fb":"Клиент оценивает соответствие бренду; чёрный глянец — «не мы»."},{"text":"Сделать два полноценных варианта — один строго по гайду, второй чёрный с неоном — и показать оба на презентации: пусть клиент сам решит, насколько он готов к смелости","d":{"t":0,"v":-1,"s":-1},"fb":"Два противоположных варианта — отсутствие позиции и двойная работа."},{"text":"Написать бренд-менеджеру клиента письмо с вопросом, допустим ли отход от гайда, и до ответа не трогать палитру, чтобы не делать работу дизайнера впустую","d":{"t":0,"v":0,"s":0},"fb":"Неделя тендера; решение — компетенция арт-директора."}]},{"q":"Смета сметчика: 2,95 млн. В ней нет подвеса (его и не нужно), но нет и электроподключения, пропусков, подъёмника, перепечатки. Что делаете?","opts":[{"text":"Добавляем строку «площадка и организация» 8–12% и ищем экономию внутри: ткань вместо окраски на задниках, чтобы остаться в 3 млн","d":{"t":1,"v":0,"s":1},"fb":"Скрытые затраты — из маржи, если не заложить; экономия — в материалах плоскостей."},{"text":"Оставляем 2,95 млн как есть: электроподключение, пропуска и подъёмник — это 150–200 тыс., оплатим из маржи, главное — попасть в цифру клиента и выиграть тендер","d":{"t":0,"v":0,"s":-1},"fb":"230–300 тыс. из маржи — треть прибыли проекта."},{"text":"Поднимаем смету до 3,3 млн с отдельной строкой на площадку и объясняем клиенту, что «около 3» — это вилка, а честная цена без скрытых затрат выгоднее ему самому","d":{"t":-1,"v":0,"s":0},"fb":"На тендере конкуренты покажут 3; «около» толкуется в пользу клиента."},{"text":"Убираем акцентный свет на экспонаты и мебель переговорных — это освободит 300 тыс. на подключение и пропуска, а мебель клиент возьмёт в аренду у организатора","d":{"t":0,"v":-1,"s":0},"fb":"Свет на главное — последнее, что режут."}]},{"q":"Презентация. Какой слайд решает тендер?","opts":[{"text":"«Почему сработает»: шесть критериев с цифрами — 4,5 м и лого 35 см с 40 м, сообщение 8 см с 15 м, 25% бирюзы, кадр, столярка 4 недели, 30 тыс./м²","d":{"t":2,"v":0,"s":0},"fb":"Аргумент = критерий + цифра; это и есть ответ на критерии тендера."},{"text":"Главный рендер в 4K на весь экран и облёт камеры 30 секунд с музыкой: закупки и маркетинг должны влюбиться в картинку, а цифры по высотам и срокам положим в приложение — их прочитают потом","d":{"t":0,"v":0,"s":0},"fb":"Картинку покажут все трое; побеждает объяснение."},{"text":"Портфолио агентства: 12 стендов для фармы за три года, две награды EuroShop и отзывы клиентов — доверие к команде на тендере весит больше, чем детали конкретной идеи","d":{"t":0,"v":-1,"s":0},"fb":"Про нас, а не про задачу клиента."},{"text":"Детальную смету на 60 строк с ценой каждой позиции и графиком производства по неделям: прозрачность цены и сроков убедит закупки, а решение принимают именно они","d":{"t":0,"v":0,"s":0},"fb":"Смета — приложение; закупки смотрят итог и структуру."}]},{"q":"Закупки клиента: «Конкурент дал 2,6 млн. Дадите столько же — вы победили». Ваш ход?","opts":[{"text":"Показать вариант Б на 2,6: те же высота, свет и сообщение, задники — ткань вместо окраски, без второй переговорной; объяснить, что именно меняется","d":{"t":1,"v":0,"s":1},"fb":"Снижение с объяснением сохраняет идею и маржу."},{"text":"Согласиться на 2,6 млн без изменений в проекте: фарма такого уровня важна для портфолио, а маржу наверстаем на следующем проекте с этим же клиентом, когда доверие уже будет","d":{"t":0,"v":0,"s":-2},"fb":"−13% из маржи — проект в ноль; «следующий» не наступает."},{"text":"Отказаться и объяснить закупкам, что наша цена честная и уже без запаса, а демпинг конкурента означает экономию на материалах — пусть сравнивают качество, а не цифру","d":{"t":-1,"v":0,"s":0},"fb":"Отказ без варианта — потеря тендера."},{"text":"Снизить до 2,6, убрав акцентный свет на экспонаты и лайтбокс доминанты: это ровно 400 тыс., а планировка, высота и переговорные остаются без изменений","d":{"t":0,"v":-2,"s":1},"fb":"Режется заметность — главный аргумент идеи."}]},{"q":"Победили. Клиент просит «ещё три небольшие правки» сверх двух итераций по ТЗ: другая форма стойки, третья переговорная, плюс экран.","opts":[{"text":"Сверить с ТЗ: две итерации использованы; оценить правки — стойка бесплатно как мелочь, переговорная и экран — доп. соглашение с ценой и сроком","d":{"t":1,"v":0,"s":1},"fb":"ТЗ работает, когда на него ссылаются; мелочь — жест, крупное — деньги."},{"text":"Сделать всё бесплатно: клиент только что выбрал нас среди троих, портить отношения в первую неделю нельзя, а три правки — это два дня дизайнера и 150 тыс. маржи, переживём","d":{"t":0,"v":0,"s":-1},"fb":"Три бесплатные правки станут десятью."},{"text":"Отказать во всех трёх правках со ссылкой на подписанное ТЗ: две итерации использованы, и если уступить сейчас, лимит перестанет работать на всём проекте до монтажа","d":{"t":-1,"v":0,"s":0},"fb":"Формализм без жеста разрушает доверие."},{"text":"Сделать переговорную и экран, но убрать лайтбокс доминанты и часть акцентного света, чтобы остаться в 3 млн и не поднимать разговор о доплате сразу после победы","d":{"t":0,"v":-1,"s":0},"fb":"Торговать идеей за правки нельзя."}]}],"debrief":"Тендер выигрывает категория по бюджету, идея в палитре бренда, честная смета со скрытыми затратами, слайд «почему сработает» с цифрами и вариант Б вместо скидки. Правки сверх ТЗ — доп. соглашение с одним жестом доброй воли.","anchor":{"g":"estimate","p":{"rows":[["конструктив",40],["монтаж/логистика",17],["свет",10],["графика",10],["AV",5],["мебель",6],["проект",5],["площадка/орг.",7]],"total":"3,0 млн · 30 тыс./м²"},"cap":"смета тендера"}},{"id":"b3","level":"L3","icon":"🔧","title":"Цех говорит: «так не сделать»","sub":"Технолог: рендер против производства","meters":{"t":"Доверие клиента","v":"Сила идеи","s":"Реализуемость и бюджет"},"intro":"Концепция утверждена клиентом: стена 9 м без швов в глянце, консоль 3 м с экраном, крашеный МДФ-портал 5 м и ткань на фризе. До монтажа 3 недели. Начальник цеха звонит: «Так не сделать». Ваша задача — довезти идею до стенда.","steps":[{"q":"«Стена 9 м глянец без швов — нереально». Ваш ответ?","opts":[{"text":"Разбить на четыре модуля с теневым зазором 8 мм, показать стык клиенту как приём; глянец — плёнка на ЛДСП","d":{"t":1,"v":0,"s":2},"fb":"Шов проектируют, а не скрывают; плёнка вместо лака — срок."},{"text":"Настоять на рендере: заказать у поставщика композитный лист 9 м, везти негабаритом с разрешением и заносить через монтажные ворота — клиент утвердил именно бесшовную стену","d":{"t":-1,"v":0,"s":-2},"fb":"Не влезет в фуру и ворота павильона."},{"text":"Собрать стену из модулей, а стыки зашпаклевать и покрасить глянцем прямо на монтаже в первую ночь: бригада успеет, а инспектор на окраску внимания не обращает","d":{"t":0,"v":0,"s":-2},"fb":"В павильоне не красят; сохнуть негде."},{"text":"Убрать глянцевую стену вовсе и оставить каркас с натяжной тканью и подсветкой: цех успевает гарантированно, а клиенту объясним, что ткань сейчас в тренде","d":{"t":0,"v":-1,"s":1},"fb":"Ткань решит сроки, но глянцевая стена — часть идеи."}]},{"q":"Консоль 3 м с экраном 60 кг. Конструктор: «из бруса не держит».","opts":[{"text":"Металл 60×40 с расчётом конструктора, порошковая окраска 5–7 дней — запускаем сегодня","d":{"t":0,"v":0,"s":1},"fb":"Консоль с нагрузкой — только металл и расчёт."},{"text":"Укоротить консоль до 1,5 м и оставить брус 100×100 с усилением фанерой 18 мм: при вдвое меньшем вылете момент падает вдвое, и дерево держит 60 кг с запасом","d":{"t":0,"v":-1,"s":0},"fb":"Брус на консоли с экраном всё равно риск; идея теряет размах."},{"text":"Заменить экран 60 кг на лёгкий тканевый лайтбокс весом 12 кг и оставить брус: нагрузка падает в пять раз, расчёт не нужен, а свет на консоли заметнее экрана","d":{"t":0,"v":-1,"s":0},"fb":"Экран — часть сценария демо; и консоль из бруса остаётся риском."},{"text":"Подвесить консоль к потолку павильона двумя тросами: экран уйдёт с консоли на подвес, брус останется декоративным, а заявку организатору отправим сегодня","d":{"t":0,"v":0,"s":-2},"fb":"Заявка на подвес — 2–3 недели; уже поздно."}]},{"q":"Портал 5 м крашеный МДФ. Технолог: «окраска 7–10 дней, плюс сборка — не успеем вместе с остальным».","opts":[{"text":"Запустить портал первым в очередь цеха сегодня; остальную столярку — параллельно; образец RAL утвердить завтра","d":{"t":0,"v":1,"s":1},"fb":"Критический путь — окраска; очередь цеха перестраивается."},{"text":"Заменить МДФ на ЛДСП с плёнкой того же RAL: плёнка клеится за день вместо 7–10 дней окраски, а с трёх метров разницу между плёнкой и краской никто не увидит","d":{"t":0,"v":-1,"s":1},"fb":"Портал — зона касания и фрезерованный лого; плёнка на радиусах — брак."},{"text":"Красить портал в павильоне ночью перед открытием: собрать сухим, загрунтовать в цеху, а финишный слой нанести на месте — так делали на прошлой выставке и успели","d":{"t":0,"v":0,"s":-2},"fb":"В павильоне не красят."},{"text":"Снизить портал с 5 до 4 м и убрать радиусы: объём окраски уменьшится на 20%, сборка упростится, а разницу в метр клиент не заметит без разреза перед глазами","d":{"t":0,"v":-1,"s":0},"fb":"Высота — суть доминанты; объём окраски почти не меняется."}]},{"q":"Ткань для фриза уже куплена — без сертификата горючести. До монтажа 2,5 недели.","opts":[{"text":"Заменить на сертифицированную ткань, сертификат — в папку проекта; купленную — в запас на непроверяемые задники","d":{"t":0,"v":0,"s":1},"fb":"Инспектор проверяет документы; остановка монтажа дороже рулона."},{"text":"Обработать ткань огнезащитным составом в цеху, приложить чек на состав и акт обработки: это дешевле нового рулона на 40 тыс. и формально закрывает вопрос горючести","d":{"t":0,"v":0,"s":-1},"fb":"Обработка не заменяет сертификат."},{"text":"Оставить как есть: за тканью стоит LED-подсветка, которая не греется, фриз на 3,5 м никто не трогает, а инспектор смотрит в первую очередь электрику, а не текстиль","d":{"t":0,"v":0,"s":-2},"fb":"Спросят — остановят."},{"text":"Заменить ткань на баннерную сетку с печатью: сертификат на неё у поставщика всегда есть, печать готова за два дня, а на фризе с 15 м фактура ткани всё равно не видна","d":{"t":0,"v":-1,"s":0},"fb":"Баннер на фризе — складки и дешёвый вид."}]},{"q":"Цех предлагает «упростить»: убрать теневые зазоры, лого сделать плоской печатью вместо фрезеровки, свет взять «какой есть».","opts":[{"text":"Зазоры и фрезерованный лого — «не менять» из паспорта; свет — по спецификации с 4000 К; подтвердить письмом","d":{"t":0,"v":2,"s":0},"fb":"Идея теряется на мелочах; паспорт и письмо — защита."},{"text":"Согласиться на все три упрощения: цех лучше знает, что успевает за три недели, а зазоры, объём лого и температура света — детали, которые клиент на открытии не разглядит","d":{"t":0,"v":-2,"s":1},"fb":"Три «мелочи» — и стенд не похож на рендер."},{"text":"Согласиться на печатный лого вместо фрезеровки — это экономит два дня ЧПУ, — но отстоять теневые зазоры и свет 4000 К: два из трёх пунктов идеи сохранены","d":{"t":0,"v":-1,"s":0},"fb":"Лого — лицо стенда; печать вместо объёма видна с 2 м."},{"text":"Отказать без обсуждения: «делайте как нарисовано, рендер утверждён клиентом»; обсуждать детали с цехом — значит открыть дверь для следующих упрощений","d":{"t":0,"v":1,"s":-1},"fb":"Без разговора цех сделает «как понял»."}]},{"q":"За 4 дня до отгрузки. Что делаете лично?","opts":[{"text":"Контрольная сборка в цеху: портал, консоль, стык стены, фриз и свет по чек-листу; RAL — по образцу","d":{"t":1,"v":1,"s":1},"fb":"Последняя точка дешёвых исправлений."},{"text":"Доверить приёмку в цеху конструктору с чек-листом: он знает узлы лучше, а мне важнее подготовить презентацию клиенту к открытию и согласовать сценарий демо","d":{"t":0,"v":-1,"s":0},"fb":"Стыки и цвет вскроются на монтаже."},{"text":"Приехать на монтаж первым, за сутки до бригады, и лично командовать сборкой: на площадке видно всё сразу, а в цеху стенд стоит разобранным и ничего не проверить","d":{"t":0,"v":0,"s":-1},"fb":"На монтаже исправлять поздно; командовать — через шефа монтажа."},{"text":"Запросить у цеха фото каждого узла в мессенджер и видеообзор портала при дневном свете: за 4 дня до отгрузки поездка в цех за 80 км — потеря дня, которого нет","d":{"t":0,"v":0,"s":0},"fb":"Фото не показывает стыки и цвет."}]}],"debrief":"«Так не сделать» почти всегда значит «не так»: разузловка с теневым зазором, металл под нагрузку, окраска первой в очередь, сертификаты в папке, список «не менять» и контрольная сборка. Арт-директор не инженер, но знает, где идея ломается.","anchor":{"g":"pipeline","p":{"steps":["рендер","разузловка","материалы","очередь цеха","сборка","монтаж"],"hl":[1,3,4]},"cap":"от рендера к цеху"}},{"id":"b4","level":"L5","icon":"🧭","title":"Идея потерялась по дороге","sub":"Руководство: от концепции до монтажа","meters":{"t":"Доверие клиента","v":"Сила идеи","s":"Реализуемость и бюджет"},"intro":"Вы утвердили концепцию 120 м²: доминанта 5 м RAL 5002, свет 4000 К с акцентом 3:1, сообщение на фризе 9 см, лайтбокс на левой стене. Через месяц на монтаже вы видите: доминанта 4,6 м, свет 6500 К «какой был», лайтбокс заменён печатью, фриз — 5 см. Проект ведёт PM, конструктор делал РД, дизайнер ушёл в отпуск.","steps":[{"q":"Первый вопрос себе: где потерялась идея?","opts":[{"text":"В передаче: не было паспорта концепции с планом, разрезами, RAL, светом и списком «не менять» — РД делали по рендеру","d":{"t":0,"v":1,"s":0},"fb":"Без паспорта каждый решает сам."},{"text":"В дизайнере: он автор концепции, ушёл в отпуск на две недели в разгар производства и не передал РД конструктору лично — автор обязан проследить свою идею до цеха","d":{"t":0,"v":0,"s":0},"fb":"Дизайнер не отвечает за РД и цех; система должна работать без него."},{"text":"В PM: он сэкономил на прожекторах и лайтбоксе без согласования, чтобы уложиться в смету, и не поднял вопрос наверх — это его решение и его ответственность","d":{"t":0,"v":0,"s":0},"fb":"PM режет там, где нет приоритетов сокращения."},{"text":"В цехе: получили чертежи с высотой 5 м и сделали 4,6 м, потому что так влезало в фуру, свет взяли со склада — цех снова сделал как удобнее, а не как нарисовано","d":{"t":0,"v":0,"s":0},"fb":"Цех делает по чертежам; если чертежи молчат — как удобнее."}]},{"q":"Монтаж идёт, открытие завтра. Что можно вернуть?","opts":[{"text":"Через шефа монтажа: прожекторы заменить на 4000 К со склада площадки и перенаправить, доминанту поднять надставкой до 5 м, если конструктор подтвердит; фриз и лайтбокс — принять","d":{"t":1,"v":0,"s":1},"fb":"Возвращать то, что дёшево и безопасно; остальное — в урок."},{"text":"Остановить монтаж и требовать от PM и цеха переделать всё по концепции за ночь: привезти лайтбокс, перепечатать фриз 9 см, нарастить доминанту — иначе клиент получит не то, за что платил, и агентство ответит рублём","d":{"t":-1,"v":0,"s":-2},"fb":"Открытие завтра; остановка — срыв."},{"text":"Принять всё как есть и не трогать бригаду: разница между 4,6 и 5 м с прохода не видна, 6500 К на белом стенде смотрится даже свежее, а печать вместо лайтбокса клиент без рендера перед глазами не заметит","d":{"t":0,"v":-2,"s":0},"fb":"Клиент видел рендер; 6500 К и печать вместо света — заметит."},{"text":"Самому взять стремянку и перенаправить прожекторы, пока бригада занята доминантой, а шефа монтажа не отвлекать: за два часа сделаю акцент 3:1 своими руками быстрее, чем объяснять","d":{"t":0,"v":0,"s":-1},"fb":"Через шефа монтажа; безопасность и субординация."}]},{"q":"Клиент на монтаже: «Это не то, что вы показывали». Ваш ответ?","opts":[{"text":"Признать расхождения, назвать, что вернём к утру (свет, высота), что компенсируем (лайтбокс — скидка или замена к следующей выставке), и как исключим повтор","d":{"t":2,"v":0,"s":0},"fb":"Честность и план — доверие; оправдания — потеря."},{"text":"Объяснить, что это нормальные производственные допуски: ±10% по высоте и замена светового оборудования на аналог прописаны в договоре, и на каждой выставке стенд немного отличается от рендера","d":{"t":-2,"v":0,"s":0},"fb":"Клиент видит разницу; «так всегда» — конец отношений."},{"text":"Переложить ответственность при клиенте на PM и цех, назвав конкретно, кто и где сократил: клиент должен видеть, что арт-директор ни при чём и виновные будут наказаны","d":{"t":-1,"v":0,"s":0},"fb":"Клиент покупал у агентства."},{"text":"Пообещать переделать всё к открытию — лайтбокс, фриз, высоту и свет — и ночью искать подрядчиков, которые привезут материалы: клиент успокоится, а утром разберёмся, что успели","d":{"t":-1,"v":0,"s":-1},"fb":"Невыполнимое обещание хуже честного плана."}]},{"q":"Постмортем через неделю. Что меняете в процессе?","opts":[{"text":"Паспорт концепции обязателен; пять точек надзора в графике PM: ревью РД, образцы, сборка, монтаж, приёмка; замены — через арт-директора","d":{"t":0,"v":1,"s":1},"fb":"Система вместо героизма."},{"text":"Арт-директор лично делает РД по своим концепциям в ArchiCAD: конструктор всё равно теряет замысел, а две недели чертёжной работы на проект — цена сохранённой идеи","d":{"t":0,"v":0,"s":-1},"fb":"Узкое горло; конструктор делает, арт-директор ревьюит."},{"text":"Запретить PM любые изменения в проекте без письменного согласия клиента и арт-директора: даже замена прожектора на аналог идёт через согласование по почте с двумя подписями","d":{"t":0,"v":0,"s":0},"fb":"PM должен уметь резать — по приоритетам из паспорта."},{"text":"Наказать цех штрафом 10% от стоимости производства за самодеятельность и прописать штрафы в договоре: без финансовой ответственности подрядчик будет «делать как удобнее» снова","d":{"t":0,"v":0,"s":0},"fb":"Цех делал по чертежам; штраф не лечит процесс."}]},{"q":"Следующий проект. Дизайнер приносит паспорт: рендеры, RAL, высоты — но без списка «не менять» и приоритетов сокращения.","opts":[{"text":"Дописать вместе: «не менять» — высота доминанты, свет на экспонат, сообщение; резать первым — экран, потом мебель, последним свет","d":{"t":0,"v":1,"s":1},"fb":"Приоритеты — инструкция для PM на случай сокращения."},{"text":"Принять паспорт: RAL, высоты и рендеры есть, а что нельзя менять и что резать первым, понятно любому PM с опытом — не стоит плодить бюрократию после одного инцидента","d":{"t":0,"v":-1,"s":0},"fb":"Очевидное — разное у всех."},{"text":"Вернуть дизайнеру без объяснений с пометкой «неполный, см. шаблон»: он должен сам найти, чего не хватает, иначе в следующий раз снова принесёт половину","d":{"t":0,"v":0,"s":0},"fb":"Без «почему» — повтор ошибки."},{"text":"Дописать список «не менять» и приоритеты самому за вечер и приложить к паспорту, не отвлекая дизайнера: это компетенция арт-директора, а он пусть занимается формой","d":{"t":0,"v":0,"s":0},"fb":"Дизайнер не учится."}]},{"q":"Точка «сборка» в графике. PM: «Цех в 80 км, у вас презентация, конструктор съездит».","opts":[{"text":"Съездить сам на два часа: доминанта, стыки, RAL, свет — решения о заменах принимает арт-директор","d":{"t":0,"v":1,"s":1},"fb":"Сборка — последняя дешёвая точка; конструктор не решает за идею."},{"text":"Отправить конструктора с чек-листом из паспорта и попросить 40 фото каждого узла и образца RAL при дневном свете: он знает узлы лучше меня, а презентацию двигать нельзя","d":{"t":0,"v":0,"s":0},"fb":"Фото не показывает цвет и стыки; замены — не его решение."},{"text":"Пропустить сборку: РД прошло ревью, образцы RAL утверждены, цех проверенный — после двух точек надзора третья ничего нового не покажет, а 160 км в день презентации — потеря дня","d":{"t":0,"v":-1,"s":-1},"fb":"Повтор истории."},{"text":"Перенести презентацию клиента на следующую неделю и провести в цеху весь день с бригадой: после прошлого провала сборку нельзя доверять никому, пусть клиент подождёт","d":{"t":-1,"v":0,"s":0},"fb":"Два часа достаточно; клиента не двигают."}]}],"debrief":"Идея теряется там, где нет паспорта концепции и точек надзора. Руководитель направления строит систему: паспорт с «не менять» и приоритетами, пять точек в графике, честный разговор с клиентом и постмортем без поиска виноватых.","anchor":{"g":"timeline","p":{"items":["концепция","паспорт","ревью РД","образцы","сборка","монтаж","приёмка"],"hl":1},"cap":"пять точек надзора"}},{"id":"b5","level":"L6","icon":"🪞","title":"«Сделайте как у конкурента»","sub":"Арт-директор: тренды, отстройка, позиция","meters":{"t":"Доверие клиента","v":"Сила идеи","s":"Реализуемость и бюджет"},"intro":"Клиент — производитель бытовой техники, 80 м² полуостров. Директор маркетинга показывает фото конкурента с прошлой выставки: чёрный стенд, LED-стена 15 м², неон. «Сделайте так же, только лучше и дешевле». Бюджет 3,2 млн.","steps":[{"q":"Как реагируете на «как у конкурента»?","opts":[{"text":"Разобрать, что именно понравилось (масштаб, динамика, статус), и перевести в задачу: что стенд должен сделать с аудиторией за 3 секунды и за 10 минут","d":{"t":1,"v":1,"s":0},"fb":"«Как у X» переводится в задачу клиента, а не копируется."},{"text":"Согласиться: клиент знает рынок и своих покупателей; сделать чёрный объём с LED, но дешевле — экран 9 м² вместо 15 и неон только на фасаде — так уложимся в 3,2 млн и дадим «так же, только дешевле»","d":{"t":0,"v":-2,"s":0},"fb":"Копия рядом с оригиналом работает на оригинал."},{"text":"Отказать прямо: копировать стенд конкурента — непрофессионально и репутационно опасно для обоих, и предложить начать с чистого листа, пока клиент не передумал работать с нами","d":{"t":-2,"v":0,"s":0},"fb":"Клиент пришёл с задачей, а не за моралью."},{"text":"Показать 20 референсов стендов бытовой техники с IFA и Eurocucina в другой стилистике, чтобы сбить фиксацию на конкуренте и расширить картину возможного до следующей встречи","d":{"t":0,"v":0,"s":0},"fb":"Референсы без разбора задачи — ещё один «как у»."}]},{"q":"Выяснилось: конкурент стоит в том же ряду, через два стенда. Что это меняет?","opts":[{"text":"Всё: отстраиваемся контрастом — светлый, тёплый объём, продукт в руках, воздух; конкурент сам создаёт нам фон","d":{"t":0,"v":2,"s":1},"fb":"Светлое среди тёмного заметнее, чем второе тёмное."},{"text":"Ничего принципиально: делаем ярче и выше него — LED на фасаде 18 м², доминанта 5 м против его 4,5, неон плотнее; в одном ряду побеждает тот, кто громче","d":{"t":0,"v":-1,"s":-1},"fb":"Гонка громкости с бюджетом 40 тыс./м² проиграна."},{"text":"Пишем организатору с просьбой перенести стенд в другой ряд или павильон: два тёмных стенда с LED через два места друг от друга будут глушить друг друга, и это проблема площадки","d":{"t":0,"v":0,"s":0},"fb":"Площадь выкуплена; перенос нереален."},{"text":"Берём его палитру — чёрный и неон, — чтобы ряд выглядел цельно и дорого: посетитель воспринимает ряд как премиальную зону и заходит на оба стенда","d":{"t":0,"v":-2,"s":0},"fb":"Цельность ряда — не цель клиента."}]},{"q":"Директор маркетинга: «А где большой экран? У всех есть».","opts":[{"text":"Ответить задачей: техника продаётся в руках — деньги в зону касания с продуктом и свет на него; экран P2.5 на 2 м² в демо-зоне с 20-секундным роликом","d":{"t":1,"v":1,"s":1},"fb":"Тренд входит через задачу; «у всех» — не аргумент."},{"text":"Поставить LED-стену 12 м² P3.9 на фасад за счёт мебели и второй переговорной: 1,3 млн из 3,2, но зато фасад будет виден с 30 м, и директор получит то, за чем пришёл","d":{"t":0,"v":-1,"s":-1},"fb":"Экран съест 40% бюджета и закроет фасад."},{"text":"Отказать и объяснить, что большие экраны — тренд пятилетней давности, на последней IFA их стало меньше, а наш стенд строится на тактильности, которую экран только разрушает","d":{"t":-1,"v":0,"s":0},"fb":"Высокомерие; экран уместен в сценарии."},{"text":"Предложить вместо экрана зону VR-очков на четыре места с виртуальной кухней: это новее экрана, собирает очередь и даёт контент для соцсетей, а стоит сопоставимо с LED 6 м²","d":{"t":0,"v":-1,"s":-1},"fb":"Другой тренд ради тренда."}]},{"q":"Тренд-отчёт: ткань и лайтбоксы, зелень, иммерсив, re-use, точки для фото. Что берёте для бытовой техники на 80 м²?","opts":[{"text":"Лайтбокс-задник и фото-точку «кухня с продуктом»; зелень дозированно; re-use каркаса на следующие две выставки; иммерсив — нет","d":{"t":0,"v":1,"s":1},"fb":"Через задачу и цену: эффект на рубль."},{"text":"Берём все пять: лайтбоксы, живую зелень на 15 м², иммерсивную проекцию, re-use и фото-точку — клиент должен увидеть, что мы в тренде, а 80 м² хватит, если уплотнить планировку","d":{"t":0,"v":-1,"s":-2},"fb":"Удвоение сметы без удвоения эффекта."},{"text":"Ничего из отчёта: классическая столярка с печатью и прожекторами надёжнее, тренды меняются каждый сезон, а бытовая техника — консервативный рынок, где ценят солидность","d":{"t":0,"v":-1,"s":0},"fb":"Отказ от дешёвых сильных приёмов."},{"text":"Только иммерсивную зону с проекцией на три стены 20 м²: это самый свежий тренд в отчёте, он соберёт очередь и прессу, а остальные приёмы — вчерашний день, который делают все","d":{"t":0,"v":0,"s":-2},"fb":"Дорого и не про продукт в руках."}]},{"q":"Дизайнер принёс концепцию: светлый объём, но доминанта — та же форма, что на трёх прошлых стендах агентства.","opts":[{"text":"Вернуть с «почему»: стиль агентства — дисциплина решений, не повтор формы; доминанту — из бренда клиента (например, силуэт продукта)","d":{"t":0,"v":1,"s":0},"fb":"Повтор формы — узнаваемость агентства за счёт клиента."},{"text":"Принять: эта форма — наш фирменный приём, его узнают на выставках, и клиенты приходят к нам именно за ним; отказываться от узнаваемого почерка ради одного проекта — глупо","d":{"t":0,"v":-1,"s":0},"fb":"Клиент платит за свой бренд."},{"text":"Переделать доминанту самому за вечер: у дизайнера две недели до презентации ушли на планировку, объяснять дольше, чем сделать, а форма из бренда клиента у меня уже в голове","d":{"t":0,"v":0,"s":0},"fb":"Дизайнер не учится; узкое горло."},{"text":"Оставить форму, но перекрасить в цвета клиента и нанести его логотип: с другой палитрой и знаком никто из посетителей не свяжет её с тремя прошлыми стендами агентства","d":{"t":0,"v":-1,"s":0},"fb":"Форма та же — узнаваемость та же."}]},{"q":"Презентация. Директор: «Это совсем не как у конкурента». Ваш ответ?","opts":[{"text":"«Верно — и поэтому вас заметят: вот рендер ряда с 20 м — ваш светлый стенд между двумя тёмными; вот зона, где продукт берут в руки, вот кадр для соцсетей»","d":{"t":2,"v":0,"s":0},"fb":"Сравнительный рендер в контексте — сильнейший аргумент."},{"text":"«Мы делаем выставки двенадцать лет, у нас три награды и сорок стендов для техники — доверьтесь профессионалам, мы знаем, как работает поток, лучше, чем видно на фото конкурента»","d":{"t":-1,"v":0,"s":0},"fb":"Без аргумента — просьба о вере."},{"text":"Предложить параллельно за неделю подготовить второй вариант «как у конкурента» — чёрный с LED — и показать оба на следующей встрече, чтобы директор сравнил и выбрал без давления","d":{"t":-1,"v":-1,"s":0},"fb":"Отказ от позиции."},{"text":"Согласиться добавить чёрный глянец на ресепшн и неоновую линию по фризу в акцентах: клиент получит знакомый код конкурента, а светлый объём и продукт в руках останутся","d":{"t":0,"v":-1,"s":0},"fb":"Компромисс размывает идею."}]}],"debrief":"«Как у конкурента» — запрос на эффект, не на копию. Арт-директор переводит его в задачу, читает соседей по плану, отстраивается контрастом, пропускает тренды через задачу и цену и защищает позицию сравнительным рендером в контексте ряда.","anchor":{"g":"compare","p":{"a":["копия","чёрный + LED, рядом с оригиналом"],"b":["отстройка","светлый объём, продукт в руках"],"verdict":"контраст, не громкость"},"cap":"копия против отстройки"}},{"id":"b6","level":"L2","icon":"👀","title":"Стенд не заметили","sub":"Визуальный дизайн: заметность, сообщение, свет","meters":{"t":"Доверие клиента","v":"Сила идеи","s":"Реализуемость и бюджет"},"intro":"Первый день выставки. Клиент (B2B-софт, 60 м² угловой) звонит: «Мимо идут, никто не заходит, у соседей толпа». Вы приезжаете. Стенд выглядит как на рендере.","steps":[{"q":"Первое, что проверяете, встав на главный проход в 20 м?","opts":[{"text":"Читается ли с этой точки логотип и одна фраза; видна ли доминанта над головами; где глаз останавливается","d":{"t":0,"v":1,"s":0},"fb":"Заметность проверяется с дистанции посетителя."},{"text":"Исправен ли свет и все ли экраны включены и показывают контент: в первый день на площадке часто отключают фазу или зависает плеер, и стенд стоит тёмным","d":{"t":0,"v":0,"s":0},"fb":"Нужно, но вторично: включённый экран с мелким текстом не спасёт."},{"text":"Сколько менеджеров стоит у стойки и чем они заняты: если четверо сидят в телефонах, а не встречают поток, никакой дизайн не поможет — это проблема клиента, не стенда","d":{"t":0,"v":0,"s":0},"fb":"Менеджеры не притягивают прохожих с 20 м."},{"text":"Что раздают и показывают соседи с толпой: кофе, розыгрыш, шоу — если у них активность, причина не в нашем стенде, и клиенту надо объяснить это сразу","d":{"t":0,"v":0,"s":0},"fb":"Соседи — контекст, не причина."}]},{"q":"С 20 м видно: фриз на 3 м с миссией компании в 14 слов кеглем 4 см, логотип 12 см. Что делаете к утру?","opts":[{"text":"Срочная печать: одна фраза-выгода до 6 слов буквами 9 см и логотип 30 см на фриз; остальной текст — на стойку","d":{"t":1,"v":2,"s":0},"fb":"Иерархия и читаемость: D × 0,5 см; одна мысль на плоскость."},{"text":"Включить на экране фасада бегущую строку с миссией компании кеглем 15 см и логотипом: движение привлекает взгляд с 20 м лучше статики, а перепечатка фриза за ночь нереальна","d":{"t":0,"v":-1,"s":0},"fb":"Движущийся мелкий текст не читается лучше."},{"text":"Поставить двух промоутеров в проход с планшетами и флаерами: с 20 м текст всё равно не прочитают, а живой человек остановит и приведёт на стенд быстрее любой типографики","d":{"t":0,"v":0,"s":0},"fb":"Люди — не дизайн; и регламент ограничивает активность в проходах."},{"text":"Ничего не менять: клиент утвердил текст миссии и кегль на макете, это его решение и ответственность, а перепечатка за наш счёт создаст прецедент на все будущие проекты","d":{"t":-2,"v":0,"s":0},"fb":"Арт-директор отвечает за результат."}]},{"q":"Свет: 24 прожектора равномерно на стены, 6500 К, стойка и продукт в тени. Что перенастраиваете ночью?","opts":[{"text":"Половину прожекторов — на демо-стойки, экспонат и ресепшн с контрастом 3:1; заменить на 4000 К, что есть у площадки; контровой на доминанту","d":{"t":0,"v":1,"s":1},"fb":"Акцент говорит «смотри сюда»; равномерно — ничего главного."},{"text":"Добавить ещё 12 прожекторов в аренду у площадки, чтобы стенд был заметно ярче соседей: при 36 прожекторах на 60 м² мы перебьём любой соседский свет, а мощности 10 кВт хватит","d":{"t":0,"v":0,"s":-1},"fb":"Яркость без акцента — тот же пересвет; плюс мощность и аренда."},{"text":"Включить RGB-подсветку стен и стойки в фирменный синий бренда: цветной стенд в ряду белых заметен с 30 м, а 6500 К оставить — холодный свет сочетается с синим","d":{"t":0,"v":-1,"s":0},"fb":"Цветной свет искажает лица и продукт."},{"text":"Оставить как есть: на утверждённом рендере свет был ровно таким же — равномерным и холодным, клиент его принял, а ночная перенастройка 24 прожекторов — лишний риск перед вторым днём","d":{"t":0,"v":-1,"s":0},"fb":"Рендер не учитывал павильон."}]},{"q":"Угловой стенд: вход сделан по диагонали на угол, стойка 3 м — поперёк входа. Люди останавливаются у стойки и уходят.","opts":[{"text":"Развернуть стойку вдоль стены вправо от входа ночью (она модульная), открыть траекторию к демо-зоне","d":{"t":1,"v":1,"s":1},"fb":"Стойка поперёк входа — барьер; вход должен втягивать."},{"text":"Убрать стойку совсем и поставить менеджеров с планшетами: ресепшн на 60 м² — пережиток, посетитель должен сразу попадать к продукту, а регистрацию сделаем через QR на фризе","d":{"t":0,"v":0,"s":0},"fb":"Ресепшн нужен — сбоку."},{"text":"Поставить двух менеджеров перед стойкой, чтобы встречали и провожали в демо-зону: стойка останется барьером, но живые люди превратят её в точку контакта, а не преграду","d":{"t":0,"v":-1,"s":0},"fb":"Барьер остаётся; «зазывание» отталкивает B2B."},{"text":"Ничего не трогать: диагональный вход и стойка поперёк — часть утверждённого дизайна, клиент принял планировку, а переставлять модули ночью без конструктора — риск сломать","d":{"t":-1,"v":0,"s":0},"fb":"Дизайн, который не работает, меняют."}]},{"q":"Экран 6 м² на фасаде показывает презентацию с 40 слайдами мелким текстом.","opts":[{"text":"Заменить контент на 20-секундный цикл: три крупных кадра продукта и одна фраза; текст — в демо-зону на планшеты","d":{"t":0,"v":1,"s":0},"fb":"Экран — для крупного и короткого."},{"text":"Выключить экран и погасить его подсветку: 40 слайдов с мелким текстом отвлекают от стойки и логотипа, а тёмный фасад хотя бы не спорит с остальной графикой","d":{"t":0,"v":-1,"s":0},"fb":"Экран оплачен и может работать на заметность."},{"text":"Увеличить кегль в презентации до 60 pt и оставить все 40 слайдов: контент согласован с продуктовой командой клиента, менять его без них нельзя, а крупнее — уже читается","d":{"t":0,"v":0,"s":0},"fb":"40 слайдов не читаются с прохода при любом кегле."},{"text":"Поставить корпоративное видео с YouTube на 6 минут о компании и команде: оно смонтировано профессионально, с музыкой и дроном, и выглядит дороже любой презентации","d":{"t":0,"v":0,"s":0},"fb":"Длинное видео — тот же шум."}]},{"q":"Утро второго дня. Клиент: «Почему не сказали вчера, что так будет?» Ваш ответ?","opts":[{"text":"Признать: мы согласовали текст и свет без проверки с 20 м; показать, что изменили за ночь, и предложить замер — число заходов до и после","d":{"t":2,"v":0,"s":0},"fb":"Честность плюс измеримый результат восстанавливают доверие."},{"text":"«Вы утвердили рендер, текст миссии и кегль на макете три недели назад, мы сделали ровно то, что подписано; то, что мы поправили за ночь, — уже наша добрая воля»","d":{"t":-2,"v":0,"s":0},"fb":"Формально верно, разрушительно."},{"text":"«Так бывает в первый день на любой выставке: поток ещё не распределился, посетители обходят зал по периметру, ко второму дню разойдутся и зайдут к вам»","d":{"t":-1,"v":0,"s":0},"fb":"Отрицание проблемы."},{"text":"Предложить скидку 10% на следующий проект и закрыть тему без разбора причин: клиент на эмоциях, разбор ошибок сейчас только разгонит конфликт, а деньги его успокоят","d":{"t":0,"v":0,"s":-1},"fb":"Деньги без урока — повтор."}]}],"debrief":"Стенд не замечают из-за трёх ошибок: нет одной читаемой фразы и крупного логотипа, свет равномерный без акцента, стойка перекрывает вход. Проверка — встать на проход в 20 м до утверждения, а не после открытия.","anchor":{"g":"elev","p":{"h":3.5,"maxH":5,"items":[["лого 30 см",3.2],["фраза 9 см",2.6],["стойка",1.1]],"dist":20,"letter":9},"cap":"что видно с 20 м"}}],"ETUDES":[{"id":"e1","level":"L0","title":"«Сделайте нам вау»","situation":"Директор по маркетингу производителя упаковки: «Хотим стенд, чтобы все ахнули. Бюджет найдём. Выставка через 9 недель, 72 м², полуостров». Экспонаты — три линии упаковки на столах, цель не названа, бренд-гайд «где-то есть», план павильона не смотрели.","lens":{"q":"Что арт-директор видит первым?","options":[{"t":"«Вау» — не задача: нужны цель, аудитория и вилка бюджета, иначе концепция будет про нас, а не про клиента","ok":true,"why":"Бриф до эскиза."},{"t":"Главное — найти образ: сильная метафора упаковки сама соберёт стенд, а цель, план и бюджет подстроятся под неё по ходу","ok":false,"why":"Образ без задачи — наугад."},{"t":"9 недель мало для «вау» — предложить стандартный стенд с хорошей графикой, не рисковать и не обещать эксклюзив","ok":false,"why":"9 недель — нормальный срок эксклюзива."},{"t":"Сначала посчитать максимальную смету на 72 м² и показать клиенту, что возможно за эти деньги по трём категориям","ok":false,"why":"Смета без задачи — прайс, не концепция."}]},"moves":[{"t":"Провести бриф по семи вопросам; «вау» перевести в цифры: «150 закупщиков подошли, 20 сели за стол»","why":"Из эмоции — в задачу."},{"t":"Запросить план павильона и регламент: соседи, поток, высота — отсюда ракурс и доминанта","why":"Рамки идеи — до идеи."},{"t":"Назвать вилку: простой/средний/сложный эксклюзив — 2 / 3,2 / 5 млн — и спросить, в какой категории работаем","why":"Бюджет определяет тип застройки."},{"t":"Зафикс
