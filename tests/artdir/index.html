ировать ТЗ: две концепции и две итерации правок","why":"Защита от бесконечных «а давайте ещё»"}],"traps":[{"t":"Нарисовать три эффектных эскиза за два дня и «зажечь» клиента образом, пока он горит идеей и готов платить","ok":false,"why":"Без плана и бюджета — переделка."},{"t":"Предложить сразу самое дорогое — подвес, LED, второй этаж: раз сказано «бюджет найдём», потолка у сметы нет","ok":false,"why":"«Найдём» — не цифра; смету порежут."},{"t":"Начать с бренд-гайда и палитры: фирменные цвета и шрифт — это и есть основа будущей концепции стенда","ok":false,"why":"Палитра — не концепция."}],"subtlety":{"q":"Тонкость: что клиент на самом деле имеет в виду под «вау»?","options":[{"t":"Чтобы стенд заметили и о нём говорили — заметность и фотогеничность, которые измеряются дистанцией и кадром","ok":true,"why":"«Вау» = заметность + фото."},{"t":"Чтобы стенд был самым высоким и ярким в павильоне: без явного превосходства над соседями по высоте «вау» не случится","ok":false,"why":"Громкость — не единственный путь."},{"t":"Чтобы на стенде были новейшие технологии — голограммы, кинетика, интерактив: иначе закупщиков упаковки не удивить","ok":false,"why":"Технология без задачи — трата."}]},"verdict":"Вердикт: провести бриф, перевести «вау» в цель с цифрами, запросить план и регламент, назвать категорию бюджета и подписать ТЗ — и только потом эскиз.","principle":"Принцип: концепция начинается с задачи, плана и бюджета, а не с образа; «вау» — это заметность и кадр, которые можно спроектировать.","transfer":"Перенос: любой эмоциональный запрос («современно», «дорого», «как у Apple») переводится в критерии с цифрами тем же брифом.","anchor":{"g":"funnel3","p":{"steps":[["«вау»",false],["бриф 7 вопросов",true],["цель + план + бюджет",true],["ТЗ",true]],"note":"от эмоции к заданию"},"cap":"от «вау» к ТЗ"}},{"id":"e2","level":"L1","title":"Угловой стенд 36 м²","situation":"Производитель сантехники: угловой стенд 6×6 м на пересечении проходов, бюджет 1,4 млн (39 тыс./м²). Нужно: показать 12 смесителей с водой, два менеджера, одна переговорная «обязательно закрытая», подсобка под насос и бак. Клиент просит «побольше воздуха и чтобы было видно с обеих сторон».","lens":{"q":"Что арт-директор видит первым?","options":[{"t":"Конфликт площади: закрытая переговорная 9 м², подсобка 4, демо с водой и воздух 30% на 36 м² — что-то станет меньше","ok":true,"why":"Нормы зон против площади."},{"t":"Главное — вода: это зрелище, вокруг него и строим, а переговорную, подсобку и стойку впишем в оставшиеся углы стенда","ok":false,"why":"Впишем — за счёт воздуха и траектории."},{"t":"Угловой — значит две витрины: нужны две доминанты, по одной на каждый проход, чтобы не упустить ни один из потоков","ok":false,"why":"Одна доминанта на угол работает на оба прохода."},{"t":"39 тыс./м² — можно позволить второй этаж: переговорную наверх, и внизу освобождается весь воздух под демо с водой","ok":false,"why":"Этаж на 36 м² съест стенд лестницей."}]},"moves":[{"t":"Переговорную — полузакрытую 6 м² у спины: стены 2,2 м без потолка, стекло внутрь; закрытой пожертвовать ради воздуха","why":"Нормы: закрытая от 9 м², открытая 6–8."},{"t":"Подсобку 2×1,5 с насосом — в глухой угол, дверь внутрь стенда; гидроизоляцию и слив согласовать с площадкой","why":"Вода на стенде — согласование и поддон."},{"t":"Одна доминанта на угол: портал 4,5 м с логотипом читается с обоих проходов; демо-стена с 12 смесителями — по диагонали","why":"Угол — ракурс на два прохода."},{"t":"Пройти траекторию пальцем: вход с угла → демо-стена → стойка у спины → переговорная","why":"Проверка до рендера."}],"traps":[{"t":"Закрытую переговорную 9 м² поставить у открытой стороны со стеклом в проход — пусть видят, что идут переговоры","ok":false,"why":"Съедает витрину; в стекло заглядывают."},{"t":"Подсобку убрать совсем: насос и бак спрятать под стойку ресепшн, а освободившиеся 4 м² отдать под воздух, как просит клиент","ok":false,"why":"Шум, доступ, протечка — нужна подсобка."},{"t":"Поднять стены 2,5 м по двум глухим сторонам, остальное оставить открытым без доминанты — «воздух» и обзор обеспечены","ok":false,"why":"Без доминанты стенд не виден с 20 м."}],"subtlety":{"q":"Тонкость: клиент настаивает на закрытой переговорной. Как решить без потери воздуха?","options":[{"t":"Два варианта на плане: закрытая 9 м² (воздух 20%) и полузакрытая 6 м² (воздух 33%) — выбор клиента с цифрами","ok":true,"why":"Решение клиента, цифры наши."},{"t":"Сделать закрытую, но меньше нормы — 5 м²: стол, два стула и дверь втиснуть можно, а клиент получит именно то, что просил","ok":false,"why":"Два стула и дверь не влезут."},{"t":"Отказать: на 36 м² закрытых переговорных не бывает, и объяснить, что любой профессионал предложит открытую зону","ok":false,"why":"Бывают — за счёт остального; это выбор клиента."}]},"verdict":"Вердикт: одна доминанта на угол, демо-стена по диагонали, подсобка в глухом углу с согласованием воды, переговорная полузакрытая 6 м² — или закрытая 9 с честными цифрами о воздухе.","principle":"Принцип: на малой площади зонирование — выбор, а не упаковка; каждая зона по норме, воздух ≥ 30%, иначе убирать зону.","transfer":"Перенос: тот же конфликт на 20 м² с «хотим бар, переговорную и склад» решается тем же списком норм и планом с двумя вариантами.","anchor":{"g":"plan","p":{"w":6,"d":6,"open":["f","r"],"zones":[["store",0.02,0.02,0.3,0.25],["meet",0.02,0.3,0.35,0.4],["rec",0.05,0.75,0.3,0.2],["demo",0.45,0.1,0.5,0.6]],"dom":[0.88,0.88],"flow":"se","note":"угловой 36 м²"},"cap":"угол: доминанта на два прохода"}},{"id":"e3","level":"L3","title":"Рендер с консолью 6 м","situation":"Дизайнер показывает концепцию для тендера: над ресепшн парит консоль 6 м с логотипом и экраном, опора — одна колонна 400×400. Стена за ней — зеркальный композит 8 м без стыков. До тендера 3 дня, до выставки 6 недель. Конструктор ещё не смотрел.","lens":{"q":"Что арт-директор видит первым?","options":[{"t":"Консоль 6 м на одной опоре — металл с расчётом, вероятно контргруз или вторая опора; надо знать до тендера, что обещаем","ok":true,"why":"Реализуемость — критерий тендера."},{"t":"Рендер эффектный, тендер через 3 дня — показываем как есть, реализуемость решим после победы вместе с конструктором и цехом","ok":false,"why":"После победы останется либо честность, либо убытки."},{"t":"Консоль надо убрать сразу: такое на выставках никто не строит, а конструктор за 3 дня всё равно не успеет ничего посчитать","ok":false,"why":"Строят — на металле с расчётом; вопрос цены."},{"t":"Главная проблема — зеркальный композит 8 м без стыков: такого листа не существует, и это первым заметит любое жюри тендера","ok":false,"why":"Стыки решаются разузловкой; консоль важнее."}]},"moves":[{"t":"Сегодня — 30 минут с конструктором: консоль 6 м на одной колонне — реально ли, какая опора, вес, цена; подвес тросами — план Б","why":"Знать до обещания."},{"t":"Зеркальную стену 8 м разбить на модули 2 м с теневым зазором; показать стык на рендере","why":"Проектировать шов, не скрывать."},{"t":"В презентации назвать: металл, расчёт, цех 4 недели, окраска — и категорию «сложный», 55–65 тыс./м²","why":"Честная категория."},{"t":"Вариант Б: консоль 3,5 м на двух опорах — та же идея, минус 20% к конструктиву","why":"Вариант цены сохраняет идею."}],"traps":[{"t":"Показать рендер как есть, а после победы «договориться» с клиентом об изменениях — в тендере побеждает картинка","ok":false,"why":"Доверие ломается на первом совещании."},{"t":"Пересчитать консоль самому по справочнику сечений и таблице нагрузок — за вечер справлюсь, конструктора отвлекать не надо","ok":false,"why":"Арт-директор не конструктор; расчёт — специалисту."},{"t":"Заменить консоль подвесом к потолку павильона без проверки регламента: тросы всегда дешевле колонны и контргруза","ok":false,"why":"Подвес — заявка и расчёт; за 6 недель ещё возможно, но не без проверки."}],"subtlety":{"q":"Тонкость: конструктор сказал «можно, но колонна станет 800×800 и нужен контргруз 1,5 т». Что делаете?","options":[{"t":"Перерисовать опору честно — 800×800 как часть образа, например монолит с подсветкой, — и показать клиенту уже это","ok":true,"why":"Ограничение становится приёмом."},{"t":"Оставить на рендере 400×400: клиент разницы не заметит, а на монтаже колонну всё равно закроют графикой и светом","ok":false,"why":"Заметит на монтаже."},{"t":"Отказаться от консоли полностью и вернуться к плоскому фасаду: контргруз 1,5 т — это уже не дизайн, а машиностроение","ok":false,"why":"Решение есть; отказ — потеря идеи."}]},"verdict":"Вердикт: до тендера — конструктор на 30 минут, честная опора на рендере, разузловка зеркальной стены, категория «сложный» и вариант Б с короткой консолью.","principle":"Принцип: обещать клиенту можно только то, что проверено с цехом; ограничение производства — не враг идеи, а её форма.","transfer":"Перенос: любой «парящий» элемент на рендере — вопрос «на чём держится, сколько весит, кто считал» до презентации.","anchor":{"g":"elev","p":{"h":5,"maxH":5,"items":[["консоль 6 м",4.2],["экран",3.6],["опора 800",2.0]],"dist":15,"letter":12},"cap":"консоль: на чём держится"}},{"id":"e4","level":"L4","title":"Бюджет минус 40%","situation":"Концепция 90 м² утверждена: 4,2 млн, доминанта 5 м МДФ, лайтбоксы, свет 3:1, две переговорные, LED 4 м², мебель премиум. За 5 недель до выставки клиент: «Бюджет урезали до 2,5 млн. Что можно сохранить?»","lens":{"q":"Что арт-директор видит первым?","options":[{"t":"2,5 млн на 90 м² — 28 тыс./м²: другая категория; идею сохраним, если резать по приоритетам, а не пропорционально","ok":true,"why":"Категория сменилась; идея — нет."},{"t":"−40% — это уже другой проект: предложить начать концепцию заново под новую смету, пока есть пять недель на новый образ","ok":false,"why":"5 недель; идея утверждена — её сохраняем."},{"t":"Убрать всё красивое и оставить стандарт с графикой: при 28 тыс./м² ни доминанту, ни свет 3:1 всё равно не удержать","ok":false,"why":"Клиент терял бы идею; 28 тыс./м² — простой эксклюзив."},{"t":"Срезать 40% с каждой статьи сметы равномерно — так никто не обидится, а пропорции концепции останутся прежними","ok":false,"why":"Пропорционально — убивает свет и доминанту вместе с мебелью."}]},"moves":[{"t":"Приоритеты из паспорта: первым — LED (−350), мебель премиум → стандарт (−250), вторая переговорная → открытая (−200)","why":"Режется периферия."},{"t":"Плоскости: окраска МДФ → ткань и плёнка на задниках (−500); доминанта остаётся МДФ, но 4,5 м вместо 5 (−150)","why":"Плоскости — ткань; касание — МДФ."},{"t":"Свет: прожекторы те же, акцент 3:1 сохранить; убрать контурную подсветку (−100)","why":"Свет на главное — последнее."},{"t":"Два плана клиенту: 2,5 млн и 2,8 (с LED) — с рендером с 20 м, что стенд всё ещё заметен","why":"Решение клиента, цифры наши."}],"traps":[{"t":"Убрать доминанту 5 м целиком — самая дорогая позиция сметы, минус 600 сразу, и остальное можно почти не трогать","ok":false,"why":"Доминанта — заметность; без неё стенд исчез."},{"t":"Оставить всё как утверждено, но сменить цех на тот, что дешевле на 30%, — без образцов и проверки, времени на это нет","ok":false,"why":"Риск брака и срыва за 5 недель."},{"t":"Согласиться на 2,5 млн без изменений в проекте ради отношений: клиент крупный, разницу отыграем на следующем заказе","ok":false,"why":"−1,7 млн из маржи — убыток."}],"subtlety":{"q":"Тонкость: клиент просит убрать свет на экспонаты вместо LED — «экран нам важен для презентаций».","options":[{"t":"Оба: LED меньше (2 м², P2.5) в демо-зоне и акцентный свет оставить; разницу найти в мебели","ok":true,"why":"Свет на продукт — не торгуется; экран — в сценарий."},{"t":"Согласиться: клиент знает, что ему важно, а экспонаты и так видно при общем свете павильона в 300 лк","ok":false,"why":"Без света экран светит в тёмный стенд."},{"t":"Отказать: экран — лишний тренд, жюри тендера всегда ценит свет на продукте выше любого контента на экране","ok":false,"why":"Экран в сценарии презентаций уместен."}]},"verdict":"Вердикт: резать по приоритетам паспорта — LED, мебель, вторая переговорная, окраска плоскостей → ткань; сохранить доминанту, свет 3:1 и сообщение; два плана клиенту с рендером с 20 м.","principle":"Принцип: бюджет режут по приоритетам, а не пропорционально; идея живёт в доминанте, свете и сообщении — остальное заменяемо.","transfer":"Перенос: любое «урежьте» — сначала список «не менять», потом порядок сокращения, потом цифры по пунктам.","anchor":{"g":"estimate","p":{"rows":[["LED 4 → 2 м²",-8],["мебель премиум → стандарт",-6],["окраска → ткань",-12],["2-я переговорная → открытая",-5],["контурный свет",-2],["доминанта 5 → 4,5",-4]],"total":"4,2 → 2,6 млн"},"cap":"что режем первым"}},{"id":"e5","level":"L5","title":"Три концепции без плана","situation":"Дизайнер за два дня до ревью приносит три рендера: три разных образа для стенда 110 м², все эффектные. Плана и разреза нет: «План подстроим под то, что выберете». Тендер через 5 дней.","lens":{"q":"Что арт-директор видит первым?","options":[{"t":"Порядок нарушен: образ без плана — обещание; выбирать по плану и объёму, рендер — после","ok":true,"why":"Объём → ревью → рендер."},{"t":"Три варианта — хорошо, клиент любит выбор; берём самый эффектный, а план дизайнер подстроит за день","ok":false,"why":"План может не сойтись с образом."},{"t":"Два дня потеряны — отчитать дизайнера при команде и сделать план самому за ночь, иначе тендер сорвём","ok":false,"why":"Узкое горло и без «почему»."},{"t":"Главное — успеть к тендеру: показать все три рендера, план и разрез докрутим после победы","ok":false,"why":"Тендер требует план и реализуемость."}]},"moves":[{"t":"Разобрать с дизайнером чек-лист: бриф, план павильона, траектория, объём — какой из образов выдерживает план","why":"Ревью на плане."},{"t":"Один образ под план — в работу, второй — вариант цены; третий отпустить","why":"Одна рекомендованная + вариант Б."},{"t":"Обратная связь: что не так (нет плана) → почему (рендер без траектории — обещание) → как (план и разрез до рендера)","why":"Чтобы не повторилось."},{"t":"Перепланировать 5 дней: план и разрез, ревью, рендер и аргументы, репетиция","why":"Срок держится порядком."}],"traps":[{"t":"Показать клиенту все три рендера и предложить выбрать самому: больше вариантов — выше шанс попасть во вкус","ok":false,"why":"Отсутствие позиции; план не сойдётся."},{"t":"Нарисовать план самому за ночь под лучший рендер — быстрее, чем объяснять, а дизайнер увидит, как надо","ok":false,"why":"Дизайнер не учится; арт-директор — не исполнитель."},{"t":"Отменить участие в тендере: без плана за 5 дней не успеть, лучше честно отказаться, чем позориться на защите","ok":false,"why":"Успеваем при правильном порядке."}],"subtlety":{"q":"Тонкость: дизайнер обижен — «вы же просили креатив». Что отвечаете?","options":[{"t":"Креатив — в том, как образ работает на плане и в бюджете; показать на его рендере, где траектория упирается в стойку","ok":true,"why":"Критерий вместо вкуса."},{"t":"«Креатив — это хорошо, но сейчас не время»: сначала сдаём тендер по правилам, а творчество обсудим на следующем проекте","ok":false,"why":"Обесценивает и не объясняет."},{"t":"Согласиться, что переборщили с процессом, и взять рендер как есть: мотивация дизайнера сейчас важнее порядка шагов","ok":false,"why":"Повтор ошибки на следующем проекте."}]},"verdict":"Вердикт: вернуть к порядку — план и разрез, ревью по чек-листу, один образ в работу и один как вариант цены; обратная связь с «почему» и примером.","principle":"Принцип: руководитель направления управляет порядком работы, а не переделывает за дизайнера; рендер — последний шаг, а не первый.","transfer":"Перенос: тот же разговор — с визуализатором, который начинает со света, и с конструктором, который начинает с узлов до утверждения объёма.","anchor":{"g":"pipeline","p":{"steps":["бриф","план","объём","ревью","рендер","аргументы"],"hl":[1,3]},"cap":"порядок защищает срок"}}],"NUM":[{"id":"n1","level":"L0","title":"Цена стенда за минуту","sit":"Клиент по телефону: «У нас 80 м², полуостров, хотим эксклюзив с доминантой и лайтбоксами, без подвеса и экранов. Сколько примерно?» Вы знаете категории: простой 25–35, средний 35–55, сложный 55–100+ тыс. ₽/м².","t1":{"q":"Соберите формулу оценки.","pieces":["площадь","× цена м² категории","+ площадка и организация 8–12%"],"dis":["× число дней выставки","÷ число зон","+ аренда площади"],"why":"Оценка = S × ₽/м² категории плюс скрытые затраты площадки; аренда — отдельный счёт организатора."},"t2":{"q":"Подставьте числа для средней категории ~42 тыс./м².","pieces":["80 × 42 = 3,36 млн","+ 10% ≈ 0,34","≈ 3,7 млн"],"dis":["80 × 42 = 336 тыс.","≈ 1,2 млн","× 3 дня = 11 млн"],"why":"80 × 42 000 = 3,36 млн; плюс ~10% на площадку и организацию ≈ 3,7 млн. Вилка 3,4–4 млн, точнее — после плана."},"say":"«Доминанта и лайтбоксы без подвеса — это средняя категория эксклюзива, около 40–45 тысяч за метр. На 80 м² — 3,4–3,7 миллиона с учётом монтажа, логистики и расходов площадки. Аренда площади — отдельно, организатору. Точную цифру дам после плана и брифа — за два дня»."},{"id":"n2","level":"L2","title":"Высота буквы с дистанции","sit":"Дизайнер ставит логотип 12 см на фриз. Главный поток — вход в 40 м. Сообщение на фасаде должно читаться с 15 м. Правило: на ходу высота буквы ≈ дистанция × 0,5 см.","t1":{"q":"Соберите правило.","pieces":["h (см)","≈ D (м)","× 0,5 на ходу"],"dis":["× 0,05","≈ D (м) × 2","÷ контраст"],"why":"Полсантиметра высоты буквы на каждый метр дистанции при беглом взгляде; при спокойном чтении — 0,3."},"t2":{"q":"Подставьте числа.","pieces":["40 × 0,5 = 20 см → лого ≥ 20 (лучше 30–40)","15 × 0,5 = 7,5 → сообщение 8 см","12 см лого читается лишь с 24 м"],"dis":["40 × 0,05 = 2 см → лого 2 см достаточно","15 × 2 = 30 см → сообщение 30 см","12 см лого читается уже с 120 м"],"why":"Логотип 12 см пропадает уже с 25 м — вход в 40 м его не увидит; нужно 20–40 см. Сообщение — 8 см на плашке."},"say":"«Логотип 12 сантиметров читается с 24 метров, а вход у нас в сорока. Поднимаем до 35 — это полметра на каждые десять метров. Фраза на фасаде — 8 сантиметров, чтобы прочли с пятнадцати. На рендере разница незаметна, в павильоне — решает»."},{"id":"n3","level":"L2","title":"Свет стенда в киловаттах","sit":"PM спрашивает мощность для заявки площадке. На стенде 100 м²: 30 прожекторов по 40 Вт, лайтбокс 8 м² (100 Вт/м²), LED-экран 3 м² (500 Вт/м²), кофемашина 2,5 кВт, розетки и ноутбуки ~1 кВт. Запас 20%.","t1":{"q":"Соберите формулу.","pieces":["Σ (число × Вт) по группам","+ бытовая нагрузка","× 1,2 запас"],"dis":["÷ площадь стенда в м²","× число дней выставки","+ люксы на экспонат"],"why":"Мощность = сумма по группам потребителей плюс бытовая нагрузка, с запасом 20% на заявку."},"t2":{"q":"Подставьте числа.","pieces":["30 × 40 = 1,2 кВт","0,8 + 1,5 + 2,5 + 1 = 5,8","(1,2 + 5,8) × 1,2 ≈ 8,4 кВт"],"dis":["30 × 400 = 12 кВт","0,8 + 1,5 = 2,3 — остальное не свет","(1,2 + 5,8) × 1,2 ≈ 40 кВт"],"why":"1,2 + 0,8 + 1,5 + 2,5 + 1,0 = 7,0 кВт; с запасом ≈ 8,4 кВт — заявка на 10 кВт трёхфазного. Кофемашина — больше всего света."},"say":"«Нам нужно около восьми с половиной киловатт, заявим десять трёхфазных. Свет — всего два киловатта, кофемашина одна съедает больше всех прожекторов. Если площадка даст пять — отключаем кофемашину, а не свет на экспонаты»."},{"id":"n4","level":"L5","title":"Обратный отсчёт до монтажа","sit":"Выставка 12 мая, заезд 9 мая, монтаж 2 дня. Нужны: цех 4 недели, окраска МДФ внутри цеха 10 дней (первой в очередь), контрольная сборка за 4 дня до отгрузки, РД 2 недели, заявка на подвес 3 недели до монтажа. Сегодня 1 марта. Когда последний день утверждения концепции?","t1":{"q":"Соберите формулу.","pieces":["дата монтажа","− цех (с сборкой внутри)","− РД = дедлайн концепции"],"dis":["+ дни выставки","− аренда площади","÷ число дизайнеров"],"why":"Считаем от монтажа назад: цех, РД — получаем дату, когда концепция должна быть утверждена; подвес — параллельная заявка со своим сроком."},"t2":{"q":"Подставьте даты.","pieces":["9 мая − 4 нед = 11 апр: запуск цеха","11 апр − 2 нед = 28 мар: концепция утверждена","подвес: заявка до 18 апр"],"dis":["9 мая − 4 нед = 25 апр: запуск цеха","концепция утверждена до 5 мая","подвес: заявка 8 мая, за день до заезда"],"why":"Запуск цеха 11 апреля, РД с 28 марта — концепция утверждена не позже 28 марта. Запас до 1 марта — 4 недели на бриф, концепцию и тендер. Подвес — заявка до 18 апреля."},"say":"«Концепцию нужно утвердить до 28 марта: две недели на документацию, четыре на цех с окраской и сборкой, монтаж 9-го. Заявку на подвес подаём до 18 апреля. Каждая неделя задержки утверждения — минус из цеха, а значит, плёнка вместо окраски»."}],"ARTIFACTS":[{"id":"a1","level":"L4","title":"Концепция стенда на одну страницу","why":"Документ, который арт-директор показывает клиенту и приносит на собеседование как ответ на «расскажите о проекте»: задача → идея → план → объём → почему сработает → цена → сроки. С ним разговор идёт по одной карте, а не по рендерам.","fields":[{"k":"task","label":"Задача и цифры брифа","hint":"Цель с числом, аудитория, экспонаты, площадь и тип, площадка и поток, бюджет-вилка","ex":"150 контактов и 10 переговоров за 3 дня; закупщики сетей; 3 линии упаковки; 72 м² полуостров у центрального прохода, вход слева; 2,8–3,2 млн."},{"k":"idea","label":"Идея одной фразой и образом","hint":"Что стенд делает с посетителем за 3 секунды и за 10 минут; метафора — только если она работает на задачу","ex":"«Витрина-конвейер»: продукт движется навстречу потоку по подсвеченной ленте вдоль фасада; доминанта — портал 5 м в форме короба."},{"k":"plan","label":"План и траектория","hint":"Зоны с площадями, воздух %, вход, стойка сбоку, экспонат-магнит, переговорные в глубине, подсобка","ex":"Ресепшн 6, демо 22, открытая переговорная 7, закрытая 9, подсобка 5, воздух 23 (32%); вход в центре фасада, стойка справа."},{"k":"volume","label":"Объём и ключевой ракурс","hint":"Высота доминанты и стен, где логотип, с какой точки и дистанции рендер, соседи","ex":"Портал 5,0 м, лого 35 см на 4,3 м; стены 3,5; ракурс — от входа слева, 20 м, 1,6 м, соседи 4 и 5 м показаны."},{"k":"why","label":"Почему сработает: 6 критериев с цифрами","hint":"Заметность, понятность, бренд, фото, реализуемость, бюджет — по строке с числом","ex":"Заметен с 45 м; фраза 7 слов 9 см с 18 м; 30% фирменного синего, остальное белый; кадр с правого прохода; столярка + ткань, 4 недели; 42 тыс./м²."},{"k":"price","label":"Цена и варианты","hint":"Категория, ₽/м², итог; вариант Б с тем, что меняется","ex":"Средний эксклюзив, 42 тыс./м², 3,0 млн + 10% площадка. Вариант Б: ткань вместо окраски, без закрытой переговорной — 2,6 млн."},{"k":"timing","label":"Сроки и следующий шаг","hint":"Утверждение, РД, цех, сборка, монтаж; что нужно от клиента","ex":"Утверждение до 28.03; РД 2 нед; цех 4 нед; сборка 05.05; монтаж 9–10.05. От клиента: бренд-гайд, макеты продукта, подтверждение бюджета."}],"blank":["why","price"],"rubric":["Цель — с числом, а не «повысить узнаваемость»","План с воздухом ≥ 30% и траекторией, которую можно пройти пальцем","Ракурс с высоты глаз и с соседями, не «с вертолёта»","Шесть критериев — каждый с цифрой, без прилагательных","Цена названа категорией и ₽/м²; есть вариант Б с объяснением","Сроки от монтажа назад, с контрольной сборкой"]},{"id":"a2","level":"L0","title":"Техническое задание на проектирование","why":"ТЗ подписывает клиент до первого эскиза. Оно защищает идею от бесконечных правок и команду от переделок: всё, что не записано, станет «а мы думали».","fields":[{"k":"object","label":"Объект","hint":"Выставка, даты, павильон, номер стенда, площадь, тип (линейный/угловой/полуостров/островной), регламент зала","ex":"Выставка X, 12–15 мая, павильон 2, стенд 2B40, 72 м² полуостров; высота зала 5 м, подвес по заявке, стены к соседям 2,5 м."},{"k":"goals","label":"Цели и аудитория","hint":"Измеримая цель, целевой посетитель, что он должен сделать на стенде","ex":"150 контактов, 10 переговоров; закупщики розничных сетей; взять образец и записаться на встречу."},{"k":"zones","label":"Зоны и экспонаты","hint":"Список зон с площадями и численностью; экспонаты с габаритами, весом, электрикой, водой","ex":"Ресепшн на 2 чел.; демо на 3 линии (стол 2×0,8 каждая, 220 В); открытая переговорная на 4; закрытая на 6; подсобка; кофе-пойнт."},{"k":"message","label":"Сообщение и бренд","hint":"Одна фраза, бренд-гайд, обязательные элементы (лого, партнёры), запреты","ex":"«Упаковка, которая продаёт за вас». Гайд v3; логотип на доминанте; без фото людей со стоков."},{"k":"budget","label":"Бюджет и состав","hint":"Вилка на застройку (без аренды площади), что входит: конструктив, графика, свет, AV, мебель, монтаж, логистика","ex":"2,8–3,2 млн без аренды; AV — аренда экрана 2 м² включена; мебель — аренда."},{"k":"process","label":"Процесс и правки","hint":"Сроки концепции, число концепций, число итераций правок, формат презентации, кто утверждает","ex":"Концепция за 10 рабочих дней; 2 концепции; 2 итерации правок; презентация очно; утверждает директор по маркетингу."},{"k":"inputs","label":"Что даёт клиент и когда","hint":"План павильона, гайд, макеты, контакты площадки, доступ к прошлым стендам","ex":"План и регламент — сегодня; гайд и логотипы в кривых — 3 дня; макеты продукции — 5 дней."}],"blank":["process","budget"],"rubric":["Тип стенда и регламент указаны — идея не упрётся в площадку","Цель измерима, зоны с площадями и численностью","Экспонаты с весом и электрикой — нет сюрпризов для конструктива","Бюджет — вилка на застройку, отдельно от аренды","Число концепций и итераций записано — правки конечны","Сроки входных данных от клиента зафиксированы"]},{"id":"a3","level":"L3","title":"Чек-лист «рендер → производство»","why":"Девять проверок, которые арт-директор делает до передачи концепции в РД. Каждая — вопрос, на который должен быть ответ, иначе цех ответит сам.","fields":[{"k":"height","label":"Высоты и регламент","hint":"Доминанта ≤ лимит зала или согласование; стены к соседям ≥ 2,5 м с отделкой; ничего за границу; открытые стороны без глухих стен","ex":"Портал 5,0 при лимите 5; стены к соседу 3,0 с ламинатом сзади; консоль 0,4 м внутрь границы."},{"k":"loads","label":"Нагрузки и подвес","hint":"Что выше 4 м, что нависает, что весит — металл и расчёт; подвес — заявка и план Б; тяжёлые экспонаты — нагрузка зала","ex":"Портал — металл 60×40, расчёт заказан; подвеса нет; станок 2,8 т — плита и согласование."},{"k":"modules","label":"Разузловка","hint":"Плоскости > 2,8 м — модули по листу и фуре; стыки в углах, под плёнкой или в теневой зазор; модуль ≤ 100 кг","ex":"Стена 9 м — 4 модуля 2,25, зазор 8 мм показан на рендере."},{"k":"materials","label":"Материалы по зонам","hint":"Касание — МДФ окраска; плоскости — ЛДСП + плёнка или ткань; радиусы — фанера/МДФ пропилами; стекло — закалённое; сертификаты","ex":"Стойка МДФ RAL 9003; стены ЛДСП плёнка; задники ткань Г1; перегородка — закалённое 8 мм."},{"k":"time","label":"Сроки материалов","hint":"Окраска МДФ 7–10 дней — первой в очередь; порошок металла 5–7; ткань 3–5; печать 2–3; что не успевает — замена","ex":"Окраска стартует день 1 цеха; ткань — неделя 3."},{"k":"light","label":"Свет и электрика","hint":"Слои: общий 300–500 лк, акцент 3:1, контур; температура; прожекторы с козырька; мощность с запасом 20%","ex":"30 прожекторов 4000 К, 14 акцентных; 8,4 кВт → заявка 10."},{"k":"graphics","label":"Графика и читаемость","hint":"Размеры букв по дистанции; плашки на фото; файлы в кривых; цветопроба","ex":"Лого 35 см, фраза 9 см, стойка 1,5 см; цветопроба RAL 5002 vs печать."},{"k":"passport","label":"Паспорт концепции","hint":"План, разрезы, ракурс, RAL/декоры, свет, список «не менять», приоритеты сокращения","ex":"«Не менять»: высота портала, акцентный свет, фраза. Резать: экран → мебель → вторая переговорная."},{"k":"checkpoints","label":"Точки надзора","hint":"Ревью РД, образцы, контрольная сборка, монтаж день 1, приёмка с фото — даты в графике PM","ex":"РД 14.04; образцы 18.04; сборка 05.05; монтаж 09.05; приёмка 12.05 10:30."}],"blank":["modules","passport"],"rubric":["Каждая высота сверена с регламентом зала, не с памятью","Всё, что нависает или выше 4 м, — металл с расчётом","Стыки спроектированы и показаны клиенту до РД","Материалы выбраны по зоне и сроку, у тканей — сертификаты","Паспорт содержит «не менять» и приоритеты сокращения","Пять точек надзора стоят в графике датами"]},{"id":"a4","level":"L4","title":"Презентация для тендера: структура на 7 слайдов","why":"Сценарий 15–20 минут, который выигрывает тендер объяснением, а не рендером. Это же — структура тестового задания на собеседовании.","fields":[{"k":"s1","label":"Слайд 1 — Задача","hint":"Цифры брифа и допущения, если бриф неполный","ex":"«150 контактов, закупщики, 72 м² у центрального прохода, 2,8–3,2 млн. Допущение: поток слева от входа 3»."},{"k":"s2","label":"Слайд 2 — Идея","hint":"Одна фраза и один образ; почему именно так для этой задачи и бренда","ex":"«Витрина-конвейер»: продукт идёт навстречу потоку; бренд — движение и чистота."},{"k":"s3","label":"Слайд 3 — План","hint":"План с зонами, площадями и траекторией; пройти пальцем вслух","ex":"Вход в центре → стойка справа → лента продукта → переговорные в глубине; воздух 32%."},{"k":"s4","label":"Слайд 4 — Объём и ракурс","hint":"Разрез с высотами; рендер с 1,6 м с 20 м, с соседями","ex":"Портал 5 м, лого 35 см; соседи 4 и 5 м показаны."},{"k":"s5","label":"Слайд 5 — Почему сработает","hint":"Шесть критериев, каждый с цифрой","ex":"45 м / 9 см с 18 м / 30% синего / кадр справа / 4 недели столярка / 42 тыс./м²."},{"k":"s6","label":"Слайд 6 — Цена и варианты","hint":"Категория, ₽/м², итог, что входит; вариант Б с тем, что меняется","ex":"3,0 млн средний эксклюзив; Б — 2,6 млн: ткань вместо окраски, без закрытой переговорной."},{"k":"s7","label":"Слайд 7 — Сроки и шаг","hint":"График от монтажа назад; что нужно от клиента; дата решения","ex":"Утверждение до 28.03 — иначе окраска → плёнка; нужны гайд и макеты; решение — пятница."}],"blank":["s5","s6"],"rubric":["Начинается с задачи клиента, не с истории агентства","Одна рекомендованная концепция и варианты цены, не три равных","Рендер с высоты глаз и с соседями","Аргументы — критерий + цифра, без «эффектно» и «современно»","Цена названа и объяснена, есть вариант Б","Сроки показывают цену задержки утверждения"]}],"CHEAT":[{"title":"Расписание: 10 часов (5 + 5)","lines":["День 1 (5 ч) — проектирование и визуал. 0:00–0:15 Диагностика на входе (12 вопросов). 0:15–1:00 L0: «Стенд как продукт», «Бриф и ТЗ» + лаборатория «Смета по м²». 1:00–2:15 L1: планировка, объём, конструктив и регламент (3 юнита) + босс «Островной стенд 200 м²». 2:15–2:40 Мастерская стенда: миссии 1 (бриф → цели) и 3 (островной 200 м²). 2:40–2:50 перерыв. 2:50–3:50 L2: «Три секунды», «Свет, цвет, материал, экраны» + босс «Стенд не заметили» + лаборатория «Читаемость» и «Свет». 3:50–4:40 L3: материалы, «От рендера к цеху» + босс «Цех говорит: так не сделать» + аудит «Концепт-рендер перед РД». 4:40–5:00 Мастерская: миссии 4 (регламент) и 5 (рендер → цех); шпаргалка «Стенд на салфетке» вслух.","День 2 (5 ч) — коммерция, управление, позиция. 0:00–1:00 L4: смета, тендер и презентация + босс «Тендер: 100 м² за 3 млн» + аудит «Смета для тендера». 1:00–1:30 Мастерская: миссии 2 (бюджет) и 6 (линейный 24 м²). 1:30–2:30 L5: руководить дизайнерами, от концепции до монтажа + босс «Идея потерялась по дороге» + аудит «Постмортем». 2:30–2:40 перерыв. 2:40–3:30 L6: тренды и насмотренность, портфолио и собеседование + босс «Сделайте как у конкурента». 3:30–4:00 Артефакты «Концепция на страницу» и «Презентация для тендера» (заполнить по своему кейсу). 4:00–4:30 Этюды (5) и «Цифры на пальцах» (4). 4:30–5:00 Мастерская миссия 7 (тендер — все шесть критериев) + мок-интервью (экзамен).","Если времени меньше: обязательный минимум — L0 юнит 2, L1 полностью, L2 юнит 1, L3 юнит 2, L4 юнит 2, L5 юнит 2, босс «Островной стенд», миссии 1 и 7, шпаргалки «Стенд на салфетке» и «Концепция за 45 минут».","Перед собеседованием (30 минут): перечитать «Стенд на салфетке», «Цифры дизайнера», «Фразы для клиента»; нарисовать план и разрез любого своего стенда от руки за 5 минут и проговорить по семи шагам презентации; ответить вслух на 10 случайных вопросов из банка."]},{"title":"Стенд на салфетке","lines":["1. Тип и поток: линейный / угловой / полуостров / островной; стрелка главного потока по плану павильона; соседи с высотой.","2. Вход в центре открытой стороны; стойка сбоку; экспонат-магнит с обходом с трёх сторон; открытые переговорные дальше; закрытые — в глубине, стекло внутрь; подсобка 4–8%, у островного — в ядре.","3. Воздух 30–40%; проходы ≥ 1,2 м; менеджер 8–12 м²; открытая переговорная 6–8; закрытая от 9; подсобка ≥ 2×1,5.","4. Одна доминанта в верхней трети лимита (при 5 м — 3,8–4,5), логотип на ней 20–40 см; второй акцент вдвое ниже и другой формы; три уровня ритма.","5. Иерархия: лого 30–40 м → фраза 10–15 м (6–10 см) → продукт 5 м → детали 1–2 м (0,9–1,7 м высоты). Буква ≈ D × 0,5 см.","6. Свет: общий 300–500 лк, акцент 3:1 на экспонат/стойку/лица, контур; 4000 К база; прожекторы с козырька, не в глаза.","7. Материалы по зонам: касание — МДФ окраска; плоскости — ЛДСП + плёнка / ткань; > 4 м, консоль, этаж — металл с расчётом; стыки — теневой зазор.","8. Регламент: 5 м; стены к соседям ≥ 2,5 с отделкой; ничего за границу; подвес — заявка 2–3 недели + план Б; сертификаты горючести.","9. Цена: категория × м²: 25–35 / 35–55 / 55–100+ тыс.; + площадка и организация 8–12%; аренда отдельно.","10. Кадр: точка для фото с доминантой, логотипом, людьми и чистым фоном — снимать в первый день."]},{"title":"Концепция за 45 минут (тестовое задание)","lines":["0–5 мин: прочитать бриф, выписать цифры и допущения (поток, соседи, бюджет-вилка, если не даны — назвать явно).","5–15 мин: план — тип стенда, стрелка потока, зоны по нормам с площадями, воздух %, траектория пальцем; подсобка и закрытые — в глубину.","15–25 мин: объём — разрез с высотами, одна доминанта на поток, логотип в верхней трети, второй акцент; материалы по зонам; что металл.","25–30 мин: сообщение — одна фраза 5–7 слов, размер буквы по дистанции; свет — три слоя и температура.","30–38 мин: аргументы — шесть критериев с цифрами: заметность (м), понятность (см с м), бренд (% цвета), фото (точка), реализуемость (материал, недели), бюджет (₽/м², категория).","38–43 мин: цена и вариант Б — что меняется и сколько экономит; сроки от монтажа назад.","43–45 мин: риски и вопросы к клиенту (регламент, подвес, нагрузка, гайд).","Подача: 6–8 слайдов или два листа А3 — план, разрез, эскиз ракурса с 1,6 м, таблица критериев, цена, сроки. Рендер не обязателен; обязателен план."]},{"title":"Цифры дизайнера","lines":["Высота буквы: D (м) × 0,5 см на ходу; × 0,3 при спокойном чтении. 40 м → 20+ см; 15 м → 8 см; 2 м → 1 см.","Доминанта: верхняя треть лимита; при 5 м — 3,8–4,5 м; ниже 2,5 м всё закрывают люди.","Зоны: менеджер 8–12 м²; открытая переговорная 6–8; закрытая ≥ 9; подсобка 4–8% и ≥ 2×1,5 м; воздух 30–40%; проходы ≥ 1,2 м.","Свет: 300–500 лк общий; акцент 3:1; прожектор 1 на 3–4 м² + акценты; 3000 К бар / 4000 К лица и продукт / 6500 К техника; запас мощности 20%.","LED-экран: дистанция ≈ P × 1–1,5 м (P2.5 — от 3 м, P3.9 — от 5 м); 800–1500 нит; 300–600 Вт/м²; контент 15–30 с крупно.","Лайтбокс: глубина 80–120 мм; 60–120 Вт/м²; виден с 40 м; ткань с сертификатом.","Материалы: ЛДСП 16–22 мм лист 2800×2070; МДФ 16–19 окраска 7–10 дней; фанера 2440×1220; порошок металла 5–7 дней; ткань 3–5 дней; печать 2–3 дня.","Логистика: фура 13,6×2,45×2,6 м; модуль ≤ 80–100 кг; ворота павильона ~2,4–4 м — уточнять.","Цена: стандарт 4–6 тыс./м²; стандарт+ 6–12; эксклюзив 25–35 / 35–55 / 55–100+; аренда 10–20 отдельно; скрытые 8–12%; маржа 20–35%.","Сроки: концепция 1–2 нед; РД 1–2 нед; цех 3–5 нед; сборка за 3–5 дней до отгрузки; монтаж 2–3 дня; подвес — заявка за 2–3 нед; второй этаж — 8–10 нед."]},{"title":"Материалы: что из чего","lines":["ЛДСП — каркасы, подсобки, прямые стены под плёнку с кромкой ПВХ; не красить, не гнуть; дёшево.","МДФ — окраска RAL (грунт + 2 слоя, 7–10 дней), фрезеровка, радиусы пропилами; ресепшн, доминанта, зоны касания; боится воды; ×1,5–2 к ЛДСП.","Фанера — гнутые формы, ажурные панели, несущие элементы столярки; 2440×1220.","Металл (труба 40×40, 60×40) — всё выше 4 м, консоли, башни, второй этаж, подвесные элементы; расчёт конструктора; порошковая окраска.","Профильные системы (Octanorm, Maxima, ферма) — стандарт, каркасы под ткань, световые порталы; быстро и многоразово.","Натяжная ткань — большие плоскости, потолки, лайтбоксы; 3–5 дней; лёгкая; сертификат горючести обязателен.","Акрил — молочный под подсветку букв и коробов, прозрачный для витрин; лазер; царапается. Стекло — закалённое 8–10 мм для перегородок и витрин; тяжёлое, дорогое, долгий заказ.","Композит (алюминий) — ровные фасады, облицовка металлокаркаса, улица; лист ~1500×4000; стыки проектировать.","Печать: баннер/ткань сольвент 360–720 dpi для 2–3 м+; плёнка на панели в цеху — цвет без окраски; интерьерная печать для 0,5–1 м.","Правило выбора: по зоне (касание / плоскость / нагрузка), по сроку (окраска долго, ткань быстро), по дистанции (с 10 м плёнка = окраска)."]},{"title":"Регламенты площадок","lines":["Высота: обычно 5 м (Экспоцентр, Крокус; у Крокуса по залам до 6–8 м по согласованию); всё выше — согласование заранее с проектом и расчётом.","Стены к соседям: от 2,5 м, обратная сторона — чистовая отделка (белый, ламинат); графика к соседу — только по согласованию с ним.","Границы: ни один элемент не выходит за линию стенда — ни консоль, ни подиум, ни пандус (пандус в границах).","Открытые стороны: нельзя закрывать глухими стенами без согласования (обычно ≤ 50% длины стороны).","Подвес: только силами площадки/аккредитованных риггеров, заявка за 2–3 недели, расчёт нагрузок, точки по сетке зала; план Б обязателен.","Двухэтажные стенды: отдельный проект с расчётом, допуск площадки, лестница и ограждения по нормам, лимит людей наверху.","Пожарные нормы: сертификаты горючести на ткани, ковролин, декоративные панели; проходы и эвакуация; электрика — проект и щит, запас 20%.","Документы в срок: план, разрезы, электросхема, спецификация материалов — обычно за 3–4 недели; без допуска монтажная бригада не зайдёт.","Нагрузка на пол: уточнять по залу (1–5 т/м²); тяжёлые экспонаты — согласование и распределяющая плита.","Вода, газ, сжатый воздух, тяжёлое оборудование — отдельные заявки; шум и запахи — ограничения по регламенту выставки."]},{"title":"Чек-лист «Дизайн, который продаётся»","lines":["Заметен: доминанта в верхней трети лимита, логотип 20–40 см, развёрнут на главный поток; отстройка от соседей контрастом — проверено с 20–40 м по плану.","Понятен: одна фраза-выгода 5–7 слов, буквы по дистанции, иерархия четырёх уровней, детали вблизи; за 3 секунды ясно, кто и что.","Привлекателен для бренда: палитра и тон гайда (светлый/тёмный, тёплый/холодный) выдержаны; бренд-элементы — на доминанте и стойке, не везде.","Эффектен на фото: спроектирован кадр — точка, доминанта + логотип + люди, чистый фон, свет на лицах 4000 К; съёмка в первый день.","Реалистичен для производства: высоты в регламенте; нагрузки — металл с расчётом; разузловка по листу и фуре; материалы по сроку; сертификаты; сборка в графике.","Соответствует бюджету: категория названа на эскизе; смета по долям; скрытые 8–12%; вариант Б с объяснением, что меняется.","Объяснён: каждый критерий — с цифрой; есть план, разрез, ракурс с 1,6 м с соседями; «почему сработает» вместо «эффектно».","Доедет: паспорт концепции с «не менять» и приоритетами сокращения; пять точек надзора датами в графике PM."]},{"title":"Фразы для клиента","lines":["На «сделайте вау»: «Давайте переведём в цель — сколько людей и какие действия на стенде; „вау“ я спроектирую как заметность с 40 метров и кадр для соцсетей».","На «а где большой экран»: «Экран уместен там, где есть сценарий на 20 секунд; у вас продукт продаётся в руках — деньги в зону касания и свет на неё. Небольшой экран P2.5 в демо-зоне — да».","На «слишком смело»: «Вот тот же ракурс с 20 метров без доминанты — стенд исчезает среди соседей. Высота — не смелость, а читаемость».","На «дорого»: «Это средняя категория — 42 тысячи за метр. Вот вариант Б на 2,6: те же высота, свет и фраза; ткань вместо окраски и без второй переговорной».","На «как у конкурента»: «Он стоит через два стенда от вас; копия будет работать на него. Вот ряд с 20 метров: ваш светлый объём между двумя тёмными — его заметят первым».","На «ещё пару правок»: «Две итерации по ТЗ прошли; форму стойки поправим, переговорную и экран оценим отдельным соглашением — назову цену и срок завтра».","На «это не то, что вы показывали» (монтаж): «Вы правы: свет и высоту вернём к утру; лайтбокс компенсируем; вот что меняем в процессе, чтобы не повторилось».","На «зачем нам план, покажите картинку»: «Картинка — обещание; план — как стенд будет работать. Пройдём пальцем: вход, стойка, экспонат, переговорная — 2 минуты».","На «почему не самый дешёвый»: «Разница — 400 тысяч; за них — доминанта на 5 метров и свет на продукт, то есть заметность. Без них стенд за 2,6 не выполнит задачу в 150 контактов»."]},{"title":"Банк вопросов собеседования (ответить вслух)","lines":["1. Расскажите о реализованном проекте: задача, идея, план, что изменилось по дороге, результат, что сделали бы иначе. (Структура кейса; реализованное вперёд.)","2. Клиент принёс бриф на абзац. Что сделаете за первую неделю? (Семь вопросов брифа, план павильона, регламент, ТЗ.)","3. Островной 200 м² в центре зала, сосед 5 м с LED-стеной. Как проектируете? (Ядро служебное, одна доминанта на поток, отстройка контрастом.)","4. Чем ЛДСП отличается от МДФ и где какой? (Каркас и плёнка против окраски и фрезы; 7–10 дней; по зонам.)","5. Что нельзя делать по регламенту площадки? (5 м, 2,5 к соседям, границы, открытые стороны, подвес, сертификаты.)","6. Как оцените стоимость стенда по эскизу? (Категория × м², структура долей, скрытые 8–12%.)","7. Что такое «дизайн, который продаётся»? (Шесть критериев с цифрами; объяснить, почему работает.)","8. Как контролируете, чтобы стенд соответствовал рендеру? (Паспорт, «не менять», пять точек надзора, сборка.)","9. Дизайнер второй раз делает лого на 2 м. Что делаете? (Что → почему → как; пример из гайда; чек-лист.)","10. Какие тренды в выставочном дизайне вы бы применили и какие нет? (Через задачу и цену: ткань, фото-точки, контент; не «всё сразу».)","11. Клиент просит «как у конкурента». (Перевести в задачу; соседи по плану; контраст; сравнительный рендер.)","12. Бюджет урезали на 40% за 5 недель. (Приоритеты сокращения; доминанта, свет, фраза — сохранить; два плана.)","13. Как вы презентуете концепцию? (Семь шагов; план пальцем; ракурс с 1,6 м; цифры наши.)","14. Какие программы используете и зачем? (3ds Max + Corona/V-Ray — ракурс и свет; SketchUp/ArchiCAD/AutoCAD — план и разрез; Photoshop/Illustrator — графика; главное — план и разрез, не софт.)","15. Чем гордитесь в портфолио и какая награда/публикация у вас есть или к какой идёте? (Кейс с результатом; конкурсы стендов — как критерий ясности идеи.)","16. Как работаете с проектным менеджером и производством? (Паспорт, приоритеты, через шефа монтажа, сборка, честный разговор с клиентом.)"]},{"title":"Словарь за 2 минуты","lines":["Типы: линейный (1 сторона) · угловой (2) · полуостров (3) · островной (4). Стандарт — панели 2,5 м напрокат; эксклюзив — проект под клиента.","Проект: бриф → ТЗ → концепция → тендер/утверждение → паспорт → РД → цех → контрольная сборка → монтаж → приёмка с фото → постмортем.","Композиция: доминанта · ключевой ракурс · траектория · зонирование · воздух · иерархия · читаемость · отстройка · фотогеничность.","Свет: общий · акцент 3:1 · контур · температура К · лайтбокс · LED-экран (шаг P).","Материалы: ЛДСП · МДФ · фанера · металлокаркас · профиль · ткань · акрил · стекло · композит · плёнка · печать · фрезеровка ЧПУ · класс горючести.","Площадка: регламент · подвес · нагрузка на пол · второй этаж · подиум · граница стенда.","Коммерция: смета · цена за м² · скрытые затраты · тендер · презентация · аргумент · вариант Б.","Управление: ревью по чек-листу · обратная связь «что → почему → как» · стиль компании · паспорт концепции · авторский надзор · постмортем."]}],"DIAG":[{"mechanic":"single","points":1,"stem":"Чем островной стенд отличается от полуострова?","options":[{"id":"o0","text":"У островного четыре открытые стороны, у полуострова — три и одна глухая спина","correct":true,"rationale":"Число открытых сторон задаёт тип."},{"id":"o1","text":"Островной стоит в центре зала, полуостров — у стены; число открытых сторон у обоих одинаковое","correct":false,"rationale":"Положение следует из типа, а не наоборот."},{"id":"o2","text":"Островной всегда двухэтажный, полуостров — одноэтажный","correct":false,"rationale":"Этажность не связана с типом."},{"id":"o3","text":"Островной собирается из профильных систем, полуостров — эксклюзивный","correct":false,"rationale":"Тип застройки — другая ось."}],"id":"d1","level":"L0"},{"mechanic":"single","points":1,"stem":"Что обязательно должно быть в ТЗ на проектирование стенда?","options":[{"id":"o0","text":"Число концепций и итераций правок","correct":true,"rationale":"Иначе проект не заканчивается."},{"id":"o1","text":"Финальные рендеры с трёх ракурсов для согласования","correct":false,"rationale":"Рендер — результат, не задание."},{"id":"o2","text":"Список прожекторов с артикулами и мощностью","correct":false,"rationale":"Это спецификация РД."},{"id":"o3","text":"Подписи всех субподрядчиков цеха","correct":false,"rationale":"ТЗ подписывает клиент."}],"id":"d2","level":"L0"},{"mechanic":"single","points":1,"stem":"Какая высота у доминанты при лимите зала 5 м?","options":[{"id":"o0","text":"3,8–4,5 м — верхняя треть лимита, логотип на ней","correct":true,"rationale":"Выше голов и под регламентом."},{"id":"o1","text":"2,0–2,5 м — на уровне глаз, чтобы читалась вблизи","correct":false,"rationale":"Закрыта людьми."},{"id":"o2","text":"Ровно 5,0 м и выше по согласованию — максимум всегда лучше","correct":false,"rationale":"Максимум не обязателен; запас нужен."},{"id":"o3","text":"Любая, если доминант три и они одинаковые","correct":false,"rationale":"Три равные — забор."}],"id":"d3","level":"L1"},{"mechanic":"single","points":1,"stem":"Что требуется, чтобы повесить световой короб к потолку павильона?","options":[{"id":"o0","text":"Заявка площадке за 2–3 недели, расчёт нагрузок, монтаж риггерами и план Б","correct":true,"rationale":"Подвес — чужой потолок."},{"id":"o1","text":"Письменное согласие соседей по ряду и своя монтажная бригада с подъёмником 6 м","correct":false,"rationale":"Монтаж — силами площадки."},{"id":"o2","text":"Ничего: до 100 кг подвес разрешён без заявки, если трос крепится к штатной ферме","correct":false,"rationale":"Любой подвес — по заявке."},{"id":"o3","text":"Только сертификат горючести на короб и акт о весе от цеха, подвес выполняет цех","correct":false,"rationale":"Сертификат — другая статья."}],"id":"d4","level":"L1"},{"mechanic":"single","points":1,"stem":"С какого расстояния читается надпись буквами 8 см на ходу?","options":[{"id":"o0","text":"Примерно с 15 м","correct":true,"rationale":"D × 0,5 см → 16 м."},{"id":"o1","text":"Примерно с 40 м","correct":false,"rationale":"Для 40 м нужно 20+ см."},{"id":"o2","text":"Примерно с 4 м","correct":false,"rationale":"8 см с 4 м — крупно; правило × 0,5."},{"id":"o3","text":"С любого — зависит только от шрифта","correct":false,"rationale":"Шрифт влияет, дистанция решает."}],"id":"d5","level":"L2"},{"mechanic":"single","points":1,"stem":"Какой контраст акцентного света к общему делает экспонат главным?","options":[{"id":"o0","text":"Около 3:1","correct":true,"rationale":"Глаз идёт на самое светлое."},{"id":"o1","text":"1:1 — равномерный свет без тёмных углов","correct":false,"rationale":"Равномерно — нет главного."},{"id":"o2","text":"10:1 и цветной фильтр в фирменный цвет","correct":false,"rationale":"Слепит и искажает продукт."},{"id":"o3","text":"Контраст не важен, важна температура 6500 К","correct":false,"rationale":"6500 К делает лица серыми."}],"id":"d6","level":"L2"},{"mechanic":"single","points":1,"stem":"Какой материал для радиусной крашеной стойки ресепшн?","options":[{"id":"o0","text":"МДФ пропилами или гнутая фанера под окраску","correct":true,"rationale":"Форма и краска — МДФ/фанера."},{"id":"o1","text":"ЛДСП 16 мм с кромкой ПВХ в цвет RAL — дешевле окраски","correct":false,"rationale":"Не гнётся и не красится."},{"id":"o2","text":"Натяжная ткань на алюминиевом профиле с печатью «под краску»","correct":false,"rationale":"Ткань — для плоскостей, не касания."},{"id":"o3","text":"Композит 3 мм без каркаса, согнутый по радиусу на месте","correct":false,"rationale":"Нужен каркас; и композит гнётся ограниченно."}],"id":"d7","level":"L3"},{"mechanic":"single","points":1,"stem":"Стена 9 м «без швов» в глянце. Как её делают?","options":[{"id":"o0","text":"Модулями по листу с теневым зазором или стыком под плёнкой, который показан клиенту","correct":true,"rationale":"Шов проектируют."},{"id":"o1","text":"Одним листом 9 м под заказ у поставщика композита — везут длинномером и заносят через ворота","correct":false,"rationale":"Не влезет в фуру и ворота."},{"id":"o2","text":"Собирают из стандартных листов, а стыки шпаклюют и красят глянцем прямо на монтаже","correct":false,"rationale":"В павильоне не красят."},{"id":"o3","text":"Такую стену не делают — заменяют в концепции на матовую натяжную ткань того же цвета","correct":false,"rationale":"Делают — модулями."}],"id":"d8","level":"L3"},{"mechanic":"single","points":1,"stem":"Бюджет 2 млн на 100 м² (без аренды). Какая категория застройки?","options":[{"id":"o0","text":"Простой эксклюзив: столярка, ткань, без подвеса и LED-стен","correct":true,"rationale":"20 тыс./м² — нижняя граница эксклюзива."},{"id":"o1","text":"Средний эксклюзив с металлической доминантой и LED 8 м²","correct":false,"rationale":"Это 40–60 тыс./м²."},{"id":"o2","text":"Стандартная застройка — 2 млн на 100 м² хватит только на неё","correct":false,"rationale":"Стандарт — 4–6 тыс./м²."},{"id":"o3","text":"Сложный эксклюзив, если убрать мебель","correct":false,"rationale":"Мебель — 5–10%; категория не меняется."}],"id":"d9","level":"L4"},{"mechanic":"single","points":1,"stem":"Что такое аргумент на слайде «почему сработает»?","options":[{"id":"o0","text":"Критерий с цифрой: «доминанта 5 м, лого 35 см — читается с 45 м»","correct":true,"rationale":"Критерий + цифра."},{"id":"o1","text":"Эмоциональная формула: «эффектно, современно, в тренде, запомнится надолго»","correct":false,"rationale":"Прилагательные."},{"id":"o2","text":"Ссылка на награды агентства и список клиентов, для которых строили похожие стенды","correct":false,"rationale":"Про нас, не про задачу."},{"id":"o3","text":"Рендер 4K с облётом камеры и подписью «вид с главного прохода»","correct":false,"rationale":"Картинка — не аргумент."}],"id":"d10","level":"L4"},{"mechanic":"single","points":1,"stem":"На монтаже вы видите доминанту 4,6 м вместо 5,0 из концепции. Где системная причина?","options":[{"id":"o0","text":"Не было паспорта концепции со списком «не менять» и точек надзора","correct":true,"rationale":"Система, не виноватый."},{"id":"o1","text":"Конструктор ошибся в разрезе — заменить конструктора на следующем проекте","correct":false,"rationale":"Без паспорта ошибётся следующий."},{"id":"o2","text":"Клиент не заметит 40 см с прохода — системной причины нет, только мелочь","correct":false,"rationale":"Заметит; и идея теряется."},{"id":"o3","text":"Арт-директор должен сам делать РД, чтобы цех не трактовал размеры","correct":false,"rationale":"Узкое горло."}],"id":"d11","level":"L5"},{"mechanic":"single","points":1,"stem":"Клиент: «Сделайте как у конкурента, он стоит через два стенда». Что делаете?","options":[{"id":"o0","text":"Переводите в задачу и отстраиваетесь контрастом: копия рядом работает на оригинал","correct":true,"rationale":"Контекст ряда решает."},{"id":"o1","text":"Делаете похоже по образу, но ярче, выше и с LED крупнее — чтобы перебить соседа","correct":false,"rationale":"Гонка громкости."},{"id":"o2","text":"Отказываетесь: копировать чужую концепцию нельзя, предлагаете начать с чистого листа","correct":false,"rationale":"Клиент пришёл с задачей."},{"id":"o3","text":"Копируете точно по фото с прошлой выставки — клиент знает, что хочет и за что платит","correct":false,"rationale":"Работает на конкурента."}],"id":"d12","level":"L6"}],"AUDITS":[{"id":"au1","level":"L1","title":"Ревью планировки: полуостров 120 м²","intro":"Дизайнер присылает планировку на ревью перед рендером. Найдите дефекты, не пометьте лишнего и вынесите решение.","blocks":[{"h":"Исходные","t":"Полуостров 15×8 м, три открытые стороны, спина — к соседу. Главный поток — вдоль длинной стороны слева направо. Цель: 200 контактов, 15 переговоров, экспонат — печатная машина 1,6 т с подключением 5 кВт."},{"h":"Вход и ресепшн","t":"Вход — на левом углу, навстречу потоку. Стойка ресепшн 4 м стоит поперёк входа «чтобы каждый проходил через менеджера». За стойкой — витрина с образцами."},{"h":"Экспонат","t":"Машина поставлена вплотную к задней стене по центру, обход с одной стороны. Подключение 5 кВт через кабель-канал по полу к щиту площадки."},{"h":"Переговорные","t":"Две закрытые переговорные по 9 м² со стеклянными фасадами выставлены на длинную открытую сторону к потоку. Открытая переговорная — в глубине у спины."},{"h":"Подсобка","t":"Подсобка 3 м² (2×1,5) в заднем правом углу, дверь во внутренний проход. Там же кофемашина и склад каталогов."},{"h":"Площади","t":"Ресепшн 10, демо 28, закрытые 18, открытая 8, подсобка 3, бар 6 — итого 73 м²; воздух 47 м² (39%). Проходы между зонами 1,3 м."},{"h":"Доминанта","t":"Доминанта — портал 5 м с логотипом на спине стенда, у стены к соседу, так как «там больше опоры». Логотип на высоте 4,2 м."}],"flags":[{"id":"desk","t":"Стойка поперёк входа — барьер на траектории"},{"id":"corner","t":"Вход на углу навстречу потоку вместо центра открытой стороны"},{"id":"exhibit","t":"Экспонат-магнит у стены с обходом с одной стороны"},{"id":"glass","t":"Закрытые переговорные со стеклом — на поток"},{"id":"dom_back","t":"Доминанта на спине у соседа — не на ракурс потока"},{"id":"store_small","t":"Подсобка 3 м² на 120 м² — мала, кофемашина и склад не поместятся"},{"id":"air","t":"Воздух 39% — слишком много, стенд будет выглядеть пустым и недостроенным"},{"id":"power","t":"Кабель 5 кВт по полу к щиту площадки — недопустимо, нужен подвес"},{"id":"open_meet","t":"Открытая переговорная в глубине у спины — её не найдут с потока"}],"defects":[{"id":"desk","why":"Стойка поперёк входа останавливает поток у порога; стойка — сбоку, вход открыт."},{"id":"corner","why":"Вход в центре длинной открытой стороны; угол навстречу потоку создаёт пробку."},{"id":"exhibit","why":"Магнит обходят с трёх сторон; у стены — ещё один шкаф."},{"id":"glass","why":"В стеклянные переговорные на поток заглядывают; стекло — внутрь стенда, закрытые — в глубину."},{"id":"dom_back","why":"Доминанта работает на ключевой ракурс потока; у спины её закрывает стенд и сосед."}],"decoys":[{"id":"store_small","why":"2×1,5 — минимум, 3 м² при 120 м² тесно, но не дефект планировки; расширить при возможности."},{"id":"air","why":"30–40% — норма; 39% — хорошо для 200 контактов."},{"id":"power","why":"Кабель-канал по полу к щиту — обычное решение; с подиумом лучше, но не дефект."},{"id":"open_meet","why":"Открытая переговорная у спины — спокойнее; допустимо."}],"verdict":"iterate","verdictWhy":"Пять дефектов траектории и композиции — переделка плана за день до рендера; идея и зоны по площади — в норме.","lesson":"Планировку проверяют пальцем по траектории до рендера: вход в центре, стойка сбоку, магнит с обходом, стекло внутрь, доминанта на поток."},{"id":"au2","level":"L3","title":"Концепт-рендер перед передачей в РД","intro":"Концепция утверждена клиентом «по рендеру». Перед передачей конструктору проверьте, что доедет до цеха без потерь.","blocks":[{"h":"Объём","t":"Доминанта — крашеная башня 5,6 м из МДФ с логотипом на 5,2 м; регламент зала — 5 м, согласование не запрашивали («на прошлой выставке разрешали»)."},{"h":"Консоль","t":"Над ресепшн — консоль 4 м из бруса 100×100 с подвешенным экраном 55\" (40 кг) и четырьмя прожекторами."},{"h":"Стена","t":"Задняя стена 11×3,5 м — глянцевый композит без видимых стыков; в спецификации — «лист композита 11 м, заказать»."},{"h":"Материалы","t":"Стойка ресепшн радиусная — крашеный МДФ RAL 9003; потолочная ткань над лаунжем — «ткань белая, купить ближайшую»; ковролин с сертификатом."},{"h":"Свет","t":"24 прожектора 4000 К: 12 общий, 8 акцент на экспонаты и стойку, 4 контровой на башню; мощность рассчитана с запасом 20%."},{"h":"Сроки","t":"До монтажа 5 недель. План цеха: столярка и окраска стартуют одновременно на неделе 2; контрольная сборка не запланирована — «проверим на монтаже»."},{"h":"Передача","t":"В РД передаются рендеры 4K с 6 ракурсов и файл сцены; план и разрезы «конструктор снимет с модели»; список «не менять» — «очевиден из рендера»."}],"flags":[{"id":"height","t":"Башня 5,6 м без согласования при лимите 5 м"},{"id":"beam","t":"Консоль 4 м из бруса под экран и прожекторы"},{"id":"sheet","t":"Композит 11 м одним листом без разузловки"},{"id":"fabric","t":"Ткань без сертификата горючести"},{"id":"schedule","t":"Окраска не первой в очередь и нет контрольной сборки"},{"id":"passport","t":"Передача рендерами без паспорта: план, разрезы, «не менять»"},{"id":"light_ok","t":"24 прожектора на 100 м² — мало, нужно не меньше 40 для акцента"},{"id":"mdf_radius","t":"Радиусная стойка из МДФ RAL 9003 — нереализуемо, нужен металл"},{"id":"temp","t":"4000 К — неверная температура, для ресепшн нужны тёплые 3000 К"}],"defects":[{"id":"height","why":"Лимит 5 м: согласование заранее или 5,0 — иначе остановка монтажа."},{"id":"beam","why":"Консоль с нагрузкой — металл с расчётом; брус — риск обрушения."},{"id":"sheet","why":"Лист 11 м не влезет в фуру и ворота; модули с теневым зазором."},{"id":"fabric","why":"Ткань — сертификат в папку проекта; «ближайшая» — остановка монтажа."},{"id":"schedule","why":"Окраска 7–10 дней — критический путь, стартует первой; сборка за 3–5 дней до отгрузки обязательна."},{"id":"passport","why":"Размеры с рендера — с ошибкой; паспорт с планом, разрезами, RAL, светом и «не менять»."}],"decoys":[{"id":"light_ok","why":"24 прожектора на 100 м² с акцентом 3:1 и контровым — разумно; свет в норме."},{"id":"mdf_radius","why":"Радиус из МДФ пропилами или гнутой фанеры — штатно."},{"id":"temp","why":"4000 К — нейтральный свет для лиц и продукта; верно."}],"verdict":"invalid","verdictWhy":"Высота без согласования, консоль из бруса и ткань без сертификата — блокирующие по регламенту и безопасности; остальное — организация передачи.","lesson":"Рендер — обещание; в РД едут паспорт, разузловка, материалы со сроками и сертификатами, а всё, что выше лимита или нависает, — согласование и металл."},{"id":"au3","level":"L4","title":"Смета для тендера: 90 м² за 3,1 млн","intro":"Сметчик прислал смету на тендер. Ваша задача — проверить структуру и скрытые дыры до того, как цена уйдёт клиенту.","blocks":[{"h":"Итог","t":"Площадь 90 м², полуостров, средний эксклюзив (доминанта МДФ 5 м, лайтбоксы, окраска, две переговорные). Итог 3,1 млн, 34,4 тыс./м². Маржа агентства 25% заложена отдельной строкой."},{"h":"Конструктив","t":"Конструктив 1,05 млн (34%): столярка, металл доминанты с расчётом, подиум 100 мм с пандусами, окраска МДФ."},{"h":"Графика и свет","t":"Графика 0,31 млн (10%): печать, плёнка, лайтбоксы 14 м². Свет и электрика 0,28 млн (9%): 28 прожекторов, LED-ленты, щит, кабель; мощность 9 кВт."},{"h":"AV и мебель","t":"AV 0,12 млн: аренда экрана 2 м² и звук. Мебель и декор 0,19 млн: аренда стульев, столов, стоек, зелень."},{"h":"Монтаж и логистика","t":"Монтаж и демонтаж 0,22 млн, логистика 0,08 млн — итого 0,30 млн (10%). Бригада 6 человек, 2 дня монтаж, 1 день демонтаж, фура 1."},{"h":"Проектирование","t":"Концепция и РД 0,15 млн (5%). Авторский надзор не выделен — «входит в работу арт-директора»."},{"h":"Площадка","t":"Строки «электроподключение», «пропуска и парковка», «подъёмник», «уборка и вывоз», «перепечатка графики» отсутствуют — «клиент оплачивает площадке напрямую». Строка «риски/непредвиденное» — 0."}],"flags":[{"id":"hidden","t":"Нет скрытых затрат площадки и организации (8–12%)"},{"id":"montage","t":"Монтаж и логистика 10% при норме 15–20% для среднего эксклюзива"},{"id":"reprint","t":"Нет резерва на перепечатку и непредвиденное"},{"id":"margin","t":"Маржа 25% отдельной строкой — слишком высокая, клиент увидит и срежет"},{"id":"constr","t":"Конструктив 34% — слишком низкая доля при доминанте МДФ 5 м с металлом"},{"id":"av","t":"AV 0,12 млн — мало для стенда с экраном и звуком, занижено вдвое"},{"id":"design","t":"Проектирование 5% без строки авторского надзора — занижено"}],"defects":[{"id":"hidden","why":"Электрика, пропуска, подъёмник, уборка — платит застройщик площадке; без строки — 250–350 тыс. из маржи."},{"id":"montage","why":"6 человек × 3 дня + фура на 90 м² с металлом и подиумом — ближе к 0,45 млн; 0,30 — занижено."},{"id":"reprint","why":"Правки клиента и брак — 10–15% графики плюс непредвиденное 3–5%; ноль — отрицание реальности."}],"decoys":[{"id":"margin","why":"20–35% — норма для эксклюзива; 25% — средняя."},{"id":"constr","why":"34–45% — норма; с лайтбоксами вместо окраски доля конструктива ниже — верно."},{"id":"av","why":"Экран 2 м² и звук в аренду — 120 тыс. реалистично."},{"id":"design","why":"5–8% — норма; 5% при повторяемой столярке приемлемо."}],"verdict":"iterate","verdictWhy":"Структура верна, но три дыры — площадка, монтаж и резерв — вместе 0,5–0,6 млн, то есть вся маржа; доработать до отправки клиенту.","lesson":"Смету проверяют по долям и по забытым строкам: площадка и организация, честный монтаж, резерв на перепечатку — иначе прибыль проекта исчезает до его начала."},{"id":"au4","level":"L5","title":"Постмортем и фотоотчёт после выставки","intro":"PM прислал отчёт по проекту 110 м² для портфолио и разбора. Найдите, что не так в самом отчёте и в процессе, который он описывает.","blocks":[{"h":"Результат","t":"Стенд сдан в срок, клиент прин    — один глиф = одно понятие, минимум чернил, подпись внутри картинки, числа задачи — внутри картинки;
   — палитра строго из токенов темы: A синий, B оранжевый, ok/err/gold, line/muted; никаких лишних цветов;
   — геометрия несёт смысл (ширина = шум, площадь = выборка, наклон = тренд), текст — только ярлыки.
   Каждый глиф: G.name(params) → строка <svg>. */
var G={};
(function(){
var NS='<svg xmlns="http://www.w3.org/2000/svg" class="glyph" viewBox="0 0 320 ';
function svg(h,inner){return NS+h+'" role="img">'+inner+'</svg>';}
function t(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.fs||11)+'" fill="'+(o.c||'var(--muted)')+'"'+(o.a?' text-anchor="'+o.a+'"':'')+(o.b?' font-weight="700"':'')+(o.m?' font-family="var(--mono)"':'')+(o.i?' font-style="italic"':'')+'>'+esc(s)+'</text>';}
function ln(x1,y1,x2,y2,c,w,d){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'var(--line2)')+'" stroke-width="'+(w||1.5)+'"'+(d?' stroke-dasharray="'+d+'"':'')+' stroke-linecap="round"/>';}
function rc(x,y,w,h,c,o){o=o||{};return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'" rx="'+(o.r==null?3:o.r)+'"'+(o.s?' stroke="'+o.s+'" stroke-width="1.5"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';}
function ci(x,y,r,c,o){o=o||{};return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"'+(o.s?' stroke="'+o.s+'" stroke-width="1.5"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+'/>';}
function path(d,c,w,fill){return '<path d="'+d+'" stroke="'+(c||'var(--line2)')+'" stroke-width="'+(w||1.5)+'" fill="'+(fill||'none')+'" stroke-linecap="round" stroke-linejoin="round"/>';}
function bell(cx,base,sd,h,c,w){var d='';for(var x=-3;x<=3.001;x+=0.25){var px=cx+x*sd,py=base-h*Math.exp(-x*x/2);d+=(x===-3?'M':'L')+px.toFixed(1)+' '+py.toFixed(1);}return path(d,c,w||2);}
function fmt(n){return fmtNum(n);}
var A='var(--a)',B='var(--b)',OK='var(--ok)',ERR='var(--err)',GOLD='var(--gold)',MU='var(--muted)',FA='var(--faint)',LN='var(--line2)',INK='var(--ink)',ASOFT='var(--a-soft)',BSOFT='var(--b-soft)';

/* Две группы: A и B как две колонки людей; подписи — доли. p={pa,pb,label} */
G.twoGroups=function(p){var h=136;var s='';var ya=92,x0=40,x1=200;function col(x,pct,c,lbl,soft){var hh=Math.max(6,Math.round(pct*64));s+=rc(x,ya-64,80,64,soft,{r:6});s+=rc(x,ya-hh,80,hh,c,{r:6});s+=t(x+40,ya+15,lbl,{a:'middle',b:true,c:c,fs:11});s+=t(x+40,ya-hh-6,fmtPct(pct,1),{a:'middle',m:true,c:INK,fs:12});}
  col(x0,p.pa,A,'A · контроль',ASOFT);col(x1,p.pb,B,'B · вариант',BSOFT);if(p.label){var lf=10;if(p.label.length*5>290)lf=Math.max(8,Math.floor(2900/(p.label.length*5)));s+=t(160,128,p.label,{a:'middle',fs:lf});}return svg(h,s);};

/* Шум: две одинаковые монеты дали разные доли. p={a,b} в долях */
G.noiseCoins=function(p){var s='';var y=60;function coin(x,v,lbl){s+=ci(x,y,26,'var(--card2)',{s:LN});s+=t(x,y+4,fmtPct(v,1),{a:'middle',m:true,b:true,c:INK,fs:13});s+=t(x,y+44,lbl,{a:'middle'});}
  coin(90,p.a,'та же страница');coin(230,p.b,'та же страница');s+=t(160,y+2,'≠',{a:'middle',fs:18,c:FA});s+=t(160,124,'одинаковые группы · разные числа · это шум',{a:'middle',fs:10,c:MU});return svg(132,s);};

/* √n: четыре квадрата выборки → полоса шума вдвое уже. */
G.sqrtN=function(){var s='';s+=rc(30,30,40,40,ASOFT,{s:A});s+=t(50,88,'n',{a:'middle',m:true,c:A});s+=ln(50,100,50,112,MU,3);s+=t(50,118,'шум ±2',{a:'middle',fs:10});
  s+=t(110,56,'→',{a:'middle',fs:18,c:FA});
  for(var i=0;i<2;i++)for(var j=0;j<2;j++)s+=rc(140+i*42,10+j*42,40,40,ASOFT,{s:A});s+=t(181,106,'4n',{a:'middle',m:true,c:A});s+=ln(181,112,181,118,MU,3);s+=t(181,128,'шум ±1',{a:'middle',fs:10});
  s+=t(290,60,'×4 → ÷2',{a:'end',m:true,b:true,c:INK,fs:12});s+=t(290,76,'SE = σ/√n',{a:'end',m:true,fs:10});return svg(134,s);};

/* Пункты против процентов: две шкалы. p={a,b} доли */
G.ppVsPct=function(p){var s='';var y1=36,y2=86;var x0=30,w=260;s+=ln(x0,y1,x0+w,y1,LN,6);s+=rc(x0,y1-3,w*p.a*4,6,A,{r:3});s+=rc(x0+w*p.a*4,y1-3,w*(p.b-p.a)*4,6,B,{r:0});
  s+=t(x0,y1-10,fmtPct(p.a,1),{m:true,c:A});s+=t(x0+w*p.b*4+4,y1-10,fmtPct(p.b,1),{m:true,c:B});s+=t(x0+w,y1+16,'+'+fmtPct(p.b-p.a,1).replace('%','')+' п.п. — разница долей',{a:'end',fs:11,c:INK,b:true});
  s+=ln(x0,y2,x0+w,y2,LN,6);s+=rc(x0,y2-3,w*0.6,6,A,{r:3});s+=rc(x0+w*0.6,y2-3,w*0.6*((p.b-p.a)/p.a),6,B,{r:0});s+=t(x0,y2-10,'база = 100%',{m:true,c:A});s+=t(x0+w,y2+16,'+'+fmtPct((p.b-p.a)/p.a,0)+' отн. — лифт от базы',{a:'end',fs:11,c:INK,b:true});return svg(112,s);};

/* Две колокольни: эффект против шума. p={se, diff} в п.п.; рисуем контроль и вариант, стрелка разницы. */
G.bells=function(p){var s='';var base=92;var sd=Math.max(10,Math.min(40,22));var cx=120,dx=Math.max(8,Math.min(120,p.diff/p.se*sd));
  s+=bell(cx,base,sd,60,A);s+=bell(cx+dx,base,sd,60,B);s+=ln(20,base,300,base,LN,1);
  s+=ln(cx,base+4,cx,base+16,A,1.5);s+=ln(cx+dx,base+4,cx+dx,base+16,B,1.5);s+=ln(cx,base+12,cx+dx,base+12,INK,1.5);
  s+=t(cx+dx/2,base+26,'разница = '+fmt(p.diff/p.se).replace('.',',')+' SE',{a:'middle',m:true,c:INK,fs:11,b:true});
  s+=ln(cx-sd,base-36,cx+sd,base-36,A,1,'3 3');s+=t(cx,base-42,'±1 SE',{a:'middle',fs:9,c:A});
  s+=t(300,20,p.diff/p.se>=1.96?'|z| ≥ 1,96 → p < 0,05':'|z| < 1,96 → внутри шума',{a:'end',m:true,fs:11,c:p.diff/p.se>=1.96?OK:MU});return svg(122,s);};

/* Доверительный интервал на числовой оси против 0 и MDE. p={lo,hi,est,mde,unit} */
G.ci=function(p){var s='';var dot=ci;var lo=Math.min(p.lo,0,p.mde||0),hi=Math.max(p.hi,0,p.mde||0);var pad=(hi-lo)*0.2||1;lo-=pad;hi+=pad;function X(v){return 24+(v-lo)/(hi-lo)*272;}var y=56;
  s+=ln(24,y,296,y,LN,1);s+=ln(X(0),y-26,X(0),y+22,FA,1.2,'3 3');s+=t(X(0),y+36,'0',{a:'middle',m:true});
  if(p.mde!=null){s+=ln(X(p.mde),y-26,X(p.mde),y+22,B,1.2,'3 3');s+=t(X(p.mde),y+36,'MDE',{a:'middle',m:true,c:B});}
  s+=ln(X(p.lo),y,X(p.hi),y,A,5);s+=dot(X(p.est),y,5,A);s+=t(X(p.lo),y-14,fmt(p.lo),{a:'middle',m:true,c:A});s+=t(X(p.hi),y-14,fmt(p.hi),{a:'middle',m:true,c:A});
  var v=p.lo>0&&(p.mde==null||p.lo>=p.mde)?'интервал выше нуля и MDE':(p.lo>0?'выше нуля, но задевает ниже MDE':(p.hi<(p.mde||0)?'целиком ниже MDE: эффекта такого размера нет':'включает и 0, и MDE: тест не ответил'));
  s+=t(160,108,v,{a:'middle',fs:11,c:INK,b:true});if(p.unit)s+=t(296,y+36,p.unit,{a:'end',fs:9});return svg(116,s);};

/* Матрица ошибок 2×2: истина × вывод. p={hl:'a'|'b'|'power'|'tn'} подсветка */
G.errors=function(p){var s='';var x0=90,y0=26,w=100,h=40;var cells=[['tn','Верное «нет»','1 − α',x0,y0],['a','Ложная победа','α',x0+w,y0],['b','Пропуск','β',x0,y0+h],['power','Нашли','мощность 1 − β',x0+w,y0+h]];
  s+=t(x0+w/2,14,'вывод: нет',{a:'middle',fs:9});s+=t(x0+w+w/2,14,'вывод: есть',{a:'middle',fs:9});s+=t(x0-6,y0+h/2+4,'нет',{a:'end',fs:10});s+=t(x0-6,y0+h+h/2+4,'есть',{a:'end',fs:10});s+=t(10,y0+h,'истина',{fs:9});
  cells.forEach(function(c){var hl=p&&p.hl===c[0];var col=c[0]==='a'?ERR:(c[0]==='b'?GOLD:(c[0]==='power'?OK:MU));s+=rc(c[3],c[4],w-2,h-2,hl?col:'var(--card2)',{s:col,op:hl?0.9:1});s+=t(c[3]+w/2-1,c[4]+16,c[1],{a:'middle',fs:10,c:hl?'#fff':INK,b:hl});s+=t(c[3]+w/2-1,c[4]+30,c[2],{a:'middle',m:true,fs:10,c:hl?'#fff':col});});
  return svg(116,s);};

/* Выборка ∝ 1/MDE²: ступеньки площади. p={base, mde1, mde2} */
G.mdeSquare=function(p){var s='';var k=16*p.base*(1-p.base);var n1=k/Math.pow(p.mde1,2),n2=k/Math.pow(p.mde2,2);var r=Math.sqrt(n2/n1);var a=34,b=Math.min(80,a*r);
  s+=rc(40,100-a,a,a,ASOFT,{s:A});s+=t(40+a/2,110,'MDE '+fmtPct(p.mde1,1),{a:'middle',fs:10,m:true,c:A});s+=t(40+a/2,100-a-6,fmt(Math.round(n1)),{a:'middle',m:true,fs:10,c:INK});
  s+=rc(130,100-b,b,b,BSOFT,{s:B});s+=t(130+b/2,110,'MDE '+fmtPct(p.mde2,1),{a:'middle',fs:10,m:true,c:B});s+=t(130+b/2,100-b-6,fmt(Math.round(n2)),{a:'middle',m:true,fs:10,c:INK});
  s+=t(300,52,'n ∝ 1/MDE²',{a:'end',m:true,b:true,c:INK,fs:11});s+=t(300,68,'×'+fmt(Math.round(n2/n1*10)/10),{a:'end',m:true,fs:11,c:B});return svg(118,s);};

/* Паспорт: 9 полей как сетка, закрашены заполненные. p={on:[idx...]} */
G.passport=function(p){var names=['гипотеза','1 метрика','guardrails','база','MDE','α','мощность','единица','стоп'];var s='';var on=(p&&p.on)||null;for(var i=0;i<9;i++){var x=14+(i%3)*100,y=8+Math.floor(i/3)*34;var f=!on||on.indexOf(i)>=0;s+=rc(x,y,94,28,f?ASOFT:'var(--card2)',{s:f?A:LN,r:5});s+=t(x+47,y+18,(i+1)+'. '+names[i],{a:'middle',fs:10,c:f?A:FA,b:f});}
  s+=t(160,120,'девять полей до старта · пустое поле = дыра для подгонки',{a:'middle',fs:10});return svg(126,s);};

/* Иерархия метрик: пирамида первичная / вторичные / guardrails с порогами */
G.metricTree=function(p){var s='';s+=rc(110,10,100,26,A,{r:6});s+=t(160,27,'первичная · одна',{a:'middle',fs:10,c:'#fff',b:true});
  for(var i=0;i<3;i++){s+=rc(40+i*86,54,68,22,ASOFT,{s:A,r:5});s+=t(74+i*86,69,'вторичная',{a:'middle',fs:9,c:A});}
  for(var j=0;j<3;j++){s+=rc(40+j*86,94,68,22,'var(--card2)',{s:ERR,r:5});s+=t(74+j*86,109,'guardrail ≤ порог',{a:'middle',fs:9,c:ERR});}
  s+=ln(160,36,160,54,LN,1);s+=t(160,128,'решает первичная + guardrails; вторичные объясняют',{a:'middle',fs:10});return svg(134,s);};

/* Хеш и соль: id → бакет 0–99 → группа */
G.hashSalt=function(p){var s='';s+=rc(10,40,78,30,'var(--card2)',{s:LN,r:6});s+=t(49,59,'user_id',{a:'middle',m:true,fs:11,c:INK});s+=t(49,30,'+ соль теста',{a:'middle',fs:9,c:B});
  s+=t(100,60,'→ hash →',{fs:11,m:true,c:MU});s+=rc(166,40,60,30,'var(--card2)',{s:LN,r:6});s+=t(196,59,(p&&p.bucket!=null?p.bucket:'37'),{a:'middle',m:true,fs:13,c:INK,b:true});s+=t(196,30,'0…99',{a:'middle',fs:9});
  s+=rc(244,26,66,24,ASOFT,{s:A,r:5});s+=t(277,42,'0–49 → A',{a:'middle',fs:10,m:true,c:A});s+=rc(244,60,66,24,BSOFT,{s:B,r:5});s+=t(277,76,'50–99 → B',{a:'middle',fs:10,m:true,c:B});
  s+=t(160,104,'один id → всегда одна группа',{a:'middle',fs:10});s+=t(160,118,'новая соль → новое перемешивание',{a:'middle',fs:10});return svg(126,s);};

/* Триггер: воронка, где различие начинается глубоко. p={share} доля дошедших */
G.trigger=function(p){var s='';var sh=p&&p.share!=null?p.share:0.1;s+=path('M20 20 L300 20 L300 44 L20 44 Z',LN,1,'var(--card2)');s+=t(160,36,'все, кто запустил приложение — 100%',{a:'middle',fs:10});
  var w=Math.max(40,280*sh);s+=path('M'+(160-w/2)+' 62 L'+(160+w/2)+' 62 L'+(160+w/2)+' 86 L'+(160-w/2)+' 86 Z',B,1.5,BSOFT);s+=t(160,78,'видели различие — '+fmtPct(sh,0),{a:'middle',fs:10,c:B,b:true});
  s+=ln(160,44,160,62,B,1.5);s+=t(160,112,'присваивай здесь ↑  иначе эффект разбавлен в '+fmt(Math.round(1/sh))+' раз',{a:'middle',fs:10,c:INK});return svg(120,s);};

/* SRM: две колонки людей, план против факта. p={na,nb,chi,p} */
G.srm=function(p){var s='';var mx=Math.max(p.na,p.nb);function col(x,n,c,lbl){var h=Math.round(n/mx*70);s+=rc(x,96-h,70,h,c,{r:5});s+=t(x+35,110,lbl,{a:'middle',fs:10,c:c,b:true});s+=t(x+35,96-h-6,fmt(n),{a:'middle',m:true,fs:11,c:INK});}
  col(40,p.na,A,'A');col(130,p.nb,B,'B');s+=ln(40,96-70*Math.min(p.na,p.nb)/mx,200,96-70*Math.min(p.na,p.nb)/mx,ERR,1,'3 3');
  s+=t(225,40,'χ² = '+fmt(p.chi),{m:true,fs:12,c:INK,b:true});s+=t(225,58,'p '+(p.p<0.0001?'< 0,0001':'= '+fmt(p.p)),{m:true,fs:11,c:p.p<0.001?ERR:OK});s+=t(225,76,p.p<0.001?'SRM: не читать':'сплит в норме',{fs:11,c:p.p<0.001?ERR:OK,b:true});s+=t(225,92,'порог p < 0,001',{fs:9});return svg(118,s);};

/* Подглядывание: траектория p по дням, ныряющая под α. p={days:[...p], alpha} */
G.peek=function(p){var s='';var ds=p.days;var n=ds.length;function X(i){return 30+i*(270/(n-1));}function Y(v){return 90-v*76;}var d='';ds.forEach(function(v,i){d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);});
  s+=ln(30,Y(p.alpha),300,Y(p.alpha),ERR,1,'4 3');s+=t(300,Y(p.alpha)-4,'α',{a:'end',m:true,c:ERR,fs:10});s+=path(d,A,2);ds.forEach(function(v,i){if(v<p.alpha)s+=ci(X(i),Y(v),4,ERR);});
  s+=t(30,106,'день 1',{fs:9});s+=t(300,106,'день '+n,{a:'end',fs:9});s+=t(160,120,'стоп на первом красном дне = ловля шума',{a:'middle',fs:10,c:INK});return svg(126,s);};

/* Множественность: m кубиков, часть красных. p={m, alpha} */
G.multi=function(p){var s='';var m=p.m;var prob=1-Math.pow(1-p.alpha,m);var per=Math.min(8,m);var size=Math.min(20,Math.floor(170/per));for(var i=0;i<m&&i<24;i++){var x=20+(i%per)*(size+2),y=16+Math.floor(i/per)*(size+2);var red=(i===Math.floor(m*0.37));s+=rc(x,y,size,size,red?ERR:'var(--card2)',{s:red?ERR:LN,r:4});}
  s+=t(300,40,'m = '+m,{a:'end',m:true,fs:12,c:INK,b:true});s+=t(300,58,'P(≥1 ложная)',{a:'end',fs:10});s+=t(300,76,'= 1 − '+(1-p.alpha).toString().replace('.',',')+'^'+m+' ≈ '+fmtPct(prob,0),{a:'end',m:true,fs:11,c:ERR,b:true});
  s+=t(160,110,'каждая проверка — ещё один бросок',{a:'middle',fs:10});return svg(118,s);};

/* Интервал против интервала: узкий незначимый vs широкий незначимый */
G.twoCI=function(p){var s='';var mx=Math.max.apply(null,[p.lo1,p.hi1,p.lo2,p.hi2].map(Math.abs))||1;var k=120/mx;function X(v){return 160+v*k;}function row(y,lo,hi,lbl,c){s+=ln(30,y,290,y,LN,1);s+=ln(X(0),y-10,X(0),y+10,FA,1,'3 3');s+=ln(X(lo),y,X(hi),y,c,5);s+=ci(X((lo+hi)/2),y,4,c);s+=t(30,y-10,lbl,{fs:10,c:INK});}
  row(36,p.lo1,p.hi1,p.l1||'узкий: исключил важное',A);row(84,p.lo2,p.hi2,p.l2||'широкий: ничего не исключил',B);s+=t(X(0),108,'0',{a:'middle',m:true});s+=t(160,124,p.note||'оба p = 0,2 — разный смысл',{a:'middle',fs:10,c:INK,b:true});return svg(130,s);};

/* Дилюция: эффект у затронутых × доля = эффект на всех */
G.dilution=function(p){var s='';var eff=p.eff,sh=p.share;s+=rc(20,30,120,40,BSOFT,{s:B,r:6});s+=t(80,48,'затронутые '+fmtPct(sh,0),{a:'middle',fs:10,c:B});s+=t(80,63,'+'+fmtPct(eff,1),{a:'middle',m:true,fs:12,c:INK,b:true});
  s+=t(152,56,'×',{fs:16,c:FA});s+=rc(170,30,50,40,'var(--card2)',{s:LN,r:6});s+=t(195,55,fmtPct(sh,0),{a:'middle',m:true,fs:12,c:INK});s+=t(232,56,'=',{fs:16,c:FA});
  s+=rc(248,30,62,40,ASOFT,{s:A,r:6});s+=t(279,48,'на всех',{a:'middle',fs:10,c:A});s+=t(279,63,'+'+fmtPct(eff*sh,2),{a:'middle',m:true,fs:12,c:INK,b:true});
  s+=t(160,100,'мощность ∝ эффект² → в '+fmt(Math.round(1/(sh*sh)))+' раз меньше',{a:'middle',fs:10,c:INK});return svg(108,s);};

/* Новизна: эффект по неделям тает. p={weeks:[...]} */
G.novelty=function(p){var s='';var w=p.weeks;var mx=Math.max.apply(null,w.map(Math.abs))||1;var n=w.length;w.forEach(function(v,i){var x=40+i*(240/n),h=Math.abs(v)/mx*60;var y=v>=0?84-h:84;s+=rc(x,y,Math.min(44,200/n),h,v>=0?B:ERR,{r:4});s+=t(x+Math.min(44,200/n)/2,100,'нед. '+(i+1),{a:'middle',fs:9});s+=t(x+Math.min(44,200/n)/2,y-5,(v>0?'+':'')+fmt(v)+'%',{a:'middle',m:true,fs:10,c:INK});});

/* Контекстное окно: {total, parts:[[name,tokens]]} */
G.ctx=function(p){var s='';var total=p.total||32000;var parts=p.parts||[];var x=20,y=26,W=280,H=34;s+=t(20,16,'контекстное окно · '+fmtNum(total)+' токенов',{fs:10});s+=rc(x,y,W,H,'var(--card2)',{s:LN,r:6});var cols=[A,B,OK,GOLD,MU,ERR];var cx=x;var used=0;parts.forEach(function(pt,i){var w=Math.max(2,pt[1]/total*W);used+=pt[1];s+=rc(cx,y,w,H,cols[i%cols.length],{r:0,op:0.75});if(w>28)s+=t(cx+w/2,y+H/2+4,_tx(pt[0],Math.floor(w/5.5)),{a:'middle',fs:9,c:'#fff',b:true});cx+=w;});var ly=y+H+16;parts.forEach(function(pt,i){var lx=20+(i%3)*95,yy=ly+Math.floor(i/3)*14;s+=rc(lx,yy-8,8,8,cols[i%cols.length],{r:2});s+=t(lx+12,yy,_tx(pt[0],12)+' '+fmtNum(pt[1]),{fs:9});});var rows=Math.ceil(parts.length/3);var fy=ly+rows*14+6;s+=t(20,fy,'занято '+Math.round(used/total*100)+'% · остаток '+fmtNum(Math.max(0,total-used)),{fs:10,c:used>total*0.85?ERR:OK,b:true});return svg(fy+10,s);};

function renderLayers(st,card){var u=st.unit,L=u.layers,uid=u.id;var need=reqLayers(u.level);var prog=layerProg(uid);var cur=0;for(var i=0;i<4;i++){if(prog.done[i])cur=Math.min(3,i+1);else break;}
  if(!prog.done[cur]&&cur>0&&!prog.done[cur-1])cur=0;var answered={};

    each(card.querySelectorAll('.ltab'),function(b){b.onclick=function(){var i=+b.getAttribute('data-l');if(!unlocked(i)){toastMsg('Сначала пройди проверку предыдущего слоя');return;}cur=i;draw();window.scrollTo(0,0);};});

  function run(){var S_=gv('lc-area'),cat=gv('lc-cat'),hid=gv('lc-hidden')/100,bud=gv('lc-budget'),metal=gv('lc-metal')?1:0,hang=gv('lc-hang')?1:0,led=gv('lc-led')||0,f2=gv('lc-f2')?1:0;if(!(S_>0&&cat>0))return;

    var base=S_*cat*1000;var add=metal*0.12*base+hang*(150000+0.03*base)+led*120000+f2*0.7*base;var sub=base+add;var total=sub*(1+hid);var perm=total/S_/1000;

    r+='<div class="ab2"><div class="va"><span class="k">база категории</span><b>'+fmtNum(Math.round(base/1000))+' тыс.</b><span class="small muted">'+S_+' × '+cat+' тыс.</span></div><div class="'+(add>0?'vb':'va')+'"><span class="k">сложность</span><b>+'+fmtNum(Math.round(add/1000))+' тыс.</b><span class="small muted">'+(add>0?[metal?'металл':'',hang?'подвес':'',led?'LED '+led+' м²':'',f2?'2 этаж':''].filter(Boolean).join(', '):'без сдвигов')+'</span></div></div>';

    r+=glyphHtml({g:'cost',p:{lines:[['прожекторы '+n+' × '+w+' Вт',fmtNum(_r1(kwSpots))+' кВт'],['лайтбоксы '+lb+' м²',fmtNum(_r1(kwLb))+' кВт'],['LED '+led+' м² × '+ledw+' Вт',fmtNum(_r1(kwLed))+' кВт'],['кухня + розетки',fmtNum(_r1(cof+oth))+' кВт']]}});
