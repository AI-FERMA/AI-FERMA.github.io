","p":{"steps":["РД","цех","монтаж","приёмка"],"hl":[]}},"lbl":"","correct":false,"rationale":"Ни одной точки контроля арт-директора — идея «по рендеру»."},{"id":"v2","v":{"g":"pipe","p":{"steps":["ревью РД","цех","монтаж","приёмка"],"hl":[0]}},"lbl":"","correct":false,"rationale":"Нет образцов и контрольной сборки — цвет и стыки на удачу."},{"id":"v3","v":{"g":"pipe","p":{"steps":["цех","сборка","монтаж","фото через месяц"],"hl":[1]}},"lbl":"","correct":false,"rationale":"Нет ревью РД, фото после демонтажа невозможно."}],"id":"u5-2-t4"}],"framework":"Роли: PM — сроки и бюджет, конструктор — РД, цех, шеф монтажа, графика; арт-директор — соответствие идее. Паспорт концепции — документ передачи. Пять точек контроля: ревью РД, образцы, контрольная сборка, первый день монтажа, приёмка и фото. Замены — через арт-директора, сокращения — по приоритетам паспорта, конфликты — паспортом, не на монтаже. Постмортем по шести критериям.","anchor":{"g":"timeline","p":{"items":["паспорт","ревью РД","образцы","сборка","монтаж д1","приёмка + фото","постмортем"],"hl":1},"cap":"хранитель идеи без чужой работы"},"layers":{"simple":"После того как клиент сказал «да», стенд уходит к другим людям: менеджеру проекта, конструктору, цеху, монтажникам. У каждого своя задача, и ни у кого — задача «сохранить идею». Эта задача — у арт-директора.\nДля этого есть паспорт концепции: что именно нельзя менять и что резать первым, если придётся. И пять точек, где нужно появиться лично: чертежи, образцы цвета, сборка в цеху, первый день монтажа и приёмка с фотографией.\nНа монтаже арт-директор не командует бригадой — он договаривается через шефа монтажа. А после выставки делает разбор: что из обещанного сработало, что потерялось и почему, что записать в библиотеку.\nПроверь себя: что ответить менеджеру, который просит не ездить в цех ради экономии времени?","how":"1. Роли: PM (сроки, бюджет, площадка, клиент, субподрядчики), конструктор (РД, расчёты), технолог цеха, шеф монтажа, графический дизайнер (макеты), арт-директор (соответствие идее).\n2. Паспорт концепции: план, разрезы с высотами, ключевой ракурс, материалы и цвета (RAL, декоры, ткани), свет (слои, К, прожекторы), список «не менять без арт-директора», приоритеты сокращения (первым — экран, мебель, второй акцент; последним — доминанта, свет на главное, зоны касания).\n3. Пять точек контроля в графике PM: ревью РД → утверждение образцов (краска, декор, ткань, цветопроба) → контрольная сборка (доминанта, ресепшн, стыки, свет) → первый день монтажа (каркас, подвес) → приёмка по чек-листу + фотосъёмка с ключевого ракурса с людьми.\n4. Замены — через арт-директора с равным по эффекту вариантом; конфликты — паспортом; на монтаже — через шефа монтажа, не напрямую бригаде.\n5. Постмортем в течение недели: шесть критериев (по фото, обратной связи, контактам), что потерялось между рендером и стендом и почему, что в библиотеку и чек-лист, рекомендации клиенту на следующую выставку.\n6. Пример. Стенд 120 м²: паспорт передан в понедельник; ревью РД через неделю — доминанта в РД на 4,6 м вместо 5 (исправлено); образцы: RAL 5002 утверждён, ткань заменена на сертифицированную; сборка — стык фриза перенесён в теневой зазор; монтаж день 1 — подвес и каркас; приёмка — два прожектора перенаправлены; фото в 10:30 первого дня; постмортем: лайтбокс читался с 50 м, переговорная открытая оказалась шумной — в чек-лист.","formula":{"f":"паспорт = план + разрезы + ракурс + RAL/декоры + свет + «не менять» + приоритеты сокращения\nконтроль = ревью РД → образцы → контрольная сборка → монтаж д1 → приёмка + фото → постмортем","legend":[["паспорт","документ передачи концепции в РД","вместо догадок по рендеру"],["«не менять»","элементы под личный контроль","доминанта, свет, графика, касание"],["приоритеты","что резать первым при сокращении","экран → мебель → акцент → … → доминанта"],["точка контроля","дата в графике PM с присутствием арт-директора","5 точек"],["постмортем","разбор по шести критериям в течение недели","в библиотеку и чек-лист"]],"note":"PM отвечает за «вовремя и в бюджет», арт-директор — за «то, что продали»; спор решает паспорт, а не монтаж."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Роли: PM — сроки и бюджет, конструктор — РД, цех, шеф монтажа; арт-директор — соответствие идее.\n— Паспорт концепции — документ передачи: план, разрезы, ракурс, RAL, свет, «не менять», приоритеты сокращения.\n— Пять точек контроля в графике: ревью РД, образцы, контрольная сборка, первый день монтажа, приёмка с фото.\n— Замены — через арт-директора равным по эффекту; конфликты — паспортом; на монтаже — через шефа.\n— Постмортем по шести критериям в течение недели — в библиотеку и чек-лист.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Что ответить менеджеру, который просит не ездить в цех ради экономии времени?","o":["Согласиться: конструктор проверил РД, цех опытный, а разделение зон ответственности — это и есть процесс","Контрольная сборка — точка в графике: два часа в цеху дешевле ночи переделок на монтаже","Потребовать полную сборку всего стенда в цеху и перенос монтажа на три дня"],"a":1,"w":"Точка контроля закрывает класс потерь — стыки, свет, цвет."},{"q":"Что передаётся в РД вместо «рендеров в высоком разрешении»?","o":["Смета и договор с клиентом: высоты и цвета конструктор уточнит у дизайнера по ходу","Паспорт концепции: план, разрезы, ракурс, RAL, свет, «не менять», приоритеты","Презентация с комментариями клиента по слайдам как утверждённый документ"],"a":1,"w":"По рендеру размеры снимают с ошибкой."},{"q":"В формуле контроля зачем «приоритеты сокращения» в паспорте?","o":["Чтобы цех и конструктор знали, какие узлы делать первыми при сжатых сроках","Чтобы при урезании бюджета резали экран и мебель, а не доминанту и свет","Чтобы клиент заранее видел, на чём агентство готово экономить при торге"],"a":1,"w":"Сокращения случаются всегда; порядок защищает ядро."},{"q":"Бригада ставит доминанту ниже «иначе не влезает в подъёмник». Что делать?","o":["Согласиться: 30 см с 40 м не видно, а простой бригады стоит дороже","Через шефа монтажа найти решение: высота в списке «не менять»","Самому забраться на подъёмник и показать бригаде, как ставить"],"a":1,"w":"Защищать ядро через процесс, не командуя бригадой."}],"rules":["Роли: PM — сроки и бюджет, конструктор — РД, цех, шеф монтажа; арт-директор — соответствие идее.","Паспорт концепции — документ передачи: план, разрезы, ракурс, RAL, свет, «не менять», приоритеты сокращения.","Пять точек контроля в графике: ревью РД, образцы, контрольная сборка, первый день монтажа, приёмка с фото.","Замены — через арт-директора равным по эффекту; конфликты — паспортом; на монтаже — через шефа.","Постмортем по шести критериям в течение недели — в библиотеку и чек-лист."]}},{"id":"u6-1","level":"L6","title":"Тренды и насмотренность: выделяться среди конкурентов осознанно","lead":"Где смотреть, как анализировать площадку, как отстраиваться и как тренд входит в стиль компании","concept":"«Понимание современных архитектурных и дизайн-трендов» в вакансии — это не список модных слов, а умение объяснить, какой тренд решает какую задачу и чего он стоит. Тренды 2024–2026 на российских и европейских площадках: натяжная ткань и лайтбоксы вместо столярки (дёшево, легко, ярко, многоразово); LED-экраны — крупнее, прозрачные, гибкие, кинетические — но только с контентом и сценарием; минимум текста и «тихая роскошь» фасадов — одна фраза, много воздуха; природные материалы и зелень (мох, дерево, ткань) — тепло и устойчивость; иммерсивные демо-зоны (продукт в действии, VR/AR, интерактив) — удержание на стенде; повторно используемые модульные конструкции (re-use, аренда, экологичность — часть брифа крупных клиентов); спроектированные точки для фото; лаунжи и зарядки — удержание посетителей; архитектурные приёмы — порталы, навесы, перепады уровней, монохром с одним акцентом, «вырезы» и пустоты как форма. Источники насмотренности: главные выставки отрасли клиента (ходить ногами, фотографировать, записывать, что сработало), EuroShop и крупные международные выставки (сайты, отчёты, фотоотчёты), конкурсы стендов и премии дизайна (победители с описанием жюри), Behance/Pinterest по тегам exhibition stand, профильные телеграм-каналы и журналы, стенды конкурентов клиента на прошлых выставках. Анализ площадки до концепции: кто соседи, их высота и цвет, где доминанты зала, какой «шум» вокруг — отстраиваются контрастом (светлое среди тёмных, тихое среди кричащих, пустота среди заполненных), а не громкостью. Правило: тренд входит в проект через задачу клиента и стиль компании через принцип; «потому что модно» — не аргумент на тендере, «потому что ткань даёт ту же яркость за треть цены и монтируется за день» — аргумент.","points":[{"h":"Тренды и их задачи","t":"Ткань и лайтбоксы — яркость и скорость за меньшие деньги. Экраны прозрачные/гибкие — динамика без потери открытости, с контентом. Минимум текста — читаемость и статус. Зелень и дерево — тепло, экология, фото. Иммерсивные демо — удержание и память. Re-use — экономия на серии и экологичность в брифе. Точки для фото — охват в соцсетях. Лаунжи — время на стенде. Каждый тренд — ответ на задачу, не украшение."},{"h":"Источники насмотренности","t":"Выставки отрасли клиента ногами: фото, заметки «что сработало с 30 м и почему». EuroShop и международные выставки по отчётам. Конкурсы и премии стендов: смотреть победителей и формулировки жюри. Behance, Pinterest, профильные каналы — для форм и материалов. Стенды конкурентов клиента на прошлых выставках — для отстройки. Личная база: 200–300 фото с подписями «приём → задача → цена»."},{"h":"Анализ площадки и отстройка","t":"До концепции: план зала, соседи (высота, цвет, экраны), доминанты зала, поток. Отстройка — контрастом: светлое среди тёмного, спокойное среди кричащего, пустота среди заполненного, низкое и широкое среди башен — когда это выгодно. Громкость (выше, ярче, больше экранов) проигрывает бюджету и регламенту; контраст — бесплатен."},{"h":"Как тренд входит в стиль","t":"Через принцип: не «делаем всё из ткани», а «большие плоскости — ткань, зоны касания — честные материалы». Через задачу клиента: экран — если есть что показывать. Через проверку ценой: тренд, который удваивает смету без удвоения эффекта, — не для этого проекта. Обновление гайда стиля раз в год: что добавили, что убрали, почему; примеры «так/не так» с выставок."}],"practice":{"mechanic":"multi","points":3,"stem":"Выберите тренды, которые стоит применить на стенде 60 м² производителя косметики с бюджетом простого эксклюзива (30 тыс./м²).","options":[{"id":"o0","text":"Натяжная ткань и лайтбоксы для задника и фриза","correct":true,"rationale":"Яркость и фото за меньшие деньги."},{"id":"o1","text":"Зелень и дерево в зоне касания — стойка тестирования продукта","correct":true,"rationale":"Тон косметики и тепло на фото."},{"id":"o2","text":"Минимум текста: одно сообщение и логотип","correct":true,"rationale":"Бесплатно и статусно."},{"id":"o3","text":"Спроектированная точка для фото с продуктом и светом на лицах","correct":true,"rationale":"Охват в соцсетях — цель косметического бренда."},{"id":"o4","text":"LED-стена 12 м² на фасаде с рекламными роликами бренда в цикле","correct":false,"rationale":"Съест половину бюджета простого эксклюзива и закроет фасад."},{"id":"o5","text":"Двухуровневая конструкция с лаунжем и переговорной наверху","correct":false,"rationale":"На 60 м² и 30 тыс./м² невозможно."},{"id":"o6","text":"VR-зона с очками для погружения в производство продукта","correct":false,"rationale":"Дорого, очередь, не про тестирование продукта."},{"id":"o7","text":"Кинетический потолок из подвижных панелей над центральной зоной","correct":false,"rationale":"Подвес, инженер, бюджет ×2."}],"anchor":{"g":"quad","p":{"x":"стоимость","y":"эффект для косметики 60 м²","pts":[["ткань",0.2,0.8],["зелень",0.25,0.75],["фото-точка",0.1,0.8],["LED 12 м²",0.9,0.4],["VR",0.8,0.3]],"hl":0},"cap":"тренд — через задачу и бюджет"},"id":"u6-1-p"},"test":[{"mechanic":"single","points":2,"stem":"На тендере клиент спрашивает: «Почему у вас нет большого экрана, как у всех?» Ответ арт-директора?","options":[{"id":"o0","text":"Экран нужен при контенте и сценарии; здесь задача — тестирование: лайтбокс даёт яркость, деньги — в зону касания","correct":true,"rationale":"Тренд через задачу, с ценой."},{"id":"o1","text":"Добавить экран 8 м² на фасад: раз он есть у всех соседей, без него стенд прочитают как бедный, а контент клиент подготовит сам","correct":false,"rationale":"«Как у всех» — не аргумент; экран без контента — обои."},{"id":"o2","text":"Объяснить, что экраны — вчерашний тренд: EuroShop показал поворот к минимализму и тихой роскоши, экран сегодня удешевляет образ","correct":false,"rationale":"Мода — тоже не аргумент."},{"id":"o3","text":"Предложить экран как вариант Б по цене переговорной и ресепшн, чтобы клиент сам выбрал, что ему важнее за те же деньги","correct":false,"rationale":"Нужно обосновать отказ задачей, а не ценником."}],"anchor":{"g":"wording","p":{"bad":"экраны — вчерашний тренд","good":"экран — когда есть контент; у вас задача — тестирование, деньги — в зону касания"},"cap":"тренд через задачу"},"id":"u6-1-t0"},{"mechanic":"single","points":2,"stem":"Все соседи по ряду — тёмные стенды с LED-стенами высотой 5 м. Как отстроиться на 80 м² без подвеса?","options":[{"id":"o0","text":"Контрастом: светлый спокойный объём с большим лайтбоксом и пустотой — среди экранов выигрывает тишина","correct":true,"rationale":"Отстройка — контраст, не громкость."},{"id":"o1","text":"Поставить экран больше соседских — 6×3 м — и повысить яркость до 2000 нит, чтобы перебить ряд и собрать поток на себя","correct":false,"rationale":"Гонка громкости проигрывает бюджету."},{"id":"o2","text":"Запросить у организатора другое место в зале, где соседи тише: отстраиваться от пяти LED-стен подряд бессмысленно","correct":false,"rationale":"Место не меняют; работаем с контекстом."},{"id":"o3","text":"Повторить решение соседей — тёмный объём и LED-стена, но в фирменном цвете: ряд будет выглядеть цельно и дорого","correct":false,"rationale":"Цельный ряд — выгода организатору, не клиенту."}],"anchor":{"g":"compare","p":{"a":["соседи","тёмные, LED, 5 м"],"b":["мы","светлый, лайтбокс, воздух"],"verdict":"контраст бесплатен"},"cap":"отстройка контрастом"},"id":"u6-1-t1"},{"mechanic":"single","points":2,"stem":"Как арт-директору поддерживать насмотренность системно, а не «листать Pinterest»?","options":[{"id":"o0","text":"Ходить на выставки отраслей клиентов с заметками «приём → задача → цена», разбирать победителей конкурсов, вести базу","correct":true,"rationale":"Насмотренность — база с подписями, не лента картинок."},{"id":"o1","text":"Подписаться на все профильные каналы и Behance по тегу exhibition stand, сохранять понравившиеся рендеры в папки по стилям","correct":false,"rationale":"Рендеры без задачи и цены — вдохновение, не знание."},{"id":"o2","text":"Раз в год ездить на EuroShop и читать отчёты международных выставок — этого достаточно, локальные площадки вторичны","correct":false,"rationale":"Полезно, но локальные площадки и конкуренты клиентов важнее."},{"id":"o3","text":"Поручить насмотренность младшим дизайнерам: пусть собирают подборки по трендам и присылают дайджест раз в месяц","correct":false,"rationale":"Насмотренность не делегируется."}],"anchor":{"g":"pipeline","p":{"steps":["выставка ногами","фото + заметка","приём → задача → цена","база 300 примеров","гайд стиля"],"hl":[2,3]},"cap":"насмотренность — база с подписями"},"id":"u6-1-t2"},{"mechanic":"single","points":2,"stem":"Клиент из промышленности просит стенд «в стиле IT-стартапа: неон, глянец, яркие цвета». Что делать?","options":[{"id":"o0","text":"Проверить с задачей и брендом: промышленности тон технологичности дают металл, свет, точность — неон спорит с доверием","correct":true,"rationale":"Материал — тон голоса бренда; тренд через бренд."},{"id":"o1","text":"Сделать как просят: клиент платит и знает свою аудиторию, а неон и глянец на промышленной выставке — гарантированная отстройка","correct":false,"rationale":"Аудитория промышленного клиента покупает надёжность."},{"id":"o2","text":"Отказать: неон и глянец — язык ритейла, промышленности это противопоказано, и объяснить, что серьёзные бренды так не делают","correct":false,"rationale":"Не отказ, а разговор о тоне с аргументами."},{"id":"o3","text":"Сделать два стенда в одном: фасад и фото-зону в неоне для соцсетей, а переговорную и демо — в металле для инженеров","correct":false,"rationale":"Два тона на одном стенде — ни одного."}],"anchor":{"g":"tree","p":{"root":"тон бренда","kids":["дерево, ткань: тепло","металл, свет: технологии","неон, глянец: ритейл"]},"cap":"материал — тон, тренд — через бренд"},"id":"u6-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре стенда в ряду тёмных LED-соседей. Какой отстраивается контрастом и укладывается в простой эксклюзив?","vopts":[{"id":"v0","v":{"g":"elevv","p":{"h":4.5,"maxH":5,"logo":4,"note":"светлый, лайтбокс, воздух"}},"lbl":"","correct":true,"rationale":"Светлый объём с лайтбоксом среди тёмных экранов — контраст без подвеса и переплаты."},{"id":"v1","v":{"g":"elevv","p":{"h":5.8,"maxH":5,"logo":5.4,"note":"выше всех, LED 10 м²"}},"lbl":"","correct":false,"rationale":"Гонка громкости: сверх регламента и бюджета."},{"id":"v2","v":{"g":"elevv","p":{"h":2.5,"maxH":5,"logo":2,"note":"стандарт 2,5 м"}},"lbl":"","correct":false,"rationale":"Утонет между 5-метровыми соседями."},{"id":"v3","v":{"g":"elevv","p":{"h":4.5,"maxH":5,"logo":4,"solid":true,"note":"тёмный, как соседи"}},"lbl":"","correct":false,"rationale":"Повтор решения соседей — слился с рядом."}],"id":"u6-1-t4"}],"framework":"Тренды через задачу и цену: ткань и лайтбоксы, экраны с контентом, минимум текста, зелень, иммерсивные демо, re-use, точки для фото, лаунжи. Насмотренность — выставки ногами, конкурсы, база «приём → задача → цена». Отстройка на площадке — контрастом, не громкостью. Тренд входит в стиль через принцип, в проект — через бренд и задачу; «модно» — не аргумент.","anchor":{"g":"quad","p":{"x":"стоимость","y":"эффект","pts":[["ткань",0.2,0.8],["минимум текста",0.05,0.7],["зелень",0.3,0.6],["LED-стена",0.9,0.5],["второй этаж",0.95,0.6]],"hl":0},"cap":"тренд — ответ на задачу"},"layers":{"simple":"Тренд — это не «так сейчас модно», а «так сейчас решают задачу дешевле или сильнее». Ткань вместо столярки — та же яркость за треть цены. Экран — динамика, но только если есть что показать. Зелень и дерево — тепло и фотографии. Минимум текста — статус и читаемость.\nНасмотренность копится не в ленте картинок, а в базе с подписями: какой приём, какую задачу решил, сколько стоил. Её собирают ногами на выставках и из разборов конкурсов.\nНа площадке выделяются не громкостью, а контрастом: среди тёмных экранов выигрывает светлый тихий объём. И тренд входит в работу через задачу клиента и его бренд: промышленности — металл и свет, а не неон.\nПроверь себя: что ответить клиенту на вопрос «почему у вас нет большого экрана, как у всех»?","how":"1. Тренды 2024–2026 и их задачи: ткань и лайтбоксы (яркость, скорость, цена); LED прозрачные/гибкие (динамика с контентом); минимум текста (читаемость, статус); природные материалы и зелень (тепло, фото, экология); иммерсивные демо (удержание); re-use (экономия на серии); точки для фото (охват); лаунжи (время на стенде); порталы, навесы, пустоты, монохром с акцентом.\n2. Источники: выставки отрасли ногами (фото + «что сработало с 30 м»), EuroShop и международные по отчётам, конкурсы стендов и формулировки жюри, Behance/Pinterest/каналы для форм, стенды конкурентов клиента. База 200–300 примеров «приём → задача → цена».\n3. Анализ площадки до концепции: соседи (высота, цвет, экраны), доминанты зала, поток. Отстройка контрастом: светлое/тёмное, тихое/кричащее, пустота/заполненность, широкое/высокое.\n4. Тренд в проект — через задачу и бренд (экран, если есть контент; неон — не для промышленности); в стиль компании — через принцип; проверка ценой: удвоение сметы без удвоения эффекта — не сюда.\n5. Пример. Косметика, 60 м², 30 тыс./м²: ткань-лайтбокс задник 6×3, зелень и дерево на стойке тестирования, одно сообщение, точка для фото с продуктом и светом 4000 К на лицах; без экрана — деньги в зону касания. Соседи тёмные с LED — мы светлые.","formula":{"f":"тренд в проект = задача клиента × бренд × (эффект / цена)\nотстройка = контраст с соседями (свет · тишина · пустота · форма), не громкость","legend":[["задача","что тренд решает","яркость, удержание, фото, экономия"],["бренд","тон: тепло / технологии / ритейл","материал как голос"],["эффект/цена","тренд, удваивающий смету без удвоения эффекта, — не сюда","LED 12 м² на 60 м²"],["контраст","светлое среди тёмного, тихое среди кричащего","бесплатно"],["база","приём → задача → цена, 200–300 примеров","с выставок и конкурсов"]],"note":"«Потому что модно» — не аргумент; «ткань даёт ту же яркость за треть цены и монтируется за день» — аргумент."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Тренд — ответ на задачу и цену: ткань, экраны с контентом, минимум текста, зелень, иммерсив, re-use, фото-точки.\n— Насмотренность — база «приём → задача → цена» с выставок ногами и разборов конкурсов.\n— Отстройка на площадке — контрастом с соседями, не громкостью.\n— Тренд входит в проект через задачу и бренд, в стиль компании — через принцип; «модно» — не аргумент.\n— Проверка ценой: удвоение сметы без удвоения эффекта — не для этого проекта.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Что ответить клиенту на «почему у вас нет большого экрана, как у всех»?","o":["Экраны — вчерашний тренд: EuroShop показал поворот к минимализму и тихой роскоши","Экран — при контенте и сценарии; здесь задача — тестирование, деньги в зону касания","Добавить экран 8 м² на фасад, раз он есть у всех соседей — без него стенд прочитают как бедный"],"a":1,"w":"Тренд через задачу, с ценой."},{"q":"Соседи — тёмные стенды с LED 5 м. Как отстроиться?","o":["Экран больше соседских и ярче — до 2000 нит, чтобы перебить ряд","Контрастом: светлый спокойный объём с лайтбоксом и воздухом","Повторить решение соседей в фирменном цвете — ряд будет цельным"],"a":1,"w":"Контраст бесплатен, громкость проигрывает бюджету."},{"q":"В формуле «тренд в проект» зачем множитель «бренд»?","o":["Чтобы использовать фирменные цвета клиента в светодиодной подсветке фасада","Материал и приём — тон голоса: промышленности металл и свет, не неон","Чтобы клиент подписал бренд-гайд до тендера и не менял палитру после защиты"],"a":1,"w":"Тренд, спорящий с тоном бренда, разрушает доверие."},{"q":"Как копить насмотренность системно?","o":["Сохранять понравившиеся рендеры из профильных каналов в папки по стилям","База примеров с выставок и конкурсов: приём → задача → цена","Раз в год ездить на EuroShop и читать отчёты международных выставок"],"a":1,"w":"Картинка без задачи и цены — вдохновение, не знание."}],"rules":["Тренд — ответ на задачу и цену: ткань, экраны с контентом, минимум текста, зелень, иммерсив, re-use, фото-точки.","Насмотренность — база «приём → задача → цена» с выставок ногами и разборов конкурсов.","Отстройка на площадке — контрастом с соседями, не громкостью.","Тренд входит в проект через задачу и бренд, в стиль компании — через принцип; «модно» — не аргумент.","Проверка ценой: удвоение сметы без удвоения эффекта — не для этого проекта."]}},{"id":"u6-2","level":"L6","title":"Портфолио, награды, собеседование: продать себя как дизайн, который продаётся","lead":"Структура кейса, реализованные проекты против рендеров, конкурсы, вопросы на собеседовании, тестовое задание","concept":"Арт-директора нанимают по портфолио реализованных проектов, а не по рендерам: вакансия прямо требует «наличие реализованных проектов обязательно» и «большой плюс — награды». Портфолио — 6–10 кейсов, каждый по структуре: задача клиента и цифры брифа (площадь, тип, бюджетная категория, цель) → идея одной фразой → план и ключевой ракурс → фото реализованного стенда с людьми (а не рендер) → результат (контакты, отзыв, награда, повторный заказ) → что сделал бы иначе. Крупные и сложные проекты — вперёд (от 100 м², островные, двухэтажные, с подвесом и экранами); рендеры нереализованных — отдельным разделом «концепции» или не показывать. Награды: отраслевые конкурсы стендов при крупных выставках и премии дизайна — участвовать стоит, заявка требует фото, описания задачи и решения (та же структура кейса); награда — аргумент на тендере и в резюме. Собеседование на арт-директора — три блока: кейсы (расскажите о сложном проекте: задача → решение → реализация → результат → ошибки), экспертиза (вопросы про материалы, регламент, смету, свет — отвечать цифрами из курса), руководство (как ревьюите, как решаете конфликт с PM, как защищаете идею перед клиентом). Тестовое задание — концепция за 2–3 дня: показать бриф с допущениями, план с траекторией, объём с ракурса 1,6 м, шесть критериев с цифрами, цену за м², реализуемость — 6–8 слайдов. Вопросы работодателю: кто в команде и кто чертит РД, есть ли свой цех, сколько проектов в месяц, как принимаются решения по замене материалов, кто ездит на монтаж, есть ли библиотека узлов. Красные флаги для кандидата: «арт-директор рисует рендеры сам на все проекты», «монтаж — не ваша зона», «клиент всегда прав по правкам». Формула самопрезентации за минуту: «Я проектирую стенды, которые продаются: за N лет — M реализованных проектов от 36 до 400 м², из них K с наградами; мой метод — план от траектории, одна доминанта, свет как форма, контроль идеи до фото; вот три кейса».","points":[{"h":"Структура кейса в портфолио","t":"Задача и цифры (площадь, тип, категория бюджета, цель) → идея фразой → план и ракурс → фото реализации с людьми → результат (контакты, отзыв, повтор, награда) → что иначе. 6–10 кейсов, крупные и сложные вперёд, рендеры нереализованных — отдельно. Фото — профессиональные, с ключевого ракурса, при полном свете; поэтому фотосъёмка — часть каждого проекта."},{"h":"Награды и конкурсы","t":"Конкурсы стендов при крупных выставках, премии дизайна и выставочной индустрии: заявка = фото + задача + решение + результат. Участвовать с лучшими 1–2 проектами в год; награда — строка в резюме, аргумент на тендере, повод для клиента. Жюри оценивает соответствие задаче, оригинальность, реализацию — те же критерии, что у клиента."},{"h":"Три блока собеседования","t":"Кейсы: сложный проект по структуре, ошибки и выводы — честно. Экспертиза: материалы и сроки, регламент площадки, смета и цена за м², свет и читаемость в цифрах, LED и шаг пикселя, подвес и нагрузки. Руководство: ревью по чек-листу, обратная связь, конфликт с PM через паспорт, защита идеи перед клиентом цифрами, что резать первым. Отвечать цифрами и примерами, признавать границы («не считаю сварные швы — привлекаю конструктора»)."},{"h":"Тестовое задание и вопросы работодателю","t":"Тестовое — тендер в миниатюре: бриф с допущениями → план → ракурс 1,6 м → шесть критериев с цифрами → ₽/м² → реализуемость и сроки; 6–8 слайдов за 2–3 дня, не 20 рендеров. Вопросы работодателю: команда и роли, свой цех, число проектов, решения по заменам, кто на монтаже, библиотека узлов, типичный бюджет и площадь. Красные флаги: рендеры «на всё» лично, монтаж «не ваша зона», правки без ограничений."}],"practice":{"mechanic":"ranking","points":3,"stem":"Расставьте блоки кейса в портфолио в правильном порядке.","options":[{"id":"r0","text":"Задача клиента и цифры: площадь, тип, бюджетная категория, цель","why":"Контекст до картинки."},{"id":"r1","text":"Идея одной фразой и план с траекторией","why":"Решение — сначала план."},{"id":"r2","text":"Ключевой ракурс: рендер и фото реализации рядом","why":"Доказательство, что идея доехала."},{"id":"r3","text":"Фото стенда с людьми, при полном свете","why":"Реализованный проект — главный аргумент."},{"id":"r4","text":"Результат: контакты, отзыв, повтор, награда","why":"Эффект в цифрах."},{"id":"r5","text":"Что сделал бы иначе","why":"Зрелость и честность."}],"solution":"Задача → идея и план → ракурс и реализация → фото → результат → выводы.","anchor":{"g":"pipeline","p":{"steps":["задача","идея + план","ракурс","фото","результат","иначе"],"hl":[3,4]},"cap":"кейс — доказательство, что идея доехала"},"id":"u6-2-p"},"test":[{"mechanic":"single","points":2,"stem":"В портфолио кандидата 25 рендеров и три фотографии стендов. Что увидит нанимающий арт-директор?","options":[{"id":"o0","text":"Что реализованных проектов мало или они не стоят показа; вакансия требует реализованное — фото вперёд, рендеры отдельно","correct":true,"rationale":"Реализация — главный аргумент."},{"id":"o1","text":"Сильного визуализатора: 25 качественных рендеров — редкость, а арт-директор, который сам рисует на таком уровне, экономит агентству ставку","correct":false,"rationale":"Нанимают арт-директора, не визуализатора."},{"id":"o2","text":"Широту стиля и богатый опыт тендеров: 25 концепций — это 25 брифов, презентаций и защит, которые стоят дороже трёх монтажей","correct":false,"rationale":"Тендеры без побед — не опыт."},{"id":"o3","text":"Ничего особенного: соотношение рендеров и фото в портфолио не имеет значения, смотрят на качество идеи и подачу каждого кейса","correct":false,"rationale":"Имеет: «реализованные обязательно»."}],"anchor":{"g":"compare","p":{"a":["25 рендеров","обещания"],"b":["8 фото стендов","доказательства"],"verdict":"реализованное вперёд"},"cap":"портфолио — реализованные проекты"},"id":"u6-2-t0"},{"mechanic":"single","points":2,"stem":"На собеседовании: «Расскажите о проекте, где вы ошиблись». Какой ответ сильный?","options":[{"id":"o0","text":"Конкретный кейс: что обещали, что потерялось (краска не высохла, лого ушло ниже), почему и что изменили — образцы, контрольная сборка","correct":true,"rationale":"Ошибка + системный вывод = зрелость."},{"id":"o1","text":"«Серьёзных ошибок не было: мы контролируем качество на всех этапах — от образцов до монтажа, поэтому идея всегда доезжает до готового стенда»","correct":false,"rationale":"Неправдоподобно и без выводов."},{"id":"o2","text":"Ошибка клиента, который за пять недель до выставки урезал бюджет на 40% и испортил концепцию: без доминанты и света стенд потерялся в ряду","correct":false,"rationale":"Перекладывание ответственности."},{"id":"o3","text":"Ошибка в выборе шрифта на одном из стендов — кегль фриза оказался на 2 см меньше нормы, но никто из посетителей и клиент этого не заметили","correct":false,"rationale":"Мелочь вместо настоящего разбора."}],"anchor":{"g":"wording","p":{"bad":"серьёзных ошибок не было","good":"краска не высохла, лого ушло на 3,2 м; ввели образцы и контрольную сборку"},"cap":"ошибка + вывод"},"id":"u6-2-t1"},{"mechanic":"single","points":2,"stem":"Тестовое задание: концепция стенда 80 м² за три дня. Что покажет арт-директорский подход, а не дизайнерский?","options":[{"id":"o0","text":"Бриф с допущениями, план с траекторией, ракурс с высоты глаз, шесть критериев с цифрами, цена за м², риски — 6–8 слайдов","correct":true,"rationale":"Тестовое — тендер в миниатюре."},{"id":"o1","text":"Три стилистически разных концепции с рендерами с нескольких ракурсов, чтобы показать диапазон и дать работодателю выбрать направление","correct":false,"rationale":"Диапазон без позиции."},{"id":"o2","text":"Один идеальный рендер в 8K с ночным светом и мудборд материалов: качество картинки — это то, что продаёт концепцию на тендере","correct":false,"rationale":"Картинка без плана и аргументов."},{"id":"o3","text":"Подробная РД с узлами, спецификацией и раскладкой листов — доказательство техничности, которой у дизайнеров обычно не хватает","correct":false,"rationale":"Не задача концепции."}],"anchor":{"g":"pipeline","p":{"steps":["бриф + допущения","план","ракурс 1,6 м","6 критериев","₽/м²","риски"],"hl":[1,3,4]},"cap":"6–8 слайдов, не 20 рендеров"},"id":"u6-2-t2"},{"mechanic":"single","points":2,"stem":"Какой вопрос работодателю выявит, сможете ли вы контролировать идею до монтажа?","options":[{"id":"o0","text":"Кто решает о замене материала в цеху и ездит ли арт-директор на контрольную сборку и монтаж","correct":true,"rationale":"Прямо проверяет процесс сохранения идеи."},{"id":"o1","text":"Сколько рендеров в месяц ожидается от арт-директора лично и какой срок даётся на концепцию — это и есть нагрузка на идею","correct":false,"rationale":"Важно, но про загрузку, не про идею."},{"id":"o2","text":"Какая версия 3ds Max и какой рендер-движок используются в агентстве: без единого пайплайна визуализации идею не удержать","correct":false,"rationale":"Инструмент, не процесс."},{"id":"o3","text":"Сколько дизайнеров в команде и какой у них стаж: сильная команда сама сохранит идею, слабая потеряет при любом процессе","correct":false,"rationale":"Команда — важно, но не про контроль идеи."}],"anchor":{"g":"tree","p":{"root":"вопросы работодателю","kids":["кто решает замены","монтаж и сборка","свой цех","библиотека узлов","число проектов"]},"cap":"проверить процесс, не только зарплату"},"id":"u6-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре структуры самопрезентации за минуту. Какая продаёт арт-директора «дизайна, который продаётся»?","vopts":[{"id":"v0","v":{"g":"treev","p":{"root":"я проектирую стенды, которые продаются","kids":["M реализованных","метод","3 кейса"],"ok":true}},"lbl":"","correct":true,"rationale":"Результат, метод, доказательства."},{"id":"v1","v":{"g":"treev","p":{"root":"я дизайнер с 10-летним опытом","kids":["3ds Max","Corona","Photoshop"],"ok":false}},"lbl":"","correct":false,"rationale":"Инструменты вместо результата."},{"id":"v2","v":{"g":"treev","p":{"root":"я люблю красивые стенды","kids":["вдохновение","тренды","стиль"],"ok":false}},"lbl":"","correct":false,"rationale":"Прилагательные без цифр."},{"id":"v3","v":{"g":"treev","p":{"root":"я работал в пяти агентствах","kids":["агентство 1","агентство 2","…"],"ok":false}},"lbl":"","correct":false,"rationale":"Биография вместо ценности."}],"id":"u6-2-t4"}],"framework":"Портфолио: 6–10 кейсов (задача → идея и план → ракурс → фото с людьми → результат → иначе), реализованное вперёд, рендеры отдельно; фотосъёмка — часть проекта. Награды — заявка по структуре кейса. Собеседование: кейсы, экспертиза цифрами, руководство. Тестовое — тендер в миниатюре, 6–8 слайдов. Вопросы работодателю про замены, монтаж, цех. Самопрезентация: результат → метод → три кейса.","anchor":{"g":"pipeline","p":{"steps":["кейсы","экспертиза","руководство","тестовое","вопросы"],"hl":[0,1,2]},"cap":"продать себя как дизайн, который продаётся"},"layers":{"simple":"Арт-директора нанимают по фотографиям построенных стендов, а не по рендерам. Портфолио — это шесть-десять историй по одной схеме: какая была задача, какая идея, как это выглядело на плане и с главной точки, фото с людьми, что получилось в цифрах и что сделал бы иначе.\nНа собеседовании спросят три вещи: расскажи кейс (включая ошибку), ответь на профессиональные вопросы цифрами (материалы, регламент, смета, свет) и покажи, как ты руководишь (ревью, конфликт с менеджером, защита идеи). Тестовое задание — маленький тендер: план, ракурс, аргументы, цена — а не двадцать рендеров.\nИ у тебя есть свои вопросы: кто решает замены в цеху, ездит ли арт-директор на монтаж, есть ли библиотека. Ответы покажут, сможешь ли ты там сохранять идею до стенда.\nПроверь себя: что покажет арт-директорский подход в тестовом задании?","how":"1. Портфолио: 6–10 кейсов по структуре задача → идея и план → ракурс (рендер + фото рядом) → фото с людьми при полном свете → результат (контакты, отзыв, повтор, награда) → что иначе. Крупные и сложные вперёд; рендеры нереализованных — отдельно или не показывать.\n2. Награды: конкурсы стендов при крупных выставках и премии дизайна; заявка = фото + задача + решение + результат; 1–2 лучших проекта в год.\n3. Собеседование: кейсы (сложный проект, ошибка с выводом), экспертиза (материалы и сроки, регламент, смета и ₽/м², свет и читаемость, LED, подвес — цифрами), руководство (чек-лист, обратная связь, паспорт и PM, защита идеи, приоритеты сокращения). Признавать границы: «не считаю швы — привлекаю конструктора».\n4. Тестовое: бриф с допущениями → план → ракурс 1,6 м → шесть критериев с цифрами → ₽/м² → реализуемость и риски; 6–8 слайдов за 2–3 дня.\n5. Вопросы работодателю: команда и роли, свой цех, число проектов, кто решает замены, кто на монтаже, библиотека узлов, типичный бюджет. Красные флаги: рендеры «на всё» сам, монтаж «не ваша зона», правки без границ.\n6. Самопрезентация за минуту: «Проектирую стенды, которые продаются: за N лет M реализованных от 36 до 400 м², K с наградами; метод — план от траектории, одна доминанта, свет как форма, контроль идеи до фото; три кейса — …».","formula":{"f":"кейс = задача (цифры) → идея + план → ракурс → фото с людьми → результат → что иначе\nсобеседование = кейсы + экспертиза (цифрами) + руководство   ·   тестовое = тендер в миниатюре (6–8 слайдов)","legend":[["фото","реализованный проект с людьми при полном свете","главный аргумент"],["результат","контакты, отзыв, повтор, награда","эффект в цифрах"],["экспертиза","материалы, регламент, смета, свет, LED, подвес","отвечать цифрами"],["руководство","чек-лист, обратная связь, паспорт, защита идеи","процесс, не вкус"],["вопросы","замены, монтаж, цех, библиотека","проверить процесс"]],"note":"Нанимают по доказательствам: фото стенда, цифры результата, метод. Рендеры — обещания."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Портфолио — 6–10 кейсов: задача → идея и план → ракурс → фото с людьми → результат → иначе; реализованное вперёд.\n— Фотосъёмка стенда — часть каждого проекта; награды — заявка по структуре кейса, 1–2 проекта в год.\n— Собеседование: кейсы с ошибкой и выводом, экспертиза цифрами, руководство через процесс.\n— Тестовое — тендер в миниатюре: план, ракурс, шесть критериев, ₽/м², риски — 6–8 слайдов.\n— Вопросы работодателю про замены, монтаж, цех, библиотеку; самопрезентация: результат → метод → три кейса.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Что покажет арт-директорский подход в тестовом задании?","o":["Три стилистически разных концепции с рендерами с трёх ракурсов — показать диапазон","План с траекторией, ракурс 1,6 м, шесть критериев с цифрами, ₽/м² — 6–8 слайдов","Подробная рабочая документация с узлами и спецификацией — доказать техничность"],"a":1,"w":"Тестовое — тендер в миниатюре, не демонстрация рендера."},{"q":"В портфолио 25 рендеров и 3 фото. Что сделать?","o":["Оставить как есть: рендеры показывают широту стиля и опыт тендеров","Фото реализованных вперёд, рендеры нереализованных — отдельно","Убрать фото: они хуже по качеству, чем рендеры, и портят подачу"],"a":1,"w":"Вакансия: реализованные обязательно."},{"q":"В формуле собеседования зачем блок «руководство»?","o":["Чтобы проверить, умеет ли кандидат работать в 3ds Max быстрее любого дизайнера команды","Арт-директор отвечает за все концепции и сохранение идеи через процесс","Чтобы понять, сколько человек кандидат готов уволить в первый месяц работы"],"a":1,"w":"Ревью, обратная связь, паспорт, защита идеи — процесс, не вкус."},{"q":"Какой вопрос работодателю важнее всего?","o":["Какая версия рендер-движка и сколько рабочих станций с 3ds Max в агентстве","Кто решает замены материалов и ездит ли арт-директор на сборку и монтаж","Сколько дней отпуска, есть ли ДМС и как начисляется премия за выигранные тендеры"],"a":1,"w":"Проверяет, сможете ли сохранить идею до стенда."}],"rules":["Портфолио — 6–10 кейсов: задача → идея и план → ракурс → фото с людьми → результат → иначе; реализованное вперёд.","Фотосъёмка стенда — часть каждого проекта; награды — заявка по структуре кейса, 1–2 проекта в год.","Собеседование: кейсы с ошибкой и выводом, экспертиза цифрами, руководство через процесс.","Тестовое — тендер в миниатюре: план, ракурс, шесть критериев, ₽/м², риски — 6–8 слайдов.","Вопросы работодателю про замены, монтаж, цех, библиотеку; самопрезентация: результат → метод → три кейса."]}}],"TERMS":[{"name":"Линейный стенд","level":"L0","def":"Стенд с одной открытой стороной в проход; задняя и две боковые стены обязательны, вся коммуникация — на фасаде.","rdef":"Стенд с одной открытой стороной в проход; три стены обязательны.","when":"Планировка малых площадей и чтение плана павильона.","ex":"9×4 м у стены павильона: фасад — витрина, лого на фризе, ресепшн сбоку от входа. Не путать: угловой (две стороны), полуостров (три), островной (четыре).","near":[{"t":"Стенд с одной открытой стороной в проход; задняя стена обязательна, боковые можно не ставить, если соседи согласны.","why":"Боковые стены у линейного обязательны по регламенту: они граница с соседями."},{"t":"Стенд, вытянутый вдоль прохода с открытой длинной стороной и двумя входами по краям для разделения потоков.","why":"Входы по краям — ошибка: вход в центре фасада, а форма не определяет тип."}],"nb":[{"t":"Угловой стенд","d":"Стенд с двумя открытыми сторонами на пересечении проходов; диагональный вход, задняя и одна боковая стена.","why":"Угловой — две стороны, линейный — одна."},{"t":"Островной стенд","d":"Стенд с четырьмя открытыми сторонами, без глухих стен; виден отовсюду, подсобку прячут в центр.","why":"У островного стен нет вовсе."}],"apps":{"ok":"На плане стенд 9×4 вдоль стены павильона: дизайнер делает фасад витриной и ставит стойку сбоку от входа.","okWhy":"Одна открытая сторона — одна витрина; вход в центре, стойка сбоку.","bad":[{"t":"Дизайнер убирает боковые стены линейного стенда 9×4, чтобы «раскрыть» его на соседей и визуально выглядеть на 20 м² больше","why":"Боковые стены — граница с соседями, их не убирают."},{"t":"Для линейного стенда 9×4 делают два входа по краям фасада и стойку по центру, чтобы менеджер встречал поток с обеих сторон","why":"Стойка по центру — барьер; вход — в центре."},{"t":"Клиенту с линейным стендом обещают, что доминанту увидят с четырёх сторон павильона, как у островного за те же деньги","why":"У линейного одна открытая сторона — один ракурс."}]},"simple":"Витрина с одной стороны, три стены — как магазин в торговом ряду.","remember":"Один фасад — всё на него."},{"name":"Островной стенд","level":"L0","def":"Стенд с четырьмя открытыми сторонами, окружённый проходами; нет глухих стен, доминанта должна читаться с любого ракурса, подсобка прячется в ядро.","rdef":"Стенд с четырьмя открытыми сторонами, без глухих стен.","when":"Крупные площади от 100 м², центр павильона.","ex":"200 м² в центре зала: доминанта-портал в середине, подсобка в её ядре, переговорные внутри кольца, ресепшн у двух главных потоков. Не путать с полуостровом (три стороны, есть спина).","near":[{"t":"Стенд с четырьмя открытыми сторонами; глухие стены допускаются по двум из них для графики без согласования с площадкой.","why":"Глухие стены на открытые стороны — только по согласованию; у островного их нет по определению."},{"t":"Стенд с тремя открытыми сторонами и одной задней стеной, стоящий на пересечении двух главных проходов.","why":"Три стороны — полуостров; островной — четыре."}],"nb":[{"t":"Полуостров","d":"Стенд с тремя открытыми сторонами и одной глухой задней стеной — опорой для доминанты и подсобки.","why":"У полуострова есть спина, у островного — нет."},{"t":"Доминанта","d":"Единственный элемент композиции, держащий силуэт и несущий логотип; высота — верхняя треть лимита.","why":"Доминанта у островного читается с четырёх сторон, но это элемент, а не тип стенда."}],"apps":{"ok":"На островном стенде 150 м² подсобку делают в ядре доминанты, а ресепшн — у двух главных проходов.","okWhy":"Нет спины — невидим только центр; витрины везде.","bad":[{"t":"Подсобку островного стенда ставят в угол, ближайший к служебному проходу, чтобы удобнее заносить воду","why":"Углы островного просматриваются отовсюду."},{"t":"Островной стенд застраивают глухой стеной с двух сторон, чтобы повесить графику и сэкономить","why":"Открытые стороны — витрины; глухие — по согласованию и теряют смысл островного."},{"t":"Рендер островного стенда делают с одного ракурса: остальные стороны «такие же»","why":"Четыре стороны — четыре ракурса; доминанта проверяется с каждого."}]},"simple":"Остров посреди прохода: видно со всех сторон, спрятаться негде.","remember":"Четыре витрины, подсобка в ядре."},{"name":"Стандартная застройка","level":"L0","def":"Сборные профильные панели высотой 2,5 м, ковролин, фриз с названием, прожекторы — пакет организатора, монтируется за часы; дёшево, но не выделяет.","rdef":"Сборные профильные панели 2,5 м, ковролин, фриз — пакет организатора.","when":"Малые бюджеты и площади, быстрые участия.","ex":"Пакет: стены 2,5 м Octanorm, серый ковролин, фриз 30 см с названием, прожектор на 3 м², стол и два стула — 4–6 тыс. ₽/м². Улучшенный стандарт: лайтбокс-фриз, печать на панелях, свой свет.","near":[{"t":"Сборные профильные панели 2,5 м, ковролин, фриз — проект застройщика под клиента по индивидуальным чертежам.","why":"Индивидуальный проект — это эксклюзив; стандарт — пакет организатора."},{"t":"Сборные панели высотой до 5 м с окраской и графикой, собранные из модульной системы агентства.","why":"Окраска и 5 м — уже эксклюзив на модульном каркасе."}],"nb":[{"t":"Эксклюзивная застройка","d":"Индивидуальный проект стенда: столярные и металлические конструкции, свет, графика, высота до регламента; 25–80 тыс. ₽/м².","why":"Эксклюзив — производство под задачу, стандарт — аренда панелей."},{"t":"Профильная система","d":"Алюминиевые модульные конструкции (Octanorm, Maxima, ферма) для стандартных стендов, каркасов под ткань и световых порталов.","why":"Профиль — материал стандарта, а не сам пакет."}],"apps":{"ok":"Клиенту с 18 м² и бюджетом 400 тыс. предлагают улучшенный стандарт: фриз-лайтбокс, печать на панелях, свой свет.","okWhy":"Стандарт — аренда готового; улучшить дёшево, превратить в эксклюзив — нет.","bad":[{"t":"Для стенда 150 м² на ключевой выставке клиент берёт стандартный пак  LED-стеной за 400 тыс. ₽: клиенту обещают, что цех уложится, если убрать мебель","why":"22 тыс./м² — не эксклюзив с подвесом и экраном."},{"t":"Эксклюзивом называют стандарт с печатью на панелях, чтобы поднять цену в смете до 15 тыс./м² и назвать это «индивидуальным проектом»","why":"Это улучшенный стандарт."},{"t":"Сроки эксклюзива планируют как у стандарта: монтаж за день, производство за неделю, потому что «цех у нас быстрый»","why":"Эксклюзив — 3–5 недель цеха и 2–3 дня монтажа."}]},"simple":"Стенд, построенный под клиента, как дом по проекту.","remember":"Под задачу; 25 / 45 / 80 тыс. за м²."},{"name":"Бриф","level":"L0","def":"Структурированный разговор с клиентом до эскиза: цель и KPI, аудитория, экспонаты, люди и зоны, бюджет-вилка, площадка и план, бренд и история.","rdef":"Разговор с клиентом до эскиза: цель, аудитория, экспонаты, зоны, бюджет, план, бренд.","when":"Старт любого проекта и тестового задания.","ex":"Бриф: 150 контактов и 10 переговоров, экспонат 400 кг с электрикой 3 кВт, 6 менеджеров, 2–2,5 млн на 60 м², полуостров у центрального прохода, гайд есть. Ответы отправлены клиенту на подтверждение в тот же день.","near":[{"t":"Структурированный разговор с клиентом после презентации концепции: что понравилось, что изменить, какие сроки и бюджет.","why":"Это сбор правок; бриф — до эскиза."},{"t":"Структурированный документ, который клиент заполняет сам без участия арт-директора и присылает с заявкой на тендер.","why":"Бриф — разговор с вопросами арт-директора; анкета без диалога оставляет дыры."}],"nb":[{"t":"Техническое задание","d":"Подписанный клиентом документ: площадь и тип, зоны, экспонаты, сообщение, бюджет, сроки, регламент, число вариантов и правок.","why":"ТЗ — результат брифа, зафиксированный подписью."},{"t":"План павильона","d":"Схема зала с проходами, входами, соседями, колоннами и люками; источник ключевого ракурса.","why":"План — один из входов брифа, не сам бриф."}],"apps":{"ok":"Перед эскизом арт-директор задаёт семь вопросов и в ,{"t":"Паспорт концепции","d":"Документ передачи утверждённой концепции в РД: план, разрезы, ракурс, RAL, свет, список «не менять», приоритеты сокращения.","why":"Паспорт — после концепции; ТЗ — до неё."}],"apps":{"ok":"ТЗ фиксирует две концепции и две итерации правок; третья итерация — доплата по договору.","okWhy":"ТЗ подписывает клиент; правки конечны.","bad":[{"t":"ТЗ пишут после презентации, чтобы точнее описать выбранную концепцию и не переписывать его дважды","why":"ТЗ — до концепции, иначе нечем защищаться."},{"t":"В ТЗ не указывают регламент площадки: это забота проектного менеджера, а не часть задания на дизайн","why":"Высота и подвес ограничивают концепцию — в ТЗ обязательно."},{"t":"Число правок в ТЗ считают формальностью юристов и не ограничивают: «хороший клиент не будет злоупотреблять»","why":"Без лимита правок проект не заканчивается."}]},"simple":"Контракт на концепцию: что рисуем, за сколько, сколько раз переделываем.","remember":"Площадь · зоны · сообщение · бюджет · сроки · варианты × правки."},{"name":"План павильона","level":"L0","def":"Схема выставочного зала с проходами, входами, номерами стендов, соседями, колоннами, люками и ограничениями по высоте; читается до эскиза ради ключевого ракурса.","rdef":"Схема зала: проходы, входы, соседи, колонны, люки, ограничения по высоте.","when":"Перед концепцией и при разборе отстройки от соседей.","ex":"Стенд у входа, слева сосед 6 м, справа проход: доминанту и ключевой ракурс развернули на вход и проход, левую сторону отдали под подсобку.","near":[{"t":"Схема зала с проходами, входами и соседями, которую организатор присылает после утверждения проекта застройки.","why":"План нужен до эскиза; организатор даёт его при бронировании."},{"t":"Схема расстановки зон внутри стенда с размерами, траекторией посетителя и доминантой.","why":"Это план стенда (планировка), а не павильона."}],"nb":[{"t":"Ключевой ракурс","d":"Точка на плане павильона, с которой посетитель впервые видит стенд; на неё работают доминанта и главная графика.","why":"Ракурс выводится из плана павильона."},{"t":"Зонирование","d":"Распределение площади стенда по зонам: ресепшн, демо, переговорные, подсобка, бар — по нормам и траектории.","why":"Зонирование — внутри стенда, план павильона — вокруг него."}],"apps":{"ok":"На плане павильона рисуют стрелки потока от входа и отмечают соседа 6 м — отсюда ключевой ракурс концепции.","okWhy":"Поток, соседи, колонны, высота — до эскиза.","bad":[{"t":"План павильона запрашивают после согласования концепции, чтобы «не ограничивать идею» и не отвлекать дизайнера колоннами","why":"Без плана ракурс и доминанта — наугад."},{"t":"На плане смотрят только номер стенда и площадь, остальное «увидим на монтаже» — проходы всё равно переставляют перед открытием","why":"Соседи и колонны меняют композицию."},{"t":"Высокого соседа 6 м игнорируют: «наш стенд всё равно будет ярче», а стороны стенда делают одинаковыми для симметрии","why":"Сосед 6 м глушит сторону — её отдают под подсобку."}]},"simple":"Карта местности перед строительством: откуда идут люди и кто рядом.","remember":"Откуда поток и кто соседи."},{"name":"Зонирование","level":"L1","def":"Распределение площади стенда по зонам (ресепшн, демо, открытые и закрытые переговорные, подсобка, бар, сцена) по нормам площади и траектории посетителя; воздух — 30–40%.","rdef":"Распределение площади по зонам по нормам и траектории; воздух 30–40%.","when":"Планировка любого стенда.","ex":"120 м²: ресепшн 8, демо 30, две закрытые по 10, открытая 8, подсобка 7, воздух 47 (39%). Нормы: менеджер 8–12 м², открытая переговорная 6–8, закрытая от 9, подсобка 4–8%.","near":[{"t":"Распределение площади стенда по зонам по нормам и траектории; воздух — не более 10%, чтобы не терять полезную площадь.","why":"Воздух — 30–40%: проходы ≥ 1,2 м и толпа у демо."},{"t":"Распределение площади по зонам, при котором закрытые переговорные ставят у открытой стороны для доступности гостей.","why":"Закрытые — в глубине; у витрины — ресепшн и демо."}],"nb":[{"t":"Траектория посетителя","d":"Путь человека по стенду: вход в центре открытой стороны → ресепшн сбоку → экспонат → переговорные; проверяется пальцем по плану.","why":"Траектория — сценарий, зонирование — расстановка под сценарий."},{"t":"Подсобка","d":"Служебное помещение 4–8% площади, минимум 2×1,5 м, дверью не на фасад; у островного — в ядре.","why":"Подсобка — одна из зон."}],"apps":{"ok":"На 36 м² одна закрытая переговорная и одна открытая: две закрытые по 9 съели бы половину стенда.","okWhy":"Зоны по нормам, воздух ≥ 30%; тесно — убирай зону.","bad":[{"t":"Чтобы уместить всё, проходы между зонами сужают до 0,8 м","why":"Проходы ≥ 1,2 м; тесно — убирать зону."},{"t":"Переговорные с панорамным остеклением ставят на главный проход, чтобы было видно, что идут переговоры","why":"В них заглядывают; стекло — внутрь."},{"t":"Зоны расставляют по рендеру, а не по плану: главное — вид с ракурса","why":"Зонирование решается на плане, рендер после."}]},"simple":"Квартира для трёхсот гостей в день: прихожая, гостиная, кабинеты, кладовка.","remember":"Нормы + траектория + воздух 30–40%."},{"name":"Траектория посетителя","level":"L1","def":"Путь человека по стенду от прохода до переговорной: вход в центре открытой стороны → ресепшн сбоку → экспонат-магнит → открытые переговорные → закрытые; проверяется пальцем по плану.","rdef":"Путь посетителя по стенду от прохода до переговорной; проверяется пальцем по плану.","when":"Проверка любой планировки и презентация клиенту.","ex":"Пальцем по плану: с прохода в центр фасада → стойка справа → экспонат обходится с трёх сторон → открытая переговорная → закрытая у спины; нигде не упираемся.","near":[{"t":"Путь посетителя по стенду, который начинается у стойки ресепшн, перегораживающей вход, чтобы никто не прошёл мимо менеджера.","why":"Стойка поперёк входа — барьер; траектория начинается у открытого входа."},{"t":"Путь посетителя по павильону от входа до стенда клиента, который задаёт ключевой ракурс.","why":"Это поток павильона; траектория — внутри стенда."}],"nb":[{"t":"Зонирование","d":"Распределение площади стенда по зонам по нормам и траектории; воздух 30–40%.","why":"Зонирование — расстановка, траектория — проверка расстановки."},{"t":"Ключевой ракурс","d":"Точка на плане павильона, с которой посетитель впервые видит стенд.","why":"Ракурс — снаружи, траектория — внутри."}],"apps":{"ok":"Презентуя план, арт-директор проводит пальцем путь посетителя: вход, стойка, экспонат, переговорная — не упираясь.","okWhy":"Пройти план пальцем до того, как рисовать фасад.","bad":[{"t":"Траекторию проверяют по рендеру: если стенд выглядит открытым и просторным с ракурса, значит пройти можно и упираться некуда","why":"Рендер скрывает тупики; проверка — на плане."},{"t":"Экспонат ставят вплотную к задней стене, чтобы освободить центр для прохода и сделать стенд визуально больше","why":"Экспонат — магнит, его обходят с трёх сторон."},{"t":"Вход делают на углу стенда, где сталкиваются два потока прохода, — так посетителей зайдёт вдвое больше","why":"Вход — в центре открытой стороны."}]},"simple":"Дорожка, по которой гость идёт от прохода до стула в переговорной.","remember":"Вход → стойка сбоку → экспонат → переговорные."},{"name":"Доминанта","level":"L1","def":"Единственный элемент композиции, держащий силуэт стенда и несущий логотип; высота — верхняя треть лимита (при 5 м — 3,8–4,5 м); второй акцент — вдвое ниже и другой формы.","rdef":"Единственный элемент, держащий силуэт и несущий логотип; верхняя треть лимита.","when":"Любой эксклюзив; главный аргумент заметности.","ex":"Портал 5 м с логотипом на 4,3 м у левого угла полуострова, читается от входа с 45 м; стены 3,5 м, навес 2,8 — три уровня ритма. Три равные башни — забор.","near":[{"t":"Единственный элемент композиции, держащий силуэт и несущий логотип; высота — на уровне глаз 1,6–2 м, чтобы читался вблизи.","why":"Ниже 2,5 м всё закрыто людьми; доминанта — в верхней трети."},{"t":"Самый дорогой элемент стенда, на который уходит до половины сметы конструктива, обычно металлическая башня.","why":"Доминанта — функция в композиции, а не статья затрат; может быть лайтбоксом."}],"nb":[{"t":"Ключевой ракурс","d":"Точка на плане павильона, с которой посетитель впервые видит стенд; на неё работают доминанта и главная графика.","why":"Ракурс — куда направлена доминанта."},{"t":"Лайтбокс","d":"Натяжная ткань на алюминиевом профиле с LED-подсветкой; дешёвая большая яркая плоскость, виден с 40 м.","why":"Лайтбокс может быть доминантой, но не обязательно."}],"apps":{"ok":"Дизайнеру с тремя равными башнями арт-директор оставляет одну и делает второй акцент вдвое ниже и другой формы.","okWhy":"Одна; верхняя треть; логотип на ней.","bad":[{"t":"Две равные башни 4,5 м по диагонали «для баланса композиции», чтобы стенд одинаково читался с обоих проходов","why":"Две равные спорят."},{"t":"Доминанту ставят на 2,5 м, чтобы «не спорить с соседями» и не согласовывать высоту с площадкой","why":"Ниже 2,5 м — зона людей; доминанта исчезает."},{"t":"Логотип кладут на стены 3 м, а доминанту оставляют пустой «для чистоты формы» — лого на башне «удешевляет» архитектуру","why":"Доминанта несёт логотип — иначе несёт пустоту."}]},"simple":"Башня с вывеской, которую видно через толпу.","remember":"Одна, в верхней трети, с логотипом."},{"name":"Ключевой ракурс","level":"L1","def":"Точка на плане павильона, с которой посетитель впервые видит стенд (вход, главный проход); на неё работают доминанта, логотип и главная графика; рендер делается с неё с высоты глаз 1,6 м с 15–25 м.","rdef":"Точка на плане павильона первого взгляда на стенд; рендер с неё с высоты 1,6 м.","when":"Композиция, рендер, фотосъёмка.","ex":"Поток от входа слева: доминанта у левого угла, лайтбокс на левой стене, рендер с 20 м от входа, 1,6 м, с соседями; тот же ракурс — для фото в первый день.","near":[{"t":"Точка на плане павильона первого взгляда на стенд; рендер с неё делается с высоты 5–6 м под углом 45°, чтобы показать стенд целиком.","why":"Рендер «с вертолёта» не соответствует взгляду посетителя: 1,6 м, 15–25 м."},{"t":"Угол, под которым стенд лучше всего смотрится в рендере, выбранный визуализатором по освещению сцены.","why":"Ракурс диктует план павильона, не красота рендера."}],"nb":[{"t":"Доминанта","d":"Единственный элемент, держащий силуэт и несущий логотип; верхняя треть лимита.","why":"Доминанта направлена на ракурс."},{"t":"План павильона","d":"Схема зала с проходами, входами, соседями, колоннами; читается до эскиза.","why":"Ракурс — вывод из плана павильона."}],"apps":{"ok":"Рендер пересобирают с высоты 1,6 м с 20 м от входа, с соседями — так стенд увидит посетитель.","okWhy":"По плану павильона; 1,6 м; 15–25 м; с соседями.","bad":[{"t":"Ракурс выбирают по красоте: «с этой точки стенд смотрится выигрышнее», а откуда идёт поток — вопрос второй","why":"Выбирает план павильона, не рендер."},{"t":"Рендер с высоты 6 м показывают клиенту как главный: виден весь стенд, зонирование и доминанта в одном кадре","why":"Никто не увидит стенд сверху."},{"t":"Соседние стенды убирают с рендера, чтобы не отвлекали клиента от нашей концепции и не портили композицию кадра","why":"Соседи — часть реальности и отстройки."}]},"simple":"Место, где человек впервые замечает стенд, — и куда повернуть «лицо» стенда.","remember":"По плану; 1,6 м; 15–25 м."},{"name":"Подвес","level":"L1","def":"Крепление элементов стенда (баннер, световой короб, ферма с прожекторами) к перекрытию павильона: заявка площадке за 2–3 недели, расчёт нагрузок, точки по сетке зала, монтаж риггерами площадки; план Б обязателен.","rdef":"Крепление элементов к перекрытию павильона по заявке за 2–3 недели с расчётом; монтаж риггерами.","when":"Островные стенды, световые короба над стендом.","ex":"Световой короб 6×2 м, 120 кг: заявка за 3 недели, расчёт, четыре точки подвеса по сетке; отказ площадки → башня 5 м по плану Б. Не путать с консолью (опирается на каркас стенда).","near":[{"t":"Крепление элементов к перекрытию павильона силами монтажной бригады застройщика после согласования чертежа с конструктором.","why":"Монтаж подвеса — силами площадки или аккредитованных риггеров, не бригады застройщика."},{"t":"Крепление элементов стенда к собственному металлокаркасу на высоте, без контакта с конструкциями павильона.","why":"Это консоль или собственная ферма, не подвес."}],"nb":[{"t":"Металлокаркас","d":"Сварной каркас из трубы с обшивкой для высоты более 4 м, консолей, башен и второго этажа; расчёт конструктора, порошковая окраска.","why":"Металлокаркас стоит на полу; подвес висит на павильоне."},{"t":"Регламент площадки","d":"Правила застройки: высота, стены к соседям, границы, открытые стороны, подвес, пожарные нормы, проект в срок.","why":"Подвес — одна из статей регламента."}],"apps":{"ok":"С подвесом в концепции и пятью неделями до выставки заявку подают сегодня, а план Б с башней готовят параллельно.","okWhy":"Заявка 2–3 недели; риггеры площадки; план Б.","bad":[{"t":"Подвес решают на монтаже: «повесим своими монтажниками, там есть фермы», площадка только порадуется, что не надо вызывать риггеров","why":"Монтаж подвеса — только площадка; без заявки остановят."},{"t":"Заявку на подвес относят к зоне проектного менеджера и не закладывают план Б: концепция утверждена, значит подвес разрешат","why":"Идея и план Б — ответственность арт-директора."},{"t":"Подвесной короб 300 кг согласовывают без расчёта нагрузок: «площадка выдержит, у соседей висело тяжелее в прошлом году»","why":"Расчёт обязателен; точки по сетке зала."}]},"simple":"Повесить что-то на чужой потолок можно только с разрешения хозяина и его руками.","remember":"За 2–3 недели, с расчётом, руками площадки."},{"name":"Регламент площадки","level":"L1","def":"Правила застройки павильона: максимальная высота (обычно 5 м, выше — согласование), стены к соседям от 2,5 м с чистовой обратной стороной, ничего за границу, открытые стороны без глухих стен без согласования, подвес по заявке, сертификаты горючести, проект (план, разрез, электрика) в срок.","rdef":"Правила застройки: высота 5 м го за границу · подвес по заявке."},{"name":"Металлокаркас","level":"L1","def":"Сварной каркас из трубы (40×40, 60×40) с обшивкой для конструкций выше 4 м, консолей, башен, подвесных элементов и второго этажа; расчёт конструктора, порошковая окраска 5–7 дней.","rdef":"Сварной каркас из трубы для высоты более 4 м, консолей, башен, второго этажа; расчёт конструктора.","when":"Доминанты 4–6 м, консоли с экранами, двухэтажные стенды.","ex":"Башня 5,5 м с консолью 3 м под экран: металл 60×40, расчёт, порошок RAL 9005, обшивка композитом; столярка такую нагрузку не держит.","near":[{"t":"Сварной каркас из трубы для конструкций выше 4 м, который цех варит по рендеру без расчёта, опираясь на опыт сварщика.","why":"Расчёт конструктора обязателен для высоты, консолей и подвеса."},{"t":"Алюминиевая модульная система из профилей и замков для стандартных стендов и каркасов под ткань.","why":"Это профильная система, не сварной металлокаркас."}],"nb":[{"t":"Столярный каркас","d":"Каркас из бруса и ЛДСП/фанеры для стен до 3,5–4 м; быстро, дёшево, под окраску и печать.","why":"Столярка — до 4 м без консолей."},{"t":"Профильная система","d":"Алюминиевые модульные конструкции (Octanorm, Maxima, ферма) для стандарта, порталов и ткани.","why":"Профиль модульный и лёгкий; металлокаркас сварной и несущий."}],"apps":{"ok":"Для башни 5,5 м с консолью арт-директор сразу закладывает металл и две недели на расчёт и порошковую окраску.","okWhy":"Выше 4 м, консоль, этаж — металл и расчёт.","bad":[{"t":"Консоль 3 м под экран делают из усиленного бруса 100×100: дешевле металла втрое, а столяр говорит, что брус держит","why":"Брус на консоли — риск обрушения."},{"t":"Металлокаркас красят кистью на монтаже вместо порошковой окраски в цеху: экономия недели, а разницу видно только вблизи","why":"Порошок — 5–7 дней в цеху; кисть на монтаже — брак."},{"t":"Для стены 3 м без нагрузок закладывают металл «на всякий случай» — пусть дороже, зато конструктор точно не придерётся","why":"Переплата ×3; столярка вное — чтобы не было тёмных углов","why":"Без акцента нет главного."},{"t":"Акцент направляют от фасада внутрь навстречу входящим, чтобы стенд с прохода выглядел ярким, как витрина","why":"Слепит посетителей."},{"t":"Акцент на экспонат в фирменном синем: бренд должен читаться даже в свете, а продукт и так узнаваем","why":"Продукт посинеет на всех фото."}]},"simple":"Луч, который говорит «смотри сюда».","remember":"3:1 · 24–36° · 4000 К · не в глаза."},{"name":"Цветовая температура","level":"L2","def":"Оттенок белого света: 3000 К — тёплый (бар, лаунж, дерево), 4000 К — нейтральный (лица, продукт, ресепшн), 5000–6500 К — холодный (техника, медицина, белые объёмы); на стенде одна основная температура, вторая — осознанной зоной.","rdef":"Оттенок белого света: 3000 К тепло, 4000 К нейтрально, 6500 К холодно; одна основная.","when":"Выбор прожекторов и лайтбоксов; фото лиц и продукта.","ex":"Стенд 4000 К, бар 3000 К как зона с переходом через общий свет; бар 3000 рядом с демо 6500 без базы — два разных стенда.","near":[{"t":"Оттенок белого света в кельвинах, который на выставочных стендах всегда берут 6500 К, чтобы стенд выглядел ярче соседей.","why":"Яркость — люксы и ниты, не кельвины; 6500 К делает лица серыми."},{"t":"Яркость источника света в люксах: 3000 — слабый, 4000 — нормальный, 6500 — сильный прожектор.","why":"Кельвины — оттенок, не яркость."}],"nb":[{"t":"Акцентный свет","d":"Прожекторы на экспонаты и лица с контрастом 3:1 к общему; 24–36°, не в глаза.","why":"Температура задаётся и для акцента."},{"t":"Лайтбокс","d":"Натяжная ткань на профиле с LED-подсветкой; дешёвая большая яркая плоскость.","why":"У лайтбокса тоже температура — согласовать с прожекторами."}],"apps":{"ok":"Продукт и ресепшн — 4000 К, бар — 3000 К как зона; общий свет 4000 связывает их в один стенд.","okWhy":"Одна основная; 4000 К на лица и продукт.","bad":[{"t":"На одном стенде бар 3000 и демо 6500 без общего слоя: «контраст зон» помогает посетителю понять, где отдыхать, а где смотреть","why":"Без базы читается как ошибка."},{"t":"6500 К везде «чтобы ярче»: холодный свет визуально сильнее, а соседи с тёплым светом будут выглядеть тускло","why":"Яркость — не кельвины; лица серые."},{"t":"Температуру не указывают в спецификации: «электрик возьмёт что есть», разница в кельвинах глазом всё равно незаметна","why":"Разнобой прожекторов виден на фото."}]},"simple":"«Тёплый» или «холодный» белый — как лампочка дома.","remember":"3000 бар · 4000 лица · 6500 техника."},{"name":"Лайтбокс","level":"L2","def":"Натяжная ткань с печатью на алюминиевом профиле с LED-подсветкой изнутри: самая дешёвая большая яркая плоскость; глубина 80–120 мм для ровной засветки, 60–120 Вт/м², ткань с сертификатом горючести; виден с 40 м.","rdef":"Натяжная ткань на профиле с LED-подсветкой: дешёвая большая яркая плоскость, виден с 40 м.","when":"Фризы, задники, доминанты, замена крашеной столярки.","ex":"Лайтбокс 6×3 м глубиной 100 мм на фризе — заметен от входа с 40 м, стоит втрое дешевле крашеной стены, монтируется за полдня.","near":[{"t":"Натяжная ткань на профиле с LED-подсветкой изнутри; глубина 20–30 мм достаточна для ровной засветки при любой сетке светодиодов.","why":"Глубина 80–120 мм; при 20–30 мм видны пятна диодов."},{"t":"Жёсткая панель из молочного акрила с печатью и подсветкой, собранная в короб из ЛДСП; тяжёлая и дорогая, но долговечная.","why":"Это световой короб из акрила, не лайтбокс из ткани."}],"nb":[{"t":"Натяжная ткань","d":"Полотно с сублимационной печатью на профиле — стены, потолки, лайтбоксы; быстро, легко, многоразово; сертификат горючести.","why":"Ткань — материал, лайтбокс — конструкция с подсветкой."},{"t":"LED-экран","d":"Модульный экран с шагом пикселя P; дистанция просмотра ≈ P × 1–1,5 м; 800–1500 нит; дорогой в аренде.","why":"Экран показывает контент; лайтбокс — статичная яркая графика."}],"apps":{"ok":"Вместо крашеной стены 12 м за 12 дней до монтажа ставят лайтбокс из ткани: с 10 м неотличимо, ярче и быстрее.","okWhy":"Ткань + профиль + LED; 80–120 мм; сертификат.","bad":[{"t":"Лайтбокс глубиной 30 мм «чтобы тоньше»: современные диоды равномерные, а глубокий короб выглядит как ящик","why":"Пятна диодов на ткани."},{"t":"Ткань без сертификата: «за ней LED, не греется», а сертифицированная дороже на 30% и едет две недели","why":"Инспектор проверяет документы."},{"t":"Лайтбокс на всю площадь стенда на 100% яркости: чем больше светящейся плоскости, тем заметнее стенд из прохода","why":"Пересвет без акцентов; лица в тени."}]},"simple":"Светящаяся картина из ткани — ярко, дёшево, быстро.","remember":"Самая дешёвая яркая плоскость."},{"name":"LED-экран","level":"L2","def":"Модульный светодиодный экран с шагом пикселя P (мм): минимальная дистанция просмотра ≈ P × 1–1,5 м (P2.5 — от 3 м, P3.9 — от 5 м); яркость 800–1500 нит, 300–600 Вт/м²; контент 15–30 с крупно; аренда дорогая — экран как часть сценария.","rdef":"Модульный экран с шагом пикселя P; дистанция ≈ P × 1–1,5 м; 800–1500 нит; дорогой — как часть сценария.","when":"Демо-зоны, динамический контент; смета AV.","ex":"P2.5, 2 м² в демо-зоне в 4 м от прохода, контент 20 с о новой серии; на фасад в 1,5 м от прохода не ставят — видна сетка.","near":[{"t":"Модульный светодиодный экран с шагом пикселя P; чем крупнее шаг, тем мягче картинка вблизи, поэтому у прохода ставят P4–P6.","why":"Крупнее шаг — заметнее сетка; у прохода нужен мелкий шаг."},{"t":"Модульный экран, который на выставке заменяет графику и свет: при яркости 1500 нит освещает стенд и несёт все тексты.","why":"Экран не заменяет свет и графику; мелкий текст на нём не читается."}],"nb":[{"t":"Лайтбокс","d":"Натяжная ткань на профиле с LED-подсветкой: дешёвая большая яркая плоскость.","why":"Лайтбокс — статика дёшево; экран — динамика дорого."},{"t":"Шаг пикселя","d":"Расстояние между центрами светодиодов экрана в мм (P2.5, P3.9); определяет минимальную дистанцию просмотра.","why":"Шаг — параметр экрана."}],"apps":{"ok":"Экран P2.5 ставят в демо-зоне в 4 м от прохода с 20-секундным роликом о продукте.
