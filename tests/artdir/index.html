я: дизайнер заложил крашеную стену 12 метров, до монтажа 12 дней — что делать?","how":"1. ЛДСП 16–22: каркасы, стойки, прямые плоскости; кромка ПВХ, плёнка; не красить, не гнуть; лист 2800×2070.\n2. МДФ 16–19: окраска (грунт + 2 слоя, 7–10 дней), фрезеровка (буквы, рельеф, радиусы); 1,5–2× к ЛДСП; боится воды.\n3. Фанера 10–18: прочность, гнутые формы, честная фактура под лак, ажур; листы 2440×1220 / 1525×1525.\n4. Металл: сварной каркас 40×40/60×40, порошковая окраска 5–7 дней; высота > 4 м, консоли, подвес. Акрил: молочный под свет, прозрачный витрины, лазер. Стекло: закалённое, спец-монтаж. ПВХ/композит: лёгкие фасады с печатью.\n5. Ткань: натяжная на профиле, сублимация, сертификат, 3–5 дней — лайтбоксы, стены, потолки. Печать: интерьерная 720–1440 dpi (0,5 м), баннер 360–720 (2–3 м), УФ по листам; плёнки — цвет без печати. Фрезеровка ЧПУ — по длине реза.\n6. Выбор: по дистанции восприятия (с 10 м материал неразличим), по срокам (краска, порошок, ткань), по бюджету (1× ЛДСП … 5–8× стекло). Дорогое — где потрогают. Пример: стенд 100 м² — стены ЛДСП+плёнка (45% конструктива), фриз и задник ткань-лайтбокс (20%), ресепшн крашеный МДФ с фрезерованным лого (20%), доминанта металл (15%).","formula":{"f":"материал = f(дистанция восприятия, срок, бюджет, функция)\nцена/м²: ЛДСП+плёнка 1× · МДФ краска 1,5–2× · фреза 3–5× · металл 3–6× · ткань-лайтбокс 2–3× · стекло 5–8×","legend":[["дистанция","откуда смотрят и трогают ли","с 10 м неразличимо"],["срок","окраска МДФ 7–10 · порошок 5–7 · ткань 3–5 · печать 2–3","считать от монтажа назад"],["функция","несёт / скрыто / светится / читается","металл / ЛДСП / акрил / печать"],["dpi","разрешение печати по дистанции","720–1440 вблизи, 360–720 фриз"],["сертификат","класс горючести ткани, ковролина, панелей","до монтажа"]],"note":"Проверка спецификации за минуту: что крашеное — успеет высохнуть? что высокое — металл? что большое — ткань? что дорогое — потрогают?"},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— ЛДСП — каркас и прямые плоскости; МДФ — окраска и фрезеровка (7–10 дней); фанера — прочность и формы.\n— Металл — высота, консоли, подвес (порошок неделя); акрил — свет; стекло — закалённое и редко.\n— Ткань — большие плоскости быстро и легко; сертификат горючести обязателен.\n— Печать и плёнка — по дистанции: 720–1440 dpi вблизи, 360–720 на фриз.\n— Материал выбирают по дистанции, сроку и бюджету; дорогое — там, где потрогают.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Дизайнер заложил крашеную стену 12 м, до монтажа 12 дней — что делать?","o":["Красить на монтаже в павильоне, сэкономив 7–10 дней сушки в цеху и день логистики","Заменить на ткань-лайтбокс или ЛДСП с плёнкой: с 10 м разницы нет, срок есть","Покрасить в один слой без грунта: сушка 2–3 дня вместо 7–10, тон тот же"],"a":1,"w":"Окраска МДФ с сушкой 7–10 дней плюс производство не укладывается; с дистанции материал неразличим."},{"q":"Чем ЛДСП ограничен?","o":["Весом: лист 16 мм 2800×2070 вдвое тяжелее МДФ той же толщины — модуль за 100 кг","Не красится и не фрезеруется в радиусы — прямые плоскости с кромкой и плёнкой","Пожарными нормами: смола в составе даёт класс Г4, на выставках запрещён"],"a":1,"w":"ЛДСП — каркас и прямое; МДФ — краска и форма."},{"q":"В формуле выбора материала что такое «дистанция»?","o":["Расстояние от цеха до площадки: дальше 500 км дешевле ткань, чем столярка","Откуда смотрят и трогают ли: дорогое — на дистанции касания","Расстояние до соседних стендов: ≥2,5 м к стенам соседей по регламенту"],"a":1,"w":"С 10 м шпон и плёнка одинаковы; вблизи — нет."},{"q":"Большая яркая плоскость 6×3 за три дня — из чего?","o":["Крашеный МДФ 18 мм с прожекторами 3:1 — глубже цвет, чем у ткани","Натяжная ткань на профиле с LED-подсветкой","Закалённое стекло 8 мм с цветной плёнкой и подсветкой торцов"],"a":1,"w":"Ткань — быстро, легко, ярко; нужен сертификат."}],"rules":["ЛДСП — каркас и прямые плоскости; МДФ — окраска и фрезеровка (7–10 дней); фанера — прочность и формы.","Металл — высота, консоли, подвес (порошок неделя); акрил — свет; стекло — закалённое и редко.","Ткань — большие плоскости быстро и легко; сертификат горючести обязателен.","Печать и плёнка — по дистанции: 720–1440 dpi вблизи, 360–720 на фриз.","Материал выбирают по дистанции, сроку и бюджету; дорогое — там, где потрогают."]}},{"id":"u3-2","level":"L3","title":"От рендера к цеху: разузловка, чертежи, контрольная сборка, монтаж","lead":"Технологичность — свойство идеи, которое проверяют до запуска в производство","concept":"Между рендером и стендом — цех, фура и три дня монтажа. Технологичная идея — та, что разбивается на элементы, которые можно изготовить из стандартных листов, покрасить в срок, погрузить в фуру, собрать за два дня без доводки «по месту» и разобрать за ночь. Разузловка: стенд делят на модули по габаритам листов (ЛДСП 2800×2070, фанера 2440×1220) и транспорта (фура 13,6 м, ширина 2,45, высота 2,6; ворота павильона и грузовые лифты), стыки прячут в углах, кромках, под плёнкой или в «теневом зазоре» 5–10 мм; элементы длиннее 3 м — составные с замком. Рабочая документация (РД): планы с размерами и привязками зон, разрезы и фасады с высотами, развёртки стен с графикой, узлы соединений, спецификация материалов (толщины, декоры, RAL), схема электрики и света, ведомость печати (размеры, dpi, материал, тираж), план монтажа. Сроки производства эксклюзива — 3–5 недель; окраска и порошок — критический путь. Контрольная сборка в цеху — обязательная точка: собирают ключевые узлы (доминанта, ресепшн, стыки графики), арт-директор принимает по чек-листу (цвет по RAL, стыки, читаемость графики, свет), иначе проблема вскрывается на монтаже без возможности исправить. Монтаж: 2–3 дня (крупные — 4–5), бригада 6–12 человек, подъёмники для высоты, сначала каркас и подвес, потом стены и графика, потом свет и электрика, мебель, экспонаты; приёмка — чек-лист + фотосъёмка. Демонтаж — за ночь: конструкции либо утилизируют, либо упаковывают для повторного использования (re-use — тренд и экономия до 30–40% на серии выставок). Арт-директор на этом пути — хранитель идеи: ревью РД на соответствие концепции, список «не менять без меня» (цвет доминанты, пропорции, свет, графика), присутствие на контрольной сборке и в первый день монтажа.","points":[{"h":"Разузловка и габариты","t":"Модули — по листам и транспорту: стены 2,8–3 м высотой из листов ЛДСП; выше — составные с замком и скрытым стыком; радиусы — из гнутой фанеры сегментами; фура 13,6×2,45×2,6 м, ворота и лифты площадки — проверить. Стыки — в углах, под плёнкой, в теневом зазоре. Тяжёлые модули — не более 80–100 кг на двоих монтажников или на подъёмник."},{"h":"Состав РД","t":"Планы с размерами и привязками; разрезы и фасады с отметками высот; развёртки стен с раскладкой графики; узлы (стыки, примыкания, крепление экрана, подвес); спецификация материалов (ЛДСП 16 декор, МДФ 18 RAL 9003 мат, ткань Г1); схема электрики и света (точки, кВт, прожекторы); ведомость печати (размер, dpi, материал); план монтажа по дням. РД делает конструктор; арт-директор ревьюит на соответствие идее."},{"h":"Контрольная сборка и список «не менять»","t":"В цеху собирают доминанту, ресепшн, стыки графики, ключевые узлы; проверяют RAL по образцу, стыки, читаемость, свет. Чек-лист арт-директора: цвет, пропорции, стыки, графика, свет, лицевые поверхности. Список «не менять без согласования арт-директора»: материал и цвет доминанты, пропорции и высоты, свет, графика, фактуры зон касания. Замена «аналогом» без ревью — главный убийца идеи."},{"h":"Монтаж, приёмка, демонтаж, re-use","t":"Монтаж 2–3 дня: каркас и подвес → стены и графика → свет и электрика → мебель и экспонаты → уборка. Арт-директор — первый день (каркас, доминанта) и приёмка (чек-лист, свет включён, фото с ключевого ракурса). Демонтаж за ночь; конструкции для re-use маркируют и упаковывают — серия выставок экономит 30–40%. Фото стенда — обязательный результат: без фото нет портфолио и нет кейса."}],"practice":{"mechanic":"ranking","points":3,"stem":"Расставьте этапы пути от утверждённой концепции до открытия выставки.","options":[{"id":"r0","text":"Ревью РД арт-директором: планы, разрезы, развёртки, спецификация, свет — на соответствие идее","why":"До запуска в цех; после — дорого."},{"id":"r1","text":"Заявки площадке: подвес, электрика, проект застройки, пропуска","why":"Критический путь — 2–4 недели."},{"id":"r2","text":"Производство 3–5 недель: окраска и порошок первыми","why":"Сушка — самое длинное."},{"id":"r3","text":"Контрольная сборка ключевых узлов в цеху с приёмкой по чек-листу","why":"Последняя возможность исправить до монтажа."},{"id":"r4","text":"Логистика и монтаж 2–3 дня: каркас → стены и графика → свет → мебель","why":"Порядок монтажа фиксирован."},{"id":"r5","text":"Приёмка стенда: чек-лист, свет включён, фото с ключевого ракурса","why":"Без фото нет кейса."}],"solution":"РД → заявки площадке → производство → контрольная сборка → монтаж → приёмка и фото.","anchor":{"g":"timeline","p":{"items":["РД + ревью","заявки площадке","цех 3–5 нед","контрольная сборка","монтаж 2–3 дня","приёмка + фото"],"hl":3},"cap":"контрольная сборка — последняя точка исправлений"},"id":"u3-2-p"},"test":[{"mechanic":"single","points":2,"stem":"В рендере — сплошная глянцевая стена 9 м без единого шва. Что ответит цех и что делать арт-директору?","options":[{"id":"o0","text":"Стена — из 3–4 модулей: спроектировать стыки в теневой зазор или под плёнку и показать клиенту на концепции","correct":true,"rationale":"Технологичность — свойство идеи, швы проектируют, а не прячут потом."},{"id":"o1","text":"Заказать цельный лист композита 9×3 м под заказ: завод катает рулон до 12 м, довезём негабаритом на трале","correct":false,"rationale":"Не влезет в фуру и ворота; глянец покажет каждую неровность."},{"id":"o2","text":"Собрать модули на монтаже, зашпаклевать стыки в павильоне и подкрасить по месту: сутки на сушку в графике есть","correct":false,"rationale":"Шпаклёвка и покраска в павильоне невозможны по срокам и регламенту."},{"id":"o3","text":"Заменить стену LED-экраном 9×3 м: модули 50×50 см стыкуются без видимого шва, а контент заменит глянец","correct":false,"rationale":"Экран из модулей тоже; и бюджет."}],"anchor":{"g":"pipeline","p":{"steps":["лист 2,8 м","модуль","теневой зазор 8 мм","фура 2,6 м","монтаж"],"hl":[1,2]},"cap":"швы проектируют на концепции"},"id":"u3-2-t0"},{"mechanic":"single","points":2,"stem":"Цех предлагает заменить крашеный МДФ доминанты (RAL 5002) на ЛДСП «синий» из наличия: сроки горят. Решение?","options":[{"id":"o0","text":"Сверить декор с RAL по образцу при свете; уходит тон — ткань или плёнка точного цвета, не произвольный аналог","correct":true,"rationale":"Доминанта — в списке «не менять без арт-директора»."},{"id":"o1","text":"Согласиться: с 10 м синий ЛДСП от RAL 5002 не отличить, а срыв монтажа обойдётся дороже любого оттенка на фото","correct":false,"rationale":"«Синий» ЛДСП может быть на два тона другим и убьёт бренд-цвет на всех фото."},{"id":"o2","text":"Отказать и просить площадку о раннем заезде на сутки: доминанта важнее, а 7–10 дней окраски так найдутся","correct":false,"rationale":"Монтаж не двигается; нужна управляемая замена."},{"id":"o3","text":"Передать решение проектному менеджеру: спецификация и замены аналогами — его зона по договору с цехом","correct":false,"rationale":"Цвет доминанты — зона арт-директора."}],"anchor":{"g":"guard","p":{"in":true,"out":true,"tools":true,"note":"список «не менять без меня»: цвет, пропорции, свет, графика"},"cap":"замена — только с ревью"},"id":"u3-2-t1"},{"mechanic":"single","points":2,"stem":"Зачем контрольная сборка в цеху, если есть РД и опытные монтажники?","options":[{"id":"o0","text":"Стыки, цвет и графику можно исправить в цеху; на монтаже за два дня — уже нет","correct":true,"rationale":"Последняя точка исправлений."},{"id":"o1","text":"Чтобы снять стенд для портфолио в чистом цеху заранее: на выставке мешают люди и соседи","correct":false,"rationale":"Фото делают на выставке, с людьми."},{"id":"o2","text":"Для отчёта клиенту о ходе производства: по договору сборка — этап платежа 30%","correct":false,"rationale":"Побочная польза, не цель."},{"id":"o3","text":"Чтобы бригада отрепетировала сборку и на площадке уложилась в два дня вместо трёх","correct":false,"rationale":"Тренировка — приятный бонус, но цель — проверка узлов."}],"anchor":{"g":"compare","p":{"a":["в цеху","перекрасить, перепечатать: дни"],"b":["на монтаже","времени и инструмента нет"],"verdict":"контрольная сборка обязательна"},"cap":"исправлять дёшево можно только в цеху"},"id":"u3-2-t2"},{"mechanic":"single","points":2,"stem":"Монтаж 2 дня, бригада 8 человек, стенд 120 м² с подвесом. Что должно происходить в первый день?","options":[{"id":"o0","text":"Подвес (силами площадки), каркас и доминанта, электрика черновая; стены и графика — к вечеру","correct":true,"rationale":"Порядок: каркас и подвес → стены → свет → мебель."},{"id":"o1","text":"Мебель и экспонаты первыми, пока проходы свободны от фур соседей; каркас и доминанта — к вечеру","correct":false,"rationale":"Мебель мешает каркасу и пачкается."},{"id":"o2","text":"Графика и свет: самое заметное и уязвимое ставят первым и чистым, каркас и подвес — во второй день","correct":false,"rationale":"Графика без стен не вешается."},{"id":"o3","text":"Всё параллельно: восемь человек — три звена, каркас, графика и свет идут одновременно по зонам","correct":false,"rationale":"На одной площади параллельные работы мешают друг другу и ломают графику."}],"anchor":{"g":"pipeline","p":{"steps":["подвес","каркас + доминанта","стены + графика","свет + электрика","мебель, экспонаты","уборка, фото"],"hl":[0,1]},"cap":"день 1 — каркас, день 2 — отделка"},"id":"u3-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре графика проекта при 8 неделях до открытия (производство эксклюзива 3–5 недель). Какой реалистичен?","vopts":[{"id":"v0","v":{"g":"tl","p":{"n":5,"deps":true,"crit":true,"buffer":true}},"lbl":"","correct":true,"rationale":"Заявки площадке и окраска первыми, вехи с критериями, буфер неделя."},{"id":"v1","v":{"g":"tl","p":{"n":9,"deps":false,"crit":false,"buffer":false}},"lbl":"","correct":false,"rationale":"Девять вех без заявок площадке и без буфера — монтаж остановят."},{"id":"v2","v":{"g":"tl","p":{"n":5,"deps":false,"crit":true,"buffer":true}},"lbl":"","correct":false,"rationale":"Нет заявок на подвес и электрику — они длиннее цеха."},{"id":"v3","v":{"g":"tl","p":{"n":5,"deps":true,"crit":false,"buffer":false}},"lbl":"","correct":false,"rationale":"Вехи без критериев («делаем РД») и без буфера на сушку краски."}],"id":"u3-2-t4"}],"framework":"Технологичность — свойство идеи: модули по листам и фуре, стыки в теневой зазор. РД: планы, разрезы, развёртки, узлы, спецификация, электрика, ведомость печати. Производство 3–5 недель, краска — критический путь. Контрольная сборка в цеху обязательна. Монтаж: каркас и подвес → стены и графика → свет → мебель. Список «не менять без арт-директора». Приёмка с фото. Re-use экономит 30–40%.","anchor":{"g":"timeline","p":{"items":["концепт","РД","заявки","цех","контрольная сборка","монтаж","фото"],"hl":4},"cap":"хранитель идеи — от РД до фото"},"layers":{"simple":"Рендер — это обещание. Между ним и стендом — цех, где лист ЛДСП имеет размер 2,8 метра, фура — высоту 2,6, а краска сохнет неделю. Стена «без единого шва» на 9 метров — это 3–4 панели, и швы нужно придумать на эскизе, а не прятать на монтаже.\nИдея теряется не в цеху — она теряется, когда цех заменяет «синий на синий из наличия», а арт-директор об этом не знает. Поэтому есть список «не менять без меня» и обязательная контрольная сборка: в цеху перекрасить можно, в павильоне за два дня — нет.\nМонтаж идёт в строгом порядке: подвес и каркас, потом стены и графика, потом свет, потом мебель. А в конце — фото с ключевого ракурса. Без фото нет кейса, а без кейса нет следующего клиента.\nПроверь себя: зачем контрольная сборка, если есть чертежи и опытные монтажники?","how":"1. Разузловка: модули по листам (ЛДСП 2800×2070, фанера 2440×1220) и транспорту (фура 13,6×2,45×2,6; ворота и лифты площадки); стыки в углах, под плёнкой, в теневом зазоре 5–10 мм; длинное — составное с замком; модуль ≤ 80–100 кг.\n2. РД: планы с размерами, разрезы и фасады с высотами, развёртки стен с графикой, узлы, спецификация (материал, толщина, RAL/декор, класс горючести), электрика и свет, ведомость печати, план монтажа. Конструктор делает, арт-директор ревьюит на соответствие идее.\n3. Сроки: производство 3–5 недель; критический путь — окраска МДФ 7–10 дней, порошок 5–7, заявки площадке 2–4 недели; буфер неделя.\n4. Контрольная сборка: доминанта, ресепшн, стыки графики, ключевые узлы; чек-лист — RAL по образцу, стыки, читаемость, свет, лицевые поверхности. Список «не менять без арт-директора»: цвет и материал доминанты, пропорции и высоты, свет, графика, фактуры зон касания.\n5. Монтаж 2–3 дня: подвес (площадка) и каркас → стены и графика → свет и электрика → мебель, экспонаты → уборка; арт-директор — первый день и приёмка (чек-лист, свет включён, фото с ключевого ракурса). Демонтаж за ночь; re-use — маркировка и упаковка, экономия 30–40% на серии.\n6. Пример. Стена 9×3,5 глянец: 4 модуля 2,25 м с теневым зазором 8 мм, показанным клиенту на рендере; доминанта RAL 5002 — образец окрашен и утверждён на контрольной сборке; монтаж 3 дня, бригада 10, подъёмник.","formula":{"f":"технологичность = разузловка по листам и фуре + стыки спроектированы + сроки краски и заявок в графике + контрольная сборка\nграфик (назад от открытия): монтаж 2–3 дн ← логистика 1–2 ← контрольная сборка ← цех 3–5 нед ← РД 1–2 нед ← заявки площадке 2–4 нед","legend":[["лист","габарит материала, задающий модуль","ЛДСП 2800×2070"],["фура","13,6 × 2,45 × 2,6 м","модуль ≤ 2,4 м по короткой стороне"],["теневой зазор","спроектированный стык","5–10 мм"],["критический путь","самое длинное: краска, порошок, заявки","7–10 дн · 5–7 · 2–4 нед"],["контрольная сборка","приёмка ключевых узлов в цеху","за 3–5 дней до отгрузки"],["«не менять»","список элементов под личный контроль","доминанта, свет, графика, касание"]],"note":"Любая замена материала или упрощение узла без ревью арт-директора — потеря идеи; процесс защищает идею лучше, чем талант."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Технологичность — свойство идеи: модули по листам и фуре, стыки спроектированы на концепции.\n— РД ревьюит арт-директор на соответствие идее; краска и заявки площадке — критический путь.\n— Контрольная сборка в цеху обязательна: там исправлять дёшево, на монтаже — невозможно.\n— Список «не менять без арт-директора»: доминанта, пропорции, свет, графика, зоны касания.\n— Монтаж: подвес и каркас → стены и графика → свет → мебель; приёмка с фото; re-use экономит 30–40%.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Зачем контрольная сборка, если есть чертежи и опытные монтажники?","o":["Чтобы бригада отрепетировала сборку и на площадке уложилась в два дня вместо трёх","В цеху стыки, цвет и графику можно исправить; на монтаже за два дня — нет","Для фотографий в портфолио в чистом цеху, без людей и соседей"],"a":1,"w":"Последняя точка дешёвых исправлений."},{"q":"Стена 9 м без швов в рендере — что делать?","o":["Заказать цельный лист композита 9×3 м под заказ и привезти негабаритом на трале","Спроектировать модули и стыки в теневой зазор, показать клиенту на концепции","Зашпаклевать и подкрасить стыки на монтаже: сутки на сушку в графике есть"],"a":1,"w":"Технологичность — свойство идеи; швы проектируют заранее."},{"q":"В формуле графика что идёт первым от открытия назад после монтажа и логистики?","o":["Финальные рендеры для презентации клиенту и согласование","Контрольная сборка, затем цех 3–5 недель","Заявки площадке на пропуска и парковку для бригады"],"a":1,"w":"Контрольная сборка — перед отгрузкой; цех — перед ней; заявки площадке — параллельно и раньше."},{"q":"Цех заменил цвет доминанты «на похожий из наличия». Чья это ошибка?","o":["Цеха: по договору подряда любая замена материала согласуется письменно за три дня","Процесса: не было списка «не менять без арт-директора» и ревью спецификации","Клиента: не утвердил выкрас RAL на образце до запуска в производство"],"a":1,"w":"Процесс защищает идею лучше, чем талант."}],"rules":["Технологичность — свойство идеи: модули по листам и фуре, стыки спроектированы на концепции.","РД ревьюит арт-директор на соответствие идее; краска и заявки площадке — критический путь.","Контрольная сборка в цеху обязательна: там исправлять дёшево, на монтаже — невозможно.","Список «не менять без арт-директора»: доминанта, пропорции, свет, графика, зоны касания.","Монтаж: подвес и каркас → стены и графика → свет → мебель; приёмка с фото; re-use экономит 30–40%."]}},{"id":"u4-1","level":"L4","title":"Смета стенда: куда уходят деньги и как уложиться в бюджет клиента","lead":"Структура сметы, цена за м² по типам, рычаги экономии без потери эффекта, скрытые затраты","concept":"Арт-директор должен назвать порядок цены стенда до сметчика — иначе концепция окажется дороже бюджета на 40%, и её порежут до неузнаваемости. Структура сметы эксклюзива (доли ориентировочные): конструктив (каркас, стены, столярка, металл) 35–45%; графика и печать 8–12%; свет и электрика 8–12%; AV и экраны 5–20% (аренда LED дорога); мебель, аренда, декор, зелень 5–10%; логистика, монтаж, демонтаж 15–20% (бригада, подъёмники, фура, пропуска); проектирование (концепция, РД) 5–8%; маржа агентства 20–35% сверху или внутри. Порядки цены на м² застройки (Москва, 2025–2026): стандарт с улучшениями 6–12 тыс. ₽; эксклюзив простой (столярка, плёнка, базовый свет) 25–35; эксклюзив средний (окраска, лайтбоксы, доминанта 4–5 м, переговорные) 35–55; сложный (металл, консоли, подвес, экран, второй уровень) 55–100+. Площадь аренды у организатора — отдельно, 10–20 тыс. ₽/м². Скрытые затраты, которые забывают: подвес (услуга площадки и расчёт), электричество и щит, пропуска и парковка, уборка, страховка, демонтаж и утилизация, хранение для re-use, ночные работы, аренда подъёмника, печать повторная из-за правок. Рычаги экономии без потери эффекта: одна сильная доминанта вместо трёх средних; ткань и лайтбоксы вместо крашеной столярки; плёнка вместо окраски на невидимых плоскостях; аренда мебели и AV вместо покупки; графика утверждается рано (перепечатка — 10–15% графики); re-use модулей на серии выставок; экран меньше, но в сценарии. Чего нельзя резать: свет на экспонат и лица, высоту доминанты, качество зон касания, контрольную сборку и монтажную бригаду. Чувствительность: при фиксированном бюджете каждые +10% площади — −8% к качеству отделки на м²; каждый метр высоты сверх 4 — +15–25% к конструктиву.","points":[{"h":"Структура сметы и цена за м²","t":"Конструктив 35–45%, графика 8–12%, свет и электрика 8–12%, AV 5–20%, мебель и декор 5–10%, логистика и монтаж 15–20%, проектирование 5–8%, маржа. Порядки за м²: стандарт+ 6–12 тыс. ₽, эксклюзив простой 25–35, средний 35–55, сложный 55–100+. Арт-директор называет категорию и вилку на эскизе: «это средний эксклюзив, 40–50 тыс. за метр, на 80 м² — 3,2–4 млн»."},{"h":"Скрытые затраты","t":"Подвес (заявка, расчёт, риггеры площадки), электроподключение и щит, пропуска и парковка на монтаж, уборка и вывоз мусора, страховка, демонтаж и утилизация, хранение модулей, ночные надбавки, аренда подъёмника, перепечатка графики после правок, командировочные при региональных выставках. Их закладывают строкой «площадка и организация» 8–12% — иначе маржа уходит на них."},{"h":"Рычаги экономии без потери эффекта","t":"Одна доминанта вместо трёх; ткань и лайтбоксы вместо столярки; плёнка на невидимом; аренда мебели и AV; ранняя фиксация графики; re-use модулей на серии; экран меньше и в сценарии; стандартные профильные системы под скрытый каркас; стены 3 м вместо 3,5 там, где нет доминанты. Нельзя резать: свет на экспонат и лица, высоту доминанты, зоны касания, контрольную сборку, бригаду."},{"h":"Чувствительность и разговор о цене","t":"Площадь ↑10% при том же бюджете → отделка ↓8% на м². Высота сверх 4 м — +15–25% к конструктиву за метр. LED-экран 10 м² — аренда порядка стоимости 10–15 м² эксклюзива. Второй этаж — ×1,5–2 к м². С клиентом говорят вилкой и категориями, показывают структуру сметы и два-три варианта с ценой эффекта: «вариант Б дешевле на 20% за счёт ткани вместо столярки, высота и свет те же»."}],"practice":{"mechanic":"numeric","points":3,"stem":"Стенд 80 м², средний эксклюзив по 42 тыс. ₽/м². Сколько миллионов рублей составит застройка (без аренды площади)?","answer":3.36,"tol":0.05,"unit":"млн ₽","solution":"80 × 42 000 = 3 360 000 ₽ ≈ 3,36 млн. Плюс аренда у организатора 80 × 15 000 = 1,2 млн — итого участие ≈ 4,6 млн без экспонатов и персонала. Если бюджет клиента 2,5 млн на застройку — это 31 тыс./м²: простой эксклюзив, без подвеса и экрана.","anchor":{"g":"estimate","p":{"rows":[["конструктив",40],["графика",10],["свет, электрика",10],["AV, экраны",8],["мебель, декор",7],["логистика, монтаж",18],["проектирование",7]],"total":"80 м² × 42 тыс. = 3,36 млн ₽"},"cap":"цена за м² × площадь = порядок до сметчика"},"id":"u4-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Клиент: бюджет 2 млн на 100 м². Концепция дизайнера: металл, подвес, LED 8 м², окраска. Что делает арт-директор?","options":[{"id":"o0","text":"Называет категорию: 20 тыс./м² — простой эксклюзив; убирает подвес, металл и LED, оставляет доминанту и свет","correct":true,"rationale":"Бюджет определяет категорию; режем сложность, не эффект."},{"id":"o1","text":"Уменьшает застройку до 60 м²: выходит 33 тыс./м², средний эксклюзив, и металл с подвесом проходят по смете","correct":false,"rationale":"Аренда уже оплачена; меньше площадь — не дешевле металл и подвес."},{"id":"o2","text":"Оставляет концепцию и предлагает клиенту найти ещё 2 млн: металл с подвесом — это 40 тыс./м², идея того стоит","correct":false,"rationale":"Клиент уйдёт с идеей к другому застройщику."},{"id":"o3","text":"Делает всё, экономя на бригаде, контрольной сборке и подъёмнике: монтаж и логистика — это 15–20% сметы","correct":false,"rationale":"Нельзя резать: монтаж и сборку."}],"anchor":{"g":"quad","p":{"x":"стоимость за м²","y":"эффект","pts":[["простой + доминанта",0.25,0.65],["металл+подвес+LED",0.85,0.8],["стандарт",0.1,0.3]],"hl":0,"note":"бюджет задаёт категорию"},"cap":"режем сложность, а не эффект"},"id":"u4-1-t0"},{"mechanic":"single","points":2,"stem":"В смете нет строк «подвес», «электроподключение», «пропуска», «подъёмник». Что произойдёт?","options":[{"id":"o0","text":"Они появятся по факту и съедят маржу: закладывать строку «площадка и организация» 8–12%","correct":true,"rationale":"Скрытые затраты — главный убийца маржи."},{"id":"o1","text":"Ничего: подвес, электрика и пропуска входят в аренду площади у организатора по 10–20 тыс./м²","correct":false,"rationale":"Аренда — только площадь и общая охрана."},{"id":"o2","text":"Клиент оплатит их отдельно по счетам площадки: это услуги организатора экспоненту, не застройщику","correct":false,"rationale":"Если не оговорено в договоре — платит агентство."},{"id":"o3","text":"Сметчик добавит их автоматически по шаблону: в типовой форме сметы эти строки стоят по умолчанию","correct":false,"rationale":"Шаблон — не замена ревью."}],"anchor":{"g":"cost","p":{"lines":[["подвес: заявка, расчёт, риггеры","2–5%"],["электроподключение, щит","2–3%"],["пропуска, парковка, уборка","1–2%"],["подъёмник, ночные","2–3%"],["перепечатка графики","1–2%"]],"total":"«площадка и организация» 8–12%"},"cap":"скрытое — отдельной строкой"},"id":"u4-1-t1"},{"mechanic":"single","points":2,"stem":"Что из этого экономит без потери эффекта?","options":[{"id":"o0","text":"Ткань-лайтбоксы вместо крашеной столярки на больших плоскостях и аренда мебели","correct":true,"rationale":"Дешевле, быстрее, ярче — эффект растёт."},{"id":"o1","text":"Сокращение числа прожекторов на экспонат и ресепшн вдвое: свет 8–12% сметы, глаз адаптируется","correct":false,"rationale":"Свет на главное резать нельзя."},{"id":"o2","text":"Отказ от контрольной сборки в цеху: опытная бригада соберёт по РД на месте, экономия 2–3 дня","correct":false,"rationale":"Экономия 1% ценой брака на монтаже."},{"id":"o3","text":"Снижение высоты доминанты с 5 до 3 м: каждый метр сверх 4 — это +15–25% к конструктиву","correct":false,"rationale":"Доминанта ниже 3,5 м не читается — потеря эффекта."}],"anchor":{"g":"stack2","p":{"rows":[["ткань вместо столярки",30],["аренда мебели и AV",20],["плёнка на невидимом",15],["ранняя графика",10],["re-use",25]]},"cap":"рычаги экономии"},"id":"u4-1-t2"},{"mechanic":"single","points":2,"stem":"Клиент просит «добавить ещё 30 м² площади, бюджет тот же». Как объяснить последствия?","options":[{"id":"o0","text":"Отделка на м² упадёт на четверть: показать два варианта — та же площадь с эффектом или больше, но проще","correct":true,"rationale":"Чувствительность: +10% площади ≈ −8% отделки."},{"id":"o1","text":"Согласиться: конструктив — 40% сметы, остальные статьи от площади не растут, так что эффект сохранится","correct":false,"rationale":"Клиент недоволен будет на выставке."},{"id":"o2","text":"Отказать: площадь зафиксирована в ТЗ и заявке площадке, а концепция считалась на 80 м² в категории средний","correct":false,"rationale":"ТЗ меняется — с пересчётом."},{"id":"o3","text":"Добавить площадь за счёт отказа от контрольной сборки и подъёмника: монтаж и логистика — 15–20% сметы","correct":false,"rationale":"Нельзя резать монтаж."}],"anchor":{"g":"compare","p":{"a":["80 м², 42 тыс./м²","средний эксклюзив"],"b":["110 м², 30 тыс./м²","простой эксклюзив"],"verdict":"тот же бюджет — другая категория"},"cap":"площадь против отделки"},"id":"u4-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре структуры сметы эксклюзива 100 м². Какая реалистична и не съест маржу?","vopts":[{"id":"v0","v":{"g":"estv","p":{"rows":[["конструктив",40],["графика",10],["свет",10],["AV",8],["монтаж, логистика",17],["площадка, орг.",8],["проект",7]],"note":"площадка заложена"}},"lbl":"","correct":true,"rationale":"Все статьи на месте, включая скрытые «площадка и организация»."},{"id":"v1","v":{"g":"estv","p":{"rows":[["конструктив",75],["графика",15],["проект",10]],"warn":true,"note":"без монтажа и логистики"}},"lbl":"","correct":false,"rationale":"Нет монтажа, логистики, света, площадки — минус 30% на старте."},{"id":"v2","v":{"g":"estv","p":{"rows":[["AV и LED",60],["конструктив",30],["монтаж",10]],"warn":true,"note":"экран съел стенд"}},"lbl":"","correct":false,"rationale":"Экран на 60% — стенд без конструктива и света."},{"id":"v3","v":{"g":"estv","p":{"rows":[["конструктив",40],["графика",10],["свет",10],["монтаж",10],["проект",30]],"warn":true,"note":"проектирование 30%"}},"lbl":"","correct":false,"rationale":"Проектирование 30% — нереалистично; монтаж 10% занижен."}],"id":"u4-1-t4"}],"framework":"Смета: конструктив 35–45, графика 8–12, свет 8–12, AV 5–20, мебель 5–10, логистика и монтаж 15–20, проектирование 5–8, площадка и организация 8–12, маржа. Цена за м²: стандарт+ 6–12 тыс., эксклюзив простой 25–35, средний 35–55, сложный 55–100+. Рычаги: одна доминанта, ткань, плёнка, аренда, ранняя графика, re-use. Не резать: свет, высоту, касание, сборку, бригаду.","anchor":{"g":"estimate","p":{"rows":[["конструктив",40],["графика",10],["свет",10],["AV",8],["мебель",7],["монтаж",17],["проект",8]],"total":"эксклюзив: 25 / 45 / 80 тыс. ₽ за м²"},"cap":"порядок цены — до сметчика"},"layers":{"simple":"Смета стенда — как чек в ресторане: половина — «кухня» (конструкции), остальное — «официанты и доставка» (монтаж, логистика), «интерьер» (свет, графика), «оборудование» (экраны) и то, о чём забывают — пропуска, подвес, электричество, подъёмник. Забытое всегда появляется и съедает прибыль.\nЦена за квадратный метр — язык разговора с клиентом: стандарт с улучшениями — около 10 тысяч, простой эксклюзив — 25–35, средний — 35–55, сложный с металлом и экранами — от 55. Назвав категорию на эскизе, арт-директор защищает идею от урезания.\nЭкономить можно без потери эффекта: ткань вместо столярки, аренда вместо покупки, плёнка там, где не видно. Нельзя экономить на свете, высоте доминанты, том, что трогают, и на монтажной бригаде.\nПроверь себя: что произойдёт, если в смете нет строки про подвес и электричество?","how":"1. Структура сметы: конструктив 35–45% · графика 8–12 · свет и электрика 8–12 · AV 5–20 · мебель и декор 5–10 · логистика и монтаж 15–20 · проектирование 5–8 · площадка и организация 8–12 · маржа 20–35.\n2. Цена за м² (Москва, 2025–2026): стандарт+ 6–12 тыс.; эксклюзив простой 25–35; средний 35–55; сложный 55–100+. Аренда площади отдельно 10–20 тыс.\n3. Скрытое: подвес, электроподключение, пропуска, уборка, страховка, демонтаж, хранение, ночные, подъёмник, перепечатка. Строка «площадка и организация».\n4. Рычаги: одна доминанта; ткань и лайтбоксы; плёнка на невидимом; аренда мебели и AV; графика рано; re-use; экран меньше и в сценарии. Не резать: свет на главное, высоту доминанты, зоны касания, контрольную сборку, бригаду.\n5. Чувствительность: +10% площади при том же бюджете → −8% отделки на м²; +1 м высоты сверх 4 → +15–25% конструктива; LED 10 м² ≈ 10–15 м² эксклюзива; второй этаж ×1,5–2.\n6. Пример. 80 м², бюджет 2,5 млн → 31 тыс./м² — простой эксклюзив: доминанта 4,5 м столярная с лайтбоксом, стены ЛДСП+плёнка, 24 прожектора, без подвеса и LED; вариант с LED 4 м² — минус переговорная.","formula":{"f":"застройка ≈ S × цена_категории/м²   ·   категория = f(бюджет / S)\nсмета = конструктив + графика + свет + AV + мебель + монтаж/логистика + проект + площадка/орг + маржа","legend":[["S","площадь стенда","80 м²"],["цена/м²","стандарт+ 6–12 · простой 25–35 · средний 35–55 · сложный 55–100+","42 тыс. ₽"],["площадка/орг","подвес, электрика, пропуска, уборка, подъёмник","8–12%"],["маржа","прибыль агентства","20–35%"],["чувствительность","+10% S → −8% отделки; +1 м → +15–25% конструктива",""]],"note":"Бюджет ÷ площадь = категория. Назовите её на эскизе — и концепция не будет порезана после сметы."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Структура сметы: конструктив ~40%, монтаж и логистика 15–20, свет и графика по 10, AV 5–20, проект 5–8, площадка и организация 8–12, маржа.\n— Цена за м²: стандарт+ 6–12 тыс., эксклюзив простой 25–35, средний 35–55, сложный 55–100+; категорию называть на эскизе.\n— Скрытые затраты (подвес, электрика, пропуска, подъёмник, перепечатка) — отдельной строкой, иначе съедят маржу.\n— Рычаги экономии: одна доминанта, ткань, плёнка на невидимом, аренда, ранняя графика, re-use.\n— Не резать: свет на главное, высоту доминанты, зоны касания, контрольную сборку, бригаду.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Что произойдёт, если в смете нет строки про подвес и электричество?","o":["Ничего: подвес и электрика входят в аренду площади у организатора по 10–20 тыс./м²","Появятся по факту и съедят маржу — нужна строка «площадка и организация»","Клиент оплатит их по счетам площадки напрямую как экспонент"],"a":1,"w":"Скрытые затраты — главный убийца маржи."},{"q":"Бюджет 2 млн на 100 м² — какая категория?","o":["Средний эксклюзив: окраска, лайтбоксы, доминанта 5 м, переговорные","Простой эксклюзив: столярка, плёнка, базовый свет, одна доминанта","Сложный: металл, подвес, экран — если найти экономию на монтаже"],"a":1,"w":"20 тыс./м² — простой эксклюзив; сложность режем, эффект оставляем."},{"q":"В формуле «категория = бюджет / S» зачем называть категорию на эскизе?","o":["Чтобы сметчик считал по шаблону категории и уложился в 2–3 дня тендера","Чтобы концепция изначально была в бюджете, а не порезана после сметы","Чтобы клиент видел опыт агентства: цифры на эскизе — признак лидера рынка"],"a":1,"w":"Концепция на 25 и на 55 тыс./м² — разные объекты."},{"q":"Что нельзя резать ради экономии?","o":["Крашеную столярку на больших плоскостях: окраска МДФ — это 1,5–2× к ЛДСП","Свет на экспонат и лица, высоту доминанты, контрольную сборку","Аренду мебели и экранов: LED 10 м² стоит как 10–15 м² эксклюзива"],"a":1,"w":"Эти статьи — сам эффект; остальное — способы его достичь."}],"rules":["Структура сметы: конструктив ~40%, монтаж и логистика 15–20, свет и графика по 10, AV 5–20, проект 5–8, площадка и организация 8–12, маржа.","Цена за м²: стандарт+ 6–12 тыс., эксклюзив простой 25–35, средний 35–55, сложный 55–100+; категорию называть на эскизе.","Скрытые затраты (подвес, электрика, пропуска, подъёмник, перепечатка) — отдельной строкой, иначе съедят маржу.","Рычаги экономии: одна доминанта, ткань, плёнка на невидимом, аренда, ранняя графика, re-use.","Не резать: свет на главное, высоту доминанты, зоны касания, контрольную сборку, бригаду."]}},{"id":"u4-2","level":"L4","title":"Тендер и презентация: защитить решение, а не рендер","lead":"Структура тендера, критерии клиента, презентация «проблема → идея → почему сработает → цифры», возражения, правки","concept":"Тендер на стенд — это 2–3 застройщика, у каждых по 1–3 концепции, у клиента — неделя и четыре критерия: эффект (заметность, соответствие цели), цена (за м² и итого), реализуемость (сроки, риски, опыт агентства) и соответствие бренду. Побеждает не самый красивый рендер, а тот, кто объяснил, почему решение сработает. Структура презентации на 15–20 минут: 1) задача клиента и цифры из брифа (цель, аудитория, место на плане); 2) ключевая идея одной фразой и одним образом; 3) план: траектория посетителя и зоны — пальцем по плану; 4) объём и ключевой ракурс: рендер с высоты глаз, с соседями; 5) почему сработает: заметность (высота, свет, с 40 м), понятность (сообщение, иерархия), бренд (цвет, тон, материалы), фотогеничность (кадр), реализуемость (материалы, сроки, площадка), бюджет (категория, цена за м², что входит); 6) варианты Б и В с ценой эффекта; 7) сроки и следующий шаг. Правила: показывать рендер с людьми и соседями, а не в пустом белом зале; каждую «красоту» сопровождать аргументом «для чего»; называть цифры сам (высота, дистанция читаемости, м², кВт, ₽/м²); признавать риски (подвес, сроки) с планом Б. Возражения: «дорого» — показать структуру и вариант Б; «не хватает нашего продукта» — показать уровень 3 иерархии; «сделайте как у конкурента» — объяснить, чем отстройка выгоднее повтора; «уберите доминанту, слишком смело» — показать, что без неё стенд исчезает с 20 м (сравнительный рендер). Правки после выбора — ограничены ТЗ (две итерации), и арт-директор защищает идею: уступать объёмом (экран меньше, переговорная открытая), не ядром (доминанта, свет, план). Тестовое задание на собеседовании — та же презентация в миниатюре: бриф → идея → план → ракурс → почему сработает → цена.","points":[{"h":"Критерии клиента и структура тендера","t":"Эффект, цена, реализуемость, бренд — четыре оценки, обычно с весами, часто неформальными. Застройщиков 2–3, концепций 1–3 у каждого, неделя на решение. Концепция готовится 5–10 дней: план, объём, 2–3 рендера с ключевого ракурса, смета по категории, сроки. Побеждает объяснённое решение, а не прилагательные."},{"h":"Презентация: семь шагов за 15 минут","t":"Задача и цифры брифа → идея одной фразой и образом → план пальцем (траектория, зоны) → объём и ракурс с высоты глаз → почему сработает по шести критериям (заметность, понятность, бренд, фото, реализуемость, бюджет) → варианты Б/В с ценой эффекта → сроки и следующий шаг. Цифры называть самому: высота, читаемость, м², кВт, ₽/м²."},{"h":"Аргументы вместо прилагательных","t":"Не «эффектная доминанта», а «доминанта 5 м с логотипом 40 см — читается от входа, 45 м». Не «удобная планировка», а «вход по центру, ресепшн сбоку, экспонат обходится с трёх сторон, две переговорные без вида на проход». Не «яркий свет», а «акцент 3:1 на экспонат и лица, 4000 К, лайтбокс 6 м² виден с 40 м». Риски — вслух с планом Б: «подвес — заявка на этой неделе; если откажут — башня 5 м, рендер прилагаю»."},{"h":"Возражения и правки","t":"«Дорого» → структура сметы и вариант Б на −20% за счёт ткани/плёнки, не света. «Мало продукта» → уровень 3: экспонаты и экраны на 5 м, фасад не для продукта. «Как у конкурента» → повтор не выделяет; отстройка — цветом, объёмом, сценарием. «Слишком смело» → сравнительный рендер без доминанты с 20 м. Правки — в рамках ТЗ; уступать объёмом, не ядром: доминанта, план, свет — защищаются; экран, переговорная, материалы — торгуются."}],"practice":{"mechanic":"keymoves","points":3,"stem":"Соберите аргументацию для слайда «Почему это сработает» на тендере.","options":[{"id":"k0","text":"Заметность: доминанта 5 м, логотип 40 см, лайтбокс — читается от входа с 45 м","correct":true,"why":"Цифры дистанции и высоты."},{"id":"k1","text":"Понятность: одно сообщение 7 слов на 3,2 м, буквы 9 см — с 18 м","correct":true,"why":"Иерархия в цифрах."},{"id":"k2","text":"Бренд: фирменный цвет на доминанте и акцентах 25%, нейтральный фон, дерево и ткань как тон","correct":true,"why":"Цвет по долям, материал как тон."},{"id":"k3","text":"Фото: кадр с правого прохода — доминанта, экспонат, люди; свет на лицах 4000 К","correct":true,"why":"Кадр спроектирован."},{"id":"k4","text":"Реализуемость: столярка + ткань, без подвеса, цех 4 недели, монтаж 2 дня; риск — сроки графики","correct":true,"why":"Материалы, сроки, риск с планом Б."},{"id":"k5","text":"Бюджет: средний эксклюзив, 44 тыс./м², 3,5 млн на 80 м²; вариант Б −18% за счёт ткани","correct":true,"why":"Категория, цена, вариант."},{"id":"f6","text":"Дизайн выполнен в современной стилистике с инновационными материалами и эффектной подсветкой","correct":false,"why":"Прилагательные без цифр — не аргумент."},{"id":"f7","text":"Наше агентство — лидер рынка, мы делали стенды для крупнейших компаний отрасли","correct":false,"why":"Про нас, а не про их задачу."},{"id":"f8","text":"Рендер сделан в 4K с фотореалистичным освещением, вы видите стенд в точности","correct":false,"why":"Качество картинки — не аргумент эффекта."},{"id":"f9","text":"Доминанта такая же, как у вашего главного конкурента на прошлой выставке, только выше","correct":false,"why":"Повтор не выделяет."}],"reference":"Шесть критериев с цифрами: заметность, понятность, бренд, фото, реализуемость, бюджет — вместо прилагательных.","anchor":{"g":"funnel3","p":{"steps":[["заметят с 45 м",true],["прочитают с 18 м",true],["узнают бренд",true],["сфотографируют",true]],"note":"аргумент = критерий + цифра"},"cap":"защищать решение, не рендер"},"id":"u4-2-p"},"test":[{"mechanic":"single","points":2,"stem":"Клиент на презентации: «Красиво, но дорого». Первый ход арт-директора?","options":[{"id":"o0","text":"Показать структуру сметы и вариант Б на 15–20% дешевле за счёт ткани и плёнки, свет и высота те же","correct":true,"rationale":"Торгуемся объёмом материалов, не эффектом."},{"id":"o1","text":"Снизить цену на 20%, сократив маржу агентства с 30 до 10%: референс и серия выставок окупят эту скидку","correct":false,"rationale":"Маржа — не предмет торга на презентации."},{"id":"o2","text":"Объяснить, что средний эксклюзив дешевле 35 тыс./м² не бывает, и дать клиенту неделю на решение","correct":false,"rationale":"Клиент уйдёт к следующему застройщику."},{"id":"o3","text":"Убрать доминанту 5 м и половину прожекторов: конструктив и свет — самые дорогие статьи, минус 25%","correct":false,"rationale":"Без них стенд исчезает — эффект потерян."}],"anchor":{"g":"compare","p":{"a":["вариант А","44 тыс./м², окраска"],"b":["вариант Б","36 тыс./м², ткань и плёнка"],"verdict":"высота и свет те же"},"cap":"дорого → структура и вариант Б"},"id":"u4-2-t0"},{"mechanic":"single","points":2,"stem":"Клиент: «Сделайте как у конкурента X с прошлой выставки, только лучше». Что ответить?","options":[{"id":"o0","text":"Разобрать, что у X сработало (высота? свет?), и предложить отстройку: тот же эффект другим объёмом","correct":true,"rationale":"Повтор не выделяет среди соседей; берём принцип, не форму."},{"id":"o1","text":"Сделать копию на метр выше и с LED вместо лайтбокса: клиент знает, чего хочет, а спорить на тендере невыгодно","correct":false,"rationale":"Копия рядом с оригиналом работает на конкурента."},{"id":"o2","text":"Отказаться: копирование чужого стенда — нарушение авторских прав застройщика X и этики агентства","correct":false,"rationale":"Клиент просит эффект, не копию; это переводится в задачу."},{"id":"o3","text":"Предложить переманить дизайнера, который делал стенд X: он повторит эффект быстрее и дешевле концепта","correct":false,"rationale":"Не ответ на задачу клиента."}],"anchor":{"g":"wording","p":{"bad":"как у X, только лучше","good":"у X сработали высота и свет — делаем своё: портал 5 м и лайтбокс, а не их башню"},"cap":"принцип, не форма"},"id":"u4-2-t1"},{"mechanic":"single","points":2,"stem":"После выбора концепции клиент на второй итерации просит убрать доминанту, добавить третью переговорную и сделать стены глухими к проходу. Ваша линия?","options":[{"id":"o0","text":"Переговорную обсуждаем (объём), доминанту и открытый фасад защищаем сравнительным рендером с 20 м (ядро)","correct":true,"rationale":"Уступать объёмом, не ядром."},{"id":"o1","text":"Выполнить всё: клиент выбрал нас, две итерации правок по ТЗ — его право, а эффект стенда — его ответственность","correct":false,"rationale":"Так рождаются стенды, которые не продаются, и агентство винят."},{"id":"o2","text":"Отказать во всём: концепция утверждена протоколом, третья переговорная и глухие стены меняют объём ТЗ","correct":false,"rationale":"Переговорная — нормальная правка."},{"id":"o3","text":"Сделать два рендера на выбор клиента — с его правками и свой: картинка убедит лучше любого аргумента","correct":false,"rationale":"Правки уже вторая итерация; нужно аргументированное решение, не рендер-дуэль."}],"anchor":{"g":"guard","p":{"in":true,"out":true,"tools":true,"note":"ядро: доминанта, план, свет, открытый фасад · объём: экран, переговорная, материалы"},"cap":"ядро защищаем, объёмом торгуем"},"id":"u4-2-t2"},{"mechanic":"single","points":2,"stem":"Тестовое задание на собеседовании: концепция стенда 60 м² за два дня. Что показать в первую очередь?","options":[{"id":"o0","text":"Бриф и допущения, план с траекторией, ключевой ракурс, «почему сработает» по шести критериям, цена за м²","correct":true,"rationale":"Та же тендерная логика в миниатюре."},{"id":"o1","text":"Пять рендеров с разных ракурсов в 4K с людьми и соседями: на собеседовании визуальное впечатление решает всё","correct":false,"rationale":"Пять ракурсов без плана и аргументов — рендер в вакууме."},{"id":"o2","text":"Три разные концепции по два рендера: показать широту стиля и дать комиссии выбрать, как на тендере","correct":false,"rationale":"Три слабых хуже одной защищённой."},{"id":"o3","text":"Рабочую документацию: планы, разрезы, спецификацию с RAL — техничность для арт-директора важнее картинки","correct":false,"rationale":"РД — не задача концепции; покажите реализуемость словами и материалами."}],"anchor":{"g":"pipeline","p":{"steps":["бриф + допущения","план","ракурс 1,6 м","6 критериев","₽/м²"],"hl":[1,3]},"cap":"тестовое = тендер в миниатюре"},"id":"u4-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре слайда «почему это сработает». Какой построен на аргументах, а не прилагательных?","vopts":[{"id":"v0","v":{"g":"treev","p":{"root":"почему сработает","kids":["45 м","9 см с 18 м","кадр","44 тыс./м²"],"ok":true}},"lbl":"","correct":true,"rationale":"Критерий + цифра: дистанция, читаемость, кадр, цена."},{"id":"v1","v":{"g":"treev","p":{"root":"почему сработает","kids":["эффектно","современно","инновационно"],"ok":false}},"lbl":"","correct":false,"rationale":"Прилагательные без цифр."},{"id":"v2","v":{"g":"treev","p":{"root":"о нас","kids":["лидер рынка","20 лет","500 стендов"],"ok":false}},"lbl":"","correct":false,"rationale":"Про агентство, а не про задачу клиента."},{"id":"v3","v":{"g":"treev","p":{"root":"рендер 4K","kids":["ракурс 1","ракурс 2","ракурс 3"],"ok":false}},"lbl":"","correct":false,"rationale":"Качество картинки — не аргумент эффекта."}],"id":"u4-2-t4"}],"framework":"Тендер: 2–3 застройщика, критерии эффект/цена/реализуемость/бренд. Презентация: задача → идея → план пальцем → ракурс с высоты глаз → почему сработает по шести критериям с цифрами → варианты Б/В → сроки. Возражения: дорого → структура и вариант Б; как у конкурента → принцип, не форма; слишком смело → сравнительный рендер. Правки: уступать объёмом, не ядром.","anchor":{"g":"pipeline","p":{"steps":["задача","идея","план","ракурс","6 критериев","вариант Б","сроки"],"hl":[4]},"cap":"защищать решение, а не рендер"},"layers":{"simple":"На тендере клиент смотрит не «красиво ли», а «сработает ли и сколько стоит». Поэтому презентация — это не показ картинок, а рассказ: вот ваша задача, вот идея одной фразой, вот как по стенду пройдёт посетитель (пальцем по плану), вот как это увидят от входа, и вот почему это заметят, поймут, узнают, сфотографируют, построят и оплатят.\nКаждая «красота» должна сопровождаться цифрой: не «эффектная доминанта», а «пять метров, логотип 40 сантиметров, читается от входа с 45 метров». Риски называть самому — с планом Б.\nКогда клиент говорит «дорого» — показать структуру и вариант подешевле за счёт материалов, не света. Когда просит «как у конкурента» — взять принцип, а не форму. Когда после победы просит убрать доминанту — защищать ядро, уступать объёмом.\nПроверь себя: что ответить на «красиво, но дорого»?","how":"1. Критерии клиента: эффект, цена, реализуемость, бренд. Тендер: 2–3 застройщика, 1–3 концепции, неделя. Концепция за 5–10 дней: план, объём, 2–3 рендера с ключевого ракурса, смета по категории, сроки.\n2. Презентация 15–20 минут: задача и цифры брифа → идея фразой и образом → план пальцем → объём и ракурс с высоты глаз с соседями → почему сработает: заметность, понятность, бренд, фото, реализуемость, бюджет (каждый с цифрой) → варианты Б/В с ценой эффекта → сроки и следующий шаг.\n3. Аргументы: высота и дистанция, размер букв и дистанция, доли цвета, кадр, материалы и сроки, категория и ₽/м². Риски вслух с планом Б.\n4. Возражения: дорого → структура сметы + вариант Б (ткань/плёнка, не свет); мало продукта → уровень 3; как у конкурента → принцип, не форма; слишком смело → сравнительный рендер с 20 м без доминанты.\n5. Правки после выбора: в рамках ТЗ (две итерации); ядро (доминанта, план, свет, открытый фасад) защищаем аргументами, объём (экран, переговорная, материалы) торгуем.\n6. Тестовое задание: бриф с допущениями → план → ракурс → шесть критериев → ₽/м² — 6–8 слайдов, не 20 рендеров.","formula":{"f":"презентация = задача → идея → план → ракурс → [заметность · понятность · бренд · фото · реализуемость · бюджет] → вариант Б → сроки\nаргумент = критерий + цифра   ·   правки: ядро защищаем, объёмом торгуем","legend":[["ядро","доминанта, план, свет, открытый фасад","не торгуется"],["объём","экран, переговорная, материалы отделки","торгуется вариантами"],["вариант Б","−15–20% за счёт ткани и плёнки","высота и свет те же"],["цифры","45 м · 9 см с 18 м · 25% цвета · 44 тыс./м²","вместо прилагательных"],["план Б","ответ на названный риск","подвес → башня 5 м"]],"note":"Побеждает не самый красивый рендер, а тот, кто объяснил, почему решение сработает, и назвал цифры сам."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Критерии тендера: эффект, цена, реализуемость, бренд; побеждает объяснённое решение.\n— Презентация: задача → идея → план пальцем → ракурс с высоты глаз → шесть критериев с цифрами → вариант Б → сроки.\n— Аргумент = критерий + цифра; риски вслух с планом Б; цифры называет арт-директор.\n— Возражения: дорого → структура и вариант Б; как у конкурента → принцип, не форма; смело → сравнительный рендер.\n— Правки: ядро (доминанта, план, свет, фасад) защищаем, объёмом (экран, переговорная, материалы) торгуем.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Что ответить на «красиво, но дорого»?","o":["Снизить маржу агентства с 30 до 10%: референс и серия выставок клиента окупят тендерную скидку","Показать структуру сметы и вариант Б дешевле за счёт материалов при той же высоте и свете","Объяснить, что средний эксклюзив дешевле 35 тыс./м² не бывает, и дать неделю подумать"],"a":1,"w":"Торгуем объёмом материалов, не эффектом и не маржой."},{"q":"«Сделайте как у конкурента» — что делать?","o":["Скопировать на метр выше и с LED-экраном вместо лайтбокса: клиент знает, чего хочет","Разобрать, что у конкурента сработало, и предложить отстройку тем же принципом","Отказаться: копия чужого стенда — нарушение этики и авторских прав застройщика"],"a":1,"w":"Копия рядом с оригиналом работает на конкурента."},{"q":"В формуле презентации что такое «аргумент = критерий + цифра»?","o":["Каждый слайд должен содержать таблицу с расчётами сметы","Не «эффектно», а «5 м, логотип 40 см — читается с 45 м»","Презентация должна быть короче, чем у конкурентов, на пять слайдов"],"a":1,"w":"Цифры называет арт-директор, иначе их назовёт клиент."},{"q":"После победы клиент просит убрать доминанту и добавить переговорную.","o":["Сделать всё: две итерации правок по ТЗ — право клиента, эффект — его ответственность","Переговорную обсудить, доминанту защитить сравнительным рендером с 20 м","Отказать во всём: концепция утверждена протоколом, правки меняют объём ТЗ"],"a":1,"w":"Ядро защищаем, объёмом торгуем."}],"rules":["Критерии тендера: эффект, цена, реализуемость, бренд; побеждает объяснённое решение.","Презентация: задача → идея → план пальцем → ракурс с высоты глаз → шесть критериев с цифрами → вариант Б → сроки.","Аргумент = критерий + цифра; риски вслух с планом Б; цифры называет арт-директор.","Возражения: дорого → структура и вариант Б; как у конкурента → принцип, не форма; смело → сравнительный рендер.","Правки: ядро (доминанта, план, свет, фасад) защищаем, объёмом (экран, переговорная, материалы) торгуем."]}},{"id":"u5-1","level":"L5","title":"Руководить дизайнерами: ревью, стандарты, визуальный стиль компании","lead":"Чек-лист ревью концепции, библиотека решений, стандарты файлов и презентаций, обратная связь и рост","concept":"Арт-директор отвечает за качество всех концепций агентства, а не только своих. Инструмент — ревью по чек-листу, одинаковому для всех: 1) бриф закрыт (цель, зоны, бюджет, план павильона учтены); 2) план: траектория пальцем, зоны по нормам, подсобка скрыта, фасад открыт; 3) объём: одна доминанта, верхняя треть, ключевой ракурс, регламент; 4) сообщение: кто/что/зачем за три секунды, иерархия и читаемость в цифрах; 5) свет: три слоя, температура, посчитан; 6) материалы и реализуемость: сроки краски, модули, подвес, сертификаты; 7) бюджет: категория и цена за м² совпадают с ТЗ; 8) фото: ключевой кадр есть; 9) презентация: аргументы с цифрами. Ревью проходит на плане и разрезе, а не на рендере — рендер делают после одобрения объёма (экономит дни визуализатора). Стандарты компании: библиотека типовых узлов и материалов с ценами (ресепшн, переговорная, лайтбокс, подиум), шаблон презентации с обязательными слайдами, нейминг файлов и версий, пресеты рендера (ракурс 1,6 м, люди, соседи), чек-лист РД, список «не менять». Визуальный стиль компании — не одинаковые стенды, а узнаваемый подход: дисциплина силуэта, свет как форма, сообщение продаёт, честные материалы; стиль фиксируется в портфолио-гайде с примерами «так/не так». Команда: концепт-дизайнер (план, объём), визуализатор (рендер), графический дизайнер (фасады, печать), конструктор (РД); арт-директор распределяет задачи по вехам, даёт обратную связь по чек-листу (что не так → почему → как исправить, с примером), развивает дизайнеров через разбор чужих стендов и ротацию ролей, сам включается в ключевые проекты (тендеры с крупными клиентами, новые типы задач). Признаки проблем: ревью «на вкус» без чек-листа, рендеры до плана, три равные концепции без рекомендации, стиль агентства = повтор одной удачной формы.","points":[{"h":"Чек-лист ревью концепции","t":"Бриф закрыт → план (траектория, нормы, подсобка, фасад) → объём (доминанта, треть, ракурс, регламент) → сообщение (три секунды, читаемость в см) → свет (три слоя, К, кВт) → материалы и реализуемость (сроки, модули, подвес, сертификаты) → бюджет (категория, ₽/м² = ТЗ) → фото-кадр → аргументы с цифрами. Ревью на плане и разрезе до рендера. Девять пунктов — девять вопросов, на которые дизайнер отвечает сам до встречи."},{"h":"Стандарты и библиотека","t":"Библиотека узлов с ценами и сроками (ресепшн из МДФ — 7 дней, столько-то ₽; лайтбокс 3×2 — …); шаблон презентации с обязательными слайдами (план, ракурс, шесть критериев, цена); нейминг файлов (клиент_выставка_версия_дата); пресеты рендера (1,6 м, 15–25 м, люди, соседи, выключенный свет павильона); чек-лист РД; список «не менять без арт-директора». Стандарт экономит дни и защищает качество, когда арт-директора нет рядом."},{"h":"Визуальный стиль компании","t":"Стиль — не форма, а дисциплина: одна доминанта, свет как форма, сообщение продаёт, честные материалы, спроектированный кадр. Фиксируется в портфолио-гайде: 10 примеров «так» с объяснением и 5 «не так». Обновляется раз в год с трендами (ткань, экраны, зелень) — но тренд входит в стиль через принцип, не через копирование. Узнаваемость агентства — в качестве решений, не в повторе одной башни."},{"h":"Команда, обратная связь, рост","t":"Роли: концепт-дизайнер, визуализатор, графический дизайнер, конструктор; арт-директор распределяет по вехам (концепция 5–10 дней: план и объём 2 дня, рендер 2, графика 2, смета и презентация 2). Обратная связь по формуле «что не так → почему (критерий чек-листа) → как исправить (пример)»; хвалить за решения, не за красоту. Рост: разбор чужих стендов после каждой выставки, ротация (визуализатор делает план), участие в презентации клиенту. Арт-директор сам ведёт ключевые проекты и тендеры."}],"practice":{"mechanic":"sjt_bw","points":3,"stem":"Дизайнер принёс три концепции на 100 м² в виде рендеров «с вертолёта», без планов, за день до презентации клиенту. Лучшее и худшее действие арт-директора?","options":[{"id":"s0","text":"Выбрать одну, за полдня сделать план и ракурс с высоты глаз, презентовать её с аргументами; разбор — после","correct":true,"rationale":"Клиент получает защищаемое решение; урок — после презентации."},{"id":"s1","text":"Показать клиенту все три как есть: пусть выбирает сам, план и разрезы сделаем после выбора — клиент вовлечён, а мы не угадываем","correct":false,"rationale":"Три слабых без плана и рекомендации — потеря тендера."},{"id":"s2","text":"Отменить презентацию и перенести на неделю, чтобы пройти чек-лист полностью: честный перенос лучше сырой подачи","correct":false,"rationale":"Перенос за день — потеря доверия клиента; задача решаема за полдня."},{"id":"s3","text":"Сделать за ночь свою концепцию с нуля и показать её вместо работы дизайнера: тендер важнее педагогики","correct":false,"rationale":"Дизайнер ничему не научится, арт-директор — узкое горло."}],"worst":"s1","worstRationale":"Три рендера без плана на тендере — не выбор для клиента, а демонстрация отсутствия метода.","anchor":{"g":"pipeline","p":{"steps":["план + объём","ракурс 1,6 м","критерии","рендер","презентация"],"hl":[0,1,2]},"cap":"ревью на плане, рендер — после"},"id":"u5-1-p"},"test":[{"mechanic":"single","points":2,"stem":"Как должно проходить ревью концепции, чтобы экономить время визуализатора?","options":[{"id":"o0","text":"На плане и разрезе до рендера: доминанта, траектория, ракурс, бюджет — рендер после одобрения объёма","correct":true,"rationale":"Рендер переделывать дорого, план — дёшево."},{"id":"o1","text":"На финальных рендерах: только по ним видно свет, материалы и соседей, а план визуализатор подгонит под картинку за час","correct":false,"rationale":"Переделка рендера — дни; плана — час."},{"id":"o2","text":"Без ревью: за опытным дизайнером не проверяют, арт-директор смотрит только тендеры от 200 м² и новых клиентов","correct":false,"rationale":"Качество всех концепций — ответственность арт-директора."},{"id":"o3","text":"На презентации клиенту: его реакция — лучшее ревью, а внутренние замечания до неё только сбивают дизайнера","correct":false,"rationale":"Клиент не должен видеть незрелое."}],"anchor":{"g":"compare","p":{"a":["ревью на рендере","переделка — дни"],"b":["ревью на плане","переделка — час"],"verdict":"объём → ревью → рендер"},"cap":"ревью до рендера"},"id":"u5-1-t0"},{"mechanic":"single","points":2,"stem":"Что такое «визуальный стиль компании» для застройщика стендов?","options":[{"id":"o0","text":"Дисциплина решений: одна доминанта, свет как форма, продающее сообщение, честные материалы, кадр","correct":true,"rationale":"Стиль — принципы, зафиксированные в гайде с примерами."},{"id":"o1","text":"Фирменная форма доминанты и палитра, повторяемые на всех стендах агентства: автора узнают с 30 м, как архитектора по зданию","correct":false,"rationale":"Повтор формы — узнаваемость агентства за счёт брендов клиентов."},{"id":"o2","text":"Единый шаблон рендера и презентации: ракурс 1,6 м, люди, соседи, те же слайды — заказчик привыкает к подаче и доверяет","correct":false,"rationale":"Шаблон — стандарт, не стиль."},{"id":"o3","text":"Набор материалов и узлов, закреплённый договорами с поставщиками: одинаковая отделка на всех стендах и есть стиль","correct":false,"rationale":"Поставщики — экономика, не стиль."}],"anchor":{"g":"tree","p":{"root":"стиль компании","kids":["одна доминанта","свет как форма","сообщение продаёт","честные материалы","кадр"]},"cap":"стиль — дисциплина, не форма"},"id":"u5-1-t1"},{"mechanic":"single","points":2,"stem":"Дизайнер второй раз подряд кладёт логотип на 2 м и делает глухой фасад. Какая обратная связь работает?","options":[{"id":"o0","text":"Что не так (лого на 2 м, фасад глухой) → почему (с 20 м не видно, регламент) → как (верхняя треть, открыть 60%) с примером","correct":true,"rationale":"Формула «что → почему → как» с примером."},{"id":"o1","text":"«Снова лого низко и фасад глухой — переделай по чек-листу»: пункты 2 и 4 он знает, повторять критерии взрослому дизайнеру — трата времени","correct":false,"rationale":"Без «почему» повторится в третий раз."},{"id":"o2","text":"Переделать план самому за час и показать как образец: наглядный эталон запоминается лучше любого объяснения, а сроки не страдают","correct":false,"rationale":"Арт-директор становится узким горлом."},{"id":"o3","text":"Перевести дизайнера на графику и печать: два одинаковых промаха на планировке — диагноз, а не случайность, его сила в другом","correct":false,"rationale":"Два случая — не диагноз; сначала обратная связь."}],"anchor":{"g":"wording","p":{"bad":"снова не то, переделай","good":"лого на 2 м закрыт толпой — с 20 м не виден; подними в верхнюю треть, как на стенде Y"},"cap":"что → почему → как"},"id":"u5-1-t2"},{"mechanic":"single","points":2,"stem":"Какая из ситуаций — признак проблемы в дизайн-направлении агентства?","options":[{"id":"o0","text":"Три равные концепции на тендер без рекомендации арт-директора","correct":true,"rationale":"Отсутствие позиции — отсутствие метода."},{"id":"o1","text":"Библиотека узлов с ценами, которую обновляют после каждого проекта по фактической смете","correct":false,"rationale":"Это стандарт."},{"id":"o2","text":"Разбор чужих стендов командой после каждой выставки с фото и заметками","correct":false,"rationale":"Это рост."},{"id":"o3","text":"Арт-директор лично ведёт тендер с крупным клиентом вместо делегирования","correct":false,"rationale":"Так и должно быть."}],"anchor":{"g":"compare","p":{"a":["3 равные концепции","«выбирайте сами»"],"b":["1 рекомендованная + 2 варианта цены","«мы считаем так, потому что»"],"verdict":"позиция — метод"},"cap":"рекомендация обязательна"},"id":"u5-1-t3"},{"mechanic":"visual","points":3,"stem":"Четыре распределения 10 рабочих дней на концепцию для тендера. Какое правильно ставит рендер после объёма?","vopts":[{"id":"v0","v":{"g":"pipe","p":{"steps":["план 2 дн","объём 2","ревью","рендер 2","графика","смета"],"hl":[0,1,2]}},"lbl":"","correct":true,"rationale":"План и объём, ревью, потом рендер и графика."},{"id":"v1","v":{"g":"pipe","p":{"steps":["рендер 6 дн","план 1","смета 1"],"hl":[0]}},"lbl":"","correct":false,"rationale":"Рендер до плана — шесть дней в корзину при первом ревью."},{"id":"v2","v":{"g":"pipe","p":{"steps":["3 концепции","3 рендера","презентация"],"hl":[1]}},"lbl":"","correct":false,"rationale":"Три равные без плана и рекомендации."},{"id":"v3","v":{"g":"pipe","p":{"steps":["план","рендер","смета","ревью в день сдачи"],"hl":[3]}},"lbl":"","correct":false,"rationale":"Ревью в день сдачи — поздно менять."}],"id":"u5-1-t4"}],"framework":"Ревью по чек-листу из девяти пунктов на плане и разрезе до рендера. Стандарты: библиотека узлов с ценами, шаблон презентации, нейминг, пресеты рендера, чек-лист РД, список «не менять». Стиль компании — дисциплина решений в гайде «так/не так», не повтор формы. Обратная связь: что → почему → как с примером. Рост: разбор стендов, ротация. Арт-директор ведёт ключевые проекты сам.","anchor":{"g":"tree","p":{"root":"арт-директор","kids":["ревью по чек-листу","стандарты","стиль компании","обратная связь","ключевые проекты"]},"cap":"качество всех концепций — одна ответственность"},"layers":{"simple":"Руководить дизайнерами — значит, чтобы каждая концепция агентства была не хуже твоей, когда тебя нет рядом. Для этого нужен чек-лист: девять вопросов, на которые дизайнер отвечает сам до встречи — бриф, план, объём, сообщение, свет, материалы, бюджет, кадр, аргументы.\nРевью делают на плане и разрезе, до рендера: переделать план — час, рендер — дни. Три одинаковые концепции «выбирайте сами» — не выбор, а отсутствие позиции.\nСтиль компании — не одинаковые башни, а дисциплина: одна доминанта, свет как форма, сообщение продаёт. Он живёт в гайде с примерами «так» и «не так». А обратная связь дизайнеру — по формуле: что не так, почему (по чек-листу), как исправить, с примером.\nПроверь себя: почему ревью нужно делать до рендера?","how":"1. Чек-лист ревью (9): бриф закрыт; план; объём; сообщение; свет; материалы и реализуемость; бюджет = ТЗ; кадр; аргументы с цифрами. Дизайнер проходит его сам до встречи.\n2. Ревью на плане и разрезе → одобрение объёма → рендер и графика. Концепция 5–10 дней: план и объём 2, ревью, рендер 2, графика 2, смета и презентация 2.\n3. Стандарты: библиотека узлов и материалов с ценами и сроками; шаблон презентации; нейминг (клиент_выставка_версия_дата); пресеты рендера (1,6 м, 15–25 м, люди, соседи); чек-лист РД; список «не менять».\n4. Стиль компании: принципы в портфолио-гайде (10 «так», 5 «не так»), обновление раз в год, тренды через принцип. Одна рекомендованная концепция + варианты цены вместо трёх равных.\n5. Команда: концепт-дизайнер, визуализатор, графический дизайнер, конструктор. Обратная связь «что → почему → как» с примером; хвалить решения. Рост: разбор стендов после выставок, ротация ролей, участие в презентациях. Арт-директор сам ведёт ключевые тендеры.\n6. Пример. Тендер 100 м²: день 1–2 план и объём двух вариантов → ревью на плане (один вариант в работу, второй — как вариант цены) → день 3–4 рендер с ключевого ракурса → день 5–6 графика и свет → день 7 смета по категории → день 8 презентация по шаблону → день 9 прогон с арт-директором → день 10 клиент.","formula":{"f":"ревью = чек-лист(9) на плане и разрезе → одобрение объёма → рендер\nобратная связь = что не так → почему (критерий) → как исправить (пример)","legend":[["чек-лист","бриф · план · объём · сообщение · свет · материалы · бюджет · кадр · аргументы","9 вопросов до встречи"],["стандарт","библиотека, шаблон, нейминг, пресеты, список «не менять»","работает без арт-директора"],["стиль","дисциплина решений в гайде «так/не так»","не повтор формы"],["позиция","одна рекомендованная концепция + варианты цены","вместо трёх равных"],["рост","разбор стендов, ротация, презентации","после каждой выставки"]],"note":"Качество всех концепций агентства — ответственность арт-директора; чек-лист и стандарты делают её исполнимой."},"pitfalls":"Правила юнита — то, что должно звучать в ответе на собеседовании без подготовки:\n— Ревью по чек-листу из девяти пунктов на плане и разрезе — до рендера.\n— Стандарты (библиотека с ценами, шаблон, нейминг, пресеты, список «не менять») работают без арт-директора.\n— Стиль компании — дисциплина решений в гайде «так/не так», не повтор формы.\n— Одна рекомендованная концепция + варианты цены; три равные — отсутствие позиции.\n— Обратная связь: что → почему → как с примером; рост через разбор стендов и ротацию.\n\nПроверь себя: назови вслух, какой из этих пунктов чаще всего нарушают команды, и чем это заканчивается на выставке.","checks":[{"q":"Почему ревью нужно делать до рендера?","o":["Чтобы визуализатор не видел замечаний арт-директора и не обижался","Переделать план — час, рендер — дни; объём одобряют до картинки","Так требует шаблон презентации агентства"],"a":1,"w":"Ревью на плане и разрезе экономит дни."},{"q":"Три равные концепции без рекомендации на тендере — это…","o":["Нормально: клиент платит и любит выбирать сам, а три варианта показывают, что агентство не ленилось","Отсутствие позиции: нужна одна рекомендованная + варианты цены","Признак богатого агентства, которое может позволить себе три рендера"],"a":1,"w":"Позиция — часть продукта."},{"q":"В формуле обратной связи зачем «почему»?","o":["Чтобы дизайнер понял критерий и не повторил ошибку в третий раз","Чтобы разговор выглядел внимательным и дизайнер не принял замечание за придирку","Чтобы зафиксировать причину ошибки в протоколе ревью на случай спора с клиентом"],"a":0,"w":"Без критерия замечание — вкус; с критерием — обучение."},{"q":"Стиль компании — это…","o":["Фирменная башня и палитра на всех стендах, по которым узнают агентство","Дисциплина решений: доминанта, свет, сообщение, материалы, кадр","Шаблон рендера и презентации, одинаковый для всех проектов"],"a":1,"w":"Узнаваемость — в качестве решений, не в повторе формы."}],"rules":["Ревью по чек-листу из девяти пунктов на плане и разрезе — до рендера.","Стандарты (библиотека с ценами, шаблон, нейминг, пресеты, список «не менять») работают без арт-директора.","Стиль компании — дисциплина решений в гайде «так/не так», не повтор формы.","Одна рекомендованная концепция + варианты цены; три равные — отсутствие позиции.","Обратная связь: что → почему → как с примером; рост через разбор стендов и ротацию."]}},{"id":"u5-2","level":"L5","title":"От концепции до монтажа: проектный менеджер, производство, авторский надзор","lead":"Роли и передачи, точки контроля идеи, приёмка, фотосъёмка, постмортем","concept":"После утверждения концепции проект переходит проектному менеджеру (PM), конструктору и цеху — и здесь арт-директор должен остаться «хранителем идеи» без того, чтобы делать чужую работу. Роли: PM — сроки, бюджет, площадка, клиент, субподрядчики; конструктор — РД и расчёты; технолог цеха — изготовление; шеф монтажа — площадка; графический дизайнер — макеты в печать; арт-директор — соответствие результата концепции. Передача концепции в РД — через паспорт концепции: план, разрезы с высотами, ключевой ракурс, материалы и цвета по RAL/декорам, свет (слои, К, прожекторы), список «не менять без арт-директора», приоритеты при сокращении (что резать первым, что последним). Точки контроля идеи по графику: 1) ревью РД (планы, развёртки, спецификация — соответствие паспорту); 2) утверждение образцов (краска по RAL, декор, ткань, печать цветопробой) — до запуска; 3) контрольная сборка в цеху (доминанта, ресепшн, стыки, свет); 4) первый день монтажа (каркас, доминанта, подвес); 5) приёмка (чек-лист, свет включён, графика, чистота) и фотосъёмка с ключевого ракурса в первый день выставки с людьми. Замены материалов и упрощения узлов — через арт-директора с вариантом, равным по эффекту (не «что есть на складе»). Постмортем после выставки: что сработало по шести критериям (по фото, обратной связи клиента, числу контактов), что потерялось между рендером и стендом и почему, что добавить в библиотеку и чек-лист. Отношения с PM — партнёрские: PM отвечает за «вовремя и в бюджет», арт-директор — за «то, что продали»; конфликты решаются приоритетами из паспорта, а не на монтаже.","points":[{"h":"Роли и паспорт концепции","t":"PM — сроки, бюджет, площадка, клиент; конструктор — РД и расчёты; технолог — цех; шеф монтажа — площадка; графический дизайнер — печать; арт-директор — соответствие идее. Паспорт концепции: план, разрезы с высотами, ключевой ракурс, материалы и цвета (RAL, декоры), свет, список «не менять», приоритеты при сокращении. Паспорт — документ передачи; без него РД рисуют «по рендеру», то есть по догадкам."},{"h":"Пять точек контроля","t":"Ревью РД → утверждение образцов (краска, декор, ткань, цветопроба печати) → контрольная сборка → первый день монтажа → приёмка и фотосъёмка. Каждая точка в графике PM с датой и присутствием арт-директора. Пропуск любой — потеря идеи в этом месте: РД без ревью — не те пропорции; без образцов — не тот цвет; без сборки — стыки; без первого дня — кривой каркас; без приёмки — тёмный стенд на фото."},{"h":"Замены, конфликты, приоритеты","t":"Замена материала — через арт-директора с вариантом, равным по эффекту на дистанции восприятия; «из наличия» — только по списку допустимых. Сокращения — по приоритетам из паспорта: сначала экран, мебель, второй акцент; последними — доминанта, свет на главное, зоны касания. Конфликт PM/арт-директор — решается паспортом, а не на монтаже; арт-директор не командует бригадой — через шефа монтажа."},{"h":"Приёмка, фото, постмортем","t":"Приёмка по чек-листу: свет включён и направлен, графика без пузырей и стыков, цвет по образцу, чистота, кабели скрыты, подсобка закрыта. Фотосъёмка — с ключевого ракурса, при полном свете, с людьми, в первый день, профессионалом (или телефон с правильной точкой): это портфолио и отчёт. Постмортем в течение недели: шесть критериев, что потерялось и почему, что в библиотеку и чек-лист, что сказать клиенту о следующей выставке."}],"practice":{"mechanic":"matching","points":3,"stem":"Соедините точку контроля с тем, что теряется, если её пропустить.","pairs":[{"l":"Ревью рабочей документации","r":"Пропорции и высоты: конструктор нарисовал «по рендеру», доминанта стала ниже"},{"l":"Утверждение образцов","r":"Цвет и фактура: краска «похожая», ткань другой плотности, печать темнее"},{"l":"Контрольная сборка в цеху","r":"Стыки, графика, свет узлов — исправлять на монтаже уже нельзя"},{"l":"Первый день монтажа","r":"Каркас и подвес: ошибка основания тянет за собой всё остальное"},{"l":"Приёмка и фотосъёмка","r":"Тёмный или грязный стенд на фото — нет кейса и нет отчёта клиенту"}],"solution":"Каждая точка контроля закрывает свой класс потерь; пропуск одной — потеря идеи именно там.","anchor":{"g":"timeline","p":{"items":["ревью РД","образцы","контрольная сборка","монтаж день 1","приёмка + фото"],"hl":2},"cap":"пять точек, где идея либо выживает, либо нет"},"id":"u5-2-p"},"test":[{"mechanic":"single","points":2,"stem":"PM просит арт-директора «не ездить в цех — у нас нет времени, конструктор всё проверил». Ответ?","options":[{"id":"o0","text":"Контрольная сборка — точка в графике: два часа на доминанту и стыки дешевле переделки на монтаже","correct":true,"rationale":"Два часа в цеху дешевле ночи на монтаже."},{"id":"o1","text":"Согласиться: конструктор отвечает за РД, цех — за изготовление, арт-директор — за концепцию; разделение зон и есть процесс","correct":false,"rationale":"Концепция без контроля в цеху не доедет."},{"id":"o2","text":"Потребовать перенести монтаж на три дня, чтобы успеть на полную сборку всего стенда в цеху со светом и графикой","correct":false,"rationale":"Полная сборка не нужна; ключевые узлы — два часа."},{"id":"o3","text":"Отправить вместо себя визуализатора с рендером для сравнения: его глаз точнее, а время арт-директора дороже","correct":false,"rationale":"Решения о замене принимает арт-директор."}],"anchor":{"g":"compare","p":{"a":["без сборки","переделка на монтаже: ночь, брак"],"b":["сборка 2 часа","доминанта, стыки, свет проверены"],"verdict":"точка в графике PM"},"cap":"два часа в цеху против ночи на монтаже"},"id":"u5-2-t0"},{"mechanic":"single","points":2,"stem":"Что должно быть в паспорте концепции при передаче в РД?","options":[{"id":"o0","text":"План, разрезы с высотами, ракурс, RAL и декоры, свет, список «не менять», приоритеты сокращения","correct":true,"rationale":"Документ передачи вместо догадок по рендеру."},{"id":"o1","text":"Финальные рендеры в высоком разрешении с нескольких ракурсов: конструктор снимет размеры и пропорции точнее, чем по эскизному плану","correct":false,"rationale":"По рендеру размеры снимают с ошибкой."},{"id":"o2","text":"Смета и договор с клиентом: именно они фиксируют обязательства, а высоты и цвета конструктор уточнит у дизайнера по ходу","correct":false,"rationale":"Уточнения «потом» — потеря пропорций."},{"id":"o3","text":"Презентация, показанная клиенту, с его комментариями по слайдам — утверждённый документ, других согласований не нужно","correct":false,"rationale":"Презентация — для клиента, не для цеха."}],"anchor":{"g":"pipeline","p":{"steps":["план","разрезы","ракурс","RAL/декоры","свет","«не менять»","приоритеты"],"hl":[5,6]},"cap":"паспорт концепции — документ передачи"},"id":"u5-2-t1"},{"mechanic":"single","points":2,"stem":"На монтаже бригада ставит доминанту на 30 см ниже проекта «иначе не влезает в подъёмник». Как действовать?","options":[{"id":"o0","text":"Через шефа монтажа: выяснить причину, найти решение (другой подъёмник, сборка на полу) — высота в списке «не менять»","correct":true,"rationale":"Арт-директор не командует бригадой напрямую, но защищает ядро."},{"id":"o1","text":"Согласиться: 30 см с 40 м глазом не отличить, а каждый час простоя бригады стоит дороже теоретической верхней трети","correct":false,"rationale":"Логотип уйдёт из верхней трети; и прецедент."},{"id":"o2","text":"Остановить монтаж и позвонить клиенту: изменение высоты меняет утверждённый вид, принимать такое решение без него нельзя","correct":false,"rationale":"Клиент не должен решать технику монтажа."},{"id":"o3","text":"Самому забраться на подъёмник и показать бригаде, как ставить: на площадке убеждает личный пример, а не бумага","correct":false,"rationale":"Безопасность и субординация."}],"anchor":{"g":"guard","p":{"in":true,"out":true,"tools":true,"note":"ядро: высота доминанты · путь: шеф монтажа → решение"},"cap":"защищать ядро через процесс"},"id":"u5-2-t2"},{"mechanic":"single","points":2,"stem":"Выставка закончилась, стенд принят, клиент доволен. Что делает арт-директор на следующей неделе?","options":[{"id":"o0","text":"Постмортем: шесть критериев по фото и отзывам, что потерялось и почему, что в библиотеку и чек-лист","correct":true,"rationale":"Без разбора следующий стенд повторит потери."},{"id":"o1","text":"Ничего по этому проекту: он закрыт актом, клиент доволен, а разбор без претензий — трата времени, когда горит следующий тендер","correct":false,"rationale":"Опыт не фиксируется — ошибки повторятся."},{"id":"o2","text":"Отправляет клиенту рендер концепции в раме на память и предлагает скидку 10% на следующий стенд, пока впечатление свежо","correct":false,"rationale":"Коммерция — задача PM; разбор — арт-директора."},{"id":"o3","text":"Публикует все рендеры концепции в портфолио: они чище фото с толпой и лучше показывают замысел автора","correct":false,"rationale":"Портфолио — реализованные проекты, фото."}],"anchor":{"g":"funnel3","p":{"steps":[["заметили",true],["поняли",true],["бренд",true],["фото",true]],"note":"постмортем: что из шести критериев сработало и что потерялось"},"cap":"разбор — часть проекта"},"id":"u5-2-t3"},{"mechanic":"visual","points":3,"stem":"Четыре графика проекта после утверждения концепции. В каком расставлены все точки контроля арт-директора?","vopts":[{"id":"v0","v":{"g":"pipe","p":{"steps":["ревью РД","образцы","цех","сборка","монтаж д1","приёмка+фото"],"hl":[0,1,3,4,5]}},"lbl":"","correct":true,"rationale":"Пять точек: РД, образцы, сборка, первый день, приёмка с фото."},{"id":"v1","v":{"g":"pipe
